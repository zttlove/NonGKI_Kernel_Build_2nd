name: Build msm_drm.ko for Xiaomi SM8350
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # 安装编译依赖
      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            build-essential bc bison flex libelf-dev \
            gcc-aarch64-linux-gnu libssl-dev dwarves git

      # 克隆你指定的内核源码
      - name: Clone kernel source
        run: |
          git clone --depth=1 \
            --branch hyper-14 \
            https://github.com/zttlove/android_kernel_xiaomi_sm8350-miui.git \
            kernel

      # 设置编译环境
      - name: Set build env
        run: |
          echo "ARCH=arm64" >> $GITHUB_ENV
          echo "CROSS_COMPILE=aarch64-linux-gnu-" >> $GITHUB_ENV

      # 编译内核 + msm_drm 模块
      - name: Build msm_drm.ko
        run: |
          cd kernel
          
          # 小米 SM8350 正确配置
          make vendor/star_defconfig
          
          # 全编译解决依赖
          make -j$(nproc)
          
          # 单独编译 DRM 模块
          make -j$(nproc) M=drivers/gpu/drm/msm modules

      # 上传成品
      - name: Upload module
        uses: actions/upload-artifact@v4
        with:
          name: msm_drm_sm8350
          path: kernel/drivers/gpu/drm/msm/msm_drm.ko
          if-no-files-found: error
