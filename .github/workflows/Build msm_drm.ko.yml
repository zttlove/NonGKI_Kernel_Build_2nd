name: 编译 SM8350 5.4 内核 boot.img + KernelSU rsuntk
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: 安装依赖
        run: |
          sudo apt update
          sudo apt install -y build-essential bc bison flex libelf-dev libssl-dev dwarves git lz4 zip

      - name: 下载 Clang
        run: |
          mkdir -p clang
          wget -q -O clang.tar.gz https://github.com/ZyCromerZ/Clang/releases/download/20.0.0git-20241222-release/Clang-20.0.0git-20241222.tar.gz
          tar -xf clang.tar.gz -C clang/

      - name: 下载 GCC 64-bit
        run: |
          git clone --depth=1 -b android12L-release https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9 gcc64

      - name: 下载 GCC 32-bit
        run: |
          git clone --depth=1 -b android12L-release https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/arm/arm-linux-androideabi-4.9 gcc32

      - name: 克隆内核源码
        run: |
          git clone --depth=1 -b hyper-14 https://github.com/zttlove/android_kernel_xiaomi_sm8350-miui.git kernel

      - name: 集成 KernelSU rsuntk
        run: |
          cd kernel
          rm -rf KernelSU drivers/kernelsu
          curl -LSs "https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh" | bash -s rsuntk

      - name: 启用 KernelSU
        run: |
          cd kernel
          echo "CONFIG_KERNELSU=y" >> arch/arm64/configs/vendor/star_defconfig

      # ==========================
      # 🔥 无错误 极简修复
      # ==========================
      - name: 修复 KernelSU 5.4 兼容
        run: |
          cd kernel
          sed -i 's/#include <linux\/pgtable.h>/#include <asm\/pgtable.h>/' drivers/kernelsu/feature/sucompat.c
          sed -i 's/strncpy_from_user_nofault/strncpy_from_user/' drivers/kernelsu/feature/sucompat.c
          sed -i 's/copy_to_kernel_nofault/memcpy/' drivers/kernelsu/hook/arm64/patch_memory.c

      - name: 修复内核其他错误
        run: |
          cd kernel
          sed -i '39 s/^/#/' scripts/Kconfig.include
          sed -i 's/static int __handle_speculative_fault/static int __handle_speculative_fault_fix/' mm/memory.c
          sed -i 's#<../../android/binder_internal.h>#"../../android/binder_internal.h"#' drivers/staging/mi-log/mi_log.c
          sed -i 's#<../../android/binder_internal.h>#"../../android/binder_internal.h"#' drivers/staging/binder_prio/binder_prio.c

      - name: 编译内核
        run: |
          export PATH="$GITHUB_WORKSPACE/clang/bin:$GITHUB_WORKSPACE/gcc64/bin:$GITHUB_WORKSPACE/gcc32/bin:$PATH"
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-android-
          export CROSS_COMPILE_ARM32=arm-linux-androideabi-
          export CC=clang
          export CXX=clang++
          export LLVM=1
          export LLVM_IAS=1
          export LD=ld.lld
          export STRIP=llvm-strip
          export EXTRA_CFLAGS="-Wno-unused-function -Wno-frame-larger-than"

          cd kernel
          make vendor/star_defconfig
          make -j$(nproc)

      - name: 打包 boot.img
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git
          cp kernel/arch/arm64/boot/Image.gz AnyKernel3/
          cd AnyKernel3
          zip -q -r boot_final.zip ./*

      - name: 上传固件
        uses: actions/upload-artifact@v4
        with:
          name: SM8350_boot_FINAL
          path: AnyKernel3/boot_final.zip
