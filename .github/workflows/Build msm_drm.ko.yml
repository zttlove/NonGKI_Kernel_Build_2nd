name: Build msm_drm.ko (Clang 20 + SM8350)
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y build-essential bc bison flex libelf-dev libssl-dev dwarves git lz4

      # 克隆内核
      - name: Clone kernel
        run: |
          git clone --depth=1 -b hyper-14 \
            https://github.com/zttlove/android_kernel_xiaomi_sm8350-miui.git kernel

      # 下载 Clang
      - name: Download Clang 20
        run: |
          mkdir -p clang
          wget -O clang.tar.gz "https://github.com/ZyCromerZ/Clang/releases/download/20.0.0git-20241222-release/Clang-20.0.0git-20241222.tar.gz"
          tar -zxf clang.tar.gz -C clang

      # 下载 GCC 工具链
      - name: Download GCC aarch64 & arm
        run: |
          git clone --depth=1 -b android12L-release \
            https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9 gcc64
          git clone --depth=1 -b android12L-release \
            https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/arm/arm-linux-androideabi-4.9 gcc32

      # 修复 KernelSU 报错
      - name: Fix KernelSU config
        run: |
          cd kernel
          sed -i 's/^source "drivers\/kernelsu\/Kconfig"/# &/' drivers/Kconfig
          sed -i 's/^obj-\$(CONFIG_KERNELSU) += kernelsu\//# &/' drivers/Makefile

      # 【核心修复】提前把编译器路径写入系统环境，defconfig 就能找到
      - name: Export full toolchain PATH
        run: |
          echo "${GITHUB_WORKSPACE}/clang/bin" >> $GITHUB_PATH
          echo "${GITHUB_WORKSPACE}/gcc64/bin" >> $GITHUB_PATH
          echo "${GITHUB_WORKSPACE}/gcc32/bin" >> $GITHUB_PATH

      # 设置编译变量
      - name: Set build env
        run: |
          echo "ARCH=arm64" >> $GITHUB_ENV
          echo "CROSS_COMPILE=aarch64-linux-android-" >> $GITHUB_ENV
          echo "CROSS_COMPILE_ARM32=arm-linux-androideabi-" >> $GITHUB_ENV
          echo "CC=clang" >> $GITHUB_ENV

      # 开始编译
      - name: Build msm_drm.ko
        run: |
          cd kernel
          make vendor/star_defconfig
          make -j$(nproc)
          make -j$(nproc) M=drivers/gpu/drm/msm modules

      # 上传
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: msm_drm_sm8350_final
          path: kernel/drivers/gpu/drm/msm/msm_drm.ko
          if-no-files-found: error
