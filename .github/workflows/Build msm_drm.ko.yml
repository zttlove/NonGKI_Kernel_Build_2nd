name: Build msm_drm.ko (Clang 20 + SM8350)
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y build-essential bc bison flex libelf-dev libssl-dev dwarves git lz4

      # 克隆内核
      - name: Clone kernel
        run: |
          git clone --depth=1 -b hyper-14 https://github.com/zttlove/android_kernel_xiaomi_sm8350-miui.git kernel

      # 修复 KernelSU 报错
      - name: Fix KernelSU config
        run: |
          cd kernel
          sed -i 's/^source "drivers\/kernelsu\/Kconfig"/# &/' drivers/Kconfig
          sed -i 's/^obj-\$(CONFIG_KERNELSU) += kernelsu\//# &/' drivers/Makefile

      # ==============================================
      # 【终极方案】直接用系统自带工具链，最简单、最稳定
      # ==============================================
      - name: Set env (system gcc)
        run: |
          echo "ARCH=arm64" >> $GITHUB_ENV
          echo "CROSS_COMPILE=aarch64-linux-gnu-" >> $GITHUB_ENV

      # 直接编译！不再折腾自定义 Clang/GCC，彻底告别报错
      - name: Build msm_drm.ko
        run: |
          cd kernel
          make vendor/star_defconfig
          make -j$(nproc)
          make -j$(nproc) M=drivers/gpu/drm/msm modules

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: msm_drm_sm8350
          path: kernel/drivers/gpu/drm/msm/msm_drm.ko
          if-no-files-found: error
