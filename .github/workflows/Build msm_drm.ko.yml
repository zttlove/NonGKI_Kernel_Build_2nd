name: Build msm_drm.ko (FINAL FIX)
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: kernel-sm8350
          max-size: 3G

      - name: Install base deps
        run: |
          sudo apt update
          sudo apt install -y build-essential bc bison flex libelf-dev libssl-dev dwarves git lz4 ccache

      - name: Clone kernel
        run: |
          git clone --depth=1 -b hyper-14 https://github.com/zttlove/android_kernel_xiaomi_sm8350-miui.git kernel

      - name: Download Clang 20
        run: |
          mkdir -p clang
          wget -q https://github.com/ZyCromerZ/Clang/releases/download/20.0.0git-20241222-release/Clang-20.0.0git-20241222.tar.gz
          tar -xf Clang-20.0.0git-20241222.tar.gz -C clang

      - name: Download Android GCC 4.9
        run: |
          git clone --depth=1 -b android12L-release https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9 gcc64
          git clone --depth=1 -b android12L-release https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/arm/arm-linux-androideabi-4.9 gcc32

      - name: Fix KernelSU
        run: |
          cd kernel
          sed -i 's/^source "drivers\/kernelsu\/Kconfig"/# &/' drivers/Kconfig
          sed -i 's/^obj-\$(CONFIG_KERNELSU) += kernelsu\//# &/' drivers/Makefile

      - name: Disable Kconfig compiler check
        run: |
          cd kernel
          sed -i '39 s/^/#/' scripts/Kconfig.include

      - name: Fix binder includes
        run: |
          cd kernel
          sed -i 's#<../../android/binder_internal.h>#"../../android/binder_internal.h"#' drivers/staging/mi-log/mi_log.c
          sed -i 's#<../../android/binder_internal.h>#"../../android/binder_internal.h"#' drivers/staging/binder_prio/binder_prio.c

      - name: Fix vmf const error
        run: |
          cd kernel
          sed -i 's/static int __handle_speculative_fault(const struct vm_fault *vmf)/static int __handle_speculative_fault(struct vm_fault *vmf)/' mm/memory.c

      # 🚀 强制编译 DRM 为模块
      - name: Force DRM MSM as module
        run: |
          cd kernel
          echo "CONFIG_DRM_MSM=m" >> arch/arm64/configs/vendor/star_defconfig
          echo "CONFIG_DRM_MSM=m" >> .config 2>/dev/null || true

      # 🚀 编译（完整编译，确保模块一定生成）
      - name: Build kernel modules
        run: |
          export PATH="$GITHUB_WORKSPACE/clang/bin:$GITHUB_WORKSPACE/gcc64/bin:$GITHUB_WORKSPACE/gcc32/bin:$PATH"
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-android-
          export CROSS_COMPILE_ARM32=arm-linux-androideabi-
          export CC="ccache clang"
          export CXX="ccache clang++"
          export LLVM=1
          export LLVM_IAS=1
          export LD=ld.lld
          export STRIP=llvm-strip
          export EXTRA_CFLAGS="-Wno-unused-function -Wno-frame-larger-than"

          cd kernel
          make vendor/star_defconfig
          make modules_prepare
          make modules  -j$(nproc)  # 编译所有模块，确保 drm 一定生成

      # 🎯【终极】查找所有 drm 相关 ko，复制出来
      - name: Find and collect msm_drm.ko
        run: |
          mkdir -p upload
          find kernel -name "*msm*.ko" -o -name "*drm*.ko" | xargs cp -t upload/
          ls -lah upload/

      # ✅ 上传找到的模块（不管路径）
      - name: Upload all modules
        uses: actions/upload-artifact@v4
        with:
          name: all_drm_modules
          path: upload/
