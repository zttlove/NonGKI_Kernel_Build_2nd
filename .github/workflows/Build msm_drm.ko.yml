name: Build msm_drm.ko for Xiaomi SM8350
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            build-essential bc bison flex libelf-dev \
            gcc-aarch64-linux-gnu libssl-dev dwarves git

      # 克隆内核
      - name: Clone kernel source
        run: |
          git clone --depth=1 \
            --branch hyper-14 \
            https://github.com/zttlove/android_kernel_xiaomi_sm8350-miui.git \
            kernel

      # ✅【关键修复】自动注释掉 KernelSU 配置，解决报错
      - name: Fix missing kernelsu Kconfig
        run: |
          cd kernel
          sed -i 's/^source "drivers\/kernelsu\/Kconfig"/# &/' drivers/Kconfig
          sed -i 's/^obj-\$(CONFIG_KERNELSU) += kernelsu\//# &/' drivers/Makefile

      # 设置编译环境
      - name: Set build env
        run: |
          echo "ARCH=arm64" >> $GITHUB_ENV
          echo "CROSS_COMPILE=aarch64-linux-gnu-" >> $GITHUB_ENV

      # 编译
      - name: Build msm_drm.ko
        run: |
          cd kernel
          make vendor/star_defconfig
          make -j$(nproc)
          make -j$(nproc) M=drivers/gpu/drm/msm modules

      # 上传产物
      - name: Upload module
        uses: actions/upload-artifact@v4
        with:
          name: msm_drm_sm8350
          path: kernel/drivers/gpu/drm/msm/msm_drm.ko
          if-no-files-found: error
