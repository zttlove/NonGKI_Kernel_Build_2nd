name: Build Xiaomi11U (hyper A16)

on:
  workflow_call:
  workflow_dispatch:

env:
  # Device env
  DEVICE_NAME : "xiaomi_11U"
  DEVICE_CODENAME : "star"

  CUSTOM_CMDS : "CLANG_TRIPLE=aarch64-linux-gnu-"
  EXTRA_CMDS : 'LD=ld.lld LLVM=1 LLVM_IAS=1 EXTRA_CFLAGS="-Wno-unused-function -Wno-frame-larger-than"'

  KERNEL_SOURCE : "https://github.com/zttlove/android_kernel_xiaomi_sm8350-miui.git"
  KERNEL_BRANCH : "hyper-14"

  CLANG_SOURCE : "https://github.com/ZyCromerZ/Clang/releases/download/20.0.0git-20241222-release/Clang-20.0.0git-20241222.tar.gz"
  CLANG_BRANCH : ""

  GCC_GNU : false
  GCC_64_SOURCE : "https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9.git"
  GCC_64_BRANCH : "android12L-release"
  GCC_32_SOURCE : "https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/arm/arm-linux-androideabi-4.9.git"
  GCC_32_BRANCH : "android12L-release"

  DEFCONFIG_SOURCE: ""
  DEFCONFIG_NAME : "vendor/star_defconfig"
  DEFCONFIG_ORIGIN_IMAGE: ""
  DEFCONFIG_FROM_BOOT: false

  KERNELSU_SOURCE : ""
  KERNELSU_BRANCH : ""

  KERNELSU_AUTO_GET : "true"
  KERNELSU_AUTO_FORK : "resukisu" # xxksu, rsuntk , next, resukisu and sukisu

  SUSFS_ENABLE : true
  SUSFS_FIXED : true

  AK3_SOURCE : "https://github.com/osm0sis/AnyKernel3.git"
  AK3_BRANCH : "master"

  BOOT_SOURCE : ""

  NEED_DTBO : false
  NEED_SAFE_DTBO : false

  ROM_TEXT : "Xiaomi11U (hyper A16)"

  # Other env
  PYTHON_VERSION: "3" # Only 2(Ubuntu 22.04 and Ubuntu 20.04) or 3(Any OS Versions).

  PACK_METHOD: "Anykernel3" # Anykernel3 need SOURCE and BRANCH, MKBOOTIMG needn't it.
  PACK_KMODULES: "false" # if u want pack kernel modules (.ko) into Anykernel3.

  KERNELSU_METHOD: "shell" # shell, manual and only.
  KERNELSU_SUS_PATCH: "false" # if u need manual susfs patch to kernelsu.

  PATCHES_SOURCE: "JackA1ltman/NonGKI_Kernel_Patches" # [your_name]/[your_patch] -> gooder123/NonGKI_Patcher
  PATCHES_BRANCH: "mi_kernel" # [your_branch] -> main

  SUSFS_FOLDER_FIXED: "mi11_evox_a16" # Fill in your patch prefix directory here. Leave it blank if there isn't one. -> your_folder
  SUSFS_PATCH_FIXED: "susfs_fixed" # Fill in your patches here. If there are multiple patches, please separate them with a comma. Leave it blank if there isn't one. -> patch1,patch2

  REKERNEL_ENABLE: "false" # if u need Re:Kernel.

  HOOK_METHOD: "syscall" # Manual hook method ->  syscall.

  KERNEL_PATCH: "false" # If your kernel version is <= 4.9, you have the option of enabling the patch to patch the kernel_write and kernel_read functions.

  KPM_ENABLE: "true" # Anyone devices.
  KPM_INLINE: "true" # Only use it for SukiSU-Ultra.
  KPM_KPATCH_NEXT: "false" # If u want hook KPatch-Next in build step.
  KPM_PATCH_SOURCE: "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU_patch/refs/heads/main/kpm/patch_linux" # If u want to use KPM Inline,so you need set patch exec file source -> raw.githubusercontent.com/Test/Test/patch .

  BASEBAND_GUARD_ENABLE: "false" #if u want prevent unauthorized writes to critical partitions/device nodes.
  BASEBAND_GUARD_BOOT: "false" #if u want to protect boot partition.

  HIDE_STUFF: "false" # hide some of the features

  GENERATE_DTB: "false" # if u kernel need DTB , but cannot auto generate it. (Only Anykernel3).
  GENERATE_CHIP: "qcom" # only supported for qcom and mediatek.

  BUILD_DEBUGGER: "false" # Output build errors.
  SKIP_PATCH: "false" # Ignore errors found in Patch Debugger.

  BUILD_OTHER_CONFIG: "false" # Merge config files.
  MERGE_CONFIG_FILES: "vendor/venus_QGKI.config,vendor/xiaomi_QGKI.config"

  FREE_MORE_SPACE: "false" # if u want get more space, enabled it.

jobs:
  build-kernel:
    name: Xiaomi11U (hyper A16)
    runs-on: ubuntu-latest # u can changed to ubuntu 22.04, and need container set ubuntu-latest
    # container: archlinux/archlinux:latest # if u need use arch linux -> archlinux/archlinux:latest or ubuntu 20.04 -> ubuntu:focal
    env:
      CCACHE_COMPILERCHECK: "%compiler% -dumpmachine; %compiler% -dumpversion"
      CCACHE_NOHASHDIR: "true"
      CCACHE_HARDLINK: "true"

    steps:
      - name: ⏰ Checkout repository
        uses: actions/checkout@v6

      - name: ⌛️ Compilation environment preparation
        uses: ./.github/workflows/build-env

      - name: ⚙️ Get neccssary tools
        uses: ./.github/workflows/build-ready

      - name: 🪝 Patch Kernel of SUSFS
        uses: ./.github/workflows/patch-susfs

      - name: 🔗 Patch for no-kprobe
        uses: ./.github/workflows/patch-no-kprobe

      - name: 🪛 Extra Kernel Options
        run: |
          # Only ${{ env.DEVICE_NAME }} use it.
          cd $GITHUB_WORKSPACE/device_kernel
          # Nothing happen.

      - name: 🧰 Patch Kernel of Re:Kernel
        uses: ./.github/workflows/patch-rekernel

      - name: 🔒 Patch Kernel of Baseband Guard
        uses: ./.github/workflows/patch-baseband-guard

      - name: 🔧 Patch Hide Stuff
        uses: ./.github/workflows/patch-hide-stuff

      - name: 🚀 Build Process
        uses: ./.github/workflows/build-process

      # ==============================
      #  打包 Anykernel3
      # ==============================
      - name: 📦 Make Anykernel3 Flasher
        if: env.PACK_METHOD == 'Anykernel3'
        shell: bash
        run: |
          set -euo pipefail
          echo "============================================="
          echo "📦 开始构建 Anykernel3 内核刷机包"
          echo "============================================="

          # 1. 时间戳
          TIME=$(date +"%Y%m%d%H%M%S")
          echo "⏰ 自动生成时间戳：$TIME"

          cd "$GITHUB_WORKSPACE"

          # 2. 检查内核文件
          if [ ! -f "oImage" ]; then
            echo "::error::❌ 未找到内核文件 oImage"
            exit 1
          fi
          echo "✅ 找到内核文件：oImage ($(du -h oImage | awk '{print $1}'))"

          # 3. 清理临时目录
          rm -rf tmp
          mkdir -p tmp

          # 4. 配置 Anykernel3
          if [ -d "Anykernel3" ] && [ -f "Anykernel3/anykernel.sh" ]; then
            echo "🔧 配置 Anykernel3 参数"
            sed -i "s/^name=.*/name=\"NonGKI Kernel\"/" Anykernel3/anykernel.sh
            sed -i "s/^do\.devicecheck=.*/do.devicecheck=0/" Anykernel3/anykernel.sh
            sed -i "s/^IS_SLOT_DEVICE=.*/IS_SLOT_DEVICE=1/" Anykernel3/anykernel.sh
            sed -i "s/^BLOCK=.*/BLOCK=boot/" Anykernel3/anykernel.sh
          fi

          # 5. 复制内核
          cp -v oImage tmp/Image

          # 6. 复制模块
          mkdir -p tmp/modules/vendor/lib/modules
          find . -name "*.ko" -type f -print0 | xargs -0 cp -t tmp/modules/vendor/lib/modules/ 2>/dev/null || true
          module_count=$(find tmp/modules/vendor/lib/modules -name "*.ko" | wc -l)
          echo "📦 复制内核模块：$module_count 个"

          # 7. 复制 AK3
          [ -d Anykernel3 ] && cp -rp Anykernel3/* tmp/

          # 8. 打包
          echo "🚀 开始压缩刷机包..."
          cd tmp
          7za a -tzip -mx5 -mmt=on package.zip ./* >/dev/null
          cd ..

          # 9. 生成最终文件名
          SAFE_ROM_TEXT=$(echo "${{ env.ROM_TEXT }}" | tr -d '":*?<>|' | tr ' ' '-')
          FINAL_ZIP="${{ env.DEVICE_CODENAME }}-${SAFE_ROM_TEXT}-${TIME}-Anykernel3.zip"

          mv tmp/package.zip "$FINAL_ZIP"
          rm -rf tmp

          # 10. 导出变量
          echo "PACK_NAME=$FINAL_ZIP" >> $GITHUB_ENV
          echo "============================================="
          echo "✅ 打包完成：$FINAL_ZIP"
          echo "📁 文件大小：$(du -h "$FINAL_ZIP" | awk '{print $1}')"
          echo "============================================="

      # ==============================
      #  自动上传打包好的 zip
      # ==============================
      - name: 🚀 Upload Final Kernel Package
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PACK_NAME }}
          path: ${{ env.PACK_NAME }}
