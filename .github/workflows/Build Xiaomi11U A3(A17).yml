name: Build Kernel (A17) - zttlove KernelSU (Fixed & Accelerated)

on:
  workflow_dispatch:

env:
  TZ: Asia/Shanghai
  DEVICE_CODENAME: "star"
  KERNEL_ARCH: "arm64"
  KERNEL_REPO: "zttlove/android_kernel_xiaomi_sm8350_miyume"
  KERNEL_BRANCH: "main"
  KERNELSU_REPO: "https://github.com/ReSukiSU/ReSukiSU"
  KERNELSU_BRANCH: "main"
  DEFCONFIG_NAME: "star_defconfig"
  OUTPUT_DIR: "out"
  PACK_METHOD: "Anykernel3"
  PACK_KMODULES: "true"
  ROM_TEXT: "HyperA17"
  CCACHE_DIR: "${{ github.workspace }}/.ccache"
  CLANG_DIR: "${{ github.workspace }}/clang"
  KERNEL_DIR: "${{ github.workspace }}/kernel"

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:

      - name: Checkout Kernel Source
        uses: actions/checkout@v4
        with:
          repository: ${{ env.KERNEL_REPO }}
          ref: ${{ env.KERNEL_BRANCH }}
          path: kernel
          fetch-depth: 1


      - name: Cache Clang
        id: cache-clang
        uses: actions/cache@v4
        with:
          path: ${{ env.CLANG_DIR }}
          key: clang-18.1.8-ubuntu-18.04


      - name: Install Dependencies
        run: |
          sudo apt update
          sudo apt install -y \
          bc bison flex libelf-dev libssl-dev libncurses-dev \
          make python3 device-tree-compiler git curl xz-utils \
          ccache zip unzip

          # --- 强力修复 libtinfo.so.5 缺失问题 ---
          echo "正在修复 libtinfo.so.5 依赖..."
          if ! sudo apt install -y libtinfo5; then
            echo "直接安装 libtinfo5 失败，尝试创建软链接..."
            sudo ln -sf /lib/x86_64-linux-gnu/libtinfo.so.6 /lib/x86_64-linux-gnu/libtinfo.so.5
          fi
          
          if [ ! -f /lib/x86_64-linux-gnu/libtinfo.so.5 ]; then
            echo "::error::修复失败！libtinfo.so.5 仍然不存在。"
            exit 1
          else
            echo "✅ libtinfo.so.5 修复成功！"
          fi

         
      - name: Download Clang
        if: steps.cache-clang.outputs.cache-hit != 'true'
        run: |
          echo "Setting up Clang..."
          mkdir -p ${{ env.CLANG_DIR }}
          curl -L --retry 3 -o clang.tar.xz "https://github.com/llvm/llvm-project/releases/download/llvmorg-18.1.8/clang+llvm-18.1.8-x86_64-linux-gnu-ubuntu-18.04.tar.xz"
          tar -xf clang.tar.xz -C ${{ env.CLANG_DIR }} --strip-components=1
          rm clang.tar.xz
          ${{ env.CLANG_DIR }}/bin/clang --version

       
      - name: Cache KernelSU
        id: cache-kernelsu
        uses: actions/cache@v4
        with:
          path: ${{ env.KERNEL_DIR }}/drivers/kernelsu
          key: kernelsu-${{ env.KERNELSU_BRANCH }}

   
      - name: Setup KernelSU
        if: steps.cache-kernelsu.outputs.cache-hit != 'true'
        working-directory: kernel
        run: |
          set -e
          echo "Cloning KernelSU..."
          rm -rf drivers/kernelsu
          git clone https://github.com/ReSukiSU/ReSukiSU.git drivers/kernelsu
          cd drivers/kernelsu
          git checkout b0b73be~1
          cd ../..
          
          
          # 创建包装文件
          echo "source \"drivers/kernelsu/kernel/Kconfig\"" > drivers/kernelsu/Kconfig
          echo "obj-y += kernel/" > drivers/kernelsu/Makefile
          
          # 注入到顶层 Makefile 和 Kconfig
          sed -i '/source "drivers\/kernelsu\/Kconfig"/d' drivers/Kconfig
          sed -i '/obj-\$(CONFIG_KSU) += kernelsu\//d' drivers/Makefile
          echo "source \"drivers/kernelsu/Kconfig\"" >> drivers/Kconfig
          echo "obj-\$(CONFIG_KSU) += kernelsu/" >> drivers/Makefile

      - name: Apply SUSFS v2.2 patch
        working-directory: kernel
        run: |
          # 克隆当前仓库（包含补丁文件）
          cd ${{ github.workspace }}
          git clone https://github.com/${{ github.repository }}.git workflow_repo --depth=1
    
          # 应用补丁（注意：相对路径需要 ../，因为当前在 kernel/ 下）
          cd kernel
          if [ -f ../workflow_repo/Patches/Patch/susfs_patch_to_5.4.patch ]; then
          patch -p1 -N --batch --no-backup-if-mismatch < ../workflow_repo/Patches/Patch/susfs_patch_to_5.4.patch || true
      
          # 检查是否有 .rej 文件（只警告，不退出）
          if [ $(find . -name "*.rej" | wc -l) -ne 0 ]; then
          echo "⚠️ 部分补丁失败（存在 .rej 文件），但将继续编译"
          find . -name "*.rej" -exec echo "{}" \;
          else
          echo "✅ SUSFS v2.2 补丁全部成功应用"
          fi
          else
          echo "❌ 补丁文件不存在，跳过应用"
          ls -la ../workflow_repo/Patches/Patch/
          exit 1
          fi
    
          # 清理临时仓库
          cd ${{ github.workspace }}
          rm -rf workflow_repo

      - name: Fix show_smap return error
        working-directory: kernel
        run: |
          # 将所有的 return; 替换为 return 0;（安全操作）
          sed -i 's/^[[:space:]]*return;[[:space:]]*$/    return 0;/g' fs/proc/task_mmu.c
          # 再检查一次，确保没有遗漏
          sed -i 's/return;$/    return 0;/g' fs/proc/task_mmu.c
    
          # 6. 编译内核
      - name: Build Kernel
        working-directory: kernel
        run: |
          set -e
          export ARCH=${{ env.KERNEL_ARCH }}
          export PATH="${{ env.CLANG_DIR }}/bin:$PATH"
          export CCACHE_EXEC=$(which ccache)
          export CCACHE_DIR="${{ env.CCACHE_DIR }}"
          ccache -M 6G
          
          # 环境变量
          export LLVM=1
          export LLVM_IAS=1
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          
          make mrproper
          rm -rf ${{ env.OUTPUT_DIR }}
          
          # 生成配置
          make -j$(nproc) O=${{ env.OUTPUT_DIR }} ${{ env.DEFCONFIG_NAME }}
          
          scripts/config --file ${{ env.OUTPUT_DIR }}/.config \
          --enable KSU \
          --enable INIT_ON_ALLOC_DEFAULT_ON \
          --enable KSU_HOOK_INLINE \
          --disable KSU_HOOK_TRACEPOINT \
          --disable KSU_HOOK_MANUAL \
          --enable KSU_SELINUX \
          --enable KSU_ZYGISK \
          --disable KPROBES \
          --disable HAVE_KPROBES \
          --disable KPROBE_EVENTS \
          --enable KALLSYMS \
          --enable KALLSYMS_ALL \
          --enable MODULES \
          --enable MODULE_UNLOAD \
          --enable OVERLAY_FS \
          --enable EXT4_FS \
          --enable NAMESPACES \
          --disable KSU_DEBUG \
          --enable KSU_SUSFS \
          --enable KSU_SUSFS_SUS_PATH \
          --enable KSU_SUSFS_KSTAT \
          --enable KSU_SUSFS_SPOOF_UNAME \
          --enable KSU_SUSFS_SUS_MOUNT \
          --enable KSU_SUSFS_OPEN_REDIRECT \
          --enable KSU_SUSFS_SUS_MAP \
          --enable KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS \
          --enable KSU_SUSFS_ENABLE_LOG \
          --enable KSU_SUSFS_SUS_SU \
          --enable SELINUX_DEVELOP \
          --enable SELINUX_ENFORCING \
          --set-val CONFIG_FRAME_WARN 3072
          make olddefconfig O=${{ env.OUTPUT_DIR }}

          
          # 开始编译
          make -j$(nproc) O=${{ env.OUTPUT_DIR }} \
            KCFLAGS="-Wno-strict-prototypes -Wno-align-mismatch -Wno-unused-function -Wno-compare-distinct-pointer-types -Wno-void-pointer-to-int-cast -Wno-array-parameter -Wno-declaration-after-statement"
          
          # 检查输出
          if [ ! -f "${{ env.OUTPUT_DIR }}/arch/arm64/boot/Image" ]; then
            echo "ERROR: Kernel Image not found!"
            exit 1
          fi

         
      - name: Package AnyKernel3
        id: package
        run: |
          set -e
          echo "📦 开始打包..."
          TIME=$(date +"%Y.%m.%d")
          AK3_DIR="AnyKernel3"
          IMG_PATH="${{ env.KERNEL_DIR }}/${{ env.OUTPUT_DIR }}/arch/arm64/boot/Image"
          
          # 克隆 AnyKernel3
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git $AK3_DIR
          
          # 复制内核镜像
          cp -f "$IMG_PATH" "$AK3_DIR/Image"
          
          # 修改 anykernel.sh 适配机型
          sed -i 's/^do.devicecheck=1/do.devicecheck=0/' "$AK3_DIR/anykernel.sh"
          sed -i 's/^BLOCK=.*/BLOCK=boot/' "$AK3_DIR/anykernel.sh"
          sed -i 's/^IS_SLOT_DEVICE=0/IS_SLOT_DEVICE=1/' "$AK3_DIR/anykernel.sh"
          sed -i 's/^device.name1=.*/device.name1=star/' "$AK3_DIR/anykernel.sh"
          
          
          # 打包模块 (如果开启)
          if [ "${{ env.PACK_KMODULES }}" == "true" ]; then
            MOD_DIR="${AK3_DIR}/modules"
            mkdir -p "$MOD_DIR"
            find "${{ env.KERNEL_DIR }}/${{ env.OUTPUT_DIR }}" -name "*.ko" -exec cp {} "$MOD_DIR" \;
            echo "📦 已打包 $(ls $MOD_DIR | wc -l) 个内核模块"
          fi
          
          # 创建 ZIP
          cd $AK3_DIR
          zip -r9 "../${{ env.DEVICE_CODENAME }}-${{ env.ROM_TEXT }}-${TIME}.zip" ./*
          cd ..
          
          # 输出文件名
          ZIP_NAME="${{ env.DEVICE_CODENAME }}-${{ env.ROM_TEXT }}-${TIME}.zip"
          echo "zip_name=$ZIP_NAME" >> $GITHUB_OUTPUT
          echo "✅ 打包完成: $ZIP_NAME"

          
      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.ROM_TEXT }}-${{ github.run_number }}
          name: ${{ env.DEVICE_CODENAME }} Kernel ${{ env.ROM_TEXT }}
          body: |
            ## Xiaomi 11 Ultra Star HyperOS A17 内核刷机包
            - 适配 HyperOS A17 全版本
            - NonGKI 通用免解boot补丁
            - Osm0sis Anykernel3 官方卡刷格式
            - Clang 18.18 最新编译
          files: ${{ steps.package.outputs.zip_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
