name: Build Kernel (A17) - Stable with Kprobes Hook (Fixed)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  TZ: Asia/Shanghai
  DEVICE_NAME: "xiaomi_11U"
  DEVICE_CODENAME: "star"
  KERNEL_ARCH: "arm64"
  KERNEL_REPO: "zttlove/android_kernel_xiaomi_sm8350_miyume"
  KERNEL_BRANCH: "main"
  CLANG_VERSION: "18.1.8"
  CLANG_URL: "https://github.com/llvm/llvm-project/releases/download/llvmorg-18.1.8/clang+llvm-18.1.8-x86_64-linux-gnu-ubuntu-18.04.tar.xz"
  DEFCONFIG_NAME: "star_defconfig"
  OUTPUT_DIR: "out"
  PACK_METHOD: "Anykernel3"
  PACK_KMODULES: "true"
  ROM_TEXT: "HyperA17"

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Kernel Source
        uses: actions/checkout@v4
        with:
          repository: ${{ env.KERNEL_REPO }}
          ref: ${{ env.KERNEL_BRANCH }}
          path: kernel
          submodules: true

      - name: Install Dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            bc bison flex libelf-dev libssl-dev \
            make python3 device-tree-compiler git curl xz-utils \
            libtinfo5 ccache p7zip-full

      - name: Cache Clang
        id: cache-clang
        uses: actions/cache@v4
        with:
          path: clang
          key: clang-${{ env.CLANG_VERSION }}-x86_64

      - name: Download Clang
        if: steps.cache-clang.outputs.cache-hit != 'true'
        run: |
          echo "Downloading Clang ${{ env.CLANG_VERSION }}..."
          curl -L --retry 3 --retry-delay 5 -o clang.tar.xz "${{ env.CLANG_URL }}"
          mkdir -p clang
          tar -xf clang.tar.xz -C clang --strip-components=1
          rm clang.tar.xz

      - name: Verify Clang
        run: |
          if [ ! -f "clang/bin/clang" ]; then
            echo "Clang binary missing!"
            exit 1
          fi
          clang/bin/clang --version

      - name: Cache CCache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-${{ runner.os }}-${{ env.KERNEL_BRANCH }}-${{ env.DEFCONFIG_NAME }}
          restore-keys: |
            ccache-${{ runner.os }}-${{ env.KERNEL_BRANCH }}-
            ccache-${{ runner.os }}-

      - name: Setup CCache
        run: |
          mkdir -p ~/.ccache
          echo "CCACHE_DIR=~/.ccache" >> $GITHUB_ENV
          ccache -M 6G

      # ---------- 克隆 KernelSU-Next 到 drivers/kernelsu ----------
      - name: Clone KernelSU-Next
        working-directory: kernel
        run: |
          echo "Cloning KernelSU-Next (legacy) into drivers/kernelsu..."
          rm -rf drivers/kernelsu
          git clone --depth=1 -b legacy https://github.com/KernelSU-Next/KernelSU-Next.git drivers/kernelsu
          if [ ! -f "drivers/kernelsu/kernel/Makefile" ]; then
            echo "ERROR: KernelSU kernel Makefile not found"
            exit 1
          fi
          echo "KernelSU-Next cloned successfully."

      # ---------- 强制内建编译：重写 Makefile，直接用 obj-y 包含所有源文件 ----------
      - name: Force built-in compilation for KernelSU
        working-directory: kernel/drivers/kernelsu/kernel
        run: |
          echo "Rewriting Makefile to force built-in..."
          # 生成新的 Makefile 内容，将所有 .c 文件直接添加到 obj-y
          cat > Makefile << 'EOF'
          # 强制内建编译所有源文件
          obj-y += $(patsubst %.c,%.o,$(wildcard *.c))
          # 如果存在子目录，也包含它们（例如 kprobe 目录）
          obj-y += $(wildcard */)
          EOF
          echo "New Makefile content:"
          cat Makefile

      # ---------- 集成到 drivers/ 子系统（使用 obj-y 无条件编译） ----------
      - name: Integrate KernelSU into drivers subsystem
        working-directory: kernel
        run: |
          echo "Integrating KernelSU into drivers subsystem..."
          # 清除旧的 source 和 obj 条目
          sed -i '/^source.*kernelsu/d' drivers/Kconfig
          sed -i '/obj-.*kernelsu/d' drivers/Makefile

          # 添加 Kconfig source（可能位于根或 kernel/ 下）
          KSU_KCONFIG=""
          if [ -f "drivers/kernelsu/Kconfig" ]; then
            KSU_KCONFIG="drivers/kernelsu/Kconfig"
          elif [ -f "drivers/kernelsu/kernel/Kconfig" ]; then
            KSU_KCONFIG="drivers/kernelsu/kernel/Kconfig"
          else
            echo "ERROR: Kconfig not found in drivers/kernelsu"
            exit 1
          fi
          echo "source \"$KSU_KCONFIG\"" >> drivers/Kconfig

          # 无条件添加 obj-y（不管 CONFIG_KSU 是否为 y）
          echo "obj-y += kernelsu/kernel/" >> drivers/Makefile

          # 额外在根 Makefile 中添加 core-y 作为备份
          sed -i '/core-.*kernelsu/d' Makefile
          echo "core-y += drivers/kernelsu/kernel/" >> Makefile

          echo "Integration complete."

      # ---------- 修复 defconfig（增加 KSU_USE_KPROBES 和强制 CONFIG_KSU=y） ----------
      - name: Fix defconfig for Kprobes + Modules
        working-directory: kernel
        run: |
          set -e
          DEFCONFIG_PATH="arch/${{ env.KERNEL_ARCH }}/configs/${{ env.DEFCONFIG_NAME }}"
          if [ ! -f "$DEFCONFIG_PATH" ]; then
            echo "ERROR: Defconfig not found at $DEFCONFIG_PATH"
            exit 1
          fi
          cp $DEFCONFIG_PATH ${DEFCONFIG_PATH}.bak
          sed -i '/^CONFIG_KSU/d' $DEFCONFIG_PATH
          sed -i '/^CONFIG_KPROBES/d' $DEFCONFIG_PATH
          sed -i '/^CONFIG_MODULES/d' $DEFCONFIG_PATH
          sed -i '/^CONFIG_MODULE_SIG/d' $DEFCONFIG_PATH
          sed -i '/^CONFIG_SECURITY_SELINUX/d' $DEFCONFIG_PATH
          sed -i '/^CONFIG_KPROBE_EVENTS/d' $DEFCONFIG_PATH
          cat >> $DEFCONFIG_PATH << 'EOF'
          # KernelSU
          CONFIG_KSU=y
          CONFIG_KSU_DEBUG=n
          CONFIG_KSU_KPROBES_HOOK=y
          CONFIG_KSU_USE_KPROBES=y
          # Kprobes
          CONFIG_HAVE_KPROBES=y
          CONFIG_KPROBES=y
          CONFIG_KPROBE_EVENTS=y
          CONFIG_KPROBE_EVENTS_ON_NOTRACE=y
          # Modules
          CONFIG_MODULES=y
          CONFIG_MODULE_SIG=y
          CONFIG_MODULE_SIG_SHA256=y
          CONFIG_MODULE_SIG_FORCE=n
          # SELinux
          CONFIG_SECURITY_SELINUX=y
          CONFIG_SECURITY_SELINUX_BOOTPARAM=y
          CONFIG_FRAME_WARN=4096
          EOF
          echo "Defconfig updated successfully."
          grep -E "CONFIG_(KSU|KPROBES|MODULES|SELINUX|FRAME_WARN)=" $DEFCONFIG_PATH || true

      - name: Set PATH for Clang
        run: echo "$(pwd)/clang/bin" >> $GITHUB_PATH

      # ---------- 编译内核 ----------
      - name: Build Kernel
        working-directory: kernel
        run: |
          set -e
          echo "Starting kernel build..."
          export ARCH=${{ env.KERNEL_ARCH }}
          export LLVM=1
          export LLVM_IAS=1
          export LD=ld.lld
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export CC=clang
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-

          mkdir -p ${{ env.OUTPUT_DIR }}
          make -j$(nproc) ARCH=arm64 LLVM=1 LLVM_IAS=1 O=${{ env.OUTPUT_DIR }} mrproper || true

          echo "Configuring kernel..."
          make -j$(nproc) ARCH=arm64 LLVM=1 LLVM_IAS=1 O=${{ env.OUTPUT_DIR }} ${{ env.DEFCONFIG_NAME }}

          echo "=== Verifying Kprobe and KSU configuration ==="
          grep -E "CONFIG_(KPROBES|KSU|KPROBE_EVENTS|KSU_USE_KPROBES)" ${{ env.OUTPUT_DIR }}/.config || true

          echo "=== Checking drivers integration ==="
          grep -E "source.*kernelsu" drivers/Kconfig || echo "No source line in drivers/Kconfig"
          grep -E "obj-.*kernelsu" drivers/Makefile || echo "No obj line in drivers/Makefile"

          echo "Compiling kernel..."
          make -j$(nproc) ARCH=arm64 LLVM=1 LLVM_IAS=1 O=${{ env.OUTPUT_DIR }} \
            KCFLAGS="-Wno-align-mismatch -Wno-unused-function -Wno-array-parameter -Wno-void-pointer-to-int-cast -Wno-sometimes-uninitialized -Wno-compare-distinct-pointer-types -Wno-pointer-to-int-cast -Wno-uninitialized"

          if [ ! -f "${{ env.OUTPUT_DIR }}/arch/arm64/boot/Image" ]; then
            echo "ERROR: Kernel image not generated!"
            exit 1
          fi
          echo "Kernel build succeeded."

      # ---------- 打包 AnyKernel3 ----------
      - name: Clone AnyKernel3
        run: git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git anykernel3

      - name: Collect Kernel Modules
        if: env.PACK_KMODULES == 'true'
        working-directory: kernel
        run: |
          echo "Collecting kernel modules from ${{ env.OUTPUT_DIR }}..."
          MODULE_DIR="${{ env.OUTPUT_DIR }}/modules_tmp"
          mkdir -p "$MODULE_DIR"
          make -j$(nproc) ARCH=arm64 LLVM=1 LLVM_IAS=1 O=${{ env.OUTPUT_DIR }} \
            INSTALL_MOD_PATH="$MODULE_DIR" modules_install
          mkdir -p ../anykernel3/modules/system/lib/modules
          find "$MODULE_DIR" -name "*.ko" -exec cp --parents {} ../anykernel3/modules/system/lib/modules/ \;
          echo "Modules collected."

      - name: Configure AnyKernel3
        working-directory: anykernel3
        run: |
          sed -i 's/kernel.string=.*/kernel.string=Xiaomi 11 Ultra (star) Kernel/' anykernel.sh
          sed -i 's/do.devicecheck=.*/do.devicecheck=0/' anykernel.sh
          sed -i 's/device.name1=.*/device.name1=star/' anykernel.sh
          sed -i 's/device.name2=.*/device.name2=xiaomi11ultra/' anykernel.sh
          if [ "${{ env.PACK_KMODULES }}" == "true" ]; then
            sed -i 's/do.modules=.*/do.modules=1/' anykernel.sh
          else
            sed -i 's/do.modules=.*/do.modules=0/' anykernel.sh
          fi
          sed -i 's/do.systemless=.*/do.systemless=1/' anykernel.sh
          sed -i 's/do.cleanup=.*/do.cleanup=1/' anykernel.sh
          sed -i 's/^BLOCK=.*/BLOCK=\/dev\/block\/by-name\/boot;/' anykernel.sh
          sed -i 's/^IS_SLOT_DEVICE=.*/IS_SLOT_DEVICE=1;/' anykernel.sh

      - name: Copy Kernel Image to AnyKernel3
        run: |
          IMG_SRC="kernel/${{ env.OUTPUT_DIR }}/arch/arm64/boot"
          if [ -f "$IMG_SRC/Image.gz-dtb" ]; then
            cp "$IMG_SRC/Image.gz-dtb" anykernel3/Image
          elif [ -f "$IMG_SRC/Image.gz" ]; then
            cp "$IMG_SRC/Image.gz" anykernel3/Image
          elif [ -f "$IMG_SRC/Image" ]; then
            cp "$IMG_SRC/Image" anykernel3/Image
          else
            echo "No kernel image found!"
            exit 1
          fi

      - name: Package Flashable ZIP
        working-directory: anykernel3
        run: |
          zip -r9 "../Kernel-${{ env.DEVICE_CODENAME }}-${{ env.ROM_TEXT }}-$(date +%Y%m%d-%H%M).zip" * -x "*.git*" "*.zip"
          echo "ZIP packaged successfully."

      - name: Upload Kernel ZIP
        uses: actions/upload-artifact@v4
        with:
          name: Kernel-${{ env.DEVICE_CODENAME }}-${{ env.ROM_TEXT }}
          path: Kernel-*.zip
          retention-days: 7
