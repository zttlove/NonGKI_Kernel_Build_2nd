name: Build Kernel (A17) - Stable with Kprobes Hook (Fixed)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  TZ: Asia/Shanghai
  DEVICE_NAME: "xiaomi_11U"
  DEVICE_CODENAME: "star"
  KERNEL_ARCH: "arm64"
  KERNEL_REPO: "zttlove/android_kernel_xiaomi_sm8350_miyume"
  KERNEL_BRANCH: "main"
  CLANG_VERSION: "18.1.8"
  CLANG_URL: "https://github.com/llvm/llvm-project/releases/download/llvmorg-18.1.8/clang+llvm-18.1.8-x86_64-linux-gnu-ubuntu-18.04.tar.xz"
  DEFCONFIG_NAME: "star_defconfig"
  OUTPUT_DIR: "out"
  PACK_METHOD: "Anykernel3"
  PACK_KMODULES: "true"
  ROM_TEXT: "HyperA17"

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Kernel Source
        uses: actions/checkout@v4
        with:
          repository: ${{ env.KERNEL_REPO }}
          ref: ${{ env.KERNEL_BRANCH }}
          path: kernel
          submodules: true

      - name: Install Dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            bc bison flex libelf-dev libssl-dev \
            make python3 device-tree-compiler git curl xz-utils \
            libtinfo5 ccache p7zip-full

      # ---------- 缓存 Clang ----------
      - name: Cache Clang
        id: cache-clang
        uses: actions/cache@v4
        with:
          path: clang
          key: clang-${{ env.CLANG_VERSION }}

      - name: Download Clang
        if: steps.cache-clang.outputs.cache-hit != 'true'
        run: |
          echo "Downloading Clang ${{ env.CLANG_VERSION }}..."
          curl -L --retry 3 --retry-delay 5 -o clang.tar.xz "${{ env.CLANG_URL }}"
          mkdir -p clang
          tar -xf clang.tar.xz -C clang --strip-components=1
          rm clang.tar.xz

      - name: Verify Clang
        run: |
          if [ ! -f "clang/bin/clang" ]; then
            echo "Clang binary missing!"
            exit 1
          fi
          clang/bin/clang --version

      # ---------- 缓存 CCache ----------
      - name: Cache CCache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ runner.os }}-

      - name: Setup CCache
        run: |
          mkdir -p ~/.ccache
          echo "CCACHE_DIR=~/.ccache" >> $GITHUB_ENV
          ccache -M 4G

      # ---------- KernelSU 克隆与集成 ----------
      - name: Clone KernelSU
        working-directory: kernel
        run: |
          echo "Cloning backslashxx/KernelSU (master)..."
          rm -rf KernelSU
          git clone --depth=1 -b master https://github.com/backslashxx/KernelSU.git KernelSU
          if [ ! -f "KernelSU/kernel/Makefile" ]; then
            echo "ERROR: KernelSU kernel directory not found"
            exit 1
          fi

      - name: Integrate KernelSU into Kernel Source
        working-directory: kernel
        run: |
          set -e
          echo "Integrating KernelSU into kernel build system..."
          # 修改 fs/Kconfig，在 endmenu 前插入 source（使用 ../ 回到根目录）
          if ! grep -q "source \"../KernelSU/kernel/Kconfig\"" fs/Kconfig; then
            sed -i '/^endmenu/i source "../KernelSU/kernel/Kconfig"' fs/Kconfig
            echo "Added KernelSU Kconfig source."
          else
            echo "KernelSU Kconfig already present."
          fi

          # 修改 fs/Makefile，添加 obj-y 引用（使用 ../ 指向根目录）
          if ! grep -q "../KernelSU/kernel/" fs/Makefile; then
            echo 'obj-y += ../KernelSU/kernel/' >> fs/Makefile
            echo "Added KernelSU to Makefile."
          else
            echo "KernelSU Makefile entry already exists."
          fi
          echo "KernelSU integration completed."

      # ---------- 修复 defconfig ----------
      - name: Fix defconfig for Kprobes + Modules
        working-directory: kernel
        run: |
          set -e
          DEFCONFIG_PATH="arch/${{ env.KERNEL_ARCH }}/configs/${{ env.DEFCONFIG_NAME }}"
          if [ ! -f "$DEFCONFIG_PATH" ]; then
            echo "ERROR: Defconfig not found at $DEFCONFIG_PATH"
            exit 1
          fi
          cp $DEFCONFIG_PATH ${DEFCONFIG_PATH}.bak

          # 移除可能冲突的旧配置
          sed -i '/CONFIG_KSU/d' $DEFCONFIG_PATH
          sed -i '/CONFIG_KPROBES/d' $DEFCONFIG_PATH
          sed -i '/CONFIG_MODULES/d' $DEFCONFIG_PATH
          sed -i '/CONFIG_MODULE_SIG/d' $DEFCONFIG_PATH
          sed -i '/CONFIG_SECURITY_SELINUX/d' $DEFCONFIG_PATH
          sed -i '/CONFIG_KPROBE_EVENTS/d' $DEFCONFIG_PATH

          # 追加必需配置
          cat >> $DEFCONFIG_PATH << EOF
          # KernelSU
          CONFIG_KSU=y
          CONFIG_KSU_DEBUG=n
          CONFIG_KSU_KPROBES_HOOK=y

          # Kprobes
          CONFIG_HAVE_KPROBES=y
          CONFIG_KPROBES=y
          CONFIG_KPROBE_EVENTS=y
          CONFIG_KPROBE_EVENTS_ON_NOTRACE=y

          # Modules
          CONFIG_MODULES=y
          CONFIG_MODULE_SIG=y
          CONFIG_MODULE_SIG_SHA256=y
          CONFIG_MODULE_SIG_FORCE=n

          # SELinux
          CONFIG_SECURITY_SELINUX=y

          # Disable SUSFS (avoid conflict)
          # CONFIG_KSU_SUSFS is not set
          EOF

          echo "Defconfig updated successfully:"
          grep -E "CONFIG_(KSU|KPROBES|MODULES|MODULE_SIG|SELINUX)=" $DEFCONFIG_PATH

      # ---------- 设置 PATH ----------
      - name: Set PATH for Clang
        run: echo "$(pwd)/clang/bin" >> $GITHUB_PATH

      # ---------- 编译内核 ----------
      - name: Build Kernel
        working-directory: kernel
        run: |
          set -e
          echo "Starting kernel build..."
          export ARCH=${{ env.KERNEL_ARCH }}
          export LLVM=1
          export LLVM_IAS=1
          export LD=ld.lld
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export CC=clang
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-

          # 配置
          make -j$(nproc) ARCH=arm64 LLVM=1 LLVM_IAS=1 O=${{ env.OUTPUT_DIR }} ${{ env.DEFCONFIG_NAME }}

          # 编译
          make -j$(nproc) ARCH=arm64 LLVM=1 LLVM_IAS=1 O=${{ env.OUTPUT_DIR }}

          # 验证产物
          if [ ! -f "${{ env.OUTPUT_DIR }}/arch/arm64/boot/Image" ]; then
            echo "ERROR: Kernel image not generated!"
            exit 1
          fi
          echo "Kernel build succeeded."

      # ---------- 打包 AnyKernel3 ----------
      - name: Prepare AnyKernel3
        run: git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git anykernel3

      - name: Configure AnyKernel3
        working-directory: anykernel3
        run: |
          sed -i 's/kernel.string=.*/kernel.string=Xiaomi 11 Ultra (star) Kernel/' anykernel.sh
          sed -i 's/do.devicecheck=.*/do.devicecheck=0/' anykernel.sh
          sed -i 's/device.name1=.*/device.name1=star/' anykernel.sh
          sed -i 's/device.name2=.*/device.name2=xiaomi11ultra/' anykernel.sh
          sed -i 's/do.modules=.*/do.modules=1/' anykernel.sh
          sed -i 's/do.systemless=.*/do.systemless=1/' anykernel.sh
          sed -i 's/do.cleanup=.*/do.cleanup=1/' anykernel.sh
          sed -i 's/^BLOCK=.*/BLOCK=\/dev\/block\/by-name\/boot;/' anykernel.sh
          sed -i 's/^IS_SLOT_DEVICE=.*/IS_SLOT_DEVICE=1;/' anykernel.sh

      - name: Copy Kernel Image to AnyKernel3
        run: |
          IMG_SRC="kernel/${{ env.OUTPUT_DIR }}/arch/arm64/boot"
          if [ -f "$IMG_SRC/Image.gz-dtb" ]; then
            cp "$IMG_SRC/Image.gz-dtb" anykernel3/Image
          elif [ -f "$IMG_SRC/Image.gz" ]; then
            cp "$IMG_SRC/Image.gz" anykernel3/Image
          elif [ -f "$IMG_SRC/Image" ]; then
            cp "$IMG_SRC/Image" anykernel3/Image
          else
            echo "No kernel image found!"
            exit 1
          fi
          echo "Kernel image copied to AnyKernel3."

      - name: Package Flashable ZIP
        if: env.PACK_METHOD == 'Anykernel3'
        shell: bash
        run: |
          set -euo pipefail
          TIME=$(TZ=Asia/Shanghai date +"%Y-%m-%d")
          AK3_DIR="${GITHUB_WORKSPACE}/anykernel3"
          TMP_DIR="${GITHUB_WORKSPACE}/package_temp"
          mkdir -p "${TMP_DIR}"

          # 复制 AnyKernel3 全部内容
          cp -r "${AK3_DIR}"/* "${TMP_DIR}/"

          # 复制 modules（如果启用）
          if [[ "${{ env.PACK_KMODULES }}" == "true" ]]; then
            MOD_DIR="${TMP_DIR}/modules/vendor/lib/modules"
            mkdir -p "${MOD_DIR}"
            find "${GITHUB_WORKSPACE}/kernel" -name "*.ko" -type f -exec cp -t "${MOD_DIR}" {} + 2>/dev/null || true
            mod_count=$(find "${MOD_DIR}" -name "*.ko" | wc -l)
            echo "Found ${mod_count} kernel modules."
            if [[ ${mod_count} -eq 0 ]]; then
              rm -rf "${TMP_DIR}/modules"
            fi
          else
            echo "Module packaging disabled."
          fi

          # 打包 ZIP（排除隐藏文件和多余目录）
          cd "${TMP_DIR}"
          7za a -tzip -mx9 -mmt=on -xr!*.git* -xr!*__MACOSX* package.zip ./* >/dev/null
          cd "${GITHUB_WORKSPACE}"
          FINAL_ZIP="${{ env.DEVICE_CODENAME }}-${{ env.ROM_TEXT }}-${TIME}-Ak3.zip"
          mv "${TMP_DIR}/package.zip" "${FINAL_ZIP}"
          echo "PACK_NAME=${FINAL_ZIP}" >> "${GITHUB_ENV}"
          echo "Flashable ZIP created: ${FINAL_ZIP}"
          rm -rf "${TMP_DIR}"

      # ---------- 发布到 Release ----------
      - name: Auto Upload to GitHub Release
        if: env.PACK_METHOD == 'Anykernel3'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: "Star-HyperA17-Kernel-${{ github.run_number }}-${{ github.run_id }}"
          name: "Xiaomi 11 Ultra Star HyperOS A17 Kernel (Kprobes Hook, Fixed)"
          body: |
            ## Xiaomi 11 Ultra Star HyperOS A17 内核刷机包（修复版）
            - 适配 HyperOS A17 全版本
            - backslashxx/KernelSU + kprobes Hook
            - 已启用内核模块加载 (CONFIG_MODULES=y)
            - 已启用模块签名 (CONFIG_MODULE_SIG=y)
            - 已启用 SELinux 安全支持
            - 已恢复 devpts 注入回退机制
            - 不含 SUSFS，启动稳定
            - 非 GKI 通用，Anykernel3 卡刷格式
            - Clang 18 最新编译
            - do.devicecheck=0 (避免设备检查失败)
          files: ${{ env.PACK_NAME }}
          draft: false
          prerelease: false
          overwrite: true
          make_latest: true
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
