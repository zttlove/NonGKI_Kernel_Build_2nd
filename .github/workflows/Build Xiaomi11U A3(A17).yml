name: Build Kernel (A17) - Stable with Kprobes Hook (Fixed)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  TZ: Asia/Shanghai
  DEVICE_NAME: "xiaomi_11U"
  DEVICE_CODENAME: "star"
  KERNEL_ARCH: "arm64"
  KERNEL_REPO: "zttlove/android_kernel_xiaomi_sm8350_miyume"
  KERNEL_BRANCH: "main"
  CLANG_VERSION: "18.1.8"
  CLANG_URL: "https://github.com/llvm/llvm-project/releases/download/llvmorg-18.1.8/clang+llvm-18.1.8-x86_64-linux-gnu-ubuntu-18.04.tar.xz"
  DEFCONFIG_NAME: "star_defconfig"
  OUTPUT_DIR: "out"
  PACK_METHOD: "Anykernel3"
  PACK_KMODULES: "true"
  ROM_TEXT: "HyperA17"

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Kernel Source
        uses: actions/checkout@v4
        with:
          repository: ${{ env.KERNEL_REPO }}
          ref: ${{ env.KERNEL_BRANCH }}
          path: kernel
          submodules: true

      - name: Install Dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            bc bison flex libelf-dev libssl-dev \
            make python3 device-tree-compiler git curl xz-utils \
            libtinfo5 ccache p7zip-full

      # ---------- 缓存 Clang ----------
      - name: Cache Clang
        id: cache-clang
        uses: actions/cache@v4
        with:
          path: clang
          key: clang-${{ env.CLANG_VERSION }}

      - name: Download Clang
        if: steps.cache-clang.outputs.cache-hit != 'true'
        run: |
          echo "Downloading Clang ${{ env.CLANG_VERSION }}..."
          curl -L --retry 3 --retry-delay 5 -o clang.tar.xz "${{ env.CLANG_URL }}"
          mkdir -p clang
          tar -xf clang.tar.xz -C clang --strip-components=1
          rm clang.tar.xz

      - name: Verify Clang
        run: |
          if [ ! -f "clang/bin/clang" ]; then
            echo "Clang binary missing!"
            exit 1
          fi
          clang/bin/clang --version

      # ---------- 缓存 CCache ----------
      - name: Cache CCache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ runner.os }}-

      - name: Setup CCache
        run: |
          mkdir -p ~/.ccache
          echo "CCACHE_DIR=~/.ccache" >> $GITHUB_ENV
          ccache -M 4G

      # ---------- 克隆 KernelSU-Next ----------
      - name: Clone KernelSU-Next
        working-directory: kernel
        run: |
          echo "Cloning KernelSU-Next (legacy)..."
          rm -rf KernelSU
          git clone --depth=1 -b legacy https://github.com/KernelSU-Next/KernelSU-Next.git KernelSU
          if [ ! -f "KernelSU/kernel/Makefile" ]; then
            echo "ERROR: KernelSU kernel directory not found"
            exit 1
          fi
          echo "KernelSU-Next cloned successfully."

      # ---------- 清理残留的手动 Hook 调用 (Kprobe 模式必需) ----------
      - name: Remove manual hook calls for Kprobe mode
        working-directory: kernel
        run: |
          echo "=== Removing manual hook calls (Kprobe mode) ==="
          
          # 清理 fs/devpts/inode.c
           if [ -f "fs/devpts/inode.c" ]; then
            echo "Cleaning fs/devpts/inode.c..."
            sed -i '/#ifdef CONFIG_KSU/,/#endif/ { /ksu_handle_devpts/d; }' fs/devpts/inode.c
            sed -i '/extern int ksu_handle_devpts/d' fs/devpts/inode.c
            sed -i '/ksu_handle_devpts(/d' fs/devpts/inode.c
           fi
          
          # 搜索并显示其他可能的残留
          echo "=== Searching for other ksu_handle_* calls ==="
          grep -r "ksu_handle_" --include="*.c" --include="*.h" . 2>/dev/null || echo "No other manual hooks found."
          
          echo "=== Manual hooks cleanup completed ==="

      # ---------- 修复 defconfig ----------
      - name: Fix defconfig for Kprobes + Modules
        working-directory: kernel
        run: |
          set -e
          DEFCONFIG_PATH="arch/${{ env.KERNEL_ARCH }}/configs/${{ env.DEFCONFIG_NAME }}"
          if [ ! -f "$DEFCONFIG_PATH" ]; then
            echo "ERROR: Defconfig not found at $DEFCONFIG_PATH"
            exit 1
          fi
          cp $DEFCONFIG_PATH ${DEFCONFIG_PATH}.bak

          # 移除可能冲突的旧配置
          sed -i '/CONFIG_KSU/d' $DEFCONFIG_PATH
          sed -i '/CONFIG_KPROBES/d' $DEFCONFIG_PATH
          sed -i '/CONFIG_MODULES/d' $DEFCONFIG_PATH
          sed -i '/CONFIG_MODULE_SIG/d' $DEFCONFIG_PATH
          sed -i '/CONFIG_SECURITY_SELINUX/d' $DEFCONFIG_PATH
          sed -i '/CONFIG_KPROBE_EVENTS/d' $DEFCONFIG_PATH

          # 追加必需配置
          cat >> $DEFCONFIG_PATH << EOF
          # KernelSU
          CONFIG_KSU=y
          CONFIG_KSU_DEBUG=n
          CONFIG_KSU_KPROBES_HOOK=y

          # Kprobes
          CONFIG_HAVE_KPROBES=y
          CONFIG_KPROBES=y
          CONFIG_KPROBE_EVENTS=y
          CONFIG_KPROBE_EVENTS_ON_NOTRACE=y

          # Modules
          CONFIG_MODULES=y
          CONFIG_MODULE_SIG=y
          CONFIG_MODULE_SIG_SHA256=y
          CONFIG_MODULE_SIG_FORCE=n

          # SELinux
          CONFIG_SECURITY_SELINUX=y
          CONFIG_SECURITY_SELINUX_BOOTPARAM=y
          EOF

          echo "Defconfig updated successfully:"
          grep -E "CONFIG_(KSU|KPROBES|MODULES|MODULE_SIG|SELINUX)=" $DEFCONFIG_PATH

      # ---------- 设置 PATH ----------
      - name: Set PATH for Clang
        run: echo "$(pwd)/clang/bin" >> $GITHUB_PATH

      # ---------- 编译内核 ----------
      - name: Build Kernel
        working-directory: kernel
        run: |
          set -e
          echo "Starting kernel build..."
          export ARCH=${{ env.KERNEL_ARCH }}
          export LLVM=1
          export LLVM_IAS=1
          export LD=ld.lld
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export CC=clang
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          
          # 清理旧编译产物（保留配置）
          make -j$(nproc) ARCH=arm64 LLVM=1 LLVM_IAS=1 O=${{ env.OUTPUT_DIR }} mrproper || true
          
          # 配置内核
          echo "Configuring kernel..."
          make -j$(nproc) ARCH=arm64 LLVM=1 LLVM_IAS=1 O=${{ env.OUTPUT_DIR }} ${{ env.DEFCONFIG_NAME }}
          
          # 验证 Kprobe 配置
          echo "=== Verifying Kprobe configuration ==="
          grep -E "CONFIG_(KPROBES|KSU|KPROBE_EVENTS)" ${{ env.OUTPUT_DIR }}/.config || true
          
          # 编译内核
          echo "Compiling kernel..."
          make -j$(nproc) ARCH=arm64 LLVM=1 LLVM_IAS=1 O=${{ env.OUTPUT_DIR }}
          
          # 验证产物
          if [ ! -f "${{ env.OUTPUT_DIR }}/arch/arm64/boot/Image" ]; then
            echo "ERROR: Kernel image not generated!"
            exit 1
          fi
          echo "Kernel build succeeded."

      # ---------- 打包 AnyKernel3 ----------
      - name: Prepare AnyKernel3
        run: git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git anykernel3

      - name: Configure AnyKernel3
        working-directory: anykernel3
        run: |
          sed -i 's/kernel.string=.*/kernel.string=Xiaomi 11 Ultra (star) Kernel/' anykernel.sh
          sed -i 's/do.devicecheck=.*/do.devicecheck=0/' anykernel.sh
          sed -i 's/device.name1=.*/device.name1=star/' anykernel.sh
          sed -i 's/device.name2=.*/device.name2=xiaomi11ultra/' anykernel.sh
          sed -i 's/do.modules=.*/do.modules=1/' anykernel.sh
          sed -i 's/do.systemless=.*/do.systemless=1/' anykernel.sh
          sed -i 's/do.cleanup=.*/do.cleanup=1/' anykernel.sh
          sed -i 's/^BLOCK=.*/BLOCK=\/dev\/block\/by-name\/boot;/' anykernel.sh
          sed -i 's/^IS_SLOT_DEVICE=.*/IS_SLOT_DEVICE=1;/' anykernel.sh

      - name: Copy Kernel Image to AnyKernel3
        run: |
          IMG_SRC="kernel/${{ env.OUTPUT_DIR }}/arch/arm64/boot"
          if [ -f "$IMG_SRC/Image.gz-dtb" ]; then
            cp "$IMG_SRC/Image.gz-dtb" anykernel3/Image
            echo "Copied Image.gz-dtb"
          elif [ -f "$IMG_SRC/Image.gz" ]; then
            cp "$IMG_SRC/Image.gz" anykernel3/Image
            echo "Copied Image.gz"
          elif [ -f "$IMG_SRC/Image" ]; then
            cp "$IMG_SRC/Image" anykernel3/Image
            echo "Copied Image"
          else
            echo "No kernel image found!"
            exit 1
          fi

      - name: Package Flashable ZIP
        working-directory: anykernel3
        run: |
          zip -r9 "../Kernel-${{ env.DEVICE_CODENAME }}-${{ env.ROM_TEXT }}-$(date +%Y%m%d).zip" * -x "*.git*" "*.zip"
          echo "ZIP packaged successfully."

      - name: Upload Kernel ZIP
        uses: actions/upload-artifact@v4
        with:
          name: Kernel-${{ env.DEVICE_CODENAME }}-${{ env.ROM_TEXT }}
          path: Kernel-*.zip
          retention-days: 7
