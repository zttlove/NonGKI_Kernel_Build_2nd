name: NonGKI Kernel Build

on:
  workflow_dispatch:

env:
  KERNEL_SOURCE: "https://github.com/nicholaschum/unified_kernel_image"
  KERNEL_BRANCH: "lineage-21.0"
  KERNEL_DEFCONFIG: "star_defconfig"
  DEVICE_CODENAME: "star"
  ANYKERNEL3_REPO: "https://github.com/nicholaschum/AnyKernel3"
  ANYKERNEL3_BRANCH: "master"
  PACK_KMODULES: "true"
  OUTPUT_DIR: "out"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc bison build-essential cpio curl flex \
            gcc-aarch64-linux-gnu git libelf-dev \
            libssl-dev lsb-release python3 \
            zip unzip xz-utils

      - name: Clone kernel source
        run: |
          git clone --depth=1 -b ${KERNEL_BRANCH} ${KERNEL_SOURCE} kernel

      - name: Clone KernelSU
        run: |
          git clone --depth=1 https://github.com/tiann/KernelSU kernel/KernelSU

      - name: Apply KernelSU kernel patches
        working-directory: kernel
        run: |
          # 将 KernelSU 的内核补丁和源码合并到内核树中
          if [ -d "KernelSU/kernel" ]; then
            cp -rf KernelSU/kernel/* kernel/
          fi
          if [ -d "KernelSU/drivers" ]; then
            cp -rf KernelSU/drivers/* drivers/
          fi
          if [ -d "KernelSU/fs" ]; then
            cp -rf KernelSU/fs/* fs/
          fi
          if [ -d "KernelSU/security" ]; then
            cp -rf KernelSU/security/* security/
          fi
          # 合并 Kconfig 和 Makefile 片段
          if [ -f "KernelSU/kernel/Kconfig" ]; then
            grep -q "KSU" kernel/Kconfig || cat KernelSU/kernel/Kconfig >> kernel/Kconfig
          fi
          echo "KernelSU patches applied successfully"

      - name: Setup defconfig
        working-directory: kernel
        run: |
          # 复制 defconfig
          cp arch/arm64/configs/${KERNEL_DEFCONFIG} .config

          # 启用 KernelSU 支持
          echo "CONFIG_KSU=y" >> .config
          echo "CONFIG_KSU_KPROBES_HOOK=y" >> .config

          # 启用模块支持
          echo "CONFIG_MODULES=y" >> .config
          echo "CONFIG_MODULE_SIG=y" >> .config
          echo "CONFIG_MODULE_SIG_SHA256=y" >> .config

          # 启用 SELinux 支持（KernelSU 依赖）
          echo "CONFIG_SECURITY=y" >> .config
          echo "CONFIG_SECURITYFS=y" >> .config
          echo "CONFIG_SECURITY_SELINUX=y" >> .config

          # 关闭 KernelSU 调试模式
          echo "CONFIG_KSU_DEBUG=n" >> .config

          # 清空证书路径，避免加载不存在的 canonical-certs.pem
          sed -i 's/CONFIG_SYSTEM_TRUSTED_KEYS=.*/CONFIG_SYSTEM_TRUSTED_KEYS=""/' .config
          sed -i 's/CONFIG_SYSTEM_REVOCATION_KEYS=.*/CONFIG_SYSTEM_REVOCATION_KEYS=""/' .config

      - name: Setup Clang
        run: |
          mkdir -p clang
          curl -sL https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/main/clang-r487747c.tar.gz | tar xz -C clang
          echo "$(pwd)/clang/bin" >> $GITHUB_PATH

      - name: Build Kernel
        working-directory: kernel
        run: |
          export PATH="$(pwd)/../clang/bin:$PATH"

          # 第1步：配置
          make O=${OUTPUT_DIR} \
            ARCH=arm64 \
            CC=clang \
            HOSTCC=clang \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            olddefconfig

          # 第2步：再次确保证书路径为空（olddefconfig 可能重置）
          sed -i 's/CONFIG_SYSTEM_TRUSTED_KEYS=.*/CONFIG_SYSTEM_TRUSTED_KEYS=""/' ${OUTPUT_DIR}/.config
          sed -i 's/CONFIG_SYSTEM_REVOCATION_KEYS=.*/CONFIG_SYSTEM_REVOCATION_KEYS=""/' ${OUTPUT_DIR}/.config

          # 第3步：单线程预构建，确保 flask.h 等生成头文件就绪
          make O=${OUTPUT_DIR} \
            ARCH=arm64 \
            CC=clang \
            HOSTCC=clang \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            -j1 || true

          # 第4步：确认 flask.h 已生成
          if [ ! -f "${OUTPUT_DIR}/security/selinux/include/flask.h" ]; then
            echo "WARNING: flask.h not found after -j1 build, attempting to generate manually..."
            make O=${OUTPUT_DIR} \
              ARCH=arm64 \
              CC=clang \
              HOSTCC=clang \
              scripts/selinux/genheaders || true
          fi

          # 第5步：并行正式编译
          make O=${OUTPUT_DIR} \
            ARCH=arm64 \
            CC=clang \
            HOSTCC=clang \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            -j$(nproc --all)

      - name: Pack AnyKernel3 zip
        run: |
          git clone --depth=1 -b ${ANYKERNEL3_BRANCH} ${ANYKERNEL3_REPO} AnyKernel3

          # 配置 AnyKernel3
          sed -i "s/do.devicecheck=1/do.devicecheck=0/" AnyKernel3/anykernel.sh
          sed -i "s/do.modules=0/do.modules=1/" AnyKernel3/anykernel.sh
          sed -i "s/block=boot;/block=boot;/" AnyKernel3/anykernel.sh

          # 复制内核镜像
          cp kernel/${OUTPUT_DIR}/arch/arm64/boot/Image.gz-dtb AnyKernel3/ || \
          cp kernel/${OUTPUT_DIR}/arch/arm64/boot/Image.gz AnyKernel3/ || \
          cp kernel/${OUTPUT_DIR}/arch/arm64/boot/Image AnyKernel3/

          # 复制内核模块
          if [ "${PACK_KMODULES}" = "true" ]; then
            mkdir -p AnyKernel3/modules/vendor/lib/modules
            find kernel/${OUTPUT_DIR} -name "*.ko" -exec cp {} AnyKernel3/modules/vendor/lib/modules/ \;
          fi

          # 打包
          cd AnyKernel3
          zip -r9 ../AnyKernel3-${DEVICE_CODENAME}.zip *

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: AnyKernel3-${{ env.DEVICE_CODENAME }}
          path: AnyKernel3-${{ env.DEVICE_CODENAME }}.zip
