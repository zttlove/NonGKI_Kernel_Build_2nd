name: Build Kernel (A17) - Stable with Kprobes Hook (Fixed)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  TZ: Asia/Shanghai
  DEVICE_NAME: "xiaomi_11U"
  DEVICE_CODENAME: "star"
  KERNEL_ARCH: "arm64"
  KERNEL_REPO: "zttlove/android_kernel_xiaomi_sm8350_miyume"
  KERNEL_BRANCH: "main"
  CLANG_VERSION: "18.1.8"
  CLANG_URL: "https://github.com/llvm/llvm-project/releases/download/llvmorg-18.1.8/clang+llvm-18.1.8-x86_64-linux-gnu-ubuntu-18.04.tar.xz"
  DEFCONFIG_NAME: "star_defconfig"
  OUTPUT_DIR: "out"
  PACK_METHOD: "Anykernel3"
  PACK_KMODULES: "true"
  ROM_TEXT: "HyperA17"

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Kernel Source
        uses: actions/checkout@v4
        with:
          repository: ${{ env.KERNEL_REPO }}
          ref: ${{ env.KERNEL_BRANCH }}
          path: kernel
          submodules: true

      - name: Install Dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            bc bison flex libelf-dev libssl-dev \
            make python3 device-tree-compiler git curl xz-utils \
            libtinfo5 ccache p7zip-full

      - name: Cache Clang
        id: cache-clang
        uses: actions/cache@v4
        with:
          path: clang
          key: clang-${{ env.CLANG_VERSION }}-x86_64

      - name: Download Clang
        if: steps.cache-clang.outputs.cache-hit != 'true'
        run: |
          echo "Downloading Clang ${{ env.CLANG_VERSION }}..."
          curl -L --retry 3 --retry-delay 5 -o clang.tar.xz "${{ env.CLANG_URL }}"
          mkdir -p clang
          tar -xf clang.tar.xz -C clang --strip-components=1
          rm clang.tar.xz

      - name: Verify Clang
        run: |
          if [ ! -f "clang/bin/clang" ]; then
            echo "Clang binary missing!"
            exit 1
          fi
          clang/bin/clang --version

      - name: Cache CCache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-${{ runner.os }}-${{ env.KERNEL_BRANCH }}-${{ env.DEFCONFIG_NAME }}
          restore-keys: |
            ccache-${{ runner.os }}-${{ env.KERNEL_BRANCH }}-
            ccache-${{ runner.os }}-

      - name: Setup CCache
        run: |
          mkdir -p ~/.ccache
          echo "CCACHE_DIR=~/.ccache" >> $GITHUB_ENV
          ccache -M 6G

      - name: Find actual defconfig
        id: find_defconfig
        working-directory: kernel
        run: |
          echo "Searching for defconfig files in arch/${{ env.KERNEL_ARCH }}/configs..."
          find arch/${{ env.KERNEL_ARCH }}/configs -name "*defconfig" -type f | sort
          echo ""
          echo "Looking for star-related defconfig..."
          DEFCONFIG_PATH=""
          for pattern in "star_defconfig" "star_*defconfig" "*star*defconfig" "*_star_defconfig"; do
            echo "Trying pattern: $pattern"
            FOUND=$(find arch/${{ env.KERNEL_ARCH }}/configs -name "$pattern" -type f | head -1)
            if [ -n "$FOUND" ]; then
              DEFCONFIG_PATH="$FOUND"
              echo "Found: $DEFCONFIG_PATH"
              break
            fi
          done
          if [ -z "$DEFCONFIG_PATH" ]; then
            echo "Checking vendor subdirectories..."
            find arch/${{ env.KERNEL_ARCH }}/configs/vendor -name "*defconfig" -type f 2>/dev/null | grep -i star | head -5
            DEFCONFIG_PATH=$(find arch/${{ env.KERNEL_ARCH }}/configs/vendor -name "*defconfig" -type f 2>/dev/null | grep -i star | head -1)
          fi
          if [ -z "$DEFCONFIG_PATH" ]; then
            echo "ERROR: No star-related defconfig found!"
            echo "All available defconfigs:"
            find arch/${{ env.KERNEL_ARCH }}/configs -name "*defconfig" -type f
            exit 1
          fi
          DEFCONFIG_NAME=$(basename "$DEFCONFIG_PATH")
          echo "Found defconfig: $DEFCONFIG_NAME"
          echo "DEFCONFIG_NAME=$DEFCONFIG_NAME" >> $GITHUB_ENV
          echo "DEFCONFIG_PATH=$DEFCONFIG_PATH" >> $GITHUB_ENV

      - name: Clone ReSukiSU
        working-directory: kernel
        run: |
          echo "Cloning ReSukiSU (dev) into drivers/kernelsu..."
          rm -rf drivers/kernelsu
          git clone --depth=1 -b dev https://github.com/zttlove/ReSukiSU.git drivers/kernelsu
          echo "Listing cloned directory tree (first 3 levels):"
          find drivers/kernelsu -maxdepth 3 -type f | head -20
          if [ ! -f "drivers/kernelsu/kernel/Makefile" ] && [ ! -f "drivers/kernelsu/Makefile" ]; then
            echo "ERROR: No Makefile found in KernelSU clone"
            exit 1
          fi
          echo "ReSukiSU cloned successfully."

      - name: Setup KernelSU build files
        working-directory: kernel
        run: |
          echo "Setting up KernelSU build files..."
          KSU_SRC_DIR=""
          if [ -d "drivers/kernelsu/kernel" ] && [ -f "drivers/kernelsu/kernel/Makefile" ]; then
            KSU_SRC_DIR="drivers/kernelsu/kernel"
          elif [ -d "drivers/kernelsu" ] && [ -f "drivers/kernelsu/Makefile" ]; then
            KSU_SRC_DIR="drivers/kernelsu"
          else
            echo "ERROR: Could not locate KernelSU source directory"
            exit 1
          fi
          echo "KSU_SRC_DIR=$KSU_SRC_DIR" >> $GITHUB_ENV
          KSU_REL_PATH="${KSU_SRC_DIR#drivers/}"
          echo "KSU_REL_PATH=$KSU_REL_PATH" >> $GITHUB_ENV
          if [ ! -f "drivers/kernelsu/Makefile" ]; then
            echo "# KernelSU placeholder Makefile" > drivers/kernelsu/Makefile
            echo "# Actual object files are added directly in drivers/Makefile" >> drivers/kernelsu/Makefile
          fi
          if [ ! -f "drivers/kernelsu/Kconfig" ]; then
            if [ -f "$KSU_SRC_DIR/Kconfig" ]; then
              cp "$KSU_SRC_DIR/Kconfig" drivers/kernelsu/Kconfig
              echo "Copied Kconfig from $KSU_SRC_DIR to drivers/kernelsu/Kconfig"
            else
              touch drivers/kernelsu/Kconfig
            fi
          fi
          for makefile in security/selinux/Makefile security/selinux/ss/Makefile; do
            if [ -f "$makefile" ]; then
              if ! grep -q "ccflags-y += -I\$(srctree)/security/selinux/include" "$makefile"; then
                echo "ccflags-y += -I\$(srctree)/security/selinux/include" >> "$makefile"
                echo "Added include path to $makefile"
              fi
            else
              echo "Warning: $makefile not found, skipping"
            fi
          done
          sed -i '/^# KernelSU/,/^# End KernelSU/d' drivers/Makefile
          echo "# KernelSU" >> drivers/Makefile
          echo "ccflags-y += -I\$(srctree)/$KSU_SRC_DIR" >> drivers/Makefile
          echo "ccflags-y += -I\$(srctree)/$KSU_SRC_DIR/include" >> drivers/Makefile
          if [ -d "security/selinux" ]; then
            echo "ccflags-y += -I\$(srctree)/security" >> drivers/Makefile
            echo "ccflags-y += -I\$(srctree)/security/selinux" >> drivers/Makefile
            echo "ccflags-y += -I\$(srctree)/security/selinux/include" >> drivers/Makefile
            echo "ccflags-y += -I\$(srctree)/security/selinux/ss" >> drivers/Makefile
          fi
          echo -n "obj-y += " >> drivers/Makefile
          pushd $KSU_SRC_DIR > /dev/null
          find . -name "*.c" -printf "%P\n" | while read -r cfile; do
            obj="${cfile%.c}.o"
            echo -n "$KSU_REL_PATH/$obj " >> ../../Makefile
          done
          popd > /dev/null
          echo "" >> drivers/Makefile
          echo "# End KernelSU" >> drivers/Makefile
          sed -i '/^source.*kernelsu/d' drivers/Kconfig 2>/dev/null || true
          if [ -f "drivers/kernelsu/Kconfig" ]; then
            echo "source \"drivers/kernelsu/Kconfig\"" >> drivers/Kconfig
          fi
          echo "KernelSU build files setup complete."
          grep -A 5 "KernelSU" drivers/Makefile || true

      - name: Fix SELinux directory structure
        working-directory: kernel
        run: |
          echo "Fixing SELinux directory structure..."
          mkdir -p security/selinux/include
          mkdir -p security/selinux/ss
          
          echo "Creating flask.h..."
          cat > security/selinux/flask.h << 'EOF'
          /* Auto-generated flask.h */
          #define SECCLASS_NONE 0
          #define SECCLASS_SECURITY 1
          #define SECCLASS_PROCESS 2
          #define SECCLASS_SYSTEM 3
          #define SECCLASS_CAPABILITY 4
          #define SECCLASS_FILESYSTEM 5
          #define SECCLASS_FILE 6
          #define SECCLASS_DIR 7
          #define SECCLASS_FD 8
          #define SECCLASS_LNK_FILE 9
          #define SECCLASS_CHR_FILE 10
          #define SECCLASS_BLK_FILE 11
          #define SECCLASS_SOCK_FILE 12
          #define SECCLASS_FIFO_FILE 13
          #define SECCLASS_SOCKET 14
          #define SECCLASS_TCP_SOCKET 15
          #define SECCLASS_UDP_SOCKET 16
          #define SECCLASS_RAWIP_SOCKET 17
          #define SECCLASS_NODE 18
          #define SECCLASS_NETIF 19
          #define SECCLASS_NETLINK_SOCKET 20
          #define SECCLASS_PACKET_SOCKET 21
          #define SECCLASS_KEY_SOCKET 22
          #define SECCLASS_UNIX_STREAM_SOCKET 23
          #define SECCLASS_UNIX_DGRAM_SOCKET 24
          #define SECCLASS_NETLINK_ROUTE_SOCKET 25
          #define SECCLASS_NETLINK_FIREWALL_SOCKET 26
          #define SECCLASS_NETLINK_TCPDIAG_SOCKET 27
          #define SECCLASS_NETLINK_NFLOG_SOCKET 28
          #define SECCLASS_NETLINK_XFRM_SOCKET 29
          #define SECCLASS_NETLINK_SELINUX_SOCKET 30
          #define SECCLASS_NETLINK_AUDIT_SOCKET 31
          #define SECCLASS_NETLINK_IP6FW_SOCKET 32
          #define SECCLASS_NETLINK_DNRT_SOCKET 33
          #define SECCLASS_ASSOCIATION 34
          #define SECCLASS_NETLINK_KOBJECT_UEVENT_SOCKET 35
          #define SECCLASS_APPLETALK_SOCKET 36
          #define SECCLASS_DCCP_SOCKET 37
          #define SECCLASS_MEMPROTECT 38
          #define SECCLASS_PEER 39
          #define SECCLASS_CAPABILITY2 40
          #define SECCLASS_KERNEL_SERVICE 41
          #define SECCLASS_TUN_SOCKET 42
          #define SECCLASS_BPF 43
          #define SECCLASS_XDP_SOCKET 44
          #define SECCLASS_INFINIBAND_PKEY 45
          #define SECCLASS_INFINIBAND_END_PORT 46
          #define SECCLASS_DECNET_SOCKET 47
          #define SECCLASS_SCTP_SOCKET 48
          #define SECCLASS_ICMP_SOCKET 49
          #define SECCLASS_AX25_SOCKET 50
          #define SECCLASS_IPX_SOCKET 51
          #define SECCLASS_NETROM_SOCKET 52
          #define SECCLASS_ATMPVC_SOCKET 53
          #define SECCLASS_X25_SOCKET 54
          #define SECCLASS_ROSE_SOCKET 55
          #define SECCLASS_DECNET_NODE 56
          #define SECCLASS_NETLINK_ISCSI_SOCKET 57
          #define SECCLASS_NETLINK_FIB_LOOKUP_SOCKET 58
          #define SECCLASS_NETLINK_CONNECTOR_SOCKET 59
          #define SECCLASS_NETLINK_NETFILTER_SOCKET 60
          #define SECCLASS_NETLINK_GENERIC_SOCKET 61
          #define SECCLASS_NETLINK_SCSITRANSPORT_SOCKET 62
          #define SECCLASS_NETLINK_RDMA_SOCKET 63
          #define SECCLASS_NETLINK_CRYPTO_SOCKET 64
          #define SECCLASS_NETLINK_DNS_RESOLVER_SOCKET 65
          EOF
          echo "Created flask.h with all SECCLASS defines"
          
          cp security/selinux/flask.h security/selinux/include/flask.h
          
          if [ ! -f security/selinux/Makefile ]; then
            echo "Creating security/selinux/Makefile..."
            echo "obj-\$(CONFIG_SECURITY_SELINUX) := selinux.o" > security/selinux/Makefile
            echo "selinux-y := hooks.o selinuxfs.o netif.o netnode.o netport.o exports.o status.o" >> security/selinux/Makefile
            echo "selinux-y += ss/built-in.a" >> security/selinux/Makefile
            echo "ccflags-y += -I\$(srctree)/security/selinux/include" >> security/selinux/Makefile
            echo "ccflags-y += -I\$(srctree)/security/selinux/ss" >> security/selinux/Makefile
            echo "Created security/selinux/Makefile"
          fi
          if [ ! -f security/selinux/ss/Makefile ]; then
            echo "Creating security/selinux/ss/Makefile..."
            echo "obj-y := avc.o services.o context.o ebitmap.o hashtab.o sidtab.o symtab.o mls.o conditional.o policy.o constraint.o policydb.o" > security/selinux/ss/Makefile
            echo "Created security/selinux/ss/Makefile"
          fi
          echo "SELinux fix completed."

      - name: Generate defconfig with found config
        working-directory: kernel
        run: |
          echo "Using defconfig: ${{ env.DEFCONFIG_NAME }}"
          make ARCH=${{ env.KERNEL_ARCH }} ${{ env.DEFCONFIG_NAME }}

      - name: Fix defconfig for Kprobes + Modules + SUSFS
        working-directory: kernel
        run: |
          set -e
          DEFCONFIG_PATH="arch/${{ env.KERNEL_ARCH }}/configs/${{ env.DEFCONFIG_NAME }}"
          if [ ! -f "$DEFCONFIG_PATH" ]; then
            DEFCONFIG_PATH="${{ env.DEFCONFIG_PATH }}"
          fi
          if [ ! -f "$DEFCONFIG_PATH" ]; then
            echo "ERROR: Defconfig not found at $DEFCONFIG_PATH"
            exit 1
          fi
          echo "Modifying defconfig: $DEFCONFIG_PATH"
          cp $DEFCONFIG_PATH ${DEFCONFIG_PATH}.bak
          sed -i '/^CONFIG_KSU/d' $DEFCONFIG_PATH
          sed -i '/^CONFIG_KPROBES/d' $DEFCONFIG_PATH
          sed -i '/^CONFIG_MODULES/d' $DEFCONFIG_PATH
          sed -i '/^CONFIG_MODULE_SIG/d' $DEFCONFIG_PATH
          sed -i '/^CONFIG_SECURITY_SELINUX/d' $DEFCONFIG_PATH
          sed -i '/^CONFIG_KPROBE_EVENTS/d' $DEFCONFIG_PATH
          sed -i '/^CONFIG_SUSFS/d' $DEFCONFIG_PATH
          cat >> $DEFCONFIG_PATH << 'EOF'
          # KernelSU
          CONFIG_KSU=y
          CONFIG_KSU_DEBUG=n
          CONFIG_KSU_KPROBES_HOOK=y
          CONFIG_KSU_USE_KPROBES=y
          # SUSFS (Required by ReSukiSU)
          CONFIG_KSU_SUSFS=y
          CONFIG_KSU_SUSFS_SUS_SU=y
          CONFIG_KSU_SUSFS_SUS_MOUNT=y
          CONFIG_KSU_SUSFS_SUS_KSTAT=y
          CONFIG_KSU_SUSFS_OPEN_REDIRECT=y
          CONFIG_KSU_SUSFS_SUS_MAP=y
          CONFIG_KSU_SUSFS_HIDE_MAGIC_MOUNTS=y
          # Kprobes
          CONFIG_HAVE_KPROBES=y
          CONFIG_KPROBES=y
          CONFIG_KPROBE_EVENTS=y
          CONFIG_KPROBE_EVENTS_ON_NOTRACE=y
          # Modules
          CONFIG_MODULES=y
          CONFIG_MODULE_SIG=y
          CONFIG_MODULE_SIG_SHA256=y
          CONFIG_MODULE_SIG_FORCE=n
          # SELinux
          CONFIG_SECURITY=y
          CONFIG_SECURITY_SELINUX=y
          CONFIG_SECURITY_SELINUX_BOOTPARAM=y
          CONFIG_SECURITY_SELINUX_DISABLE=y
          CONFIG_FRAME_WARN=4096
          EOF
          echo "Defconfig updated successfully with SUSFS support."

      - name: Set PATH for Clang
        run: echo "$(pwd)/clang/bin" >> $GITHUB_PATH

      - name: Build Kernel
        working-directory: kernel
        run: |
          set -e
          echo "Starting kernel build..."
          export ARCH=${{ env.KERNEL_ARCH }}
          export LLVM=1
          export LLVM_IAS=1
          export LD=ld.lld
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export CC=clang
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          
          echo "Cleaning kernel source tree..."
          make ARCH=arm64 mrproper 2>/dev/null || true
          rm -rf ${{ env.OUTPUT_DIR }}
          
          echo "Configuring kernel with ${{ env.DEFCONFIG_NAME }}..."
          make -j$(nproc) ARCH=arm64 LLVM=1 LLVM_IAS=1 O=${{ env.OUTPUT_DIR }} ${{ env.DEFCONFIG_NAME }}
          
          echo "=== Verifying configuration ==="
          grep -E "CONFIG_(KPROBES|KSU|KPROBE_EVENTS|KSU_USE_KPROBES|KSU_SUSFS)" ${{ env.OUTPUT_DIR }}/.config || true
          echo "=== Checking drivers Makefile for KernelSU ==="
          grep -A 5 "KernelSU" drivers/Makefile || true
          
          echo "Compiling kernel..."
          make -j$(nproc) ARCH=arm64 LLVM=1 LLVM_IAS=1 O=${{ env.OUTPUT_DIR }} \
            KCFLAGS="-DCONFIG_KSU=1 -DCONFIG_KSU_USE_KPROBES=1 -DCONFIG_KSU_SUSFS=1 -Wno-strict-prototypes -Wno-align-mismatch -Wno-unused-function -Wno-array-parameter -Wno-void-pointer-to-int-cast -Wno-sometimes-uninitialized -Wno-compare-distinct-pointer-types -Wno-pointer-to-int-cast -Wno-uninitialized"
          
          if [ ! -f "${{ env.OUTPUT_DIR }}/arch/arm64/boot/Image" ]; then
            echo "ERROR: Kernel image not generated!"
            exit 1
          fi
          echo "Kernel build succeeded."

      - name: Clone AnyKernel3
        run: git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git anykernel3

      - name: Collect Kernel Modules
        if: env.PACK_KMODULES == 'true'
        working-directory: kernel
        run: |
          echo "Collecting kernel modules from ${{ env.OUTPUT_DIR }}..."
          MODULE_DIR="${{ env.OUTPUT_DIR }}/modules_tmp"
          mkdir -p "$MODULE_DIR"
          make -j$(nproc) ARCH=arm64 LLVM=1 LLVM_IAS=1 O=${{ env.OUTPUT_DIR }} \
            INSTALL_MOD_PATH="$MODULE_DIR" modules_install
          mkdir -p ../anykernel3/modules/system/lib/modules
          find "$MODULE_DIR" -name "*.ko" -exec cp --parents {} ../anykernel3/modules/system/lib/modules/ \;
          echo "Modules collected."

      - name: Configure AnyKernel3
        working-directory: anykernel3
        run: |
          sed -i 's/kernel.string=.*/kernel.string=Xiaomi 11 Ultra (star) Kernel/' anykernel.sh
          sed -i 's/do.devicecheck=.*/do.devicecheck=0/' anykernel.sh
          sed -i 's/device.name1=.*/device.name1=star/' anykernel.sh
          sed -i 's/device.name2=.*/device.name2=xiaomi11ultra/' anykernel.sh
          if [ "${{ env.PACK_KMODULES }}" == "true" ]; then
            sed -i 's/do.modules=.*/do.modules=1/' anykernel.sh
          else
            sed -i 's/do.modules=.*/do.modules=0/' anykernel.sh
          fi
          sed -i 's/do.systemless=.*/do.systemless=1/' anykernel.sh
          sed -i 's/do.cleanup=.*/do.cleanup=1/' anykernel.sh
          sed -i 's/^BLOCK=.*/BLOCK=\/dev\/block\/by-name\/boot;/' anykernel.sh
          sed -i 's/^IS_SLOT_DEVICE=.*/IS_SLOT_DEVICE=1;/' anykernel.sh

      - name: Copy Kernel Image to AnyKernel3
        run: |
          IMG_SRC="kernel/${{ env.OUTPUT_DIR }}/arch/arm64/boot"
          if [ -f "$IMG_SRC/Image.gz-dtb" ]; then
            cp "$IMG_SRC/Image.gz-dtb" anykernel3/Image
          elif [ -f "$IMG_SRC/Image.gz" ]; then
            cp "$IMG_SRC/Image.gz" anykernel3/Image
          elif [ -f "$IMG_SRC/Image" ]; then
            cp "$IMG_SRC/Image" anykernel3/Image
          else
            echo "No kernel image found!"
            exit 1
          fi

      - name: Package Flashable ZIP
        working-directory: anykernel3
        run: |
          zip -r9 "../Kernel-${{ env.DEVICE_CODENAME }}-${{ env.ROM_TEXT }}-$(date +%Y%m%d-%H%M).zip" * -x "*.git*" "*.zip"
          echo "ZIP packaged successfully."

      - name: Upload Kernel ZIP
        uses: actions/upload-artifact@v4
        with:
          name: Kernel-${{ env.DEVICE_CODENAME }}-${{ env.ROM_TEXT }}
          path: Kernel-*.zip
          retention-days: 7
