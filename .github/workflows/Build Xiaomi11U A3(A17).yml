name: Build Kernel (A17) - Stable with Kprobes Hook (No SUSFS)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  TZ: Asia/Shanghai
  DEVICE_NAME: "xiaomi_11U"
  DEVICE_CODENAME: "star"
  KERNEL_ARCH: "arm64"
  KERNEL_REPO: "zttlove/android_kernel_xiaomi_sm8350_miyume"
  KERNEL_BRANCH: "main"
  CLANG_SOURCE: "https://github.com/llvm/llvm-project/releases/download/llvmorg-18.1.8/clang+llvm-18.1.8-x86_64-linux-gnu-ubuntu-18.04.tar.xz"
  DEFCONFIG_NAME: "star_defconfig"
  OUTPUT_DIR: "out"
  PACK_METHOD: "Anykernel3"
  PACK_KMODULES: "false"
  ROM_TEXT: "HyperA17"

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Kernel Source
        uses: actions/checkout@v4
        with:
          repository: ${{ env.KERNEL_REPO }}
          ref: ${{ env.KERNEL_BRANCH }}
          path: kernel
          submodules: true

      - name: Install Dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            bc bison flex libelf-dev libssl-dev \
            make python3 device-tree-compiler git curl xz-utils \
            libtinfo5 ccache p7zip-full

      # -------- KernelSU 克隆及彻底禁用 devpts hook --------
      - name: Clone backslashxx/KernelSU
        working-directory: kernel
        run: |
          echo "========================================="
          echo "🔧 Cloning backslashxx/KernelSU (master)..."
          echo "========================================="
          rm -rf KernelSU
          git clone --depth=1 -b master https://github.com/backslashxx/KernelSU.git KernelSU
          if [ -f "KernelSU/kernel/Makefile" ]; then
            echo "✅ KernelSU cloned successfully"
          else
            echo "❌ Failed to clone KernelSU"
            exit 1
          fi

      - name: Completely disable devpts hook (kernel core + KernelSU)
        working-directory: kernel
        run: |
          echo "🔧 Disabling devpts hook from kernel core and KernelSU..."
          
          # 1. 从 KernelSU 中删除所有 devpts 相关源码，并修改 Makefile 避免编译
          find KernelSU -type f -name "*devpts*" -delete
          sed -i '/devpts/d' KernelSU/kernel/Makefile 2>/dev/null || true
          sed -i '/ksu_devpts/d' KernelSU/kernel/Makefile 2>/dev/null || true
          
          # 2. 在内核核心代码中（排除 KernelSU 目录）注释掉所有对 ksu_handle_devpts 的调用
          #    在包含该函数调用的行首添加 //，确保编译时被忽略
          find . -path ./KernelSU -prune -o -type f \( -name "*.c" -o -name "*.h" \) -exec grep -l "ksu_handle_devpts" {} \; | while read file; do
            echo "Patching $file"
            sed -i '/ksu_handle_devpts/s/^/\/\//' "$file"
          done
          
          # 3. 清空 KernelSU 的 hook 检查文件（与原意一致）
          for f in KernelSU/kernel/tools/*_check.mk; do
            if [ -f "$f" ]; then
              echo "# Disabled by CI" > "$f"
              echo "✅ $(basename $f) cleared"
            fi
          done
          
          echo "✅ devpts hook disabled completely"

      # -------- 启用 KernelSU + kprobes Hook（不含 SUSFS） --------
      - name: Enable KernelSU and kprobes in defconfig
        working-directory: kernel
        run: |
          echo "🔧 Enabling KernelSU with kprobes hook (NO SUSFS)..."
          DEFCONFIG_PATH="arch/${{ env.KERNEL_ARCH }}/configs/${{ env.DEFCONFIG_NAME }}"
          cp $DEFCONFIG_PATH ${DEFCONFIG_PATH}.bak
          
          # 清理可能冲突的配置（如果之前有）
          sed -i '/CONFIG_KSU/d' $DEFCONFIG_PATH
          sed -i '/CONFIG_KPROBES/d' $DEFCONFIG_PATH
          
          # KernelSU 基础（必须）
          echo "CONFIG_KSU=y" >> $DEFCONFIG_PATH
          echo "CONFIG_KSU_DEBUG=y" >> $DEFCONFIG_PATH
          
          # 关键：启用 kprobes hook（用于 Zygisk）
          echo "CONFIG_KPROBES=y" >> $DEFCONFIG_PATH
          echo "CONFIG_HAVE_KPROBES=y" >> $DEFCONFIG_PATH
          echo "CONFIG_KPROBE_EVENTS=y" >> $DEFCONFIG_PATH
          echo "CONFIG_KPROBE_EVENTS_ON_NOTRACE=y" >> $DEFCONFIG_PATH
          echo "CONFIG_KSU_KPROBES_HOOK=y" >> $DEFCONFIG_PATH
          echo "CONFIG_KSU_WITH_KPROBES=y" >> $DEFCONFIG_PATH  # 如果存在
          
          # 禁用 devpts（避免冲突）
          echo "# CONFIG_KSU_DEVPTR_HOOK is not set" >> $DEFCONFIG_PATH
          echo "# CONFIG_KSU_SUSFS is not set" >> $DEFCONFIG_PATH
          
          # 额外：确保内核调试支持（Zygisk Next 需要）
          echo "CONFIG_HAVE_KPROBES_ON_FTRACE=y" >> $DEFCONFIG_PATH
          echo "CONFIG_KPROBES_CALLBACK_EVENT=y" >> $DEFCONFIG_PATH
          echo "CONFIG_ARCH_HAS_KPROBES=y" >> $DEFCONFIG_PATH
          
          echo "✅ Defconfig updated with full kprobes support"

      - name: Download Clang
        run: |
          echo "📥 Downloading Clang..."
          curl -L --retry 3 --retry-delay 5 -o clang.tar.xz "${{ env.CLANG_SOURCE }}"
          if [ ! -s clang.tar.xz ]; then
            echo "❌ Failed to download Clang"
            exit 1
          fi
          mkdir -p clang
          tar -xf clang.tar.xz -C clang --strip-components=1
          if [ ! -f "clang/bin/clang" ]; then
            echo "❌ Clang binary not found!"
            exit 1
          fi
          clang/bin/clang --version
          echo "$(pwd)/clang/bin" >> $GITHUB_PATH

      - name: Setup CCache
        run: |
          mkdir -p ~/.ccache
          echo "CCACHE_DIR=~/.ccache" >> $GITHUB_ENV
          ccache -M 2G

      # -------- 编译内核 --------
      - name: Build Kernel
        working-directory: kernel
        run: |
          set -e
          echo "🚀 Starting kernel build..."
          export ARCH=${{ env.KERNEL_ARCH }}
          export LLVM=1
          export LLVM_IAS=1
          export LD=ld.lld
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export CC=clang
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          
          echo "📝 Configuring kernel..."
          make -j$(nproc --all) ARCH=arm64 LLVM=1 LLVM_IAS=1 O=${{ env.OUTPUT_DIR }} ${{ env.DEFCONFIG_NAME }}
          
          echo "🔨 Building kernel..."
          make -j$(nproc --all) ARCH=arm64 LLVM=1 LLVM_IAS=1 O=${{ env.OUTPUT_DIR }}
          
          if [ -f "${{ env.OUTPUT_DIR }}/arch/arm64/boot/Image" ]; then
            echo "✅ Kernel built successfully!"
          else
            echo "❌ Kernel build failed"
            exit 1
          fi

      # -------- 打包和发布 --------
      - name: List boot directory
        run: ls -la kernel/${{ env.OUTPUT_DIR }}/arch/arm64/boot/

      - name: Prepare AnyKernel3
        run: git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git anykernel3

      - name: Setup AnyKernel3
        working-directory: anykernel3
        run: |
          sed -i 's/kernel.string=.*/kernel.string=Xiaomi 11 Ultra (star) Kernel/' anykernel.sh
          sed -i 's/do.devicecheck=.*/do.devicecheck=1/' anykernel.sh
          sed -i 's/device.name1=.*/device.name1=star/' anykernel.sh
          sed -i 's/device.name2=.*/device.name2=xiaomi11ultra/' anykernel.sh
          sed -i 's/do.modules=.*/do.modules=0/' anykernel.sh
          sed -i 's/do.systemless=.*/do.systemless=1/' anykernel.sh
          sed -i 's/do.cleanup=.*/do.cleanup=1/' anykernel.sh
          sed -i 's/^BLOCK=.*/BLOCK=\/dev\/block\/by-name\/boot;/' anykernel.sh
          sed -i 's/^IS_SLOT_DEVICE=.*/IS_SLOT_DEVICE=1;/' anykernel.sh

      - name: Copy Kernel Image
        run: |
          cd kernel/${{ env.OUTPUT_DIR }}/arch/arm64/boot/
          if [ -f Image.gz-dtb ]; then
            cp Image.gz-dtb ../../../../../anykernel3/Image
          elif [ -f Image.gz ]; then
            cp Image.gz ../../../../../anykernel3/Image
          elif [ -f Image ]; then
            cp Image ../../../../../anykernel3/Image
          else
            echo "❌ No kernel image found!"
            exit 1
          fi

      - name: 📦 Package Anykernel3 Flash Zip
        if: env.PACK_METHOD == 'Anykernel3'
        shell: bash
        run: |
          set -euo pipefail
          echo "============================================="
          echo "📦 开始打包 Star Hyper A17 内核卡刷包"
          echo "============================================="
          TIME=$(TZ=Asia/Shanghai date +"%Y-%m-%d")
          KERNEL_DIR="${GITHUB_WORKSPACE}/kernel"
          TMP_DIR="${KERNEL_DIR}/tmp"
          IMG_PATH="${KERNEL_DIR}/${OUTPUT_DIR}/arch/arm64/boot/Image"
          cd "${KERNEL_DIR}"
          if [[ ! -f "${IMG_PATH}" ]]; then
            echo "::error::❌ 编译失败，未找到 ${OUTPUT_DIR}/arch/arm64/boot/Image 内核文件"
            exit 1
          fi
          IMG_SIZE=$(du -h "${IMG_PATH}" | awk '{print $1}')
          echo "✅ 检测到内核镜像 Image | 大小: ${IMG_SIZE}"
          rm -rf "${TMP_DIR}"
          mkdir -p "${TMP_DIR}"
          AK3_DIR="${GITHUB_WORKSPACE}/anykernel3"
          if [[ -d "${AK3_DIR}" ]]; then
            cp -rp "${AK3_DIR}"/* "${TMP_DIR}/"
            echo "✅ AnyKernel3 文件已复制"
          else
            echo "::error::❌ AnyKernel3 目录不存在"
            exit 1
          fi
          cp -v "${IMG_PATH}" "${TMP_DIR}/Image"
          if [[ "${{ env.PACK_KMODULES }}" == "true" ]]; then
            MOD_DIR="${TMP_DIR}/modules/vendor/lib/modules"
            mkdir -p "${MOD_DIR}"
            find "${KERNEL_DIR}" -name "*.ko" -type f -print0 | xargs -0 -r cp -t "${MOD_DIR}/" 2>/dev/null || true
            module_count=$(find "${MOD_DIR}" -name "*.ko" | wc -l)
            echo "📦 打包内核模块: ${module_count} 个"
            if [[ ${module_count} -eq 0 ]]; then
              rm -rf "${TMP_DIR}/modules"
              echo "ℹ️ 未找到模块文件，移除 modules 目录"
            fi
          else
            echo "ℹ️ 已关闭模块打包，跳过 ko 文件"
          fi
          cd "${TMP_DIR}"
          7za a -tzip -mx9 -mmt=on package.zip ./* >/dev/null
          cd "${GITHUB_WORKSPACE}"
          FINAL_ZIP="${{ env.DEVICE_CODENAME }}-${{ env.ROM_TEXT }}-${TIME}-Ak3.zip"
          cp -fp "${TMP_DIR}/package.zip" "${FINAL_ZIP}"
          echo "PACK_NAME=${FINAL_ZIP}" >> "${GITHUB_ENV}"
          echo "✅ 刷机包打包完成: ${FINAL_ZIP}"
          rm -rf "${TMP_DIR}"

      - name: 🚀 Auto Upload To Github Release
        if: env.PACK_METHOD == 'Anykernel3'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: Star-HyperA17-Kernel-${{ github.run_number }}
          name: Xiaomi 11 Ultra Star HyperOS A17 Kernel (Kprobes Hook, No SUSFS)
          body: |
            ## Xiaomi 11 Ultra Star HyperOS A17 内核刷机包（稳定版）
            - 适配 HyperOS A17 全版本
            - backslashxx/KernelSU + kprobes Hook
            - 确保 Zygisk 模块正常工作
            - 不含 SUSFS，启动稳定
            - 非 GKI 通用，Anykernel3 卡刷格式
            - Clang 18 最新编译
          files: ${{ env.PACK_NAME }}
          draft: false
          prerelease: false
          overwrite: true
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
