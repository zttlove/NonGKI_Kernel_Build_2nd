name: Build Kernel (A17) - zttlove KernelSU (Fixed)

on:
  workflow_dispatch:

env:
  TZ: Asia/Shanghai
  DEVICE_CODENAME: "star"
  KERNEL_ARCH: "arm64"
  KERNEL_REPO: "zttlove/android_kernel_xiaomi_sm8350_miyume"
  KERNEL_BRANCH: "main"
  # 严格使用你指定的配置
  KERNELSU_REPO: "https://github.com/backslashxx/KernelSU"
  KERNELSU_BRANCH: "master"
  DEFCONFIG_NAME: "star_defconfig"
  OUTPUT_DIR: "out"
  PACK_METHOD: "Anykernel3"
  PACK_KMODULES: "true"
  ROM_TEXT: "HyperA17"

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Kernel Source
        uses: actions/checkout@v4
        with:
          repository: ${{ env.KERNEL_REPO }}
          ref: ${{ env.KERNEL_BRANCH }}
          path: kernel

      - name: Install Dependencies (Fully Fixed)
        run: |
          sudo apt update
          sudo apt install -y \
            bc bison flex libelf-dev libssl-dev libncurses-dev \
            make python3 device-tree-compiler git curl xz-utils \
            ccache p7zip-full

          # 关键修复：处理 Clang 依赖 libtinfo.so.5 缺失的问题
          if ! sudo apt install -y libtinfo5 2>/dev/null; then
            echo "libtinfo5 包不存在，创建兼容性软链接..."
            sudo ln -sf /lib/x86_64-linux-gnu/libtinfo.so.6 /lib/x86_64-linux-gnu/libtinfo.so.5
          fi

      - name: Download & Verify Clang
        run: |
          echo "Setting up Clang..."
          mkdir -p clang
          curl -L --retry 3 -o clang.tar.xz "https://github.com/llvm/llvm-project/releases/download/llvmorg-18.1.8/clang+llvm-18.1.8-x86_64-linux-gnu-ubuntu-18.04.tar.xz"
          tar -xf clang.tar.xz -C clang --strip-components=1
          rm clang.tar.xz
          clang/bin/clang --version

      - name: Setup KernelSU (Manual Wrapper for zttlove)
        working-directory: kernel
        run: |
          set -e
          echo "Cloning KernelSU from ${{ env.KERNELSU_REPO }} branch ${{ env.KERNELSU_BRANCH }}"
    
          # 1. 清理并克隆
          rm -rf drivers/kernelsu
          git clone --depth=1 -b ${{ env.KERNELSU_BRANCH }} ${{ env.KERNELSU_REPO }} drivers/kernelsu

          # 2. 关键步骤：在 drivers/kernelsu/ 下创建包装文件，指向真正的 kernel/ 子目录
          echo "source \"drivers/kernelsu/kernel/Kconfig\"" > drivers/kernelsu/Kconfig
          echo "obj-y += kernel/" > drivers/kernelsu/Makefile
    
          # 3. 集成到顶层的 Kconfig 和 Makefile
          # 先清理掉可能导致报错的旧引用（如果有）
          sed -i '/source "drivers\/kernelsu\/Kconfig"/d' drivers/Kconfig
          sed -i '/obj-\$(CONFIG_KSU) += kernelsu\//d' drivers/Makefile
    
          # 然后加入正确的引用
          echo "source \"drivers/kernelsu/Kconfig\"" >> drivers/Kconfig
          echo "obj-\$(CONFIG_KSU) += kernelsu/" >> drivers/Makefile
    
          echo "KernelSU setup successful!"
    
      - name: Build Kernel (Manual Hook Enabled)
        working-directory: kernel
        run: |
          set -e
          export ARCH=${{ env.KERNEL_ARCH }}
          
          # 关键修复：将 clang/bin 加入 PATH
          export PATH="${{ github.workspace }}/clang/bin:$PATH"
          
          # 或者更稳定的方法：直接用绝对路径指定 LD
          export LD="${{ github.workspace }}/clang/bin/ld.lld"
          
          export LLVM=1
          export LLVM_IAS=1
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export CC=clang
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-

          make ARCH=arm64 mrproper 2>/dev/null || true
          rm -rf ${{ env.OUTPUT_DIR }}
          make -j$(nproc) ARCH=arm64 LLVM=1 LLVM_IAS=1 O=${{ env.OUTPUT_DIR }} ${{ env.DEFCONFIG_NAME }}
          scripts/config --file ${{ env.OUTPUT_DIR }}/.config --enable KSU
          scripts/config --file ${{ env.OUTPUT_DIR }}/.config --disable KSU_MANUAL_HOOK
          scripts/config --file ${{ env.OUTPUT_DIR }}/.config --enable KPROBES
          scripts/config --file ${{ env.OUTPUT_DIR }}/.config --enable HAVE_KPROBES
          scripts/config --file ${{ env.OUTPUT_DIR }}/.config --enable KPROBE_EVENTS
          scripts/config --file ${{ env.OUTPUT_DIR }}/.config --enable KSU_SELINUX
          scripts/config --file ${{ env.OUTPUT_DIR }}/.config --enable KSU_ZYGISK
          scripts/config --file ${{ env.OUTPUT_DIR }}/.config --enable KALLSYMS
          scripts/config --file ${{ env.OUTPUT_DIR }}/.config --enable KALLSYMS_ALL
          scripts/config --file ${{ env.OUTPUT_DIR }}/.config --enable KSU_SUSFS
          scripts/config --file ${{ env.OUTPUT_DIR }}/.config --enable KSU_SUSFS_KSTAT
          scripts/config --file ${{ env.OUTPUT_DIR }}/.config --enable KSU_SUSFS_SPOOF_UNAME
          scripts/config --file ${{ env.OUTPUT_DIR }}/.config --enable KSU_SUSFS_SUS_MOUNT
          scripts/config --file ${{ env.OUTPUT_DIR }}/.config --enable MODULES
          scripts/config --file ${{ env.OUTPUT_DIR }}/.config --enable OVERLAY_FS
          
          make ARCH=arm64 olddefconfig O=${{ env.OUTPUT_DIR }}
          make -j$(nproc) ARCH=arm64 LLVM=1 LLVM_IAS=1 O=${{ env.OUTPUT_DIR }} \
          KCFLAGS="-Wno-strict-prototypes -Wno-align-mismatch -Wno-unused-function -Wno-array-parameter -Wno-void-pointer-to-int-cast -Wno-sometimes-uninitialized -Wno-compare-distinct-pointer-types -Wno-pointer-to-int-cast -Wno-uninitialized
          -Wno-frame-larger-than"

          IMG=${{ env.OUTPUT_DIR }}/arch/arm64/boot/Image
          if [ ! -f "${IMG}" ]; then
            echo "ERROR: Image not found"
            exit 1
          fi

      - name: Clone AnyKernel3 & Package
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git anykernel3
          cp kernel/${{ env.OUTPUT_DIR }}/arch/arm64/boot/Image anykernel3/
          
          # 打包 ZIP
          cd anykernel3
          TIME=$(TZ=Asia/Shanghai date +"%Y-%m-%d")
          FINAL_ZIP="${{ env.DEVICE_CODENAME }}-${{ env.ROM_TEXT }}-${TIME}-Ak3.zip"
          # 打包所有文件
          zip -r9 "$FINAL_ZIP" . -x "*.git*"
          echo "PACK_NAME=$(pwd)/$FINAL_ZIP" >> $GITHUB_ENV
          
         

      - name: 🚀 Auto Upload To Github Release
        if: env.PACK_METHOD == 'Anykernel3'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: Star-${{ env.ROM_TEXT }}-Kernel-${{ github.run_number }}
          name: Xiaomi 11 Ultra Star ${{ env.ROM_TEXT }} NonGKI Kernel
          body: |
            ## Xiaomi 11 Ultra Star ${{ env.ROM_TEXT }} 内核刷机包
            - 适配 HyperOS ${{ env.ROM_TEXT }} 全版本
            - SukiSU ResukiSU Root 完整适配
            - SUSFS 隐藏文件系统免补丁
            - NonGKI 通用免解boot补丁
            - Osm0sis Anykernel3 官方卡刷格式
            - Clang 18 最新编译
          files: ${{ env.PACK_NAME }}
          draft: false
          prerelease: false
          overwrite_files: true
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
