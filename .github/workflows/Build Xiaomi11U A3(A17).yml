name: Build Kernel (A17)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  TZ: Asia/Shanghai
  DEVICE_NAME: "xiaomi_11U"
  DEVICE_CODENAME: "star"
  KERNEL_ARCH: "arm64"
  KERNEL_REPO: "zttlove/android_kernel_xiaomi_sm8350_miyume"
  KERNEL_BRANCH: "main"
  CLANG_SOURCE: "https://github.com/llvm/llvm-project/releases/download/llvmorg-18.1.8/clang+llvm-18.1.8-x86_64-linux-gnu-ubuntu-18.04.tar.xz"
  DEFCONFIG_NAME: "star_defconfig"
  OUTPUT_DIR: "out"
  PACK_METHOD: "Anykernel3"
  PACK_KMODULES: "false"
  ROM_TEXT: "HyperA17"

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Kernel Source
        uses: actions/checkout@v4
        with:
          repository: ${{ env.KERNEL_REPO }}
          ref: ${{ env.KERNEL_BRANCH }}
          path: kernel
          submodules: true

      - name: Install Dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            bc bison flex libelf-dev libssl-dev \
            make python3 device-tree-compiler git curl xz-utils \
            libtinfo5 ccache

      # -------- KernelSU (ReSukiSU) 集成 --------
      - name: Fix KernelSU Submodule (Use Official ReSukiSU)
        working-directory: kernel
        run: |
          echo "========================================="
          echo "🔧 Fixing KernelSU submodule"
          echo "========================================="
          rm -rf KernelSU
          echo "📥 Cloning Official ReSukiSU (latest)..."
          git clone --depth=1 https://github.com/ReSukiSU/ReSukiSU.git KernelSU
          if [ -f "KernelSU/kernel/Makefile" ]; then
            echo "✅ ReSukiSU cloned successfully"
            echo "📋 Version info:"
            grep -E "VERSION_CODE|VERSION_NAME" KernelSU/kernel/Makefile || true
          else
            echo "❌ Failed to clone ReSukiSU"
            exit 1
          fi
          echo "✅ ReSukiSU submodule fixed"

      - name: Integrate ReSukiSU
        working-directory: kernel
        run: |
          set -e
          echo "========================================="
          echo "🔧 Integrating ReSukiSU"
          echo "========================================="
          echo "📥 Downloading ReSukiSU setup script..."
          curl -LSs "https://raw.githubusercontent.com/ReSukiSU/ReSukiSU/main/kernel/setup.sh" -o /tmp/setup.sh
          chmod +x /tmp/setup.sh
          echo "🚀 Running ReSukiSU integration..."
          bash /tmp/setup.sh main
          # 验证集成
          if grep -q "KernelSU/kernel" KernelSU/kernel/Makefile 2>/dev/null; then
            echo "✅ Integration seems successful (Makefile modified)"
          else
            echo "⚠️ Warning: Makefile may not have been modified, but continuing..."
          fi
          rm -f /tmp/setup.sh
          echo "========================================="
          echo "✅ ReSukiSU integration completed!"
          echo "========================================="

      - name: Disable all ReSukiSU hook checks
        working-directory: kernel
        run: |
          echo "========================================="
          echo "🔧 Disabling all ReSukiSU hook check files"
          echo "========================================="
          for f in KernelSU/kernel/tools/*_check.mk; do
            if [ -f "$f" ]; then
              echo "# Disabled by CI" > "$f"
              echo "✅ $(basename $f) cleared"
            fi
          done
          echo "✅ All hook checks disabled"

      # -------- 集成 SUSFS 2.1（直接从 kernel_patches 复制源码） --------
      - name: Integrate SUSFS 2.1
        working-directory: kernel
        run: |
          echo "========================================="
          echo "🔧 Integrating SUSFS 2.1"
          echo "========================================="
          
          # 克隆仓库（master 分支）
          git clone --depth=1 https://gitlab.com/simonpunk/susfs4ksu.git
          
          # 1) 复制 fs/susfs 目录（优先从 kernel_patches 复制）
          if [ -d "susfs4ksu/kernel_patches/fs/susfs" ]; then
            mkdir -p fs
            cp -r susfs4ksu/kernel_patches/fs/susfs fs/
            echo "✅ Copied fs/susfs from kernel_patches"
          elif [ -d "susfs4ksu/fs/susfs" ]; then
            mkdir -p fs
            cp -r susfs4ksu/fs/susfs fs/
            echo "✅ Copied fs/susfs from root"
          else
            echo "❌ fs/susfs not found in susfs4ksu"
            exit 1
          fi
          
          # 2) 复制头文件
          if [ -f "susfs4ksu/kernel_patches/include/linux/susfs.h" ]; then
            mkdir -p include/linux
            cp susfs4ksu/kernel_patches/include/linux/susfs.h include/linux/
            echo "✅ Copied susfs.h from kernel_patches"
          elif [ -f "susfs4ksu/include/linux/susfs.h" ]; then
            mkdir -p include/linux
            cp susfs4ksu/include/linux/susfs.h include/linux/
            echo "✅ Copied susfs.h from root"
          else
            echo "❌ susfs.h not found"
            exit 1
          fi
          
          # 3) 修改 fs/Kconfig 和 fs/Makefile
          grep -q "source \"fs/susfs/Kconfig\"" fs/Kconfig || sed -i '/^menu "File systems"/a source "fs/susfs/Kconfig"' fs/Kconfig
          grep -q "obj-y += susfs/" fs/Makefile || echo "obj-y += susfs/" >> fs/Makefile
          echo "✅ fs/Kconfig and fs/Makefile updated"
          
          # 4) 确保 KernelSU 的 Kconfig 包含 CONFIG_KSU_SUSFS
          cd KernelSU
          grep -q "config KSU_SUSFS" kernel/Kconfig || echo -e "\nconfig KSU_SUSFS\n\tbool \"SUSFS support\"\n\tdefault y" >> kernel/Kconfig
          cd ..
          
          # 5) 清理
          rm -rf susfs4ksu
          
          echo "========================================="
          echo "✅ SUSFS 2.1 integration completed!"
          echo "========================================="

      # -------- 配置内核 --------
      - name: Enable KernelSU and SUSFS in defconfig
        working-directory: kernel
        run: |
          echo "🔧 Enabling KernelSU and SUSFS in defconfig..."
          cp arch/arm64/configs/${{ env.DEFCONFIG_NAME }} arch/arm64/configs/${{ env.DEFCONFIG_NAME }}.bak
          
          # 基础 KernelSU
          echo "CONFIG_KSU=y" >> arch/arm64/configs/${{ env.DEFCONFIG_NAME }}
          echo "CONFIG_KSU_MANUAL_HOOK=y" >> arch/arm64/configs/${{ env.DEFCONFIG_NAME }}
          echo "CONFIG_KSU_DEBUG=y" >> arch/arm64/configs/${{ env.DEFCONFIG_NAME }}
          
          # SUSFS 2.1 全部功能
          echo "CONFIG_KSU_SUSFS=y" >> arch/arm64/configs/${{ env.DEFCONFIG_NAME }}
          echo "CONFIG_KSU_SUSFS_SUS_PATH=y" >> arch/arm64/configs/${{ env.DEFCONFIG_NAME }}
          echo "CONFIG_KSU_SUSFS_SUS_MOUNT=y" >> arch/arm64/configs/${{ env.DEFCONFIG_NAME }}
          echo "CONFIG_KSU_SUSFS_SUS_KSTAT=y" >> arch/arm64/configs/${{ env.DEFCONFIG_NAME }}
          echo "CONFIG_KSU_SUSFS_SPOOF_UNAME=y" >> arch/arm64/configs/${{ env.DEFCONFIG_NAME }}
          echo "CONFIG_KSU_SUSFS_ENABLE_LOG=y" >> arch/arm64/configs/${{ env.DEFCONFIG_NAME }}
          echo "CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS=y" >> arch/arm64/configs/${{ env.DEFCONFIG_NAME }}
          echo "CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG=y" >> arch/arm64/configs/${{ env.DEFCONFIG_NAME }}
          echo "CONFIG_KSU_SUSFS_OPEN_REDIRECT=y" >> arch/arm64/configs/${{ env.DEFCONFIG_NAME }}
          echo "CONFIG_KSU_SUSFS_SUS_MAP=y" >> arch/arm64/configs/${{ env.DEFCONFIG_NAME }}
          
          echo "✅ Defconfig updated with SUSFS 2.1 support"

      # -------- 编译环境 --------
      - name: Download Clang
        run: |
          echo "📥 Downloading Clang..."
          curl -L --retry 3 --retry-delay 5 -o clang.tar.xz "${{ env.CLANG_SOURCE }}"
          if [ ! -s clang.tar.xz ]; then
            echo "❌ Failed to download Clang"
            exit 1
          fi
          mkdir -p clang
          tar -xf clang.tar.xz -C clang --strip-components=1
          if [ ! -f "clang/bin/clang" ]; then
            echo "❌ Clang binary not found!"
            exit 1
          fi
          clang/bin/clang --version
          echo "$(pwd)/clang/bin" >> $GITHUB_PATH

      - name: Setup CCache
        run: |
          mkdir -p ~/.ccache
          echo "CCACHE_DIR=~/.ccache" >> $GITHUB_ENV
          ccache -M 2G

      # -------- 编译内核 --------
      - name: Build Kernel
        working-directory: kernel
        run: |
          set -e
          echo "🚀 Starting kernel build..."
          export ARCH=${{ env.KERNEL_ARCH }}
          export LLVM=1
          export LLVM_IAS=1
          export LD=ld.lld
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export CC=clang
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          echo "📝 Configuring kernel..."
          make -j$(nproc --all) ARCH=arm64 LLVM=1 LLVM_IAS=1 O=${{ env.OUTPUT_DIR }} ${{ env.DEFCONFIG_NAME }}
          echo "🔨 Building kernel..."
          make -j$(nproc --all) ARCH=arm64 LLVM=1 LLVM_IAS=1 O=${{ env.OUTPUT_DIR }}
          if [ -f "${{ env.OUTPUT_DIR }}/arch/arm64/boot/Image" ]; then
            echo "✅ Kernel built successfully!"
          else
            echo "❌ Kernel build failed"
            exit 1
          fi

      # -------- 打包和发布 --------
      - name: List boot directory
        run: ls -la kernel/${{ env.OUTPUT_DIR }}/arch/arm64/boot/

      - name: Prepare AnyKernel3
        run: git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git anykernel3

      - name: Setup AnyKernel3
        working-directory: anykernel3
        run: |
          sed -i 's/kernel.string=.*/kernel.string=Xiaomi 11 Ultra (star) Kernel/' anykernel.sh
          sed -i 's/do.devicecheck=.*/do.devicecheck=1/' anykernel.sh
          sed -i 's/device.name1=.*/device.name1=star/' anykernel.sh
          sed -i 's/device.name2=.*/device.name2=xiaomi11ultra/' anykernel.sh
          sed -i 's/do.modules=.*/do.modules=0/' anykernel.sh
          sed -i 's/do.systemless=.*/do.systemless=1/' anykernel.sh
          sed -i 's/do.cleanup=.*/do.cleanup=1/' anykernel.sh
          sed -i 's/^BLOCK=.*/BLOCK=\/dev\/block\/by-name\/boot;/' anykernel.sh
          sed -i 's/^IS_SLOT_DEVICE=.*/IS_SLOT_DEVICE=1;/' anykernel.sh

      - name: Copy Kernel Image
        run: |
          cd kernel/${{ env.OUTPUT_DIR }}/arch/arm64/boot/
          if [ -f Image.gz-dtb ]; then
            cp Image.gz-dtb ../../../../../anykernel3/Image
          elif [ -f Image.gz ]; then
            cp Image.gz ../../../../../anykernel3/Image
          elif [ -f Image ]; then
            cp Image ../../../../../anykernel3/Image
          else
            echo "❌ No kernel image found!"
            exit 1
          fi

      - name: 📦 Package Anykernel3 Flash Zip
        if: env.PACK_METHOD == 'Anykernel3'
        shell: bash
        run: |
          set -euo pipefail
          echo "============================================="
          echo "📦 开始打包 Star Hyper A17 内核卡刷包"
          echo "============================================="
          TIME=$(TZ=Asia/Shanghai date +"%Y-%m-%d")
          KERNEL_DIR="${GITHUB_WORKSPACE}/kernel"
          TMP_DIR="${KERNEL_DIR}/tmp"
          IMG_PATH="${KERNEL_DIR}/${OUTPUT_DIR}/arch/arm64/boot/Image"
          cd "${KERNEL_DIR}"
          if [[ ! -f "${IMG_PATH}" ]]; then
            echo "::error::❌ 编译失败，未找到 ${OUTPUT_DIR}/arch/arm64/boot/Image 内核文件"
            exit 1
          fi
          IMG_SIZE=$(du -h "${IMG_PATH}" | awk '{print $1}')
          echo "✅ 检测到内核镜像 Image | 大小: ${IMG_SIZE}"
          rm -rf "${TMP_DIR}"
          mkdir -p "${TMP_DIR}"
          AK3_DIR="${GITHUB_WORKSPACE}/anykernel3"
          if [[ -d "${AK3_DIR}" ]]; then
            cp -rp "${AK3_DIR}"/* "${TMP_DIR}/"
            echo "✅ AnyKernel3 文件已复制"
          else
            echo "::error::❌ AnyKernel3 目录不存在"
            exit 1
          fi
          cp -v "${IMG_PATH}" "${TMP_DIR}/Image"
          if [[ "${{ env.PACK_KMODULES }}" == "true" ]]; then
            MOD_DIR="${TMP_DIR}/modules/vendor/lib/modules"
            mkdir -p "${MOD_DIR}"
            find "${KERNEL_DIR}" -name "*.ko" -type f -print0 | xargs -0 -r cp -t "${MOD_DIR}/" 2>/dev/null || true
            module_count=$(find "${MOD_DIR}" -name "*.ko" | wc -l)
            echo "📦 打包内核模块: ${module_count} 个"
            if [[ ${module_count} -eq 0 ]]; then
              rm -rf "${TMP_DIR}/modules"
              echo "ℹ️ 未找到模块文件，移除 modules 目录"
            fi
          else
            echo "ℹ️ 已关闭模块打包，跳过 ko 文件"
          fi
          cd "${TMP_DIR}"
          7za a -tzip -mx9 -mmt=on package.zip ./* >/dev/null
          cd "${GITHUB_WORKSPACE}"
          FINAL_ZIP="${{ env.DEVICE_CODENAME }}-${{ env.ROM_TEXT }}-${TIME}-Ak3.zip"
          cp -fp "${TMP_DIR}/package.zip" "${FINAL_ZIP}"
          echo "PACK_NAME=${FINAL_ZIP}" >> "${GITHUB_ENV}"
          echo "✅ 刷机包打包完成: ${FINAL_ZIP}"
          rm -rf "${TMP_DIR}"

      - name: 🚀 Auto Upload To Github Release
        if: env.PACK_METHOD == 'Anykernel3'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: Star-HyperA17-Kernel-${{ github.run_number }}
          name: Xiaomi 11 Ultra Star HyperOS A17 NonGKI Kernel
          body: |
            ## Xiaomi 11 Ultra Star HyperOS A17 内核刷机包
            - 适配 HyperOS A17 全版本
            - SukiSU (ReSukiSU) + SUSFS 2.1 完整集成
            - NonGKI 通用免解boot补丁
            - Osm0sis Anykernel3 官方卡刷格式
            - Clang 18 最新编译
          files: ${{ env.PACK_NAME }}
          draft: false
          prerelease: false
          overwrite: true
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
