name: Build Xiaomi11U with SUSFS 2.3（A5）

on:
  workflow_call:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  DEVICE_NAME : "xiaomi_11U"
  DEVICE_CODENAME : "star"

  CUSTOM_CMDS : "CLANG_TRIPLE=aarch64-linux-gnu-"
  EXTRA_CMDS : "LD=ld.lld LLVM=1 LLVM_IAS=1"
  KCFLAGS_EXTRA : "-Wframe-larger-than=4096 -Wno-strict-prototypes -Wno-align-mismatch -Wno-unused-function -Wno-compare-distinct-pointer-types -Wno-void-pointer-to-int-cast -Wno-array-parameter -Wno-declaration-after-statement -fno-stack-protector"

  KERNEL_SOURCE : "https://github.com/zttlove/android_kernel_xiaomi_sm8350_miyume.git"
  KERNEL_BRANCH : "fix-root2"

  CLANG_SOURCE : "https://github.com/llvm/llvm-project/releases/download/llvmorg-18.1.8/clang+llvm-18.1.8-x86_64-linux-gnu-ubuntu-18.04.tar.xz"
  CLANG_BRANCH : ""

  GCC_GNU : false
  GCC_64_SOURCE : "https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9.git"
  GCC_64_BRANCH : "android12L-release"
  GCC_32_SOURCE : "https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/arm/arm-linux-androideabi-4.9.git"
  GCC_32_BRANCH : "android12L-release"

  DEFCONFIG_SOURCE: ""
  DEFCONFIG_NAME : "vendor/star_defconfig"
  DEFCONFIG_ORIGIN_IMAGE: ""
  DEFCONFIG_FROM_BOOT: false

  KERNELSU_SOURCE : ""
  KERNELSU_BRANCH : ""

  KERNELSU_AUTO_GET : "true"
  KERNELSU_AUTO_FORK : "resukisu"

  SUSFS_ENABLE : false
  SUSFS_FIXED : false

  AK3_SOURCE : "https://github.com/osm0sis/Anykernel3.git"
  AK3_BRANCH : "master"

  BOOT_SOURCE : ""
  NEED_DTBO : false
  NEED_SAFE_DTBO : false
  ROM_TEXT : "Xiaomi11U-HyperA16"

  PYTHON_VERSION: "3"
  PACK_METHOD: "Anykernel3"
  PACK_KMODULES: "false"

  KERNELSU_METHOD: "shell"
  KERNELSU_SUS_PATCH: "false"

  PATCHES_SOURCE: "JackA1ltman/NonGKI_Kernel_Patches"
  PATCHES_BRANCH: "mi_kernel"

  SUSFS_FOLDER_FIXED: "mi11_evox_a16"
  SUSFS_PATCH_FIXED: "susfs_fixed"

  REKERNEL_ENABLE: "false"
  HOOK_METHOD: "manual"
  KERNEL_PATCH: "false"

  KPM_ENABLE: "false"
  KPM_INLINE: "false"
  KPM_KPATCH_NEXT: "false"
  KPM_PATCH_SOURCE: "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU_patch/refs/heads/main/kpm/patch_linux"

  BASEBAND_GUARD_ENABLE: "false"
  BASEBAND_GUARD_BOOT: "false"
  HIDE_STUFF: "false"

  GENERATE_DTB: "false"
  GENERATE_CHIP: "qcom"

  BUILD_DEBUGGER: "false"
  SKIP_PATCH: "false"
  BUILD_OTHER_CONFIG: "false"
  MERGE_CONFIG_FILES: "vendor/venus_QGKI.config,vendor/xiaomi_QGKI.config"
  FREE_MORE_SPACE: "false"

  SUSFS_PATCH_URL : "https://raw.githubusercontent.com/JackA1ltman/NonGKI_Kernel_Patches/refs/heads/main/Patch/susfs_patch_to_5.4.patch"

jobs:
  build-kernel:
    name: Xiaomi11U (hyper A16)
    runs-on: ubuntu-latest
    env:
      CCACHE_COMPILERCHECK: "%compiler% -dumpmachine; %compiler% -dumpversion"
      CCACHE_NOHASHDIR: "true"
      CCACHE_HARDLINK: "true"

    steps:
      - name: ⏰ Checkout repository
        uses: actions/checkout@v6

      - name: ⌛️ Compilation environment preparation
        uses: ./.github/workflows/build-env

      - name: ⚙️ Get neccssary tools
        uses: ./.github/workflows/build-ready

      - name: 🧱 Clone device_kernel
        shell: bash
        run: |
          set -euo pipefail
          KERNEL_DIR="$GITHUB_WORKSPACE/device_kernel"
          rm -rf "$KERNEL_DIR"
          git clone "${{ env.KERNEL_SOURCE }}" \
            -b "${{ env.KERNEL_BRANCH }}" \
            "$KERNEL_DIR" --depth=1
          echo "[+] device_kernel cloned."

      - name: 🧹 Clean SUSFS 2.1 from source
        shell: bash
        run: |
          set -euo pipefail
          cd $GITHUB_WORKSPACE/device_kernel
          cp $GITHUB_WORKSPACE/clean_susfs.py ./

          python3 clean_susfs.py \
            fs/stat.c fs/namei.c fs/namespace.c fs/readdir.c fs/statfs.c \
            fs/super.c fs/exec.c fs/open.c fs/read_write.c \
            fs/proc/base.c fs/proc/cmdline.c fs/proc/fd.c fs/proc/task_mmu.c \
            fs/proc_namespace.c fs/notify/fdinfo.c \
            kernel/kallsyms.c kernel/sys.c kernel/reboot.c \
            mm/memory.c security/selinux/avc.c

          rm -f fs/susfs.c include/linux/susfs.h include/linux/susfs_def.h
          sed -i '/CONFIG_KSU_SUSFS.*susfs.o/d' fs/Makefile

          echo "[+] SUSFS 2.1 cleaned."

      - name: 🪝 Patch SUSFS 2.3
        shell: bash
        run: |
          set -euo pipefail
          cd $GITHUB_WORKSPACE/device_kernel

          echo "=== Cloning patches repository ==="
          git clone --depth=1 https://github.com/${{ env.PATCHES_SOURCE }}.git -b ${{ env.PATCHES_BRANCH }} patches_repo

          echo "=== Locating SUSFS 2.3 BASE patch by CONTENT ==="
          # 核心改动：彻底放弃猜文件名，直接在整个仓库里找包含 fs/susfs.c 的补丁
          PATCH_FILE=$(grep -rl "fs/susfs.c" patches_repo --include="*.patch" | head -n 1 || true)

          if [ -z "$PATCH_FILE" ] || [ ! -f "$PATCH_FILE" ]; then
          echo "::error::❌ 在补丁仓库里找不到包含 fs/susfs.c 的补丁！"
          echo "=== 当前仓库所有可用的 .patch 文件（供排查） ==="
          find patches_repo -name "*.patch" | head -30
          exit 1
          fi
          echo "✅ 成功定位到包含核心代码的补丁: $PATCH_FILE"

          echo "=== Applying patch ==="
          # 应用整个补丁，如果失败则捕获错误，但不直接退出，以便后续检查文件
          if ! git apply "$PATCH_FILE"; then
          echo "::warning::git apply 遇到冲突，可能包含驱动不匹配，我们尝试继续检查核心文件..."
          fi

          echo "=== Checking .rej files ==="
          # 检查是否有冲突文件，并提示忽略它们
          REJ_FILES=$(find . -name "*.rej" -type f | grep -v "patches_repo" || true)
          if [ -n "$REJ_FILES" ]; then
          echo "⚠️ 警告：产生了 .rej 文件（通常是触摸屏等驱动不匹配）："
          echo "$REJ_FILES"
          echo "忽略这些冲突，继续检查核心文件是否生成..."
          fi

          echo "=== Verifying core files ==="
          # 验证核心文件是否真的生成
          if [ ! -f "fs/susfs.c" ] || [ ! -f "include/linux/susfs.h" ] || [ ! -f "include/linux/susfs_def.h" ]; then
          echo "::error::❌ 核心 SUSFS 文件缺失，补丁未正确应用！请检查补丁版本是否与内核5.4匹配。"
          exit 1
          fi
          ls -la fs/susfs.c include/linux/susfs.h include/linux/susfs_def.h
          echo "[+] SUSFS 2.3 core files patched successfully."
    
      - name: 🛠️ Set KSU and SUSFS for DEFCONFIG
        shell: bash
        run: |
          set -euo pipefail
          cd $GITHUB_WORKSPACE/device_kernel
          DEFCONFIG="./arch/arm64/configs/${{ env.DEFCONFIG_NAME }}"

          for opt in \
            CONFIG_KSU=y \
            CONFIG_KSU_MANUAL_HOOK=y \
            CONFIG_KSU_SUSFS=y \
            CONFIG_KSU_SUSFS_SUS_PATH=y \
            CONFIG_KSU_SUSFS_SUS_KSTAT=y \
            CONFIG_KSU_SUSFS_ENABLE_LOG=y
          do
            if grep -q "^$opt" "$DEFCONFIG"; then
              sed -i "s|^$opt.*|$opt|" "$DEFCONFIG"
            else
              sed -i "/^# $opt is not set/d" "$DEFCONFIG"
              echo "$opt" >> "$DEFCONFIG"
            fi
          done

          sed -i '/^CONFIG_KSU_TRACEPOINT_HOOK=y/d' "$DEFCONFIG"
          grep -q "^# CONFIG_KSU_TRACEPOINT_HOOK is not set" "$DEFCONFIG" || \
            echo "# CONFIG_KSU_TRACEPOINT_HOOK is not set" >> "$DEFCONFIG"

          echo "=== final defconfig KSU/SUSFS lines ==="
          grep -iE "ksu|susfs" "$DEFCONFIG" || echo "(no ksu/susfs line)"

      - name: 🔍 Verify hooks
        shell: bash
        run: |
          cd $GITHUB_WORKSPACE/device_kernel
          echo "=== fs/susfs.c ==="
          ls -la fs/susfs.c
          echo "=== fs/stat.c ksu_handle_stat ==="
          grep -n "ksu_handle_stat" fs/stat.c || echo "NOT FOUND"
          echo "=== fs/open.c ksu_handle_faccessat ==="
          grep -n "ksu_handle_faccessat" fs/open.c || echo "NOT FOUND"
          echo "=== kernel/reboot.c ksu_handle_sys_reboot ==="
          grep -n "ksu_handle_sys_reboot" kernel/reboot.c || echo "NOT FOUND"

      - name: 🚀 Build Process
        uses: ./.github/workflows/build-process

      - name: 📦 Package Anykernel3 Flash Zip
        shell: bash
        run: |
          set -euo pipefail
          TIME=$(TZ=Asia/Shanghai date +"%Y-%m-%d")
          KERNEL_DIR="${GITHUB_WORKSPACE}/device_kernel"
          TMP_DIR="${KERNEL_DIR}/tmp"
          IMG_PATH="${KERNEL_DIR}/out/arch/arm64/boot/Image"
          cd "${KERNEL_DIR}"

          [[ ! -f "${IMG_PATH}" ]] && { echo "::error::Image not found"; exit 1; }

          rm -rf "${TMP_DIR}"
          mkdir -p "${TMP_DIR}"
          AK3_DIR="${KERNEL_DIR}/Anykernel3"

          sed -i 's/^do.devicecheck=.*/do.devicecheck=0/' "$AK3_DIR/anykernel.sh"
          sed -i 's/^BLOCK=.*/BLOCK=boot/' "$AK3_DIR/anykernel.sh"
          sed -i 's/^IS_SLOT_DEVICE=.*/IS_SLOT_DEVICE=1/' "$AK3_DIR/anykernel.sh"
          sed -i 's/^device.name1=.*/device.name1=star/' "$AK3_DIR/anykernel.sh"

          cp -v "${IMG_PATH}" "${TMP_DIR}/Image"
          [[ -d "${AK3_DIR}" ]] && cp -rp "${AK3_DIR}"/* "${TMP_DIR}/"

          cd "${TMP_DIR}"
          7za a -tzip -mx9 -mmt=on package.zip ./* >/dev/null
          cd "${GITHUB_WORKSPACE}"

          FINAL_ZIP="${{ env.DEVICE_CODENAME }}-${{ env.ROM_TEXT }}-${TIME}-Ak3.zip"
          cp -fp "${TMP_DIR}/package.zip" "${FINAL_ZIP}"
          echo "PACK_NAME=${FINAL_ZIP}" >> "${GITHUB_ENV}"
          rm -rf "${TMP_DIR}"
