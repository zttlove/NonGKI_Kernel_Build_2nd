name: Build Xiaomi11U with SUSFS 2.3（A5）

on:
  workflow_call:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  DEVICE_NAME : "xiaomi_11U"
  DEVICE_CODENAME : "star"

  CUSTOM_CMDS : "CLANG_TRIPLE=aarch64-linux-gnu-"
  EXTRA_CMDS : "LD=ld.lld LLVM=1 LLVM_IAS=1"
  KCFLAGS_EXTRA : "-Wframe-larger-than=4096 -Wno-strict-prototypes -Wno-align-mismatch -Wno-unused-function -Wno-compare-distinct-pointer-types -Wno-void-pointer-to-int-cast -Wno-array-parameter -Wno-declaration-after-statement -fno-stack-protector"

  KERNEL_SOURCE : "https://github.com/zttlove/android_kernel_xiaomi_sm8350_miyume.git"
  KERNEL_BRANCH : "fix-root2"

  CLANG_SOURCE : "https://github.com/llvm/llvm-project/releases/download/llvmorg-18.1.8/clang+llvm-18.1.8-x86_64-linux-gnu-ubuntu-18.04.tar.xz"
  CLANG_BRANCH : ""

  GCC_GNU : false
  GCC_64_SOURCE : "https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9.git"
  GCC_64_BRANCH : "android12L-release"
  GCC_32_SOURCE : "https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/arm/arm-linux-androideabi-4.9.git"
  GCC_32_BRANCH : "android12L-release"

  DEFCONFIG_SOURCE: ""
  DEFCONFIG_NAME : "star_defconfig"
  DEFCONFIG_ORIGIN_IMAGE: ""
  DEFCONFIG_FROM_BOOT: false

  KERNELSU_SOURCE : ""
  KERNELSU_BRANCH : ""

  KERNELSU_AUTO_GET : "true"
  KERNELSU_AUTO_FORK : "resukisu"

  SUSFS_ENABLE : true
  SUSFS_FIXED : false

  AK3_SOURCE : "https://github.com/osm0sis/Anykernel3.git"
  AK3_BRANCH : "master"

  BOOT_SOURCE : ""
  NEED_DTBO : false
  NEED_SAFE_DTBO : false
  ROM_TEXT : "Xiaomi11U-HyperA16"

  PYTHON_VERSION: "3"
  PACK_METHOD: "Anykernel3"
  PACK_KMODULES: "false"

  KERNELSU_METHOD: "manual"
  KERNELSU_SUS_PATCH: "false"

  PATCHES_SOURCE: "JackA1ltman/NonGKI_Kernel_Patches"
  PATCHES_BRANCH: "mi_kernel"

  SUSFS_FOLDER_FIXED: "mi11_evox_a16"
  SUSFS_PATCH_FIXED: "susfs_fixed"

  REKERNEL_ENABLE: "false"
  HOOK_METHOD: "manual"
  KERNEL_PATCH: "false"

  KPM_ENABLE: "false"
  KPM_INLINE: "false"
  KPM_KPATCH_NEXT: "false"
  KPM_PATCH_SOURCE: "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU_patch/refs/heads/main/kpm/patch_linux"

  BASEBAND_GUARD_ENABLE: "false"
  BASEBAND_GUARD_BOOT: "false"
  HIDE_STUFF: "false"

  GENERATE_DTB: "false"
  GENERATE_CHIP: "qcom"

  BUILD_DEBUGGER: "false"
  SKIP_PATCH: "false"
  BUILD_OTHER_CONFIG: "false"
  MERGE_CONFIG_FILES: "vendor/venus_QGKI.config,vendor/xiaomi_QGKI.config"
  FREE_MORE_SPACE: "false"

  SUSFS_PATCH_URL : "https://raw.githubusercontent.com/JackA1ltman/NonGKI_Kernel_Patches/refs/heads/main/Patch/susfs_patch_to_5.4.patch"

jobs:
  build-kernel:
    name: Build Xiaomi11U with SUSFS 2.3（A5）
    runs-on: ubuntu-latest
    env:
      CCACHE_COMPILERCHECK: "%compiler% -dumpmachine; %compiler% -dumpversion"
      CCACHE_NOHASHDIR: "true"
      CCACHE_HARDLINK: "true"

    steps:
      - name: ⏰ Checkout repository
        uses: actions/checkout@v6

      - name: ⌛️ Compilation environment preparation
        uses: ./.github/workflows/build-env

      - name: ⚙️ Get neccssary tools
        uses: ./.github/workflows/build-ready


      - name: ✂️ Filter SUSFS patch (minimal config)
        shell: bash
        run: |
          set -uo pipefail
          cd $GITHUB_WORKSPACE

          echo "=== Filtering susfs_patch_to_5.4.patch ==="
          echo "Keep : SUS_PATH, SUS_KSTAT, ENABLE_LOG + core files"
          echo "Drop : SUS_MOUNT, SUS_MAP, OPEN_REDIRECT, SPOOF_UNAME, HIDE_KSU_SUSFS_SYMBOLS"

          python3 scripts/filter_susfs_patch.py \
            susfs_patch_to_5.4.patch \
            susfs_patch_to_5.4.minimal.patch

          wc -l susfs_patch_to_5.4.minimal.patch


      - name: 🪝 Patch SUSFS 2.3
        shell: bash
        run: |
          set -uo pipefail
          cd $GITHUB_WORKSPACE/device_kernel

          echo "=== Copy filtered SUSFS 2.3 patch ==="
          cp $GITHUB_WORKSPACE/susfs_patch_to_5.4.minimal.patch ./susfs_patch_to_5.4.patch

          echo "=== Verify patch file ==="
          head -5 susfs_patch_to_5.4.patch
          wc -l susfs_patch_to_5.4.patch

          echo "=== Applying patch ==="
          patch -p1 --forward --no-backup-if-mismatch < susfs_patch_to_5.4.patch || true

          echo "=== Checking .rej files ==="
          REJ_FILES=$(find . -name "*.rej" -type f || true)
          if [ -n "$REJ_FILES" ]; then
            echo "::warning::Patch created .rej files (not fatal):"
            echo "$REJ_FILES"
            for f in $REJ_FILES; do
              echo "--- $f ---"
              cat "$f"
            done
          fi

          echo "=== Verifying core files ==="
          ls -la fs/susfs.c include/linux/susfs.h include/linux/susfs_def.h

          echo "=== SUS_PATH count in fs/namei.c ==="
          grep -c "susfs_is_inode_sus_path" fs/namei.c || true

          echo "=== SUS_KSTAT count in fs/stat.c ==="
          grep -c "susfs_is_inode_sus_kstat" fs/stat.c || true

          echo "[+] SUSFS 2.3 patch step done."

      - name: 🔧 Re-inject fs/namei.c macros (post-patch fix)
        shell: bash
        run: |
          set -uo pipefail
          cd $GITHUB_WORKSPACE

          echo "=== Before fix ==="
          grep -c "ND_STATE_LOOKUP_LAST" device_kernel/fs/namei.c || true
          grep -c "unsigned int	state" device_kernel/fs/namei.c || true

          python3 scripts/fix_namei_macros.py device_kernel

          echo "=== After fix ==="
          grep -c "ND_STATE_LOOKUP_LAST" device_kernel/fs/namei.c || true
          grep -c "unsigned int	state" device_kernel/fs/namei.c || true
          echo "=== line 50-65 ==="
          sed -n '50,65p' device_kernel/fs/namei.c

      - name: 💪 Force-enable SUS_PATH in fs/namei.c
        shell: bash
        run: |
          set -uo pipefail
          cd $GITHUB_WORKSPACE/device_kernel

          echo "=== Before force-enable ==="
          grep -c "#ifdef CONFIG_KSU_SUSFS_SUS_PATH" fs/namei.c || true
          grep -c "defined(CONFIG_KSU_SUSFS_SUS_PATH)" fs/namei.c || true

          # 把所有对 SUS_PATH 的 ifdef 改成 #if 1
          sed -i 's/^#ifdef CONFIG_KSU_SUSFS_SUS_PATH$/#if 1/' fs/namei.c
          sed -i 's/^#if defined(CONFIG_KSU_SUSFS_SUS_PATH)$/#if 1/' fs/namei.c
          sed -i 's/^#if defined(CONFIG_KSU_SUSFS_SUS_PATH) || defined(CONFIG_KSU_SUSFS_OPEN_REDIRECT)$/#if 1/' fs/namei.c

          echo "=== After force-enable ==="
          grep -c "#ifdef CONFIG_KSU_SUSFS_SUS_PATH" fs/namei.c || true
          grep -c "^#if 1$" fs/namei.c || true

          echo "=== line 50-70 ==="
          sed -n '50,70p' fs/namei.c
          echo "=== struct nameidata area ==="
          grep -n -A 10 "struct nameidata {" fs/namei.c | head -15
         
      - name: 🚨 Hard-inject SUSFS declarations at top of fs/namei.c
        shell: bash
        run: |
          set -uo pipefail
          cd $GITHUB_WORKSPACE

          python3 scripts/hard_inject_susfs.py device_kernel

          echo "=== top 30 lines of fs/namei.c ==="
          sed -n '1,30p' device_kernel/fs/namei.c
          echo "=== extern line check ==="
          grep -n "extern bool susfs_is_inode_sus_path" device_kernel/fs/namei.c
     
      - name: Patch ReSukiSU inline hook check
        shell: bash
        run: |
          cd $GITHUB_WORKSPACE/device_kernel
          if [ -f KernelSU/kernel/tools/inline_hook_check.mk ]; then
            echo "# Bypassed by user" > KernelSU/kernel/tools/inline_hook_check.mk
            echo "[+] Bypassed inline_hook_check.mk"
          else
            echo "[!] inline_hook_check.mk not found, nothing to bypass"
          fi


      - name: 🛠️ Set KSU and SUSFS for DEFCONFIG
        shell: bash
        run: |
          set -euo pipefail
          cd $GITHUB_WORKSPACE/device_kernel
          DEFCONFIG="./arch/arm64/configs/${{ env.DEFCONFIG_NAME }}"

          # 先删掉所有旧的 CONFIG_KSU_SUSFS* 行
          # 写干净的
          for opt in \
          CONFIG_KSU=y \
          CONFIG_KSU_MANUAL_HOOK=y \
          CONFIG_KSU_SUSFS=y \
          CONFIG_KSU_SUSFS_SUS_PATH=y \
          CONFIG_KSU_SUSFS_SUS_KSTAT=y \
          CONFIG_KSU_SUSFS_ENABLE_LOG=y
          do
          echo "$opt" >> "$DEFCONFIG"
          done

          # 显式关掉未启用的 SUSFS 功能
          for opt in \
          CONFIG_KSU_SUSFS_SUS_MOUNT \
          CONFIG_KSU_SUSFS_SPOOF_UNAME \
          CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS \
          CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG \
          CONFIG_KSU_SUSFS_OPEN_REDIRECT \
          CONFIG_KSU_SUSFS_SUS_MAP \
          CONFIG_KSU_SUSFS_ENABLE_AVC_LOG_SPOOFING
          do
          echo "# $opt is not set" >> "$DEFCONFIG"
          done
          sed -i '/^CONFIG_KSU_TRACEPOINT_HOOK=y/d' "$DEFCONFIG"
          grep -q "^# CONFIG_KSU_TRACEPOINT_HOOK is not set" "$DEFCONFIG" || \
            echo "# CONFIG_KSU_TRACEPOINT_HOOK is not set" >> "$DEFCONFIG"

          echo "=== final defconfig KSU/SUSFS lines ==="
          grep -iE "ksu|susfs" "$DEFCONFIG" || echo "(no ksu/susfs line)"


      - name: 🔎 Verify Kconfig tree includes KSU
        shell: bash
        run: |
          cd $GITHUB_WORKSPACE/device_kernel
          echo "=== drivers/Kconfig kernelsu source ==="
          grep -n "kernelsu" drivers/Kconfig || echo "NO KERNELSU IN drivers/Kconfig"
          echo ""
          echo "=== KernelSU/kernel/Kconfig config KSU ==="
          grep -n "config KSU$" KernelSU/kernel/Kconfig || echo "NO config KSU"
          echo ""
          echo "=== KSU_SUSFS_SUS_PATH definition ==="
          grep -rn "config KSU_SUSFS_SUS_PATH" --include="Kconfig" . || echo "NOT FOUND"
          echo ""
          echo "=== out/.config check ==="
          grep -E "^CONFIG_KSU" out/.config || echo "NO CONFIG_KSU IN out/.config"

      - name: 🔎 Check out/.config KSU/SUSFS state
        shell: bash
        run: |
          cd $GITHUB_WORKSPACE/device_kernel
          echo "=== out/.config KSU/SUSFS lines ==="
          grep -E "KSU|SUSFS" out/.config || echo "NO KSU/SUSFS IN .config"
          echo ""
          echo "=== Kconfig definition of KSU_SUSFS_SUS_PATH ==="
          grep -rn "config KSU_SUSFS_SUS_PATH" --include="Kconfig" . || echo "KCONFIG DEF NOT FOUND"
      
      - name: 🚀 Build Process
        uses: ./.github/workflows/build-process
        
      - name: 🔎 Check out/.config after make
        if: always()
        shell: bash
        run: |
          cd $GITHUB_WORKSPACE/device_kernel
          echo "=== out/.config exists? ==="
          ls -la out/.config || echo "NO .config"
          echo ""
          echo "=== KSU/SUSFS in out/.config ==="
          grep -E "KSU|SUSFS" out/.config 2>/dev/null || echo "NOT IN .config"
          echo ""
          echo "=== fs/Kconfig KSU_SUSFS_SUS_PATH definition ==="
          sed -n '330,350p' fs/Kconfig
          echo ""
          echo "=== KernelSU/kernel/Kconfig KSU_SUSFS_SUS_PATH definition ==="
          sed -n '165,180p' KernelSU/kernel/Kconfig
          
      - name: 📦 Package Anykernel3 Flash Zip
        shell: bash
        run: |
          set -euo pipefail
          TIME=$(TZ=Asia/Shanghai date +"%Y-%m-%d")
          KERNEL_DIR="${GITHUB_WORKSPACE}/device_kernel"
          TMP_DIR="${KERNEL_DIR}/tmp"
          IMG_PATH="${KERNEL_DIR}/out/arch/arm64/boot/Image"
          cd "${KERNEL_DIR}"

          [[ ! -f "${IMG_PATH}" ]] && { echo "::error::Image not found"; exit 1; }

          rm -rf "${TMP_DIR}"
          mkdir -p "${TMP_DIR}"
          AK3_DIR="${KERNEL_DIR}/Anykernel3"

          sed -i 's/^do.devicecheck=.*/do.devicecheck=0/' "$AK3_DIR/anykernel.sh"
          sed -i 's/^BLOCK=.*/BLOCK=boot/' "$AK3_DIR/anykernel.sh"
          sed -i 's/^IS_SLOT_DEVICE=.*/IS_SLOT_DEVICE=1/' "$AK3_DIR/anykernel.sh"
          sed -i 's/^device.name1=.*/device.name1=star/' "$AK3_DIR/anykernel.sh"

          cp -v "${IMG_PATH}" "${TMP_DIR}/Image"
          [[ -d "${AK3_DIR}" ]] && cp -rp "${AK3_DIR}"/* "${TMP_DIR}/"

          cd "${TMP_DIR}"
          7za a -tzip -mx9 -mmt=on package.zip ./* >/dev/null
          cd "${GITHUB_WORKSPACE}"

          FINAL_ZIP="${{ env.DEVICE_CODENAME }}-${{ env.ROM_TEXT }}-${TIME}-Ak3.zip"
          cp -fp "${TMP_DIR}/package.zip" "${FINAL_ZIP}"
          echo "PACK_NAME=${FINAL_ZIP}" >> "${GITHUB_ENV}"
          rm -rf "${TMP_DIR}"
