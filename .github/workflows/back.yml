name: Verify SUSFS in Kernel Source

on:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Kernel Source
        uses: actions/checkout@v4
        with:
          repository: "zttlove/android_kernel_xiaomi_sm8350_miyume"
          ref: "main"
          path: kernel
          fetch-depth: 1

      - name: Verify SUSFS modifications exist
        working-directory: kernel
        run: |  
          grep -n "STATX_SUS_KSTAT\|susfs_get_non_sus\|st_susfs_sus_kstat_hlist" include/linux/susfs_def.h include/linux/susfs.h
