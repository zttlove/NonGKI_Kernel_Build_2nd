name: Verify SUSFS in Kernel Source

on:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Kernel Source
        uses: actions/checkout@v4
        with:
          repository: "zttlove/android_kernel_xiaomi_sm8350_miyume"
          ref: "main"
          path: kernel
          fetch-depth: 1

      - name: Verify SUSFS modifications exist
        working-directory: kernel
        run: |  
         grep -n "lookup_positive_unlocked" fs/namei.c
