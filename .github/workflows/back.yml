name: Clean Kernel Source and Apply SUSFS v2.3

on:
  workflow_dispatch:
    inputs:
      patch_path:
        description: 'SUSFS v2.3 patch file path (relative to workflow repo root)'
        required: true
        default: 'Patches/Patch/susfs_patch_to_5.4.patch'

env:
  KERNEL_DIR: "${{ github.workspace }}/kernel"

jobs:
  clean_and_patch:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Kernel Source
        uses: actions/checkout@v4
        with:
          repository: "zttlove/android_kernel_xiaomi_sm8350_miyume"
          ref: "main"
          path: kernel
          fetch-depth: 1

      - name: Checkout Workflow Repository (for patch file)
        uses: actions/checkout@v4
        with:
          path: workflow_repo
          fetch-depth: 1

      - name: Clean all SUSFS related code
        working-directory: kernel
        run: |
          echo "=== Removing known SUSFS added files ==="
          rm -f fs/susfs.c
          rm -f include/linux/susfs.h
          rm -f include/linux/susfs_def.h

          echo "=== Reverting modified files to HEAD (using git) ==="
          git checkout -- fs/Makefile fs/namei.c fs/namespace.c fs/notify/fdinfo.c \
            fs/proc/base.c fs/proc/fd.c fs/proc/task_mmu.c fs/proc_namespace.c \
            fs/readdir.c fs/stat.c fs/statfs.c kernel/kallsyms.c kernel/sys.c \
            mm/memory.c security/selinux/avc.c drivers/input/input.c \
            security/security.c security/selinux/hooks.c security/selinux/ss/services.c \
            kernel/reboot.c || true

          find . -name "*.rej" -delete
          find . -name "*.orig" -delete

          echo "=== Current git status (should be clean) ==="
          git status --short

      - name: Apply SUSFS v2.3 patch
        working-directory: kernel
        id: apply_v22
        run: |
          PATCH_FILE="${{ github.workspace }}/workflow_repo/${{ github.event.inputs.patch_path }}"
          if [ ! -f "$PATCH_FILE" ]; then
            echo "ERROR: Patch file not found: $PATCH_FILE"
            exit 1
          fi

          echo "Applying patch: $PATCH_FILE"
          set +e
          patch -p1 < "$PATCH_FILE"
          PATCH_EXIT=$?
          set -e

          echo "Patch exit code: $PATCH_EXIT"

          REJ_COUNT=$(find . -name "*.rej" | wc -l)
          if [ $REJ_COUNT -gt 0 ]; then
            echo "::warning::There are $REJ_COUNT .rej files. Patch applied partially."
            find . -name "*.rej" > rej_list.txt
            echo "=== .rej files list ==="
            cat rej_list.txt
            echo "PATCH_FAILED=true" >> $GITHUB_OUTPUT
          else
            echo "PATCH_FAILED=false" >> $GITHUB_OUTPUT
          fi

      - name: Show all .rej contents
        if: steps.apply_v22.outputs.PATCH_FAILED == 'true'
        working-directory: kernel
        run: |
          for rej in $(find . -name "*.rej"); do
            echo "==================== $rej ===================="
            cat "$rej"
            echo "==================== end $rej ===================="
          done

          
          # 11 个 .rej 对应的关键符号，逐个 grep
          grep -rn "susfs_is_inode_sus_path" fs/readdir.c              # 期望 5
          grep -rn "susfs_def.h" fs/proc/base.c fs/proc/task_mmu.c fs/proc/fd.c fs/statfs.c
          grep -rn "susfs_spoof_cmdline_or_bootconfig" fs/proc/cmdline.c
          grep -rn "susfs_spoof_uname" kernel/sys.c                    # 期望 2
          grep -rn "susfs_ksu_sid" security/selinux/avc.c              # 期望 2
          grep -rn "VFSMOUNT_MNT_FLAGS_KSU_UNSHARED_MNT" fs/namespace.c
          grep -rn "susfs" fs/Makefile
          grep -rn "susfs_statfs_by_dentry\|SUSFS_IS_INODE_SUS_KSTAT" fs/statfs.c
          grep -n "susfs" fs/stat.c

          
          

          
          
      - name: Upload .rej files as artifact (if any)
        if: steps.apply_v22.outputs.PATCH_FAILED == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: patch-rejects
          path: kernel/**/*.rej

      - name: Final status
        if: steps.apply_v22.outputs.PATCH_FAILED == 'true'
        run: |
          echo "❌ Patch has conflicts. Please check the uploaded .rej files."
          exit 1
