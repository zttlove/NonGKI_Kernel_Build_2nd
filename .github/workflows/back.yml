name: Clean Kernel Source and Apply SUSFS v2.3

on:
  workflow_dispatch:
    inputs:
      patch_path:
        description: 'SUSFS v2.3 patch file path (relative to workflow repo root)'
        required: true
        default: 'Patches/Patch/susfs_patch_to_5.4.patch'

env:
  KERNEL_DIR: "${{ github.workspace }}/kernel"

jobs:
  clean_and_patch:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Kernel Source
        uses: actions/checkout@v4
        with:
          repository: "zttlove/android_kernel_xiaomi_sm8350_miyume"
          ref: "main"
          path: kernel
          fetch-depth: 1

      - name: Checkout Workflow Repository (for patch file)
        uses: actions/checkout@v4
        with:
          path: workflow_repo
          fetch-depth: 1
          
      - name: Show namespace.c.rej
        if: steps.apply_v22.outputs.PATCH_FAILED == 'true'
        working-directory: kernel
        run: |
          if [ -f fs/namespace.c.rej ]; then
          echo "===== fs/namespace.c.rej ====="
          cat fs/namespace.c.rej
          else
          echo "fs/namespace.c.rej not found"
           fi
    
      - name: Upload .rej files as artifact (if any)
        if: steps.apply_v22.outputs.PATCH_FAILED == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: patch-rejects
          path: kernel/**/*.rej

      - name: Final status
        if: steps.apply_v22.outputs.PATCH_FAILED == 'true'
        run: |
          echo "❌ Patch has conflicts. Please check the uploaded .rej files."
          exit 1
