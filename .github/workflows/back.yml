name: Verify SUSFS in Kernel Source

on:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Kernel Source
        uses: actions/checkout@v4
        with:
          repository: "zttlove/android_kernel_xiaomi_sm8350_miyume"
          ref: "main"
          path: kernel
          fetch-depth: 1

      - name: Verify SUSFS modifications exist
        working-directory: kernel
        run: |
          


          grep -n "susfs_is_inode_sus_kstat" fs/susfs.c
          grep -n "susfs_sus_kstat_spoof_vfs_statfs" fs/susfs.c
          grep -n "susfs_get_non_sus_vfsmnt_from_vfsmnt" fs/susfs.c
          grep -n "susfs_get_non_sus_mnt_id_from_mnt" fs/susfs.c
