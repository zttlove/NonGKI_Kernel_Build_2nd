name: Build Kernel with BakaSU (SELinux Hide Only - Official Hook)

on:
  workflow_dispatch:

env:
  TZ: Asia/Shanghai
  DEVICE_CODENAME: "star"
  KERNEL_ARCH: "arm64"
  KERNEL_REPO: "zttlove/android_kernel_xiaomi_sm8350-hyperos"
  KERNEL_BRANCH: "dynamic"
  DEFCONFIG_NAME: "vendor/star_defconfig"
  OUTPUT_DIR: "out"
  CLANG_DIR: "${{ github.workspace }}/clang"
  CCACHE_DIR: "${{ github.workspace }}/.ccache"
  KERNEL_DIR: "${{ github.workspace }}/kernel"

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:

      - name: Checkout Kernel Source
        uses: actions/checkout@v4
        with:
          repository: ${{ env.KERNEL_REPO }}
          ref: ${{ env.KERNEL_BRANCH }}
          path: kernel
          fetch-depth: 1

      - name: Verify Kernel Commit & Clean Workspace
        working-directory: kernel
        run: |
          echo "=== 当前内核源码 Git 信息 ==="
          echo "分支: ${{ env.KERNEL_BRANCH }}"
          echo "最新提交: $(git log --oneline -1)"
          echo "=== 强制清理可能存在的旧编译产物 ==="
          git reset --hard HEAD
          git clean -fdx
          echo "✅ 清理完成"

      - name: Checkout Workflow Repo (Patches)
        uses: actions/checkout@v4
        with:
          path: workflow_repo
          fetch-depth: 1

      - name: Install Dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            bc bison flex libelf-dev libssl-dev libncurses-dev \
            make python3 device-tree-compiler git curl xz-utils \
            ccache zip unzip zstd
          echo "正在修复 libtinfo.so.5 依赖..."
          if ! sudo apt install -y libtinfo5; then
            sudo ln -sf /lib/x86_64-linux-gnu/libtinfo.so.6 /lib/x86_64-linux-gnu/libtinfo.so.5
          fi
          if [ ! -f /lib/x86_64-linux-gnu/libtinfo.so.5 ]; then
            echo "::error::修复失败！libtinfo.so.5 仍然不存在。"
            exit 1
          else
            echo "✅ libtinfo.so.5 修复成功！"
          fi

      - name: Download Clang 17.0.6 (Official Kernel Toolchain)
        run: |
          mkdir -p ${{ env.CLANG_DIR }}
          curl -L --retry 3 -o clang+llvm-17.0.6-x86_64-linux-gnu-ubuntu-22.04.tar.xz "https://github.com/llvm/llvm-project/releases/download/llvmorg-17.0.6/clang+llvm-17.0.6-x86_64-linux-gnu-ubuntu-22.04.tar.xz"
          tar -xf clang+llvm-17.0.6-x86_64-linux-gnu-ubuntu-22.04.tar.xz -C ${{ env.CLANG_DIR }} --strip-components=1
          rm clang+llvm-17.0.6-x86_64-linux-gnu-ubuntu-22.04.tar.xz
          ${{ env.CLANG_DIR }}/bin/clang --version

      - name: Integrate BakaSU & Apply Official Hooks
        working-directory: kernel
        run: |
          set -e
          export ARCH=${{ env.KERNEL_ARCH }}
          export PATH="${{ env.CLANG_DIR }}/bin:$PATH"
          export CCACHE_EXEC=$(which ccache)
          export CCACHE_DIR="${{ env.CCACHE_DIR }}"
          ccache -M 6G
          export LLVM=1 LLVM_IAS=1 CLANG_TRIPLE=aarch64-linux-gnu- \
                 CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi-

          echo "=== 手动创建 seccomp_types.h 以规避 grep 警告 ==="
          if [ ! -f "include/linux/seccomp_types.h" ]; then
            touch "include/linux/seccomp_types.h"
          fi

          echo "=== 克隆并集成 BakaSU ==="
          rm -rf KernelSU BakaSU_src drivers/kernelsu drivers/KernelSU
          git clone --depth=1 https://github.com/Baka-SU/BakaSU.git BakaSU_src
          ln -sf ../BakaSU_src/kernel drivers/kernelsu

          if ! grep -q "kernelsu" drivers/Makefile; then
            printf "\nobj-\$(CONFIG_KSU) += kernelsu/\n" >> drivers/Makefile
          fi
          if ! grep -q 'source "drivers/kernelsu/Kconfig"' drivers/Kconfig; then
            sed -i '/^endmenu/i\source "drivers/kernelsu/Kconfig"' drivers/Kconfig
          fi

          echo "=== 应用官方 Manual Hook 补丁 (使用 sed 和 perl 精准注入) ==="
          
          # 1. Hook fs/stat.c
          STAT_C="fs/stat.c"
          if [ -f "$STAT_C" ]; then
            sed -i '/SYSCALL_DEFINE4(newfstatat/i \
            #ifdef CONFIG_KSU_MANUAL_HOOK\
            __attribute__((hot))\
            extern int ksu_handle_stat(int *dfd, const char __user **filename_user, int *flags);\
            #endif\
            ' "$STAT_C"
            perl -0pi -e 's/(SYSCALL_DEFINE4\(newfstatat,.*?\{)/$1\n#ifdef CONFIG_KSU_MANUAL_HOOK\n\tksu_handle_stat(&dfd, &filename, &flag);\n#endif\n/s' "$STAT_C"
          fi

          # 2. Hook fs/exec.c
          EXEC_C="fs/exec.c"
          if [ -f "$EXEC_C" ]; then
            sed -i '/static int do_execveat_common/i \
            #ifdef CONFIG_KSU_MANUAL_HOOK\
            __attribute__((hot))\
            extern int ksu_handle_execveat(int *fd, struct filename **filename_ptr, void *argv, void *envp, int *flags);\
            extern int ksu_handle_post_execveat(int *fd, struct filename **filename_ptr, void *argv, void *envp, int *flags, int *retval);\
            #endif\
            ' "$EXEC_C"
            perl -0pi -e 's/(static int\s+do_execveat_common\(.*?)(\tif\s*\(IS_ERR\(filename\)\))/$1\n#ifdef CONFIG_KSU_MANUAL_HOOK\n\tksu_handle_execveat(&fd, &filename, &argv, &envp, &flags);\n#endif\n\n$2/s' "$EXEC_C"
            perl -0pi -e 's/(static int\s+do_execveat_common\(.*?)(\tputname\(filename\);)/$1\n#ifdef CONFIG_KSU_MANUAL_HOOK\n\tksu_handle_post_execveat(&fd, &filename, &argv, &envp, &flags, &retval);\n#endif\n$2/s' "$EXEC_C"
          fi

          # 3. Hook fs/open.c
          OPEN_C="fs/open.c"
          if [ -f "$OPEN_C" ]; then
            sed -i '/SYSCALL_DEFINE3(faccessat,/i \
            #ifdef CONFIG_KSU_MANUAL_HOOK\
            __attribute__((hot))\
            extern int ksu_handle_faccessat(int *dfd, const char __user **filename_user, int *mode, int *flags);\
            #endif\
            ' "$OPEN_C"
            perl -0pi -e 's/(SYSCALL_DEFINE3\(faccessat,.*?\{)/$1\n#ifdef CONFIG_KSU_MANUAL_HOOK\n\tksu_handle_faccessat(&dfd, &filename, &mode, NULL);\n#endif\n/s' "$OPEN_C"
          fi

          # 4. Hook kernel/reboot.c
          REBOOT_C="kernel/reboot.c"
          if [ -f "$REBOOT_C" ]; then
            sed -i '/SYSCALL_DEFINE4(reboot,/i \
            #ifdef CONFIG_KSU_MANUAL_HOOK\
            extern int ksu_handle_sys_reboot(int magic1, int magic2, unsigned int cmd, void __user **arg);\
            #endif\
            ' "$REBOOT_C"
            perl -0pi -e 's/(SYSCALL_DEFINE4\(reboot,.*?\{.*?char buffer\[256\];.*?int ret = 0;)/$1\n#ifdef CONFIG_KSU_MANUAL_HOOK\n\tksu_handle_sys_reboot(magic1, magic2, cmd, &arg);\n#endif\n/s' "$REBOOT_C"
          fi

          # 5. 导出 SELinux 静态符号
          SELINUXFS_C="security/selinux/selinuxfs.c"
          if [ -f "$SELINUXFS_C" ]; then
             sed -i 's/^static ssize_t (\*write_op\[\])/ssize_t (*write_op[])/' "$SELINUXFS_C"
             sed -i 's/^static const struct file_operations sel_handle_status_ops/const struct file_operations sel_handle_status_ops/' "$SELINUXFS_C"
          fi
          STATUS_C="security/selinux/ss/status.c"
          if [ -f "$STATUS_C" ]; then
             sed -i 's/^static struct page \*selinux_status_page/struct page *selinux_status_page/' "$STATUS_C"
             sed -i 's/^static DEFINE_MUTEX(selinux_status_lock)/DEFINE_MUTEX(selinux_status_lock)/' "$STATUS_C"
          fi
          SERVICES_C="security/selinux/ss/services.c"
          if [ -f "$SERVICES_C" ]; then
             sed -i 's/^static void security_dump_masked_av/void security_dump_masked_av/' "$SERVICES_C"
             sed -i 's/^static void context_struct_compute_av/void context_struct_compute_av/' "$SERVICES_C"
          fi

          echo "✅ 官方 Hook 补丁已全部应用"

          # ============================================================
          # 绕过自检脚本和 preinit 生成工具，但保留 preinit 目录编译
          # ============================================================
          REAL_KSU_DIR=$(realpath drivers/kernelsu)
          
          echo "=== 绕过自检脚本和 preinit 生成工具 ==="
          
          # 1. 删除 manual_hook_check.mk 自检
          find "$REAL_KSU_DIR" -name "manual_hook_check.mk" -exec rm -f {} \;
          find "$REAL_KSU_DIR" -type d -name "tools" -exec touch {}/manual_hook_check.mk \;
          
          # 2. 禁用 preinit_runner.mk 的代码生成（防止路径迷失中断编译）
          PREINIT_RUNNER_MK="$REAL_KSU_DIR/tools/code_generation/preinit_runner/preinit_runner.mk"
          if [ -f "$PREINIT_RUNNER_MK" ]; then
             echo "# Disabled by CI" > "$PREINIT_RUNNER_MK"
             echo "✅ 已禁用 preinit_runner.mk"
          fi

          # 3. 为 preinit 加上伪装的空桩 (Shim)，防止因生成失败导致链接缺失
          cat > "$REAL_KSU_DIR/preinit/preinit_shim.c" << 'EOF'
          #include <linux/kernel.h>
          #include <linux/module.h>
          int ksu_preinit_init(void) { return 0; }
          void ksu_preinit_exit(void) {}
          int ksu_preinit_handle_execve_manual(void *a) { return 0; }
          void ksu_preinit_release(void) {}
          bool ksu_preinit_enabled_param = false;
          EOF
          # 把 shim 加入编译列表
          echo "obj-y += preinit_shim.o" >> "$REAL_KSU_DIR/Makefile"
          echo "✅ 已注入 preinit 空实现桩文件"

          # ============================================================
          # 针对 SELinux Hide 的修复与安全加固
          # ============================================================
          echo "=== 搜索并修复 selinux_hide.c ==="
          HIDE_FILE=$(find "$REAL_KSU_DIR" -name 'selinux_hide.c' | head -n1)
          
          if [ -f "$HIDE_FILE" ]; then
            sed -i '/static struct mutex \*ksu_selinux_status_lock/d' "$HIDE_FILE"
            sed -i '/static struct selinux_state fake_state/d' "$HIDE_FILE"
            
            LAST_INCLUDE_LINE=$(grep -n '^#include' "$HIDE_FILE" | tail -n1 | cut -d: -f1)
            if [ -z "$LAST_INCLUDE_LINE" ]; then LAST_INCLUDE_LINE=1; fi
            sed -i "${LAST_INCLUDE_LINE}r /dev/stdin" "$HIDE_FILE" << 'EOF'
          
          /* === BakaSU non-GKI 修复：全局符号定义 === */
          struct selinux_state fake_state;
          struct mutex *ksu_selinux_status_lock = NULL;
          EOF
            sed -i 's/^\(\s*\)mutex_lock(ksu_selinux_status_lock);/\1if (ksu_selinux_status_lock) mutex_lock(ksu_selinux_status_lock);/' "$HIDE_FILE"
            sed -i 's/^\(\s*\)mutex_unlock(ksu_selinux_status_lock);/\1if (ksu_selinux_status_lock) mutex_unlock(ksu_selinux_status_lock);/' "$HIDE_FILE"
            echo "✅ SELinux Hide 修复完成"
          fi

          echo "=== 修复 focaltech_3680 Makefile 缩进 ==="
          FOCALTECH_MAKEFILE="drivers/input/touchscreen/focaltech_3680/Makefile"
          if [ -f "$FOCALTECH_MAKEFILE" ]; then
            sed -i 's/^ \+/\t/' "$FOCALTECH_MAKEFILE"
          fi

          echo "=== 清理并生成配置 ==="
          rm -rf ${{ env.OUTPUT_DIR }}
          rm -f .config
          rm -rf include/config include/generated
          make mrproper

          make -j$(nproc) O=${{ env.OUTPUT_DIR }} ${{ env.DEFCONFIG_NAME }}
          
          scripts/config --file ${{ env.OUTPUT_DIR }}/.config \
            --enable KSU \
            --enable KSU_MANUAL_HOOK \
            --disable KSU_TRACEPOINT_HOOK \
            --enable KSU_COMPAT_HAS_SELINUX_STATE \
            --enable KSU_COMPAT_HAS_KVMALLOC \
            --disable KSU_SUSFS \
            --disable HEADERS_INSTALL \
            --set-val FRAME_WARN 131072 \
            --set-str LOCALVERSION "-edwin-hide-$(date +%m%d)"

          make O=${{ env.OUTPUT_DIR }} olddefconfig 2>&1 | tee olddefconfig.log

      - name: Build Kernel
        working-directory: kernel
        run: |
          set +e
          export ARCH=${{ env.KERNEL_ARCH }}
          export PATH="${{ env.CLANG_DIR }}/bin:$PATH"
          export CCACHE_EXEC=$(which ccache)
          export CCACHE_DIR="${{ env.CCACHE_DIR }}"
          ccache -M 6G
          export LLVM=1 LLVM_IAS=1 CLANG_TRIPLE=aarch64-linux-gnu- \
                 CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi-

          echo "=== 开始编译内核 ==="
          make -j$(nproc) O=${{ env.OUTPUT_DIR }} \
               KCFLAGS="-Wno-error -Wframe-larger-than=131072 -Wno-strict-prototypes -Wno-align-mismatch -Wno-unused-function -Wno-compare-distinct-pointer-types -Wno-void-pointer-to-int-cast -Wno-array-parameter -Wno-declaration-after-statement -Wno-sometimes-uninitialized -Wno-unused-variable -Wno-misleading-indentation -Wno-fortify-source -Wno-macro-redefined -Wno-unused-result -Wno-unused-label" \
               HOSTCFLAGS="" \
               2>&1 | tee build.log
          BUILD_STATUS=${PIPESTATUS[0]}

          if [ $BUILD_STATUS -ne 0 ]; then
            echo "::error::编译失败，退出码 $BUILD_STATUS"
            exit 1
          fi

          if [ ! -f "${{ env.OUTPUT_DIR }}/arch/arm64/boot/Image" ]; then
            echo "::error::编译失败，未生成 Image"
            exit 1
          fi

          echo "=== 编译产物的校验信息 ==="
          md5sum ${{ env.OUTPUT_DIR }}/arch/arm64/boot/Image
          strings ${{ env.OUTPUT_DIR }}/arch/arm64/boot/Image | grep "Linux version" | head -n 1
          echo "✅ 编译成功，Image 已生成"

      - name: Package AnyKernel3
        id: package
        run: |
          set -e
          TIME=$(date +"%Y.%m.%d-%H%M")
          AK3_DIR="AnyKernel3"
          IMG_PATH="${{ env.KERNEL_DIR }}/${{ env.OUTPUT_DIR }}/arch/arm64/boot/Image"
          
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git $AK3_DIR
          
          gzip -9 -c "$IMG_PATH" > "$AK3_DIR/Image.gz"
          ls -lh "$AK3_DIR/Image.gz"
          
          printf '%s\n' \
            '#!/sbin/sh' \
            '' \
            '### AnyKernel3 Flashable Kernel Script' \
            '## Adapted for Xiaomi Mi 11 Ultra (star) with BakaSU (Hide Only)' \
            '' \
            "properties() { '" \
            'kernel.string=5.4.302-edwin-hide+ BakaSU for Xiaomi 11 Ultra' \
            'do.devicecheck=1' \
            'do.modules=0' \
            'do.systemless=0' \
            'do.cleanup=1' \
            'do.cleanuponabort=0' \
            'device.name1=star' \
            'device.name2=mars' \
            'device.name3=' \
            'device.name4=' \
            'device.name5=' \
            'supported.versions=' \
            'supported.patchlevels=' \
            'supported.vendorpatchlevels=' \
            "'; } # end properties" \
            '' \
            '# boot shell variables' \
            'BLOCK=boot;' \
            'IS_SLOT_DEVICE=1;' \
            'RAMDISK_COMPRESSION=auto;' \
            'PATCH_VBMETA_FLAG=auto;' \
            '' \
            '# import functions/variables and setup patching - do not remove' \
            '. tools/ak3-core.sh;' \
            '' \
            '# pure kernel swap: keep the existing ramdisk and repack with the new Image.gz' \
            'split_boot;' \
            'flash_boot;' \
            > "$AK3_DIR/anykernel.sh"
          
          chmod +x "$AK3_DIR/anykernel.sh"
          
          cd $AK3_DIR
          zip -r9 "../${{ env.DEVICE_CODENAME }}-BakaSU-HideOnly-${TIME}.zip" ./*
          cd ..
          echo "zip_name=${{ env.DEVICE_CODENAME }}-BakaSU-HideOnly-${TIME}.zip" >> $GITHUB_OUTPUT

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: kernel_bakasu_hideonly
          path: ${{ env.DEVICE_CODENAME }}-BakaSU-HideOnly-*.zip

      - name: Upload build.log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build_log
          path: kernel/build.log
          if-no-files-found: ignore

      - name: Optional Release
        if: github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: bakasu_hideonly_${{ github.run_number }}
          name: "BakaSU Kernel (SELinux Hide Only, No SUSFS)"
          body: |
            ## 测试内核 - BakaSU (仅保留 SELinux Hide)
            - 包含 BakaSU 核心 Root 功能和 SELinux Hide 隐藏
            - **已彻底移除 SUSFS 功能，以排查重启问题**
            - 注入 preinit 空实现桩，解决未定义符号链接错误
            - 注入安全加固：为锁操作增加空指针检查，降低崩溃概率
            - LOCALVERSION: `-edwin-hide-日期`
            - 刷机有风险，请备份原内核
          files: ${{ env.DEVICE_CODENAME }}-BakaSU-HideOnly-*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
