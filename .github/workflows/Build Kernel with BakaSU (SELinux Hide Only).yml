name: Build Kernel with BakaSU (No SUSFS - Manual Hook)

on:
  workflow_dispatch:

env:
  KERNEL_REPO: zttlove/android_kernel_xiaomi_sm8350-hyperos
  KERNEL_BRANCH: dynamic
  DEFCONFIG_NAME: vendor/star_defconfig
  DEVICE_CODENAME: star
  OUTPUT_DIR: out
  CLANG_DIR: ${{ github.workspace }}/toolchains/clang
  KERNEL_DIR: ${{ github.workspace }}/kernel

jobs:
  build-kernel:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Kernel Source
        uses: actions/checkout@v4
        with:
          repository: ${{ env.KERNEL_REPO }}
          ref: ${{ env.KERNEL_BRANCH }}
          path: kernel
          fetch-depth: 1

      - name: Verify Kernel Commit & Clean Workspace
        working-directory: kernel
        run: |
          git reset --hard HEAD
          git clean -fdx
          echo "Kernel: $(git log -1 --format='%h %s')"

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential bc bison flex libssl-dev libelf-dev \
            zip unzip python3 perl git curl ccache xxd cpio kmod \
            libtinfo5
          sudo ln -sf /usr/lib/x86_64-linux-gnu/libtinfo.so.6 /usr/lib/x86_64-linux-gnu/libtinfo.so.5 || true

      - name: Download Clang 17.0.6
        run: |
          mkdir -p "${{ env.CLANG_DIR }}"
          curl -fL --retry 3 -o /tmp/clang.tar.xz \
            https://github.com/llvm/llvm-project/releases/download/llvmorg-17.0.6/clang+llvm-17.0.6-x86_64-linux-gnu-ubuntu-22.04.tar.xz
          tar -xf /tmp/clang.tar.xz -C "${{ env.CLANG_DIR }}" --strip-components=1
          "${{ env.CLANG_DIR }}/bin/clang" --version

      - name: Integrate BakaSU (manual hook, no SUSFS)
        working-directory: kernel
        run: |
          set -euo pipefail
          export ARCH=arm64
          export PATH="${{ env.CLANG_DIR }}/bin:$PATH"
          export LLVM=1 LLVM_IAS=1 \
                 CLANG_TRIPLE=aarch64-linux-gnu- \
                 CROSS_COMPILE=aarch64-linux-gnu- \
                 CROSS_COMPILE_COMPAT=arm-linux-gnueabi-

          echo "== 清理内核树 =="
          make mrproper >/dev/null 2>&1 || true

          echo "== 拉取 BakaSU 并接管 drivers/kernelsu =="
          rm -rf BakaSU_src KernelSU drivers/kernelsu drivers/KernelSU
          git clone --depth=1 https://github.com/Baka-SU/BakaSU.git BakaSU_src
          ln -sfn ../BakaSU_src/kernel drivers/kernelsu

          grep -q 'kernelsu' drivers/Makefile || \
            printf '\nobj-$(CONFIG_KSU) += kernelsu/\n' >> drivers/Makefile
          grep -q 'drivers/kernelsu/Kconfig' drivers/Kconfig || \
            sed -i '/^endmenu/i\source "drivers/kernelsu/Kconfig"' drivers/Kconfig

          echo "== 重新启用 manual hook 调用点 =="
          cat > /tmp/bakasu_patch.py <<'PY'
          import pathlib
          import re
          import sys


          def patch(path, anchor_re, replacement, marker):
              p = pathlib.Path(path)
              src = p.read_text()
              if marker in src:
                  print(f"  [skip] {path}: already patched")
                  return
              m = re.search(anchor_re, src, re.S | re.M)
              if not m:
                  sys.exit(f"  [FAIL] anchor not found in {path}: {anchor_re!r}")
              p.write_text(src[: m.start()] + replacement + src[m.end():])
              print(f"  [ok]   {path}")


          # fs/exec.c: ksu_handle_execveat 是 su 的核心入口
          patch(
              "fs/exec.c",
              r"extern int ksu_handle_post_execveat_sucompat\(int \*fd, struct filename \*\*filename_ptr, void \*argv,\n\t\t\t\tvoid \*envp, int \*flags, int \*retval\);\n#endif\n",
              """extern int ksu_handle_post_execveat_sucompat(int *fd, struct filename **filename_ptr, void *argv,
          				void *envp, int *flags, int *retval);
          #endif

          #ifdef CONFIG_KSU_MANUAL_HOOK
          extern int ksu_handle_execveat(int *fd, struct filename **filename_ptr, void *argv,
          				void *envp, int *flags);
          #endif
          """,
              "#ifdef CONFIG_KSU_MANUAL_HOOK\nextern int ksu_handle_execveat(int *fd, struct filename **filename_ptr, void *argv,",
          )

          patch(
              "fs/exec.c",
              r"#else\n\treturn __do_execve_file\(fd, filename, argv, envp, flags, NULL\);\n#endif",
              """#else
          #ifdef CONFIG_KSU_MANUAL_HOOK
          	/* BakaSU manual hook */
          	ksu_handle_execveat(&fd, &filename, &argv, &envp, &flags);
          #endif
          	return __do_execve_file(fd, filename, argv, envp, flags, NULL);
          #endif""",
              "ksu_handle_execveat(&fd, &filename, &argv, &envp, &flags);",
          )

          # fs/open.c: faccessat
          patch(
              "fs/open.c",
              r"extern int ksu_handle_faccessat\(int \*dfd, struct filename \*\*filename,\n\t\tint \*mode, int \*flags\);\n#endif\n",
              """extern int ksu_handle_faccessat(int *dfd, struct filename **filename,
          		int *mode, int *flags);
          #endif

          #ifdef CONFIG_KSU_MANUAL_HOOK
          extern int ksu_handle_faccessat(int *dfd, const char __user **filename_user,
          		int *mode, int *flags);
          #endif
          """,
              "#ifdef CONFIG_KSU_MANUAL_HOOK\nextern int ksu_handle_faccessat(int *dfd, const char __user **filename_user,",
          )

          patch(
              "fs/open.c",
              r"#else\n\tres = user_path_at\(dfd, filename, lookup_flags, &path\);\n#endif",
              """#else
          #ifdef CONFIG_KSU_MANUAL_HOOK
          	/* BakaSU manual hook */
          	ksu_handle_faccessat(&dfd, &filename, &mode, NULL);
          #endif
          	res = user_path_at(dfd, filename, lookup_flags, &path);
          #endif""",
              "ksu_handle_faccessat(&dfd, &filename, &mode, NULL);",
          )

          # fs/stat.c: stat / fstat 返回值 hook
          patch(
              "fs/stat.c",
              r'#include "internal\.h"\n',
              """#include "internal.h"

          #ifdef CONFIG_KSU_MANUAL_HOOK
          /* BakaSU manual hook */
          __attribute__((hot))
          extern int ksu_handle_stat(int *dfd, const char __user **filename_user, int *flags);
          extern void ksu_handle_newfstat_ret(unsigned int *fd, struct stat __user **statbuf_ptr);
          #if defined(__ARCH_WANT_STAT64) || defined(__ARCH_WANT_COMPAT_STAT64)
          extern void ksu_handle_fstat64_ret(unsigned long *fd, struct stat64 __user **statbuf_ptr);
          #endif
          #endif
          """,
              "extern void ksu_handle_newfstat_ret(unsigned int *fd, struct stat __user **statbuf_ptr);",
          )

          patch(
              "fs/stat.c",
              r"SYSCALL_DEFINE4\(newfstatat, int, dfd, const char __user \*, filename,\n\t\tstruct stat __user \*, statbuf, int, flag\)\n\{\n\tstruct kstat stat;\n\tint error;\n",
              """SYSCALL_DEFINE4(newfstatat, int, dfd, const char __user *, filename,
          		struct stat __user *, statbuf, int, flag)
          {
          	struct kstat stat;
          	int error;

          #ifdef CONFIG_KSU_MANUAL_HOOK
          	/* BakaSU manual hook */
          	ksu_handle_stat(&dfd, &filename, &flag);
          #endif
          """,
              "SYSCALL_DEFINE4(newfstatat, int, dfd, const char __user *, filename,\n\t\tstruct stat __user *, statbuf, int, flag)\n{\n\tstruct kstat stat;\n\tint error;\n\n#ifdef CONFIG_KSU_MANUAL_HOOK",
          )

          patch(
              "fs/stat.c",
              r"SYSCALL_DEFINE2\(newfstat, unsigned int, fd, struct stat __user \*, statbuf\)\n\{\n\tstruct kstat stat;\n\tint error = vfs_fstat\(fd, &stat\);\n\n\tif \(!error\)\n\t\terror = cp_new_stat\(&stat, statbuf\);\n",
              """SYSCALL_DEFINE2(newfstat, unsigned int, fd, struct stat __user *, statbuf)
          {
          	struct kstat stat;
          	int error = vfs_fstat(fd, &stat);

          	if (!error)
          		error = cp_new_stat(&stat, statbuf);
          #ifdef CONFIG_KSU_MANUAL_HOOK
          	/* BakaSU manual hook */
          	ksu_handle_newfstat_ret(&fd, &statbuf);
          #endif
          """,
              "ksu_handle_newfstat_ret(&fd, &statbuf);",
          )

          patch(
              "fs/stat.c",
              r"SYSCALL_DEFINE2\(fstat64, unsigned long, fd, struct stat64 __user \*, statbuf\)\n\{\n\tstruct kstat stat;\n\tint error = vfs_fstat\(fd, &stat\);\n\n\tif \(!error\)\n\t\terror = cp_new_stat64\(&stat, statbuf\);\n",
              """SYSCALL_DEFINE2(fstat64, unsigned long, fd, struct stat64 __user *, statbuf)
          {
          	struct kstat stat;
          	int error = vfs_fstat(fd, &stat);

          	if (!error)
          		error = cp_new_stat64(&stat, statbuf);
          #ifdef CONFIG_KSU_MANUAL_HOOK
          	/* BakaSU manual hook */
          	ksu_handle_fstat64_ret(&fd, &statbuf);
          #endif
          """,
              "ksu_handle_fstat64_ret(&fd, &statbuf);",
          )

          patch(
              "fs/stat.c",
              r"SYSCALL_DEFINE4\(fstatat64, int, dfd, const char __user \*, filename,\n\t\tstruct stat64 __user \*, statbuf, int, flag\)\n\{\n\tstruct kstat stat;\n\tint error;\n",
              """SYSCALL_DEFINE4(fstatat64, int, dfd, const char __user *, filename,
          		struct stat64 __user *, statbuf, int, flag)
          {
          	struct kstat stat;
          	int error;

          #ifdef CONFIG_KSU_MANUAL_HOOK
          	/* BakaSU manual hook */
          	ksu_handle_stat(&dfd, &filename, &flag);
          #endif
          """,
              "SYSCALL_DEFINE4(fstatat64, int, dfd, const char __user *, filename,\n\t\tstruct stat64 __user *, statbuf, int, flag)\n{\n\tstruct kstat stat;\n\tint error;\n\n#ifdef CONFIG_KSU_MANUAL_HOOK",
          )

          # kernel/reboot.c: KernelSU supercall
          patch(
              "kernel/reboot.c",
              r"#ifdef CONFIG_KSU_SUSFS\nextern int ksu_handle_sys_reboot",
              "#if defined(CONFIG_KSU_SUSFS) || defined(CONFIG_KSU_MANUAL_HOOK)\nextern int ksu_handle_sys_reboot",
              "defined(CONFIG_KSU_MANUAL_HOOK)\nextern int ksu_handle_sys_reboot",
          )

          patch(
              "kernel/reboot.c",
              r"#ifdef CONFIG_KSU_SUSFS\n\tret = ksu_handle_sys_reboot",
              "#if defined(CONFIG_KSU_SUSFS) || defined(CONFIG_KSU_MANUAL_HOOK)\n\tret = ksu_handle_sys_reboot",
              "defined(CONFIG_KSU_MANUAL_HOOK)\n\tret = ksu_handle_sys_reboot",
          )

          print("all manual-hook patches applied")
          PY
          python3 /tmp/bakasu_patch.py

          echo "== 修复 preinit 的 void 函数 return false =="
          PREINIT_H="BakaSU_src/kernel/preinit/preinit.h"
          if [ -f "$PREINIT_H" ]; then
            perl -0pi -e 's/(void\s+[a-zA-Z_][a-zA-Z0-9_]*\s*\([^)]*\)\s*\{[^}]*?)\breturn\s+false;/${1}return;/gs' "$PREINIT_H"
            grep -qPzo '\bvoid\s+[a-zA-Z_][a-zA-Z0-9_]*\s*\([^)]*\)\s*\{[^}]*?\breturn\s+false;' "$PREINIT_H" \
              && { echo "::error::preinit.h void-return patch failed"; exit 1; } || true
          fi

          echo "== 生成 defconfig =="
          make O=out ARCH=arm64 "${{ env.DEFCONFIG_NAME }}"

          echo "== 配置 BakaSU =="
          scripts/config --file out/.config \
            --enable  KSU \
            --enable  KSU_MANUAL_HOOK \
            --disable KSU_TRACEPOINT_HOOK \
            --disable KSU_SUSFS \
            --enable  KALLSYMS_ALL \
            --enable  KSU_MANUAL_HOOK_AUTO_SETUID_HOOK \
            --enable  KSU_MANUAL_HOOK_AUTO_INITRC_HOOK \
            --enable  KSU_MANUAL_HOOK_AUTO_INPUT_HOOK \
            --disable UAPI_HEADER_TEST \
            --disable HEADERS_INSTALL \
            --set-str LOCALVERSION "-edwin-pure-final-$(date +%m%d)"

          make O=out ARCH=arm64 olddefconfig

      - name: 修复编译警告
        working-directory: kernel
        run: |
          set -e
          FOCALTECH_MAKEFILE="drivers/input/touchscreen/focaltech_touch/Makefile"
          if [ -f "$FOCALTECH_MAKEFILE" ]; then
            sed -i 's/^ \+/\t/' "$FOCALTECH_MAKEFILE"
            echo "Fixed leading spaces in focaltech Makefile"
          fi

          for entry in \
            "drivers/staging/qcacld-3.0:-Wno-format" \
            "drivers/staging/qca-wifi-host-cmn:-Wno-format" \
            "drivers/thermal:-Wno-fortify-source"; do
            DIR="${entry%%:*}"
            FLAG="${entry##*:}"
            if [ -d "$DIR" ] && [ -f "$DIR/Makefile" ]; then
              grep -q -- "$FLAG" "$DIR/Makefile" || echo "ccflags-y += $FLAG" >> "$DIR/Makefile"
            fi
          done

      - name: Build Kernel
        working-directory: kernel
        run: |
          export ARCH=arm64
          export PATH="${{ env.CLANG_DIR }}/bin:$PATH"
          export LLVM=1 LLVM_IAS=1 \
                 CLANG_TRIPLE=aarch64-linux-gnu- \
                 CROSS_COMPILE=aarch64-linux-gnu- \
                 CROSS_COMPILE_COMPAT=arm-linux-gnueabi-
          export CCACHE_DIR="${{ github.workspace }}/.ccache"

          set +e
          make -j$(nproc) O=out ARCH=arm64 \
            CC="clang" LD="ld.lld" AR="llvm-ar" NM="llvm-nm" \
            OBJCOPY="llvm-objcopy" OBJDUMP="llvm-objdump" STRIP="llvm-strip" \
            CLANG_TRIPLE="aarch64-linux-gnu-" CROSS_COMPILE="aarch64-linux-gnu-" \
            KCFLAGS="-Wno-unknown-warning-option -Wno-error -Wno-format -Wno-incompatible-pointer-types \
            -Wno-implicit-function-declaration -Wno-strict-prototypes -Wno-missing-prototypes \
            -Wno-int-conversion -Wno-declaration-after-statement \
            -Wframe-larger-than=131072 -Wno-unused-variable -Wno-unused-function \
            -Wno-missing-braces -Wno-int-to-pointer-cast -Wno-address-of-packed-member \
            -Wno-return-type -Wno-shift-negative-value -Wno-array-bounds" \
            HOSTCFLAGS="" 2>&1 | tee build.log

          if [ ${PIPESTATUS[0]} -ne 0 ]; then
            echo "::error::Kernel build failed. Last 200 lines:"
            tail -n 200 build.log
            exit 1
          fi

          echo "=== Build finished ==="
          ls -lh out/arch/arm64/boot/Image

      - name: Package AnyKernel3
        run: |
          set -e
          TIME=$(date +%Y%m%d-%H%M)
          IMG_PATH="${{ env.KERNEL_DIR }}/${{ env.OUTPUT_DIR }}/arch/arm64/boot/Image"
          test -f "$IMG_PATH"

          rm -rf AnyKernel3
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git
          cd AnyKernel3

          cp "$IMG_PATH" ./Image
          gzip -9 -f ./Image
          rm -f ./Image

          cat > anykernel.sh <<'AK3'
          ### AnyKernel3 Ramdisk Mod Script
          ## osm0sis @ xda-developers

          ### AnyKernel setup
          # global properties
          properties() { '
          kernel.string=Edwin BakaSU Pure Final (No SUSFS) for Xiaomi 11 Ultra / Pro (star)
          do.devicecheck=1
          do.modules=0
          do.systemless=1
          do.cleanup=1
          do.cleanuponabort=0
          device.name1=star
          device.name2=mars
          supported.versions=
          supported.patchlevels=
          supported.vendorpatchlevels=
          '; } # end properties

          ### AnyKernel install
          # boot files attributes
          boot_attributes() {
          set_perm_recursive 0 0 755 644 $RAMDISK/*;
          set_perm_recursive 0 0 750 750 $RAMDISK/init* $RAMDISK/sbin;
          } # end attributes

          # boot shell variables
          BLOCK=boot;
          IS_SLOT_DEVICE=1;
          RAMDISK_COMPRESSION=auto;
          PATCH_VBMETA_FLAG=auto;

          # import functions/variables and setup patching - see for reference (DO NOT REMOVE)
          . tools/ak3-core.sh;

          # boot install
          split_boot;

          flash_boot;
          ## end boot install
          AK3

          chmod +x anykernel.sh
          zip -r9 "../${{ env.DEVICE_CODENAME }}-BakaSU-PureFinal-${TIME}.zip" ./*

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: kernel_bakasu_pure_final
          path: ${{ env.DEVICE_CODENAME }}-BakaSU-PureFinal-*.zip
