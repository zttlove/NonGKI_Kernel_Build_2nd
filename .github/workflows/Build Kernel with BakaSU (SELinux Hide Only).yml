name: Build Kernel with BakaSU (Pure No SUSFS - Fixed Hook)

on:
  workflow_dispatch:

env:
  TZ: Asia/Shanghai
  DEVICE_CODENAME: "star"
  KERNEL_ARCH: "arm64"
  KERNEL_REPO: "zttlove/android_kernel_xiaomi_sm8350-hyperos"
  KERNEL_BRANCH: "dynamic"
  DEFCONFIG_NAME: "vendor/star_defconfig"
  OUTPUT_DIR: "out"
  CLANG_DIR: "${{ github.workspace }}/clang"
  CCACHE_DIR: "${{ github.workspace }}/.ccache"
  KERNEL_DIR: "${{ github.workspace }}/kernel"

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:

      - name: Checkout Kernel Source
        uses: actions/checkout@v4
        with:
          repository: ${{ env.KERNEL_REPO }}
          ref: ${{ env.KERNEL_BRANCH }}
          path: kernel
          fetch-depth: 1

      - name: Verify Kernel Commit & Clean Workspace
        working-directory: kernel
        run: |
          echo "=== 当前内核源码 Git 信息 ==="
          git reset --hard HEAD
          git clean -fdx
          echo "✅ 清理完成"

      - name: Checkout Workflow Repo (Patches)
        uses: actions/checkout@v4
        with:
          path: workflow_repo
          fetch-depth: 1

      - name: Install Dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            bc bison flex libelf-dev libssl-dev libncurses-dev \
            make python3 device-tree-compiler git curl xz-utils \
            ccache zip unzip zstd
          if ! sudo apt install -y libtinfo5; then
            sudo ln -sf /lib/x86_64-linux-gnu/libtinfo.so.6 /lib/x86_64-linux-gnu/libtinfo.so.5
          fi

      - name: Download Clang 17.0.6 (Official Kernel Toolchain)
        run: |
          mkdir -p ${{ env.CLANG_DIR }}
          curl -L --retry 3 -o clang+llvm-17.0.6-x86_64-linux-gnu-ubuntu-22.04.tar.xz "https://github.com/llvm/llvm-project/releases/download/llvmorg-17.0.6/clang+llvm-17.0.6-x86_64-linux-gnu-ubuntu-22.04.tar.xz"
          tar -xf clang+llvm-17.0.6-x86_64-linux-gnu-ubuntu-22.04.tar.xz -C ${{ env.CLANG_DIR }} --strip-components=1
          rm clang+llvm-17.0.6-x86_64-linux-gnu-ubuntu-22.04.tar.xz

      - name: Manual integrate BakaSU into Kernel
        working-directory: kernel
        run: |
          set -e
          export ARCH=${{ env.KERNEL_ARCH }}
          export PATH="${{ env.CLANG_DIR }}/bin:$PATH"
          export CCACHE_EXEC=$(which ccache)
          export CCACHE_DIR="${{ env.CCACHE_DIR }}"
          ccache -M 6G
          export LLVM=1 LLVM_IAS=1 CLANG_TRIPLE=aarch64-linux-gnu- \
                 CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi-

          echo "=== 强制拉取最新版 BakaSU ==="
          rm -rf BakaSU_src
          git clone --depth=1 https://github.com/Baka-SU/BakaSU.git BakaSU_src

          if [ ! -f "include/linux/seccomp_types.h" ]; then
            touch "include/linux/seccomp_types.h"
          fi

          rm -rf KernelSU drivers/kernelsu drivers/KernelSU
          ln -sf ../BakaSU_src/kernel drivers/kernelsu

          if ! grep -q "kernelsu" drivers/Makefile; then
            printf "\nobj-\$(CONFIG_KSU) += kernelsu/\n" >> drivers/Makefile
          fi

          if ! grep -q 'source "drivers/kernelsu/Kconfig"' drivers/Kconfig; then
            sed -i '/^endmenu/i\source "drivers/kernelsu/Kconfig"' drivers/Kconfig
          fi

          # ============================================================
          # 关键修复 1：屏蔽 preinit_runner 避免外部构建路径报错
          # ============================================================
          KSU_SRC_DIR=$(readlink -f drivers/kernelsu)
          PREINIT_RUNNER_MK="$KSU_SRC_DIR/tools/code_generation/preinit_runner/preinit_runner.mk"
          if [ -f "$PREINIT_RUNNER_MK" ]; then
             echo "# Disabled by CI for non-GKI" > "$PREINIT_RUNNER_MK"
             echo "✅ 已屏蔽 preinit_runner.mk 以防止 O=out 路径解析报错"
          fi

          # ============================================================
          # 关键修复 2：补全 fs/stat.c 中缺失的返回值钩子
          # ============================================================
          echo "=== 补全 fs/stat.c 缺失的钩子 ==="
          STAT_C="fs/stat.c"
          if [ -f "$STAT_C" ]; then
            if ! grep -q "ksu_handle_newfstat_ret" "$STAT_C"; then
              LAST_INCLUDE_LINE=$(grep -n '^#include' "$STAT_C" | tail -n1 | cut -d: -f1)
              if [ -z "$LAST_INCLUDE_LINE" ]; then LAST_INCLUDE_LINE=1; fi
              sed -i "${LAST_INCLUDE_LINE}r /dev/stdin" "$STAT_C" << 'STAT_DECL_EOF'

          #ifdef CONFIG_KSU_MANUAL_HOOK
          __attribute__((hot))
          extern int ksu_handle_stat(int *dfd, const char __user **filename_user, int *flags);
          extern void ksu_handle_newfstat_ret(unsigned int *fd, struct stat __user **statbuf_ptr);
          #if defined(__ARCH_WANT_STAT64) || defined(__ARCH_WANT_COMPAT_STAT64)
          extern void ksu_handle_fstat64_ret(unsigned long *fd, struct stat64 __user **statbuf_ptr);
          #endif
          #endif
          STAT_DECL_EOF
            fi

            if ! grep -q "ksu_handle_newfstat_ret(&fd" "$STAT_C"; then
              perl -0pi -e 's/(SYSCALL_DEFINE2\(newfstat,.*?if\s*\(!error\)\s*error\s*=\s*cp_new_stat\(&stat, statbuf\);)/$1\n#ifdef CONFIG_KSU_MANUAL_HOOK\n\tksu_handle_newfstat_ret(\&fd, \&statbuf);\n#endif\n/s' "$STAT_C"
            fi
            if ! grep -q "ksu_handle_fstat64_ret(&fd" "$STAT_C"; then
              perl -0pi -e 's/(SYSCALL_DEFINE2\(fstat64,.*?if\s*\(!error\)\s*error\s*=\s*cp_new_stat64\(&stat, statbuf\);)/$1\n#ifdef CONFIG_KSU_MANUAL_HOOK\n\tksu_handle_fstat64_ret(\&fd, \&statbuf);\n#endif\n/s' "$STAT_C"
            fi
          fi

          # ============================================================
          # 关键修复 3：保留成功识别的逻辑，动态编译 selinux_hide.o
          # ============================================================
          HIDE_FILE=$(find "$KSU_SRC_DIR" -name 'selinux_hide.c' | head -n1)
          if [ -n "$HIDE_FILE" ]; then
            sed -i '/BakaSU non-GKI 修复/,+3d' "$HIDE_FILE"
            sed -i '/static struct mutex \*ksu_selinux_status_lock/d' "$HIDE_FILE"
            sed -i '/static struct selinux_state fake_state/d' "$HIDE_FILE"
            
            LAST_INCLUDE_LINE=$(grep -n '^#include' "$HIDE_FILE" | tail -n1 | cut -d: -f1)
            if [ -z "$LAST_INCLUDE_LINE" ]; then LAST_INCLUDE_LINE=1; fi
            
            sed -i "${LAST_INCLUDE_LINE}r /dev/stdin" "$HIDE_FILE" << 'EOF'
          
          /* === BakaSU non-GKI 修复：全局符号定义 === */
          struct selinux_state fake_state;
          struct mutex *ksu_selinux_status_lock = NULL;
          EOF
            
            HIDE_DIR=$(dirname "$HIDE_FILE")
            SELINUX_MK="$HIDE_DIR/Makefile"
            if [ ! -f "$SELINUX_MK" ]; then
              SEARCH_DIR="$HIDE_DIR"
              while [ "$SEARCH_DIR" != "." ] && [ "$SEARCH_DIR" != "/" ] && [ "$SEARCH_DIR" != "$KSU_SRC_DIR" ]; do
                if [ -f "$SEARCH_DIR/Makefile" ]; then
                  SELINUX_MK="$SEARCH_DIR/Makefile"
                  break
                fi
                SEARCH_DIR=$(dirname "$SEARCH_DIR")
              done
            fi
            
            if [ -n "$SELINUX_MK" ] && [ -f "$SELINUX_MK" ]; then
              MK_DIR=$(dirname "$SELINUX_MK")
              HIDE_REL=$(realpath --relative-to="$MK_DIR" "$HIDE_FILE")
              HIDE_OBJ="${HIDE_REL%.c}.o"
              if ! grep -q "$HIDE_OBJ" "$SELINUX_MK"; then
                echo "obj-y += $HIDE_OBJ" >> "$SELINUX_MK"
              fi
            fi
          fi

          echo "=== 修复编译警告 ==="
          ccache -C
          FOCALTECH_MAKEFILE="drivers/input/touchscreen/focaltech_3680/Makefile"
          if [ -f "$FOCALTECH_MAKEFILE" ]; then
            sed -i 's/^ \+/\t/' "$FOCALTECH_MAKEFILE"
          fi
          for entry in \
            "drivers/soc/qcom/Makefile:-Wno-unused-variable" \
            "drivers/thermal/Makefile:-Wno-fortify-source" \
            "techpack/bootinfo/Makefile:-Wno-unused-result" \
            "drivers/usb/dwc3/Makefile:-Wno-unused-label"; do
            MK="${entry%:*}"
            FLAG="${entry#*:}"
            if [ -f "$MK" ] && ! grep -q -- "$FLAG" "$MK" 2>/dev/null; then
              echo "ccflags-y += $FLAG" >> "$MK"
            fi
          done

          echo "=== 清理并生成 .config ==="
          rm -rf ${{ env.OUTPUT_DIR }}
          rm -f .config
          rm -rf include/config include/generated
          make mrproper
          make -j$(nproc) O=${{ env.OUTPUT_DIR }} ${{ env.DEFCONFIG_NAME }}

          echo "=== 启用纯净 BakaSU 配置（无 SUSFS） ==="
          scripts/config --file ${{ env.OUTPUT_DIR }}/.config \
            --enable KSU \
            --enable KSU_MANUAL_HOOK \
            --disable KSU_TRACEPOINT_HOOK \
            --enable KSU_COMPAT_HAS_SELINUX_STATE \
            --enable KSU_COMPAT_HAS_KVMALLOC \
            --disable KSU_SUSFS \
            --disable HEADERS_INSTALL \
            --set-val FRAME_WARN 131072 \
            --set-str LOCALVERSION "-edwin-pure-fixed-$(date +%m%d)"

          make O=${{ env.OUTPUT_DIR }} olddefconfig 2>&1 | tee olddefconfig.log

      - name: Build Kernel
        working-directory: kernel
        run: |
          set +e
          export ARCH=${{ env.KERNEL_ARCH }}
          export PATH="${{ env.CLANG_DIR }}/bin:$PATH"
          export CCACHE_EXEC=$(which ccache)
          export CCACHE_DIR="${{ env.CCACHE_DIR }}"
          export LLVM=1 LLVM_IAS=1 CLANG_TRIPLE=aarch64-linux-gnu- \
                 CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi-

          echo "=== 开始编译内核 ==="
          make -j$(nproc) O=${{ env.OUTPUT_DIR }} \
               KCFLAGS="-Wno-error -Wframe-larger-than=131072 -Wno-strict-prototypes -Wno-align-mismatch -Wno-unused-function -Wno-compare-distinct-pointer-types -Wno-void-pointer-to-int-cast -Wno-array-parameter -Wno-declaration-after-statement -Wno-sometimes-uninitialized -Wno-unused-variable -Wno-misleading-indentation -Wno-fortify-source -Wno-macro-redefined -Wno-unused-result -Wno-unused-label" \
               HOSTCFLAGS="" \
               2>&1 | tee build.log
          
          if [ ${PIPESTATUS[0]} -ne 0 ] || [ ! -f "${{ env.OUTPUT_DIR }}/arch/arm64/boot/Image" ]; then
            echo "::error::编译失败"
            exit 1
          fi
          echo "✅ 编译成功"

      - name: Package AnyKernel3
        id: package
        run: |
          set -e
          TIME=$(date +"%Y.%m.%d-%H%M")
          AK3_DIR="AnyKernel3"
          IMG_PATH="${{ env.KERNEL_DIR }}/${{ env.OUTPUT_DIR }}/arch/arm64/boot/Image"
          
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git $AK3_DIR
          gzip -9 -c "$IMG_PATH" > "$AK3_DIR/Image.gz"
          
          printf '%s\n' \
            '#!/sbin/sh' \
            '### AnyKernel3 Flashable Kernel Script' \
            "properties() { '" \
            'kernel.string=5.4.302-edwin-pure-fixed+ BakaSU for Xiaomi 11 Ultra' \
            'do.devicecheck=1' 'do.modules=0' 'do.systemless=0' 'do.cleanup=1' 'do.cleanuponabort=0' \
            'device.name1=star' 'device.name2=mars' \
            "'; } # end properties" \
            'BLOCK=boot;' 'IS_SLOT_DEVICE=1;' 'RAMDISK_COMPRESSION=auto;' 'PATCH_VBMETA_FLAG=auto;' \
            '. tools/ak3-core.sh;' \
            'split_boot;' 'flash_boot;' \
            > "$AK3_DIR/anykernel.sh"
          
          chmod +x "$AK3_DIR/anykernel.sh"
          cd $AK3_DIR
          zip -r9 "../${{ env.DEVICE_CODENAME }}-BakaSU-PureFixed-${TIME}.zip" ./*
          cd ..

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: kernel_bakasu_pure_fixed
          path: ${{ env.DEVICE_CODENAME }}-BakaSU-PureFixed-*.zip
