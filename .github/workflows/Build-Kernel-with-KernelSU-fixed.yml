name: Build Kernel with KernelSU (backslashxx master, no SUSFS)

on:
  workflow_dispatch:
    inputs:
      ksu_enabled:
        description: 'CONFIG_KSU 开关；A 组对照包（纯内核）设为 false'
        type: boolean
        default: true
      ksu_pin_override:
        description: 'C 组对照：覆盖 KSU_PIN，须填完整 40 位 SHA；留空则用 env.KSU_PIN'
        type: string
        default: ''
      disable_preinit:
        description: 'B 组对照：向 ksu.c 注入 #define KSU_NO_PREINIT，关闭 downstream preinit'
        type: boolean
        default: false
      enable_threaded_throne:
        description: 'D 组对照：启用 KSU_THRONE_TRACKER_ALWAYS_THREADED'
        type: boolean
        default: false

env:
  # ---------------------------------------------------------------------------
  # 工作流版本号：每次修改 +1，构建日志第一屏会打印。
  #   r1 初次修正（6 处 + 对照矩阵）
  #   r2 补回 cpufreq 步骤写回磁盘 + 读盘复验
  #   r3 cyttsp5 7/8-tab 双形态匹配 + 9 个非关键补丁 continue-on-error
  #   r4 加版本指纹横幅（若日志里看不到 => 仓库里跑的是旧 yml）
  #   r5 修正 name 尾部笔误；B/D 组增加“开关真实生效”三级断言；
  #      drivers/kernelsu 主动规范化；构建后反查 kernelsu.o 的 preinit 状态
  # 若 Actions 日志开头没有 "WORKFLOW REV" 横幅，说明本次运行用的不是本文件，
  # 请把本文件完整覆盖到 .github/workflows/ 下、删除同名旧文件、再重新 dispatch。
  # ---------------------------------------------------------------------------
  WF_REV: "r5-20261120"
  KERNEL_REPO: zttlove/android_kernel_xiaomi_sm8350-hyperos
  KERNEL_BRANCH: dynamic
  # ---------------------------------------------------------------------------
  # Pinned vendor source (8-char SHA).
  # 2026-11-14: 旧 pin 36982074 被上游抹除（历史重写，仓库仅剩 dynamic 单分支），
  # 被迫前移到 f4c3fdd4f —— "Merge branch 'Leecaarmy:dynamic' into dynamic"。
  # 2026-11-19 已核实：该合并**唯一改动**是 drivers/cpufreq/qcom-cpufreq-hw.c
  # 的注册顺序（+11/-6），且被下方 "Enforce cpufreq init order" 步骤强制回退到
  # 与开机基线 4949587972 等价的顺序（本地重跑脚本逐行 diff 验证）。
  # => 内核源码侧相对已验证可开机基线净变化 ≈ 0；开机问题不应再往该合并排查。
  # Build FAILS if the dynamic branch tip differs -- update ONLY after verifying a new-tip build boots.
  # ---------------------------------------------------------------------------
  KERNEL_COMMIT_PIN: "f4c3fdd4"
  DEFCONFIG_NAME: vendor/star_defconfig
  DEVICE_CODENAME: star
  OUTPUT_DIR: out
  CLANG_DIR: ${{ github.workspace }}/toolchains/clang
  KERNEL_DIR: ${{ github.workspace }}/kernel
  # ---------------------------------------------------------------------------
  # KernelSU 驱动源：backslashxx/KernelSU master 主线（unity build + hook 自包含）
  # ---------------------------------------------------------------------------
  # 为什么这次不再有 SUSFS，也不再需要任何驱动侧源码补丁：
  #   1. vendor 内核树的 ksu_handle_* / susfs_* 埋点全部写在
  #      #ifdef CONFIG_KSU_SUSFS 内（exec.c 还有 #else 走纯净 __do_execve_file）。
  #      全树只有自带驱动 KernelSU/kernel/Kconfig 定义 CONFIG_KSU_SUSFS 符号，
  #      star_defconfig 里也没有任何 CONFIG_KSU_SUSFS*。
  #   2. 换成 backslashxx 主线后，驱动 Kconfig 根本没有 SUSFS 符号，且本工作流
  #      全程不定义 CONFIG_KSU_SUSFS —— 那些埋点整段不参与编译，上一版的
  #      11 个 LTO undefined symbol 从根源上消失。
  #   3. backslashxx 主线自带 5.4 兼容层（kernel_compat.h 中 <5.8 的
  #      __weak strncpy_from_user_nofault fallback），不需要 sulog 替换；
  #      sucompat 走主线自己的 syscall-table / branch-link / LSM hook，
  #      不依赖内核树埋点，因此也不需要 static-key 转换、Kconfig 注入等补丁。
  #   4. 身份：KSU_PACKAGE_NAME := me.weishu.kernelsu，-DKSU_VERSION=32731。
  #      Integrate 步骤会校验；PIN 钉住 master 一次提交，每次构建源码一致。
  # 2026-11-19: 当前 pin ae59aa55 = "KernelSU v3.3.1+"（当日 00:51 UTC 提交，
  #      93 commits on top of upstream），含 downstream preinit / lsm_hook /
  #      ksud init.rc 注入 / selinux policydb backport 等大量新代码。
  #      **换 pin 后尚未实机验证能否开机**；若卡第二屏，优先按 KSU 侧排查。
  # 2026-11-20 r5 已逐行核对 pin ae59aa55 源码：
  #      - ksu.c 中 #ifndef KSU_NO_PREINIT 包住 preinit.c 的 unity include，
  #        注入点选在 #include "kernel_includes.h" 之后、首次使用之前；
  #      - kernel/Kconfig 存在 config KSU_THRONE_TRACKER_ALWAYS_THREADED
  #        (depends on KSU, default n)，D 组开关有效；
  #      - kernel/Makefile 已含 -mno-outline-atomics（ARM64），无需外部 KCFLAGS。
  # 注意：preinit 开关与 UAPI headers 无关，实际由 preinit/preinit.h 的
  #      CONFIG_ARM64 && KSU_CAN_USE_JUMP_LABEL 门控；需关闭时用
  #      workflow_dispatch 输入 disable_preinit（注入 #define KSU_NO_PREINIT）。
  #      旧版 "headers_install 启用 preinit" 的假设在当前 pin 上不成立，已移除。
  # ---------------------------------------------------------------------------
  KSU_REPO: https://github.com/backslashxx/KernelSU.git
  KSU_BRANCH: master
  KSU_PIN: "ae59aa5509c39276117e15f8fedc0740e5bda7f8"

jobs:
  build-kernel:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      # -----------------------------------------------------------------------
      # 版本指纹：日志第一屏即可确认仓库里跑的是不是这一份文件。
      # 排查用法：把失败 run 的日志开头贴出来，看有没有下面这条横幅。
      #   - 有 WF_REV=r5        => 跑的是新版，按新版逻辑排查
      #   - 没有横幅 / 是旧 rev => 仓库里的 yml 仍是旧文件，修改没生效
      # -----------------------------------------------------------------------
      - name: Announce workflow revision
        env:
          REV: ${{ env.WF_REV }}
          KPIN: ${{ env.KERNEL_COMMIT_PIN }}
          SPIN: ${{ env.KSU_PIN }}
        run: |
          set -euo pipefail
          echo "================================================================"
          echo " WORKFLOW REV : ${REV}"
          echo " NAME         : Build Kernel with KernelSU (backslashxx master, no SUSFS)"
          echo " KERNEL PIN   : ${KPIN}   KSU PIN: ${SPIN}"
          echo " KEY FIXES    : cpufreq write-back + re-read verification"
          echo "              : cyttsp5 7/8-tab tolerant (non-fatal on mismatch)"
          echo "              : 9 non-critical patches continue-on-error"
          echo "              : r5 B/D controls verified effective, no silent no-op"
          echo "================================================================"
          echo "提示：若你在这条日志里看不到本横幅，说明仓库跑的是旧 yml，"
          echo "      请把本文件完整覆盖到 .github/workflows/ 并删除同名旧文件。"

      # -----------------------------------------------------------------------
      # 解析对照矩阵输入，供后续所有步骤与产物命名使用（一次只改一个变量）
      #   A 组 ksu_enabled=false            -> 纯内核，判定是否 KSU 侧问题
      #   B 组 disable_preinit=true         -> 关闭 downstream preinit
      #   C 组 ksu_pin_override=<旧 sha>    -> 回退 KSU 版本
      #   D 组 enable_threaded_throne=true  ->  throne tracker kthread 化
      # -----------------------------------------------------------------------
      - name: Resolve build matrix inputs
        id: meta
        env:
          IN_KSU_ENABLED: ${{ inputs.ksu_enabled }}
          IN_KSU_PIN_OVERRIDE: ${{ inputs.ksu_pin_override }}
          IN_DISABLE_PREINIT: ${{ inputs.disable_preinit }}
          IN_THREADED_THRONE: ${{ inputs.enable_threaded_throne }}
          IN_KERNEL_PIN: ${{ env.KERNEL_COMMIT_PIN }}
          IN_KSU_PIN: ${{ env.KSU_PIN }}
        run: |
          set -euo pipefail
          KSU_PIN_EFF="${IN_KSU_PIN_OVERRIDE:-${IN_KSU_PIN}}"
          if [ "${#KSU_PIN_EFF}" -ne 40 ]; then
            echo "::error::KSU pin must be a full 40-char SHA (got ${#KSU_PIN_EFF} chars: ${KSU_PIN_EFF})"
            echo "C 组回退请从之前成功的 Actions 日志里取完整 sha，不要填 8 位短 sha"
            exit 1
          fi
          PIN_TAG="${KSU_PIN_EFF:0:8}"
          if [ "$IN_KSU_ENABLED" = "true" ]; then
            TAG="ksu-on-${PIN_TAG}"
          else
            TAG="ksu-off-${PIN_TAG}"
          fi
          if [ "$IN_DISABLE_PREINIT" = "true" ]; then TAG="${TAG}-nopreinit"; fi
          if [ "$IN_THREADED_THRONE" = "true" ]; then TAG="${TAG}-thronethread"; fi
          {
            echo "ksu_pin=${KSU_PIN_EFF}"
            echo "variant=${TAG}"
            echo "ksu_enabled=${IN_KSU_ENABLED}"
            echo "disable_preinit=${IN_DISABLE_PREINIT}"
            echo "threaded_throne=${IN_THREADED_THRONE}"
          } >> "$GITHUB_OUTPUT"
          echo "== build matrix =="
          echo "  kernel pin : ${IN_KERNEL_PIN}"
          echo "  ksu pin    : ${KSU_PIN_EFF}"
          echo "  CONFIG_KSU : ${IN_KSU_ENABLED}"
          echo "  no preinit : ${IN_DISABLE_PREINIT}"
          echo "  throne thr : ${IN_THREADED_THRONE}"
          echo "  variant    : ${TAG}"

      - name: Checkout Kernel Source
        uses: actions/checkout@v4
        with:
          repository: ${{ env.KERNEL_REPO }}
          ref: ${{ env.KERNEL_BRANCH }}
          path: kernel
          # depth=2：合并 tip 时需要 HEAD^1 做对照 diff（cpufreq 回退步骤依赖）
          fetch-depth: 2

      - name: Verify Kernel Commit & Clean Workspace
        working-directory: kernel
        run: |
          git reset --hard HEAD
          git clean -fdx
          SHORT_SHA=$(git rev-parse --short=8 HEAD)
          echo "Kernel: $(git log -1 --format='%h %s')"
          if [ "$SHORT_SHA" != "$KERNEL_COMMIT_PIN" ]; then
            echo "::error::vendor kernel source drifted: branch tip ${SHORT_SHA} != pinned ${KERNEL_COMMIT_PIN}"
            echo "The 'dynamic' branch was moved/rewritten. Update KERNEL_COMMIT_PIN in workflow env ONLY after a build from the new tip is verified to boot."
            exit 1
          fi

      - name: Enforce cpufreq init order (bootloop fix, unconditional)
        working-directory: kernel
        run: |
          set -euo pipefail
          echo "== 强制 qcom-cpufreq-hw.c 注册顺序：cpufreq_register_driver() 在前 =="
          # 2026-11-19 已核实：KERNEL_COMMIT_PIN f4c3fdd4 这个合并提交（唯一改动
          # 就是本文件 +11/-6）把 cycle counter 回调移到 cpufreq_register_driver()
          # 之前（WALT fast-switch 理由）。star 实机验证该顺序会冷启动假死/无限重启，
          # 能开机的基线顺序是 cpufreq_register_driver() 在前。
          # 本步骤无条件强制为可启动顺序；脚本结果与合并前基线 4949587972 去注释
          # 逐行对比仅 4 行差异（spin_lock_init 位置提前，无害），该合并已被中和。
          # 新增"被替换区间白名单"断言：上游若在该区间新增任何初始化代码，直接
          # 报错中止，避免被 s[i:j] 静默删除。
          python3 - <<'PYEOF'
          import sys
          pc = "drivers/cpufreq/qcom-cpufreq-hw.c"
          s = open(pc).read()
          lock_line = "for_each_possible_cpu(cpu)\n\t\tspin_lock_init(&qcom_cpufreq_counter[cpu].lock);\n"
          i = s.find(lock_line)
          j = s.find("\tof_platform_populate(pdev->dev.of_node")
          if i == -1 or j == -1 or j < i:
              sys.exit("::error::anchor lines not found in qcom-cpufreq-hw.c")
          # 白名单：被整段丢弃的区间只允许包含 WALT 注释 + 两次 register 调用。
          # 一旦上游在此区间加入资源/时钟/OPP 初始化，宁可中止也不能静默删代码。
          discarded = s[i:j]
          for tok in ("register_cpu_cycle_counter_cb", "cpufreq_register_driver"):
              if tok not in discarded:
                  sys.exit(f"::error::{tok} missing in replaced range - source drifted, manual review")
          for tok in ("qcom_resources_init", "of_platform_populate", "devm_", "clk_", "opp_"):
              if tok in discarded:
                  sys.exit(f"::error::unexpected '{tok}' in replaced range - aborting to avoid silent code loss")
          print(f"-- discarded range whitelist OK ({len(discarded)} bytes)")
          good = lock_line + """
          \t/*
          \t * 注册顺序必须保持 cpufreq_register_driver() 在前：
          \t * star 实机验证该顺序是唯一可正常启动的配置；颠倒后（先注册
          \t * cycle counter 回调）会触发冷启动假死/无限重启。
          \t */
          \trc = cpufreq_register_driver(&cpufreq_qcom_hw_driver);
          \tif (rc) {
          \t\tdev_err(&pdev->dev, "CPUFreq HW driver failed to register\\n");
          \t\treturn rc;
          \t}
          \trc = register_cpu_cycle_counter_cb(&cycle_counter_cb);
          \tif (rc) {
          \t\tdev_err(&pdev->dev, "cycle counter cb failed to register\\n");
          \t\treturn rc;
          \t}
          """
          s = s[:i] + good + s[j:]
          R = s.find("rc = cpufreq_register_driver(&cpufreq_qcom_hw_driver);")
          C = s.find("rc = register_cpu_cycle_counter_cb(&cycle_counter_cb);")
          assert R != -1 and C != -1 and R < C, "order verification failed (in-memory)"
          # 必须写回磁盘：只改内存变量不会改变源码，后续 shell 校验会读到旧顺序。
          # （2026-11-19 修正版曾漏掉这一行，导致 R=710 C=704 校验失败）
          with open(pc, "w") as f:
              f.write(s)
          # 读回校验：确认写回真实生效，防止以后再次漏掉 write 而静默构建出错误顺序
          on_disk = open(pc).read()
          R2 = on_disk.find("rc = cpufreq_register_driver(&cpufreq_qcom_hw_driver);")
          C2 = on_disk.find("rc = register_cpu_cycle_counter_cb(&cycle_counter_cb);")
          assert R2 != -1 and C2 != -1 and R2 < C2, \
              "on-disk order verification failed - write-back did not take effect"
          print(f"-- written & re-read OK: cpufreq_register_driver(offset {R2}) precedes register_cpu_cycle_counter_cb (offset {C2})")
          PYEOF
          R=$(grep -n 'cpufreq_register_driver(&cpufreq_qcom_hw_driver)' drivers/cpufreq/qcom-cpufreq-hw.c | head -1 | cut -d: -f1)
          C=$(grep -n 'register_cpu_cycle_counter_cb(&cycle_counter_cb)' drivers/cpufreq/qcom-cpufreq-hw.c | head -1 | cut -d: -f1)
          if [ -z "$R" ] || [ -z "$C" ] || [ "$R" -ge "$C" ]; then
            echo "::error::cpufreq order verification failed (R=$R C=$C)"
            echo "-- 磁盘上实际匹配到的调用（应为 register_driver 在前）："
            grep -nF -e 'cpufreq_register_driver(&cpufreq_qcom_hw_driver)' \
                     -e 'register_cpu_cycle_counter_cb(&cycle_counter_cb)' \
                     drivers/cpufreq/qcom-cpufreq-hw.c || true
            exit 1
          fi
          echo "-- verified: cpufreq_register_driver (L$R) precedes register_cpu_cycle_counter_cb (L$C)"

      - name: Silence min() type-mismatch warning in tcp_output.c
        working-directory: kernel
        # 纯编译警告/无行为变更补丁：anchor 若因上游 pin 变化失配，只告警不中断构建。
        continue-on-error: true
        run: |
          set -euo pipefail
          TF=net/ipv4/tcp_output.c
          grep -q 'threshold = min(srtt_in_ns >> 1, NSEC_PER_MSEC);' "$TF" \
            || { echo "::error::tcp_output.c anchor not found (source moved?)"; exit 1; }
          sed -i 's/threshold = min(srtt_in_ns >> 1, NSEC_PER_MSEC);/threshold = min_t(u64, srtt_in_ns >> 1, NSEC_PER_MSEC);/' "$TF"
          grep -q 'threshold = min_t(u64, srtt_in_ns >> 1, NSEC_PER_MSEC);' "$TF" \
            || { echo "::error::min_t replacement failed"; exit 1; }
          echo "-- tcp_output.c min() type-mismatch silenced (min_t(u64, ...))"

      - name: Fix misleading indentation in mi_dsi_panel.c (no behavior change)
        working-directory: kernel
        continue-on-error: true
        run: |
          set -euo pipefail
          python3 <<'PYEOF'
          p = "techpack/display/msm/mi_disp/mi_dsi_panel.c"
          s = open(p).read()
          old = ("\t\t\telse\n"
                 "\t\t\t\tmi_dsi_update_backlight_in_aod(panel, true);\n"
                 "\t\t\t\tif (mi_cfg->panel_id == 0x4C3900360200)\n"
                 "\t\t\t\t\tmi_dsi_update_lhbm_dc_gain(panel,DSI_CMD_SET_MI_LOCAL_HBM_OFF_TO_NORMAL);\n"
                 "\t\t\t\tdsi_panel_tx_cmd_set(panel, DSI_CMD_SET_MI_LOCAL_HBM_OFF_TO_NORMAL);\n")
          new = ("\t\t\telse {\n"
                 "\t\t\t\tmi_dsi_update_backlight_in_aod(panel, true);\n"
                 "\t\t\t}\n"
                 "\t\t\tif (mi_cfg->panel_id == 0x4C3900360200)\n"
                 "\t\t\t\tmi_dsi_update_lhbm_dc_gain(panel,DSI_CMD_SET_MI_LOCAL_HBM_OFF_TO_NORMAL);\n"
                 "\t\t\tdsi_panel_tx_cmd_set(panel, DSI_CMD_SET_MI_LOCAL_HBM_OFF_TO_NORMAL);\n")
          n = s.count(old)
          assert n == 1, f"anchor count {n} != 1 (source moved?)"
          open(p, "w").write(s.replace(old, new))
          print("-- mi_dsi_panel.c: else braces added, indentation aligned (semantics unchanged)")
          PYEOF
          CNT=$(grep -c $'^\t\t\telse {' techpack/display/msm/mi_disp/mi_dsi_panel.c || true)
          if [ "${CNT:-0}" -lt 1 ]; then
            echo "::error::mi_dsi_panel.c brace fix verification failed (count=${CNT:-0})"; exit 1
          fi
          echo "-- verified: brace fix in place (${CNT} match)"

      - name: Fix missing brace in cam_flash_core.c add_req error check (no behavior change)
        working-directory: kernel
        continue-on-error: true
        run: |
          set -euo pipefail
          python3 <<'PYEOF'
          p = "techpack/camera_star/drivers/cam_sensor_module/cam_flash/cam_flash_core.c"
          s = open(p).read()
          old = ("\t\tif (fctrl->bridge_intf.crm_cb &&\n"
                 "\t\t\tfctrl->bridge_intf.crm_cb->add_req)\n"
                 "\t\t\trc = fctrl->bridge_intf.crm_cb->add_req(&add_req);\n"
                 "\t\t\tif  (rc) {\n"
                 "\t\t\t\tCAM_ERR(CAM_FLASH,\n"
                 "\t\t\t\t\t\"Failed in adding request: %llu to request manager\",\n"
                 "\t\t\t\t\tcsl_packet->header.request_id);\n"
                 "\t\t\t\treturn rc;\n"
                 "\t\t\t}\n")
          new = ("\t\tif (fctrl->bridge_intf.crm_cb &&\n"
                 "\t\t\tfctrl->bridge_intf.crm_cb->add_req) {\n"
                 "\t\t\trc = fctrl->bridge_intf.crm_cb->add_req(&add_req);\n"
                 "\t\t\tif (rc) {\n"
                 "\t\t\t\tCAM_ERR(CAM_FLASH,\n"
                 "\t\t\t\t\t\"Failed in adding request: %llu to request manager\",\n"
                 "\t\t\t\t\tcsl_packet->header.request_id);\n"
                 "\t\t\t\treturn rc;\n"
                 "\t\t\t}\n"
                 "\t\t}\n")
          n = s.count(old)
          assert n == 1, f"anchor count {n} != 1 (source moved?)"
          open(p, "w").write(s.replace(old, new))
          print("-- cam_flash_core.c: guard braces restored (CAF canonical form)")
          PYEOF
          grep -q 'fctrl->bridge_intf.crm_cb->add_req) {' techpack/camera_star/drivers/cam_sensor_module/cam_flash/cam_flash_core.c \
            || { echo "::error::cam_flash brace fix verification failed"; exit 1; }
          echo "-- verified: add_req guard braces in place"

      - name: Fix ignored kstrtou32 return in bootinfo.c (no behavior change)
        working-directory: kernel
        continue-on-error: true
        run: |
          set -euo pipefail
          python3 <<'PYEOF'
          p = "techpack/bootinfo/bootinfo.c"
          s = open(p).read()
          pairs = [
              ("\tkstrtou32(buf, 16, &pu_reason);\n\treturn 0;\n",
               "\treturn kstrtou32(buf, 16, &pu_reason);\n"),
              ("\tkstrtou32(buf, 16, &pd_reason);\n\treturn 0;\n",
               "\treturn kstrtou32(buf, 16, &pd_reason);\n"),
          ]
          for old, new in pairs:
              n = s.count(old)
              assert n == 1, f"anchor count {n} != 1 for {old!r} (source moved?)"
              s = s.replace(old, new)
          open(p, "w").write(s)
          print("-- bootinfo.c: kstrtou32 return propagated (2 sites)")
          PYEOF
          CNT=$(grep -c $'^\treturn kstrtou32(buf, 16, &p[ud]_reason);$' techpack/bootinfo/bootinfo.c || true)
          [ "$CNT" = "2" ] || { echo "::error::bootinfo.c kstrtou32 fix verification failed (count=$CNT)"; exit 1; }
          echo "-- verified: 2 return-kstrtou32 sites in place"

      - name: Fix misleading indentation in cyttsp5_device_access.c (pure reindent)
        working-directory: kernel
        continue-on-error: true
        run: |
          set -euo pipefail
          python3 <<'PYEOF'
          import re, sys
          p = "drivers/input/touchscreen/cyttsp5/cyttsp5_device_access.c"
          s = open(p).read()
          old1 = ("\tif (test_item > 0 && test_item < 5)\n"
                  "\t\trange_check = 0;\n"
                  "\t\tdad->cmcp_test_items = test_item;\n"
                  "\t\tdad->cmcp_range_check = range_check;\n"
                  "\t\tdad->cmcp_force_calibrate = force_calibrate;\n"
                  "\t\tparade_debug(dev, DEBUG_LEVEL_2,\n"
                  "\t\t\t\"%s: Test item is %s; Range check is %s; Force calibrate is %s.\\n\",\n"
                  "\t\t\t__func__,\n"
                  "\t\t\tcmcp_test_case_array[test_item],\n"
                  "\t\t\tcmcp_test_range_check_array[range_check],\n"
                  "\t\t\tcmcp_test_force_cal_array[force_calibrate]);\n")
          new1 = ("\tif (test_item > 0 && test_item < 5)\n"
                  "\t\trange_check = 0;\n"
                  "\tdad->cmcp_test_items = test_item;\n"
                  "\tdad->cmcp_range_check = range_check;\n"
                  "\tdad->cmcp_force_calibrate = force_calibrate;\n"
                  "\tparade_debug(dev, DEBUG_LEVEL_2,\n"
                  "\t\t\"%s: Test item is %s; Range check is %s; Force calibrate is %s.\\n\",\n"
                  "\t\t__func__,\n"
                  "\t\tcmcp_test_case_array[test_item],\n"
                  "\t\tcmcp_test_range_check_array[range_check],\n"
                  "\t\tcmcp_test_force_cal_array[force_calibrate]);\n")
          old2 = ("\t\t\t\t\tfor (j = 1; j < tx_num; j++)\n"
                  "\t\t\t\t\t\tindex = prepare_print_data(\n"
                  "\t\t\t\t\t\tout_buf,\n"
                  "\t\t\t&cmcp_info->cm_sensor_column_delta[(j-1)*rx_num+i],\n"
                  "\t\t\t\t\t\tindex, 1);\n"
                  "\t\t\t\t\t\tindex = prepare_print_string(\n"
                  "\t\t\t\t\t\t\t\tout_buf,\n"
                  "\t\t\t\t\t\t\t\t\"\\n\", index);\n")
          new2 = ("\t\t\t\t\tfor (j = 1; j < tx_num; j++)\n"
                  "\t\t\t\t\t\tindex = prepare_print_data(\n"
                  "\t\t\t\t\t\t\tout_buf,\n"
                  "\t\t\t\t\t\t\t&cmcp_info->cm_sensor_column_delta[(j-1)*rx_num+i],\n"
                  "\t\t\t\t\t\t\tindex, 1);\n"
                  "\t\t\t\t\tindex = prepare_print_string(\n"
                  "\t\t\t\t\t\tout_buf,\n"
                  "\t\t\t\t\t\t\"\\n\", index);\n")
          base3 = ("\t\t\t\t\tfor (j = 0; j < tx_num; j++)\n"
                   "\t\t\t\t\t\tindex = prepare_print_data(\n"
                   "\t\t\t\t\t\t\tout_buf,\n"
                   "\t\t\t\t&cmcp_info->cm_sensor_row_delta[j*rx_num+i-1],\n"
                   "\t\t\t\t\t\t\tindex, 1);\n"
                   "\t\t\t\t\t\tindex = prepare_print_string(\n")
          tails3 = ("\t\t\t\t\t\t\t\tout_buf,\n"
                    "\t\t\t\t\t\t\t\t\"\\n\", index);\n",
                    "\t\t\t\t\t\t\tout_buf,\n"
                    "\t\t\t\t\t\t\t\"\\n\", index);\n")
          new3 = ("\t\t\t\t\tfor (j = 0; j < tx_num; j++)\n"
                  "\t\t\t\t\t\tindex = prepare_print_data(\n"
                  "\t\t\t\t\t\t\tout_buf,\n"
                  "\t\t\t\t\t\t\t&cmcp_info->cm_sensor_row_delta[j*rx_num+i-1],\n"
                  "\t\t\t\t\t\t\tindex, 1);\n"
                  "\t\t\t\t\tindex = prepare_print_string(\n"
                  "\t\t\t\t\t\tout_buf,\n"
                  "\t\t\t\t\t\t\"\\n\", index);\n")
          orig = s
          applied = []
          if s.count(new1) == 1 and s.count(new2) == 1 and s.count(new3) == 1:
              print("-- cyttsp5_device_access.c: already in canonical form, skipping")
              sys.exit(0)
          for name, o, n in [("cmcp block", old1, new1),
                             ("column-delta loop", old2, new2)]:
              c = s.count(o)
              if c == 1:
                  s = s.replace(o, n)
                  applied.append(name)
              else:
                  print(f"::warning::{name}: anchor count {c} != 1 - skipped (non-fatal)")
          hit = False
          for tail in tails3:
              o = base3 + tail
              if s.count(o) == 1:
                  s = s.replace(o, new3)
                  applied.append("row-delta loop")
                  hit = True
                  break
          if not hit:
              print("::warning::row-delta loop: no known anchor variant matched - skipped (non-fatal)")
          assert re.sub(r"\s+", "", orig) == re.sub(r"\s+", "", s), \
              "token stream changed - aborting (not a pure reindent)"
          open(p, "w").write(s)
          print(f"-- cyttsp5_device_access.c: reindented {len(applied)} site(s), token stream unchanged")
          PYEOF
          echo "-- verified: cyttsp5 reindent step completed"

      - name: Fix sscanf %100s off-by-one in fts_spi (stack overflow guard)
        working-directory: kernel
        continue-on-error: true
        run: |
          set -euo pipefail
          python3 <<'PYEOF'
          fixes = {
              "drivers/input/touchscreen/fts_spi/fts_proc.c": [
                  ('sscanf(p, "%100s", path);', 'sscanf(p, "%99s", path);'),
              ],
              "drivers/input/touchscreen/fts_spi/fts.c": [
                  ('sscanf(buf, "%100s %d %d", path, &mode[0], &mode[1]);',
                   'sscanf(buf, "%99s %d %d", path, &mode[0], &mode[1]);'),
              ],
          }
          for p, pairs in fixes.items():
              s = open(p).read()
              for o, n in pairs:
                  c = s.count(o)
                  assert c == 1, f"{p}: anchor count {c} != 1 (source moved?)"
                  s = s.replace(o, n)
              assert s.count("%100s") == 0, f"{p}: residual %100s remains"
              open(p, "w").write(s)
              print(f"-- {p}: %100s -> %99s ({len(pairs)} site)")
          PYEOF
          ! grep -rn '%100s' drivers/input/touchscreen/fts_spi/ \
            || { echo "::error::%100s still present in fts_spi"; exit 1; }
          echo "-- verified: fts_spi sscanf width fixed, no %100s left"

      - name: Fix PCI_VENDOR_ID_ASIX macro redefinition in 8250_pci.c (no behavior change)
        working-directory: kernel
        continue-on-error: true
        run: |
          set -euo pipefail
          python3 <<'PYEOF'
          import re, sys
          p = "drivers/tty/serial/8250/8250_pci.c"
          s = open(p).read()
          pat = re.compile(r'^#define PCI_VENDOR_ID_ASIX[ \t]+0x9710[ \t]*$', re.M)
          m = pat.search(s)
          if not m:
              sys.exit("::error::anchor '#define PCI_VENDOR_ID_ASIX ... 0x9710' not found (source moved?)")
          prefix = s[:m.start()]
          if prefix.rstrip('\n').endswith('#undef PCI_VENDOR_ID_ASIX'):
              print("-- 8250_pci.c: #undef already present, skipping")
          else:
              s = prefix + '#undef PCI_VENDOR_ID_ASIX\n' + s[m.start():]
              open(p, "w").write(s)
              print("-- 8250_pci.c: inserted #undef before local 0x9710 redefine")
          PYEOF
          grep -n -B1 '^#define PCI_VENDOR_ID_ASIX' drivers/tty/serial/8250/8250_pci.c
          [ "$(grep -c '^#undef PCI_VENDOR_ID_ASIX$' drivers/tty/serial/8250/8250_pci.c)" = "1" ] \
            || { echo "::error::#undef PCI_VENDOR_ID_ASIX missing or duplicated"; exit 1; }
          [ "$(grep -cE '^#define PCI_VENDOR_ID_ASIX[[:space:]]+0x9710' drivers/tty/serial/8250/8250_pci.c)" = "1" ] \
            || { echo "::error::local 0x9710 define missing or duplicated"; exit 1; }
          echo "-- verified: #undef precedes local 0x9710 define; L70 keeps 0x125b, L2680/L5801 keep 0x9710"

      - name: Fix unused label reset_assert in dwc3-qcom.c (no behavior change)
        working-directory: kernel
        continue-on-error: true
        run: |
          set -euo pipefail
          python3 <<'PYEOF'
          import re, sys
          p = "drivers/usb/dwc3/dwc3-qcom.c"
          s = open(p).read()
          if re.search(r'\bgoto\s+reset_assert\s*;', s):
              sys.exit("::error::goto reset_assert exists in file (possibly under #ifdef) - manual review needed")
          label_pat = re.compile(r'^reset_assert:[ \t]*\n', re.M)
          m = label_pat.search(s)
          if not m:
              if "reset_assert:" not in s:
                  print("-- dwc3-qcom.c: reset_assert label already removed, skipping")
                  sys.exit(0)
              sys.exit("::error::anchor '^reset_assert:' not found (source moved?)")
          s = s[:m.start()] + s[m.end():]
          open(p, "w").write(s)
          print("-- dwc3-qcom.c: removed unused reset_assert label (no goto references)")
          PYEOF
          ! grep -q '^reset_assert:' drivers/usb/dwc3/dwc3-qcom.c \
            || { echo "::error::reset_assert label still present"; exit 1; }
          echo "-- verified: reset_assert label removed, no goto references in file"

      - name: Fix array-parameter mismatch in qcacld parser_api.c (no behavior change)
        working-directory: kernel
        continue-on-error: true
        run: |
          set -euo pipefail
          python3 <<'PYEOF'
          import sys
          p = "drivers/staging/qcacld-3.0/core/mac/src/sys/legacy/src/utils/src/parser_api.c"
          s = open(p).read()
          old = "uint8_t mdie[SIR_MDIE_SIZE])"
          new = "uint8_t mdie[])"
          c_old, c_new = s.count(old), s.count(new)
          if c_old == 1:
              s = s.replace(old, new)
              open(p, "w").write(s)
              print("-- parser_api.c: mdie[SIR_MDIE_SIZE] -> mdie[] (matches header)")
          elif c_new >= 1 and c_old == 0:
              print("-- parser_api.c: already fixed, skipping")
          else:
              sys.exit(f"::error::mdie anchor count old={c_old} new={c_new} (source moved?)")
          PYEOF
          grep -q 'uint8_t mdie$$$$)' drivers/staging/qcacld-3.0/core/mac/src/sys/legacy/src/utils/src/parser_api.c \
            || { echo "::error::mdie[] fix verification failed"; exit 1; }
          ! grep -q 'uint8_t mdie$$SIR_MDIE_SIZE$$)' drivers/staging/qcacld-3.0/core/mac/src/sys/legacy/src/utils/src/parser_api.c \
            || { echo "::error::old mdie[SIR_MDIE_SIZE] definition still present"; exit 1; }
          echo "-- verified: mdie[] matches header declaration (array-parameter silenced)"

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential bc bison flex libssl-dev libelf-dev \
            zip unzip python3 perl git curl ccache xxd cpio kmod \
            libtinfo5
          sudo ln -sf /usr/lib/x86_64-linux-gnu/libtinfo.so.6 /usr/lib/x86_64-linux-gnu/libtinfo.so.5 || true

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: .ccache
          key: ccache-kernelsu-star-${{ github.run_id }}
          restore-keys: |
            ccache-kernelsu-star-

      - name: Cache Clang Toolchain
        uses: actions/cache@v4
        id: clang-cache
        with:
          path: ${{ env.CLANG_DIR }}
          key: clang-17.0.6-x86_64-ubuntu22.04

      - name: Download Clang 17.0.6
        if: steps.clang-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p "${{ env.CLANG_DIR }}"
          curl -fL --retry 3 -o /tmp/clang.tar.xz \
            https://github.com/llvm/llvm-project/releases/download/llvmorg-17.0.6/clang+llvm-17.0.6-x86_64-linux-gnu-ubuntu-22.04.tar.xz
          tar -xf /tmp/clang.tar.xz -C "${{ env.CLANG_DIR }}" --strip-components=1

      - name: Verify Clang
        run: ${{ env.CLANG_DIR }}/bin/clang --version

      - name: Integrate KernelSU (backslashxx master, no SUSFS)
        working-directory: kernel
        env:
          KSU_PIN_EFF: ${{ steps.meta.outputs.ksu_pin }}
          KSU_BRANCH_EFF: ${{ env.KSU_BRANCH }}
          KSU_REPO_EFF: ${{ env.KSU_REPO }}
          IN_DISABLE_PREINIT: ${{ steps.meta.outputs.disable_preinit }}
          IN_KSU_ENABLED: ${{ steps.meta.outputs.ksu_enabled }}
          IN_THREADED_THRONE: ${{ steps.meta.outputs.threaded_throne }}
        run: |
          set -euo pipefail
          echo "== 使用 backslashxx/KernelSU master 主线驱动（无 SUSFS）=="
          echo "-- effective KSU pin: ${KSU_PIN_EFF}"
          echo "== 删除内核树自带的 SukiSU/BakaSU 驱动，换上主线 =="
          rm -rf KernelSU
          git clone --filter=blob:none --no-checkout -b "${KSU_BRANCH_EFF}" \
            "${KSU_REPO_EFF}" KernelSU
          git -C KernelSU fetch --depth=1 origin "${KSU_PIN_EFF}" \
            || git -C KernelSU fetch origin "${KSU_PIN_EFF}"
          git -C KernelSU checkout --detach "${KSU_PIN_EFF}"
          ACTUAL_SHORT="$(git -C KernelSU rev-parse --short=8 HEAD)"
          PIN_SHORT="${KSU_PIN_EFF:0:8}"
          if [ "${PIN_SHORT}" != "${ACTUAL_SHORT}" ]; then
            echo "::error::KernelSU checkout ${ACTUAL_SHORT} != pinned ${PIN_SHORT}"
            exit 1
          fi
          echo "KernelSU: $(git -C KernelSU log -1 --format='%h %s')"
          echo "== 校验主线身份（me.weishu.kernelsu / KSU_VERSION 32731，无 SUSFS）=="
          test -f KernelSU/kernel/Makefile \
            || { echo "::error::KernelSU/kernel/Makefile missing (unity-build entry)"; exit 1; }
          test -f KernelSU/kernel/Kconfig \
            || { echo "::error::KernelSU/kernel/Kconfig missing (driver drifted)"; exit 1; }
          test -f KernelSU/kernel/kernel_compat.h \
            || { echo "::error::KernelSU/kernel/kernel_compat.h missing"; exit 1; }
          test -d KernelSU/kernel \
            || { echo "::error::KernelSU/kernel directory missing"; exit 1; }
          grep -Eq '^KSU_PACKAGE_NAME[[:space:]]*:=[[:space:]]*me\.weishu\.kernelsu$' KernelSU/kernel/Makefile \
            || { echo "::error::not backslashxx mainline (KSU_PACKAGE_NAME != me.weishu.kernelsu)"; exit 1; }
          grep -q -- '-DKSU_VERSION=32731' KernelSU/kernel/Makefile \
            || { echo "::error::not backslashxx mainline (KSU_VERSION != 32731)"; exit 1; }
          if grep -rq 'com\.sukisu\.' KernelSU/kernel; then
            echo "::error::SukiSU source detected - expected backslashxx mainline"; exit 1
          fi
          if grep -q 'config KSU_SUSFS' KernelSU/kernel/Kconfig; then
            echo "::error::driver unexpectedly carries SUSFS Kconfig - source drifted"; exit 1
          fi
          echo "-- backslashxx mainline identity verified (me.weishu.kernelsu, SUSFS absent)"
          echo "== 校验 hook 策略符号 / preinit 门控（KSU 升级漂移兜底）=="
          KCFG=KernelSU/kernel/Kconfig
          grep -q 'config KSU_LSM_SECURITY_HOOKS' "$KCFG" \
            || { echo "::error::KSU_LSM_SECURITY_HOOKS Kconfig symbol missing - hook strategy changed"; exit 1; }
          grep -q 'config KSU_TAMPER_SYSCALL_TABLE' "$KCFG" \
            || { echo "::error::KSU_TAMPER_SYSCALL_TABLE Kconfig symbol missing"; exit 1; }
          # r5 新增：D 组开关必须在当前 pin 的 Kconfig 里真实存在，否则
          # scripts/config --enable 写入的符号会被 olddefconfig 丢弃，对照空跑。
          if [ "${IN_THREADED_THRONE:-false}" = "true" ] && [ "$IN_KSU_ENABLED" = "true" ]; then
            grep -q 'config KSU_THRONE_TRACKER_ALWAYS_THREADED' "$KCFG" \
              || { echo "::error::KSU_THRONE_TRACKER_ALWAYS_THREADED Kconfig symbol missing - D-group control would be a silent no-op"; exit 1; }
            echo "-- D-group knob exists in Kconfig (default n, depends on KSU)"
          fi
          if [ -f KernelSU/kernel/preinit/preinit.h ]; then
            if grep -q 'KSU_CAN_USE_JUMP_LABEL' KernelSU/kernel/preinit/preinit.h; then
              echo "-- preinit gated by CONFIG_ARM64 && KSU_CAN_USE_JUMP_LABEL (NOT UAPI headers)"
            else
              echo "::warning::preinit.h gating changed - re-audit disable_preinit input"
            fi
          else
            echo "::warning::preinit/preinit.h absent (older pin) - preinit N/A, disable_preinit will be skipped"
          fi
          echo "== 确认主线自带 5.4 兼容层（无需源码补丁）=="
          grep -q 'strncpy_from_user_nofault' KernelSU/kernel/kernel_compat.h \
            || { echo "::error::kernel_compat.h missing - 5.4 build would fail"; exit 1; }
          echo "-- 5.4 compat layer present (kernel_compat.h weak fallback); zero source patch"
          echo "== 接线 drivers/kernelsu（主动规范化，不依赖 checkout 现成形态）=="
          # r5 改动：vendor 树若该路径是真实目录（自带 BakaSU/SukiSU 驱动）、
          # 断开的链接或缺失，一律替换成指向主线 KernelSU/kernel 的符号链接，
          # 避免误把旧驱动编进内核（此前版本只是“验证现成链接”，不够稳）。
          rm -rf drivers/kernelsu
          ln -sfn ../KernelSU/kernel drivers/kernelsu
          test -L drivers/kernelsu || { echo "::error::drivers/kernelsu symlink creation failed"; exit 1; }
          LINK_TARGET="$(readlink drivers/kernelsu)"
          echo "-- drivers/kernelsu -> $LINK_TARGET"
          case "$LINK_TARGET" in
            *KernelSU/kernel*) ;;
            *) echo "::error::unexpected drivers/kernelsu target: $LINK_TARGET"; exit 1 ;;
          esac
          test -f drivers/kernelsu/Makefile || { echo "::error::drivers/kernelsu/Makefile missing"; exit 1; }
          grep -q 'obj-$(CONFIG_KSU)' drivers/Makefile \
            || { echo "::error::drivers/Makefile lacks KSU object"; exit 1; }
          grep -q 'drivers/kernelsu/Kconfig' drivers/Kconfig \
            || { echo "::error::drivers/Kconfig lacks kernelsu source"; exit 1; }
          echo "-- driver wiring verified (symlink + Makefile + Kconfig)"
          echo "== B 组对照：按需关闭 downstream preinit =="
          if [ "$IN_DISABLE_PREINIT" = "true" ] && [ "$IN_KSU_ENABLED" = "true" ]; then
            # r5 新增前置断言：确认当前 pin 真正消费 KSU_NO_PREINIT。
            # 已核对 ae59aa55：ksu.c 的 unity-build 段用
            #   #ifndef KSU_NO_PREINIT
            #   #include "preinit/runner/runner_xxd.h"
            #   #include "preinit/preinit.c"
            #   #endif
            # preinit/preinit.h 也按该宏裁剪。若未来 pin 移除这些引用，
            # 注入就变成空操作，对照实验会得出错误结论 —— 宁可报错。
            grep -rq 'KSU_NO_PREINIT' KernelSU/kernel \
              || { echo "::error::KSU_NO_PREINIT not referenced by this KSU pin - B-group control would be a silent no-op"; exit 1; }
            python3 - <<'PY'
          p = "KernelSU/kernel/ksu.c"
          s = open(p).read()
          anchor = '#include "kernel_includes.h"\n'
          assert s.count(anchor) == 1, "ksu.c anchor moved - manual review needed"
          if not re.search(r'^#define\s+KSU_NO_PREINIT\b', s, re.M):
              s = s.replace(anchor,
                  anchor + "\n/* B-group control: disable downstream preinit runner */\n#define KSU_NO_PREINIT\n")
          open(p, "w").write(s)
          print("-- injected KSU_NO_PREINIT into ksu.c")
          PY
            grep -q '^#define KSU_NO_PREINIT' KernelSU/kernel/ksu.c \
              || { echo "::error::KSU_NO_PREINIT injection failed"; exit 1; }
            # r5 新增：注入点必须早于首次使用点。当前 pin 已核对满足；
            # 升级 PIN 后若顺序颠倒，宏对 preinit.h / unity 块都不可见。
            INJ=$(grep -n '^#define KSU_NO_PREINIT' KernelSU/kernel/ksu.c | head -1 | cut -d: -f1)
            USE=$(grep -n '#ifndef KSU_NO_PREINIT' KernelSU/kernel/ksu.c | head -1 | cut -d: -f1)
            [ -n "$INJ" ] && [ -n "$USE" ] && [ "$INJ" -lt "$USE" ] \
              || { echo "::error::KSU_NO_PREINIT injected after first use (INJ=$INJ USE=$USE)"; exit 1; }
            echo "-- preinit runner disabled for this build (INJ=L${INJ} < USE=L${USE})"
          else
            echo "-- preinit runner left at source default"
          fi
          echo "-- NOTE: CONFIG_KSU_SUSFS intentionally stays undefined; vendor manual-hook hooks remain dormant"

      - name: Configure Kernel (backslashxx mainline, no SUSFS)
        working-directory: kernel
        env:
          KSU_ENABLED: ${{ steps.meta.outputs.ksu_enabled }}
          THREADED_THRONE: ${{ steps.meta.outputs.threaded_throne }}
          DISABLE_PREINIT: ${{ steps.meta.outputs.disable_preinit }}
        run: |
          set -euo pipefail
          export ARCH=arm64
          export PATH="${{ env.CLANG_DIR }}/bin:$PATH"
          export LLVM=1 LLVM_IAS=1 \
                 CLANG_TRIPLE=aarch64-linux-gnu- \
                 CROSS_COMPILE=aarch64-linux-gnu- \
                 CROSS_COMPILE_COMPAT=arm-linux-gnueabi-
          echo "== 清洗 defconfig 全角括号（上游腐烂，会静默关闭 CONFIG_MIHW）=="
          DEFCONFIG_PATH="./arch/arm64/configs/${{ env.DEFCONFIG_NAME }}"
          test -f "$DEFCONFIG_PATH" || { echo "::error::defconfig not found at $DEFCONFIG_PATH"; exit 1; }
          sed -i 's/\xEF\xBC\x88//g; s/\xEF\xBC\x89//g' "$DEFCONFIG_PATH"
          grep -q '^CONFIG_MIHW=y' "$DEFCONFIG_PATH" \
            || { echo "::error::defconfig sanitize failed (MIHW line)"; exit 1; }
          echo "== 确保 defconfig 不含任何 CONFIG_KSU_SUSFS* =="
          ! grep -q '^CONFIG_KSU_SUSFS' "$DEFCONFIG_PATH" \
            || { echo "::error::defconfig must not contain CONFIG_KSU_SUSFS"; exit 1; }
          echo "== 启用 pstore ramoops（异常开机取证：/sys/fs/pstore/console-ramoops-*）=="
          for sym in PSTORE PSTORE_RAM PSTORE_CONSOLE; do
            echo "CONFIG_${sym}=y" >> "$DEFCONFIG_PATH"
          done
          echo "== 生成 defconfig =="
          make O=out ARCH=arm64 "${{ env.DEFCONFIG_NAME }}"
          echo "== 配置 KernelSU 主线：保持主线默认 hook，关闭调试指纹 =="
          if [ "$KSU_ENABLED" = "true" ]; then
            KSU_SWITCH="--enable KSU"
          else
            KSU_SWITCH="--disable KSU"
          fi
          scripts/config --file out/.config \
            $KSU_SWITCH \
            --disable KSU_DEBUG \
            --enable  KALLSYMS_ALL \
            --disable UAPI_HEADER_TEST \
            --disable HEADERS_INSTALL \
            --disable LOCALVERSION_AUTO \
            --disable IKCONFIG \
            --disable IKCONFIG_PROC \
            --set-str LOCALVERSION ""
          if [ "$THREADED_THRONE" = "true" ] && [ "$KSU_ENABLED" = "true" ]; then
            echo "-- D 组对照：启用 KSU_THRONE_TRACKER_ALWAYS_THREADED"
            scripts/config --file out/.config --enable KSU_THRONE_TRACKER_ALWAYS_THREADED
          fi
          grep -q '^CONFIG_IKCONFIG_PROC=y' out/.config \
          && { echo "::error::/proc/config.gz exposed - any app can grep CONFIG_KSU from it"; exit 1; } || true
          make O=out ARCH=arm64 olddefconfig
          echo "== 校验配置 =="
          echo "-- KSU/PSTORE/依赖 当前状态 --"
          grep -nE '^CONFIG_(KSU|PSTORE|THREAD_INFO_IN_TASK|OVERLAY_FS)' out/.config || true
          if [ "$KSU_ENABLED" = "true" ]; then
            grep -q '^CONFIG_KSU=y' out/.config \
              || { echo "::error::CONFIG_KSU not enabled"; exit 1; }
            echo "== 断言 hook 策略（防止 KSU 升级后默认值漂移）=="
            grep -q '^CONFIG_KSU_LSM_SECURITY_HOOKS=y' out/.config \
              || { echo "::error::KSU LSM hooks not enabled - expected mainline default"; exit 1; }
            if grep -qE '^CONFIG_KSU_(TAMPER_SYSCALL_TABLE|HACK_ARM64_BRANCH_LINK)=y' out/.config; then
              echo "::error::syscall-table / branch-link hook enabled - expected off for in-tree KSU=y"; exit 1
            fi
            # r5 新增：D 组开关必须在 olddefconfig 之后仍为 y。
            # scripts/config 写入的符号若依赖未满足会被丢弃，此时对照会退化成默认配置。
            if [ "$THREADED_THRONE" = "true" ]; then
              grep -q '^CONFIG_KSU_THRONE_TRACKER_ALWAYS_THREADED=y' out/.config \
                || { echo "::error::D-group KSU_THRONE_TRACKER_ALWAYS_THREADED dropped by olddefconfig - control invalid"; exit 1; }
              echo "-- D-group knob survived olddefconfig (=y)"
            fi
            # r5 新增：若 JUMP_LABEL 关闭，preinit 本来就会被 preinit.h 编译掉，
            # B 组与默认构建等价 —— 给出显式告警，避免误判“关 preinit 无效”。
            if [ "$DISABLE_PREINIT" = "true" ]; then
              grep -q '^CONFIG_JUMP_LABEL=y' out/.config \
                || echo "::warning::JUMP_LABEL is off: preinit may already be compiled out by preinit.h; B-group control may be a no-op"
            fi
          else
            if grep -q '^CONFIG_KSU=y' out/.config; then
              echo "::error::CONFIG_KSU still enabled in A-group control build"; exit 1
            fi
            echo "-- A 组对照：CONFIG_KSU=n（纯内核），KSU 相关断言跳过"
          fi
          for sym in PSTORE PSTORE_RAM PSTORE_CONSOLE; do
            grep -q "^CONFIG_${sym}=y" out/.config \
              || { echo "::error::CONFIG_${sym} not enabled"; exit 1; }
          done
          grep -q '^CONFIG_KSU_SUSFS' out/.config \
            && { echo "::error::CONFIG_KSU_SUSFS must stay off (breaks LTO link)"; exit 1; } || true
          grep -q '^CONFIG_KSU_DEBUG=y' out/.config \
            && { echo "::error::KSU_DEBUG must stay off (dmesg fingerprint)"; exit 1; } || true
          grep -q '^CONFIG_LOCALVERSION_AUTO=y' out/.config \
            && { echo "::error::LOCALVERSION_AUTO must stay off (uname -r would gain -g<sha>)"; exit 1; } || true
          echo "-- verified: SUSFS absent, no debug fingerprints"

      - name: 修复编译警告
        working-directory: kernel
        run: |
          set -e
          FOCALTECH_MAKEFILE="drivers/input/touchscreen/focaltech_touch/Makefile"
          if [ -f "$FOCALTECH_MAKEFILE" ]; then
            sed -i 's/^ \+/\t/' "$FOCALTECH_MAKEFILE"
            echo "Fixed leading spaces in focaltech Makefile"
          fi
          for entry in \
            "drivers/staging/qcacld-3.0:-Wno-format" \
            "drivers/staging/qca-wifi-host-cmn:-Wno-format" \
            "drivers/thermal:-Wno-fortify-source"; do
            DIR="${entry%%:*}"
            FLAG="${entry##*:}"
            if [ -d "$DIR" ] && [ -f "$DIR/Makefile" ]; then
              grep -q -- "$FLAG" "$DIR/Makefile" || echo "ccflags-y += $FLAG" >> "$DIR/Makefile"
            fi
          done

      - name: Build Kernel
        working-directory: kernel
        run: |
          export ARCH=arm64
          export PATH="${{ env.CLANG_DIR }}/bin:$PATH"
          export LLVM=1 LLVM_IAS=1 \
                 CLANG_TRIPLE=aarch64-linux-gnu- \
                 CROSS_COMPILE=aarch64-linux-gnu- \
                 CROSS_COMPILE_COMPAT=arm-linux-gnueabi-
          export CCACHE_DIR="${{ github.workspace }}/.ccache"
          export CCACHE_MAXSIZE=8G
          export KBUILD_BUILD_USER=builder
          export KBUILD_BUILD_HOST=android-build
          export KBUILD_BUILD_TIMESTAMP="Thu Jun 12 10:00:00 UTC 2025"
          echo "== 构建身份（二分对照可追溯）=="
          echo "-- kernel pin : $(git rev-parse --short=8 HEAD)"
          echo "-- ksu pin    : $(git -C KernelSU rev-parse --short=8 HEAD)"
          echo "-- CONFIG_KSU : $(grep -E '^CONFIG_KSU=' out/.config || echo 'CONFIG_KSU=n (unset)')"
          echo "-- variant    : ${{ steps.meta.outputs.variant }}"
          set +e
          make -j$(nproc) O=out ARCH=arm64 \
            CC="ccache clang" LD="ld.lld" AR="llvm-ar" NM="llvm-nm" \
            OBJCOPY="llvm-objcopy" OBJDUMP="llvm-objdump" STRIP="llvm-strip" \
            CLANG_TRIPLE="aarch64-linux-gnu-" CROSS_COMPILE="aarch64-linux-gnu-" \
            KCFLAGS="-Wno-unknown-warning-option -Wno-error -Wno-format -Wno-incompatible-pointer-types \
            -Wno-implicit-function-declaration -Wno-strict-prototypes -Wno-missing-prototypes \
            -Wno-int-conversion -Wno-declaration-after-statement \
            -Wframe-larger-than=131072 -Wno-unused-variable -Wno-unused-function \
            -Wno-missing-braces -Wno-int-to-pointer-cast -Wno-address-of-packed-member \
            -Wno-return-type -Wno-shift-negative-value -Wno-array-bounds \
            -Wno-misleading-indentation -Wno-unused-result -Wno-unused-label \
            -Wno-macro-redefined -Wno-array-parameter -Wno-fortify-source" \
            HOSTCFLAGS="" 2>&1 | tee build.log
          if [ ${PIPESTATUS[0]} -ne 0 ]; then
            echo "::error::Kernel build failed. Last 200 lines:"
            tail -n 200 build.log
            exit 1
          fi
          echo "=== Build finished ==="
          ccache -s 2>/dev/null || true
          ls -lh out/arch/arm64/boot/Image
          # r5 新增：从编译产物反查 preinit 是否真的被编进去。
          # preinit 启用时 ksu.c 会编译进 pr_info("preinit: remove preinit execve branches")；
          # KSU_NO_PREINIT 生效时该字符串应完全消失（preinit.h 提供空 stub）。
          # 这是 B 组对照的最后一道防线：源码断言过了但编译器却没按预期裁剪，也能抓到。
          echo "== 对照组生效性复核（从 kernelsu.o 反查）=="
          KSU_OBJ=$(find out -name 'kernelsu.o' -type f 2>/dev/null | head -1)
          if [ -n "$KSU_OBJ" ]; then
            if grep -aq 'preinit: remove preinit execve branches' "$KSU_OBJ"; then
              echo "-- compiled preinit: ON  (${KSU_OBJ})"
              if [ "${{ steps.meta.outputs.disable_preinit }}" = "true" ]; then
                echo "::error::B-group control invalid: preinit code still present in ${KSU_OBJ}"
                exit 1
              fi
            else
              echo "-- compiled preinit: OFF (${KSU_OBJ})"
              if [ "${{ steps.meta.outputs.ksu_enabled }}" = "true" ] && \
                 [ "${{ steps.meta.outputs.disable_preinit }}" != "true" ]; then
                echo "::warning::preinit unexpectedly absent - check KSU_CAN_USE_JUMP_LABEL gating"
              fi
            fi
          else
            echo "::warning::kernelsu.o not found - skipped compiled-state verification"
          fi

      - name: Package AnyKernel3
        id: package
        run: |
          set -e
          TIME=$(TZ='Asia/Shanghai' date +%Y%m%d-%H%M)
          VARIANT="${{ steps.meta.outputs.variant }}"
          KERNEL_SHA=$(git -C "${{ env.KERNEL_DIR }}" rev-parse --short=8 HEAD)
          KSU_SHA=$(git -C "${{ env.KERNEL_DIR }}/KernelSU" rev-parse --short=8 HEAD)
          KSU_CFG=$(grep -E '^CONFIG_KSU=' "${{ env.KERNEL_DIR }}/${{ env.OUTPUT_DIR }}/.config" || echo 'CONFIG_KSU=n')
          IMG_PATH="${{ env.KERNEL_DIR }}/${{ env.OUTPUT_DIR }}/arch/arm64/boot/Image"
          test -f "$IMG_PATH"
          rm -rf AnyKernel3
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git
          cd AnyKernel3
          cp "$IMG_PATH" ./Image
          gzip -9 -f ./Image
          rm -f ./Image
          cat > anykernel.sh <<'AK3'
          ### AnyKernel3 Ramdisk Mod Script
          ## osm0sis @ xda-developers
          ### AnyKernel setup
          # global properties
          properties() { '
          kernel.string=Edwin KernelSU for star | ksrc=__KERNEL_SHA__ ksu=__KSU_SHA__ __KSU_CFG__ __VARIANT__
          do.devicecheck=1
          do.modules=0
          do.systemless=1
          do.cleanup=1
          do.cleanuponabort=0
          device.name1=star
          device.name2=mars
          supported.versions=
          supported.patchlevels=
          supported.vendorpatchlevels=
          '; } # end properties
          ### AnyKernel install
          # boot files attributes
          boot_attributes() {
          set_perm_recursive 0 0 755 644 $RAMDISK/*;
          set_perm_recursive 0 0 750 750 $RAMDISK/init* $RAMDISK/sbin;
          } # end attributes
          # boot shell variables
          BLOCK=boot;
          IS_SLOT_DEVICE=1;
          RAMDISK_COMPRESSION=auto;
          PATCH_VBMETA_FLAG=auto;
          # import functions/variables and setup patching - see for reference (DO NOT REMOVE)
          . tools/ak3-core.sh;
          # boot install
          split_boot;
          flash_boot;
          ## end boot install
          AK3
          chmod +x anykernel.sh
          sed -i "s|__KERNEL_SHA__|${KERNEL_SHA}|g; s|__KSU_SHA__|${KSU_SHA}|g; s|__KSU_CFG__|${KSU_CFG}|g; s|__VARIANT__|${VARIANT}|g" anykernel.sh
          if grep -q '__KERNEL_SHA__\|__KSU_SHA__\|__KSU_CFG__\|__VARIANT__' anykernel.sh; then
            echo "::error::placeholder substitution failed"; exit 1
          fi
          grep -n 'kernel.string=' anykernel.sh
          ZIPNAME="${{ env.DEVICE_CODENAME }}-KernelSU-${VARIANT}-${TIME}.zip"
          zip -r9 "../${ZIPNAME}" ./*
          echo "zip=${ZIPNAME}" >> "$GITHUB_OUTPUT"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: star-KernelSU-${{ steps.meta.outputs.variant }}
          path: ${{ steps.package.outputs.zip }}
