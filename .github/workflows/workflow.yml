name: 'Pack Process.'

runs:
  using: 'composite'
  steps:
      - name: Make Anykernel3 Flasher
        if: env.PACK_METHOD == 'Anykernel3'
        shell: bash
        run: |
          set -e
          TIME=$(date +"%Y%m%d%H%M%S")
          cd "$GITHUB_WORKSPACE"

          # ==============================================
          # 🔥 强制只找 oImage（你日志里已经生成的文件）
          # ==============================================
          if [[ -f "oImage" ]]; then
            IMAGE_FILE="oImage"
            echo "✅ 找到修补完成的内核：oImage"
          else
            echo "❌ 找不到 oImage"
            exit 1
          fi

          # 准备打包目录
          mkdir -p tmp

          # Anykernel3 配置
          if [[ "${{ env.AK3_SOURCE }}" =~ "osm0sis" ]]; then
            sed -i 's/ExampleKernel by osm0sis @ xda-developers/NonGKI Kernel/g' Anykernel3/anykernel.sh
            sed -i 's/do.devicecheck=1/do.devicecheck=0/g' Anykernel3/anykernel.sh
            sed -i 's!BLOCK=/dev/.../boot;!BLOCK=boot;!g' Anykernel3/anykernel.sh
            sed -i 's/IS_SLOT_DEVICE=0;/IS_SLOT_DEVICE=1;/g' Anykernel3/anykernel.sh
            echo "✅ 配置 Anykernel3 完成"
          fi

          # 复制内核
          cp -v "$IMAGE_FILE" tmp/Image
          echo "✅ 复制内核完成"

          # 复制模块（忽略找不到的错误）
          mkdir -p tmp/modules/vendor/lib/modules
          find . -name "*.ko" 2>/dev/null -exec cp {} tmp/modules/vendor/lib/modules/ \; || true

          # 复制 AK3
          cp -rp ./Anykernel3/* tmp/

          # 打包
          cd tmp
          7za a -mx9 package.zip ./*
          cd ..

          # 输出最终包
          FINAL_ZIP=${{ env.DEVICE_CODENAME }}-${{ env.ROM_TEXT }}-$TIME-Anykernel3.zip
          mv tmp/package.zip "$FINAL_ZIP"

          # 清理
          rm -rf tmp

          # 输出变量
          echo "PACK_NAME=$FINAL_ZIP" >> "$GITHUB_ENV"
          echo "✅ 打包成功：$FINAL_ZIP"
