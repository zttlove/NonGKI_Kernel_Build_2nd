name: Xiaomi11U 内核自动构建&Release

on:
  workflow_dispatch

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PACK_METHOD: Anykernel3
  AK3_SOURCE: osm0sis
  GENERATE_DTB: false
  GENERATE_CHIP: msm
  PACK_KMODULES: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取仓库代码
        uses: actions/checkout@v4

      # =====================
      # 【这里粘贴你原有全部内核编译命令】
      # =====================

      - name: 打包 Anykernel3 刷机包
        if: env.PACK_METHOD == 'Anykernel3'
        shell: bash
        run: |
          ROOT="$GITHUB_WORKSPACE"
          KERNEL_DIR="${ROOT}"
          cd "${KERNEL_DIR}"

          TIME=$(TZ=Asia/Shanghai date +%Y%m%d-%H%M%S)

          if [[ -d "arch/arm64/configs" ]]; then
            IMAGE_DIR="${KERNEL_DIR}/out/arch/arm64/boot"
          else
            IMAGE_DIR="${KERNEL_DIR}/out/arch/arm/boot"
          fi

          rm -rf tmp
          mkdir -p tmp

          # 处理 Anykernel3
          if [[ "${AK3_SOURCE}" =~ "osm0sis" ]]; then
            sed -i 's/ExampleKernel by osm0sis @ xda-developers/NonGKI Kernel Build by JackAltman @ Github/g' Anykernel3/anykernel.sh
            sed -i 's/do.devicecheck=1/do.devicecheck=0/g' Anykernel3/anykernel.sh
            sed -i 's!BLOCK=/dev/block/platform/omap/omap_hsmmc.0/by-name/boot;!BLOCK=auto;!g' Anykernel3/anykernel.sh
            sed -i 's/device.name1=.*/device.name1=star/g' Anykernel3/anykernel.sh
            sed -i 's/BLOCK=auto;/BLOCK=boot;/g' Anykernel3/anykernel.sh
            sed -i 's/IS_SLOT_DEVICE=0;/IS_SLOT_DEVICE=1/g' Anykernel3/anykernel.sh
            sed -i '/fstab.tuna/d' Anykernel3/anykernel.sh
            curl -L https://raw.githubusercontent.com/zttlove/NonGKI_Kernel_Build_2nd/mainline/Patches/anykernel.sh -o Anykernel3/anykernel.sh
            chmod +x Anykernel3/anykernel.sh
          fi

          # 复制内核镜像
          if [[ -f "$IMAGE_DIR/Image.gz-dtb" ]]; then
            cp -fp "$IMAGE_DIR/Image.gz-dtb" tmp
          elif [[ -f "$IMAGE_DIR/Image.gz" ]]; then
            cp -fp "$IMAGE_DIR/Image.gz" tmp
          fi

          # 复制内核模块
          if [ "${PACK_KMODULES}" == "true" ]; then
            mkdir -p tmp/modules/vendor/lib/modules
            find "${KERNEL_DIR}/out/" -name "*.ko" -exec cp -fp {} tmp/modules/vendor/lib/modules/ \;
          fi

          cp -rp ./Anykernel3/* tmp/

          # 生成最终ZIP
          API_URL="https://api.github.com/repos/cctv18/ReSukiSU_CI/releases/latest"
          TAG=$(curl -sL "$API_URL" | jq -r '.name')
          BUILD_NUM=$(echo "$TAG" | grep -oE '[0-9]+' | head -n1)
          FINAL_ZIP="AK3-5.4.247-ReSukiSU-${BUILD_NUM}-star_KPM.zip"
          ZIP_FULL="${ROOT}/${FINAL_ZIP}"

          cd tmp
          7za a -mx9 -tzip "$ZIP_FULL" ./*
          cd ..

          rm -rf tmp
          echo "PACK_NAME=$FINAL_ZIP" >> "$GITHUB_ENV"

      - name: 上传构建产物
        uses: actions/upload-artifact@v6
        with:
          name: Kernel-Package
          path: ${{ env.PACK_NAME }}
          if-no-files-found: error

  # 自动发布Release任务
  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: 下载构建成品
        uses: actions/download-artifact@v4
        with:
          name: Kernel-Package

      - name: 自动创建Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: Build-${{ github.run_number }}
          name: Build #${{ github.run_number }}
          files: ./*.zip
          update_existing: false
          prerelease: false
          make_latest: true
