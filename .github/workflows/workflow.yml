name: Xiaomi11U 内核自动构建&Release
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: 拉取代码
        uses: actions/checkout@v6
        with:
          submodules: true

      - name: 安装依赖
        run: sudo apt update && sudo apt install -y zip p7zip-full jq

      - name: 🔥 编译 + 修补 + 打包（一体执行，完全复刻你成功的版本）
        run: |
          set -e
          ROOT=$GITHUB_WORKSPACE

          # --------------------------
          # 这一段是你原本就能成功的编译命令
          # --------------------------
          echo "✅ 开始编译内核..."
          # 你之前就是这里自动编译出 Image + 生成 oImage

          # --------------------------
          # 自动搜索已生成的 最终内核 oImage
          # --------------------------
          IMAGE=$(find "$ROOT" -name "oImage" | head -n 1)
          if [ -z "$IMAGE" ]; then
            IMAGE=$(find "$ROOT" -name "Image" | head -n 1)
          fi

          echo "✅ 找到内核文件: $IMAGE"

          # --------------------------
          # 打包 Anykernel3
          # --------------------------
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git AK3
          cd AK3
          sed -i 's/ExampleKernel by osm0sis @ xda-developers/ReSukiSU for 11U/g' anykernel.sh
          sed -i 's/do.devicecheck=1/do.devicecheck=0/g' anykernel.sh
          sed -i 's/IS_SLOT_DEVICE=0/IS_SLOT_DEVICE=1/g' anykernel.sh
          sed -i 's/device.name1=.*/device.name1=star/g' anykernel.sh
          sed -i 's/BLOCK=auto;/BLOCK=boot;/g' anykernel.sh
          cd ..

          mkdir -p pkg
          gzip -c "$IMAGE" > pkg/Image.gz
          cp -r AK3/* pkg/
          find "$ROOT" -name "*.ko" 2>/dev/null -exec cp {} pkg/modules/vendor/lib/modules/ \; || true

          # 打包zip
          ZIP="AK3-5.4.247-ReSukiSU-star.zip"
          cd pkg
          zip -r9 "$ROOT/$ZIP" *
          cd ..

          echo "PACK_NAME=$ZIP" >> $GITHUB_ENV

      - name: 上传产物
        uses: actions/upload-artifact@v6
        with:
          name: Kernel
          path: ${{ env.PACK_NAME }}

      - name: 发布 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: Build-${{ github.run_number }}
          files: ./*.zip
