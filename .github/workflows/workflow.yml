name: Xiaomi11U 内核自动构建&Release
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# 【关键】这里必须填你环境里的真实配置
env:
  PACK_METHOD: Anykernel3
  AK3_SOURCE: osm0sis
  GENERATE_DTB: false
  GENERATE_CHIP: msm
  PACK_KMODULES: true
  DEVICE_CODENAME: star
  DEVICE_NAME: star
  ROM_TEXT: ReSukiSU

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: 拉取代码
        uses: actions/checkout@v6
        with:
          submodules: true

      - name: 安装依赖
        run: sudo apt update && sudo apt install -y p7zip-full git

      # 1. 克隆 AK3
      - name: 克隆 Anykernel3
        run: git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git Anykernel3

      # 2. 【核心】调用你仓库里【原本就完美能用】的打包脚本！！！
      - name: 调用官方打包流程
        uses: ./.github/workflows/pack-process   # 直接调用你本地的 Pack Process 脚本

      # 3. 上传
      - name: 上传刷机包
        uses: actions/upload-artifact@v6
        with:
          name: Kernel-Package
          path: ${{ env.PACK_NAME }}

      # 4. 发布 Release
      - name: 发布 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: Build-${{ github.run_number }}
          name: Xiaomi 11U ReSukiSU - ${{ github.run_number }}
          files: ./*.zip
