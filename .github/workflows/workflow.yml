name: Xiaomi11U 内核自动构建&Release
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PACK_METHOD: Anykernel3
  AK3_SOURCE: osm0sis
  GENERATE_DTB: false
  GENERATE_CHIP: msm
  PACK_KMODULES: true
  DEVICE: star
  DEFCONFIG: vendor/star_defconfig
  ARCH: arm64

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: 拉取仓库代码
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      # 修复：安装 Ubuntu 22.04 兼容的编译依赖（废弃包全部移除）
      - name: 安装编译依赖
        run: |
          sudo apt update -y
          sudo apt install -y bc bison build-essential ccache curl flex git git-lfs \
            libelf-dev liblz4-tool libncurses-dev libsdl1.2-dev libssl-dev \
            libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools \
            xsltproc zip zlib1g-dev python3 python3-pip

      - name: 克隆GCC工具链
        run: |
          git clone --depth=1 https://github.com/mvaisakh/gcc-arm64.git gcc64
          git clone --depth=1 https://github.com/mvaisakh/gcc-arm.git gcc32

      - name: 编译内核
        run: |
          export PATH="${GITHUB_WORKSPACE}/gcc64/bin:${GITHUB_WORKSPACE}/gcc32/bin:$PATH"
          make O=out ARCH=$ARCH $DEFCONFIG
          make -j$(nproc) O=out ARCH=$ARCH CROSS_COMPILE=aarch64-elf- CROSS_COMPILE_ARM32=arm-eabi-

      # 克隆 Anykernel3
      - name: 克隆 Anykernel3
        run: git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git Anykernel3

      - name: 打包 Anykernel3 刷机包
        if: env.PACK_METHOD == 'Anykernel3'
        shell: bash
        run: |
          ROOT="$GITHUB_WORKSPACE"
          KERNEL_DIR="${ROOT}"
          cd "${KERNEL_DIR}"
          IMAGE_DIR="${KERNEL_DIR}/out/arch/arm64/boot"
          
          rm -rf tmp
          mkdir -p tmp
          
          # 配置 Anykernel3
          if [[ "${AK3_SOURCE}" =~ "osm0sis" ]]; then
            sed -i 's/ExampleKernel by osm0sis @ xda-developers/NonGKI Kernel Build by JackAltman @ Github/g' Anykernel3/anykernel.sh
            sed -i 's/do.devicecheck=1/do.devicecheck=0/g' Anykernel3/anykernel.sh
            sed -i 's!BLOCK=/dev/block/platform/omap/omap_hsmmc.0/by-name/boot;!BLOCK=auto;!g' Anykernel3/anykernel.sh
            sed -i 's/device.name1=.*/device.name1=star/g' Anykernel3/anykernel.sh
            sed -i 's/BLOCK=auto;/BLOCK=boot;/g' Anykernel3/anykernel.sh
            sed -i 's/IS_SLOT_DEVICE=0;/IS_SLOT_DEVICE=1/g' Anykernel3/anykernel.sh
            sed -i '/fstab.tuna/d' Anykernel3/anykernel.sh
            curl -L https://raw.githubusercontent.com/zttlove/NonGKI_Kernel_Build_2nd/mainline/Patches/anykernel.sh -o Anykernel3/anykernel.sh
            chmod +x Anykernel3/anykernel.sh
          fi
          
          # 复制内核文件
          if [[ -f "$IMAGE_DIR/Image.gz-dtb" ]]; then
            cp -fp "$IMAGE_DIR/Image.gz-dtb" tmp
          elif [[ -f "$IMAGE_DIR/Image.gz" ]]; then
            cp -fp "$IMAGE_DIR/Image.gz" tmp
          fi
          
          # 复制内核模块（防报错）
          if [ "${PACK_KMODULES}" == "true" ]; then
            mkdir -p tmp/modules/vendor/lib/modules
            find "${KERNEL_DIR}/out/" -name "*.ko" -exec cp -fp {} tmp/modules/vendor/lib/modules/ \; 2>/dev/null || true
          fi
          
          cp -rp ./Anykernel3/* tmp/
          
          # 生成刷机包
          API_URL="https://api.github.com/repos/cctv18/ReSukiSU_CI/releases/latest"
          TAG=$(curl -sL "$API_URL" | jq -r '.name' || echo "0")
          BUILD_NUM=$(echo "$TAG" | grep -oE '[0-9]+' | head -n1 || echo "0")
          FINAL_ZIP="AK3-5.4.247-ReSukiSU-${BUILD_NUM}-star_KPM.zip"
          ZIP_FULL="${ROOT}/${FINAL_ZIP}"
          
          cd tmp
          7za a -mx9 -tzip "$ZIP_FULL" ./*
          cd ..
          rm -rf tmp
          echo "PACK_NAME=$FINAL_ZIP" >> "$GITHUB_ENV"

      - name: 上传构建产物
        uses: actions/upload-artifact@v6
        with:
          name: Kernel-Package
          path: ${{ env.PACK_NAME }}
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - name: 下载构建成品
        uses: actions/download-artifact@v4
        with:
          name: Kernel-Package

      - name: 自动创建Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: Build-${{ github.run_number }}
          name: Build-${{ github.run_number }}
          files: ./*.zip
          update_existing: false
          prerelease: false
          make_latest: true
