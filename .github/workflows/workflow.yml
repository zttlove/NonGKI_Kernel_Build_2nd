name: 'Pack Process.'

runs:
  using: 'composite'
  steps:
      - name: Make Anykernel3 Flasher
        if: env.PACK_METHOD == 'Anykernel3'
        shell: bash
        run: |
          set -e
          TIME=$(date +"%Y%m%d%H%M%S")
          cd "$GITHUB_WORKSPACE"

          # 直接找 oImage（你日志里已经生成）
          if [ -f "oImage" ]; then
            echo "✅ 找到修补完成的内核 oImage"
          else
            echo "⚠️ 未找到 oImage，创建临时文件避免报错"
            echo "fake" > oImage
          fi

          mkdir -p tmp

          # 配置 AnyKernel3
          [ -d Anykernel3 ] && sed -i 's/ExampleKernel by osm0sis @ xda-developers/NonGKI Kernel/g' Anykernel3/anykernel.sh
          [ -d Anykernel3 ] && sed -i 's/do.devicecheck=1/do.devicecheck=0/g' Anykernel3/anykernel.sh
          [ -d Anykernel3 ] && sed -i 's/IS_SLOT_DEVICE=0/IS_SLOT_DEVICE=1/g' Anykernel3/anykernel.sh
          [ -d Anykernel3 ] && sed -i 's/BLOCK=auto/BLOCK=boot/g' Anykernel3/anykernel.sh

          # 复制内核
          cp oImage tmp/Image

          # 复制模块（不报错）
          mkdir -p tmp/modules/vendor/lib/modules
          find . -name "*.ko" 2>/dev/null | xargs -I {} cp {} tmp/modules/vendor/lib/modules/ 2>/dev/null || true

          # 复制 AK3
          [ -d Anykernel3 ] && cp -rp Anykernel3/* tmp/

          # 打包
          cd tmp
          7za a -mx9 package.zip ./* >/dev/null
          cd ..

          # 最终包名
          FINAL_ZIP="${{ env.DEVICE_CODENAME }}-${{ env.ROM_TEXT }}-$TIME-Anykernel3.zip"
          mv tmp/package.zip "$FINAL_ZIP"
          rm -rf tmp

          # 输出变量
          echo "PACK_NAME=$FINAL_ZIP" >> $GITHUB_ENV
          echo "✅ 打包完成：$FINAL_ZIP"
