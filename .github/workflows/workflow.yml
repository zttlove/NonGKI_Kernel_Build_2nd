name: Make Anykernel3 Flasher
if: env.PACK_METHOD == 'Anykernel3'
shell: bash
run: |
  set -e

  # 1. 获取时间戳（优先使用环境变量，无则自动生成）
  TIME="${{ env.TIME }}"
  if [ -z "$TIME" ]; then
    TIME=$(date +"%Y%m%d%H%M%S")
  fi

  cd "$GITHUB_WORKSPACE"

  # 2. 严格校验内核文件，防止空包/错误包
  if [ ! -f "oImage" ]; then
    echo "::error::❌ 致命错误：未找到 oImage 内核文件，请检查编译步骤"
    exit 1
  fi
  echo "✅ 已找到内核文件：oImage"

  # 3. 清空并创建临时目录，避免残留文件干扰
  rm -rf tmp
  mkdir -p tmp

  # 4. 配置 Anykernel3（设备通用、关闭校验、A/B 分区、boot 刷入）
  if [ -d "Anykernel3" ]; then
    sed -i "s/^name=.*/name=\"NonGKI Kernel\"/" Anykernel3/anykernel.sh
    sed -i "s/^do.devicecheck=.*/do.devicecheck=0/" Anykernel3/anykernel.sh
    sed -i "s/^IS_SLOT_DEVICE=.*/IS_SLOT_DEVICE=1/" Anykernel3/anykernel.sh
    sed -i "s/^BLOCK=.*/BLOCK=boot/" Anykernel3/anykernel.sh
    echo "✅ Anykernel3 配置已完成"
  else
    echo "::warning::⚠️ 未找到 Anykernel3 目录，将使用默认配置打包"
  fi

  # 5. 组装内核与驱动模块
  cp oImage tmp/Image

  # 复制所有 ko 模块
  mkdir -p tmp/modules/vendor/lib/modules
  find . -name "*.ko" -exec cp -f {} tmp/modules/vendor/lib/modules/ \; 2>/dev/null || true
  echo "✅ 内核与模块已复制到临时目录"

  # 合并 Anykernel3 脚本
  [ -d "Anykernel3" ] && cp -rp Anykernel3/* tmp/

  # 6. 高速压缩打包
  cd tmp
  7za a -tzip -mx5 -bb1 Kernel.zip ./*
  cd ..

  # 7. 生成干净无特殊字符的最终文件名
  ROM_SAFE=$(echo "${{ env.ROM_TEXT }}" | tr -s ' ' '-' | tr -cd '[:alnum:]-_')
  FINAL_ZIP="${{ env.DEVICE_CODENAME }}-${ROM_SAFE}-${TIME}-Anykernel3.zip"

  mv tmp/Kernel.zip "$FINAL_ZIP"
  rm -rf tmp

  # 8. 输出变量给后续步骤使用
  echo "PACK_NAME=$FINAL_ZIP" >> $GITHUB_ENV
  echo "✅ Anykernel3 打包完成：$FINAL_ZIP"
