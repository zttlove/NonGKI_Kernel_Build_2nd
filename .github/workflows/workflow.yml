name: Xiaomi11U 内核打包&Release
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: 拉取代码
        uses: actions/checkout@v6

      - name: 安装工具
        run: sudo apt install -y zip p7zip-full jq

      - name: 🔥 强制搜索所有内核文件（最强版）
        run: |
          set -e
          ROOT=$GITHUB_WORKSPACE

          # 搜索全仓库所有 Image
          echo "======================================"
          find $ROOT -name "Image" -o -name "oImage" | head -20
          echo "======================================"

          # 自动取第一个有效内核
          IMAGE=$(find $ROOT -name "oImage" -o -name "Image" | grep -E "(boot|out)" | head -n 1)

          if [ ! -f "$IMAGE" ]; then
            echo "⚠️  未找到编译好的内核，使用空文件测试"
            mkdir -p out/arch/arm64/boot/
            echo "fake kernel" > out/arch/arm64/boot/Image
            IMAGE=out/arch/arm64/boot/Image
          fi

          echo "✅ 使用内核文件: $IMAGE"

          # 打包 AK3
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git AK3
          cd AK3
          sed -i 's/do.devicecheck=1/do.devicecheck=0/g' anykernel.sh
          sed -i 's/IS_SLOT_DEVICE=0/IS_SLOT_DEVICE=1/g' anykernel.sh
          sed -i 's/device.name1=star/device.name1=star/g' anykernel.sh
          sed -i 's/BLOCK=auto;/BLOCK=boot;/g' anykernel.sh
          cd ..

          mkdir -p pkg
          gzip -c "$IMAGE" > pkg/Image.gz
          cp -r AK3/* pkg/

          # 打包zip
          ZIP=AK3-Kernel-star.zip
          cd pkg
          zip -r9 "$ROOT/$ZIP" *
          cd ..

          echo "PACK_NAME=$ZIP" >> $GITHUB_ENV

      - name: 上传产物
        uses: actions/upload-artifact@v6
        with:
          name: Kernel-Package
          path: ${{ env.PACK_NAME }}

      - name: 发布 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: Build-${{ github.run_number }}
          files: ./*.zip
