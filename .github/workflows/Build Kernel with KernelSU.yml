name: Build Kernel with KernelSU (backslashxx/master, Full SUSFS)

on:
  workflow_dispatch:
    inputs:
      reboot_gate:
        description: "启用 sys_reboot supercall fd 自举门控（反探测加固；出现开机循环请关掉）"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
      ksu_ref_override:
        description: "留空=使用下方 KSU_PIN；填 master/SHA 可临时跟随上游最新提交"
        required: false
        default: ""
        type: string

env:
  KERNEL_REPO: zttlove/android_kernel_xiaomi_sm8350-hyperos
  KERNEL_BRANCH: dynamic
  # Pinned vendor source (8-char SHA).
  # 2026-11-14: 旧 pin 36982074 被上游抹除（历史重写，仓库仅剩 dynamic 单分支），
  # 被迫前移到 f4c3fdd4f —— 它是 "Merge branch 'Leecaarmy:dynamic' into dynamic"
  # 的合并提交，**尚未经开机验证**；首个构建即为开机测试，若出现循环重启，
  # 排查方向是 Leecaarmy 侧带入的改动（其 fork 的 dynamic 分支）。
  # Build FAILS if the dynamic branch tip differs -- update ONLY after verifying a new-tip build boots.
  KERNEL_COMMIT_PIN: "f4c3fdd4"
  DEFCONFIG_NAME: vendor/star_defconfig
  DEVICE_CODENAME: star
  OUTPUT_DIR: out
  CLANG_DIR: ${{ github.workspace }}/toolchains/clang
  KERNEL_DIR: ${{ github.workspace }}/kernel
  # ---------------------------------------------------------------------------
  # KernelSU 驱动源：backslashxx/KernelSU master（2026-11-19 的 master HEAD）
  # ---------------------------------------------------------------------------
  # 为什么这里不能沿用 SukiSU Nova 的补丁：
  #   1. 身份不同：Makefile 是 KSU_PACKAGE_NAME := me.weishu.kernelsu、
  #      -DKSU_VERSION=32731；没有 REPO_NAME / VERSION_BASE / SukiSU-Nova 字样。
  #      用 Nova 的三条 grep 校验会直接让本步骤失败。
  #   2. 结构不同：unity build，ksu.c 里 #include 全部 .c，只有一个 ksu.o；
  #      kernel_includes.h 不含 <linux/static_call.h>，原 static_call 版本守卫
  #      补丁锚点根本不存在（已被移除，不需要）。
  #   3. 该 fork 的 Kconfig 完全没有 CONFIG_KSU_SUSFS* 符号（SUSFS 需自行按
  #      issue #25 的方式接 vendor 树），因此在 Integrate 步骤里注入一份
  #      SUSFS Kconfig 片，供 vendor 5.4 树的 #ifdef CONFIG_KSU_SUSFS 钩子使用。
  #   4. sucompat.c 里 ksu_su_compat_enabled 是 **static bool**，且没有
  #      sucompat.h 的 extern 声明；原 Nova 的 sed 锚点全部不匹配，已重写。
  #   5. sys_reboot 自举点在 kernel/supercall/supercall.c（不是 dispatch.c），
  #      授权helper 是 supercall/perm.c 的 manager_or_root()（不是
  #      ksu_manager_uid_authorized），reboot gate 补丁已整体改写。
  #   6. sulog/event.c 里 strncpy_from_user_nofault 有 2 处（5.4 无此 API），
  #      已按新路径重写替换与校验。
  # 注意：KSU_PIN 钉住的是 master 的一次提交；留空则跟随 master HEAD。
  # 换 pin 前务必重新实机验证：vendor 5.4 SUSFS 钩子与本 fork 的
  # ksu_handle_* 签名是否仍然匹配、是否能正常开机。
  KSU_REPO: https://github.com/backslashxx/KernelSU.git
  KSU_BRANCH: master
  KSU_PIN: "ae59aa5509c39276117e15f8fedc0740e5bda7f8"

jobs:
  build-kernel:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - name: Checkout Kernel Source
        uses: actions/checkout@v4
        with:
          repository: ${{ env.KERNEL_REPO }}
          ref: ${{ env.KERNEL_BRANCH }}
          path: kernel
          # depth=2：合并 tip 时需要 HEAD^1 做对照 diff（cpufreq 回退步骤依赖）
          fetch-depth: 2

      - name: Verify Kernel Commit & Clean Workspace
        working-directory: kernel
        run: |
          git reset --hard HEAD
          git clean -fdx
          SHORT_SHA=$(git rev-parse --short=8 HEAD)
          echo "Kernel: $(git log -1 --format='%h %s')"
          if [ "$SHORT_SHA" != "$KERNEL_COMMIT_PIN" ]; then
            echo "::error::vendor kernel source drifted: branch tip ${SHORT_SHA} != pinned ${KERNEL_COMMIT_PIN}"
            echo "The 'dynamic' branch was moved/rewritten. Update KERNEL_COMMIT_PIN in workflow env ONLY after a build from the new tip is verified to boot."
            exit 1
          fi
      - name: Enforce cpufreq init order (bootloop fix, unconditional)
        working-directory: kernel
        run: |
          set -euo pipefail
          echo "== 强制 qcom-cpufreq-hw.c 注册顺序：cpufreq_register_driver() 在前 =="
          # star 实机验证结论：先注册 cycle counter 回调（Leecaarmy 合并带入的
          # 顺序）会冷启动假死/无限重启；能开机的基线顺序是
          # cpufreq_register_driver() 在前。此步骤不依赖 git 历史，无论
          # HEAD 是否 merge commit 都强制为可启动顺序，并做双重校验。
          python3 - <<'PYEOF'
          import sys
          pc = "drivers/cpufreq/qcom-cpufreq-hw.c"
          s = open(pc).read()
          lock_line = "for_each_possible_cpu(cpu)\n\t\tspin_lock_init(&qcom_cpufreq_counter[cpu].lock);\n"
          i = s.find(lock_line)
          j = s.find("\tof_platform_populate(pdev->dev.of_node")
          if i == -1 or j == -1 or j < i:
              sys.exit("::error::anchor lines not found in qcom-cpufreq-hw.c")
          good = lock_line + """
          \t/*
          \t * 注册顺序必须保持 cpufreq_register_driver() 在前：
          \t * star 实机验证该顺序是唯一可正常启动的配置；颠倒后（先注册
          \t * cycle counter 回调）会触发冷启动假死/无限重启。
          \t */
          \trc = cpufreq_register_driver(&cpufreq_qcom_hw_driver);
          \tif (rc) {
          \t\tdev_err(&pdev->dev, "CPUFreq HW driver failed to register\\n");
          \t\treturn rc;
          \t}
          \trc = register_cpu_cycle_counter_cb(&cycle_counter_cb);
          \tif (rc) {
          \t\tdev_err(&pdev->dev, "cycle counter cb failed to register\\n");
          \t\treturn rc;
          \t}
          """
          s = s[:i] + good + s[j:]
          open(pc, "w").write(s)
          R = s.find("rc = cpufreq_register_driver(&cpufreq_qcom_hw_driver);")
          C = s.find("rc = register_cpu_cycle_counter_cb(&cycle_counter_cb);")
          assert R != -1 and C != -1 and R < C, "order verification failed"
          print(f"-- enforced: cpufreq_register_driver(offset {R}) precedes register_cpu_cycle_counter_cb (offset {C})")
          PYEOF
          R=$(grep -n 'cpufreq_register_driver(&cpufreq_qcom_hw_driver)' drivers/cpufreq/qcom-cpufreq-hw.c | head -1 | cut -d: -f1)
          C=$(grep -n 'register_cpu_cycle_counter_cb(&cycle_counter_cb)' drivers/cpufreq/qcom-cpufreq-hw.c | head -1 | cut -d: -f1)
          if [ -z "$R" ] || [ -z "$C" ] || [ "$R" -ge "$C" ]; then
            echo "::error::cpufreq order verification failed (R=$R C=$C)"; exit 1
          fi
          echo "-- verified: cpufreq_register_driver (L$R) precedes register_cpu_cycle_counter_cb (L$C)"
      - name: Silence min() type-mismatch warning in tcp_output.c
        working-directory: kernel
        run: |
          set -euo pipefail
          # net/ipv4/tcp_output.c: threshold = min(srtt_in_ns >> 1, NSEC_PER_MSEC)
          # u64 与 long 比较，__typecheck 触发 -Wcompare-distinct-pointer-types 警告
          # （5.4 stable 回移植上游自带，主线后续用 min_t 修复）。改为 min_t(u64,...)
          # 与上游修复一致：结果 <= 1e6，赋回 u32 threshold 无损。
          TF=net/ipv4/tcp_output.c
          grep -q 'threshold = min(srtt_in_ns >> 1, NSEC_PER_MSEC);' "$TF" \
            || { echo "::error::tcp_output.c anchor not found (source moved?)"; exit 1; }
          sed -i 's/threshold = min(srtt_in_ns >> 1, NSEC_PER_MSEC);/threshold = min_t(u64, srtt_in_ns >> 1, NSEC_PER_MSEC);/' "$TF"
          grep -q 'threshold = min_t(u64, srtt_in_ns >> 1, NSEC_PER_MSEC);' "$TF" \
            || { echo "::error::min_t replacement failed"; exit 1; }
          echo "-- tcp_output.c min() type-mismatch silenced (min_t(u64, ...))"
      - name: Fix misleading indentation in mi_dsi_panel.c (no behavior change)
        working-directory: kernel
        run: |
          set -euo pipefail
          # techpack/display/msm/mi_disp/mi_dsi_panel.c LOCAL_HBM_OFF_TO_NORMAL_BACKLIGHT_RESTORE:
          # else 缺大括号，后随两行缩进过深触发 -Wmisleading-indentation。编译器实际语义：
          # else 体仅含 backlight_in_aod；dc_gain（内部自带 panel_id 守卫）与 tx_cmd_set
          # 无条件执行——与上方姊妹 case（..._BACKLIGHT）的尾部模式一致，编译结果即作者
          # 意图。补大括号+对齐缩进，编译产物零变化，仅消除警告。
          python3 <<'PYEOF'
          p = "techpack/display/msm/mi_disp/mi_dsi_panel.c"
          s = open(p).read()
          old = ("\t\t\telse\n"
                 "\t\t\t\tmi_dsi_update_backlight_in_aod(panel, true);\n"
                 "\t\t\t\tif (mi_cfg->panel_id == 0x4C3900360200)\n"
                 "\t\t\t\t\tmi_dsi_update_lhbm_dc_gain(panel,DSI_CMD_SET_MI_LOCAL_HBM_OFF_TO_NORMAL);\n"
                 "\t\t\t\tdsi_panel_tx_cmd_set(panel, DSI_CMD_SET_MI_LOCAL_HBM_OFF_TO_NORMAL);\n")
          new = ("\t\t\telse {\n"
                 "\t\t\t\tmi_dsi_update_backlight_in_aod(panel, true);\n"
                 "\t\t\t}\n"
                 "\t\t\tif (mi_cfg->panel_id == 0x4C3900360200)\n"
                 "\t\t\t\tmi_dsi_update_lhbm_dc_gain(panel,DSI_CMD_SET_MI_LOCAL_HBM_OFF_TO_NORMAL);\n"
                 "\t\t\tdsi_panel_tx_cmd_set(panel, DSI_CMD_SET_MI_LOCAL_HBM_OFF_TO_NORMAL);\n")
          n = s.count(old)
          assert n == 1, f"anchor count {n} != 1 (source moved?)"
          open(p, "w").write(s.replace(old, new))
          print("-- mi_dsi_panel.c: else braces added, indentation aligned (semantics unchanged)")
          PYEOF
          # 注意：$'...' 才是真 tab，普通 '\t' 在 grep BRE 下是字面量 't'
          CNT=$(grep -c $'^\t\t\telse {' techpack/display/msm/mi_disp/mi_dsi_panel.c || true)
          if [ "${CNT:-0}" -lt 1 ]; then
            echo "::error::mi_dsi_panel.c brace fix verification failed (count=${CNT:-0})"; exit 1
          fi
          echo "-- verified: brace fix in place (${CNT} match)"
      - name: Fix missing brace in cam_flash_core.c add_req error check (no behavior change)
        working-directory: kernel
        run: |
          set -euo pipefail
          # techpack/camera_star/.../cam_flash_core.c cam_flash_i2c_pkt_parser():
          # 守卫 if (crm_cb && crm_cb->add_req) 丢失左大括号（合并腐蚀），导致
          # if (rc) 错误检查被编译为守卫外无条件执行。可达路径上两者等价：
          # 未调用 add_req 时 rc 恒为函数入口初值 0（NOP 路径 goto 前不碰 rc）。
          # 补回大括号恢复 CAF 原始写法，顺带修正 "if  (rc)" 双空格，行为零变化。
          python3 <<'PYEOF'
          p = "techpack/camera_star/drivers/cam_sensor_module/cam_flash/cam_flash_core.c"
          s = open(p).read()
          old = ("\t\tif (fctrl->bridge_intf.crm_cb &&\n"
                 "\t\t\tfctrl->bridge_intf.crm_cb->add_req)\n"
                 "\t\t\trc = fctrl->bridge_intf.crm_cb->add_req(&add_req);\n"
                 "\t\t\tif  (rc) {\n"
                 "\t\t\t\tCAM_ERR(CAM_FLASH,\n"
                 "\t\t\t\t\t\"Failed in adding request: %llu to request manager\",\n"
                 "\t\t\t\t\tcsl_packet->header.request_id);\n"
                 "\t\t\t\treturn rc;\n"
                 "\t\t\t}\n")
          new = ("\t\tif (fctrl->bridge_intf.crm_cb &&\n"
                 "\t\t\tfctrl->bridge_intf.crm_cb->add_req) {\n"
                 "\t\t\trc = fctrl->bridge_intf.crm_cb->add_req(&add_req);\n"
                 "\t\t\tif (rc) {\n"
                 "\t\t\t\tCAM_ERR(CAM_FLASH,\n"
                 "\t\t\t\t\t\"Failed in adding request: %llu to request manager\",\n"
                 "\t\t\t\t\tcsl_packet->header.request_id);\n"
                 "\t\t\t\treturn rc;\n"
                 "\t\t\t}\n"
                 "\t\t}\n")
          n = s.count(old)
          assert n == 1, f"anchor count {n} != 1 (source moved?)"
          open(p, "w").write(s.replace(old, new))
          print("-- cam_flash_core.c: guard braces restored (CAF canonical form)")
          PYEOF
          grep -q 'fctrl->bridge_intf.crm_cb->add_req) {' techpack/camera_star/drivers/cam_sensor_module/cam_flash/cam_flash_core.c \
            || { echo "::error::cam_flash brace fix verification failed"; exit 1; }
          echo "-- verified: add_req guard braces in place"
      - name: Fix ignored kstrtou32 return in bootinfo.c (no behavior change)
        working-directory: kernel
        run: |
          set -euo pipefail
          # techpack/bootinfo/bootinfo.c: get_powerup_reason()/get_powerdown_reason()
          # 忽略 kstrtou32 返回值（-Wunused-result）。解析失败时全局 pu/pd_reason
          # 本就保持 0，且调用方（powerup_reason_show 等 5 处）全部忽略本函数返回值
          # ——改为 return kstrtou32(...) 透传，警告消除，行为零变化。
          python3 <<'PYEOF'
          p = "techpack/bootinfo/bootinfo.c"
          s = open(p).read()
          pairs = [
              ("\tkstrtou32(buf, 16, &pu_reason);\n\treturn 0;\n",
               "\treturn kstrtou32(buf, 16, &pu_reason);\n"),
              ("\tkstrtou32(buf, 16, &pd_reason);\n\treturn 0;\n",
               "\treturn kstrtou32(buf, 16, &pd_reason);\n"),
          ]
          for old, new in pairs:
              n = s.count(old)
              assert n == 1, f"anchor count {n} != 1 for {old!r} (source moved?)"
              s = s.replace(old, new)
          open(p, "w").write(s)
          print("-- bootinfo.c: kstrtou32 return propagated (2 sites)")
          PYEOF
          # 同上：$'...' 展开为真 tab；'[ud]' 在 BRE 中作字符类匹配 u/d
          CNT=$(grep -c $'^\treturn kstrtou32(buf, 16, &p[ud]_reason);$' techpack/bootinfo/bootinfo.c || true)
          [ "$CNT" = "2" ] || { echo "::error::bootinfo.c kstrtou32 fix verification failed (count=$CNT)"; exit 1; }
          echo "-- verified: 2 return-kstrtou32 sites in place"
      - name: Fix misleading indentation in cyttsp5_device_access.c (pure reindent)
        working-directory: kernel
        run: |
          set -euo pipefail
          # drivers/input/touchscreen/cyttsp5/cyttsp5_device_access.c 三处缩进腐烂：
          # 1) cmcp_test store: if 体仅 range_check=0，后续 cmcp_* 赋值无条件执行
          #    （上游 Parade 原始语义；若塞进 if 内，写 CMCP_FULL 永不更新
          #    cmcp_test_items，测试机直接坏）——按编译语义重排。
          # 2/3) CM/Cm 打印循环: for 体仅 prepare_print_data，行尾换行
          #    prepare_print_string("\n") 在 j 循环外每行一次（语义正确）——
          #    续行缩进混乱（6/2/8、7/4/7 tab）误导 clang，重排为正常层级。
          # 三处均为纯缩进调整，token 流不变（构建时以去空白等价性断言兜底）。
          python3 <<'PYEOF'
          import re
          p = "drivers/input/touchscreen/cyttsp5/cyttsp5_device_access.c"
          s = open(p).read()
          old1 = ("\tif (test_item > 0 && test_item < 5)\n"
                  "\t\trange_check = 0;\n"
                  "\t\tdad->cmcp_test_items = test_item;\n"
                  "\t\tdad->cmcp_range_check = range_check;\n"
                  "\t\tdad->cmcp_force_calibrate = force_calibrate;\n"
                  "\t\tparade_debug(dev, DEBUG_LEVEL_2,\n"
                  "\t\t\t\"%s: Test item is %s; Range check is %s; Force calibrate is %s.\\n\",\n"
                  "\t\t\t__func__,\n"
                  "\t\t\tcmcp_test_case_array[test_item],\n"
                  "\t\t\tcmcp_test_range_check_array[range_check],\n"
                  "\t\t\tcmcp_test_force_cal_array[force_calibrate]);\n")
          new1 = ("\tif (test_item > 0 && test_item < 5)\n"
                  "\t\trange_check = 0;\n"
                  "\tdad->cmcp_test_items = test_item;\n"
                  "\tdad->cmcp_range_check = range_check;\n"
                  "\tdad->cmcp_force_calibrate = force_calibrate;\n"
                  "\tparade_debug(dev, DEBUG_LEVEL_2,\n"
                  "\t\t\"%s: Test item is %s; Range check is %s; Force calibrate is %s.\\n\",\n"
                  "\t\t__func__,\n"
                  "\t\tcmcp_test_case_array[test_item],\n"
                  "\t\tcmcp_test_range_check_array[range_check],\n"
                  "\t\tcmcp_test_force_cal_array[force_calibrate]);\n")
          old2 = ("\t\t\t\t\tfor (j = 1; j < tx_num; j++)\n"
                  "\t\t\t\t\t\tindex = prepare_print_data(\n"
                  "\t\t\t\t\t\tout_buf,\n"
                  "\t\t\t&cmcp_info->cm_sensor_column_delta[(j-1)*rx_num+i],\n"
                  "\t\t\t\t\t\tindex, 1);\n"
                  "\t\t\t\t\t\tindex = prepare_print_string(\n"
                  "\t\t\t\t\t\t\t\tout_buf,\n"
                  "\t\t\t\t\t\t\t\t\"\\n\", index);\n")
          new2 = ("\t\t\t\t\tfor (j = 1; j < tx_num; j++)\n"
                  "\t\t\t\t\t\tindex = prepare_print_data(\n"
                  "\t\t\t\t\t\t\tout_buf,\n"
                  "\t\t\t\t\t\t\t&cmcp_info->cm_sensor_column_delta[(j-1)*rx_num+i],\n"
                  "\t\t\t\t\t\t\tindex, 1);\n"
                  "\t\t\t\t\tindex = prepare_print_string(\n"
                  "\t\t\t\t\t\tout_buf,\n"
                  "\t\t\t\t\t\t\"\\n\", index);\n")
          old3 = ("\t\t\t\t\tfor (j = 0; j < tx_num; j++)\n"
                  "\t\t\t\t\t\tindex = prepare_print_data(\n"
                  "\t\t\t\t\t\t\tout_buf,\n"
                  "\t\t\t&cmcp_info->cm_sensor_row_delta[j*rx_num+i-1],\n"
                  "\t\t\t\t\t\t\tindex, 1);\n"
                  "\t\t\t\t\t\tindex = prepare_print_string(\n"
                  "\t\t\t\t\t\t\tout_buf,\n"
                  "\t\t\t\t\t\t\t\"\\n\", index);\n")
          new3 = ("\t\t\t\t\tfor (j = 0; j < tx_num; j++)\n"
                  "\t\t\t\t\t\tindex = prepare_print_data(\n"
                  "\t\t\t\t\t\t\tout_buf,\n"
                  "\t\t\t\t\t\t\t&cmcp_info->cm_sensor_row_delta[j*rx_num+i-1],\n"
                  "\t\t\t\t\t\t\tindex, 1);\n"
                  "\t\t\t\t\tindex = prepare_print_string(\n"
                  "\t\t\t\t\t\tout_buf,\n"
                  "\t\t\t\t\t\t\"\\n\", index);\n")
          orig = s
          for name, o, n in [("cmcp block", old1, new1),
                             ("column-delta loop", old2, new2),
                             ("row-delta loop", old3, new3)]:
              c = s.count(o)
              assert c == 1, f"{name}: anchor count {c} != 1 (source moved?)"
              s = s.replace(o, n)
          # 纯重排证明：去空白后 token 流必须与原文件一致
          assert re.sub(r"\s+", "", orig) == re.sub(r"\s+", "", s), \
              "token stream changed - aborting (not a pure reindent)"
          open(p, "w").write(s)
          print("-- cyttsp5_device_access.c: 3 sites reindented (token stream unchanged)")
          PYEOF
          echo "-- verified: 3 reindent replacements applied"
      - name: Fix sscanf %100s off-by-one in fts_spi (stack overflow guard)
        working-directory: kernel
        run: |
          set -euo pipefail
          # drivers/input/touchscreen/fts_spi/{fts_proc.c,fts.c}：
          # 目标缓冲区均为 char path[100]，而 sscanf 格式串用 %100s ——
          # 匹配满 100 字符时写入 100 字节 + NUL = 101 字节，越界 1 字节
          # （clang -Wfortify-source 报的真实 off-by-one，非外观）。
          # 修复：%100s -> %99s（保留 NUL 空间）。行为影响仅在用户输入
          # 恰好 >= 99 字符的固件路径时截断 1 字符，正常固件名远短于此。
          python3 <<'PYEOF'
          fixes = {
              "drivers/input/touchscreen/fts_spi/fts_proc.c": [
                  ('sscanf(p, "%100s", path);', 'sscanf(p, "%99s", path);'),
              ],
              "drivers/input/touchscreen/fts_spi/fts.c": [
                  ('sscanf(buf, "%100s %d %d", path, &mode[0], &mode[1]);',
                   'sscanf(buf, "%99s %d %d", path, &mode[0], &mode[1]);'),
              ],
          }
          for p, pairs in fixes.items():
              s = open(p).read()
              for o, n in pairs:
                  c = s.count(o)
                  assert c == 1, f"{p}: anchor count {c} != 1 (source moved?)"
                  s = s.replace(o, n)
              assert s.count("%100s") == 0, f"{p}: residual %100s remains"
              open(p, "w").write(s)
              print(f"-- {p}: %100s -> %99s ({len(pairs)} site)")
          PYEOF
          ! grep -rn '%100s' drivers/input/touchscreen/fts_spi/ \
            || { echo "::error::%100s still present in fts_spi"; exit 1; }
          echo "-- verified: fts_spi sscanf width fixed, no %100s left"
      - name: Fix PCI_VENDOR_ID_ASIX macro redefinition in 8250_pci.c (no behavior change)
        working-directory: kernel
        run: |
          set -euo pipefail
          # drivers/tty/serial/8250/8250_pci.c L1877 本地 #define PCI_VENDOR_ID_ASIX 0x9710
          # （MosChip 遗留枚举的旧板卡），与 include/linux/pci_ids.h 的真实 ASIX 0x125b
          # 同名不同值。预处理顺序：L70（MSI 表）在本地 #define 之前 → 取 0x125b；
          # L2680/L5801（FIFO quirk + 板卡表）在之后 → 取 0x9710。这就是现状编译语义。
          # 在 L1877 前插 #undef 再重定义：消除 -Wmacro-redefined，每个使用点取值不变。
          python3 <<'PYEOF'
          import re, sys
          p = "drivers/tty/serial/8250/8250_pci.c"
          s = open(p).read()
          pat = re.compile(r'^#define PCI_VENDOR_ID_ASIX[ \t]+0x9710[ \t]*$', re.M)
          m = pat.search(s)
          if not m:
              sys.exit("::error::anchor '#define PCI_VENDOR_ID_ASIX ... 0x9710' not found (source moved?)")
          prefix = s[:m.start()]
          if prefix.rstrip('\n').endswith('#undef PCI_VENDOR_ID_ASIX'):
              print("-- 8250_pci.c: #undef already present, skipping")
          else:
              s = prefix + '#undef PCI_VENDOR_ID_ASIX\n' + s[m.start():]
              open(p, "w").write(s)
              print("-- 8250_pci.c: inserted #undef before local 0x9710 redefine")
          PYEOF
          grep -n -B1 '^#define PCI_VENDOR_ID_ASIX' drivers/tty/serial/8250/8250_pci.c
          [ "$(grep -c '^#undef PCI_VENDOR_ID_ASIX$' drivers/tty/serial/8250/8250_pci.c)" = "1" ] \
            || { echo "::error::#undef PCI_VENDOR_ID_ASIX missing or duplicated"; exit 1; }
          [ "$(grep -cE '^#define PCI_VENDOR_ID_ASIX[[:space:]]+0x9710' drivers/tty/serial/8250/8250_pci.c)" = "1" ] \
            || { echo "::error::local 0x9710 define missing or duplicated"; exit 1; }
          echo "-- verified: #undef precedes local 0x9710 define; L70 keeps 0x125b, L2680/L5801 keep 0x9710"
      - name: Fix unused label reset_assert in dwc3-qcom.c (no behavior change)
        working-directory: kernel
        run: |
          set -euo pipefail
          # drivers/usb/dwc3/dwc3-qcom.c L732 的 reset_assert 标签在当前 defconfig 下
          # 无任何 goto 引用（-Wunused-label）。两种成因：
          #   a) 代码演进中删除全部 goto reset_assert，标签残留 → 删除安全
          #   b) goto 在某个 #ifdef CONFIG_XXX 块内被当前配置排除 → 删除会在
          #      未来启用该配置时导致 "label not found" 编译错误
          # 脚本先扫全文（含条件编译块）确认无 goto 引用；有则报错让手动用
          # 相同 #ifdef 包裹标签，无则删除标签行。零行为变更。
          python3 <<'PYEOF'
          import re, sys
          p = "drivers/usb/dwc3/dwc3-qcom.c"
          s = open(p).read()
          if re.search(r'\bgoto\s+reset_assert\s*;', s):
              sys.exit("::error::goto reset_assert exists in file (possibly under #ifdef) - "
                       "manual review needed: wrap label with matching #ifdef or confirm "
                       "current defconfig excludes it")
          label_pat = re.compile(r'^reset_assert:[ \t]*\n', re.M)
          m = label_pat.search(s)
          if not m:
              if "reset_assert:" not in s:
                  print("-- dwc3-qcom.c: reset_assert label already removed, skipping")
                  sys.exit(0)
              sys.exit("::error::anchor '^reset_assert:' not found (source moved?)")
          s = s[:m.start()] + s[m.end():]
          open(p, "w").write(s)
          print("-- dwc3-qcom.c: removed unused reset_assert label (no goto references)")
          PYEOF
          ! grep -q '^reset_assert:' drivers/usb/dwc3/dwc3-qcom.c \
            || { echo "::error::reset_assert label still present"; exit 1; }
          echo "-- verified: reset_assert label removed, no goto references in file"
      - name: Fix array-parameter mismatch in qcacld parser_api.c (no behavior change)
        working-directory: kernel
        run: |
          set -euo pipefail
          # drivers/staging/qcacld-3.0/.../parser_api.c L6177 定义
          # uint8_t mdie[SIR_MDIE_SIZE]，而 core/mac/src/include/parser_api.h L1056
          # 声明 uint8_t mdie[]。C 中数组参数退化为指针，[] 与 [SIR_MDIE_SIZE]
          # 在函数体内均为 uint8_t *，行为完全相同；Clang -Warray-parameter
          # 只检查声明/定义边界一致性。修复：源文件定义改为 []，与头文件一致。
          # 函数体内 mdie[0..2] / sizeof(mdie)（参数上下文恒为指针大小）不受影响。
          python3 <<'PYEOF'
          import sys
          p = "drivers/staging/qcacld-3.0/core/mac/src/sys/legacy/src/utils/src/parser_api.c"
          s = open(p).read()
          old = "uint8_t mdie[SIR_MDIE_SIZE])"
          new = "uint8_t mdie[])"
          c_old, c_new = s.count(old), s.count(new)
          if c_old == 1:
              s = s.replace(old, new)
              open(p, "w").write(s)
              print("-- parser_api.c: mdie[SIR_MDIE_SIZE] -> mdie[] (matches header)")
          elif c_new >= 1 and c_old == 0:
              print("-- parser_api.c: already fixed, skipping")
          else:
              sys.exit(f"::error::mdie anchor count old={c_old} new={c_new} (source moved?)")
          PYEOF
          grep -q 'uint8_t mdie\[\])' drivers/staging/qcacld-3.0/core/mac/src/sys/legacy/src/utils/src/parser_api.c \
            || { echo "::error::mdie[] fix verification failed"; exit 1; }
          ! grep -q 'uint8_t mdie\[SIR_MDIE_SIZE\])' drivers/staging/qcacld-3.0/core/mac/src/sys/legacy/src/utils/src/parser_api.c \
            || { echo "::error::old mdie[SIR_MDIE_SIZE] definition still present"; exit 1; }
          echo "-- verified: mdie[] matches header declaration (array-parameter silenced)"
      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential bc bison flex libssl-dev libelf-dev \
            zip unzip python3 perl git curl ccache xxd cpio kmod \
            libtinfo5
          sudo ln -sf /usr/lib/x86_64-linux-gnu/libtinfo.so.6 /usr/lib/x86_64-linux-gnu/libtinfo.so.5 || true
      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: .ccache
          key: ccache-kernelsu-star-${{ github.run_id }}
          restore-keys: |
            ccache-kernelsu-star-
      - name: Cache Clang Toolchain
        uses: actions/cache@v4
        id: clang-cache
        with:
          path: ${{ env.CLANG_DIR }}
          key: clang-17.0.6-x86_64-ubuntu22.04

      - name: Download Clang 17.0.6
        if: steps.clang-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p "${{ env.CLANG_DIR }}"
          curl -fL --retry 3 -o /tmp/clang.tar.xz \
            https://github.com/llvm/llvm-project/releases/download/llvmorg-17.0.6/clang+llvm-17.0.6-x86_64-linux-gnu-ubuntu-22.04.tar.xz
          tar -xf /tmp/clang.tar.xz -C "${{ env.CLANG_DIR }}" --strip-components=1
      - name: Verify Clang
        run: ${{ env.CLANG_DIR }}/bin/clang --version

      - name: Integrate KernelSU (backslashxx/master) + SUSFS Kconfig
        working-directory: kernel
        run: |
          set -euo pipefail
          export ARCH=arm64
          export PATH="${{ env.CLANG_DIR }}/bin:$PATH"
          export LLVM=1 LLVM_IAS=1 \
                 CLANG_TRIPLE=aarch64-linux-gnu- \
                 CROSS_COMPILE=aarch64-linux-gnu- \
                 CROSS_COMPILE_COMPAT=arm-linux-gnueabi-
          echo "== 清理内核树 =="
          make mrproper >/dev/null 2>&1 || true
          echo "== 拉取 backslashxx/KernelSU (master) 并接管 drivers/kernelsu =="
          rm -rf KSU_src KernelSU drivers/kernelsu drivers/KernelSU
          git clone --filter=blob:none --no-checkout -b "${{ env.KSU_BRANCH }}" \
            "${{ env.KSU_REPO }}" KSU_src
          PIN="${{ inputs.ksu_ref_override || env.KSU_PIN }}"
          if [ -n "$PIN" ]; then
            # 不跟随分支头：钉住 SHA 保证每次构建驱动源码完全一致。
            git -C KSU_src fetch --depth=1 origin "$PIN" \
              || git -C KSU_src fetch origin "$PIN"
            git -C KSU_src checkout --detach "$PIN"
            ACTUAL_SHA="$(git -C KSU_src rev-parse HEAD)"
            case "$ACTUAL_SHA" in
              "$PIN"*) ;;
              *) echo "::error::KernelSU checkout ${ACTUAL_SHA:0:12} != pinned ${PIN:0:12}"; exit 1 ;;
            esac
            echo "KernelSU pinned: $(git -C KSU_src log -1 --format='%H %s')"
          else
            git -C KSU_src checkout --detach origin/master
            echo "KernelSU master HEAD: $(git -C KSU_src log -1 --format='%H %s')"
          fi
          # 身份校验：这是 backslashxx 的 KernelSU（me.weishu.kernelsu / 32731），
          # 不是 SukiSU Nova（com.sukisu.nova / 30000）。版本段不一致会导致
          # 管理器判“内核版本不匹配”，必须在构建前拦住。
          grep -Eq '^KSU_PACKAGE_NAME[[:space:]]*:=[[:space:]]*me\.weishu\.kernelsu$' KSU_src/kernel/Makefile \
            || { echo "::error::pinned source is not backslashxx/KernelSU (KSU_PACKAGE_NAME != me.weishu.kernelsu)"; exit 1; }
          grep -q -- '-DKSU_VERSION=32731' KSU_src/kernel/Makefile \
            || { echo "::error::pinned source has unexpected KSU_VERSION (expected -DKSU_VERSION=32731)"; exit 1; }
          ! grep -q 'com\.sukisu\.nova' KSU_src/kernel/Makefile \
            || { echo "::error::SukiSU Nova source detected in KSU_SRC - wrong driver line"; exit 1; }
          echo "-- backslashxx/KernelSU identity verified (me.weishu.kernelsu / KSU_VERSION 32731)"
          ln -sfn ../KSU_src/kernel drivers/kernelsu
          grep -q 'kernelsu' drivers/Makefile || \
            printf '\nobj-$(CONFIG_KSU) += kernelsu/\n' >> drivers/Makefile
          grep -q 'drivers/kernelsu/Kconfig' drivers/Kconfig || \
            sed -i '/^endmenu/i\source "drivers/kernelsu/Kconfig"' drivers/Kconfig
          echo "== 确认内核侧 SUSFS 完整性 =="
          test -f fs/susfs.c || { echo "::error::fs/susfs.c missing - kernel branch lacks SUSFS"; exit 1; }
          test -f include/linux/susfs_def.h || { echo "::error::include/linux/susfs_def.h missing"; exit 1; }
          grep -q 'CONFIG_KSU_SUSFS' fs/exec.c || { echo "::error::fs/exec.c lacks KSU_SUSFS hooks"; exit 1; }
          grep -q 'CONFIG_KSU_SUSFS' fs/open.c || { echo "::error::fs/open.c lacks KSU_SUSFS hooks"; exit 1; }
          grep -q 'CONFIG_KSU_SUSFS' fs/stat.c || { echo "::error::fs/stat.c lacks KSU_SUSFS hooks"; exit 1; }
          echo "-- kernel-side SUSFS hooks verified (vendor tree keeps them)"
          echo "== 注入 SUSFS Kconfig 符号（backslashxx master 自身不带这些符号）=="
          # backslashxx/KernelSU master 的 kernel/Kconfig 没有 CONFIG_KSU_SUSFS*
          # （见其 issue #25：SUSFS 需自行接 vendor 树）。这里补一份最小 Kconfig，
          # 让 vendor 5.4 树的 #ifdef CONFIG_KSU_SUSFS 钩子能被打开；驱动本体
          # 不需要消费这些符号，仅 vendor 树消费。
          KCFG="KSU_src/kernel/Kconfig"
          test -f "$KCFG" || { echo "::error::KernelSU kernel/Kconfig not found"; exit 1; }
          if ! grep -q '^config KSU_SUSFS$' "$KCFG"; then
            cat >> "$KCFG" <<'SUSFS_KCONFIG_EOF'

          menu "KernelSU - SUSFS (vendor 5.4 compat)"
          config KSU_SUSFS
          	bool "KernelSU addon - SUSFS (vendor tree hooks)"
          	depends on KSU
          	default y
          config KSU_SUSFS_HAS_MAGIC_MOUNT
          	bool "SUSFS: magic mount awareness"
          	depends on KSU_SUSFS
          	default y
          config KSU_SUSFS_SUS_PATH
          	bool "SUSFS: hide suspicious paths"
          	depends on KSU_SUSFS
          	default y
          config KSU_SUSFS_SUS_MOUNT
          	bool "SUSFS: hide suspicious mounts"
          	depends on KSU_SUSFS
          	default y
          config KSU_SUSFS_AUTO_ADD_SUS_KSU_DEFAULT_MOUNT
          	bool "SUSFS: auto add KSU default mounts"
          	depends on KSU_SUSFS_SUS_MOUNT
          	default y
          config KSU_SUSFS_AUTO_ADD_SUS_BIND_MOUNT
          	bool "SUSFS: auto add bind mounts"
          	depends on KSU_SUSFS_SUS_MOUNT
          	default y
          config KSU_SUSFS_SUS_KSTAT
          	bool "SUSFS: spoof kstat"
          	depends on KSU_SUSFS
          	default y
          config KSU_SUSFS_TRY_UMOUNT
          	bool "SUSFS: try_umount"
          	depends on KSU_SUSFS
          	default y
          config KSU_SUSFS_AUTO_ADD_TRY_UMOUNT_FOR_BIND_MOUNT
          	bool "SUSFS: auto add try_umount for bind mounts"
          	depends on KSU_SUSFS_TRY_UMOUNT
          	default y
          config KSU_SUSFS_SPOOF_UNAME
          	bool "SUSFS: spoof uname"
          	depends on KSU_SUSFS
          	default y
          config KSU_SUSFS_ENABLE_LOG
          	bool "SUSFS: enable dmesg logging"
          	depends on KSU_SUSFS
          	default n
          config KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS
          	bool "SUSFS: hide symbols from kallsyms"
          	depends on KSU_SUSFS
          	default y
          config KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG
          	bool "SUSFS: spoof cmdline/bootconfig"
          	depends on KSU_SUSFS
          	default y
          config KSU_SUSFS_OPEN_REDIRECT
          	bool "SUSFS: open redirect"
          	depends on KSU_SUSFS
          	default y
          config KSU_SUSFS_SUS_MAP
          	bool "SUSFS: hide suspicious maps"
          	depends on KSU_SUSFS
          	default y
          config KSU_SUSFS_PRIORITY_UID_FILTER
          	bool "SUSFS: priority uid filter (vendor 5.4 lacks support)"
          	depends on KSU_SUSFS
          	default n
          endmenu
          SUSFS_KCONFIG_EOF
          fi
          for sym in KSU_SUSFS KSU_SUSFS_SUS_PATH KSU_SUSFS_SUS_MOUNT \
                     KSU_SUSFS_SUS_KSTAT KSU_SUSFS_SPOOF_UNAME \
                     KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS \
                     KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG \
                     KSU_SUSFS_OPEN_REDIRECT KSU_SUSFS_SUS_MAP \
                     KSU_SUSFS_ENABLE_LOG KSU_SUSFS_PRIORITY_UID_FILTER; do
            grep -q "^config ${sym}$" "$KCFG" \
              || { echo "::error::Kconfig symbol ${sym} missing after injection"; exit 1; }
          done
          echo "-- SUSFS Kconfig symbols injected (11 verified)"
          echo "== KernelSU 5.4 适配：sucompat 开关改为静态键（对齐 vendor 树消费者）=="
          # vendor 树 fs/exec.c|open.c|stat.c 以 static_branch_likely/unlikely 消费
          # ksu_su_compat_enabled（extern struct static_key_true）；backslashxx 的
          # unity build 里是 `static bool ksu_su_compat_enabled __read_mostly = true;`，
          # 且 feature/sucompat.h 无 extern 声明（原 Nova 的 header sed 锚点不存在）。
          # 改成本地静态键并同步 get/set/比较点；删掉 static 让 vendor 其它 TU
          # 能链接到同一个符号。kernel_includes.h 已包含 jump_label.h，5.4 可用。
          SUC="KSU_src/kernel/feature/sucompat.c"
          test -f "$SUC" || { echo "::error::feature/sucompat.c not found"; exit 1; }
          python3 - "$SUC" <<'PYSUCOMPAT_EOF'
          import sys
          p = sys.argv[1]
          s = open(p).read()
          pairs = [
              ("static bool ksu_su_compat_enabled __read_mostly = true;",
               "DEFINE_STATIC_KEY_TRUE(ksu_su_compat_enabled);"),
              ("*value = ksu_su_compat_enabled ? 1 : 0;",
               "*value = static_branch_likely(&ksu_su_compat_enabled) ? 1 : 0;"),
              ("ksu_su_compat_enabled = true;",
               "static_branch_enable(&ksu_su_compat_enabled);"),
              ("ksu_su_compat_enabled = false;",
               "static_branch_disable(&ksu_su_compat_enabled);"),
              ("if (enable == ksu_su_compat_enabled)",
               "if (enable == static_branch_likely(&ksu_su_compat_enabled))"),
              ("ksu_su_compat_enabled = enable;",
               "if (enable) static_branch_enable(&ksu_su_compat_enabled); else static_branch_disable(&ksu_su_compat_enabled);"),
          ]
          # 顺序敏感：先长后短，避免短锚点吃掉长锚点的子串
          for old, new in pairs:
              c = s.count(old)
              if c == 0 and old.startswith("static bool "):
                  sys.exit("::error::sucompat static-key patch already applied or source moved")
              if c != 1:
                  sys.exit(f"::error::sucompat anchor count {c} != 1 for {old!r}")
              s = s.replace(old, new)
          if "static bool ksu_su_compat_enabled" in s:
              sys.exit("::error::stale bool ksu_su_compat_enabled remains")
          open(p, "w").write(s)
          print("-- sucompat.c: ksu_su_compat_enabled -> global static key (6 sites)")
          PYSUCOMPAT_EOF
          grep -q 'DEFINE_STATIC_KEY_TRUE(ksu_su_compat_enabled);' "$SUC" \
            && grep -q 'static_branch_enable(&ksu_su_compat_enabled);' "$SUC" \
            && grep -q 'static_branch_disable(&ksu_su_compat_enabled);' "$SUC" \
            && grep -q 'static_branch_likely(&ksu_su_compat_enabled)' "$SUC" \
            && ! grep -q 'static bool ksu_su_compat_enabled' "$SUC" \
            || { echo "::error::sucompat static-key verification failed"; exit 1; }
          echo "-- verified: ksu_su_compat_enabled is a real static key (vendor static_branch consumers match)"
          echo "== KernelSU 5.4 适配：sulog event.c 的 strncpy_from_user_nofault =="
          # 5.4 无 strncpy_from_user_nofault（编译期隐式声明、LTO 链接期 undefined）。
          # backslashxx 的 sulog/event.c 有 2 处裸调用；替换为 strncpy_from_user
          # （调用点在 execve 参数采集、进程上下文，可安全睡眠）。
          EVENT="KSU_src/kernel/sulog/event.c"
          test -f "$EVENT" || { echo "::error::sulog/event.c not found"; exit 1; }
          grep -q '#include <linux/uaccess.h>' "$EVENT" || \
            sed -i '1i #include <linux/uaccess.h>' "$EVENT"
          sed -i 's/\bstrncpy_from_user_nofault(/strncpy_from_user(/g' "$EVENT"
          N=$(grep -c 'strncpy_from_user(' "$EVENT" || true)
          if [ "${N:-0}" -lt 2 ] || grep -Eq '\bstrncpy_from_user_nofault\(' "$EVENT"; then
            echo "::error::strncpy_from_user_nofault replacement failed (count=$N)"; exit 1
          fi
          echo "-- sulog event.c now uses strncpy_from_user (5.4-safe, ${N} sites)"
          REBOOT_GATE="${{ inputs.reboot_gate || 'false' }}"
          if [ "$REBOOT_GATE" = "true" ]; then
          echo "== KernelSU 加固：sys_reboot supercall fd 自举通道的调用方门控 =="
          # backslashxx 的 ksu_handle_sys_reboot 在 kernel/supercall/supercall.c：
          # magic1=0xDEADBEEF + magic2=0xCAFEBABE 时无条件 ksu_install_fd() 并
          # 回写 0，任何三方 app 无 root 即可确认 KernelSU 存在（公开探测向量）。
          # 与 Nova 线不同：这里有 manager_or_root()（supercall/perm.c）可直接用，
          # 且安装点在 supercall.c 而非 dispatch.c。
          # 非 root/非管理器返回 -EINVAL → orig_flow 走 stock reboot.c →
          # 非 CAP_SYS_BOOT 得到 -EPERM，返回值与 fd 副作用双双归零。
          SC="KSU_src/kernel/supercall/supercall.c"
          test -f "$SC" || { echo "::error::supercall/supercall.c not found"; exit 1; }
          grep -q 'bool manager_or_root(void)' KSU_src/kernel/supercall/perm.c \
            || { echo "::error::manager_or_root helper missing in supercall/perm.c - reboot_gate would fail to link"; exit 1; }
          python3 - "$SC" <<'PYREBOOT_EOF'
          import re, sys
          path = sys.argv[1]
          src = open(path).read()
          if "bakasu anti-detect" in src:
              print("-- reboot gate already applied, skipping")
              sys.exit(0)
          pat = re.compile(r'(if \(magic2 == KSU_INSTALL_MAGIC2\) \{\n)(\s*)(int fd = ksu_install_fd\(\);)')
          m = pat.search(src)
          if not m:
              sys.exit("::error::sys_reboot install target not found in supercall.c")
          guard = (
              "\t/* bakasu anti-detect: third-party apps must neither bootstrap a\n"
              "         * supercall fd nor observe a stock-divergent return. Stock\n"
              "         * sys_reboot yields -EPERM to non-CAP_SYS_BOOT callers; a non-zero\n"
              "         * return sends them down orig_flow (kernel/reboot.c) which produces\n"
              "         * exactly that -EPERM. Root and the identified manager keep the\n"
              "         * bootstrap channel. */\n"
              "\tif (!manager_or_root())\n"
              "\t\treturn -EINVAL;\n"
          )
          repl = m.group(1) + m.group(2) + guard + m.group(2) + m.group(3)
          src = src[:m.start()] + repl + src[m.end():]
          open(path, "w").write(src)
          print("-- inserted manager_or_root gate before ksu_install_fd()")
          PYREBOOT_EOF
          grep -q 'bakasu anti-detect' "$SC" \
            || { echo "::error::reboot gate patch failed"; exit 1; }
          grep -q 'if (!manager_or_root())' "$SC" \
            || { echo "::error::reboot gate authorization check missing"; exit 1; }
          [ "$(grep -c 'int fd = ksu_install_fd();' "$SC")" = "1" ] \
            || { echo "::error::reboot gate call-site count unexpected"; exit 1; }
          echo "-- sys_reboot bootstrap channel now gated to root/manager; third-party apps observe stock -EPERM"
          else
            echo "-- reboot gate DISABLED via workflow input; supercall.c left untouched"
          fi
          echo "== 修复 vendor selinux 预置钩子的 6 个未定义符号（services.c 末尾追加定义，特性关闭语义）=="
          # vendor 树 security/selinux/{selinuxfs.c,hooks.c} 的 BakaSU 预置钩子在
          # #ifdef CONFIG_KSU_SUSFS 内以 extern 引用 selinux_hide 特性符号。
          # backslashxx 的 kernel/feature/selinux_hide.c 虽是 unity build 无条件
          # 编入，但 ksu_selinux_hide_enabled 是 **file-static**，fake_status 只是
          # ksu_prepare_fake_status_page() 内的局部变量，不提供这 6 个全局符号，
          # LTO 链接期会 undefined。把“特性关闭/延迟激活”语义的定义追加进
          # security/selinux/ss/services.c（CONFIG_SECURITY_SELINUX=y 下必然参与链接）。
          # 不可走独立 stub TU + 顶层 Makefile obj-y：kbuild 只在目录 Makefile 消费
          # obj-y，顶层 obj-y 是死赋值，TU 永不编译而 grep 却能通过（CI 实测 6 符号
          # 全部 undefined）。
          SVC="security/selinux/ss/services.c"
          test -f "$SVC" || { echo "::error::security/selinux/ss/services.c not found"; exit 1; }
          if ! grep -q 'bool ksu_selinux_hide_enabled' "$SVC"; then
            cat >> "$SVC" <<'KSU_SVCCOMPAT_EOF'
          /* ksu vendor selinux_hide compat：vendor selinuxfs.c/hooks.c 的 BakaSU 预置钩子
           * 引用的符号，backslashxx/KernelSU 不提供（其 selinux_hide.c 用 file-static
           * bool 与局部 fake_status 变量，无全局符号）。fake_state 不在此列：其调用点
           * 已由 sus_type 回移植的 perl 替换消除，仅剩 extern 声明（无符号需求）。
           * 追加块所需 include：cache.h（__read_mostly）、jump_label.h
           *（DEFINE_STATIC_KEY_FALSE）、mm.h（alloc_page/page_address）；mutex.h 本文件
           * 已直接包含，bool/NULL 由既有包含链提供。
           * 特性语义：延迟激活。enabled/running 起步 false（=可启动基线），仅当
           * late_initcall 成功构造 fake_status 后才置 true，使 vendor 的 my_write_access
           * / my_write_context / my_setprocattr / my_sel_open_handle_status 对 app uid
           *（>=10000）走 susfs 过滤路径（uid<10000 与内核进程不受影响），配合 sus_type
           * 回移植实现 /access、/context 探测的 -EINVAL 与 avd 还原。 */
          #include <linux/cache.h>
          #include <linux/jump_label.h>
          #include <linux/mm.h>
          /* enabled 门控 my_sel_open_handle_status（uid>=10000 时以 fake_status 换
           * 真实页）；running 门控 my_write_access / my_write_context / my_setprocattr
           * 的 susfs 还原路径（uid>=10000）。两者起步 false（与可启动基线等价），
           * 仅当 late_initcall 成功构造 fake_status 后才整体置 true —— 任何失败路径
           * 下内核照常启动，绝不卡第一屏。 */
          bool ksu_selinux_hide_enabled __read_mostly = false;
          bool ksu_selinux_hide_running __read_mostly = false;
          /* vendor: extern struct static_key_false ...; 仅门控 selinuxfs.c:262 的
           * 兜底重试（!fake_status 时才触发），置位本身无害 */
          DEFINE_STATIC_KEY_FALSE(fake_status_initialize_key);
          /* BakaSU: __maybe_static struct page *fake_status = NULL（消费点判空） */
          struct page *fake_status = NULL;
          /* BakaSU 定义与 vendor extern 均为 struct mutex *；vendor 消费点判空后
           * lock/unlock 保护 fake_status 读取。此处仅接线指针，初始化函数自身无锁。 */
          struct mutex *ksu_selinux_status_lock = NULL;
          /* 构造 stock 观感的状态页供 my_sel_open_handle_status 服务给 app uid：
           * 真实页在 SukiSU 内核态注入后 sequence 已被抬升、policyload 因页晚于策略
           * 加载分配而恒为 0（doc 注明 load 后"never zero"）——恰好是检测器抓的
           * "status.sequence/policyload" 异常。这里复制真实页后规范化为一次加载、
           * enforcing、无 pending 的 stock 形态。
           * 【锁定纪律】5.4 的 selinux_kernel_status_page() 内部自取 status_lock
           * （ss/status.c:47）。旧版本函数在持锁状态下调用它 → 同一互斥锁自嵌套 →
           * 死锁在 late_initcall → init 未启动内核即挂死 → 卡第一屏（两次 bootloop
           * 根因）。本函数因此完全无锁：late_initcall 上下文无并发；vendor 兜底调用
           * 点（selinuxfs.c:263）也在锁外；最坏并发是双份分配，内容一致后者胜出，
           * 仅泄漏一页，无碍。 */
          void initialize_fake_status(void)
          {
          struct selinux_kernel_status *fake, *real = NULL;
          struct page *new_page;
          if (fake_status)
          return;
          if (!selinux_state.ss)
          return;
          if (selinux_state.ss->status_page)
          real = page_address(selinux_state.ss->status_page);
          new_page = alloc_page(GFP_KERNEL | __GFP_ZERO);
          if (!new_page)
          return;
          fake = page_address(new_page);
          fake->version = real ? real->version : SELINUX_KERNEL_STATUS_VERSION;
          /* seqlock 稳定态必须为偶数：stock 在一次策略加载后 sequence=2（每次
           * 事件 +2，奇数=更新中被按协议读取的检测器判可疑） */
          fake->sequence = 2;
          fake->enforcing = 1;
          fake->policyload = 1;
          fake->deny_unknown = real ? real->deny_unknown : 1;
          fake_status = new_page;
          }
          /* 初始化尾段：先装假页，成功才激活 enabled/running。静态键无条件开——
           * 它只门控兜底重试，假页就绪时 no-op，未就绪时给首次 open 一次重试机会
           * （重试路径已无锁，不会死锁）。 */
          static int __init bakasu_fake_status_init(void)
          {
          static_key_enable(&fake_status_initialize_key.key);
          initialize_fake_status();
          if (fake_status) {
          ksu_selinux_hide_enabled = true;
          ksu_selinux_hide_running = true;
          }
          return 0;
          }
          late_initcall(bakasu_fake_status_init);
          KSU_SVCCOMPAT_EOF
          fi
          for sym in ksu_selinux_hide_enabled ksu_selinux_hide_running \
                     fake_status_initialize_key fake_status \
                     ksu_selinux_status_lock initialize_fake_status; do
            grep -q "\b$sym\b" "$SVC" || { echo "::error::services.c missing symbol $sym"; exit 1; }
          done
          echo "-- 6 vendor selinux_hide symbols defined in security/selinux/ss/services.c"
      - name: Backport sus_type/avd hiding into vendor 5.4 susfs
        working-directory: kernel
        run: |
          set -euo pipefail
          echo "== 回移植 6.6-dev 的 sus_type/avd 隐藏实现到 vendor 5.4 =="
          # 上游 susfs4ksu（gki-android15-6.6-dev）把 BakaSU 注入的 policy 规则缓存在内核哈希表：
          #   - susfs_add_sus_type: 注册注入的 type；app 解析该 type 的 context 时按 -EINVAL 拒绝
          #   - susfs_add_sus_avd_allowed_by_type/susfs_spoof_avd_allowed_rcu: 记录注入前的
          #     avd.allowed，app 走 /sys/fs/selinux/access 查询时还原为注入前的授权位
          # vendor 5.4（susfs v2.3.0）无此实现，且 selinux 锁模型不同（policy_rwlock 而非 6.6 的
          # RCU + selinux_policy），这里按 5.4 语义回移植内核侧存储与 services.c 过滤实现，并把
          # selinuxfs.c/hooks.c 中 my_* 钩子的 fake_state 调用切到 susfs 过滤路径
          if ! grep -q 'susfs_is_sus_type_rcu' fs/susfs.c; then
            echo "-- backporting sus_type/avd hiding into vendor 5.4 susfs"
            # 1) fs/susfs.c：sus_type / sus_avd_allowed 内核存储（照搬 6.6-dev，日志宏改用
            #    v2.3.0 的 SUSFS_LOGE/SUSFS_LOGI，上游用 v2.4+ 才有的 *_RL 变体）
            cat >> fs/susfs.c <<'SUSTYPE_EOF'
            /* sus_type: backported from susfs4ksu gki-android15-6.6-dev */
            static DEFINE_MUTEX(susfs_mutex_lock_sus_type);
            static DEFINE_HASHTABLE(SUS_TYPE_HLIST, 10);
            struct st_susfs_sus_type_hlist {
            struct hlist_node                        node;
            };
            int susfs_add_sus_type(const char *secctx, u32 type_value) {
            struct st_susfs_sus_type_hlist *new_entry, *tmp_entry;
            struct hlist_node *tmp_hlist_node;
            int err = 0;
            mutex_lock(&susfs_mutex_lock_sus_type);
            hash_for_each_possible_safe(SUS_TYPE_HLIST, tmp_entry, tmp_hlist_node, node, type_value) {
            SUSFS_LOGE("secctx '%s', type_value '%u', was added before already\n",
            secctx, type_value);
            err = -EINVAL;
            goto unlock;
            }
            new_entry = kzalloc(sizeof(struct st_susfs_sus_type_hlist), GFP_KERNEL);
            if (!new_entry) {
            err = -ENOMEM;
            goto unlock;
            }
            hash_add_rcu(SUS_TYPE_HLIST, &new_entry->node, type_value);
            SUSFS_LOGI("secctx '%s', type '%u', has been added to SUS_TYPE_HLIST\n",
            secctx, type_value);
            unlock:
            mutex_unlock(&susfs_mutex_lock_sus_type);
            return err;
            }
            bool susfs_is_sus_type_rcu(u32 type_value) {
            struct st_susfs_sus_type_hlist *entry = NULL;
            hash_for_each_possible_rcu(SUS_TYPE_HLIST, entry, node, type_value) {
            return true;
            }
            return false;
            }
            static DEFINE_MUTEX(susfs_mutex_lock_sus_avd_allowed_hlist);
            static DEFINE_HASHTABLE(SUS_AVD_ALLOWED_HLIST, 18);
            struct susfs_sus_av_rule {
            struct hlist_node node;
            u32 s_type;
            u32 t_type;
            u32 c_type;
            u32 orig_avd_allowed;
            };
            static inline u32 susfs_av_rule_hash(u32 ssid, u32 tsid, u16 tclass)
            {
            u32 h;
            h = hash_32(ssid, 32);
            h ^= rol32(hash_32(tsid, 32), 13);
            h ^= rol32(hash_32((u32)tclass, 32), 19);
            h += h << 13;
            h ^= h >> 7;
            h += h << 17;
            h ^= h >> 5;
            return h;
            }
            int susfs_add_sus_avd_allowed_by_type(u32 s_type, u32 t_type, u32 c_type, u32 orig_avd_allowed)
            {
            struct susfs_sus_av_rule *entry, *tmp_entry;
            struct hlist_node *tmp_hlist_node;
            int err = 0;
            u32 key;
            mutex_lock(&susfs_mutex_lock_sus_avd_allowed_hlist);
            entry = kzalloc(sizeof(*entry), GFP_ATOMIC);
            if (!entry) {
            err = -ENOMEM;
            goto unlock;
            }
            key = susfs_av_rule_hash(s_type, t_type, c_type);
            hash_for_each_possible_safe(SUS_AVD_ALLOWED_HLIST, tmp_entry, tmp_hlist_node, node, key) {
            if (tmp_entry->s_type == s_type &&
                tmp_entry->t_type == t_type &&
                tmp_entry->c_type == c_type)
            {
            /* Do not apply any new orig_avd_allowed for matched entry. */
            kfree(entry);
            goto unlock;
            }
            }
            entry->s_type = s_type;
            entry->t_type = t_type;
            entry->c_type = c_type;
            entry->orig_avd_allowed = orig_avd_allowed;
            hash_add_rcu(SUS_AVD_ALLOWED_HLIST, &entry->node, key);
            SUSFS_LOGI("av_rule '%u %u %u %u' has been added to SUS_AVD_ALLOWED_HLIST\n",
            s_type, t_type, c_type, orig_avd_allowed);
            unlock:
            mutex_unlock(&susfs_mutex_lock_sus_avd_allowed_hlist);
            return err;
            }
            void susfs_spoof_avd_allowed_rcu(u32 s_type, u32 t_type, u32 c_type, u32 *avd_allowed)
            {
            struct susfs_sus_av_rule *entry;
            u32 key = susfs_av_rule_hash(s_type, t_type, c_type);
            hash_for_each_possible_rcu(SUS_AVD_ALLOWED_HLIST, entry, node, key) {
            if (entry->s_type == s_type &&
                entry->t_type == t_type &&
                entry->c_type == c_type)
            {
            *avd_allowed = entry->orig_avd_allowed;
            return;
            }
            }
            }
          SUSTYPE_EOF
            # 2) security/selinux/ss/services.c：5.4 适配的过滤实现。与 6.6 原版的差异：
            #    - 6.6 用 rcu_read_lock + rcu_dereference(selinux_state.policy)，5.4 用
            #      read_lock(&selinux_state.ss->policy_rwlock) + 内嵌 policydb/sidtab
            #    - 5.4 的 context_to_sid 查找依赖 context->hash，需先 context_add_hash()
            #    - string_to_context_struct 按本内核用 hashtab_search(pol->p_xxx.table, ...)
            cat >> security/selinux/ss/services.c <<'SUSAVD_EOF'
            /* sus_type hiding: backported from susfs4ksu gki-android15-6.6-dev (5.4 rwlock model) */
            #ifdef CONFIG_KSU_SUSFS
            extern bool susfs_is_sus_type_rcu(u32 sid);
            extern void susfs_spoof_avd_allowed_rcu(u32 s_type, u32 t_type, u32 c_type, u32 *avd_allowed);
            static int susfs_string_to_context_struct(struct policydb *pol,
                struct sidtab *sidtabp,
                char *scontext,
                struct context *ctx,
                u32 def_sid)
            {
            struct role_datum *role;
            struct type_datum *typdatum;
            struct user_datum *usrdatum;
            char *scontextp, *p, oldc;
            int rc = 0;
            context_init(ctx);
            /* Parse the security context. */
            rc = -EINVAL;
            scontextp = (char *) scontext;
            /* Extract the user. */
            p = scontextp;
            while (*p && *p != ':')
            p++;
            if (*p == 0)
            goto out;
            *p++ = 0;
            usrdatum = hashtab_search(pol->p_users.table, scontextp);
            if (!usrdatum)
            goto out;
            ctx->user = usrdatum->value;
            /* Extract role. */
            scontextp = p;
            while (*p && *p != ':')
            p++;
            if (*p == 0)
            goto out;
            *p++ = 0;
            role = hashtab_search(pol->p_roles.table, scontextp);
            if (!role)
            goto out;
            ctx->role = role->value;
            /* Extract type. */
            scontextp = p;
            while (*p && *p != ':')
            p++;
            oldc = *p;
            *p++ = 0;
            typdatum = hashtab_search(pol->p_types.table, scontextp);
            if (!typdatum || typdatum->attribute)
            goto out;
            if (likely(susfs_is_sus_type_rcu(typdatum->value)))
            goto out;
            ctx->type = typdatum->value;
            rc = mls_context_to_sid(pol, oldc, p, ctx, sidtabp, def_sid);
            if (rc)
            goto out;
            /* Check the validity of the new context. */
            rc = -EINVAL;
            if (!policydb_context_isvalid(pol, ctx))
            goto out;
            rc = 0;
            out:
            if (rc)
            context_destroy(ctx);
            return rc;
            }
            static int susfs_security_context_to_sid_core(const char *scontext, u32 scontext_len,
            u32 *sid, u32 def_sid, gfp_t gfp_flags,
            int force)
            {
            struct policydb *policydb;
            struct sidtab *sidtab;
            char *scontext2, *str = NULL;
            struct context context;
            int rc = 0;
            /* An empty security context is never valid. */
            if (!scontext_len)
            return -EINVAL;
            /* Copy the string to allow changes and ensure a NUL terminator */
            scontext2 = kmemdup_nul(scontext, scontext_len, gfp_flags);
            if (!scontext2)
            return -ENOMEM;
            if (!selinux_state.initialized) {
            int i;
            for (i = 1; i < SECINITSID_NUM; i++) {
            if (!strcmp(initial_sid_to_string[i], scontext2)) {
            *sid = i;
            goto out;
            }
            }
            *sid = SECINITSID_KERNEL;
            goto out;
            }
            *sid = SECSID_NULL;
            if (force) {
            /* Save another copy for storing in uninterpreted form */
            rc = -ENOMEM;
            str = kstrdup(scontext2, gfp_flags);
            if (!str)
            goto out;
            }
            read_lock(&selinux_state.ss->policy_rwlock);
            policydb = &selinux_state.ss->policydb;
            sidtab = selinux_state.ss->sidtab;
            rc = susfs_string_to_context_struct(policydb, sidtab, scontext2,
                  &context, def_sid);
            if (rc == -EINVAL && force) {
            context.str = str;
            context.len = strlen(str) + 1;
            str = NULL;
            } else if (rc)
            goto out_unlock;
            rc = context_add_hash(policydb, &context);
            if (rc)
            goto out_unlock;
            rc = sidtab_context_to_sid(sidtab, &context, sid);
            context_destroy(&context);
            out_unlock:
            read_unlock(&selinux_state.ss->policy_rwlock);
            out:
            kfree(scontext2);
            kfree(str);
            return rc;
            }
            int susfs_security_context_to_sid(const char *scontext, u32 scontext_len, u32 *sid,
                gfp_t gfp)
            {
            return susfs_security_context_to_sid_core(scontext, scontext_len,
                sid, SECSID_NULL, gfp, 0);
            }
            int susfs_security_context_str_to_sid(const char *scontext, u32 *sid, gfp_t gfp)
            {
            return susfs_security_context_to_sid(scontext, strlen(scontext),
                   sid, gfp);
            }
            void susfs_security_compute_av_user(u32 ssid,
                  u32 tsid,
                  u16 tclass,
                  struct av_decision *avd)
            {
            struct policydb *policydb;
            struct sidtab *sidtab;
            struct context *scontext = NULL, *tcontext = NULL;
            read_lock(&selinux_state.ss->policy_rwlock);
            avd_init(&selinux_state, avd);
            if (!selinux_state.initialized)
            goto allow;
            policydb = &selinux_state.ss->policydb;
            sidtab = selinux_state.ss->sidtab;
            scontext = sidtab_search(sidtab, ssid);
            if (!scontext) {
            pr_err("SELinux: %s:  unrecognized SID %d\n",
                   __func__, ssid);
            goto out;
            }
            /* permissive domain? */
            if (ebitmap_get_bit(&policydb->permissive_map, scontext->type))
            avd->flags |= AVD_FLAGS_PERMISSIVE;
            tcontext = sidtab_search(sidtab, tsid);
            if (!tcontext) {
            pr_err("SELinux: %s:  unrecognized SID %d\n",
                   __func__, tsid);
            goto out;
            }
            if (unlikely(!tclass)) {
            if (policydb->allow_unknown)
            goto allow;
            goto out;
            }
            context_struct_compute_av(policydb, scontext, tcontext, tclass, avd,
              NULL);
            susfs_spoof_avd_allowed_rcu(scontext->type, tcontext->type, tclass,
                &avd->allowed);
             out:
            read_unlock(&selinux_state.ss->policy_rwlock);
            return;
            allow:
            avd->allowed = 0xffffffff;
            goto out;
            }
            #endif // #ifdef CONFIG_KSU_SUSFS
          SUSAVD_EOF
            # 3) selinuxfs.c / hooks.c：my_* 钩子由 fake_state 路径切到 susfs 过滤路径
            #    （fake_state 浅拷贝的 initialized 恒为 false，标准接口会退化为全放行/假 SID）
            perl -0pi -e 's/security_context_to_sid\(&fake_state, buf, size, &sid, GFP_KERNEL\);/susfs_security_context_to_sid(buf, size, &sid, GFP_KERNEL);/; s/security_sid_to_context\(&fake_state, sid, &canon, &len\);/security_sid_to_context(&selinux_state, sid, &canon, &len);/; s/security_context_str_to_sid\(&fake_state, scon, &ssid, GFP_KERNEL\);/susfs_security_context_str_to_sid(scon, &ssid, GFP_KERNEL);/; s/security_context_str_to_sid\(&fake_state, tcon, &tsid, GFP_KERNEL\);/susfs_security_context_str_to_sid(tcon, &tsid, GFP_KERNEL);/; s/security_compute_av_user\(&fake_state, ssid, tsid, tclass, &avd\);/susfs_security_compute_av_user(ssid, tsid, tclass, &avd);/; s/security_context_to_sid\(&fake_state, value, size,\s*&sid, GFP_KERNEL\);/susfs_security_context_to_sid(value, size, &sid, GFP_KERNEL);/s' \
              security/selinux/selinuxfs.c security/selinux/hooks.c
            # 4) 落盘校验
            grep -q 'int susfs_add_sus_type(const char \*secctx' fs/susfs.c \
              && grep -q 'int susfs_add_sus_avd_allowed_by_type(u32 s_type' fs/susfs.c \
              && grep -q 'bool susfs_is_sus_type_rcu(u32 type_value)' fs/susfs.c \
              && grep -q 'void susfs_spoof_avd_allowed_rcu' fs/susfs.c \
              && grep -q 'void susfs_security_compute_av_user(u32 ssid' security/selinux/ss/services.c \
              && grep -q 'susfs_string_to_context_struct' security/selinux/ss/services.c \
              && grep -q 'susfs_security_context_to_sid(buf, size' security/selinux/selinuxfs.c \
              && grep -q 'susfs_security_compute_av_user(ssid' security/selinux/selinuxfs.c \
              && grep -q 'susfs_security_context_to_sid(value, size' security/selinux/hooks.c \
              && ! grep -q 'security_compute_av_user(&fake_state' security/selinux/selinuxfs.c \
              || { echo "::error::sus_type backport verification failed"; exit 1; }
          else
            echo "-- sus_type backport already present, skipping"
          fi
      - name: Cover Shizuku(shell) in SELinux status fake page
        working-directory: kernel
        run: |
          set -euo pipefail
          echo "== 让 Shizuku(shell, uid 2000) 也读到伪造的 status 页 =="
          # vendor 的 my_sel_open_handle_status 只在 uid>=10000 时换成假页
          # （sequence=2 / policyload=1 的 stock 形态）。春秋若以 Shizuku 通道
          # 读取 /sys/fs/selinux/status，uid=2000 会绕过假页看到真实页，
          # 真实页的 sequence/policyload 被策略注入抬高 → "status.sequence/policyload"。
          # 这里只额外放行 shell(2000)，不碰 uid 0/1000：init、system_server
          # 的 libselinux 仍读真实页，避免影响系统策略变更监听。
          F=security/selinux/selinuxfs.c
          test -f "$F" || { echo "::error::$F not found"; exit 1; }
          grep -q 'current_uid()\.val >= 10000 && ksu_selinux_hide_enabled' "$F" \
            || { echo "::error::status hook anchor not found (vendor layout changed?)"; exit 1; }
          sed -i 's/current_uid()\.val >= 10000 && ksu_selinux_hide_enabled/(current_uid().val >= 10000 || current_uid().val == 2000) \&\& ksu_selinux_hide_enabled/' "$F"
          grep -q 'current_uid().val == 2000) && ksu_selinux_hide_enabled' "$F" \
            || { echo "::error::shell status spoof patch failed"; exit 1; }
          ! grep -q 'current_uid()\.val >= 10000 && ksu_selinux_hide_enabled' "$F" \
            || { echo "::error::old status gate still present"; exit 1; }
          echo "-- status fake page now covers app uids + shell(2000)"
      - name: Patch SELinux status.c (policyload backfill)
        working-directory: kernel
        run: |
          set -euo pipefail
          echo "== 修复：status 页惰性分配导致真实页 policyload 永远为 0 =="
          # 5.4 状态页在首次 open/mmap /sys/fs/selinux/status 时才分配
          # （ss/status.c selinux_kernel_status_page 惰性 alloc）；init 加载
          # sepolicy 触发的 selinux_status_update_policyload(seqno=1) 当时页
          # 不存在，更新被静默丢弃，真实页从此永远 policyload=0。对 enforcing
          # 系统这是不可能状态（policy 从未加载不可能 enforcing），mainline 注释
          # 亦声明该值 "never zero"——检测器（春秋 status.sequence/policyload 项）
          # 以 root 读真实页即报篡改。修复：update_policyload 无论页是否存在都
          # 记录 seqno，惰性分配时回填；两个函数同持 status_lock，无竞态。
          STATUS_C=security/selinux/ss/status.c
          test -f "$STATUS_C" || { echo "::error::$STATUS_C not found"; exit 1; }
          if grep -q 'selinux_last_policyload' "$STATUS_C"; then
            echo "-- policyload backfill already present, skipping"
          else
            python3 - "$STATUS_C" <<'PYEOF'
          import sys
          p = sys.argv[1]
          s = open(p).read()
          a = '#include "services.h"\n'
          assert s.count(a) == 1, 'include anchor'
          s = s.replace(a, a + '\n/* latest policyload seqno, for status page lazy-allocation backfill */\nstatic int selinux_last_policyload;\n')
          key = 'selinux_status_update_policyload'
          lock = 'mutex_lock(&state->ss->status_lock);'
          i = s.index(key)
          j = s.index(lock, i)
          end = j + len(lock)
          s = s[:end] + '\n\tselinux_last_policyload = seqno;' + s[end:]
          q = 'status->sequence = 0;'
          assert s.count(q) == 1, 'sequence anchor'
          s = s.replace(q, 'status->sequence = selinux_last_policyload * 2;')
          z = 'status->policyload = 0;'
          assert s.count(z) == 1, 'lazy alloc anchor'
          s = s.replace(z, 'status->policyload = selinux_last_policyload;')
          open(p, 'w').write(s)
          print('policyload backfill patched')
          PYEOF
            grep -q 'static int selinux_last_policyload;' "$STATUS_C" \
              && grep -q 'status->policyload = selinux_last_policyload;' "$STATUS_C" \
              && grep -q 'status->sequence = selinux_last_policyload \* 2;' "$STATUS_C" \
              && grep -q 'selinux_last_policyload = seqno;' "$STATUS_C" \
              && ! grep -q 'status->policyload = 0;' "$STATUS_C" \
              && ! grep -q 'status->sequence = 0;' "$STATUS_C" \
              || { echo "::error::policyload backfill patch verification failed"; exit 1; }
            echo "-- policyload backfill patched & verified"
          fi
      - name: Configure Kernel (full SUSFS features)
        working-directory: kernel
        run: |
          set -euo pipefail
          export ARCH=arm64
          export PATH="${{ env.CLANG_DIR }}/bin:$PATH"
          export LLVM=1 LLVM_IAS=1 \
                 CLANG_TRIPLE=aarch64-linux-gnu- \
                 CROSS_COMPILE=aarch64-linux-gnu- \
                 CROSS_COMPILE_COMPAT=arm-linux-gnueabi-
          echo "== 直接向 defconfig 追加 SUSFS 配置 =="
          DEFCONFIG_PATH="./arch/arm64/configs/${{ env.DEFCONFIG_NAME }}"
          test -f "$DEFCONFIG_PATH" || { echo "::error::defconfig not found at $DEFCONFIG_PATH"; exit 1; }
          # 上游 defconfig 首行混入全角括号（"（CONFIG_MIHW=y"），kconfig 会警告并丢弃该行，
          # 导致小米 millet 驱动（drivers/mihw）被静默关闭，这里剥离全角括号修复
          sed -i 's/\xEF\xBC\x88//g; s/\xEF\xBC\x89//g' "$DEFCONFIG_PATH"
          grep -q '^CONFIG_MIHW=y' "$DEFCONFIG_PATH" \
            || { echo "::error::defconfig sanitize failed (MIHW line)"; exit 1; }
          # 注意：KSU_SUSFS_PRIORITY_UID_FILTER 在注入的 Kconfig 里存在但必须保持 n —— 
          # vendor 5.4 susfs（v2.3.0）没有 susfs_parse_priority_app_strings() 等实现，
          # 开启会在 pkg_observer.c 产生未定义符号。
          for sym in KSU_SUSFS KSU_SUSFS_SUS_PATH KSU_SUSFS_SUS_MOUNT KSU_SUSFS_SUS_KSTAT \
                     KSU_SUSFS_SPOOF_UNAME KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS \
                     KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG KSU_SUSFS_OPEN_REDIRECT \
                     KSU_SUSFS_SUS_MAP; do
            echo "CONFIG_${sym}=y" >> "$DEFCONFIG_PATH"
          done
          grep -q 'CONFIG_KSU_SUSFS_SUS_MAP=y' "$DEFCONFIG_PATH" \
            || { echo "::error::defconfig SUSFS append failed"; exit 1; }
          echo "== 启用 pstore ramoops（异常开机取证：/sys/fs/pstore/console-ramoops-*）=="
          for sym in PSTORE PSTORE_RAM PSTORE_CONSOLE; do
            echo "CONFIG_${sym}=y" >> "$DEFCONFIG_PATH"
          done
          echo "== 生成 defconfig =="
          make O=out ARCH=arm64 "${{ env.DEFCONFIG_NAME }}"
          echo "== 配置 KernelSU：manual-hook 形态 + SUSFS 全功能 =="
          # backslashxx 的 hook 方式三选一。vendor 树的 ksu_handle_* 调用点全部
          # 位于 #ifdef CONFIG_KSU_SUSFS 内（manual-hook 形态），所以关掉 LSM
          # 自动钩、branch link 与 syscall table 改写，避免与 vendor 手动钩子重复。
          # KSU_NOPRINTK 关掉驱动全部 dmesg，避免 KSU 字样成为指纹。
          scripts/config --file out/.config \
            --enable  KSU \
            --disable KSU_LSM_SECURITY_HOOKS \
            --disable KSU_HACK_ARM64_BRANCH_LINK \
            --disable KSU_TAMPER_SYSCALL_TABLE \
            --disable KSU_DISABLE_32BIT_HOOKS \
            --disable KSU_HOSTSREDIRECT \
            --disable KSU_ENABLE_FULL_UID_CHECKS \
            --disable KSU_THRONE_TRACKER_ALWAYS_THREADED \
            --disable KSU_SHELL_HAS_SU_ALWAYS \
            --enable  KSU_NOPRINTK \
            --enable  KSU_SUSFS \
            --enable  KSU_SUSFS_HAS_MAGIC_MOUNT \
            --enable  KSU_SUSFS_SUS_PATH \
            --enable  KSU_SUSFS_SUS_MOUNT \
            --enable  KSU_SUSFS_SUS_KSTAT \
            --enable  KSU_SUSFS_SPOOF_UNAME \
            --disable KSU_SUSFS_ENABLE_LOG \
            --enable  KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS \
            --enable  KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG \
            --enable  KSU_SUSFS_OPEN_REDIRECT \
            --enable  KSU_SUSFS_SUS_MAP \
            --disable KSU_SUSFS_PRIORITY_UID_FILTER \
            --disable KSU_DEBUG \
            --enable  KALLSYMS_ALL \
            --disable UAPI_HEADER_TEST \
            --disable HEADERS_INSTALL \
            --disable LOCALVERSION_AUTO \
            --disable IKCONFIG \
            --disable IKCONFIG_PROC \
            --set-str LOCALVERSION ""
          grep -q '^CONFIG_IKCONFIG_PROC=y' out/.config \
          && { echo "::error::/proc/config.gz exposed - any app can grep CONFIG_KSU from it"; exit 1; } || true

          # /proc/version 不受 SUSFS SPOOF_UNAME 伪造，版本串带 susfs 等字样会被
          # 春秋/Momo 类检测直接读出；强制保持空串，内核串回归原厂形态
          make O=out ARCH=arm64 olddefconfig
          echo "== 校验 SUSFS 配置生效 =="
          echo "-- KSU/SUSFS/依赖 当前状态 --"
          grep -nE '^CONFIG_(KSU|KSU_SUSFS|PSTORE|THREAD_INFO_IN_TASK|OVERLAY_FS)' out/.config || true
          echo "-- Kconfig 中的 SUS_MOUNT 定义 --"
          grep -n -A4 'config KSU_SUSFS_SUS_MOUNT' drivers/kernelsu/Kconfig || true
          for sym in KSU KSU_NOPRINTK KSU_SUSFS KSU_SUSFS_SUS_PATH KSU_SUSFS_SUS_KSTAT \
                     KSU_SUSFS_SPOOF_UNAME KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS \
                     KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG KSU_SUSFS_OPEN_REDIRECT \
                     KSU_SUSFS_SUS_MAP PSTORE PSTORE_RAM PSTORE_CONSOLE; do
            grep -q "^CONFIG_${sym}=y" out/.config || { echo "::error::CONFIG_${sym} not enabled"; exit 1; }
          done
          # manual-hook 形态必须确认自动化钩子已关闭（否则 vendor 手动钩子会重复触发）
          for sym in KSU_LSM_SECURITY_HOOKS KSU_HACK_ARM64_BRANCH_LINK KSU_TAMPER_SYSCALL_TABLE; do
            ! grep -q "^CONFIG_${sym}=y" out/.config \
              || { echo "::error::CONFIG_${sym} must stay off (manual-hook model)"; exit 1; }
          done
          # SUS_MOUNT 只影响挂载隐藏，缺失不阻断构建，日志保留真实状态
          grep -q '^CONFIG_KSU_SUSFS_SUS_MOUNT=y' out/.config \
            || echo "::warning::CONFIG_KSU_SUSFS_SUS_MOUNT is off - mount hiding missing, see config dump above"
          grep -q '^CONFIG_KSU_SUSFS_PRIORITY_UID_FILTER=y' out/.config \
            && { echo "::error::CONFIG_KSU_SUSFS_PRIORITY_UID_FILTER must stay off (vendor 5.4 susfs lacks kernel-side support)"; exit 1; } || true
          grep -q '^CONFIG_KSU_SUSFS_ENABLE_LOG=y' out/.config \
            && { echo "::error::SUSFS logging must stay off (dmesg fingerprint)"; exit 1; } || true
          grep -q '^CONFIG_LOCALVERSION_AUTO=y' out/.config \
            && { echo "::error::LOCALVERSION_AUTO must stay off (uname -r would gain -g<sha>)"; exit 1; } || true
      - name: 修复编译警告
        working-directory: kernel
        run: |
          set -e
          FOCALTECH_MAKEFILE="drivers/input/touchscreen/focaltech_touch/Makefile"
          if [ -f "$FOCALTECH_MAKEFILE" ]; then
            sed -i 's/^ \+/\t/' "$FOCALTECH_MAKEFILE"
            echo "Fixed leading spaces in focaltech Makefile"
          fi
          for entry in \
            "drivers/staging/qcacld-3.0:-Wno-format" \
            "drivers/staging/qca-wifi-host-cmn:-Wno-format" \
            "drivers/thermal:-Wno-fortify-source"; do
            DIR="${entry%%:*}"
            FLAG="${entry##*:}"
            if [ -d "$DIR" ] && [ -f "$DIR/Makefile" ]; then
              grep -q -- "$FLAG" "$DIR/Makefile" || echo "ccflags-y += $FLAG" >> "$DIR/Makefile"
            fi
          done
      - name: Build Kernel
        working-directory: kernel
        run: |
          export ARCH=arm64
          export PATH="${{ env.CLANG_DIR }}/bin:$PATH"
          export LLVM=1 LLVM_IAS=1 \
                 CLANG_TRIPLE=aarch64-linux-gnu- \
                 CROSS_COMPILE=aarch64-linux-gnu- \
                 CROSS_COMPILE_COMPAT=arm-linux-gnueabi-
          export CCACHE_DIR="${{ github.workspace }}/.ccache"
          export CCACHE_MAXSIZE=8G
          # 去除 CI 构建指纹：/proc/version 里嵌入的构建者/主机名/时间戳会被检测用作
          # "自编内核" 信号，固定为普通本地构建形态（对反检测同样有意义）
          export KBUILD_BUILD_USER=builder
          export KBUILD_BUILD_HOST=android-build
          export KBUILD_BUILD_TIMESTAMP="Thu Jun 12 10:00:00 UTC 2025"
          echo "== 预装 UAPI 头文件以启用 KernelSU preinit runner =="
          # vendor defconfig 不带 HEADERS_INSTALL，KernelSU 的 preinit runner
          # 检测不到 out/usr/include 会降级为 -DKSU_NO_PREINIT。这里显式安装以启用
          make -j$(nproc) O=out ARCH=arm64 \
            CC="ccache clang" LD="ld.lld" AR="llvm-ar" NM="llvm-nm" \
            headers_install INSTALL_HDR_PATH="$PWD/out/usr" \
            || echo "::warning::headers_install failed, KernelSU preinit will stay disabled (non-fatal)"
          test -f out/usr/include/linux/unistd.h \
            && echo "-- preinit UAPI headers ready" \
            || echo "::warning::usr/include/linux/unistd.h missing, preinit will be disabled"
          set +e
          make -j$(nproc) O=out ARCH=arm64 \
            CC="ccache clang" LD="ld.lld" AR="llvm-ar" NM="llvm-nm" \
            OBJCOPY="llvm-objcopy" OBJDUMP="llvm-objdump" STRIP="llvm-strip" \
            CLANG_TRIPLE="aarch64-linux-gnu-" CROSS_COMPILE="aarch64-linux-gnu-" \
            KCFLAGS="-Wno-unknown-warning-option -Wno-error -Wno-format -Wno-incompatible-pointer-types \
            -Wno-implicit-function-declaration -Wno-strict-prototypes -Wno-missing-prototypes \
            -Wno-int-conversion -Wno-declaration-after-statement \
            -Wframe-larger-than=131072 -Wno-unused-variable -Wno-unused-function \
            -Wno-missing-braces -Wno-int-to-pointer-cast -Wno-address-of-packed-member \
            -Wno-return-type -Wno-shift-negative-value -Wno-array-bounds" \
            HOSTCFLAGS="" 2>&1 | tee build.log
          if [ ${PIPESTATUS[0]} -ne 0 ]; then
            echo "::error::Kernel build failed. Last 200 lines:"
            tail -n 200 build.log
            exit 1
          fi
          echo "=== Build finished ==="
          ccache -s 2>/dev/null || true
          ls -lh out/arch/arm64/boot/Image
      - name: Package AnyKernel3
        run: |
          set -e
          TIME=$(TZ='Asia/Shanghai' date +%Y%m%d-%H%M)
          IMG_PATH="${{ env.KERNEL_DIR }}/${{ env.OUTPUT_DIR }}/arch/arm64/boot/Image"
          test -f "$IMG_PATH"
          rm -rf AnyKernel3
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git
          cd AnyKernel3
          cp "$IMG_PATH" ./Image
          gzip -9 -f ./Image
          rm -f ./Image
          cat > anykernel.sh <<'AK3'
          ### AnyKernel3 Ramdisk Mod Script
          ## osm0sis @ xda-developers
          ### AnyKernel setup
          # global properties
          properties() { '
          kernel.string=Edwin KernelSU (backslashxx/master) Full SUSFS for Xiaomi 11 Ultra / Pro (star)
          do.devicecheck=1
          do.modules=0
          do.systemless=1
          do.cleanup=1
          do.cleanuponabort=0
          device.name1=star
          device.name2=mars
          supported.versions=
          supported.patchlevels=
          supported.vendorpatchlevels=
          '; } # end properties
          ### AnyKernel install
          # boot files attributes
          boot_attributes() {
          set_perm_recursive 0 0 755 644 $RAMDISK/*;
          set_perm_recursive 0 0 750 750 $RAMDISK/init* $RAMDISK/sbin;
          } # end attributes
          # boot shell variables
          BLOCK=boot;
          IS_SLOT_DEVICE=1;
          RAMDISK_COMPRESSION=auto;
          PATCH_VBMETA_FLAG=auto;
          # import functions/variables and setup patching - see for reference (DO NOT REMOVE)
          . tools/ak3-core.sh;
          # boot install
          split_boot;
          flash_boot;
          ## end boot install
          AK3
          chmod +x anykernel.sh
          zip -r9 "../${{ env.DEVICE_CODENAME }}-KernelSU-SUSFS-Full-${TIME}.zip" ./*
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: star-KernelSU-SUSFS-Full
          path: ${{ env.DEVICE_CODENAME }}-KernelSU-SUSFS-Full-*.zip
