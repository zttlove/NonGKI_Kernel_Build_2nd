name: 'Fix SukiSU RC Hook Symbol'
description: 'Automatically patch SukiSU RC Hook symbol for Non-GKI Kernels'
runs:
  using: "composite"
  steps:
    - name: Remove RC Hook code block & symbol reference
  run: |
    # 1. 先删除单独含 ksu_init_rc_hook 的行
    find . -type f \( -name "*.c" -o -name "*.h" \) -exec sed -i '/ksu_init_rc_hook/d' {} \;
    
    # 2. 删除 CONFIG_KERNELSU_RC_HOOK 条件编译整块（按需使用）
    # 说明：Linux sed 多行匹配，删除 #ifdef 到 #endif 区间
    find . -type f \( -name "*.c" -o -name "*.h" \) -exec sed -i '/CONFIG_KERNELSU_RC_HOOK/,/#endif/d' {} \;
