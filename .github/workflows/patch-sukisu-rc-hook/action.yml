      - name: 🪝 Fix SukiSU RC Hook Symbol
        shell: bash
        run: |
          cd "${GITHUB_WORKSPACE}/device_kernel"

          echo "[SukiSU] Wrapping existing ksu_init_rc_hook call with #ifdef"
          # 1. 给已有的 ksu_init_rc_hook 调用加上条件编译
          # 假设调用行在 SYSCALL_DEFINE3(read) 内部
          sed -i '/ksu_init_rc_hook/i\#ifdef CONFIG_KERNELSU_RC_HOOK' fs/read_write.c
          sed -i '/ksu_init_rc_hook/a\#endif' fs/read_write.c

          # 2. 确保顶层 Makefile 加载 drivers/kernelsu
          if ! grep -q 'obj-$(CONFIG_KERNELSU) += drivers/kernelsu/' Makefile; then
            echo 'obj-$(CONFIG_KERNELSU) += drivers/kernelsu/' >> Makefile
            echo "[+] Added drivers/kernelsu to Makefile"
          fi      - name: 🪝 Fix SukiSU RC Hook Symbol
