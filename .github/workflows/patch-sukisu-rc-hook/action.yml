name: 'Fix SukiSU RC Hook Symbol'
description: 'Automatically patch SukiSU RC Hook symbol for Non-GKI Kernels'
runs:
  using: "composite"
  steps:
    - name: 🪝 Fix SukiSU RC Hook Symbol
      shell: bash
      run: |
        set -euo pipefail
        # 优先使用源码根目录，移除硬编码 device_kernel
        KERNEL_ROOT="${GITHUB_WORKSPACE}"
        cd "${KERNEL_ROOT}"

        echo "[1/3] Wrap ksu_init_rc_hook with CONFIG_KERNELSU_RC_HOOK"
        RW_FILE="fs/read_write.c"
        if [ -f "${RW_FILE}" ] && grep -q "ksu_init_rc_hook" "${RW_FILE}"; then
          # 正确 sed 包裹整行：行前插ifdef，行后插endif
          sed -i '/ksu_init_rc_hook/ {
            i\#ifdef CONFIG_KERNELSU_RC_HOOK
            a\#endif
          }' "${RW_FILE}"
          echo "[+] Successfully wrapped ksu_init_rc_hook"
        else
          echo "[!] ksu_init_rc_hook not found, skip patch"
        fi

        echo "[2/3] Check drivers/kernelsu Makefile entry"
        DRV_MAKE="drivers/Makefile"
        TARGET_ENTRY="obj-\$(CONFIG_KSU) += kernelsu/"
        # 仅当不存在时才添加，杜绝重复行
        if [ -f "${DRV_MAKE}" ] && ! grep -xF "${TARGET_ENTRY}" "${DRV_MAKE}"; then
          echo "${TARGET_ENTRY}" >> "${DRV_MAKE}"
          echo "[+] Added kernelsu entry to drivers/Makefile"
        else
          echo "[!] Entry exists or file missing, skip"
        fi

        echo "[3/3] Patch completed"
