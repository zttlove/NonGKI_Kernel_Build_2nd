name: Update SUSFS files from patch

on:
  workflow_dispatch:

env:
  KERNEL_REPO: "zttlove/android_kernel_xiaomi_sm8350_miyume"
  KERNEL_BRANCH: "fix-root2"
  PATCH_PATH: "Patches/Patch/susfs_patch_to_5.4.patch"

jobs:
  update:
    runs-on: ubuntu-22.04
    steps:

      # ============================================================
      # 0. 检查 KERNEL_PAT 是否配置
      # ============================================================
      - name: Check KERNEL_PAT secret
        run: |
          if [ -z "${{ secrets.KERNEL_PAT }}" ]; then
            echo "::error::KERNEL_PAT secret 未配置！"
            echo "请到 https://github.com/zttlove/NonGKI_Kernel_Build_2nd/settings/secrets/actions"
            echo "新建一个名为 KERNEL_PAT 的 secret，值为 GitHub Personal Access Token（勾 repo 权限）"
            exit 1
          fi
          echo "✅ KERNEL_PAT 已配置（长度: ${#KERNEL_PAT}）"
        env:
          KERNEL_PAT: ${{ secrets.KERNEL_PAT }}

      # ============================================================
      # 1. Checkout 内核源码（用 PAT，才有 push 权限）
      # ============================================================
      - name: Checkout Kernel Source
        uses: actions/checkout@v4
        with:
          repository: ${{ env.KERNEL_REPO }}
          ref: ${{ env.KERNEL_BRANCH }}
          path: kernel
          fetch-depth: 1
          token: ${{ secrets.KERNEL_PAT }}

      # ============================================================
      # 2. Checkout workflow repo（拿补丁文件）
      # ============================================================
      - name: Checkout Workflow Repo
        uses: actions/checkout@v4
        with:
          path: workflow_repo
          fetch-depth: 1

      # ============================================================
      # 3. 定位并验证补丁文件
      # ============================================================
      - name: Locate and verify patch
        id: locate
        run: |
          set -e
          PATCH="${{ github.workspace }}/workflow_repo/${{ env.PATCH_PATH }}"
          echo "检查补丁: $PATCH"
          if [ ! -f "$PATCH" ]; then
            echo "::error::补丁文件不存在"
            echo "=== workflow_repo 里所有 .patch ==="
            find "${{ github.workspace }}/workflow_repo" -name "*.patch" || true
            exit 1
          fi
          echo "=== 补丁行数 ==="
          wc -l "$PATCH"
          echo "=== 补丁包含的 diff 段 ==="
          grep "^diff --git" "$PATCH" || true
          echo "=== 补丁最后 5 行 ==="
          tail -5 "$PATCH"
          echo "patch_file=$PATCH" >> $GITHUB_OUTPUT

      # ============================================================
      # 4. 删除旧文件 + 用补丁重新生成三个文件
      # ============================================================
      - name: Extract and overwrite files
        working-directory: kernel
        run: |
          set -e
          PATCH="${{ steps.locate.outputs.patch_file }}"

          echo "=== 删除三个新文件 ==="
          git rm -f --ignore-unmatch \
            fs/susfs.c include/linux/susfs.h include/linux/susfs_def.h || true
          rm -f fs/susfs.c include/linux/susfs.h include/linux/susfs_def.h

          echo "=== git apply 三个新文件 ==="
          git apply \
            --include='fs/susfs.c' \
            --include='include/linux/susfs.h' \
            --include='include/linux/susfs_def.h' \
            "$PATCH"

          echo "=== 用 awk 从补丁中提取 fs/namespace.c 段 ==="
          awk '
            /^diff --git / {
              if (in_ns) exit
              in_ns = ($0 ~ /a\/fs\/namespace\.c /)
            }
            in_ns { print }
          ' "$PATCH" > /tmp/namespace.patch

          echo "提取行数:"
          wc -l /tmp/namespace.patch

          if [ ! -s /tmp/namespace.patch ]; then
            echo "::error::未能从补丁中提取 fs/namespace.c 段"
            exit 1
          fi

          echo "=== 用 patch --fuzz=3 应用 fs/namespace.c（允许部分 hunk 已存在） ==="
          patch -p1 --fuzz=3 --no-backup-if-mismatch < /tmp/namespace.patch || true
          rm -f fs/namespace.c.rej

          echo ""
          echo "=== 验证 fs/namespace.c 里两个函数定义 ==="
          grep -n "static struct mount \*susfs_alloc_unshare_ksu_vfsmnt\|static struct mount \*susfs_alloc_non_unshare_ksu_vfsmnt" fs/namespace.c || {
            echo "::error::namespace.c 里缺 susfs_alloc_* 函数定义"
            exit 1
          }
      # ============================================================
      # 5. 提交并推送到内核仓库
      # ============================================================
      - name: Commit and push
        working-directory: kernel
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add fs/susfs.c include/linux/susfs.h include/linux/susfs_def.h fs/namespace.c

          if git diff --cached --quiet; then
            echo "无变化，跳过提交"
            exit 0
          fi

          git commit -m "Update SUSFS files from patch"
          git push origin HEAD:${{ env.KERNEL_BRANCH }}
          echo "✅ 已推送到 ${{ env.KERNEL_REPO }}"
