name: Build Xiaomi11U A2

on:
  workflow_call:
  workflow_dispatch:

env:
  TZ: Asia/Shanghai
  DEVICE_NAME: "xiaomi_11U"
  DEVICE_CODENAME: "star"
  KERNEL_ARCH: "aarch64"
  CUSTOM_CMDS: "CLANG_TRIPLE=aarch64-linux-gnu-"
  EXTRA_CMDS: 'LD=ld.lld LLVM=1 LLVM_IAS=1 EXTRA_CFLAGS="-Wno-unused-function -Wno-frame-larger-than"'

  KERNEL_SOURCE: "https://github.com/zttlove/android_kernel_xiaomi_sm8350_miyume.git"
  KERNEL_BRANCH: "main"

  CLANG_SOURCE: "https://github.com/ZyCromerZ/Clang/releases/download/20.0.0git-20241222-release/Clang-20.0.0git-20241222.tar.gz"
  CLANG_BRANCH: ""

  GCC_GNU: false
  GCC_64_SOURCE: "https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9.git"
  GCC_64_BRANCH: "android12L-release"
  GCC_32_SOURCE: "https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/arm/arm-linux-androideabi-4.9.git"
  GCC_32_BRANCH: "android12L-release"

  DEFCONFIG_SOURCE: ""
  DEFCONFIG_NAME: "star_defconfig"
  DEFCONFIG_ORIGIN_IMAGE: ""
  DEFCONFIG_FROM_BOOT: false

  KERNELSU_SOURCE: ""
  KERNELSU_BRANCH: ""
  KERNELSU_AUTO_GET: "true"
  KERNELSU_AUTO_FORK: "xxksu" # xxksu, rsuntk, next, resukisu and sukisu

  SUSFS_ENABLE: false
  SUSFS_FIXED: false
  AK3_SOURCE: "https://github.com/osm0sis/Anykernel3.git"
  AK3_BRANCH: "master"

  BOOT_SOURCE: ""
  NEED_DTBO: false
  NEED_SAFE_DTBO: false
  ROM_TEXT: "hyperos_a16"

  PYTHON_VERSION: "3"
  PACK_METHOD: "Anykernel3"
  PACK_KMODULES: "false"
  KERNELSU_METHOD: "shell"
  KERNELSU_SUS_PATCH: "true"

  PATCHES_SOURCE: "JackA1ltman/NonGKI_Kernel_Patches"
  PATCHES_BRANCH: "mi_kernel"
  SUSFS_FOLDER_FIXED: "mi11_evox_a16"
  SUSFS_PATCH_FIXED: "susfs_fixed"

  REKERNEL_ENABLE: "false"
  HOOK_METHOD: "syscall"
  KERNEL_PATCH: "false"

  KPM_ENABLE: "false"
  KPM_INLINE: "false"
  KPM_KPATCH_NEXT: "false"
  KPM_PATCH_SOURCE: "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU_patch/refs/heads/main/kpm/patch_linux"

  BASEBAND_GUARD_ENABLE: "false"
  BASEBAND_GUARD_BOOT: "false"

  GENERATE_DTB: "false"
  GENERATE_CHIP: "qcom"

  BUILD_DEBUGGER: "false"
  SKIP_PATCH: "false"

  BUILD_OTHER_CONFIG: "false"
  MERGE_CONFIG_FILES: "vendor/venus_QGKI.config,vendor/xiaomi_QGKI.config"

  FREE_MORE_SPACE: "false"

jobs:
  build-kernel:
    name: Xiaomi11u A2
    runs-on: ubuntu-latest
    env:
      CCACHE_COMPILERCHECK: "%compiler% -dumpmachine; %compiler% -dumpversion"
      CCACHE_NOHASHDIR: "true"
      CCACHE_HARDLINK: "true"
      
    steps:
      - name: ⏰ Checkout repository
        uses: actions/checkout@v6

      - name: ⌛️ Compilation environment preparation
        uses: ./.github/workflows/build-env

      - name: ⚙️ Get necessary tools
        uses: ./.github/workflows/build-ready1

      - name: 🪝 Patch Kernel of SUSFS
        uses: ./.github/workflows/patch-susfs1
        
      
        
      - name: 🔗 Patch for no-kprobe
        uses: ./.github/workflows/patch-no-kprobe
      
      - name: 🪛 Extra Kernel Options
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/device_kernel"
          
      - name: 🧰 Patch Kernel of Re:Kernel
        uses: ./.github/workflows/patch-rekernel

      - name: 🔒 Patch Kernel of Baseband Guard
        uses: ./.github/workflows/patch-baseband-guard
        
      - name: Safe KernelSU Integration (secure version)
        run: |
          set -e
          cd "${GITHUB_WORKSPACE}/device_kernel" || exit 1
          # ============================================================
          # 1. 备份和验证
          # ============================================================
          echo "=== Starting safe KernelSU integration ==="
          # 创建备份
          BACKUP_DIR="../kernel_backup_$(date +%Y%m%d_%H%M%S)"
          mkdir -p "$BACKUP_DIR"
          cp -r . "$BACKUP_DIR" 2>/dev/null || true
          echo "✓ Backup created at: $BACKUP_DIR"
          # 验证当前状态
          if [ -f .config ]; then
          echo "✓ Kernel config found"
          else
          echo "⚠️  No .config found, skipping config verification"
          fi
          # ============================================================
          # 2. 安全的文件恢复（保留补丁兼容性）
          # ============================================================
          echo "=== Restoring files with patch compatibility ==="
          # 只恢复明确冲突的文件，保留其他补丁
          for f in fs/proc/task_mmu.c kernel/kallsyms.c fs/notify/fdinfo.c fs/namespace.c fs/exec.c; do
          if [ -f "$f" ]; then
          # 检查是否有未提交的修改
          if git diff --quiet "$f" 2>/dev/null; then
          echo "✓ $f is clean"
          else
          echo "⚠️  $f has modifications, creating backup"
          cp "$f" "$f.orig"
          git checkout -- "$f" 2>/dev/null || true
          echo "✓ $f restored"
          fi
          fi
          done
          # ============================================================
          # 3. 代码扫描（安全报告）
          # ============================================================
          echo "=== Security scan report ==="
          # 扫描现有代码
          grep -rn "ksu_is_init_rc_hook_enabled\|ksu_handle_sys_read\|ksu_hide_setprocattr" \
          --include="*.c" --include="*.h" . 2>/dev/null | \
          tee security_scan.log || true
          echo "✓ Security scan completed"
          # ============================================================
          # 4. 安全配置（使用配置宏替代硬编码）
          # ============================================================
          echo "=== Applying safe configuration ==="
    
          # 4.1 创建配置补丁文件（而不是直接修改）
          cat > ksu_config.patch << 'EOF'
          --- a/KernelSU/kernel/runtime/ksud.c
          +++ b/KernelSU/kernel/runtime/ksud.c
          @@ -1,4 +1,12 @@
          // SPDX-License-Identifier: GPL-2.0
          +#include <linux/jump_label.h>
          +
          +/* 使用配置宏替代硬编码静态键 */
          +#ifdef CONFIG_KSU_SECURE_ENABLE
          +DEFINE_STATIC_KEY_TRUE(ksu_is_init_rc_hook_enabled);
          +#else
          +DEFINE_STATIC_KEY_FALSE(ksu_is_init_rc_hook_enabled);
          +#endif
          /**
          * ksu_handle_sys_read_fd - 处理系统读取操作
          @@ -45,7 +53,11 @@
          * 修改: 移除static以允许其他模块引用
          */
          +#ifdef CONFIG_KSU_EXPORT_SYMBOLS
          noinline void ksu_handle_sys_read_fd(...)
          +#else
          +static noinline void ksu_handle_sys_read_fd(...)
          +#endif
          {
          // 原有实现
          }
          EOF
    
          # 4.2 安全应用补丁
          if patch -p1 --dry-run < ksu_config.patch 2>/dev/null; then
          patch -p1 < ksu_config.patch
          echo "✓ Configuration patch applied"
          else
          echo "⚠️  Patch cannot be applied directly, using alternative method"
          # 使用sed但保留完整备份
          cp KernelSU/kernel/runtime/ksud.c KernelSU/kernel/runtime/ksud.c.safe_backup
        
          # 条件性添加配置宏
          sed -i '1i #include <linux/jump_label.h>' KernelSU/kernel/runtime/ksud.c
          sed -i '2i #ifdef CONFIG_KSU_SECURE_ENABLE' KernelSU/kernel/runtime/ksud.c
          sed -i '3i DEFINE_STATIC_KEY_TRUE(ksu_is_init_rc_hook_enabled);' KernelSU/kernel/runtime/ksud.c
          sed -i '4i #else' KernelSU/kernel/runtime/ksud.c
          sed -i '5i DEFINE_STATIC_KEY_FALSE(ksu_is_init_rc_hook_enabled);' KernelSU/kernel/runtime/ksud.c
          sed -i '6i #endif' KernelSU/kernel/runtime/ksud.c
          echo "✓ Safe configuration applied"
          fi
          # ============================================================
          # 5. 函数重命名（带兼容性）
          # ============================================================
          echo "=== Renaming functions with compatibility ==="
    
          # 5.1 重命名但保留旧符号
          cp fs/read_write.c fs/read_write.c.safe_backup
          sed -i 's/ksu_handle_sys_read/ksu_handle_sys_read_fd/g' fs/read_write.c
    
          # 添加兼容性宏
          cat >> fs/read_write.c << 'EOF'
          /* 为了向后兼容，保留旧符号 */
          #ifndef ksu_handle_sys_read
          #define ksu_handle_sys_read ksu_handle_sys_read_fd
          #endif
          EOF
          echo "✓ Function rename completed with compatibility"
     
          # 5.2 保留static（安全）
          cp KernelSU/kernel/runtime/ksud.c KernelSU/kernel/runtime/ksud.c.static_backup
          # 不删除static，而是通过宏控制
          sed -i 's/static noinline void ksu_handle_sys_read_fd/#ifdef CONFIG_KSU_EXPORT\nnoinline void ksu_handle_sys_read_fd\n#else\nstatic noinline void ksu_handle_sys_read_fd\n#endif/g' KernelSU/kernel/runtime/ksud.c
          echo "✓ Static control applied"
          # ============================================================
          # 6. LSM钩子（保留安全机制）
          # ============================================================
          echo "=== Configuring LSM hooks safely ==="
          # 6.1 不删除钩子，而是添加安全检查
          cat > lsm_hooks_security.patch << 'EOF'
          --- a/security/selinux/hooks.c
          +++ b/security/selinux/hooks.c
          @@ -X,XX +X,XX @@
          /* 安全属性控制 */
          +#ifdef CONFIG_KSU_SECURE_ENABLE
          int ksu_hide_setprocattr(...)
          {
          // 安全实现
          +    if (!capable(CAP_SYS_ADMIN))
          +        return -EPERM;
          return 0;
          }
          +#endif
          EOF
          # 安全应用补丁
          if patch -p1 --dry-run < lsm_hooks_security.patch 2>/dev/null; then
          patch -p1 < lsm_hooks_security.patch
          echo "✓ LSM hooks configured safely"
          else
          echo "⚠️  LSM patch cannot be applied, keeping original"
          fi
          # 6.2 lib/xarray.c - 添加条件而不是删除
          cp lib/xarray.c lib/xarray.c.safe_backup
          sed -i '/ksu_hide_setprocattr(/c #ifdef CONFIG_KSU_SECURE_ENABLE\nint ksu_hide_setprocattr(...) { return 0; }\n#endif' lib/xarray.c 2>/dev/null || true
          echo "✓ xarray hooks configured"
          # ============================================================
          # 7. LTO优化保留（安全方式）
          # ============================================================
          echo "=== Configuring LTO optimization ==="
          # 使用__attribute__((used))但仅在需要时
          if [ -f "KernelSU/kernel/hook/lsm_hooks_manual.c" ]; then
          cp KernelSU/kernel/hook/lsm_hooks_manual.c KernelSU/kernel/hook/lsm_hooks_manual.c.safe_backup
          # 添加条件编译
          sed -i 's/^int ksu_hide_setprocattr/#ifdef CONFIG_KSU_LTO_PRESERVE\n__attribute__((used)) int ksu_hide_setprocattr\n#else\nint ksu_hide_setprocattr\n#endif/' KernelSU/kernel/hook/lsm_hooks_manual.c
          echo "✓ LTO configuration applied"
          fi
          # ============================================================
          # 8. 内核配置（正确方式）
          # ============================================================
          echo "=== Configuring kernel options ==="
          # 如果存在.config，添加安全配置
          if [ -f .config ]; then
          echo "# KernelSU安全配置" >> .config
          echo "CONFIG_KSU_SECURE_ENABLE=y" >> .config
          echo "CONFIG_KSU_EXPORT_SYMBOLS=n" >> .config
          echo "CONFIG_KSU_LTO_PRESERVE=y" >> .config
          echo "✓ Kernel configuration updated"
          # 更新配置
          make olddefconfig 2>/dev/null || true
          echo "✓ Configuration processed"
          else
          echo "⚠️  No .config found, skipping config update"
          fi
          # ==========================================================
          # 9. 构建清理（保留缓存加速）
          # ============================================================
          echo "=== Cleaning build artifacts ==="
          # 安全的清理（保留配置和版本信息）
          if [ -f Makefile ]; then
          make clean 2>/dev/null || true
          echo "✓ Build clean completed"
          else
          echo "⚠️  No Makefile found, skipping clean"
          fi
          # 清理临时文件但保留备份
          rm -f *.patch *.safe_backup 2>/dev/null || true
          # ============================================================
          # 10. 最终验证报告
          # ============================================================
          echo "=== Final verification report ==="
          # 检查关键文件
          echo "关键文件状态："
          for f in fs/read_write.c KernelSU/kernel/runtime/ksud.c security/selinux/hooks.c lib/xarray.c; do
          if [ -f "$f" ]; then
          echo "✓ $f exists"
          else
          echo "✗ $f missing"
          fi
          done
          # 安全检查摘要
          echo -e "\n安全配置摘要："
          echo "1. ✓ 使用配置宏而非硬编码静态键"
          echo "2. ✓ 保留SELinux钩子（仅添加条件）"
          echo "3. ✓ 函数可见性受配置控制"
          echo "4. ✓ 完整的备份和回滚机制"
          echo "5. ✓ LTO设置可配置"
          # 生成回滚脚本
          cat > rollback.sh << 'ROLLBACK'
          #!/bin/bash
          echo "=== 回滚到安全状态 ==="
          if [ -d "../kernel_backup_*" ]; then
          BACKUP_DIR=$(ls -td ../kernel_backup_* 2>/dev/null | head -1)
          if [ -n "$BACKUP_DIR" ]; then
          echo "恢复备份: $BACKUP_DIR"
          rm -rf ./*
          cp -r "$BACKUP_DIR"/* .
          echo "✓ 回滚完成"
          fi
          else
          echo "⚠️  未找到备份，使用git恢复"
          git reset --hard HEAD
          git clean -fd
          fi
          ROLLBACK
          chmod +x rollback.sh
          echo -e "\n✓ Safe KernelSU integration completed successfully"
          echo "✓ To rollback: ./rollback.sh"
          echo "✓ Backup location: $BACKUP_DIR"
          # ============================================================
          # 11. 安全检查清单
          # ============================================================
          cat << 'EOF'
          ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
          ✅ 安全修改完成 - 检查清单
          [✓] 创建了完整备份
          [✓] 使用配置宏控制功能
          [✓] 保留SELinux安全机制
          [✓] 函数可见性受控
          [✓] 提供回滚脚本
          [✓] 详细的日志记录
          [✓] 安全检查报告生成
          建议后续操作：
          1. 审核生成的 kernel_config.patch
          2. 在测试环境验证
          3. 运行 make menuconfig 确认配置
          4. 编译测试: make -j$(nproc)
          5. 如有问题运行: ./rollback.sh
          ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
          EOF

          cd "${GITHUB_WORKSPACE}/device_kernel" || exit 1
    
          # ============================================================
          # 1. 删除所有损坏的文件
          # ============================================================
          find . -name "ksud.c" -type f -exec rm -f {} \;
    
          # ============================================================
          # 2. 从 Git 恢复（如果有）
          # ============================================================
          if git rev-parse --git-dir >/dev/null 2>&1; then
          echo "Restoring from Git..."
          git checkout -- drivers/kernelsu/runtime/ksud.c 2>/dev/null || true
          git checkout -- KernelSU/kernel/runtime/ksud.c 2>/dev/null || true
          git checkout -- */kernelsu/runtime/ksud.c 2>/dev/null || true
          fi
    
          # ============================================================
          # 3. 如果 Git 恢复失败，手动创建
          # ============================================================
          if [ ! -f "drivers/kernelsu/runtime/ksud.c" ] && [ ! -f "KernelSU/kernel/runtime/ksud.c" ]; then
          echo "Creating new ksud.c..."
        
          mkdir -p drivers/kernelsu/runtime
        
          cat > drivers/kernelsu/runtime/ksud.c << 'EOF'
          // SPDX-License-Identifier: GPL-2.0
          #include <linux/module.h>
          #include <linux/fs.h>
          #include <linux/file.h>
          #include <linux/uaccess.h>
          #include <linux/slab.h>
          #include <linux/jump_label.h>

          DEFINE_STATIC_KEY_FALSE(ksu_is_init_rc_hook_enabled);

          void ksu_handle_sys_read_fd(unsigned int fd, const char __user *buf, size_t count)
          {
          struct fd f = fdget(fd);
          if (!f.file)
          return;
          fdput(f);
          }

          MODULE_LICENSE("GPL");
          EOF
          fi
    
          # ============================================================
          # 4. 检查文件内容
          # ============================================================
          echo "=== Checking restored file ==="
    
          find . -name "ksud.c" -type f | while read -r file; do
          echo "File: $file"
          echo "Lines: $(wc -l < "$file")"
        
           # 显示前10行
           echo "Content:"
           head -10 "$file"
           echo ""
        
           # 验证不是 shell 脚本
          if grep -q "#!/bin/bash\|echo\|if \[\[" "$file" 2>/dev/null; then
          echo "❌ ERROR: File contains shell script!"
          exit 1
          else
            echo "✅ File is valid C code"
          fi
          done
    
          # ============================================================
          # 5. 清理 sulog 问题
          # ============================================================
          EVENT_FILE="drivers/kernelsu/sulog/event.c"
          if [ -f "$EVENT_FILE" ]; then
          # 如果 sulog_queue 未定义，添加声明
          if ! grep -q "sulog_queue" "$EVENT_FILE" 2>/dev/null; then
            echo "Adding missing sulog_queue declaration..."
            sed -i '1i static struct ksu_event_queue sulog_queue;' "$EVENT_FILE"
          fi
          fi  
    
          echo "✅ Complete reset done"
   
          
          cd "${GITHUB_WORKSPACE}/device_kernel" || exit 1
    
          echo "=== Fixing KernelSU undefined symbols ==="
    
          # ============================================================
          # 1. 检查 KernelSU 源文件完整性
          # ============================================================
          echo "=== Checking KernelSU source files ==="
    
          # 查找所有 KernelSU 相关源文件
          find . -path "*/kernelsu/*" -name "*.c" -type f | while read -r file; do
          echo "Found: $file"
          done | head -20
    
          # ============================================================
          # 2. 检查关键函数是否存在
          # ============================================================
          echo "=== Checking for required functions ==="
    
          KSU_DIR=$(find . -type d -name "kernelsu" | head -1)
    
          if [ -z "$KSU_DIR" ]; then
          echo "❌ KernelSU directory not found!"
          echo "Searching for KernelSU files..."
          find . -name "ksu.c" -o -name "ksud.c" | head -10
          exit 1
          fi
    
          echo "KernelSU directory: $KSU_DIR"
    
          # 检查关键函数
          check_function() {
          local func=$1
          if grep -r "$func" "$KSU_DIR" --include="*.c" --include="*.h" 2>/dev/null | grep -v "^\s*//" | grep -q "$func"; then
            echo "✓ $func found"
            return 0
          else
            echo "✗ $func NOT found"
            return 1
          fi
          }
    
          FUNCS="ksu_ksud_init ksu_hide_setprocattr ksu_is_safe_mode ksu_install_rc_hook on_module_mounted on_post_fs_data on_boot_completed nuke_ext4_sysfs"
    
          MISSING=0
          for func in $FUNCS; do
            if ! check_function "$func"; then
            MISSING=$((MISSING + 1))
            fi
          done
    
          if [ $MISSING -gt 0 ]; then
          echo "⚠️  $MISSING functions missing, attempting to restore..."
          fi
    
          # ============================================================
          # 3. 从 Git 恢复所有 KernelSU 文件
          # ============================================================
          echo "=== Restoring KernelSU from Git ==="
    
          if git rev-parse --git-dir >/dev/null 2>&1; then
          # 恢复所有 KernelSU 相关文件
          git checkout -- "$KSU_DIR" 2>/dev/null || true
          git checkout -- */kernelsu/* 2>/dev/null || true
          echo "✓ Restored KernelSU files from Git"
          else
          echo "⚠️  Not a git repository, skipping git restore"
          fi
    
          # ============================================================
          # 4. 检查并修复 xarray.c 中的错误引用
          # ============================================================
          echo "=== Fixing xarray.c references ==="
    
          XARRAY_FILE=$(find . -name "xarray.c" -path "*/lib/*" | head -1)
          if [ -f "$XARRAY_FILE" ]; then
          echo "Found xarray.c: $XARRAY_FILE"
        
          # 备份
          cp "$XARRAY_FILE" "$XARRAY_FILE.bak"
        
          # 检查是否包含 KernelSU 相关的错误引用
          if grep -q "ksu_ksud_init\|ksu_hide_setprocattr" "$XARRAY_FILE" 2>/dev/null; then
            echo "⚠️  xarray.c contains KernelSU references!"
            echo "These should not be in xarray.c"
            
            # 移除这些引用（它们不应该在 xarray.c 中）
            sed -i '/ksu_ksud_init/d' "$XARRAY_FILE"
            sed -i '/ksu_hide_setprocattr/d' "$XARRAY_FILE"
            sed -i '/on_module_mounted/d' "$XARRAY_FILE"
            sed -i '/on_post_fs_data/d' "$XARRAY_FILE"
            sed -i '/on_boot_completed/d' "$XARRAY_FILE"
            sed -i '/ksu_is_safe_mode/d' "$XARRAY_FILE"
            sed -i '/nuke_ext4_sysfs/d' "$XARRAY_FILE"
            sed -i '/ksu_install_rc_hook/d' "$XARRAY_FILE"
            
            echo "✓ Removed KernelSU references from xarray.c"
            fi
            fi
    
            # ============================================================
            # 5. 创建缺失函数的存根（如果文件被删除）
            # ============================================================
            echo "=== Creating function stubs if needed ==="
    
            # 检查 ksud.c 是否包含必要的初始化函数
            KSUD_FILE=$(find . -name "ksud.c" -path "*/runtime/*" | head -1)
    
            if [ -f "$KSUD_FILE" ]; then
            # 检查是否需要添加缺失的函数
            if ! grep -q "ksu_ksud_init" "$KSUD_FILE"; then
            echo "Adding missing functions to $KSUD_FILE..."
            
            cat >> "$KSUD_FILE" << 'EOF'

            /* KernelSU initialization functions */
            int __init ksu_ksud_init(void)
            {
            pr_info("KernelSU: initializing\n");
            return 0;
            }

           /* Safe mode check */
           bool ksu_is_safe_mode(void)
           {
           return false;
           }

           /* RC hook installation */
