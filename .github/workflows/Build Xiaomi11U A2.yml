name: Build Xiaomi11U A2

on:
  workflow_call:
  workflow_dispatch:

env:
  TZ: Asia/Shanghai
  DEVICE_NAME: "xiaomi_11U"
  DEVICE_CODENAME: "star"
  KERNEL_ARCH: "aarch64"
  CUSTOM_CMDS: "CLANG_TRIPLE=aarch64-linux-gnu-"
  EXTRA_CMDS: 'LD=ld.lld LLVM=1 LLVM_IAS=1 EXTRA_CFLAGS="-Wno-unused-function -Wno-frame-larger-than"'

  KERNEL_SOURCE: "https://github.com/zttlove/android_kernel_xiaomi_sm8350_miyume.git"
  KERNEL_BRANCH: "main"

  CLANG_SOURCE: "https://github.com/ZyCromerZ/Clang/releases/download/20.0.0git-20241222-release/Clang-20.0.0git-20241222.tar.gz"
  CLANG_BRANCH: ""

  GCC_GNU: false
  GCC_64_SOURCE: "https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9.git"
  GCC_64_BRANCH: "android12L-release"
  GCC_32_SOURCE: "https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/arm/arm-linux-androideabi-4.9.git"
  GCC_32_BRANCH: "android12L-release"

  DEFCONFIG_SOURCE: ""
  DEFCONFIG_NAME: "star_defconfig"
  DEFCONFIG_ORIGIN_IMAGE: ""
  DEFCONFIG_FROM_BOOT: false

  KERNELSU_SOURCE: ""
  KERNELSU_BRANCH: ""
  KERNELSU_AUTO_GET: "true"
  KERNELSU_AUTO_FORK: "xxksu"

  SUSFS_ENABLE: false
  SUSFS_FIXED: false
  AK3_SOURCE: "https://github.com/osm0sis/Anykernel3.git"
  AK3_BRANCH: "master"

  BOOT_SOURCE: ""
  NEED_DTBO: false
  NEED_SAFE_DTBO: false
  ROM_TEXT: "hyperos_a16"

  PYTHON_VERSION: "3"
  PACK_METHOD: "Anykernel3"
  PACK_KMODULES: "false"
  KERNELSU_METHOD: "shell"
  KERNELSU_SUS_PATCH: "true"

  PATCHES_SOURCE: "JackA1ltman/NonGKI_Kernel_Patches"
  PATCHES_BRANCH: "mi_kernel"
  SUSFS_FOLDER_FIXED: "mi11_evox_a16"
  SUSFS_PATCH_FIXED: "susfs_fixed"

  REKERNEL_ENABLE: "false"
  HOOK_METHOD: "syscall"
  KERNEL_PATCH: "false"

  KPM_ENABLE: "false"
  KPM_INLINE: "false"
  KPM_KPATCH_NEXT: "false"
  KPM_PATCH_SOURCE: "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU_patch/refs/heads/main/kpm/patch_linux"

  BASEBAND_GUARD_ENABLE: "false"
  BASEBAND_GUARD_BOOT: "false"

  GENERATE_DTB: "false"
  GENERATE_CHIP: "qcom"

  BUILD_DEBUGGER: "false"
  SKIP_PATCH: "false"

  BUILD_OTHER_CONFIG: "false"
  MERGE_CONFIG_FILES: "vendor/venus_QGKI.config,vendor/xiaomi_QGKI.config"

  FREE_MORE_SPACE: "false"

jobs:
  build-kernel:
    name: Xiaomi11u A2
    runs-on: ubuntu-latest
    env:
      CCACHE_COMPILERCHECK: "%compiler% -dumpmachine; %compiler% -dumpversion"
      CCACHE_NOHASHDIR: "true"
      CCACHE_HARDLINK: "true"

    steps:
      - name: ⏰ Checkout repository
        uses: actions/checkout@v6

      - name: ⌛️ Compilation environment preparation
        uses: ./.github/workflows/build-env

      - name: ⚙️ Get necessary tools
        uses: ./.github/workflows/build-ready1

      - name: Safe KernelSU Integration (fixed-final)
        run: |
          set -e
          cd "${GITHUB_WORKSPACE}/device_kernel" || exit 1
          echo "=== Starting safe KernelSU integration ==="

          # ── 1. 备份 ──────────────────────────────────────────────
          BACKUP_DIR="../kernel_backup_$(date +%Y%m%d_%H%M%S)"
          mkdir -p "$BACKUP_DIR"
          cp -r . "$BACKUP_DIR" 2>/dev/null || true
          echo "✓ Backup created at: $BACKUP_DIR"

          # ── 2. 生成回滚脚本 ──────────────────────────────────────
          cat > ./rollback.sh <<'RB_EOF'
          #!/bin/bash
          set -e
          if [ -z "$1" ]; then
              echo "usage: ./rollback.sh <backup_dir>"
              exit 1
          fi
          BDIR="$1"
          if [ ! -d "$BDIR" ]; then
              echo "backup dir $BDIR not exist"
              exit 1
          fi
          rm -rf ./*
          cp -r "${BDIR}/"* ./
          echo "rollback done from $BDIR"
          RB_EOF
          chmod +x ./rollback.sh
          echo "✓ Generated rollback.sh"

          # ── 3. 还原被修改的内核源文件 ────────────────────────────
          echo "=== Restoring files ==="
          for f in fs/proc/task_mmu.c kernel/kallsyms.c fs/notify/fdinfo.c fs/namespace.c fs/exec.c; do
            if [ -f "$f" ]; then
              if git diff --quiet "$f" 2>/dev/null; then
                echo "✓ $f is clean"
              else
                cp "$f" "$f.orig"
                git checkout -- "$f" 2>/dev/null || true
                echo "✓ $f restored"
              fi
            fi
          done

          # ── 4. 确定 KernelSU 目录结构 ───────────────────────────
          echo "=== Setting up directory structure ==="
          KSU_DIR=""
          if [ -d "drivers/kernelsu" ]; then
            KSU_DIR="drivers/kernelsu"
          elif [ -d "KernelSU" ]; then
            KSU_DIR="KernelSU"
          elif [ -d "kernel/kernelsu" ]; then
            KSU_DIR="kernel/kernelsu"
          else
            echo "⚠️ KernelSU directory not found, creating drivers/kernelsu"
            mkdir -p drivers/kernelsu/runtime drivers/kernelsu/sulog drivers/kernelsu/infra
            KSU_DIR="drivers/kernelsu"
          fi
          echo "Using KernelSU directory: $KSU_DIR"

          # ── 4.1 创建 event_queue.h (完整版) ────────────────────
          mkdir -p "${KSU_DIR}/infra"
          cat > "${KSU_DIR}/infra/event_queue.h" <<'EVENT_EOF'
          #ifndef _KSU_EVENT_QUEUE_H_
          #define _KSU_EVENT_QUEUE_H_

          #include <linux/types.h>
          #include <linux/spinlock.h>
          #include <linux/mutex.h>
          #include <linux/wait.h>
          #include <linux/list.h>
          #include <linux/ktime.h>

          #define KSU_EVENT_QUEUE_TYPE_DROPPED    0x8000
          #define KSU_EVENT_RECORD_FLAG_INTERNAL  0x01

          struct ksu_event_record_hdr {
              int type;
              unsigned int flags;
              unsigned int len;
              unsigned int seq;
              unsigned long long ts_ns;
              int pid;
              int uid;
          };

          struct ksu_event_queue_dropped_info {
              unsigned int first_seq;
              unsigned int last_seq;
              unsigned int count;
          };

          struct ksu_event_queue {
              spinlock_t lock;
              struct mutex read_lock;
              wait_queue_head_t read_wait;
              struct list_head pending;
              struct list_head inflight;
              int queued;
              int max_queued;
              int max_payload_len;
              bool closed;
              unsigned int next_seq;
              unsigned int seq_counter;
              unsigned int dropped_total;
              unsigned int dropped_pending;
              unsigned int dropped_inflight;
              unsigned int dropped_first_seq;
              unsigned int dropped_last_seq;
              unsigned int dropped_inflight_first_seq;
              unsigned int dropped_inflight_last_seq;
          };

          int ksu_event_queue_init(struct ksu_event_queue *queue, int max_queued, int max_payload_len);
          void ksu_event_queue_destroy(struct ksu_event_queue *queue);
          int ksu_event_queue_push(struct ksu_event_queue *queue, int type, int pid, void *payload, int payload_len, gfp_t gfp);
          void ksu_event_queue_drop(struct ksu_event_queue *queue);
          bool ksu_event_queue_has_pending(struct ksu_event_queue *queue);

          #endif
          EVENT_EOF
          echo "✓ Created full event_queue.h"

          # ── 4.2 创建 ksud.h ─────────────────────────────────────
          mkdir -p "${KSU_DIR}/runtime"
          cat > "${KSU_DIR}/runtime/ksud.h" <<'HEADER_EOF'
          #ifndef _KSU_KSUD_H_
          #define _KSU_KSUD_H_

          #include <linux/fs.h>
          #include <linux/types.h>
          #include <linux/jump_label.h>

          extern bool ksu_boot_completed;
          extern bool ksu_module_mounted;
          extern int ksu_file_sid;
          extern bool ksu_input_hook;
          extern struct static_key_false ksu_is_init_rc_hook_enabled;

          #define KSUD_PATH "/system/bin/ksud"

          void ksu_ksud_init(void);
          bool ksu_is_safe_mode(void);
          void ksu_install_rc_hook(struct file *file);
          void on_module_mounted(void);
          void on_post_fs_data(void);
          void on_boot_completed(void);
          int nuke_ext4_sysfs(const char *mnt);
          int ksu_hide_setprocattr(const char *name, const void *value, size_t size);
          void ksu_handle_sys_read_fd(unsigned int fd, const char __user *buf, size_t count);

          #endif
          HEADER_EOF
          echo "✓ Created ksud.h"

          # ── 4.3 创建 sulog.h ────────────────────────────────────
          mkdir -p "${KSU_DIR}/sulog"
          cat > "${KSU_DIR}/sulog/sulog.h" <<'SULOG_EOF'
          #ifndef _KSU_SULOG_H_
          #define _KSU_SULOG_H_

          #include "../infra/event_queue.h"

          struct sulog_entry {
              int pid;
              int uid;
              char command[64];
              char message[256];
          };

          extern struct ksu_event_queue sulog_queue;

          #endif
          SULOG_EOF
          echo "✓ Created sulog.h"

          # ── 4.4 创建 ksud.c ─────────────────────────────────────
          cat > "${KSU_DIR}/runtime/ksud.c" <<'KSUD_EOF'
          // SPDX-License-Identifier: GPL-2.0
          #include <linux/module.h>
          #include <linux/fs.h>
          #include <linux/file.h>
          #include <linux/uaccess.h>
          #include <linux/slab.h>
          #include <linux/jump_label.h>
          #include <linux/version.h>
          #include "ksud.h"

          MODULE_LICENSE("GPL");

          bool ksu_boot_completed = false;
          bool ksu_module_mounted = false;
          int ksu_file_sid = 0;
          bool ksu_input_hook = false;
          DEFINE_STATIC_KEY_FALSE(ksu_is_init_rc_hook_enabled);

          void ksu_ksud_init(void)
          {
              pr_info("KernelSU: initialized\n");
              ksu_boot_completed = false;
              ksu_module_mounted = false;
              ksu_file_sid = 0;
              ksu_input_hook = false;
          }

          bool ksu_is_safe_mode(void)
          {
              return false;
          }

          void ksu_install_rc_hook(struct file *file)
          {
              if (file)
                  pr_debug("KernelSU: RC hook installed\n");
          }

          void on_module_mounted(void)
          {
              ksu_module_mounted = true;
              pr_debug("KernelSU: module mounted\n");
          }

          void on_post_fs_data(void)
          {
              pr_debug("KernelSU: post fs data\n");
          }

          void on_boot_completed(void)
          {
              ksu_boot_completed = true;
              pr_debug("KernelSU: boot completed\n");
          }

          int nuke_ext4_sysfs(const char *mnt)
          {
              pr_debug("KernelSU: nuking ext4 sysfs\n");
              return 0;
          }

          int ksu_hide_setprocattr(const char *name, const void *value, size_t size)
          {
              return 0;
          }

          void ksu_handle_sys_read_fd(unsigned int fd, const char __user *buf, size_t count)
          {
              struct fd f = fdget(fd);
              if (!f.file)
                  return;
              fdput(f);
          }

          EXPORT_SYMBOL(ksu_boot_completed);
          EXPORT_SYMBOL(ksu_module_mounted);
          EXPORT_SYMBOL(ksu_file_sid);
          EXPORT_SYMBOL(ksu_input_hook);
          EXPORT_SYMBOL(ksu_ksud_init);
          EXPORT_SYMBOL(ksu_is_safe_mode);
          EXPORT_SYMBOL(ksu_install_rc_hook);
          EXPORT_SYMBOL(on_module_mounted);
          EXPORT_SYMBOL(on_post_fs_data);
          EXPORT_SYMBOL(on_boot_completed);
          EXPORT_SYMBOL(nuke_ext4_sysfs);
          EXPORT_SYMBOL(ksu_hide_setprocattr);
          EXPORT_SYMBOL(ksu_handle_sys_read_fd);
          EXPORT_SYMBOL(ksu_is_init_rc_hook_enabled);
          KSUD_EOF
          echo "✓ Created ksud.c"

          # ── 5. 修复内核源码文件 ─────────────────────────────────
          if [ -f "fs/read_write.c" ]; then
            echo "=== Fixing read_write.c ==="
            cp fs/read_write.c fs/read_write.c.safe_backup
            sed -i 's/ksu_handle_sys_read/ksu_handle_sys_read_fd/g' fs/read_write.c
            echo "✓ Fixed read_write.c"
          fi

          if [ -f "${KSU_DIR}/sulog/event.c" ]; then
            echo "=== Fixing event.c ==="
            cp "${KSU_DIR}/sulog/event.c" "${KSU_DIR}/sulog/event.c.bak"
            if ! grep -q "struct ksu_event_queue sulog_queue" "${KSU_DIR}/sulog/event.c"; then
              sed -i '1i #include "sulog.h"' "${KSU_DIR}/sulog/event.c"
              sed -i '2i struct ksu_event_queue sulog_queue;' "${KSU_DIR}/sulog/event.c"
            fi
            echo "✓ Fixed event.c"
          fi

          if [ -f "lib/xarray.c" ]; then
            echo "=== Cleaning xarray.c ==="
            sed -i '/ksu_/d' lib/xarray.c 2>/dev/null || true
            echo "✓ Cleaned xarray.c"
          fi

          # ── 6. 复制 event_queue.h 到所有 infra 目录 ─────────────
          find . -type d -name "infra" | while read -r dir; do
            if [ "$dir" != "${KSU_DIR}/infra" ]; then
              cp "${KSU_DIR}/infra/event_queue.h" "$dir/" 2>/dev/null || true
              echo "✓ Copied event_queue.h to $dir/"
            fi
          done

          # ── 7. 配置与清理 ───────────────────────────────────────
          echo "=== Configuring kernel ==="
          if [ -f .config ]; then
            make olddefconfig 2>/dev/null || true
            echo "✓ Kernel configured"
          fi

          echo "=== Cleaning build ==="
          make clean 2>/dev/null || true
          rm -f *.patch *.safe_backup 2>/dev/null || true

          # ── 8. 验证集成结果 ─────────────────────────────────────
          echo ""
          echo "=== Verification ==="
          for f in "${KSU_DIR}/runtime/ksud.h" "${KSU_DIR}/runtime/ksud.c" "${KSU_DIR}/sulog/sulog.h" "${KSU_DIR}/infra/event_queue.h"; do
            if [ -f "$f" ]; then
              echo "✓ $f exists"
            else
              echo "✗ $f missing"
            fi
          done

          echo ""
          echo "Checking variables:"
          for var in ksu_boot_completed ksu_module_mounted ksu_file_sid ksu_input_hook ksu_is_init_rc_hook_enabled; do
            if grep -q "$var" "${KSU_DIR}/runtime/ksud.c" 2>/dev/null; then
              echo " ✓ $var"
            else
              echo " ✗ $var missing"
            fi
          done

          echo ""
          echo "Checking functions:"
          for func in ksu_ksud_init ksu_is_safe_mode on_boot_completed nuke_ext4_sysfs ksu_handle_sys_read_fd; do
            if grep -q "$func" "${KSU_DIR}/runtime/ksud.c" 2>/dev/null; then
              echo " ✓ $func"
            else
              echo " ✗ $func missing"
            fi
          done

          # ── 9. 完成输出 ─────────────────────────────────────────
          cat << 'EOF'
          ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
          ✅ KernelSU 集成完成

          已创建的文件：
           - runtime/ksud.h      - 头文件
           - runtime/ksud.c      - 核心实现
           - sulog/sulog.h       - 日志头文件
           - infra/event_queue.h - 事件队列(完整版)

          已导出符号：
          ksu_boot_completed
          ksu_module_mounted
          ksu_file_sid
          ksu_input_hook
          ksu_is_init_rc_hook_enabled
          ksu_ksud_init
          ksu_is_safe_mode
          ksu_install_rc_hook
          on_module_mounted
          on_post_fs_data
          on_boot_completed
          nuke_ext4_sysfs
          ksu_hide_setprocattr
          ksu_handle_sys_read_fd

          建议后续操作：
          1. 运行: make -j$(nproc)
          2. 如果编译成功，继续构建
          3. 回滚: ./rollback.sh <备份目录>
          ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
          EOF

          echo "✅ Safe KernelSU integration completed!"
          echo "✓ Backup: $BACKUP_DIR"
          echo "✓ Rollback script: ./rollback.sh"

      - name: 🚀 Build Process
        uses: ./.github/workflows/build-process1

      - name: 📦 Package Anykernel3 Flash Zip
        if: env.PACK_METHOD == 'Anykernel3'
        shell: bash
        run: |
          set -euo pipefail
          echo "============================================="
          echo "📦 Packaging Star Hyper A16 Kernel"
          echo "==========================================="

          TIME=$(TZ=Asia/Shanghai date +"%Y-%m-%d")
          KERNEL_DIR="${GITHUB_WORKSPACE}/device_kernel"
          ZIP_DIR="${KERNEL_DIR}/AnyKernel3_Zip"
          IMG_PATH="${KERNEL_DIR}/out/arch/arm64/boot/Image"

          cd "${KERNEL_DIR}"

          if [[ ! -f "${IMG_PATH}" ]]; then
            echo "::error::❌ Build failed, Image not found at ${IMG_PATH}"
            exit 1
          fi

          rm -rf "${ZIP_DIR}"
          mkdir -p "${ZIP_DIR}"

          if [ ! -d "Anykernel3" ]; then
            git clone --depth=1 -b "${AK3_BRANCH}" "${AK3_SOURCE}" Anykernel3
          fi

          cp -rf Anykernel3/* "${ZIP_DIR}/"
          rm -rf "${ZIP_DIR}/.git"

          curl -fsL https://raw.githubusercontent.com/zttlove/NonGKI_Kernel_Build_2nd/mainline/Patches/anykernel.sh -o "${ZIP_DIR}/anykernel.sh" || true

          sed -i \
            -e 's/^name=.*/name="Star-HyperA16-NonGKI-Kernel"/' \
            -e 's/^do\.devicecheck=.*/do.devicecheck=0/' \
            -e 's/^IS_SLOT_DEVICE=.*/IS_SLOT_DEVICE=1/' \
            -e 's/^BLOCK=.*/BLOCK=boot/' \
            "${ZIP_DIR}/anykernel.sh"

          cp -fv "${IMG_PATH}" "${ZIP_DIR}/"

          if [[ "${PACK_KMODULES}" == "true" ]]; then
            MOD_DIR="${ZIP_DIR}/modules/vendor/lib/modules"
            mkdir -p "${MOD_DIR}"
            if [ -d "out" ]; then
              find out -name "*.ko" -type f -exec cp {} "${MOD_DIR}/" \;
              echo "📦 Packed $(ls ${MOD_DIR} | wc -l) kernel modules."
            fi
          fi

          chmod -R 755 "${ZIP_DIR}/META-INF"
          chmod 755 "${ZIP_DIR}/anykernel.sh"

          cd "${ZIP_DIR}"
          zip -r9 "${GITHUB_WORKSPACE}/${DEVICE_CODENAME}-${ROM_TEXT}-${TIME}-Ak3.zip" *

          echo "PACK_NAME=${DEVICE_CODENAME}-${ROM_TEXT}-${TIME}-Ak3.zip" >> "${GITHUB_ENV}"
          echo "✅ Package created successfully."

      - name: 🚀 Auto Upload To Github Release
        if: env.PACK_METHOD == 'Anykernel3'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: Star-HyperA16-Kernel-${{ github.run_number }}
          name: "Xiaomi 11 Ultra Star HyperOS A16 NonGKI Kernel #${{ github.run_number }}"
          body: |
            ## Xiaomi 11 Ultra Star HyperOS A16 Kernel
            - Adapted for HyperOS A16
            - xxksu Syscall Hook
            - NonGKI Format
            - Clang 20.0.0git
          files: ${{ env.PACK_NAME }}
          draft: false
          prerelease: false
          overwrite_files: true
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
