name: Build Xiaomi11U A2

on:
  workflow_call:
  workflow_dispatch:



env:
  # Device env
  TZ: Asia/Shanghai
  DEVICE_NAME: "xiaomi_11U"
  DEVICE_CODENAME: "star"
  KERNEL_ARCH: "aarch64"
  CUSTOM_CMDS: "CLANG_TRIPLE=aarch64-linux-gnu-"
  EXTRA_CMDS: 'LD=ld.lld LLVM=1 LLVM_IAS=1 EXTRA_CFLAGS="-Wno-unused-function -Wno-frame-larger-than"'

  KERNEL_SOURCE: "https://github.com/zttlove/android_kernel_xiaomi_sm8350-miui.git"
  KERNEL_BRANCH: "hyper-14"

  CLANG_SOURCE: "https://github.com/ZyCromerZ/Clang/releases/download/20.0.0git-20241222-release/Clang-20.0.0git-20241222.tar.gz"
  CLANG_BRANCH: ""

  GCC_GNU: false
  GCC_64_SOURCE: "https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9.git"
  GCC_64_BRANCH: "android12L-release"
  GCC_32_SOURCE: "https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/arm/arm-linux-androideabi-4.9.git"
  GCC_32_BRANCH: "android12L-release"

  DEFCONFIG_SOURCE: ""
  DEFCONFIG_NAME: "vendor/star1_defconfig"
  DEFCONFIG_ORIGIN_IMAGE: ""
  DEFCONFIG_FROM_BOOT: false

  KERNELSU_SOURCE: ""
  KERNELSU_BRANCH: ""

  KERNELSU_AUTO_GET: "true"
  KERNELSU_AUTO_FORK: "xxksu" # xxksu, rsuntk, next, resukisu and sukisu

  SUSFS_ENABLE: true
  SUSFS_FIXED: true
  AK3_SOURCE: "https://github.com/osm0sis/Anykernel3.git"
  AK3_BRANCH: "master"

  BOOT_SOURCE: ""

  NEED_DTBO: false
  NEED_SAFE_DTBO: false

  ROM_TEXT: "hyperos_a16"

  # Other env
  PYTHON_VERSION: "3" # Only 2(Ubuntu 22.04 and Ubuntu 20.04) or 3(Any OS Versions).

  PACK_METHOD: "Anykernel3" # Anykernel3 need SOURCE and BRANCH, MKBOOTIMG needn't it.
  PACK_KMODULES: "false" # if u want pack kernel modules (.ko) into Anykernel3.

  KERNELSU_METHOD: "shell" # shell, manual and only.
  KERNELSU_SUS_PATCH: "false" # if u need manual susfs patch to kernelsu.

  PATCHES_SOURCE: "JackA1ltman/NonGKI_Kernel_Patches" # [your_name]/[your_patch] -> gooder123/NonGKI_Patcher
  PATCHES_BRANCH: "mi_kernel"

  SUSFS_FOLDER_FIXED: "mi11_evox_a16"
  SUSFS_PATCH_FIXED: "susfs_fixed"

  REKERNEL_ENABLE: "false" # if u need Re:Kernel.

  HOOK_METHOD: "syscall" # Manual hook method -> syscall.

  KERNEL_PATCH: "false" # If your kernel version is <= 4.9, you have the option of enabling the patch to patch the kernel_write and kernel_read functions.

  KPM_ENABLE: "false" # Anyone devices.
  KPM_INLINE: "false" # Only use it for SukiSU-Ultra.
  KPM_KPATCH_NEXT: "false" # If u want hook KPatch-Next in build step.
  KPM_PATCH_SOURCE: "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU_patch/refs/heads/main/kpm/patch_linux" # If u want to use KPM Inline, so you need set patch exec file source -> raw.githubusercontent.com/Test/Test/patch.

  BASEBAND_GUARD_ENABLE: "false" # if u want prevent unauthorized writes to critical partitions/device nodes.
  BASEBAND_GUARD_BOOT: "false" # if u want to protect boot partition.

  GENERATE_DTB: "false" # if u kernel need DTB, but cannot auto generate it. (Only Anykernel3).
  GENERATE_CHIP: "qcom" # only supported for qcom and mediatek.

  BUILD_DEBUGGER: "false" # Output build errors.
  SKIP_PATCH: "false" # Ignore errors found in Patch Debugger.

  BUILD_OTHER_CONFIG: "false" # Merge config files.
  MERGE_CONFIG_FILES: "vendor/venus_QGKI.config,vendor/xiaomi_QGKI.config"

  FREE_MORE_SPACE: "false" # if u want get more space, enabled it.

jobs:
  build-kernel:
    name: Xiaomi11u A2
    runs-on: ubuntu-latest
    env:
      CCACHE_COMPILERCHECK: "%compiler% -dumpmachine; %compiler% -dumpversion"
      CCACHE_NOHASHDIR: "true"
      CCACHE_HARDLINK: "true"
    steps:
      - name: ⏰ Checkout repository
        uses: actions/checkout@v6

      - name: ⌛️ Compilation environment preparation
        uses: ./.github/workflows/build-env

      - name: ⚙️ Get necessary tools
        uses: ./.github/workflows/build-ready1

      - name: 🔧 Fix KernelSU Makefile & Kernel Compile Entry
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/device_kernel"
          KSUPATH=kernel/ksu
          mkdir -p ${KSUPATH}
          # KSU根目录Makefile
          cat > ${KSUPATH}/Makefile << 'EOF'
          obj-y += hook/
          obj-y += include/
          obj-y += core/
          obj-y += utils/
          EOF
          HOOKPATH=${KSUPATH}/hook
          mkdir -p ${HOOKPATH}
          # Hook子目录编译条目
          cat > ${HOOKPATH}/Makefile << 'EOF'
          obj-y += kp_ksud.o
          obj-y += setuid_hook.o
          obj-y += branch_link_hook_arm64.o
          obj-y += lsm_hooks_list.o
          obj-y += lsm_hooks_manual.o
          obj-y += lsm_hooks_static.o
          obj-y += lsm_hooks_ultralegacy.o
          obj-y += syscall_table_hook_arm.o
          obj-y += syscall_table_hook_arm64.o
          EOF
          # 关键修复：内核顶层kernel/Makefile加入ksu编译入口，否则KSU完全不编译
          grep -q "obj-y += ksu/" kernel/Makefile || echo "obj-y += ksu/" >> kernel/Makefile

      - name: 🧹 Purge Native Legacy KSU Inline Calls
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/device_kernel"
          # 删除CONFIG_KSU整块条件编译
          #sed -i '/#ifdef CONFIG_KSU/,/#endif/d' fs/read_write.c
          #sed -i '/#ifdef CONFIG_KSU/,/#endif/d' security/selinux/hooks.c
          # 全局删除所有ksu_函数调用行
          #sed -i '/ksu_/d' fs/read_write.c
          #sed -i '/ksu_/d' security/selinux/hooks.c
          # 校验残留，有残留直接终止构建
          RES_READ=$(grep -n "ksu_" fs/read_write.c || true)
          RES_SELINUX=$(grep -n "ksu_" security/selinux/hooks.c || true)
          echo "read_write.c残留：$RES_READ"
          echo "selinux hooks.c残留：$RES_SELINUX"
          if [[ -n "$RES_READ" || -n "$RES_SELINUX" ]]; then
            echo "::error::源码原生存在旧KSU内联调用，终止构建"
            exit 1
          fi
          echo "✅ 源码原生旧KSU调用清理完成"

      - name: 🪝 Patch Kernel of SUSFS
        uses: ./.github/workflows/patch-susfs1

      - name: 🔗 Patch for no-kprobe
        uses: ./.github/workflows/patch-no-kprobe

      - name: 🪛 Extra Kernel Options
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/device_kernel"

      - name: 🧰 Patch Kernel of Re:Kernel
        uses: ./.github/workflows/patch-rekernel

      - name: 🔒 Patch Kernel of Baseband Guard
        uses: ./.github/workflows/patch-baseband-guard

      - name: 🧹 Double Clean KSU Residue After All Patches
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/device_kernel"
          #sed -i '/ksu_/d' fs/read_write.c
          #sed -i '/ksu_/d' security/selinux/hooks.c
          # 最终校验
          if grep -n "ksu_" fs/read_write.c security/selinux/hooks.c; then
            echo "::error::补丁注入旧KSU调用，编译会报undefined symbol"
            exit 1
          fi
          echo "✅ 全部补丁二次清理完成，无ksu内联调用残留"

      - name: 🚀 Build Process
        uses: ./.github/workflows/build-process1

      - name: 📦 Package Anykernel3 Flash Zip
        if: env.PACK_METHOD == 'Anykernel3'
        shell: bash
        run: |
          set -euo pipefail
          echo "============================================="
          echo "📦 开始打包 Star Hyper A16 内核卡刷包"
          echo "==========================================="
          TIME=$(TZ=Asia/Shanghai date +"%Y-%m-%d")
          KERNEL_DIR="${GITHUB_WORKSPACE}/device_kernel"
          TMP_DIR="${KERNEL_DIR}/tmp"
          IMG_PATH="${KERNEL_DIR}/out/arch/arm64/boot/Image"
          cd "${KERNEL_DIR}"
          # 严格校验内核文件存在
          if [[ ! -f "${IMG_PATH}" ]]; then
            echo "::error::❌ 编译失败，未找到 out/arch/arm64/boot/Image 内核文件"
            exit 1
          fi
          IMG_SIZE=$(du -h "${IMG_PATH}" | awk '{print $1}')
          echo "✅ 检测到内核镜像 Image | 大小: ${IMG_SIZE}"
          # 清理重建临时目录
          rm -rf "${TMP_DIR}"
          mkdir -p "${TMP_DIR}"
          # 先下载新版anykernel.sh再修改参数，修复覆盖失效问题
          AK3_DIR="${KERNEL_DIR}/Anykernel3"
          if [[ -d "${AK3_DIR}" ]]; then
            curl -fsL https://raw.githubusercontent.com/zttlove/NonGKI_Kernel_Build_2nd/mainline/Patches/anykernel.sh -o "${AK3_DIR}/anykernel.sh"
            chmod +x "${AK3_DIR}/anykernel.sh"
            sed -i \
              -e 's/^name=.*/name="Star-HyperA16-NonGKI-Kernel"/' \
              -e 's/^do\.devicecheck=.*/do.devicecheck=0/' \
              -e 's/^IS_SLOT_DEVICE=.*/IS_SLOT_DEVICE=1/' \
              -e 's/^BLOCK=.*/BLOCK=boot/' \
              "${AK3_DIR}/anykernel.sh"
          fi
          # 复制内核主镜像
          cp -v "${IMG_PATH}" "${TMP_DIR}/Image"
          # 按需打包内核模块（仅out目录ko）
          if [[ "${PACK_KMODULES}" == "true" ]]; then
            MOD_DIR="${TMP_DIR}/modules/vendor/lib/modules"
            mkdir -p "${MOD_DIR}"
            find ./out -name "*.ko" -type f -print0 | xargs -0 cp -t "${MOD_DIR}/" 2>/dev/null || true
            module_count=$(find "${MOD_DIR}" -name "*.ko" | wc -l)
            echo "📦 打包内核模块: ${module_count} 个"
            [[ ${module_count} -eq 0 ]] && rm -rf "${TMP_DIR}/modules"
          else
            echo "ℹ️ 已关闭模块打包，跳过ko文件"
          fi
          # 合并Anykernel3刷机脚本全部文件
          [[ -d "${AK3_DIR}" ]] && cp -rp "${AK3_DIR}"/* "${TMP_DIR}/"
          # 最高压缩率打包ZIP，捕获压缩失败
          cd "${TMP_DIR}"
          if ! 7za a -tzip -mx9 -mmt=on package.zip ./* >/dev/null; then
            echo "::error::7zip打包失败"
            exit 1
          fi
          cd "${GITHUB_WORKSPACE}"
          # 生成唯一不重复文件名
          FINAL_ZIP="${DEVICE_CODENAME}-${ROM_TEXT}-${TIME}-Ak3.zip"
          cp -fp "${TMP_DIR}/package.zip" "${FINAL_ZIP}"
          echo "PACK_NAME=${FINAL_ZIP}" >> "${GITHUB_ENV}"
          echo "✅ 刷机包打包完成: ${FINAL_ZIP}"
          # 彻底清理临时垃圾文件
          rm -rf "${TMP_DIR}"

      - name: 🚀 Auto Upload To Github Release
        if: env.PACK_METHOD == 'Anykernel3'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: Star-HyperA16-Kernel-${{ github.run_number }}
          name: "Xiaomi 11 Ultra Star HyperOS A16 NonGKI Kernel #${{ github.run_number }}"
          body: |
            ## Xiaomi 11 Ultra Star HyperOS A16 内核刷机包
            - 适配 HyperOS A16 全版本
            - xxksu Syscall Hook 无LSM内联冲突
            - SUSFS 完整文件隐藏支持
            - NonGKI 免解boot补丁
            - Osm0sis Anykernel3 卡刷格式
            - Clang 20.0.0git 编译
          files: ${{ env.PACK_NAME }}
          draft: false
          prerelease: false
          overwrite_files: true
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
