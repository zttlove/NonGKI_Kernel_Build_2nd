name: Build Xiaomi11U A2

on:
  workflow_call:
  workflow_dispatch:

env:
  TZ: Asia/Shanghai
  DEVICE_NAME: "xiaomi_11U"
  DEVICE_CODENAME: "star"
  KERNEL_ARCH: "aarch64"
  CUSTOM_CMDS: "CLANG_TRIPLE=aarch64-linux-gnu-"
  EXTRA_CMDS: 'LD=ld.lld LLVM=1 LLVM_IAS=1 EXTRA_CFLAGS="-Wno-unused-function -Wno-frame-larger-than"'

  KERNEL_SOURCE: "https://github.com/zttlove/android_kernel_xiaomi_sm8350_miyume.git"
  KERNEL_BRANCH: "main"

  CLANG_SOURCE: "https://github.com/ZyCromerZ/Clang/releases/download/20.0.0git-20241222-release/Clang-20.0.0git-20241222.tar.gz"
  CLANG_BRANCH: ""

  GCC_GNU: false
  GCC_64_SOURCE: "https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9.git"
  GCC_64_BRANCH: "android12L-release"
  GCC_32_SOURCE: "https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/arm/arm-linux-androideabi-4.9.git"
  GCC_32_BRANCH: "android12L-release"

  DEFCONFIG_SOURCE: ""
  DEFCONFIG_NAME: "star_defconfig"
  DEFCONFIG_ORIGIN_IMAGE: ""
  DEFCONFIG_FROM_BOOT: false

  KERNELSU_SOURCE: ""
  KERNELSU_BRANCH: ""
  KERNELSU_AUTO_GET: "true"
  KERNELSU_AUTO_FORK: "xxksu" # xxksu, rsuntk, next, resukisu and sukisu

  SUSFS_ENABLE: false
  SUSFS_FIXED: false
  AK3_SOURCE: "https://github.com/osm0sis/Anykernel3.git"
  AK3_BRANCH: "master"

  BOOT_SOURCE: ""
  NEED_DTBO: false
  NEED_SAFE_DTBO: false
  ROM_TEXT: "hyperos_a16"

  PYTHON_VERSION: "3"
  PACK_METHOD: "Anykernel3"
  PACK_KMODULES: "false"
  KERNELSU_METHOD: "shell"
  KERNELSU_SUS_PATCH: "true"

  PATCHES_SOURCE: "JackA1ltman/NonGKI_Kernel_Patches"
  PATCHES_BRANCH: "mi_kernel"
  SUSFS_FOLDER_FIXED: "mi11_evox_a16"
  SUSFS_PATCH_FIXED: "susfs_fixed"

  REKERNEL_ENABLE: "false"
  HOOK_METHOD: "syscall"
  KERNEL_PATCH: "false"

  KPM_ENABLE: "false"
  KPM_INLINE: "false"
  KPM_KPATCH_NEXT: "false"
  KPM_PATCH_SOURCE: "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU_patch/refs/heads/main/kpm/patch_linux"

  BASEBAND_GUARD_ENABLE: "false"
  BASEBAND_GUARD_BOOT: "false"

  GENERATE_DTB: "false"
  GENERATE_CHIP: "qcom"

  BUILD_DEBUGGER: "false"
  SKIP_PATCH: "false"

  BUILD_OTHER_CONFIG: "false"
  MERGE_CONFIG_FILES: "vendor/venus_QGKI.config,vendor/xiaomi_QGKI.config"

  FREE_MORE_SPACE: "false"

jobs:
  build-kernel:
    name: Xiaomi11u A2
    runs-on: ubuntu-latest
    env:
      CCACHE_COMPILERCHECK: "%compiler% -dumpmachine; %compiler% -dumpversion"
      CCACHE_NOHASHDIR: "true"
      CCACHE_HARDLINK: "true"
      
    steps:
      - name: ⏰ Checkout repository
        uses: actions/checkout@v6

      - name: ⌛️ Compilation environment preparation
        uses: ./.github/workflows/build-env

      - name: ⚙️ Get necessary tools
        uses: ./.github/workflows/build-ready1

      - name: 🪝 Patch Kernel of SUSFS
        uses: ./.github/workflows/patch-susfs1
        
      
        
      - name: 🔗 Patch for no-kprobe
        uses: ./.github/workflows/patch-no-kprobe
      
      - name: 🪛 Extra Kernel Options
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/device_kernel"
          
      - name: 🧰 Patch Kernel of Re:Kernel
        uses: ./.github/workflows/patch-rekernel

      - name: 🔒 Patch Kernel of Baseband Guard
        uses: ./.github/workflows/patch-baseband-guard
        
      - name: Fix kallsyms incomplete proc_ops
        run: |
          set -e  # 遇到错误立即退出，避免在错误状态下继续编译
          cd "$GITHUB_WORKSPACE/device_kernel"

          # 注释掉fdinfo.c里的susfs_def.h头文件
          sed -i '16s/^#include <linux\/susfs_def.h>/#\/\/include <linux\/susfs_def.h>/' kernel/kallsyms.c
          # 删除44行 show_mark_fhandle(...)
          sed -i '44d' fs/notify/fdinfo.c
          sed -i '52d' fs/notify/fdinfo.c
          sed -i '17d' fs/notify/fdinfo.c
          sed -i '16s/^#include <linux\/susfs_def.h>/#\/\/include <linux\/susfs_def.h>/' fs/notify/fdinfo.c

          

          # 1. 清理可能冲突的宏定义
          sed -i '/^#if 0$/d' init/main.c || true

          # 2. 注入弱符号桩函数（独立文件方式，更干净）
          if ! grep -q "get_pad_vma" init/main.c; then
          cat >> init/main.c << 'CEOF'

          /* Weak symbols for pad vma */
          unsigned long __weak get_pad_vma(struct vm_area_struct *vma) { return 0; }
          unsigned long __weak get_data_vma(struct vm_area_struct *vma) { return 0; }
          void __weak show_map_pad_vma(struct seq_file *m, struct vm_area_struct *vma) { }
          CEOF
          fi

          # 3. 禁用 pgsize_migration 的 4K 检查
          if [ -f include/linux/pgsize_migration.h ]; then
          sed -i 's/^#if PAGE_SIZE == SZ_4K \&\& defined(CONFIG_64BIT)/#if 0/' include/linux/pgsize_migration.h
          fi

          # 4. 容错校验
          grep -E "get_pad_vma|show_map_pad_vma" init/main.c || echo "::warning::pad vma weak symbols not found"
          if [ -f include/linux/pgsize_migration.h ]; then
          grep -q "^#if 0" include/linux/pgsize_migration.h || echo "::warning::pgsize_migration if0 not set"
          fi

          # 5. 关闭栈保护
          sed -i '/CONFIG_STACKPROTECTOR/d' arch/arm64/configs/star_defconfig || true
          echo "# CONFIG_STACKPROTECTOR is not set" >> arch/arm64/configs/star_defconfig

          # 6. LDFLAGS 追加参数（防重复）
          if ! grep -q -- "--no-warn-asm-clobber-reserved-registers" Makefile; then
          sed -i 's/^LDFLAGS +=/LDFLAGS += --no-warn-asm-clobber-reserved-registers /' Makefile
          fi

          # 使用 -z 参数让 grep 以 null 结尾，配合 xargs -0 处理（虽然这里只是赋值，但养成好习惯）
          # 直接捕获 grep 的结果，利用 grep 的退出码进行判断，比判断字符串是否为空更优雅
          if remain=$(grep -rl '"x18"' --include="*.c" fs/ kernel/ 2>/dev/null); then
          echo "WARNING: still has x18 clobber in files:"
          echo "$remain"
          else
          echo "SUCCESS: All x18 clobbers have been safely removed."
          fi


          
        

          # 9. 替换结构体类型
          sed -i 's/struct proc_ops/struct file_operations/g' kernel/kallsyms.c
          # 替换proc专属成员为旧版file_operations标准成员
          sed -i 's/\.proc_open/.open/g' kernel/kallsyms.c
          sed -i 's/\.proc_read/.read/g' kernel/kallsyms.c
          sed -i 's/\.proc_lseek/.llseek/g' kernel/kallsyms.c
          sed -i 's/\.proc_release/.release/g' kernel/kallsyms.c

          # 10. 复原被补丁修改的核心文件（防止 kallsyms/proc_ops 冲突）
           git checkout fs/exec.c fs/open.c fs/read_write.c fs/namei.c kernel/module.c || true

          # 11. 清理构建缓存（按需保留）
          make clean




          
      - name: 🚀 Build Process
        uses: ./.github/workflows/build-process1
        
      - name: 📦 Package Anykernel3 Flash Zip
        if: env.PACK_METHOD == 'Anykernel3'
        shell: bash
        run: |
          set -euo pipefail
          echo "============================================="
          echo "📦 Packaging Star Hyper A16 Kernel"
          echo "==========================================="
          
          TIME=$(TZ=Asia/Shanghai date +"%Y-%m-%d")
          KERNEL_DIR="${GITHUB_WORKSPACE}/device_kernel"
          ZIP_DIR="${KERNEL_DIR}/AnyKernel3_Zip"
          IMG_PATH="${KERNEL_DIR}/out/arch/arm64/boot/Image"

          cd "${KERNEL_DIR}"

          if [[ ! -f "${IMG_PATH}" ]]; then
            echo "::error::❌ Build failed, Image not found at ${IMG_PATH}"
            exit 1
          fi

          # 1. 准备打包目录
          rm -rf "${ZIP_DIR}"
          mkdir -p "${ZIP_DIR}"

          # 2. 获取 AnyKernel3 (如果未预先下载)
          if [ ! -d "Anykernel3" ]; then
             git clone --depth=1 -b "${AK3_BRANCH}" "${AK3_SOURCE}" Anykernel3
          fi

          # 3. 复制 AK3 基础文件
          cp -rf Anykernel3/* "${ZIP_DIR}/"
          rm -rf "${ZIP_DIR}/.git"

          # 4. 替换并配置 anykernel.sh
          # 下载定制脚本或修改现有脚本
          curl -fsL https://raw.githubusercontent.com/zttlove/NonGKI_Kernel_Build_2nd/mainline/Patches/anykernel.sh -o "${ZIP_DIR}/anykernel.sh" || true
          
          sed -i \
            -e 's/^name=.*/name="Star-HyperA16-NonGKI-Kernel"/' \
            -e 's/^do\.devicecheck=.*/do.devicecheck=0/' \
            -e 's/^IS_SLOT_DEVICE=.*/IS_SLOT_DEVICE=1/' \
            -e 's/^BLOCK=.*/BLOCK=boot/' \
            "${ZIP_DIR}/anykernel.sh"

          # 5. 复制内核镜像
          cp -fv "${IMG_PATH}" "${ZIP_DIR}/"


          # 6. 复制模块 (可选)
          if [[ "${PACK_KMODULES}" == "true" ]]; then
            MOD_DIR="${ZIP_DIR}/modules/vendor/lib/modules"
            mkdir -p "${MOD_DIR}"
            if [ -d "out" ]; then
                find out -name "*.ko" -type f -exec cp {} "${MOD_DIR}/" \;
                echo "📦 Packed $(ls ${MOD_DIR} | wc -l) kernel modules."
            fi
          fi

          # 7. 修复权限
          chmod -R 755 "${ZIP_DIR}/META-INF"
          chmod 755 "${ZIP_DIR}/anykernel.sh"

          # 8. 打包
          cd "${ZIP_DIR}"
          zip -r9 "${GITHUB_WORKSPACE}/${DEVICE_CODENAME}-${ROM_TEXT}-${TIME}-Ak3.zip" *
          
          echo "PACK_NAME=${DEVICE_CODENAME}-${ROM_TEXT}-${TIME}-Ak3.zip" >> "${GITHUB_ENV}"
          echo "✅ Package created successfully."

      - name: 🚀 Auto Upload To Github Release
        if: env.PACK_METHOD == 'Anykernel3'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: Star-HyperA16-Kernel-${{ github.run_number }}
          name: "Xiaomi 11 Ultra Star HyperOS A16 NonGKI Kernel #${{ github.run_number }}"
          body: |
            ## Xiaomi 11 Ultra Star HyperOS A16 Kernel
            - Adapted for HyperOS A16
            - xxksu Syscall Hook
            - NonGKI Format
            - Clang 20.0.0git
          files: ${{ env.PACK_NAME }}
          draft: false
          prerelease: false
          overwrite_files: true
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
