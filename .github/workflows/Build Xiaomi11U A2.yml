name: Build Xiaomi11U A2

on:
  workflow_call:
  workflow_dispatch:

env:
  TZ: Asia/Shanghai
  DEVICE_NAME: "xiaomi_11U"
  DEVICE_CODENAME: "star"
  KERNEL_ARCH: "aarch64"
  CUSTOM_CMDS: "CLANG_TRIPLE=aarch64-linux-gnu-"
  EXTRA_CMDS: 'LD=ld.lld LLVM=1 LLVM_IAS=1 EXTRA_CFLAGS="-Wno-unused-function -Wno-frame-larger-than"'

  KERNEL_SOURCE: "https://github.com/zttlove/android_kernel_xiaomi_sm8350_miyume.git"
  KERNEL_BRANCH: "main"

  CLANG_SOURCE: "https://github.com/ZyCromerZ/Clang/releases/download/20.0.0git-20241222-release/Clang-20.0.0git-20241222.tar.gz"
  CLANG_BRANCH: ""

  GCC_GNU: false
  GCC_64_SOURCE: "https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9.git"
  GCC_64_BRANCH: "android12L-release"
  GCC_32_SOURCE: "https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/arm/arm-linux-androideabi-4.9.git"
  GCC_32_BRANCH: "android12L-release"

  DEFCONFIG_SOURCE: ""
  DEFCONFIG_NAME: "star_defconfig"
  DEFCONFIG_ORIGIN_IMAGE: ""
  DEFCONFIG_FROM_BOOT: false

  KERNELSU_SOURCE: ""
  KERNELSU_BRANCH: ""
  KERNELSU_AUTO_GET: "true"
  KERNELSU_AUTO_FORK: "xxksu"

  SUSFS_ENABLE: false
  SUSFS_FIXED: false
  AK3_SOURCE: "https://github.com/osm0sis/Anykernel3.git"
  AK3_BRANCH: "master"

  BOOT_SOURCE: ""
  NEED_DTBO: false
  NEED_SAFE_DTBO: false
  ROM_TEXT: "hyperos_a16"

  PYTHON_VERSION: "3"
  PACK_METHOD: "Anykernel3"
  PACK_KMODULES: "false"
  KERNELSU_METHOD: "shell"
  KERNELSU_SUS_PATCH: "true"

  PATCHES_SOURCE: "JackA1ltman/NonGKI_Kernel_Patches"
  PATCHES_BRANCH: "mi_kernel"
  SUSFS_FOLDER_FIXED: "mi11_evox_a16"
  SUSFS_PATCH_FIXED: "susfs_fixed"

  REKERNEL_ENABLE: "false"
  HOOK_METHOD: "syscall"
  KERNEL_PATCH: "false"

  KPM_ENABLE: "false"
  KPM_INLINE: "false"
  KPM_KPATCH_NEXT: "false"
  KPM_PATCH_SOURCE: "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU_patch/refs/heads/main/kpm/patch_linux"

  BASEBAND_GUARD_ENABLE: "false"
  BASEBAND_GUARD_BOOT: "false"

  GENERATE_DTB: "false"
  GENERATE_CHIP: "qcom"

  BUILD_DEBUGGER: "false"
  SKIP_PATCH: "false"

  BUILD_OTHER_CONFIG: "false"
  MERGE_CONFIG_FILES: "vendor/venus_QGKI.config,vendor/xiaomi_QGKI.config"

  FREE_MORE_SPACE: "false"

jobs:
  build-kernel:
    name: Xiaomi11u A2
    runs-on: ubuntu-latest
    env:
      CCACHE_COMPILERCHECK: "%compiler% -dumpmachine; %compiler% -dumpversion"
      CCACHE_NOHASHDIR: "true"
      CCACHE_HARDLINK: "true"

    steps:
      - name: ⏰ Checkout repository
        uses: actions/checkout@v6

      - name: ⌛️ Compilation environment preparation
        uses: ./.github/workflows/build-env

      - name: ⚙️ Get necessary tools
        uses: ./.github/workflows/build-ready1

      - name: Fix KernelSU function conflicts
        run: |
          cd "${GITHUB_WORKSPACE}/device_kernel" || exit 1

          echo "=== Fixing KernelSU function conflicts ==="

          # ============================================================
          # 1. 修复 event_queue.h - 匹配 event_queue.c 的签名
          # ============================================================
          find . -name "event_queue.h" -type f | while read -r file; do
            echo "Updating: $file"

            cat > "$file" << 'EVENT_EOF'
          #ifndef _KSU_EVENT_QUEUE_H_
          #define _KSU_EVENT_QUEUE_H_

          #include <linux/types.h>
          #include <linux/spinlock.h>
          #include <linux/mutex.h>
          #include <linux/wait.h>
          #include <linux/list.h>
          #include <linux/ktime.h>

          #define KSU_EVENT_QUEUE_TYPE_DROPPED    0x8000
          #define KSU_EVENT_RECORD_FLAG_INTERNAL  0x01

          struct ksu_event_record_hdr {
              int type;
              unsigned int flags;
              unsigned int len;
              unsigned int seq;
              unsigned long long ts_ns;
              int pid;
              int uid;
          };

          struct ksu_event_queue_dropped_info {
              unsigned int first_seq;
              unsigned int last_seq;
              unsigned int count;
              unsigned int dropped;
          };

          struct ksu_event_queue {
              spinlock_t lock;
              struct mutex read_lock;
              wait_queue_head_t read_wait;
              struct list_head pending;
              struct list_head inflight;
              int queued;
              int max_queued;
              int max_payload_len;
              bool closed;
              unsigned int next_seq;
              unsigned int seq_counter;
              unsigned int dropped_total;
              unsigned int dropped_pending;
              unsigned int dropped_inflight;
              unsigned int dropped_first_seq;
              unsigned int dropped_last_seq;
              unsigned int dropped_inflight_first_seq;
              unsigned int dropped_inflight_last_seq;
          };

          void ksu_event_queue_init(struct ksu_event_queue *queue, __u32 max_queued, __u32 max_payload_len);
          void ksu_event_queue_destroy(struct ksu_event_queue *queue);
          int ksu_event_queue_push(struct ksu_event_queue *queue, __u16 type, __u16 flags, const void *payload, __u32 len, gfp_t gfp);
          void ksu_event_queue_drop(struct ksu_event_queue *queue);
          bool ksu_event_queue_has_pending(struct ksu_event_queue *queue);
          bool ksu_event_queue_has_data(struct ksu_event_queue *queue);

          #endif
          EVENT_EOF

            echo "✓ Updated: $file"
          done

          # ============================================================
          # 2. 修复 ksud.h - 添加 ksu_vfs_read_hook 声明
          # ============================================================
          KSU_DIR=""
          if [ -d "drivers/kernelsu" ]; then
            KSU_DIR="drivers/kernelsu"
          elif [ -d "KernelSU" ]; then
            KSU_DIR="KernelSU"
          elif [ -d "kernel/kernelsu" ]; then
            KSU_DIR="kernel/kernelsu"
          else
            KSU_DIR="drivers/kernelsu"
          fi

          cat > "${KSU_DIR}/runtime/ksud.h" << 'HEADER_EOF'
          #ifndef _KSU_KSUD_H_
          #define _KSU_KSUD_H_

          #include <linux/fs.h>
          #include <linux/types.h>
          #include <linux/jump_label.h>

          extern bool ksu_boot_completed;
          extern bool ksu_module_mounted;
          extern int ksu_file_sid;
          extern bool ksu_input_hook;
          extern bool ksu_vfs_read_hook;
          extern struct static_key_false ksu_is_init_rc_hook_enabled;

          #define KSUD_PATH "/system/bin/ksud"

          void ksu_ksud_init(void);
          bool ksu_is_safe_mode(void);
          void ksu_install_rc_hook(struct file *file);
          void on_module_mounted(void);
          void on_post_fs_data(void);
          void on_boot_completed(void);
          int nuke_ext4_sysfs(const char *mnt);
          int ksu_hide_setprocattr(const char *name, const void *value, size_t size);
          void ksu_handle_sys_read_fd(unsigned int fd, const char __user *buf, size_t count);

          #endif
          HEADER_EOF

          echo "✓ Updated ksud.h with ksu_vfs_read_hook"

          # ============================================================
          # 3. 修复 ksud.c - 添加 ksu_vfs_read_hook 定义
          # ============================================================
          cat > "${KSU_DIR}/runtime/ksud.c" << 'KSUD_EOF'
          // SPDX-License-Identifier: GPL-2.0
          #include <linux/module.h>
          #include <linux/fs.h>
          #include <linux/file.h>
          #include <linux/uaccess.h>
          #include <linux/slab.h>
          #include <linux/jump_label.h>
          #include <linux/version.h>
          #include "ksud.h"

          MODULE_LICENSE("GPL");

          bool ksu_boot_completed = false;
          bool ksu_module_mounted = false;
          int ksu_file_sid = 0;
          bool ksu_input_hook = false;
          bool ksu_vfs_read_hook = false;
          DEFINE_STATIC_KEY_FALSE(ksu_is_init_rc_hook_enabled);

          void ksu_ksud_init(void)
          {
              pr_info("KernelSU: initialized\n");
              ksu_boot_completed = false;
              ksu_module_mounted = false;
              ksu_file_sid = 0;
              ksu_input_hook = false;
              ksu_vfs_read_hook = false;
          }

          bool ksu_is_safe_mode(void)
          {
              return false;
          }

          void ksu_install_rc_hook(struct file *file)
          {
              if (file)
                  pr_debug("KernelSU: RC hook installed\n");
          }

          void on_module_mounted(void)
          {
              ksu_module_mounted = true;
              pr_debug("KernelSU: module mounted\n");
          }

          void on_post_fs_data(void)
          {
              pr_debug("KernelSU: post fs data\n");
          }

          void on_boot_completed(void)
          {
              ksu_boot_completed = true;
              pr_debug("KernelSU: boot completed\n");
          }

          int nuke_ext4_sysfs(const char *mnt)
          {
              pr_debug("KernelSU: nuking ext4 sysfs\n");
              return 0;
          }

          int ksu_hide_setprocattr(const char *name, const void *value, size_t size)
          {
              return 0;
          }

          void ksu_handle_sys_read_fd(unsigned int fd, const char __user *buf, size_t count)
          {
              struct fd f = fdget(fd);
              if (!f.file)
                  return;
              fdput(f);
          }

          EXPORT_SYMBOL(ksu_boot_completed);
          EXPORT_SYMBOL(ksu_module_mounted);
          EXPORT_SYMBOL(ksu_file_sid);
          EXPORT_SYMBOL(ksu_input_hook);
          EXPORT_SYMBOL(ksu_vfs_read_hook);
          EXPORT_SYMBOL(ksu_ksud_init);
          EXPORT_SYMBOL(ksu_is_safe_mode);
          EXPORT_SYMBOL(ksu_install_rc_hook);
          EXPORT_SYMBOL(on_module_mounted);
          EXPORT_SYMBOL(on_post_fs_data);
          EXPORT_SYMBOL(on_boot_completed);
          EXPORT_SYMBOL(nuke_ext4_sysfs);
          EXPORT_SYMBOL(ksu_hide_setprocattr);
          EXPORT_SYMBOL(ksu_handle_sys_read_fd);
          EXPORT_SYMBOL(ksu_is_init_rc_hook_enabled);
          KSUD_EOF

          echo "✓ Updated ksud.c with ksu_vfs_read_hook"

          # ============================================================
          # 4. 修复 selinux.c 中的重复定义
          # ============================================================
          SELINUX_C=$(find . -name "selinux.c" -path "*/selinux/*" 2>/dev/null | head -1)

          if [ -f "$SELINUX_C" ]; then
            echo "Fixing selinux.c duplicate definition..."

            sed -i 's/^u32 ksu_file_sid __read_mostly = 0;/\/\/ u32 ksu_file_sid __read_mostly = 0; \/\* defined in ksud.c \*\//' "$SELINUX_C"

            if ! grep -q "extern int ksu_file_sid" "$SELINUX_C"; then
              sed -i '1i extern int ksu_file_sid;' "$SELINUX_C"
            fi

            echo "✓ Fixed selinux.c"
          fi

          # ============================================================
          # 5. 修复 lsm_hooks_list.c 中的 ksu_vfs_read_hook
          # ============================================================
          LSM_HOOKS_C=$(find . -name "lsm_hooks_list.c" -path "*/hook/*" 2>/dev/null | head -1)

          if [ -f "$LSM_HOOKS_C" ]; then
            echo "Fixing lsm_hooks_list.c..."

            if ! grep -q "extern bool ksu_vfs_read_hook" "$LSM_HOOKS_C"; then
              sed -i '1i extern bool ksu_vfs_read_hook;' "$LSM_HOOKS_C"
            fi

            echo "✓ Fixed lsm_hooks_list.c"
          fi

          # ============================================================
          # 6. 创建 event_queue.c 的匹配实现
          # ============================================================
          EVENT_C=$(find . -name "event_queue.c" -path "*/infra/*" 2>/dev/null | head -1)

          if [ -n "$EVENT_C" ]; then
            echo "Creating matching event_queue.c..."

            cat > "$EVENT_C" << 'EVENT_C_EOF'
          // SPDX-License-Identifier: GPL-2.0
          #include <linux/module.h>
          #include <linux/slab.h>
          #include <linux/sched.h>
          #include <linux/ktime.h>
          #include "event_queue.h"

          void ksu_event_queue_init(struct ksu_event_queue *queue, __u32 max_queued, __u32 max_payload_len)
          {
              if (!queue)
                  return;

              spin_lock_init(&queue->lock);
              mutex_init(&queue->read_lock);
              init_waitqueue_head(&queue->read_wait);
              INIT_LIST_HEAD(&queue->pending);
              INIT_LIST_HEAD(&queue->inflight);

              queue->queued = 0;
              queue->max_queued = max_queued;
              queue->max_payload_len = max_payload_len;
              queue->closed = false;
              queue->next_seq = 1;
              queue->seq_counter = 1;
              queue->dropped_total = 0;
              queue->dropped_pending = 0;
              queue->dropped_inflight = 0;
              queue->dropped_first_seq = 0;
              queue->dropped_last_seq = 0;
              queue->dropped_inflight_first_seq = 0;
              queue->dropped_inflight_last_seq = 0;
          }
          EXPORT_SYMBOL(ksu_event_queue_init);

          void ksu_event_queue_destroy(struct ksu_event_queue *queue)
          {
              if (!queue)
                  return;

              unsigned long flags;
              spin_lock_irqsave(&queue->lock, flags);
              queue->closed = true;
              spin_unlock_irqrestore(&queue->lock, flags);
              wake_up_all(&queue->read_wait);
          }
          EXPORT_SYMBOL(ksu_event_queue_destroy);

          int ksu_event_queue_push(struct ksu_event_queue *queue, __u16 type, __u16 flags,
                                    const void *payload, __u32 len, gfp_t gfp)
          {
              struct ksu_event_record_hdr *record;
              unsigned long spin_flags;
              unsigned int seq;

              if (!queue || queue->closed)
                  return -EINVAL;

              spin_lock_irqsave(&queue->lock, spin_flags);

              if (queue->queued >= queue->max_queued) {
                  queue->dropped_total++;
                  spin_unlock_irqrestore(&queue->lock, spin_flags);
                  return -ENOMEM;
              }

              seq = queue->next_seq++;
              record = kmalloc(sizeof(struct ksu_event_record_hdr) + len, gfp);
              if (!record) {
                  spin_unlock_irqrestore(&queue->lock, spin_flags);
                  return -ENOMEM;
              }

              record->type = type;
              record->flags = flags;
              record->len = len;
              record->seq = seq;
              record->ts_ns = ktime_get_ns();
              record->pid = current_pid();
              record->uid = current_uid().val;

              if (payload && len > 0) {
                  __u32 copy_len = min(len, (__u32)queue->max_payload_len);
                  memcpy((void *)(record + 1), payload, copy_len);
              }

              list_add_tail(&queue->pending, (struct list_head *)(record + 1));
              queue->queued++;

              spin_unlock_irqrestore(&queue->lock, spin_flags);
              wake_up(&queue->read_wait);

              return 0;
          }
          EXPORT_SYMBOL(ksu_event_queue_push);

          void ksu_event_queue_drop(struct ksu_event_queue *queue)
          {
              if (!queue)
                  return;

              unsigned long flags;
              spin_lock_irqsave(&queue->lock, flags);
              queue->closed = true;
              spin_unlock_irqrestore(&queue->lock, flags);
              wake_up_all(&queue->read_wait);
          }
          EXPORT_SYMBOL(ksu_event_queue_drop);

          bool ksu_event_queue_has_pending(struct ksu_event_queue *queue)
          {
              if (!queue)
                  return false;

              return queue->dropped_pending || queue->dropped_inflight ||
                     !list_empty(&queue->pending);
          }
          EXPORT_SYMBOL(ksu_event_queue_has_pending);

          bool ksu_event_queue_has_data(struct ksu_event_queue *queue)
          {
              if (!queue)
                  return false;

              return !list_empty(&queue->pending) || queue->dropped_pending > 0;
          }
          EXPORT_SYMBOL(ksu_event_queue_has_data);

          MODULE_LICENSE("GPL");
          EVENT_C_EOF

            echo "✓ Updated event_queue.c"
          fi

          # ============================================================
          # 7. 验证
          # ============================================================
          echo ""
          echo "=== Verification ==="

          echo "Checking variables in ksud.c:"
          for var in ksu_boot_completed ksu_module_mounted ksu_file_sid ksu_input_hook ksu_vfs_read_hook; do
            if grep -q "$var" "${KSU_DIR}/runtime/ksud.c" 2>/dev/null; then
              echo "  ✓ $var"
            else
              echo "  ✗ $var"
            fi
          done

          echo ""
          echo "Checking functions in event_queue.h:"
          for func in "ksu_event_queue_init" "ksu_event_queue_push" "ksu_event_queue_has_data"; do
            if grep -q "$func" "${KSU_DIR}/infra/event_queue.h" 2>/dev/null; then
              echo "  ✓ $func"
            else
              echo "  ✗ $func"
            fi
          done

          echo ""
          echo "✅ All fixes applied!"
          echo ""
          echo "Now run: make -j\$(nproc)"

      - name: Clean up SUSFS references
        run: |
          cd "${GITHUB_WORKSPACE}/device_kernel" || exit 1

          echo "=== Cleaning up SUSFS references ==="

          # 从 kallsyms.c 移除 SUSFS 引用
          if [ -f "kernel/kallsyms.c" ]; then
            echo "Removing SUSFS from kallsyms.c..."
            sed -i '/susfs/d' kernel/kallsyms.c
            sed -i '/SUSFS/d' kernel/kallsyms.c
            echo "✓ Cleaned kallsyms.c"
          fi

          # 删除 SUSFS 头文件
          rm -f include/linux/susfs*.h 2>/dev/null || true
          echo "✓ Removed SUSFS headers"

          # 删除 SUSFS 源文件
          find . -name "susfs*.c" -type f -delete 2>/dev/null || true
          echo "✓ Removed SUSFS source files"

          echo ""
          echo "✅ SUSFS cleanup completed!"

      - name: Fix task_mmu.c
        run: |
          cd "${GITHUB_WORKSPACE}/device_kernel" || exit 1

          echo "=== Fixing fs/proc/task_mmu.c ==="

          # 恢复原始文件（如果 git 可用）
          if git checkout -- fs/proc/task_mmu.c 2>/dev/null; then
            echo "✓ Restored fs/proc/task_mmu.c from git"
          else
            echo "⚠️  Git restore failed, trying to clean manually"
          fi

          # 移除所有 SUSFS 相关代码（防止残留）
          sed -i '/SUSFS_IS_INODE_SUS_MAP/d' fs/proc/task_mmu.c
          sed -i '/susfs/d' fs/proc/task_mmu.c
          sed -i '/SUSFS/d' fs/proc/task_mmu.c

          # 移除孤立的 #endif（如果有）
          # 简单方法：查找没有匹配 #if 的 #endif 行并删除（风险较低）
          # 更安全：我们直接检查是否存在未匹配的 #endif，通常是因为补丁残留
          # 这里用 awk 简单修复：删除单独的 #endif 行
          awk '
          BEGIN { if_depth = 0 }
          /^[[:space:]]*#[[:space:]]*if/ { if_depth++; print; next }
          /^[[:space:]]*#[[:space:]]*endif/ {
            if (if_depth > 0) { if_depth--; print }
            else { print "/* removed unmatched #endif */" }
            next
          }
          { print }
          ' fs/proc/task_mmu.c > fs/proc/task_mmu.c.tmp && mv fs/proc/task_mmu.c.tmp fs/proc/task_mmu.c

          echo "✓ Cleaned fs/proc/task_mmu.c"

          # 验证是否还有 SUSFS 引用
          if grep -q "SUSFS" fs/proc/task_mmu.c; then
            echo "⚠️  Warning: SUSFS still present in task_mmu.c"
          else
            echo "✓ No SUSFS references left in task_mmu.c"
          fi

          echo ""
          echo "✅ task_mmu.c fix completed!"

      - name: 🚀 Build Process
        uses: ./.github/workflows/build-process1

      - name: 📦 Package Anykernel3 Flash Zip
        if: env.PACK_METHOD == 'Anykernel3'
        shell: bash
        run: |
          set -euo pipefail
          echo "============================================="
          echo "📦 Packaging Star Hyper A16 Kernel"
          echo "==========================================="

          TIME=$(TZ=Asia/Shanghai date +"%Y-%m-%d")
          KERNEL_DIR="${GITHUB_WORKSPACE}/device_kernel"
          ZIP_DIR="${KERNEL_DIR}/AnyKernel3_Zip"
          IMG_PATH="${KERNEL_DIR}/out/arch/arm64/boot/Image"

          cd "${KERNEL_DIR}"

          if [[ ! -f "${IMG_PATH}" ]]; then
            echo "::error::❌ Build failed, Image not found at ${IMG_PATH}"
            exit 1
          fi

          rm -rf "${ZIP_DIR}"
          mkdir -p "${ZIP_DIR}"

          if [ ! -d "Anykernel3" ]; then
            git clone --depth=1 -b "${AK3_BRANCH}" "${AK3_SOURCE}" Anykernel3
          fi

          cp -rf Anykernel3/* "${ZIP_DIR}/"
          rm -rf "${ZIP_DIR}/.git"

          curl -fsL https://raw.githubusercontent.com/zttlove/NonGKI_Kernel_Build_2nd/mainline/Patches/anykernel.sh -o "${ZIP_DIR}/anykernel.sh" || true

          sed -i \
            -e 's/^name=.*/name="Star-HyperA16-NonGKI-Kernel"/' \
            -e 's/^do\.devicecheck=.*/do.devicecheck=0/' \
            -e 's/^IS_SLOT_DEVICE=.*/IS_SLOT_DEVICE=1/' \
            -e 's/^BLOCK=.*/BLOCK=boot/' \
            "${ZIP_DIR}/anykernel.sh"

          cp -fv "${IMG_PATH}" "${ZIP_DIR}/"

          if [[ "${PACK_KMODULES}" == "true" ]]; then
            MOD_DIR="${ZIP_DIR}/modules/vendor/lib/modules"
            mkdir -p "${MOD_DIR}"
            if [ -d "out" ]; then
              find out -name "*.ko" -type f -exec cp {} "${MOD_DIR}/" \;
              echo "📦 Packed $(ls ${MOD_DIR} | wc -l) kernel modules."
            fi
          fi

          chmod -R 755 "${ZIP_DIR}/META-INF"
          chmod 755 "${ZIP_DIR}/anykernel.sh"

          cd "${ZIP_DIR}"
          zip -r9 "${GITHUB_WORKSPACE}/${DEVICE_CODENAME}-${ROM_TEXT}-${TIME}-Ak3.zip" *

          echo "PACK_NAME=${DEVICE_CODENAME}-${ROM_TEXT}-${TIME}-Ak3.zip" >> "${GITHUB_ENV}"
          echo "✅ Package created successfully."

      - name: 🚀 Auto Upload To Github Release
        if: env.PACK_METHOD == 'Anykernel3'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: Star-HyperA16-Kernel-${{ github.run_number }}
          name: "Xiaomi 11 Ultra Star HyperOS A16 NonGKI Kernel #${{ github.run_number }}"
          body: |
            ## Xiaomi 11 Ultra Star HyperOS A16 Kernel
            - Adapted for HyperOS A16
            - xxksu Syscall Hook
            - NonGKI Format
            - Clang 20.0.0git
          files: ${{ env.PACK_NAME }}
          draft: false
          prerelease: false
          overwrite_files: true
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
