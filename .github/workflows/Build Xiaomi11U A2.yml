name: Build Xiaomi11U A2

on:
  workflow_call:
  workflow_dispatch:

env:
  TZ: Asia/Shanghai
  DEVICE_NAME: "xiaomi_11U"
  DEVICE_CODENAME: "star"
  KERNEL_ARCH: "arm64"
  CUSTOM_CMDS: "CLANG_TRIPLE=aarch64-linux-gnu-"
  EXTRA_CMDS: "LD=ld.lld LLVM=1 LLVM_IAS=1"

  KERNEL_SOURCE: "https://github.com/zttlove/android_kernel_xiaomi_sm8350_miyume.git"
  KERNEL_BRANCH: "main"

  CLANG_SOURCE: "https://github.com/llvm/llvm-project/releases/download/llvmorg-18.1.8/clang+llvm-18.1.8-x86_64-linux-gnu-ubuntu-18.04.tar.xz"
  CLANG_BRANCH: ""

  GCC_GNU: false
  GCC_64_SOURCE: "https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9.git"
  GCC_64_BRANCH: "android12L-release"
  GCC_32_SOURCE: "https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/arm/arm-linux-androideabi-4.9.git"
  GCC_32_BRANCH: "android12L-release"

  DEFCONFIG_SOURCE: ""
  DEFCONFIG_NAME: "star_defconfig"
  DEFCONFIG_ORIGIN_IMAGE: ""
  DEFCONFIG_FROM_BOOT: false

  KERNELSU_SOURCE: ""
  KERNELSU_BRANCH: ""
  KERNELSU_AUTO_GET: "true"
  KERNELSU_AUTO_FORK: "xxksu"

  SUSFS_ENABLE: false
  SUSFS_FIXED: false
  AK3_SOURCE: "https://github.com/osm0sis/Anykernel3.git"
  AK3_BRANCH: "master"

  BOOT_SOURCE: ""
  NEED_DTBO: false
  NEED_SAFE_DTBO: false
  ROM_TEXT: "hyperos_a17"

  PYTHON_VERSION: "3"
  PACK_METHOD: "Anykernel3"
  PACK_KMODULES: "false"
  KERNELSU_METHOD: "shell"
  KERNELSU_SUS_PATCH: "false"

  PATCHES_SOURCE: ""
  PATCHES_BRANCH: ""
  SUSFS_FOLDER_FIXED: ""
  SUSFS_PATCH_FIXED: ""

  REKERNEL_ENABLE: "false"
  HOOK_METHOD: "syscall"
  KERNEL_PATCH: "false"

  KPM_ENABLE: "false"
  KPM_INLINE: "false"
  KPM_KPATCH_NEXT: "false"
  KPM_PATCH_SOURCE: "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU_patch/refs/heads/main/kpm/patch_linux"

  BASEBAND_GUARD_ENABLE: "false"
  BASEBAND_GUARD_BOOT: "false"

  GENERATE_DTB: "false"
  GENERATE_CHIP: "qcom"

  BUILD_DEBUGGER: "false"
  SKIP_PATCH: "true"

  BUILD_OTHER_CONFIG: "false"
  MERGE_CONFIG_FILES: ""

  FREE_MORE_SPACE: "false"

jobs:
  build-kernel:
    name: Build Xiaomi 11 Ultra Kernel
    runs-on: ubuntu-latest
    env:
      CCACHE_COMPILERCHECK: "%compiler% -dumpmachine; %compiler% -dumpversion"
      CCACHE_NOHASHDIR: "true"
      CCACHE_HARDLINK: "true"

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🛠 Setup build environment
        uses: ./.github/workflows/build-env

      - name: 🔧 Get necessary tools
        uses: ./.github/workflows/build-ready1
    
      

      - name: 🚀 Build Process
        uses: ./.github/workflows/build-process1

      - name: 📦 Package Anykernel3 Flash Zip
        if: env.PACK_METHOD == 'Anykernel3'
        shell: bash
        run: |
          set -euo pipefail
          echo "============================================="
          echo "📦 Packaging Star Hyper A16 Kernel"
          echo "============================================="

          TIME=$(TZ=Asia/Shanghai date +"%Y%m%d_%H%M")
          KERNEL_DIR="${GITHUB_WORKSPACE}/device_kernel"
          ZIP_DIR="${KERNEL_DIR}/AnyKernel3_Zip"
          IMG_PATH="${KERNEL_DIR}/out/arch/arm64/boot/Image"

          cd "${KERNEL_DIR}"

          if [[ ! -f "${IMG_PATH}" ]]; then
            echo "::error::❌ Build failed, Image not found at ${IMG_PATH}"
            exit 1
          fi

          rm -rf "${ZIP_DIR}"
          mkdir -p "${ZIP_DIR}"

          if [ ! -d "Anykernel3" ]; then
            git clone --depth=1 -b "${AK3_BRANCH}" "${AK3_SOURCE}" Anykernel3
          fi

          cp -rf Anykernel3/* "${ZIP_DIR}/"
          rm -rf "${ZIP_DIR}/.git"

          # Download and replace anykernel.sh if available
          curl -fsL https://raw.githubusercontent.com/zttlove/NonGKI_Kernel_Build_2nd/mainline/Patches/anykernel.sh -o "${ZIP_DIR}/anykernel.sh" || \
            echo "⚠️ Using default anykernel.sh"

          # Update anykernel.sh configuration
          sed -i \
            -e 's/^name=.*/name="Star-HyperA16-NonGKI-Kernel"/' \
            -e 's/^do\.devicecheck=.*/do.devicecheck=0/' \
            -e 's/^IS_SLOT_DEVICE=.*/IS_SLOT_DEVICE=1/' \
            -e 's/^BLOCK=.*/BLOCK=boot/' \
            "${ZIP_DIR}/anykernel.sh" || \
            echo "⚠️ Failed to update anykernel.sh"

          # Copy kernel image
          cp -fv "${IMG_PATH}" "${ZIP_DIR}/Image"

          # Pack modules if enabled
          if [[ "${PACK_KMODULES}" == "true" ]]; then
            MOD_DIR="${ZIP_DIR}/modules/vendor/lib/modules"
            mkdir -p "${MOD_DIR}"
            if [ -d "out" ]; then
              find out -name "*.ko" -type f -exec cp {} "${MOD_DIR}/" \;
              echo "📦 Packed $(ls ${MOD_DIR} | wc -l) kernel modules."
            fi
          fi

          # Set permissions
          chmod -R 755 "${ZIP_DIR}/META-INF"
          chmod 755 "${ZIP_DIR}/anykernel.sh"

          # Create zip package
          cd "${ZIP_DIR}"
          PACKAGE_NAME="${DEVICE_CODENAME}-${ROM_TEXT}-${TIME}-Ak3.zip"
          zip -r9 "${GITHUB_WORKSPACE}/${PACKAGE_NAME}" *

          echo "PACK_NAME=${PACKAGE_NAME}" >> "${GITHUB_ENV}"
          echo "✅ Package created successfully: ${PACKAGE_NAME}"

      - name: 📤 Upload to GitHub Release
        if: env.PACK_METHOD == 'Anykernel3'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: Star-HyperA16-Kernel-${{ github.run_number }}
          name: "Xiaomi 11 Ultra HyperOS A16 Kernel #${{ github.run_number }}"
          body: |
            ## Xiaomi 11 Ultra (star) HyperOS A16 Kernel
            
            ### 📋 Build Info
            - **Device:** Xiaomi 11 Ultra (star)
            - **ROM:** HyperOS A16
            - **KernelSU:** xxksu (Syscall Hook)
            - **Compiler:** Clang 20.0.0git
            - **Format:** NonGKI
            
            ### ✨ Features
            - ✅ NonGKI Kernel
            - ✅ xxksu Syscall Hook
            - ✅ HyperOS A16 Optimized
            - ✅ Clang 20 Compilation
            - ✅ LLVM/LLD Enabled
            
            ### 📦 Installation
            1. Download the ZIP file
            2. Flash in custom recovery (TWRP/OrangeFox)
            3. Reboot and enjoy!
            
            ### ⚠️ Notes
            - For HyperOS A16 only
            - Make sure to backup your current boot image
            - Tested on Xiaomi 11 Ultra (star)
          files: ${{ env.PACK_NAME }}
          draft: false
          prerelease: false
          overwrite: true
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
