name: Build Xiaomi11U A2

on:
  workflow_call:
  workflow_dispatch:

env:
  TZ: Asia/Shanghai
  DEVICE_NAME: "xiaomi_11U"
  DEVICE_CODENAME: "star"
  KERNEL_ARCH: "aarch64"
  CUSTOM_CMDS: "CLANG_TRIPLE=aarch64-linux-gnu-"
  EXTRA_CMDS: 'LD=ld.lld LLVM=1 LLVM_IAS=1 EXTRA_CFLAGS="-Wno-unused-function -Wno-frame-larger-than"'

  KERNEL_SOURCE: "https://github.com/zttlove/android_kernel_xiaomi_sm8350-miui.git"
  KERNEL_BRANCH: "hyper-14"

  CLANG_SOURCE: "https://github.com/ZyCromerZ/Clang/releases/download/20.0.0git-20241222-release/Clang-20.0.0git-20241222.tar.gz"
  CLANG_BRANCH: ""

  GCC_GNU: false
  GCC_64_SOURCE: "https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9.git"
  GCC_64_BRANCH: "android12L-release"
  GCC_32_SOURCE: "https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/arm/arm-linux-androideabi-4.9.git"
  GCC_32_BRANCH: "android12L-release"

  DEFCONFIG_SOURCE: ""
  DEFCONFIG_NAME: "vendor/star1_defconfig"
  DEFCONFIG_ORIGIN_IMAGE: ""
  DEFCONFIG_FROM_BOOT: false

  KERNELSU_SOURCE: ""
  KERNELSU_BRANCH: ""
  KERNELSU_AUTO_GET: "true"
  KERNELSU_AUTO_FORK: "xxksu" # xxksu, rsuntk, next, resukisu and sukisu

  SUSFS_ENABLE: true
  SUSFS_FIXED: true
  AK3_SOURCE: "https://github.com/osm0sis/Anykernel3.git"
  AK3_BRANCH: "master"

  BOOT_SOURCE: ""
  NEED_DTBO: false
  NEED_SAFE_DTBO: false
  ROM_TEXT: "hyperos_a16"

 
  PYTHON_VERSION: "3"
  PACK_METHOD: "Anykernel3"
  PACK_KMODULES: "false"
  KERNELSU_METHOD: "shell"
  KERNELSU_SUS_PATCH: "true"

  PATCHES_SOURCE: "JackA1ltman/NonGKI_Kernel_Patches"
  PATCHES_BRANCH: "mi_kernel"
  SUSFS_FOLDER_FIXED: "mi11_evox_a16"
  SUSFS_PATCH_FIXED: "susfs_fixed"

  REKERNEL_ENABLE: "false"
  HOOK_METHOD: "syscall"
  KERNEL_PATCH: "false"

  KPM_ENABLE: "false"
  KPM_INLINE: "false"
  KPM_KPATCH_NEXT: "false"
  KPM_PATCH_SOURCE: "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU_patch/refs/heads/main/kpm/patch_linux"

  BASEBAND_GUARD_ENABLE: "false"
  BASEBAND_GUARD_BOOT: "false"

  GENERATE_DTB: "false"
  GENERATE_CHIP: "qcom"

  BUILD_DEBUGGER: "false"
  SKIP_PATCH: "false"

  BUILD_OTHER_CONFIG: "false"
  MERGE_CONFIG_FILES: "vendor/venus_QGKI.config,vendor/xiaomi_QGKI.config"

  FREE_MORE_SPACE: "false"

jobs:
  build-kernel:
    name: Xiaomi11u A2
    runs-on: ubuntu-latest
    env:
      CCACHE_COMPILERCHECK: "%compiler% -dumpmachine; %compiler% -dumpversion"
      CCACHE_NOHASHDIR: "true"
      CCACHE_HARDLINK: "true"
    steps:
      - name: ⏰ Checkout repository
        uses: actions/checkout@v6

      - name: ⌛️ Compilation environment preparation
        uses: ./.github/workflows/build-env

      - name: ⚙️ Get necessary tools
        uses: ./.github/workflows/build-ready1

      - name: 🧹 Purge Native Legacy KSU Inline Calls
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/device_kernel"
          sed -i '/#ifdef CONFIG_KSU/,/#endif/d' fs/read_write.c
          sed -i '/#ifdef CONFIG_KSU/,/#endif/d' security/selinux/hooks.c
          # 保留extern函数声明，不删除
          sed -i '/static u32 ksu_sid;/,/security_secctx_to_secid/d' security/selinux/hooks.c
          sed -i '/if (rc == 0 && new_tsec->sid == ksu_sid)/d' security/selinux/hooks.c
          sed -i '/static_branch_unlikely(&ksu_is_init_rc_hook_enabled)/,/ksu_handle_sys_read(fd);/d' fs/read_write.c
          sed -i '/ksu_hide_setprocattr(name, value, size);/d' security/selinux/hooks.c
          RES_READ=$(grep -n "ksu_" fs/read_write.c || true)
          RES_SELINUX=$(grep -n "ksu_" security/selinux/hooks.c || true)
          echo "read_write.c residue: $RES_READ"
          echo "selinux hooks.c residue: $RES_SELINUX"
          if [[ -n "$RES_READ" || -n "$RES_SELINUX" ]]; then
            echo "::error::Native source contains old KSU inline calls, build aborted."
            exit 1
          fi
          echo "✅ Native legacy KSU calls cleaned."

      - name: 🧩 Download full xxksu source
        run: |
         set -euo pipefail
         cd "$GITHUB_WORKSPACE/device_kernel"
         KSUPATH="$PWD/kernel/ksu"
         rm -rf "${KSUPATH}"
         git clone --depth 1 https://github.com/backslashxx/KernelSU.git "${KSUPATH}"
         KSU_MAKEFILE=$(find "${KSUPATH}" -maxdepth 2 -name "Makefile" -type f | head -1)
         if [[ -z "${KSU_MAKEFILE}" ]]; then
         echo "::error::xxksu clone failed, no Makefile found in repository"
         echo "=== Debug: full tree ==="
         find "${KSUPATH}" -maxdepth 3 -type f
         exit 1
         fi
         echo "✅ Found Makefile at: ${KSU_MAKEFILE}"

         REL_PATH="${KSU_MAKEFILE#${KSUPATH}/}"
         KSU_SUBDIR=$(dirname "${REL_PATH}")
         echo "KSU subdirectory containing Makefile: ${KSU_SUBDIR}"
         if [[ "${KSU_SUBDIR}" == "." ]]; then
         MOUNT_LINE="obj-y += ksu/"
         else
         MOUNT_LINE="obj-y += ksu/${KSU_SUBDIR}/"
         fi

         echo "Mount line: ${MOUNT_LINE}"
         grep -qF "${MOUNT_LINE}" kernel/Makefile || echo "${MOUNT_LINE}" >> kernel/Makefile
         echo "✅ xxksu source deployed"
         ls -la "${KSUPATH}/"
     
      - name: 🧹 Remove old core/utils reference in ksu Makefile
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/device_kernel/kernel/ksu"
          sed -i '/obj-$(CONFIG_KSU) += core\//d' Makefile
          sed -i '/obj-$(CONFIG_KSU) += utils\//d' Makefile
          echo "✅ Removed incompatible core/utils compile entry"

      - name: 🪝 Patch Kernel of SUSFS
        uses: ./.github/workflows/patch-susfs1

      - name: 🔗 Patch for no-kprobe
        uses: ./.github/workflows/patch-no-kprobe

      - name: 🪛 Extra Kernel Options
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/device_kernel"

      - name: 🧰 Patch Kernel of Re:Kernel
        uses: ./.github/workflows/patch-rekernel

      - name: 🔒 Patch Kernel of Baseband Guard
        uses: ./.github/workflows/patch-baseband-guard

      - name: 🚀 Build Process
        uses: ./.github/workflows/build-process1

      - name: 📦 Package Anykernel3 Flash Zip
        if: env.PACK_METHOD == 'Anykernel3'
        shell: bash
        run: |
          set -euo pipefail
          echo "============================================="
          echo "📦 Packaging Star Hyper A16 Kernel"
          echo "==========================================="
          TIME=$(TZ=Asia/Shanghai date +"%Y-%m-%d")
          KERNEL_DIR="${GITHUB_WORKSPACE}/device_kernel"
          TMP_DIR="${KERNEL_DIR}/tmp"
          IMG_PATH="${KERNEL_DIR}/out/arch/arm64/boot/Image"
          cd "${KERNEL_DIR}"

          if [[ ! -f "${IMG_PATH}" ]]; then
            echo "::error::❌ Build failed, Image not found at ${IMG_PATH}"
            exit 1
          fi

          IMG_SIZE=$(du -h "${IMG_PATH}" | awk '{print $1}')
          echo "✅ Image detected | Size: ${IMG_SIZE}"

          rm -rf "${TMP_DIR}"
          mkdir -p "${TMP_DIR}"

          AK3_DIR="${KERNEL_DIR}/Anykernel3"
          if [[ -d "${AK3_DIR}" ]]; then
            curl -fsL https://raw.githubusercontent.com/zttlove/NonGKI_Kernel_Build_2nd/mainline/Patches/anykernel.sh -o "${AK3_DIR}/anykernel.sh"
            chmod +x "${AK3_DIR}/anykernel.sh"
            sed -i \
              -e 's/^name=.*/name="Star-HyperA16-NonGKI-Kernel"/' \
              -e 's/^do\.devicecheck=.*/do.devicecheck=0/' \
              -e 's/^IS_SLOT_DEVICE=.*/IS_SLOT_DEVICE=1/' \
              -e 's/^BLOCK=.*/BLOCK=boot/' \
              "${AK3_DIR}/anykernel.sh"
          fi

          cp -v "${IMG_PATH}" "${TMP_DIR}/Image"

          if [[ "${PACK_KMODULES}" == "true" ]]; then
            MOD_DIR="${TMP_DIR}/modules/vendor/lib/modules"
            mkdir -p "${MOD_DIR}"
            find ./out -name "*.ko" -type f -print0 | xargs -0 cp -t "${MOD_DIR}/" 2>/dev/null || true
            module_count=$(find "${MOD_DIR}" -name "*.ko" | wc -l)
            echo "📦 Packing kernel modules: ${module_count}"
            [[ ${module_count} -eq 0 ]] && rm -rf "${TMP_DIR}/modules"
          else
            echo "ℹ️ Module packing disabled."
          fi

          [[ -d "${AK3_DIR}" ]] && cp -rp "${AK3_DIR}"/* "${TMP_DIR}/"

          cd "${TMP_DIR}"
          if ! 7za a -tzip -mx9 -mmt=on package.zip ./* >/dev/null; then
            echo "::error::7zip packaging failed"
            exit 1
          fi

          cd "${GITHUB_WORKSPACE}"
          FINAL_ZIP="${DEVICE_CODENAME}-${ROM_TEXT}-${TIME}-Ak3.zip"
          cp -fp "${TMP_DIR}/package.zip" "${FINAL_ZIP}"
          echo "PACK_NAME=${FINAL_ZIP}" >> "${GITHUB_ENV}"
          echo "✅ Package created: ${FINAL_ZIP}"
          rm -rf "${TMP_DIR}"

      - name: 🚀 Auto Upload To Github Release
        if: env.PACK_METHOD == 'Anykernel3'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: Star-HyperA16-Kernel-${{ github.run_number }}
          name: "Xiaomi 11 Ultra Star HyperOS A16 NonGKI Kernel #${{ github.run_number }}"
          body: |
            ## Xiaomi 11 Ultra Star HyperOS A16 Kernel
            - Adapted for HyperOS A16
            - xxksu Syscall Hook
            - SUSFS Support
            - NonGKI Format
            - Clang 20.0.0git
          files: ${{ env.PACK_NAME }}
          draft: false
          prerelease: false
          overwrite_files: true
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
