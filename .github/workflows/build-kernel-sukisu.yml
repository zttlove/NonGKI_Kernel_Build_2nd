name: Build Kernel with SukiSU-Ultra (Full SUSFS)

on:
  workflow_dispatch:
    inputs:
      reboot_gate:
        description: "启用 sys_reboot supercall fd 自举门控（反探测加固；出现开机循环请关掉）"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

env:
  KERNEL_REPO: zttlove/android_kernel_xiaomi_sm8350-hyperos
  KERNEL_BRANCH: dynamic
  # Pinned vendor source (8-char SHA, from booting kernel: 5.4.302--1-g36982074).
  # Build FAILS if the dynamic branch tip differs -- update ONLY after verifying a new-tip build boots.
  KERNEL_COMMIT_PIN: "36982074"
  DEFCONFIG_NAME: vendor/star_defconfig
  DEVICE_CODENAME: star
  OUTPUT_DIR: out
  CLANG_DIR: ${{ github.workspace }}/toolchains/clang
  KERNEL_DIR: ${{ github.workspace }}/kernel
  # SukiSU-Ultra 内核驱动（builtin 分支）。
  # 分支选型依据（源码验证，2026-11）：
  #   - main / v4.3.0-r2 是 kprobes 运行时 hook 线，不带 CONFIG_KSU_SUSFS*
  #     Kconfig、不带 susfs_is_current_ksu_domain()，其 ksu_handle_*_sucompat
  #     是 pt_regs 签名（供运行时 hook 用）；而本内核树在
  #     #ifdef CONFIG_KSU_SUSFS 内直接调用 filename 指针签名的
  #     ksu_handle_execveat/_sucompat/post_execveat_sucompat/faccessat/
  #     vfs_fstat/stat，启用 KSU_SUSFS 即链接失败。
  #   - builtin 分支正是为手工钩子内核设计：Kconfig 自带完整 KSU_SUSFS 菜单，
  #     CONFIG_KSU_SUSFS=y 时按树期望的签名导出上述全部 ksu_handle_*，
  #     提供 susfs_is_current_ksu_domain()，并在 ksu_main.c 里调用内核侧
  #     fs/susfs.c 的 susfs_init()。
  #   - builtin 无 tag；GitHub 不支持按裸 SHA fetch，故 clone builtin 后强校验
  #     HEAD 是否为验证过的 commit（f9aa2fec，2026-11-13 复验），分支前移即失败，
  #     避免上游漂移破坏下面对 sucompat.c 的行锚定胶水补丁。
  SUKISU_REPO: https://github.com/SukiSU-Ultra/SukiSU-Ultra.git
  SUKISU_BRANCH: builtin
  SUKISU_PIN: f9aa2fec23c3f4a06a935f69dc04cb85b261e7f3

jobs:
  build-kernel:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - name: Checkout Kernel Source
        uses: actions/checkout@v4
        with:
          repository: ${{ env.KERNEL_REPO }}
          ref: ${{ env.KERNEL_BRANCH }}
          path: kernel
          fetch-depth: 1

      - name: Verify Kernel Commit & Clean Workspace
        working-directory: kernel
        run: |
          git reset --hard HEAD
          git clean -fdx
          SHORT_SHA=$(git rev-parse --short=8 HEAD)
          echo "Kernel: $(git log -1 --format='%h %s')"
          if [ "$SHORT_SHA" != "$KERNEL_COMMIT_PIN" ]; then
            echo "::error::vendor kernel source drifted: branch tip ${SHORT_SHA} != pinned ${KERNEL_COMMIT_PIN}"
            echo "The 'dynamic' branch was moved/rewritten. Update KERNEL_COMMIT_PIN in workflow env ONLY after a build from the new tip is verified to boot."
            exit 1
          fi

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential bc bison flex libssl-dev libelf-dev \
            zip unzip python3 perl git curl ccache xxd cpio kmod \
            libtinfo5
          sudo ln -sf /usr/lib/x86_64-linux-gnu/libtinfo.so.6 /usr/lib/x86_64-linux-gnu/libtinfo.so.5 || true

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: .ccache
          key: ccache-sukisu-star-${{ github.run_id }}
          restore-keys: |
            ccache-sukisu-star-

      - name: Cache Clang Toolchain
        uses: actions/cache@v4
        id: clang-cache
        with:
          path: ${{ env.CLANG_DIR }}
          key: clang-17.0.6-x86_64-ubuntu22.04

      - name: Download Clang 17.0.6
        if: steps.clang-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p "${{ env.CLANG_DIR }}"
          curl -fL --retry 3 -o /tmp/clang.tar.xz \
            https://github.com/llvm/llvm-project/releases/download/llvmorg-17.0.6/clang+llvm-17.0.6-x86_64-linux-gnu-ubuntu-22.04.tar.xz
          tar -xf /tmp/clang.tar.xz -C "${{ env.CLANG_DIR }}" --strip-components=1

      - name: Verify Clang
        run: ${{ env.CLANG_DIR }}/bin/clang --version

      - name: Integrate SukiSU-Ultra (full SUSFS)
        working-directory: kernel
        run: |
          set -euo pipefail
          export ARCH=arm64
          export PATH="${{ env.CLANG_DIR }}/bin:$PATH"
          export LLVM=1 LLVM_IAS=1 \
                 CLANG_TRIPLE=aarch64-linux-gnu- \
                 CROSS_COMPILE=aarch64-linux-gnu- \
                 CROSS_COMPILE_COMPAT=arm-linux-gnueabi-

          echo "== 清理内核树 =="
          make mrproper >/dev/null 2>&1 || true

          echo "== 拉取 SukiSU-Ultra (builtin) 并接管 drivers/kernelsu =="
          rm -rf SukiSU_src KernelSU drivers/kernelsu drivers/KernelSU
          git clone --depth=1 -b "${{ env.SUKISU_BRANCH }}" "${{ env.SUKISU_REPO }}" SukiSU_src
          # GitHub 不支持按裸 SHA fetch，clone 后强校验 HEAD == pin；
          # 分支前移说明驱动源码可能变化，需人工复验胶水补丁并更新 SUKISU_PIN
          ACTUAL_SHA="$(git -C SukiSU_src rev-parse HEAD)"
          PIN_SHA="${{ env.SUKISU_PIN }}"
          if [ "$ACTUAL_SHA" != "$PIN_SHA" ]; then
            echo "::error::SukiSU ${{ env.SUKISU_BRANCH }} head ${ACTUAL_SHA:0:12} != pinned ${PIN_SHA:0:12}; branch moved - re-verify the sucompat static-key glue, then update SUKISU_PIN"
            exit 1
          fi
          echo "SukiSU-Ultra: $(git -C SukiSU_src log -1 --format='%h %s')"
          ln -sfn ../SukiSU_src/kernel drivers/kernelsu

          grep -q 'kernelsu' drivers/Makefile || \
            printf '\nobj-$(CONFIG_KSU) += kernelsu/\n' >> drivers/Makefile
          grep -q 'drivers/kernelsu/Kconfig' drivers/Kconfig || \
            sed -i '/^endmenu/i\source "drivers/kernelsu/Kconfig"' drivers/Kconfig

          echo "== 确认内核侧 SUSFS 完整性 =="
          test -f fs/susfs.c || { echo "::error::fs/susfs.c missing - kernel branch lacks SUSFS"; exit 1; }
          test -f include/linux/susfs_def.h || { echo "::error::include/linux/susfs_def.h missing"; exit 1; }
          grep -q 'CONFIG_KSU_SUSFS' fs/exec.c || { echo "::error::fs/exec.c lacks KSU_SUSFS hooks"; exit 1; }
          grep -q 'CONFIG_KSU_SUSFS' fs/open.c || { echo "::error::fs/open.c lacks KSU_SUSFS hooks"; exit 1; }
          grep -q 'CONFIG_KSU_SUSFS' fs/stat.c || { echo "::error::fs/stat.c lacks KSU_SUSFS hooks"; exit 1; }
          echo "-- kernel-side SUSFS hooks verified (no kernel patching needed)"

          echo "== SukiSU builtin 适配：为 5.4 屏蔽 static_call 头 =="
          # static_call 是 5.10+ 内核设施，5.4 无此头文件；builtin 的
          # kernel_includes.h 无条件 include 它而全树无实际调用，5.4 下
          # 直接 fatal error。加版本保护（>=5.10 才 include）
          KIH="SukiSU_src/kernel/kernel_includes.h"
          test -f "$KIH" || { echo "::error::kernel_includes.h not found"; exit 1; }
          if ! grep -B1 '^#include <linux/static_call.h>' "$KIH" | grep -q 'KERNEL_VERSION(5, 10, 0)'; then
            sed -i 's|^#include <linux/static_call.h>$|#if LINUX_VERSION_CODE >= KERNEL_VERSION(5, 10, 0)\n#include <linux/static_call.h>\n#endif|' "$KIH"
          fi
          grep -B1 '^#include <linux/static_call.h>' "$KIH" | grep -q 'KERNEL_VERSION(5, 10, 0)' \
            || { echo "::error::static_call.h version guard patch failed"; exit 1; }
          echo "-- static_call.h guarded for pre-5.10 kernels"

          echo "== SukiSU builtin 适配：ksu_su_compat_enabled 由 bool 改为静态键 =="
          # 树侧 fs/exec.c|open.c|stat.c 以 static_branch_likely/unlikely 消费该开关
          # （extern struct static_key_true），builtin 驱动却定义成 bool；保持同名
          # bool 会被 jump_label 当静态键内存解释，语义错误。改为真正的静态键，
          # 并同步 feature get/set 的读写方式（jump_label 经驱动 Kbuild 的
          # kernel_includes.h 强制包含对全部 TU 可见，ksud.c 同款用法已验证）
          SUC="SukiSU_src/kernel/feature/sucompat.c"
          SUCH="SukiSU_src/kernel/feature/sucompat.h"
          test -f "$SUC" && test -f "$SUCH" || { echo "::error::builtin sucompat sources not found"; exit 1; }
          sed -i 's/^bool ksu_su_compat_enabled __read_mostly = true;$/DEFINE_STATIC_KEY_TRUE(ksu_su_compat_enabled);/' "$SUC"
          sed -i 's/\*value = ksu_su_compat_enabled ? 1 : 0;/*value = static_key_enabled(\&ksu_su_compat_enabled) ? 1 : 0;/' "$SUC"
          sed -i 's|^    ksu_su_compat_enabled = enable;$|    if (enable) static_branch_enable(\&ksu_su_compat_enabled); else static_branch_disable(\&ksu_su_compat_enabled);|' "$SUC"
          sed -i 's/if (!ksu_su_compat_enabled)/if (!static_key_enabled(\&ksu_su_compat_enabled))/' "$SUC"
          sed -i 's/^extern bool ksu_su_compat_enabled;$/extern struct static_key_true ksu_su_compat_enabled;/' "$SUCH"
          grep -q 'DEFINE_STATIC_KEY_TRUE(ksu_su_compat_enabled);' "$SUC" \
            || { echo "::error::ksu_su_compat_enabled static-key conversion failed (definition)"; exit 1; }
          grep -q 'static_branch_enable(&ksu_su_compat_enabled);' "$SUC" \
            && grep -q 'static_branch_disable(&ksu_su_compat_enabled);' "$SUC" \
            || { echo "::error::ksu_su_compat_enabled static-key conversion failed (feature set)"; exit 1; }
          grep -q 'static_key_enabled(&ksu_su_compat_enabled)' "$SUC" \
            || { echo "::error::ksu_su_compat_enabled static-key conversion failed (getter)"; exit 1; }
          grep -q 'extern struct static_key_true ksu_su_compat_enabled;' "$SUCH" \
            || { echo "::error::ksu_su_compat_enabled static-key conversion failed (header)"; exit 1; }
          ! grep -q 'bool ksu_su_compat_enabled __read_mostly' "$SUC" \
            || { echo "::error::stale bool definition remains in sucompat.c"; exit 1; }
          echo "-- ksu_su_compat_enabled now a real static key (matches kernel-side static_branch consumers)"

          echo "== SukiSU builtin 适配：sulog event.c 的 strncpy_from_user_nofault =="
          # builtin Kconfig 无独立 SULOG 开关（sulog/event.c 被 ksu_main.c 无条件
          # #include），defconfig 关不掉；5.4 无该 API（编译期隐式声明、LTO 链接期
          # undefined symbol）。替换为 strncpy_from_user（调用点在 execve 参数采集、
          # 进程上下文，可安全睡眠）并补 <linux/uaccess.h>；\b 只命中裸调用，
          # kernel_compat.h 的 ksu_strncpy_from_user_nofault 包装（event.c 其余两处）不受影响
          EVENT="SukiSU_src/kernel/sulog/event.c"
          test -f "$EVENT" || { echo "::error::sulog/event.c not found"; exit 1; }
          grep -q '#include <linux/uaccess.h>' "$EVENT" || \
            sed -i '1i #include <linux/uaccess.h>' "$EVENT"
          grep -q '#include <linux/uaccess.h>' "$EVENT" \
            || { echo "::error::uaccess.h include insertion failed"; exit 1; }
          sed -i 's/\bstrncpy_from_user_nofault(/strncpy_from_user(/g' "$EVENT"
          grep -q 'strncpy_from_user(arg, (const void __user' "$EVENT" \
            && ! grep -Eq '\bstrncpy_from_user_nofault\(' "$EVENT" \
            || { echo "::error::strncpy_from_user_nofault replacement failed"; exit 1; }
          echo "-- sulog event.c now uses strncpy_from_user (5.4-safe)"

          REBOOT_GATE="${{ inputs.reboot_gate || 'false' }}"
          if [ "$REBOOT_GATE" = "true" ]; then
          echo "== SukiSU builtin 加固：sys_reboot supercall fd 自举通道的调用方门控 =="
          # builtin 的 ksu_handle_sys_reboot（SUSFS 变体，dispatch.c）对
          # magic1=0xDEADBEEF + magic2=0xCAFEBABE 的 reboot() 调用无条件走
          # ksu_supercall_reboot_handler：安装 supercall fd 并返回 0，全程无 uid 门控。
          # 任何三方 app 无需 root 即可：发起该调用 → 观察返回 0（stock 对非
          # CAP_SYS_BOOT 一律 -EPERM）/ 进程 fd 表多出 ksu fd → 100% 确认 KernelSU
          # 存在。这是公开已知的 KSU 无 root 探测手法，即春秋 4.6.3
          # "kernelsu detected（运行时行为特征）" 的实现向量。
          # 修复：仅 root 与已识别管理器（经典 appid 或动态管理器注册，状态持久化，
          # 重启后立即可用）保留自举通道；其余调用方返回 -EINVAL → reboot.c 的
          # orig_flow 走 stock 流程 → 非 CAP_SYS_BOOT 得到与原厂逐字节一致的 -EPERM，
          # 返回值与 fd 副作用双双归零。
          DIS="SukiSU_src/kernel/supercall/dispatch.c"
          test -f "$DIS" || { echo "::error::supercall/dispatch.c not found"; exit 1; }
          python3 - "$DIS" <<'PYREBOOT_EOF'
          import sys
          path = sys.argv[1]
          src = open(path).read()
          old = (
              "    if (magic2 == KSU_INSTALL_MAGIC2)\n"
              "        return ksu_supercall_reboot_handler(arg);\n"
          )
          new = (
              "    if (magic2 == KSU_INSTALL_MAGIC2) {\n"
              "        /* bakasu anti-detect: third-party apps must neither bootstrap a\n"
              "         * supercall fd nor observe a stock-divergent return. Stock\n"
              "         * sys_reboot yields -EPERM to non-CAP_SYS_BOOT callers; a non-zero\n"
              "         * return sends them down orig_flow (kernel/reboot.c) which produces\n"
              "         * exactly that -EPERM. Root and the identified manager keep the\n"
              "         * bootstrap channel. */\n"
              "        if (current_uid().val != 0 &&\n"
              "            !ksu_manager_uid_authorized(current_uid().val))\n"
              "            return -EINVAL;\n"
              "        return ksu_supercall_reboot_handler(arg);\n"
              "    }\n"
          )
          if old in src:
              src = src.replace(old, new, 1)
          elif "bakasu anti-detect" in src:
              pass
          else:
              sys.exit("reboot gate target not found in dispatch.c")
          open(path, "w").write(src)
          PYREBOOT_EOF
          grep -q 'bakasu anti-detect' "$DIS" \
            || { echo "::error::reboot gate patch failed"; exit 1; }
          grep -q 'ksu_manager_uid_authorized(current_uid().val)' "$DIS" \
            || { echo "::error::reboot gate authorization check missing"; exit 1; }
          [ "$(grep -c 'return ksu_supercall_reboot_handler(arg);' "$DIS")" = "1" ] \
            || { echo "::error::reboot gate call-site count unexpected"; exit 1; }
          echo "-- sys_reboot bootstrap channel now gated to root/manager; third-party apps observe stock -EPERM"
          else
            echo "-- reboot gate DISABLED via workflow input; dispatch.c left untouched"
          fi

          echo "== 修复 vendor selinux 预置钩子的 6 个未定义符号（services.c 末尾追加定义，特性关闭语义）=="
          # vendor 树 security/selinux/{selinuxfs.c,hooks.c} 的 BakaSU 预置钩子在
          # #ifdef CONFIG_KSU_SUSFS 内以 extern 引用 selinux_hide 特性符号；SukiSU
          # builtin 的 kernel/feature/selinux_hide.c 被 ksu_main.c 的
          # #if LINUX_VERSION_CODE >= 5.10 门控，5.4 下不参与编译，符号无人提供，
          # LTO 链接期 undefined。直接把“特性关闭”语义的定义追加进
          # security/selinux/ss/services.c：CONFIG_SECURITY_SELINUX=y 下该 TU 必然
          # 参与 vmlinux 链接。类型逐一对齐 BakaSU sync-up selinux_hide.{c,h}：
          # 门控 bool=false、静态键恒关、指针 NULL、钩子空函数 —— 全部消费点自带
          # 判空/静态键守卫，行为即“特性关闭”。
          # 注意不可走独立 stub TU + 顶层 Makefile obj-y：kbuild 只在目录 Makefile
          # 里消费 obj-y，顶层 Makefile 的 obj-y 是死赋值（也不 export），TU 永不
          # 编译，守卫却 grep 同一死赋值照样通过 —— CI 实测 6 符号全部 undefined。
          SVC="security/selinux/ss/services.c"
          test -f "$SVC" || { echo "::error::security/selinux/ss/services.c not found"; exit 1; }
          if ! grep -q 'bool ksu_selinux_hide_enabled' "$SVC"; then
            cat >> "$SVC" <<'KSU_SVCCOMPAT_EOF'

          /* ksu vendor selinux_hide compat：vendor selinuxfs.c/hooks.c 的 BakaSU 预置钩子
           * 引用的符号，SukiSU builtin 在 5.4 下不提供（>=5.10 版本门控）。
           * fake_state 不在此列：其调用点已由 sus_type 回移植的 perl 替换消除，
           * 仅剩 extern 声明（无符号需求）。追加块所需 include：cache.h（__read_mostly）、
           * jump_label.h（DEFINE_STATIC_KEY_FALSE）、mm.h（alloc_page/page_address）；
           * mutex.h 本文件已直接包含，bool/NULL 由既有包含链提供。
           * 特性语义：延迟激活。enabled/running 起步 false（=可启动基线），仅当
           * late_initcall 成功构造 fake_status 后才置 true，使 vendor 的 my_write_access
           * / my_write_context / my_setprocattr / my_sel_open_handle_status 对 app uid
           * （>=10000）走 susfs 过滤路径（uid<10000 与内核进程不受影响），配合 sus_type
           * 回移植实现 /access、/context 探测的 -EINVAL 与 avd 还原。 */
          #include <linux/cache.h>
          #include <linux/jump_label.h>
          #include <linux/mm.h>

          /* enabled 门控 my_sel_open_handle_status（uid>=10000 时以 fake_status 换
           * 真实页）；running 门控 my_write_access / my_write_context / my_setprocattr
           * 的 susfs 还原路径（uid>=10000）。两者起步 false（与可启动基线等价），
           * 仅当 late_initcall 成功构造 fake_status 后才整体置 true —— 任何失败路径
           * 下内核照常启动，绝不卡第一屏。 */
          bool ksu_selinux_hide_enabled __read_mostly = false;
          bool ksu_selinux_hide_running __read_mostly = false;

          /* vendor: extern struct static_key_false ...; 仅门控 selinuxfs.c:262 的
           * 兜底重试（!fake_status 时才触发），置位本身无害 */
          DEFINE_STATIC_KEY_FALSE(fake_status_initialize_key);

          /* BakaSU: __maybe_static struct page *fake_status = NULL（消费点判空） */
          struct page *fake_status = NULL;

          /* BakaSU 定义与 vendor extern 均为 struct mutex *；vendor 消费点判空后
           * lock/unlock 保护 fake_status 读取。此处仅接线指针，初始化函数自身无锁。 */
          struct mutex *ksu_selinux_status_lock = NULL;

          /* 构造 stock 观感的状态页供 my_sel_open_handle_status 服务给 app uid：
           * 真实页在 SukiSU 内核态注入后 sequence 已被抬升、policyload 因页晚于策略
           * 加载分配而恒为 0（doc 注明 load 后"never zero"）——恰好是检测器抓的
           * "status.sequence/policyload" 异常。这里复制真实页后规范化为一次加载、
           * enforcing、无 pending 的 stock 形态。
           * 【锁定纪律】5.4 的 selinux_kernel_status_page() 内部自取 status_lock
           * （ss/status.c:47）。旧版本函数在持锁状态下调用它 → 同一互斥锁自嵌套 →
           * 死锁在 late_initcall → init 未启动内核即挂死 → 卡第一屏（两次 bootloop
           * 根因）。本函数因此完全无锁：late_initcall 上下文无并发；vendor 兜底调用
           * 点（selinuxfs.c:263）也在锁外；最坏并发是双份分配，内容一致后者胜出，
           * 仅泄漏一页，无碍。 */
          void initialize_fake_status(void)
          {
          struct selinux_kernel_status *fake, *real = NULL;
          struct page *new_page;

          if (fake_status)
          return;
          if (!selinux_state.ss)
          return;

          if (selinux_state.ss->status_page)
          real = page_address(selinux_state.ss->status_page);

          new_page = alloc_page(GFP_KERNEL | __GFP_ZERO);
          if (!new_page) {
          pr_err("initialize_fake_status: page alloc failed\n");
          return;
          }
          fake = page_address(new_page);
          fake->version = real ? real->version : SELINUX_KERNEL_STATUS_VERSION;
          /* seqlock 稳定态必须为偶数：stock 在一次策略加载后 sequence=2（每次
           * 事件 +2，奇数=更新中被按协议读取的检测器判可疑） */
          fake->sequence = 2;
          fake->enforcing = 1;
          fake->policyload = 1;
          fake->deny_unknown = real ? real->deny_unknown : 1;

          fake_status = new_page;
          pr_info("initialize_fake_status: fake status page installed\n");
          }

          /* 初始化尾段：先装假页，成功才激活 enabled/running。静态键无条件开——
           * 它只门控兜底重试，假页就绪时 no-op，未就绪时给首次 open 一次重试机会
           * （重试路径已无锁，不会死锁）。 */
          static int __init bakasu_fake_status_init(void)
          {
          static_key_enable(&fake_status_initialize_key.key);
          initialize_fake_status();
          if (fake_status) {
          ksu_selinux_hide_enabled = true;
          ksu_selinux_hide_running = true;
          pr_info("bakasu_fake_status_init: selinux hide active\n");
          } else {
          pr_warn("bakasu_fake_status_init: fake page unavailable, hide off\n");
          }
          return 0;
          }
          late_initcall(bakasu_fake_status_init);
          KSU_SVCCOMPAT_EOF
          fi
          for sym in ksu_selinux_hide_enabled ksu_selinux_hide_running \
                     fake_status_initialize_key fake_status \
                     ksu_selinux_status_lock initialize_fake_status; do
            grep -q "\b$sym\b" "$SVC" || { echo "::error::services.c missing symbol $sym"; exit 1; }
          done
          echo "-- 6 vendor selinux_hide symbols defined in security/selinux/ss/services.c"


      - name: Backport sus_type/avd hiding into vendor 5.4 susfs
        working-directory: kernel
        run: |
          set -euo pipefail

          echo "== 回移植 6.6-dev 的 sus_type/avd 隐藏实现到 vendor 5.4 =="
          # 上游 susfs4ksu（gki-android15-6.6-dev）把 BakaSU 注入的 policy 规则缓存在内核哈希表：
          #   - susfs_add_sus_type: 注册注入的 type；app 解析该 type 的 context 时按 -EINVAL 拒绝
          #   - susfs_add_sus_avd_allowed_by_type/susfs_spoof_avd_allowed_rcu: 记录注入前的
          #     avd.allowed，app 走 /sys/fs/selinux/access 查询时还原为注入前的授权位
          # vendor 5.4（susfs v2.3.0）无此实现，且 selinux 锁模型不同（policy_rwlock 而非 6.6 的
          # RCU + selinux_policy），这里按 5.4 语义回移植内核侧存储与 services.c 过滤实现，并把
          # selinuxfs.c/hooks.c 中 my_* 钩子的 fake_state 调用切到 susfs 过滤路径
          if ! grep -q 'susfs_is_sus_type_rcu' fs/susfs.c; then
            echo "-- backporting sus_type/avd hiding into vendor 5.4 susfs"
            # 1) fs/susfs.c：sus_type / sus_avd_allowed 内核存储（照搬 6.6-dev，日志宏改用
            #    v2.3.0 的 SUSFS_LOGE/SUSFS_LOGI，上游用 v2.4+ 才有的 *_RL 变体）
            cat >> fs/susfs.c <<'SUSTYPE_EOF'

            /* sus_type: backported from susfs4ksu gki-android15-6.6-dev */
            static DEFINE_MUTEX(susfs_mutex_lock_sus_type);
            static DEFINE_HASHTABLE(SUS_TYPE_HLIST, 10);

            struct st_susfs_sus_type_hlist {
            struct hlist_node                        node;
            };

            int susfs_add_sus_type(const char *secctx, u32 type_value) {
            struct st_susfs_sus_type_hlist *new_entry, *tmp_entry;
            struct hlist_node *tmp_hlist_node;
            int err = 0;

            mutex_lock(&susfs_mutex_lock_sus_type);
            hash_for_each_possible_safe(SUS_TYPE_HLIST, tmp_entry, tmp_hlist_node, node, type_value) {
            SUSFS_LOGE("secctx '%s', type_value '%u', was added before already\n",
            secctx, type_value);
            err = -EINVAL;
            goto unlock;
            }

            new_entry = kzalloc(sizeof(struct st_susfs_sus_type_hlist), GFP_KERNEL);
            if (!new_entry) {
            err = -ENOMEM;
            goto unlock;
            }

            hash_add_rcu(SUS_TYPE_HLIST, &new_entry->node, type_value);
            SUSFS_LOGI("secctx '%s', type '%u', has been added to SUS_TYPE_HLIST\n",
            secctx, type_value);
            unlock:
            mutex_unlock(&susfs_mutex_lock_sus_type);
            return err;
            }

            bool susfs_is_sus_type_rcu(u32 type_value) {
            struct st_susfs_sus_type_hlist *entry = NULL;

            hash_for_each_possible_rcu(SUS_TYPE_HLIST, entry, node, type_value) {
            return true;
            }
            return false;
            }

            static DEFINE_MUTEX(susfs_mutex_lock_sus_avd_allowed_hlist);
            static DEFINE_HASHTABLE(SUS_AVD_ALLOWED_HLIST, 18);

            struct susfs_sus_av_rule {
            struct hlist_node node;
            u32 s_type;
            u32 t_type;
            u32 c_type;
            u32 orig_avd_allowed;
            };

            static inline u32 susfs_av_rule_hash(u32 ssid, u32 tsid, u16 tclass)
            {
            u32 h;

            h = hash_32(ssid, 32);
            h ^= rol32(hash_32(tsid, 32), 13);
            h ^= rol32(hash_32((u32)tclass, 32), 19);

            h += h << 13;
            h ^= h >> 7;
            h += h << 17;
            h ^= h >> 5;

            return h;
            }

            int susfs_add_sus_avd_allowed_by_type(u32 s_type, u32 t_type, u32 c_type, u32 orig_avd_allowed)
            {
            struct susfs_sus_av_rule *entry, *tmp_entry;
            struct hlist_node *tmp_hlist_node;
            int err = 0;
            u32 key;

            mutex_lock(&susfs_mutex_lock_sus_avd_allowed_hlist);

            entry = kzalloc(sizeof(*entry), GFP_ATOMIC);
            if (!entry) {
            err = -ENOMEM;
            goto unlock;
            }

            key = susfs_av_rule_hash(s_type, t_type, c_type);
            hash_for_each_possible_safe(SUS_AVD_ALLOWED_HLIST, tmp_entry, tmp_hlist_node, node, key) {
            if (tmp_entry->s_type == s_type &&
                tmp_entry->t_type == t_type &&
                tmp_entry->c_type == c_type)
            {
            /* Do not apply any new orig_avd_allowed for matched entry. */
            kfree(entry);
            goto unlock;
            }
            }

            entry->s_type = s_type;
            entry->t_type = t_type;
            entry->c_type = c_type;
            entry->orig_avd_allowed = orig_avd_allowed;

            hash_add_rcu(SUS_AVD_ALLOWED_HLIST, &entry->node, key);
            SUSFS_LOGI("av_rule '%u %u %u %u' has been added to SUS_AVD_ALLOWED_HLIST\n",
            s_type, t_type, c_type, orig_avd_allowed);
            unlock:
            mutex_unlock(&susfs_mutex_lock_sus_avd_allowed_hlist);
            return err;
            }

            void susfs_spoof_avd_allowed_rcu(u32 s_type, u32 t_type, u32 c_type, u32 *avd_allowed)
            {
            struct susfs_sus_av_rule *entry;
            u32 key = susfs_av_rule_hash(s_type, t_type, c_type);

            hash_for_each_possible_rcu(SUS_AVD_ALLOWED_HLIST, entry, node, key) {
            if (entry->s_type == s_type &&
                entry->t_type == t_type &&
                entry->c_type == c_type)
            {
            *avd_allowed = entry->orig_avd_allowed;
            return;
            }
            }
            }
          SUSTYPE_EOF
            # 2) security/selinux/ss/services.c：5.4 适配的过滤实现。与 6.6 原版的差异：
            #    - 6.6 用 rcu_read_lock + rcu_dereference(selinux_state.policy)，5.4 用
            #      read_lock(&selinux_state.ss->policy_rwlock) + 内嵌 policydb/sidtab
            #    - 5.4 的 context_to_sid 查找依赖 context->hash，需先 context_add_hash()
            #    - string_to_context_struct 按本内核用 hashtab_search(pol->p_xxx.table, ...)
            cat >> security/selinux/ss/services.c <<'SUSAVD_EOF'

            /* sus_type hiding: backported from susfs4ksu gki-android15-6.6-dev (5.4 rwlock model) */
            #ifdef CONFIG_KSU_SUSFS
            extern bool susfs_is_sus_type_rcu(u32 sid);
            extern void susfs_spoof_avd_allowed_rcu(u32 s_type, u32 t_type, u32 c_type, u32 *avd_allowed);

            static int susfs_string_to_context_struct(struct policydb *pol,
                struct sidtab *sidtabp,
                char *scontext,
                struct context *ctx,
                u32 def_sid)
            {
            struct role_datum *role;
            struct type_datum *typdatum;
            struct user_datum *usrdatum;
            char *scontextp, *p, oldc;
            int rc = 0;

            context_init(ctx);

            /* Parse the security context. */

            rc = -EINVAL;
            scontextp = (char *) scontext;

            /* Extract the user. */
            p = scontextp;
            while (*p && *p != ':')
            p++;

            if (*p == 0)
            goto out;

            *p++ = 0;

            usrdatum = hashtab_search(pol->p_users.table, scontextp);
            if (!usrdatum)
            goto out;

            ctx->user = usrdatum->value;

            /* Extract role. */
            scontextp = p;
            while (*p && *p != ':')
            p++;

            if (*p == 0)
            goto out;

            *p++ = 0;

            role = hashtab_search(pol->p_roles.table, scontextp);
            if (!role)
            goto out;
            ctx->role = role->value;

            /* Extract type. */
            scontextp = p;
            while (*p && *p != ':')
            p++;
            oldc = *p;
            *p++ = 0;

            typdatum = hashtab_search(pol->p_types.table, scontextp);
            if (!typdatum || typdatum->attribute)
            goto out;
            if (likely(susfs_is_sus_type_rcu(typdatum->value)))
            goto out;

            ctx->type = typdatum->value;

            rc = mls_context_to_sid(pol, oldc, p, ctx, sidtabp, def_sid);
            if (rc)
            goto out;

            /* Check the validity of the new context. */
            rc = -EINVAL;
            if (!policydb_context_isvalid(pol, ctx))
            goto out;
            rc = 0;
            out:
            if (rc)
            context_destroy(ctx);
            return rc;
            }

            static int susfs_security_context_to_sid_core(const char *scontext, u32 scontext_len,
            u32 *sid, u32 def_sid, gfp_t gfp_flags,
            int force)
            {
            struct policydb *policydb;
            struct sidtab *sidtab;
            char *scontext2, *str = NULL;
            struct context context;
            int rc = 0;

            /* An empty security context is never valid. */
            if (!scontext_len)
            return -EINVAL;

            /* Copy the string to allow changes and ensure a NUL terminator */
            scontext2 = kmemdup_nul(scontext, scontext_len, gfp_flags);
            if (!scontext2)
            return -ENOMEM;

            if (!selinux_state.initialized) {
            int i;

            for (i = 1; i < SECINITSID_NUM; i++) {
            if (!strcmp(initial_sid_to_string[i], scontext2)) {
            *sid = i;
            goto out;
            }
            }
            *sid = SECINITSID_KERNEL;
            goto out;
            }
            *sid = SECSID_NULL;

            if (force) {
            /* Save another copy for storing in uninterpreted form */
            rc = -ENOMEM;
            str = kstrdup(scontext2, gfp_flags);
            if (!str)
            goto out;
            }
            read_lock(&selinux_state.ss->policy_rwlock);
            policydb = &selinux_state.ss->policydb;
            sidtab = selinux_state.ss->sidtab;
            rc = susfs_string_to_context_struct(policydb, sidtab, scontext2,
                  &context, def_sid);
            if (rc == -EINVAL && force) {
            context.str = str;
            context.len = strlen(str) + 1;
            str = NULL;
            } else if (rc)
            goto out_unlock;
            rc = context_add_hash(policydb, &context);
            if (rc)
            goto out_unlock;
            rc = sidtab_context_to_sid(sidtab, &context, sid);
            context_destroy(&context);
            out_unlock:
            read_unlock(&selinux_state.ss->policy_rwlock);
            out:
            kfree(scontext2);
            kfree(str);
            return rc;
            }

            int susfs_security_context_to_sid(const char *scontext, u32 scontext_len, u32 *sid,
                gfp_t gfp)
            {
            return susfs_security_context_to_sid_core(scontext, scontext_len,
                sid, SECSID_NULL, gfp, 0);
            }

            int susfs_security_context_str_to_sid(const char *scontext, u32 *sid, gfp_t gfp)
            {
            return susfs_security_context_to_sid(scontext, strlen(scontext),
                   sid, gfp);
            }

            void susfs_security_compute_av_user(u32 ssid,
                  u32 tsid,
                  u16 tclass,
                  struct av_decision *avd)
            {
            struct policydb *policydb;
            struct sidtab *sidtab;
            struct context *scontext = NULL, *tcontext = NULL;

            read_lock(&selinux_state.ss->policy_rwlock);
            avd_init(&selinux_state, avd);
            if (!selinux_state.initialized)
            goto allow;

            policydb = &selinux_state.ss->policydb;
            sidtab = selinux_state.ss->sidtab;

            scontext = sidtab_search(sidtab, ssid);
            if (!scontext) {
            pr_err("SELinux: %s:  unrecognized SID %d\n",
                   __func__, ssid);
            goto out;
            }

            /* permissive domain? */
            if (ebitmap_get_bit(&policydb->permissive_map, scontext->type))
            avd->flags |= AVD_FLAGS_PERMISSIVE;

            tcontext = sidtab_search(sidtab, tsid);
            if (!tcontext) {
            pr_err("SELinux: %s:  unrecognized SID %d\n",
                   __func__, tsid);
            goto out;
            }

            if (unlikely(!tclass)) {
            if (policydb->allow_unknown)
            goto allow;
            goto out;
            }

            context_struct_compute_av(policydb, scontext, tcontext, tclass, avd,
              NULL);
            susfs_spoof_avd_allowed_rcu(scontext->type, tcontext->type, tclass,
                &avd->allowed);
             out:
            read_unlock(&selinux_state.ss->policy_rwlock);
            return;
            allow:
            avd->allowed = 0xffffffff;
            goto out;
            }
            #endif // #ifdef CONFIG_KSU_SUSFS
          SUSAVD_EOF
            # 3) selinuxfs.c / hooks.c：my_* 钩子由 fake_state 路径切到 susfs 过滤路径
            #    （fake_state 浅拷贝的 initialized 恒为 false，标准接口会退化为全放行/假 SID）
            perl -0pi -e 's/security_context_to_sid\(&fake_state, buf, size, &sid, GFP_KERNEL\);/susfs_security_context_to_sid(buf, size, &sid, GFP_KERNEL);/; s/security_sid_to_context\(&fake_state, sid, &canon, &len\);/security_sid_to_context(&selinux_state, sid, &canon, &len);/; s/security_context_str_to_sid\(&fake_state, scon, &ssid, GFP_KERNEL\);/susfs_security_context_str_to_sid(scon, &ssid, GFP_KERNEL);/; s/security_context_str_to_sid\(&fake_state, tcon, &tsid, GFP_KERNEL\);/susfs_security_context_str_to_sid(tcon, &tsid, GFP_KERNEL);/; s/security_compute_av_user\(&fake_state, ssid, tsid, tclass, &avd\);/susfs_security_compute_av_user(ssid, tsid, tclass, &avd);/; s/security_context_to_sid\(&fake_state, value, size,\s*&sid, GFP_KERNEL\);/susfs_security_context_to_sid(value, size, &sid, GFP_KERNEL);/s' \
              security/selinux/selinuxfs.c security/selinux/hooks.c
            # 4) 落盘校验
            grep -q 'int susfs_add_sus_type(const char \*secctx' fs/susfs.c \
              && grep -q 'int susfs_add_sus_avd_allowed_by_type(u32 s_type' fs/susfs.c \
              && grep -q 'bool susfs_is_sus_type_rcu(u32 type_value)' fs/susfs.c \
              && grep -q 'void susfs_spoof_avd_allowed_rcu' fs/susfs.c \
              && grep -q 'void susfs_security_compute_av_user(u32 ssid' security/selinux/ss/services.c \
              && grep -q 'susfs_string_to_context_struct' security/selinux/ss/services.c \
              && grep -q 'susfs_security_context_to_sid(buf, size' security/selinux/selinuxfs.c \
              && grep -q 'susfs_security_compute_av_user(ssid' security/selinux/selinuxfs.c \
              && grep -q 'susfs_security_context_to_sid(value, size' security/selinux/hooks.c \
              && ! grep -q 'security_compute_av_user(&fake_state' security/selinux/selinuxfs.c \
              || { echo "::error::sus_type backport verification failed"; exit 1; }
          else
            echo "-- sus_type backport already present, skipping"
          fi

      - name: Patch SELinux status.c (policyload backfill)
        working-directory: kernel
        run: |
          set -euo pipefail

          echo "== 修复：status 页惰性分配导致真实页 policyload 永远为 0 =="
          # 5.4 状态页在首次 open/mmap /sys/fs/selinux/status 时才分配
          # （ss/status.c selinux_kernel_status_page 惰性 alloc）；init 加载
          # sepolicy 触发的 selinux_status_update_policyload(seqno=1) 当时页
          # 不存在，更新被静默丢弃，真实页从此永远 policyload=0。对 enforcing
          # 系统这是不可能状态（policy 从未加载不可能 enforcing），mainline 注释
          # 亦声明该值 "never zero"——检测器（春秋 status.sequence/policyload 项）
          # 以 root 读真实页即报篡改。修复：update_policyload 无论页是否存在都
          # 记录 seqno，惰性分配时回填；两个函数同持 status_lock，无竞态。
          STATUS_C=security/selinux/ss/status.c
          test -f "$STATUS_C" || { echo "::error::$STATUS_C not found"; exit 1; }
          if grep -q 'selinux_last_policyload' "$STATUS_C"; then
            echo "-- policyload backfill already present, skipping"
          else
            python3 - "$STATUS_C" <<'PYEOF'
          import sys
          p = sys.argv[1]
          s = open(p).read()
          a = '#include "services.h"\n'
          assert s.count(a) == 1, 'include anchor'
          s = s.replace(a, a + '\n/* latest policyload seqno, for status page lazy-allocation backfill */\nstatic int selinux_last_policyload;\n')
          key = 'selinux_status_update_policyload'
          lock = 'mutex_lock(&state->ss->status_lock);'
          i = s.index(key)
          j = s.index(lock, i)
          end = j + len(lock)
          s = s[:end] + '\n\tselinux_last_policyload = seqno;' + s[end:]
          z = 'status->policyload = 0;'
          assert s.count(z) == 1, 'lazy alloc anchor'
          s = s.replace(z, 'status->policyload = selinux_last_policyload;')
          open(p, 'w').write(s)
          print('policyload backfill patched')
          PYEOF
            grep -q 'static int selinux_last_policyload;' "$STATUS_C" \
              && grep -q 'status->policyload = selinux_last_policyload;' "$STATUS_C" \
              && grep -q 'selinux_last_policyload = seqno;' "$STATUS_C" \
              && ! grep -q 'status->policyload = 0;' "$STATUS_C" \
              || { echo "::error::policyload backfill patch verification failed"; exit 1; }
            echo "-- policyload backfill patched & verified"
          fi

      - name: Configure Kernel (full SUSFS features)
        working-directory: kernel
        run: |
          set -euo pipefail
          export ARCH=arm64
          export PATH="${{ env.CLANG_DIR }}/bin:$PATH"
          export LLVM=1 LLVM_IAS=1 \
                 CLANG_TRIPLE=aarch64-linux-gnu- \
                 CROSS_COMPILE=aarch64-linux-gnu- \
                 CROSS_COMPILE_COMPAT=arm-linux-gnueabi-

          echo "== 直接向 defconfig 追加 SUSFS 配置 =="
          DEFCONFIG_PATH="./arch/arm64/configs/${{ env.DEFCONFIG_NAME }}"
          test -f "$DEFCONFIG_PATH" || { echo "::error::defconfig not found at $DEFCONFIG_PATH"; exit 1; }
          # 上游 defconfig 首行混入全角括号（"（CONFIG_MIHW=y"），kconfig 会警告并丢弃该行，
          # 导致小米 millet 驱动（drivers/mihw）被静默关闭，这里剥离全角括号修复
          sed -i 's/\xEF\xBC\x88//g; s/\xEF\xBC\x89//g' "$DEFCONFIG_PATH"
          grep -q '^CONFIG_MIHW=y' "$DEFCONFIG_PATH" \
            || { echo "::error::defconfig sanitize failed (MIHW line)"; exit 1; }
          # 注意：不追加 KSU_SUSFS_PRIORITY_UID_FILTER —— builtin Kconfig 默认 y，
          # 但本树内核侧 SUSFS v2.3.0 没有 susfs_parse_priority_app_strings() 等实现，
          # 开启会在 pkg_observer.c 产生未定义符号，必须在下面显式 disable
          for sym in KSU_SUSFS KSU_SUSFS_SUS_PATH KSU_SUSFS_SUS_MOUNT KSU_SUSFS_SUS_KSTAT \
                     KSU_SUSFS_SPOOF_UNAME KSU_SUSFS_ENABLE_LOG KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS \
                     KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG KSU_SUSFS_OPEN_REDIRECT \
                     KSU_SUSFS_SUS_MAP; do
            echo "CONFIG_${sym}=y" >> "$DEFCONFIG_PATH"
          done
          grep -q 'CONFIG_KSU_SUSFS_SUS_MAP=y' "$DEFCONFIG_PATH" \
            || { echo "::error::defconfig SUSFS append failed"; exit 1; }

          echo "== 启用 pstore ramoops（异常开机取证：/sys/fs/pstore/console-ramoops-*）=="
          for sym in PSTORE PSTORE_RAM PSTORE_CONSOLE; do
            echo "CONFIG_${sym}=y" >> "$DEFCONFIG_PATH"
          done

          echo "== 生成 defconfig =="
          make O=out ARCH=arm64 "${{ env.DEFCONFIG_NAME }}"

          echo "== 配置 SukiSU-Ultra builtin：SUSFS 全功能 =="
          # builtin 的 KSU 无 KPROBES/EXT4_FS 依赖（manual-hook 形态，钩子调用点
          # 全部位于内核树 #ifdef CONFIG_KSU_SUSFS 内），KSU_SUSFS 开启即生效
          scripts/config --file out/.config \
            --enable  KSU \
            --enable  KSU_SUSFS \
            --enable  KSU_SUSFS_SUS_PATH \
            --enable  KSU_SUSFS_SUS_MOUNT \
            --enable  KSU_SUSFS_SUS_KSTAT \
            --enable  KSU_SUSFS_SPOOF_UNAME \
            --enable  KSU_SUSFS_ENABLE_LOG \
            --enable  KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS \
            --enable  KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG \
            --enable  KSU_SUSFS_OPEN_REDIRECT \
            --enable  KSU_SUSFS_SUS_MAP \
            --enable  PSTORE \
            --enable  PSTORE_RAM \
            --enable  PSTORE_CONSOLE \
            --disable KSU_SUSFS_PRIORITY_UID_FILTER \
            --disable KPM \
            --disable KSU_DEBUG \
            --enable  KALLSYMS_ALL \
            --disable UAPI_HEADER_TEST \
            --disable HEADERS_INSTALL \
            --set-str LOCALVERSION ""
            # /proc/version 不受 SUSFS SPOOF_UNAME 伪造，版本串带 susfs 等字样会被
            # 春秋/Momo 类检测直接读出；强制保持空串，内核串回归原厂形态

          make O=out ARCH=arm64 olddefconfig

          echo "== 校验 SUSFS 配置生效 =="
          for sym in KSU KSU_SUSFS KSU_SUSFS_SUS_PATH KSU_SUSFS_SUS_MOUNT KSU_SUSFS_SUS_KSTAT \
                     KSU_SUSFS_SPOOF_UNAME KSU_SUSFS_ENABLE_LOG KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS \
                     KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG KSU_SUSFS_OPEN_REDIRECT \
                     KSU_SUSFS_SUS_MAP PSTORE PSTORE_RAM PSTORE_CONSOLE; do
            grep -q "^CONFIG_${sym}=y" out/.config || { echo "::error::CONFIG_${sym} not enabled"; exit 1; }
          done
          grep -q '^CONFIG_KSU_SUSFS_PRIORITY_UID_FILTER=y' out/.config \
            && { echo "::error::CONFIG_KSU_SUSFS_PRIORITY_UID_FILTER must stay off (vendor 5.4 susfs lacks kernel-side support)"; exit 1; } || true
          grep -q '^CONFIG_KPM=y' out/.config \
            && { echo "::error::CONFIG_KPM should stay off"; exit 1; } || true

      - name: 修复编译警告
        working-directory: kernel
        run: |
          set -e
          FOCALTECH_MAKEFILE="drivers/input/touchscreen/focaltech_touch/Makefile"
          if [ -f "$FOCALTECH_MAKEFILE" ]; then
            sed -i 's/^ \+/\t/' "$FOCALTECH_MAKEFILE"
            echo "Fixed leading spaces in focaltech Makefile"
          fi

          for entry in \
            "drivers/staging/qcacld-3.0:-Wno-format" \
            "drivers/staging/qca-wifi-host-cmn:-Wno-format" \
            "drivers/thermal:-Wno-fortify-source"; do
            DIR="${entry%%:*}"
            FLAG="${entry##*:}"
            if [ -d "$DIR" ] && [ -f "$DIR/Makefile" ]; then
              grep -q -- "$FLAG" "$DIR/Makefile" || echo "ccflags-y += $FLAG" >> "$DIR/Makefile"
            fi
          done

      - name: Build Kernel
        working-directory: kernel
        run: |
          export ARCH=arm64
          export PATH="${{ env.CLANG_DIR }}/bin:$PATH"
          export LLVM=1 LLVM_IAS=1 \
                 CLANG_TRIPLE=aarch64-linux-gnu- \
                 CROSS_COMPILE=aarch64-linux-gnu- \
                 CROSS_COMPILE_COMPAT=arm-linux-gnueabi-
          export CCACHE_DIR="${{ github.workspace }}/.ccache"
          export CCACHE_MAXSIZE=8G
          # 去除 CI 构建指纹：/proc/version 里嵌入的构建者/主机名/时间戳会被检测用作
          # "自编内核" 信号，固定为普通本地构建形态（对反检测同样有意义）
          export KBUILD_BUILD_USER=builder
          export KBUILD_BUILD_HOST=android-build
          export KBUILD_BUILD_TIMESTAMP="Thu Jun 12 10:00:00 UTC 2025"

          echo "== 预装 UAPI 头文件以启用 SukiSU preinit runner =="
          # vendor defconfig 不带 HEADERS_INSTALL，SukiSU builtin 的 preinit runner
          # 检测不到 out/usr/include 会降级为 -DKSU_NO_PREINIT。这里显式安装以启用
          make -j$(nproc) O=out ARCH=arm64 \
            CC="ccache clang" LD="ld.lld" AR="llvm-ar" NM="llvm-nm" \
            headers_install INSTALL_HDR_PATH="$PWD/out/usr" \
            || echo "::warning::headers_install failed, SukiSU preinit will stay disabled (non-fatal)"
          test -f out/usr/include/linux/unistd.h \
            && echo "-- preinit UAPI headers ready" \
            || echo "::warning::usr/include/linux/unistd.h missing, preinit will be disabled"

          set +e
          make -j$(nproc) O=out ARCH=arm64 \
            CC="ccache clang" LD="ld.lld" AR="llvm-ar" NM="llvm-nm" \
            OBJCOPY="llvm-objcopy" OBJDUMP="llvm-objdump" STRIP="llvm-strip" \
            CLANG_TRIPLE="aarch64-linux-gnu-" CROSS_COMPILE="aarch64-linux-gnu-" \
            KCFLAGS="-Wno-unknown-warning-option -Wno-error -Wno-format -Wno-incompatible-pointer-types \
            -Wno-implicit-function-declaration -Wno-strict-prototypes -Wno-missing-prototypes \
            -Wno-int-conversion -Wno-declaration-after-statement \
            -Wframe-larger-than=131072 -Wno-unused-variable -Wno-unused-function \
            -Wno-missing-braces -Wno-int-to-pointer-cast -Wno-address-of-packed-member \
            -Wno-return-type -Wno-shift-negative-value -Wno-array-bounds" \
            HOSTCFLAGS="" 2>&1 | tee build.log

          if [ ${PIPESTATUS[0]} -ne 0 ]; then
            echo "::error::Kernel build failed. Last 200 lines:"
            tail -n 200 build.log
            exit 1
          fi

          echo "=== Build finished ==="
          ccache -s 2>/dev/null || true
          ls -lh out/arch/arm64/boot/Image

      - name: Package AnyKernel3
        run: |
          set -e
          TIME=$(TZ='Asia/Shanghai' date +%Y%m%d-%H%M)
          IMG_PATH="${{ env.KERNEL_DIR }}/${{ env.OUTPUT_DIR }}/arch/arm64/boot/Image"
          test -f "$IMG_PATH"

          rm -rf AnyKernel3
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git
          cd AnyKernel3

          cp "$IMG_PATH" ./Image
          gzip -9 -f ./Image
          rm -f ./Image

          cat > anykernel.sh <<'AK3'
          ### AnyKernel3 Ramdisk Mod Script
          ## osm0sis @ xda-developers

          ### AnyKernel setup
          # global properties
          properties() { '
          kernel.string=Edwin SukiSU-Ultra Full SUSFS for Xiaomi 11 Ultra / Pro (star)
          do.devicecheck=1
          do.modules=0
          do.systemless=1
          do.cleanup=1
          do.cleanuponabort=0
          device.name1=star
          device.name2=mars
          supported.versions=
          supported.patchlevels=
          supported.vendorpatchlevels=
          '; } # end properties

          ### AnyKernel install
          # boot files attributes
          boot_attributes() {
          set_perm_recursive 0 0 755 644 $RAMDISK/*;
          set_perm_recursive 0 0 750 750 $RAMDISK/init* $RAMDISK/sbin;
          } # end attributes

          # boot shell variables
          BLOCK=boot;
          IS_SLOT_DEVICE=1;
          RAMDISK_COMPRESSION=auto;
          PATCH_VBMETA_FLAG=auto;

          # import functions/variables and setup patching - see for reference (DO NOT REMOVE)
          . tools/ak3-core.sh;

          # boot install
          split_boot;

          flash_boot;
          ## end boot install
          AK3

          chmod +x anykernel.sh
          zip -r9 "../${{ env.DEVICE_CODENAME }}-SukiSU-SUSFS-Full-${TIME}.zip" ./*

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: star-SukiSU-SUSFS-Full
          path: ${{ env.DEVICE_CODENAME }}-SukiSU-SUSFS-Full-*.zip
