name: Build Kernel with SUSFS (backslashxx + simonpunk 5.4)

on:
  workflow_dispatch:

env:
  TZ: Asia/Shanghai
  DEVICE_CODENAME: "star"
  KERNEL_ARCH: "arm64"
  KERNEL_REPO: "zttlove/android_kernel_xiaomi_sm8350_miyume"
  KERNEL_BRANCH: "main"
  DEFCONFIG_NAME: "star_defconfig"
  OUTPUT_DIR: "out"
  CLANG_DIR: "${{ github.workspace }}/clang"
  CCACHE_DIR: "${{ github.workspace }}/.ccache"
  KERNEL_DIR: "${{ github.workspace }}/kernel"

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:

      - name: Checkout Kernel Source
        uses: actions/checkout@v4
        with:
          repository: ${{ env.KERNEL_REPO }}
          ref: ${{ env.KERNEL_BRANCH }}
          path: kernel
          fetch-depth: 1

      - name: Checkout Workflow Repo (Patches)
        uses: actions/checkout@v4
        with:
          path: workflow_repo
          fetch-depth: 1

      - name: Install Dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            bc bison flex libelf-dev libssl-dev libncurses-dev \
            make python3 device-tree-compiler git curl xz-utils \
            ccache zip unzip

          echo "正在修复 libtinfo.so.5 依赖..."
          if ! sudo apt install -y libtinfo5; then
            sudo ln -sf /lib/x86_64-linux-gnu/libtinfo.so.6 /lib/x86_64-linux-gnu/libtinfo.so.5
          fi

          if [ ! -f /lib/x86_64-linux-gnu/libtinfo.so.5 ]; then
            echo "::error::libtinfo.so.5 修复失败"
            exit 1
          fi

      - name: Download Clang
        run: |
          mkdir -p ${{ env.CLANG_DIR }}
          curl -L --retry 3 -o clang.tar.xz "https://github.com/llvm/llvm-project/releases/download/llvmorg-18.1.8/clang+llvm-18.1.8-x86_64-linux-gnu-ubuntu-18.04.tar.xz"
          tar -xf clang.tar.xz -C ${{ env.CLANG_DIR }} --strip-components=1
          rm clang.tar.xz
          ${{ env.CLANG_DIR }}/bin/clang --version

      - name: Setup backslashxx/KernelSU
        working-directory: kernel
        run: |
          set -e
          echo "Cloning backslashxx/KernelSU..."
          rm -rf drivers/kernelsu
          git clone -b master https://github.com/backslashxx/KernelSU.git drivers/kernelsu
          cd drivers/kernelsu
          git log --oneline -1
          cd ../..

          # 创建包装文件
          echo "source \"drivers/kernelsu/kernel/Kconfig\"" > drivers/kernelsu/Kconfig
          echo "obj-y += kernel/" > drivers/kernelsu/Makefile
          sed -i '/source "drivers\/kernelsu\/Kconfig"/d' drivers/Kconfig || true
          sed -i '/obj-\$(CONFIG_KSU) += kernelsu\//d' drivers/Makefile || true
          echo "source \"drivers/kernelsu/Kconfig\"" >> drivers/Kconfig
          echo "obj-\$(CONFIG_KSU) += kernelsu/" >> drivers/Makefile

      - name: Download SUSFS patches (5.4)
        working-directory: kernel
        run: |
          set -e
          echo "下载 SUSFS 内核补丁..."
          wget -O 50_add_susfs_in_kernel-5.4.patch \
            "https://gitlab.com/simonpunk/susfs4ksu/-/raw/kernel-5.4/kernel_patches/50_add_susfs_in_kernel-5.4.patch"
          echo "下载 KernelSU 补丁..."
          wget -O 10_enable_susfs_for_ksu.patch \
            "https://gitlab.com/simonpunk/susfs4ksu/-/raw/kernel-5.4/kernel_patches/KernelSU/10_enable_susfs_for_ksu.patch"

      - name: Apply KernelSU patch (SUSFS)
        working-directory: kernel/drivers/kernelsu
        run: |
          set -e
          patch -p1 -N --batch --no-backup-if-mismatch < ../../10_enable_susfs_for_ksu.patch || true
          echo "✅ KernelSU 补丁应用完成（如有 .rej 请检查）"

      - name: Apply SUSFS kernel patch
        working-directory: kernel
        run: |
          set -e
          patch -p1 -N --batch --no-backup-if-mismatch < 50_add_susfs_in_kernel-5.4.patch || true
          echo "✅ SUSFS 内核补丁应用完成（如有 .rej 请检查）"

      - name: Fix missing susfs_init declaration in ksu.c
        working-directory: kernel
        run: |
          KSU_C="drivers/kernelsu/kernel/ksu.c"
          if [ ! -f "$KSU_C" ]; then
          echo "❌ 找不到 $KSU_C"
          exit 1
          fi
          # 移除之前可能误插入的 susfs.h include
          sed -i '/#include <linux\/susfs.h>/d' "$KSU_C"
          # 如果没有 extern 声明，就在文件开头插入
          if ! grep -q "extern void susfs_init" "$KSU_C"; then
          echo "在 $KSU_C 开头插入 extern void susfs_init(void);"
          sed -i '1i\
          #ifdef CONFIG_KSU_SUSFS\
          extern void susfs_init(void);\
          #endif' "$KSU_C"
          else
          echo "✅ $KSU_C 已包含 susfs_init 声明"
          fi
          # 验证
          grep -n "susfs_init" "$KSU_C" | head -5

      - name: Fix task_mmu.c return errors (SUS_MAP/SUS_KSTAT)
        working-directory: kernel
        run: |
          cat > fix_task_mmu.py << 'EOF'
          import re

          non_void_funcs = [
              'proc_maps_open', 'show_map', 'smaps_pte_hole', 'smaps_pte_range',
              'show_smap', 'smaps_rollup_open', 'clear_refs_pte_range',
              'clear_refs_test_walk', 'add_to_pagemap', 'pagemap_open',
              'pagemap_release', 'reclaim_pte_range'
          ]
          void_funcs = [
              'seq_print_vma_name', 'smaps_account', 'smaps_pte_entry', 'smap_gather_stats'
          ]

          with open('fs/proc/task_mmu.c', 'r') as f:
              lines = f.readlines()

          def find_body(lines, func):
              pattern = re.compile(r'\b' + func + r'\s*\(')
              start = None
              for i, line in enumerate(lines):
                  if pattern.search(line) and not line.strip().startswith('//'):
                      if '{' in line or (i+1 < len(lines) and '{' in lines[i+1]):
                          start = i
                          break
              if start is None:
                  return None, None
              brace = 0
              body_start = None
              for i in range(start, len(lines)):
                  for ch in lines[i]:
                      if ch == '{':
                          brace += 1
                          if body_start is None:
                              body_start = i
                      elif ch == '}':
                          brace -= 1
                          if brace == 0 and body_start is not None:
                              return body_start, i
              return None, None

          for func in non_void_funcs:
              s, e = find_body(lines, func)
              if s is not None:
                  for i in range(s, e+1):
                      if re.match(r'^\s*return;\s*$', lines[i]):
                          lines[i] = re.sub(r'return;', 'return 0;', lines[i])

          for func in void_funcs:
              s, e = find_body(lines, func)
              if s is not None:
                  for i in range(s, e+1):
                      if re.match(r'^\s*return 0;\s*$', lines[i]):
                          lines[i] = re.sub(r'return 0;', 'return;', lines[i])

          with open('fs/proc/task_mmu.c', 'w') as f:
              f.writelines(lines)
          print("✅ task_mmu.c 修复完成")
          EOF
          python3 fix_task_mmu.py
          
      - name: Fix fs/readdir.c legacy API names
        working-directory: kernel
        run: |
          set -e
          READDIR_C="fs/readdir.c"

          # 替换旧的任务状态判断为新 API
          sed -i 's/current->susfs_task_state & TASK_STRUCT_NON_ROOT_USER_APP_PROC/susfs_is_current_proc_umounted_app()/g' "$READDIR_C"

          # 检查 susfs_sus_ino_for_filldir64 是否存在，如果新版已改名则替换
          if grep -q "susfs_sus_ino_for_filldir64" "$READDIR_C"; then
          # 新版中已经没有这个函数了，需要删除这些条件判断
          # 因为它依赖旧版的任务状态判断逻辑，属于旧架构
          sed -i 's/if (likely(susfs_is_current_proc_umounted_app()) && susfs_sus_ino_for_filldir64(ino)) {/if (susfs_is_inode_sus_path(inode)) {/g' "$READDIR_C"
          fi

          # 如果还有残留，用简单的路径判断替代
          sed -i 's/susfs_sus_ino_for_filldir64(ino)/susfs_is_inode_sus_path(inode)/g' "$READDIR_C"

          echo "✅ fs/readdir.c 修复完成"
          grep -n "TASK_STRUCT_NON_ROOT\|susfs_sus_ino_for" "$READDIR_C" || echo "✅ 无残留旧名称"

      - name: Fix fs/stat.c legacy API names
        working-directory: kernel
        run: |
          set -e
           STAT_C="fs/stat.c"
           # 1. 替换旧的任务状态判断为新的 API 调用
          sed -i 's/current->susfs_task_state & TASK_STRUCT_NON_ROOT_USER_APP_PROC/susfs_is_current_proc_umounted_app()/g' "$STAT_C"

           # 2. 替换旧的 inode 状态宏
           sed -i 's/INODE_STATE_SUS_KSTAT/AS_FLAGS_SUS_KSTAT/g' "$STAT_C"

           # 3. 替换旧的函数名为新函数名，并修正第一个参数从 ino 为 inode
           sed -i 's/susfs_sus_ino_for_generic_fillattr(inode->i_ino, stat)/susfs_sus_kstat_spoof_generic_fillattr(inode, stat)/g' "$STAT_C"

           # 4. 确保 fs/stat.c 包含 susfs_def.h（否则 susfs_is_current_proc_umounted_app 和 AS_FLAGS_SUS_KSTAT 不可见）
           if ! grep -q "linux/susfs_def.h" "$STAT_C"; then
           # 尝试插入到合适位置
           if grep -q '#include <linux/stat.h>' "$STAT_C"; then
           sed -i '/#include <linux\/stat.h>/a #ifdef CONFIG_KSU_SUSFS\n#include <linux\/susfs_def.h>\n#endif' "$STAT_C"
           else
           sed -i '0,/#include/{s|#include|#ifdef CONFIG_KSU_SUSFS\n#include <linux/susfs_def.h>\n#endif\n#include|}' "$STAT_C"
           fi
           fi
           echo "✅ fs/stat.c 修复完成"
           grep -n "susfs_is_current_proc\|AS_FLAGS_SUS_KSTAT\|susfs_sus_kstat_spoof" "$STAT_C"
    
      - name: Fix missing symbols in proc_namespace.c and susfs.c
        working-directory: kernel
        run: |
          set -e
          echo "=== 修补 SUS_MOUNT 缺失符号 ==="

          if ! grep -q "extern struct static_key_false susfs_is_hide_sus_mnts_for_non_su_procs_enabled" fs/proc_namespace.c; then
            echo "添加 extern 声明到 fs/proc_namespace.c"
            sed -i '/^extern bool susfs_hide_sus_mnts_for_non_su_procs;$/d' fs/proc_namespace.c
            sed -i '/^#include "internal.h"/a\
            #ifdef CONFIG_KSU_SUSFS_SUS_MOUNT\
            extern struct static_key_false susfs_is_hide_sus_mnts_for_non_su_procs_enabled;\
            extern bool susfs_is_current_ksu_domain(void);\
            #endif' fs/proc_namespace.c
            fi
            sed -i '/^extern bool susfs_hide_sus_mnts_for_non_su_procs;$/d' fs/proc_namespace.c

          # 清理重复定义
          sed -i '/DEFINE_STATIC_KEY_FALSE(susfs_is_hide_sus_mnts_for_non_su_procs_enabled);/d' fs/susfs.c
          LINE=$(grep -n '^DEFINE_STATIC_KEY_FALSE(' fs/susfs.c | head -1 | cut -d: -f1)
          if [ -n "$LINE" ]; then
            sed -i "${LINE}a DEFINE_STATIC_KEY_FALSE(susfs_is_hide_sus_mnts_for_non_su_procs_enabled);" fs/susfs.c
          else
            sed -i '1i DEFINE_STATIC_KEY_FALSE(susfs_is_hide_sus_mnts_for_non_su_procs_enabled);' fs/susfs.c
          fi

          COUNT=$(grep -c "DEFINE_STATIC_KEY_FALSE(susfs_is_hide_sus_mnts_for_non_su_procs_enabled)" fs/susfs.c)
          if [ "$COUNT" -ne 1 ]; then
            echo "❌ 定义数量不为 1"
            exit 1
          fi
          echo "✅ susfs_is_hide_sus_mnts_for_non_su_procs_enabled 唯一定义"

          # 替换旧变量名
          sed -i 's/READ_ONCE(susfs_hide_sus_mnts_for_non_su_procs)/static_branch_unlikely(\&susfs_is_hide_sus_mnts_for_non_su_procs_enabled)/g' fs/proc_namespace.c
          echo "✅ 变量名替换完成"

          # 添加缺失的 AVC 变量
          if ! grep -q "u32 susfs_ksu_sid" fs/susfs.c; then
            sed -i '/^#include "mount.h"/a\
            u32 susfs_ksu_sid = 0;\
            u32 susfs_priv_app_sid = 0;' fs/susfs.c
          fi

      - name: Create dummy seccomp_types.h
        working-directory: kernel
        run: |
          mkdir -p include/linux
          touch include/linux/seccomp_types.h
          echo "✅ 已创建占位文件"

      - name: Configure Kernel
        working-directory: kernel
        run: |
          export ARCH=${{ env.KERNEL_ARCH }}
          export PATH="${{ env.CLANG_DIR }}/bin:$PATH"
          export CCACHE_EXEC=$(which ccache)
          export CCACHE_DIR="${{ env.CCACHE_DIR }}"
          ccache -M 6G
          export LLVM=1 LLVM_IAS=1 CLANG_TRIPLE=aarch64-linux-gnu- \
                 CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi-

          make mrproper || true
          make -j$(nproc) O=${{ env.OUTPUT_DIR }} ${{ env.DEFCONFIG_NAME }}

          scripts/config --file ${{ env.OUTPUT_DIR }}/.config \
            --enable KSU \
            --enable INIT_ON_ALLOC_DEFAULT_ON \
            --enable KSU_HOOK_MANUAL \
            --disable KSU_HOOK_INLINE \
            --disable KSU_HOOK_TRACEPOINT \
            --enable KSU_SELINUX \
            --enable KSU_ZYGISK \
            --disable KPROBES \
            --disable HAVE_KPROBES \
            --disable KPROBE_EVENTS \
            --enable KALLSYMS \
            --enable KALLSYMS_ALL \
            --enable MODULES \
            --enable MODULE_UNLOAD \
            --enable OVERLAY_FS \
            --enable EXT4_FS \
            --enable NAMESPACES \
            --disable KSU_DEBUG \
            --enable KSU_SUSFS \
            --enable KSU_SUSFS_SUS_PATH \
            --enable KSU_SUSFS_SUS_MOUNT \
            --enable KSU_SUSFS_SUS_KSTAT \
            --enable KSU_SUSFS_SPOOF_UNAME \
            --enable KSU_SUSFS_OPEN_REDIRECT \
            --enable KSU_SUSFS_SUS_MAP \
            --enable KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS \
            --enable KSU_SUSFS_ENABLE_LOG \
            --disable KSU_SUSFS_SUS_SU \
            --set-val CONFIG_FRAME_WARN 3072

          make olddefconfig O=${{ env.OUTPUT_DIR }}

      - name: Build Kernel
        working-directory: kernel
        run: |
          set -e
          export ARCH=${{ env.KERNEL_ARCH }}
          export PATH="${{ env.CLANG_DIR }}/bin:$PATH"
          export CCACHE_EXEC=$(which ccache)
          export CCACHE_DIR="${{ env.CCACHE_DIR }}"
          ccache -M 6G
          export LLVM=1 LLVM_IAS=1 CLANG_TRIPLE=aarch64-linux-gnu- \
                 CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi-

          make -j$(nproc) O=${{ env.OUTPUT_DIR }} \
            KCFLAGS="-Wno-strict-prototypes -Wno-align-mismatch -Wno-unused-function -Wno-compare-distinct-pointer-types -Wno-void-pointer-to-int-cast -Wno-array-parameter -Wno-declaration-after-statement"

          if [ ! -f "${{ env.OUTPUT_DIR }}/arch/arm64/boot/Image" ]; then
            echo "ERROR: Kernel Image not found!"
            exit 1
          fi

      - name: Package AnyKernel3
        id: package
        run: |
          TIME=$(date +"%Y.%m.%d")
          AK3_DIR="AnyKernel3"
          IMG_PATH="${{ env.KERNEL_DIR }}/${{ env.OUTPUT_DIR }}/arch/arm64/boot/Image"
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git $AK3_DIR
          cp -f "$IMG_PATH" "$AK3_DIR/Image"

          sed -i 's/^do.devicecheck=1/do.devicecheck=0/' "$AK3_DIR/anykernel.sh"
          sed -i 's/^BLOCK=.*/BLOCK=boot/' "$AK3_DIR/anykernel.sh"
          sed -i 's/^IS_SLOT_DEVICE=0/IS_SLOT_DEVICE=1/' "$AK3_DIR/anykernel.sh"
          sed -i 's/^device.name1=.*/device.name1=star/' "$AK3_DIR/anykernel.sh"

          cd $AK3_DIR
          zip -r9 "../${{ env.DEVICE_CODENAME }}-SUSFS-5.4-${TIME}.zip" ./*
          cd ..
          echo "zip_name=${{ env.DEVICE_CODENAME }}-SUSFS-5.4-${TIME}.zip" >> $GITHUB_OUTPUT

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: kernel_with_susfs_5.4
          path: ${{ env.DEVICE_CODENAME }}-SUSFS-5.4-*.zip

      - name: Optional Release
        if: github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: susfs_5.4_${{ github.run_number }}
          name: "SUSFS 5.4 Build (backslashxx + simonpunk)"
          body: |
            ## 测试内核 - backslashxx/KernelSU + SUSFS 官方 5.4 补丁
            - 使用 Manual Hook
            - 启用 SUS_PATH、SUS_MOUNT、SUS_KSTAT、SPOOF_UNAME、OPEN_REDIRECT、SUS_MAP、ENABLE_LOG
            - 禁用 SUS_SU
            - 刷机有风险，请备份原内核
          files: ${{ env.DEVICE_CODENAME }}-SUSFS-5.4-*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
