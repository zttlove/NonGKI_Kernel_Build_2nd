name: Build Kernel with backslashxx/KernelSU (No SUSFS)

on:
  workflow_dispatch:

env:
  TZ: Asia/Shanghai
  DEVICE_CODENAME: "star"
  KERNEL_ARCH: "arm64"
  KERNEL_REPO: "zttlove/android_kernel_xiaomi_sm8350_miyume"
  KERNEL_BRANCH: "main"
  DEFCONFIG_NAME: "star_defconfig"
  OUTPUT_DIR: "out"
  CLANG_DIR: "${{ github.workspace }}/clang"
  CCACHE_DIR: "${{ github.workspace }}/.ccache"
  KERNEL_DIR: "${{ github.workspace }}/kernel"

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:

      - name: Checkout Kernel Source
        uses: actions/checkout@v4
        with:
          repository: ${{ env.KERNEL_REPO }}
          ref: ${{ env.KERNEL_BRANCH }}
          path: kernel
          fetch-depth: 1

      - name: Install Dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            bc bison flex libelf-dev libssl-dev libncurses-dev \
            make python3 device-tree-compiler git curl xz-utils \
            ccache zip unzip

          echo "正在修复 libtinfo.so.5 依赖..."
          if ! sudo apt install -y libtinfo5; then
            sudo ln -sf /lib/x86_64-linux-gnu/libtinfo.so.6 /lib/x86_64-linux-gnu/libtinfo.so.5
          fi

          if [ ! -f /lib/x86_64-linux-gnu/libtinfo.so.5 ]; then
            echo "::error::libtinfo.so.5 修复失败"
            exit 1
          fi

      - name: Download Clang
        run: |
          mkdir -p ${{ env.CLANG_DIR }}
          curl -L --retry 3 -o clang.tar.xz "https://github.com/llvm/llvm-project/releases/download/llvmorg-18.1.8/clang+llvm-18.1.8-x86_64-linux-gnu-ubuntu-18.04.tar.xz"
          tar -xf clang.tar.xz -C ${{ env.CLANG_DIR }} --strip-components=1
          rm clang.tar.xz
          ${{ env.CLANG_DIR }}/bin/clang --version

      - name: Setup backslashxx/KernelSU
        working-directory: kernel
        run: |
          set -e
          echo "Cloning backslashxx/KernelSU..."
          rm -rf drivers/kernelsu
          git clone -b master https://github.com/backslashxx/KernelSU.git drivers/kernelsu
          cd drivers/kernelsu
          git log --oneline -1
          cd ../..

          # 创建包装文件
          echo "source \"drivers/kernelsu/kernel/Kconfig\"" > drivers/kernelsu/Kconfig
          echo "obj-y += kernel/" > drivers/kernelsu/Makefile
          sed -i '/source "drivers\/kernelsu\/Kconfig"/d' drivers/Kconfig || true
          sed -i '/obj-\$(CONFIG_KSU) += kernelsu\//d' drivers/Makefile || true
          echo "source \"drivers/kernelsu/Kconfig\"" >> drivers/Kconfig
          echo "obj-\$(CONFIG_KSU) += kernelsu/" >> drivers/Makefile

      - name: Clean pre-existing KSU/SUSFS hooks
        working-directory: kernel
        run: |
          echo "=== 强制清理内核源码中的 SUSFS 引用 ==="

          # 1. 删除 kallsyms.c 中的 susfs_def.h 包含
          sed -i '/#include <linux\/susfs_def.h>/d' kernel/kallsyms.c

          # 2. 处理 kallsyms.c 中的 SUSFS 条件编译块（整段移除）
          python3 - << 'EOF'
          import re
          path = 'kernel/kallsyms.c'
          with open(path, 'r') as f:
           content = f.read()
          # 移除 #ifdef CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS ... #endif 块
          content = re.sub(
           r'#ifdef CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS.*?#endif',
           '',
           content,
           flags=re.DOTALL
            )
            # 移除 #ifndef CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS ... #else ... #endif 结构
            content = re.sub(
            r'#ifndef CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS.*?#endif',
            '',
            content,
            flags=re.DOTALL
            )
            with open(path, 'w') as f:
            f.write(content)
            print("✅ kallsyms.c 中的 SUSFS 代码已移除")
            EOF

            # 3. 全局搜索所有 SUSFS 相关的 include 并删除
           find fs/ kernel/ drivers/input/ security/ mm/ -name "*.c" -o -name "*.h" 2>/dev/null | while read f; do
           if grep -q "#include <linux/susfs" "$f" 2>/dev/null; then
            echo "清理 $f"
            sed -i '/#include <linux\/susfs/d' "$f"
            fi
            done

            # 4. 删除 SUSFS 文件（如果存在）
            rm -f fs/susfs.c include/linux/susfs.h include/linux/susfs_def.h

            # 5. 检查残留
            echo "=== 检查残留 ==="
            RESIDUAL=$(grep -rl "susfs_def.h\|#include <linux/susfs" \
               fs/ kernel/ drivers/input/ security/ mm/ 2>/dev/null | \
               grep -v "drivers/kernelsu" || true)
             if [ -n "$RESIDUAL" ]; then
             echo "⚠️ 仍有残留："
             echo "$RESIDUAL"
             else
             echo "✅ 干净了"
             fi

      - name: Apply Manual Hook (backslashxx)
        working-directory: kernel
        run: |
          set -e
          echo "=== 应用 Manual Hook ==="

          # backslashxx/KernelSU 通常提供一个 setup 脚本来应用钩子
          if [ -f "drivers/kernelsu/kernel/setup.sh" ]; then
            echo "找到 setup.sh，正在执行..."
            chmod +x drivers/kernelsu/kernel/setup.sh
            bash drivers/kernelsu/kernel/setup.sh || echo "⚠️ setup.sh 执行完毕（可能有非致命警告）"
          elif [ -f "drivers/kernelsu/setup.sh" ]; then
            echo "找到 setup.sh (根目录)，正在执行..."
            chmod +x drivers/kernelsu/setup.sh
            bash drivers/kernelsu/setup.sh || echo "⚠️ setup.sh 执行完毕"
          else
            echo "未找到 setup.sh，请手动确认 Manual Hook 是否已就位"
            ls -la drivers/kernelsu/
          fi

          echo "✅ Manual Hook 应用完成"

      - name: Configure Kernel
        working-directory: kernel
        run: |
          export ARCH=${{ env.KERNEL_ARCH }}
          export PATH="${{ env.CLANG_DIR }}/bin:$PATH"
          export CCACHE_EXEC=$(which ccache)
          export CCACHE_DIR="${{ env.CCACHE_DIR }}"
          ccache -M 6G
          export LLVM=1 LLVM_IAS=1 CLANG_TRIPLE=aarch64-linux-gnu- \
                 CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi-

          make mrproper || true
          make -j$(nproc) O=${{ env.OUTPUT_DIR }} ${{ env.DEFCONFIG_NAME }}

          scripts/config --file ${{ env.OUTPUT_DIR }}/.config \
            --enable KSU \
            --enable INIT_ON_ALLOC_DEFAULT_ON \
            --enable KSU_HOOK_MANUAL \
            --disable KSU_HOOK_INLINE \
            --disable KSU_HOOK_TRACEPOINT \
            --enable KSU_SELINUX \
            --enable KSU_ZYGISK \
            --disable KPROBES \
            --disable HAVE_KPROBES \
            --disable KPROBE_EVENTS \
            --enable KALLSYMS \
            --enable KALLSYMS_ALL \
            --enable MODULES \
            --enable MODULE_UNLOAD \
            --enable OVERLAY_FS \
            --enable EXT4_FS \
            --enable NAMESPACES \
            --disable KSU_DEBUG \
            --set-val CONFIG_FRAME_WARN 3072

          make olddefconfig O=${{ env.OUTPUT_DIR }}

      - name: Build Kernel
        working-directory: kernel
        run: |
          set -e
          export ARCH=${{ env.KERNEL_ARCH }}
          export PATH="${{ env.CLANG_DIR }}/bin:$PATH"
          export CCACHE_EXEC=$(which ccache)
          export CCACHE_DIR="${{ env.CCACHE_DIR }}"
          ccache -M 6G
          export LLVM=1 LLVM_IAS=1 CLANG_TRIPLE=aarch64-linux-gnu- \
                 CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi-

          make -j$(nproc) O=${{ env.OUTPUT_DIR }} \
            KCFLAGS="-Wno-strict-prototypes -Wno-align-mismatch -Wno-unused-function -Wno-compare-distinct-pointer-types -Wno-void-pointer-to-int-cast -Wno-array-parameter -Wno-declaration-after-statement"

          if [ ! -f "${{ env.OUTPUT_DIR }}/arch/arm64/boot/Image" ]; then
            echo "ERROR: Kernel Image not found!"
            exit 1
          fi

      - name: Package AnyKernel3
        id: package
        run: |
          TIME=$(date +"%Y.%m.%d")
          AK3_DIR="AnyKernel3"
          IMG_PATH="${{ env.KERNEL_DIR }}/${{ env.OUTPUT_DIR }}/arch/arm64/boot/Image"
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git $AK3_DIR
          cp -f "$IMG_PATH" "$AK3_DIR/Image"

          sed -i 's/^do.devicecheck=1/do.devicecheck=0/' "$AK3_DIR/anykernel.sh"
          sed -i 's/^BLOCK=.*/BLOCK=boot/' "$AK3_DIR/anykernel.sh"
          sed -i 's/^IS_SLOT_DEVICE=0/IS_SLOT_DEVICE=1/' "$AK3_DIR/anykernel.sh"
          sed -i 's/^device.name1=.*/device.name1=star/' "$AK3_DIR/anykernel.sh"

          cd $AK3_DIR
          zip -r9 "../${{ env.DEVICE_CODENAME }}-backslashxx-${TIME}.zip" ./*
          cd ..
          echo "zip_name=${{ env.DEVICE_CODENAME }}-backslashxx-${TIME}.zip" >> $GITHUB_OUTPUT

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: kernel_backslashxx
          path: ${{ env.DEVICE_CODENAME }}-backslashxx-*.zip

      - name: Optional Release
        if: github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: backslashxx_${{ github.run_number }}
          name: "KernelSU backslashxx Build"
          body: |
            ## 测试内核 - backslashxx/KernelSU
            - 无 SUSFS 功能（已放弃）
            - Manual Hook 模式
            - 刷机有风险，请备份原内核
          files: ${{ env.DEVICE_CODENAME }}-backslashxx-*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
