name: Build Kernel with BakaSU (perfect)

on:
  workflow_dispatch:
    inputs:
      device:
        description: 'star'
        required: true
        default: 'star'
        type: choice
        options:
          - star
          - mars
      bakasu_ref:dev
        description: 'BakaSU 分支或标签'
        required: false
        default: 'main'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  TZ: Asia/Shanghai
  DEVICE_CODENAME: ${{ github.event.inputs.device || 'star' }}
  KERNEL_ARCH: "arm64"
  KERNEL_REPO: "zttlove/android_kernel_xiaomi_sm8350-hyperos"
  KERNEL_BRANCH: "dynamic"
  DEFCONFIG_NAME: "vendor/${{ github.event.inputs.device || 'star' }}_defconfig"
  OUTPUT_DIR: "out"
  CLANG_DIR: "${{ github.workspace }}/clang"
  CCACHE_DIR: "${{ github.workspace }}/.ccache"
  KERNEL_DIR: "${{ github.workspace }}/kernel"

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:

      - name: Checkout Kernel Source
        uses: actions/checkout@v4
        with:
          repository: ${{ env.KERNEL_REPO }}
          ref: ${{ env.KERNEL_BRANCH }}
          path: kernel
          fetch-depth: 1

      - name: Checkout Workflow Repo (Patches)
        uses: actions/checkout@v4
        with:
          path: workflow_repo
          fetch-depth: 1

      - name: Install Dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            bc bison flex libelf-dev libssl-dev libncurses-dev \
            make python3 device-tree-compiler git curl xz-utils \
            ccache zip unzip zstd
          echo "正在修复 libtinfo.so.5 依赖..."
          if ! sudo apt install -y libtinfo5; then
            sudo ln -sf /lib/x86_64-linux-gnu/libtinfo.so.6 /lib/x86_64-linux-gnu/libtinfo.so.5
          fi
          if [ ! -f /lib/x86_64-linux-gnu/libtinfo.so.5 ]; then
            echo "::error::修复失败！libtinfo.so.5 仍然不存在。"
            exit 1
          else
            echo "✅ libtinfo.so.5 修复成功！"
          fi

      - name: Cache Clang 17.0.6
        id: cache-clang
        uses: actions/cache@v4
        with:
          path: ${{ env.CLANG_DIR }}
          key: clang-17.0.6-ubuntu-22.04

      - name: Download Clang 17.0.6 (Official Kernel Toolchain)
        if: steps.cache-clang.outputs.cache-hit != 'true'
        run: |
          mkdir -p ${{ env.CLANG_DIR }}
          curl -L --retry 3 -o clang+llvm-17.0.6-x86_64-linux-gnu-ubuntu-22.04.tar.xz "https://github.com/llvm/llvm-project/releases/download/llvmorg-17.0.6/clang+llvm-17.0.6-x86_64-linux-gnu-ubuntu-22.04.tar.xz"
          tar -xf clang+llvm-17.0.6-x86_64-linux-gnu-ubuntu-22.04.tar.xz -C ${{ env.CLANG_DIR }} --strip-components=1
          rm clang+llvm-17.0.6-x86_64-linux-gnu-ubuntu-22.04.tar.xz
          ${{ env.CLANG_DIR }}/bin/clang --version

      - name: Integrate BakaSU into Kernel (curl method)
        working-directory: kernel
        run: |
          set -e
          export ARCH=${{ env.KERNEL_ARCH }}
          export PATH="${{ env.CLANG_DIR }}/bin:$PATH"
          export CCACHE_EXEC=$(which ccache)
          export CCACHE_DIR="${{ env.CCACHE_DIR }}"
          ccache -M 6G
          export LLVM=1 LLVM_IAS=1 CLANG_TRIPLE=aarch64-linux-gnu- \
                 CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi-

          echo "=== 手动创建 seccomp_types.h 以规避 grep 警告 ==="
          if [ ! -f "include/linux/seccomp_types.h" ]; then
            touch "include/linux/seccomp_types.h"
            echo "✅ 已创建空的 seccomp_types.h"
          else
            echo "ℹ️ seccomp_types.h 已存在，跳过"
          fi

          echo "=== 删除内核源码中自带的旧版 KernelSU/ReSukiSU 目录 ==="
          rm -rf KernelSU
          rm -rf drivers/kernelsu
          rm -rf drivers/KernelSU
          echo "✅ 旧版目录已清理干净"

          echo "=== 使用 curl 方式集成 BakaSU (${{ github.event.inputs.bakasu_ref || 'main' }}) ==="
          curl -LSs "https://raw.githubusercontent.com/Baka-SU/BakaSU/${{ github.event.inputs.bakasu_ref || 'main' }}/kernel/setup.sh" | bash

          
          
          echo "=== 检查集成结果 ==="
          if [ -d "drivers/kernelsu" ]; then
            echo "✅ drivers/kernelsu 目录已存在"
            echo "软链接指向：$(readlink -f drivers/kernelsu)"
          else
            echo "::error::集成失败，drivers/kernelsu 目录不存在"
            exit 1
          fi

          echo "=== 修复 ksu_selinux_status_lock 未定义问题（在集成后执行） ==="
          KSU_SELINUX_FILE="drivers/kernelsu/selinux/selinux.c"
          if [ -f "$KSU_SELINUX_FILE" ]; then
            if ! grep -q "DEFINE_SPINLOCK(ksu_selinux_status_lock)" "$KSU_SELINUX_FILE"; then
              echo "DEFINE_SPINLOCK(ksu_selinux_status_lock);" >> "$KSU_SELINUX_FILE"
              echo "✅ 已添加 ksu_selinux_status_lock 定义"
            else
              echo "ℹ️ ksu_selinux_status_lock 已存在，跳过"
            fi
          else
            echo "⚠️ 未找到 $KSU_SELINUX_FILE，尝试查找其他位置"
            find drivers/kernelsu -name "*.c" -exec grep -l "ksu_selinux_status_lock" {} \; | while read f; do
              if ! grep -q "DEFINE_SPINLOCK(ksu_selinux_status_lock)" "$f"; then
                echo "DEFINE_SPINLOCK(ksu_selinux_status_lock);" >> "$f"
                echo "✅ 已在 $f 中添加定义"
              fi
            done
          fi

          echo "=== 导出 BakaSU 版本信息 ==="
          echo "BAKASU_COMMIT=$(cd KernelSU && git rev-parse --short HEAD 2>/dev/null || echo 'unknown')" >> $GITHUB_ENV
          BAKASU_VERSION=$(grep -r "versionCode" drivers/kernelsu/ 2>/dev/null | head -n1 | awk -F= '{print $2}' | tr -d ' ;' || echo 'unknown')
          echo "BAKASU_VERSION=${BAKASU_VERSION}" >> $GITHUB_ENV
          echo "✅ BakaSU 提交: ${{ env.BAKASU_COMMIT }}"
          echo "✅ BakaSU 版本: ${{ env.BAKASU_VERSION }}"

          echo "正在清空 ccache 缓存..."
          ccache -C

          echo "正在修复 focaltech_3680 Makefile..."
          FOCALTECH_MAKEFILE="drivers/input/touchscreen/focaltech_3680/Makefile"
          if [ -f "$FOCALTECH_MAKEFILE" ]; then
            sed -i 's/^ \+/\t/' "$FOCALTECH_MAKEFILE"
            echo "✅ 已修复 focaltech_3680 Makefile 缩进"
          fi

          echo "=== 为 msm_minidump 子目录追加 -Wno-unused-variable ==="
          MINIDUMP_MAKEFILE="drivers/soc/qcom/Makefile"
          if [ -f "$MINIDUMP_MAKEFILE" ]; then
            if ! grep -q "Wno-unused-variable" "$MINIDUMP_MAKEFILE"; then
              echo "ccflags-y += -Wno-unused-variable" >> "$MINIDUMP_MAKEFILE"
              echo "✅ 已为 drivers/soc/qcom Makefile 追加 -Wno-unused-variable"
            else
              echo "ℹ️ drivers/soc/qcom Makefile 已包含该选项，跳过"
            fi
          else
            echo "ℹ️ 未找到 drivers/soc/qcom/Makefile，跳过"
          fi

          echo "=== 为 thermal 子目录追加 -Wno-fortify-source ==="
          THERMAL_MAKEFILE="drivers/thermal/Makefile"
          if [ -f "$THERMAL_MAKEFILE" ]; then
            if ! grep -q "Wno-fortify-source" "$THERMAL_MAKEFILE"; then
              echo "ccflags-y += -Wno-fortify-source" >> "$THERMAL_MAKEFILE"
              echo "✅ 已为 drivers/thermal Makefile 追加 -Wno-fortify-source"
            else
              echo "ℹ️ drivers/thermal Makefile 已包含该选项，跳过"
            fi
          else
            echo "ℹ️ 未找到 drivers/thermal/Makefile，跳过"
          fi

          echo "=== 为 bootinfo 子目录追加 -Wno-unused-result ==="
          BOOTINFO_MAKEFILE="techpack/bootinfo/Makefile"
          if [ -f "$BOOTINFO_MAKEFILE" ]; then
            if ! grep -q "Wno-unused-result" "$BOOTINFO_MAKEFILE"; then
              echo "ccflags-y += -Wno-unused-result" >> "$BOOTINFO_MAKEFILE"
              echo "✅ 已为 techpack/bootinfo Makefile 追加 -Wno-unused-result"
            else
              echo "ℹ️ techpack/bootinfo Makefile 已包含该选项，跳过"
            fi
          else
            echo "ℹ️ 未找到 techpack/bootinfo/Makefile，跳过"
          fi

          echo "=== 为 dwc3 子目录追加 -Wno-unused-label ==="
          DWC3_MAKEFILE="drivers/usb/dwc3/Makefile"
          if [ -f "$DWC3_MAKEFILE" ]; then
            if ! grep -q "Wno-unused-label" "$DWC3_MAKEFILE"; then
              echo "ccflags-y += -Wno-unused-label" >> "$DWC3_MAKEFILE"
              echo "✅ 已为 drivers/usb/dwc3 Makefile 追加 -Wno-unused-label"
            else
              echo "ℹ️ drivers/usb/dwc3 Makefile 已包含该选项，跳过"
            fi
          else
            echo "ℹ️ 未找到 drivers/usb/dwc3/Makefile，跳过"
          fi

          echo "正在彻底清理残留文件..."
          rm -rf ${{ env.OUTPUT_DIR }}
          rm -f .config
          rm -rf include/config include/generated
          make mrproper

          echo "正在生成 out/.config ..."
          make -j$(nproc) O=${{ env.OUTPUT_DIR }} ${{ env.DEFCONFIG_NAME }}
          
          if [ ! -f "${{ env.OUTPUT_DIR }}/.config" ]; then
            echo "::error::make defconfig 失败，out/.config 不存在！"
            exit 1
          fi
          echo "✅ out/.config 生成成功"

          echo "=== 启用 BakaSU 相关配置，并设置自定义 LOCALVERSION ==="
          scripts/config --file ${{ env.OUTPUT_DIR }}/.config \
            --enable KSU \
            --enable KSU_MANUAL_HOOK \
            --disable KSU_TRACEPOINT_HOOK \
            --enable KSU_SUSFS \
            --enable KSU_SUSFS_SUS_PATH \
            --enable KSU_SUSFS_SUS_MOUNT \
            --enable KSU_SUSFS_SUS_KSTAT \
            --enable KSU_SUSFS_SPOOF_UNAME \
            --enable KSU_SUSFS_OPEN_REDIRECT \
            --enable KSU_SUSFS_SUS_MAP \
            --enable KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS \
            --disable KSU_SUSFS_ENABLE_LOG \
            --enable KSU_SUSFS_SUS_SU \
            --enable KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG \
            --disable HEADERS_INSTALL \
            --set-val FRAME_WARN 131072 \
            --set-str LOCALVERSION "-edwin-star-260927-qgqi"

          echo "=== 同步配置，避免构建时因 .config 不同步而进入交互模式 ==="
          make O=${{ env.OUTPUT_DIR }} olddefconfig 2>&1 | tee olddefconfig.log
          echo "✅ 配置已同步"

          echo "=== 检查 KSU 配置是否生效 ==="
          if grep -q "CONFIG_KSU=y" ${{ env.OUTPUT_DIR }}/.config; then
            echo "✅ CONFIG_KSU 已启用"
          else
            echo "::error::CONFIG_KSU 未启用！"
            exit 1
          fi

          if grep -q "CONFIG_KSU_MANUAL_HOOK=y" ${{ env.OUTPUT_DIR }}/.config; then
            echo "✅ CONFIG_KSU_MANUAL_HOOK 已启用"
          fi

          if grep -q 'CONFIG_LOCALVERSION="-edwin-star-260927-qgqi"' ${{ env.OUTPUT_DIR }}/.config; then
            echo "✅ LOCALVERSION 已设置为 -edwin-star-260927-qgqi"
          fi

          if grep -q "CONFIG_FRAME_WARN=131072" ${{ env.OUTPUT_DIR }}/.config; then
            echo "✅ FRAME_WARN 已放宽至 131072"
          fi

      - name: Build Kernel
        working-directory: kernel
        run: |
          set +e
          export ARCH=${{ env.KERNEL_ARCH }}
          export PATH="${{ env.CLANG_DIR }}/bin:$PATH"
          export CCACHE_EXEC=$(which ccache)
          export CCACHE_DIR="${{ env.CCACHE_DIR }}"
          ccache -M 6G
          export LLVM=1 LLVM_IAS=1 CLANG_TRIPLE=aarch64-linux-gnu- \
                 CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi-

          echo "=== 开始编译内核（实时输出，显示所有警告，全速执行） ==="
          echo "=== 栈帧警告限制已放宽为 131072 ==="

          MEM_GB=$(free -g | awk '/^Mem:/{print $2}')
          if [ "$MEM_GB" -lt 8 ]; then
            JOBS=4
          else
            JOBS=$(nproc)
          fi
          echo "=== 检测到内存 ${MEM_GB}GB，使用 -j${JOBS} ==="

          make -j${JOBS} O=${{ env.OUTPUT_DIR }} \
               KCFLAGS="-Wno-error -Wframe-larger-than=131072 -Wno-strict-prototypes -Wno-align-mismatch -Wno-unused-function -Wno-compare-distinct-pointer-types -Wno-void-pointer-to-int-cast -Wno-array-parameter -Wno-declaration-after-statement -Wno-sometimes-uninitialized -Wno-unused-variable -Wno-misleading-indentation -Wno-fortify-source -Wno-macro-redefined -Wno-unused-result -Wno-unused-label" \
               HOSTCFLAGS="" \
               2>&1 | tee build.log
          BUILD_STATUS=${PIPESTATUS[0]}

          if [ $BUILD_STATUS -ne 0 ]; then
            echo "::error::编译失败，退出码 $BUILD_STATUS"
            exit 1
          fi

          if [ ! -f "${{ env.OUTPUT_DIR }}/arch/arm64/boot/Image" ]; then
            echo "::error::编译失败，未生成 Image"
            exit 1
          fi

          echo "✅ 编译成功，Image 已生成"

      # ============================================================
      # 4. 打包 AnyKernel3
      # ============================================================
      - name: Package AnyKernel3
        id: package
        run: |
          set -e
          TIME=$(date +"%Y.%m.%d")
          AK3_DIR="AnyKernel3"
          IMG_PATH="${{ env.KERNEL_DIR }}/${{ env.OUTPUT_DIR }}/arch/arm64/boot/Image"
          
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git $AK3_DIR
          
          gzip -9 -c "$IMG_PATH" > "$AK3_DIR/Image.gz"
          ls -lh "$AK3_DIR/Image.gz"
          
          cat > "$AK3_DIR/anykernel.sh" << 'AK3EOF'
          #!/sbin/sh

          ### AnyKernel3 Flashable Kernel Script
          ## Adapted for Xiaomi Mi 11 Ultra (star) with BakaSU

          properties() { '
          kernel.string=5.4.302-edwin-star-260927-qgqi+ BakaSU for Xiaomi 11 Ultra
          do.devicecheck=1
          do.modules=0
          do.systemless=0
          do.cleanup=1
          do.cleanuponabort=0
          device.name1=star
          device.name2=mars
          device.name3=
          device.name4=
          device.name5=
          supported.versions=
          supported.patchlevels=
          supported.vendorpatchlevels=
          '; } # end properties

          # boot shell variables
          BLOCK=boot;
          IS_SLOT_DEVICE=1;
          RAMDISK_COMPRESSION=auto;
          PATCH_VBMETA_FLAG=auto;

          # import functions/variables and setup patching - do not remove
          . tools/ak3-core.sh;

          # pure kernel swap: keep the existing ramdisk and repack with the new Image.gz
          split_boot;
          flash_boot;
          AK3EOF
          
          chmod +x "$AK3_DIR/anykernel.sh"
          echo "=== 生成的 anykernel.sh ==="
          cat "$AK3_DIR/anykernel.sh"
          
          cd $AK3_DIR
          zip -r9 "../${{ env.DEVICE_CODENAME }}-BakaSU-${TIME}.zip" ./*
          
          sha256sum "../${{ env.DEVICE_CODENAME }}-BakaSU-${TIME}.zip" > "../SHA256SUMS.txt"
          echo "=== SHA256 校验值 ==="
          cat ../SHA256SUMS.txt

          echo "zip_name=${{ env.DEVICE_CODENAME }}-BakaSU-${TIME}.zip" >> $GITHUB_OUTPUT

      # ============================================================
      # 5. 上传
      # ============================================================
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: kernel_bakasu
          path: |
            ${{ env.DEVICE_CODENAME }}-BakaSU-*.zip
            SHA256SUMS.txt

      - name: Upload build.log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build_log
          path: kernel/build.log
          if-no-files-found: ignore

      - name: Optional Release
        if: github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: bakasu_${{ github.run_number }}
          name: "BakaSU Kernel (LLVM 17.0.6, main branch)"
          body: |
            ## 测试内核 - BakaSU 集成版

            ### 内核信息
            - 内核版本：5.4.302
            - 编译工具链：Clang 17.0.6 + LLD 17.0.6
            - LOCALVERSION：`-edwin-star-260927-qgqi`
            - BakaSU 提交：${{ env.BAKASU_COMMIT }}
            - BakaSU 版本：${{ env.BAKASU_VERSION }}

            ### 特性
            - BakaSU main 分支最新代码
            - KSU_MANUAL_HOOK + SUSFS v2.3.0 全套隐藏功能
            - Backport BPF（源自 Kernel 5.10）
            - 启用 LTO (ThinLTO)
            - 启用 f2fs 文件系统优化

            ### 兼容性
            - 支持 HyperOS 4.0 / Android 17
            - MIUI Android 13 及以上测试正常

            ### 刷机提示
            - 刷机有风险，请务必先备份原 boot 分区
            - 首次刷机后建议重启两次，让 SUSFS 初始化完成
          files: |
            ${{ env.DEVICE_CODENAME }}-BakaSU-*.zip
            SHA256SUMS.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
