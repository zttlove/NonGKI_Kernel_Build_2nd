      - name: Fix ignored kstrtou32 return in bootinfo.c (no behavior change)
        working-directory: kernel
        # 纯编译警告/无行为变更补丁：三层防御，任何一层生效即静默该警告
        # （diag/r5 同款；slim13 之前缺这步）。
        #   L1 精确 anchor 替换（return 透传）
        #   L2 宽松正则（容忍行尾空白差异）
        #   L3 文件头插入 #pragma clang diagnostic —— 编译器直读、必生效。
        #      为什么需要 L3：techpack 是独立 Kbuild 体系，全局 KCFLAGS 的
        #      -Wno-unused-result 传导不进该目录，所以 Build 步骤里带了
        #      该参数警告依然出现；写进文件本身则一定生效。
        continue-on-error: true
        run: |
          set -euo pipefail
          # techpack/bootinfo/bootinfo.c: get_powerup_reason()/get_powerdown_reason()
          # 忽略 kstrtou32 返回值（-Wunused-result）。解析失败时全局 pu/pd_reason
          # 本就保持 0，且调用方（powerup_reason_show 等 5 处）全部忽略本函数返回值
          # ——改为 return kstrtou32(...) 透传，警告消除，行为零变化。
          python3 <<'PYEOF'
          import os, re, sys
          p = "techpack/bootinfo/bootinfo.c"
          if not os.path.exists(p):
              print("::warning::bootinfo.c not found - skipping (non-fatal)")
              sys.exit(0)
          s = open(p).read()
          fixed = []
          for var in ("pu_reason", "pd_reason"):
              # L1 精确：kstrtou32 行 + 紧随 return 0;
              old = "\tkstrtou32(buf, 16, &" + var + ");\n\treturn 0;\n"
              new = "\treturn kstrtou32(buf, 16, &" + var + ");\n"
              if s.count(old) == 1:
                  s = s.replace(old, new)
                  fixed.append(var + "(L1)")
                  continue
              # L2 宽松正则：容忍行尾空白；仅当模式唯一命中才替换
              pat = re.compile(r'\tkstrtou32\(buf, 16, &' + var + r'\);[ \t]*\n\treturn 0;[ \t]*\n')
              if len(pat.findall(s)) == 1:
                  s = pat.sub(new, s, count=1)
                  fixed.append(var + "(L2)")
          if fixed:
              open(p, "w").write(s)
              print("-- bootinfo.c: kstrtou32 return propagated:", ", ".join(fixed))
          else:
              print("-- bootinfo.c: L1/L2 anchors unmatched; applying L3 pragma suppress")
          # L3 兜底（无条件执行）：在首个 #include 前插入 diagnostic pragma，
          # 对整个文件的 -Wunused-result 一律静默。pragma 是编译器直读的，
          # 不依赖任何 Kbuild 传导，这一层不存在"没生效"的可能。
          PRAGMA = '#pragma clang diagnostic ignored "-Wunused-result"\n'
          if PRAGMA not in s:
              idx = s.find("#include")
              if idx == -1:
                  raise SystemExit("::error::bootinfo.c has no #include - unexpected source, abort")
              open(p, "w").write(s[:idx] + PRAGMA + s[idx:])
              print("-- bootinfo.c: L3 -Wunused-result pragma inserted before first #include")
          PYEOF
          # 终验：pragma 必须在文件里（L1/L2 改不改源码，L3 都保证警告消失）
          grep -q '#pragma clang diagnostic ignored "-Wunused-result"' techpack/bootinfo/bootinfo.c \
            || { echo "::error::bootinfo.c pragma missing"; exit 1; }
          echo "-- verified: bootinfo.c -Wunused-result suppression in place"

      - name: Fix misleading indentation in cam_flash_core.c add_req block
        working-directory: kernel
        # 纯编译警告/无行为变更补丁：锚点若因上游漂移失配，只告警不中断构建。
        # 三层防御（与 bootinfo.c -Wunused-result 同款思路）：
        #   L1 行级锚点：按实际缩进补回守卫大括号（恢复 CAF 原始写法，行为零变化）。
        #      不硬编码缩进深度，从实际行提取缩进——上一版按 2/3 tab 硬编码，
        #      实际源码是 4/6 tab，锚点必失配（这就是警告漏网的原因）。
        #   L2 容错：锚点漂移时仅告警、靠 L3 兜底。
        #   L3 文件内 #pragma clang diagnostic —— 编译器直读必生效。techpack 是
        #      独立 Kbuild 体系，全局 KCFLAGS 的 -Wno-misleading-indentation
        #      传导不进该目录；写进文件本身则一定生效（与 bootinfo L3 同理）。
        continue-on-error: true
        run: |
          set -euo pipefail
          # techpack/camera_star/.../cam_flash_core.c cam_flash_i2c_pkt_parser():
          # 守卫 if (crm_cb && crm_cb->add_req) 丢失左大括号（合并腐蚀），内层
          # if (rc) 错误检查缩进过深触发 -Wmisleading-indentation。可达路径上
          # 守卫内外等价：未调用 add_req 时 rc 恒为函数入口初值 0（NOP 路径
          # goto 前不碰 rc），补回大括号恢复 CAF 原始写法，行为零变化。
          python3 <<'PYEOF'
          import sys
          p = "techpack/camera_star/drivers/cam_sensor_module/cam_flash/cam_flash_core.c"
          s = open(p).read()
          PRAGMA = '#pragma clang diagnostic ignored "-Wmisleading-indentation"\n'
          if 'fctrl->bridge_intf.crm_cb->add_req) {' in s:
              print("-- cam_flash_core.c: guard braces already present (skip surgery)")
          else:
              lines = s.splitlines(keepends=True)
              gi = next((i for i, ln in enumerate(lines)
                         if ln.strip() == "if (fctrl->bridge_intf.crm_cb &&"
                         and lines[i + 1].strip() == "fctrl->bridge_intf.crm_cb->add_req)"), None)
              if gi is None:
                  print("::warning::cam_flash guard anchor not found - relying on L3 pragma (non-fatal)")
              else:
                  call, err = lines[gi + 2], lines[gi + 3]
                  assert call.strip() == "rc = fctrl->bridge_intf.crm_cb->add_req(&add_req);", \
                      "add_req call line drifted - manual review needed"
                  es = err.strip()
                  assert es.startswith("if") and "(rc) {" in es, \
                      "if (rc) line drifted - manual review needed"
                  # 找内层 if (rc) 块的收尾 '}'：花括号计数（本块 CAM_ERR 消息串
                  # 不含大括号字面量，计数安全）
                  depth, j = 0, gi + 3
                  while j < len(lines):
                      depth += lines[j].count("{") - lines[j].count("}")
                      if depth == 0:
                          break
                      j += 1
                  assert depth == 0 and lines[j].strip() == "}", \
                      "inner if(rc) close brace not found - manual review needed"
                  indent = lines[gi][: len(lines[gi]) - len(lines[gi].lstrip())]
                  lines[gi + 1] = lines[gi + 1].rstrip() + " {\n"      # 守卫补 '{'
                  lines[gi + 3] = err.replace("if  (rc)", "if (rc)")   # 双空格归一
                  lines.insert(j + 1, indent + "}\n")                  # 守卫补 '}'
                  s = "".join(lines)
                  print(f"-- cam_flash_core.c: guard braces restored (guard L{gi + 1}, close after L{j + 1})")
          # L3 兜底（无条件执行）：编译器直读、不依赖 Kbuild 传导，必生效。
          if PRAGMA not in s:
              idx = s.find("#include")
              if idx == -1:
                  sys.exit("::error::cam_flash_core.c has no #include - unexpected source")
              s = s[:idx] + PRAGMA + s[idx:]
              print("-- cam_flash_core.c: L3 -Wmisleading-indentation pragma inserted")
          open(p, "w").write(s)
          PYEOF
          # 终验：pragma 必须在文件里（L1 大括号补没补上，L3 都保证警告消失）
          grep -q '#pragma clang diagnostic ignored "-Wmisleading-indentation"' \
            techpack/camera_star/drivers/cam_sensor_module/cam_flash/cam_flash_core.c \
            || { echo "::error::cam_flash_core.c pragma missing"; exit 1; }
          echo "-- verified: cam_flash_core.c -Wmisleading-indentation suppression in place"

      - name: Fix mixed-type min() in tcp_output.c srtt clamp (no behavior change)
        working-directory: kernel
        # 纯编译警告/无行为变更补丁。net/ipv4/tcp_output.c 第 2028 行附近：
        #   threshold = min(srtt_in_ns >> 1, NSEC_PER_MSEC);
        # srtt_in_ns >> 1 是 u64（unsigned long long），NSEC_PER_MSEC 是 long，
        # min() 宏内 __typecheck 用两个不同类型指针比较，触发
        # -Wcompare-distinct-pointer-types。
        # 修法：min() -> min_t(u64, ...)（内核标准写法）。NSEC_PER_MSEC =
        # 1000000L 恒为正、转 u64 数值不变，比较结果不变，行为零变化。
        # net/ipv4 属主 Kbuild 体系（全局 KCFLAGS 可传导），直接改代码最干净，
        # 不额外加 -Wno 编译旗标。
        continue-on-error: true
        run: |
          set -euo pipefail
          python3 <<'PYEOF'
          import re
          p = "net/ipv4/tcp_output.c"
          s = open(p).read()
          old = "threshold = min(srtt_in_ns >> 1, NSEC_PER_MSEC);"
          new = "threshold = min_t(u64, srtt_in_ns >> 1, NSEC_PER_MSEC);"
          if new in s:
              print("-- tcp_output.c: min_t fix already present (idempotent)")
          elif old in s:
              n = s.count(old)
              assert n == 1, f"anchor count {n} != 1 (source moved?)"
              open(p, "w").write(s.replace(old, new))
              print("-- tcp_output.c: min() -> min_t(u64,...) (types unified, no behavior change)")
          else:
              # L2 宽松正则：容忍空白差异（anchor 因上游漂移时的降级路径）
              pat = re.compile(
                  r'threshold\s*=\s*min\(\s*srtt_in_ns\s*>>\s*1\s*,\s*NSEC_PER_MSEC\s*\)\s*;')
              hits = pat.findall(s)
              assert len(hits) == 1, f"regex anchor count {len(hits)} != 1 - manual review needed"
              s = pat.sub('threshold = min_t(u64, srtt_in_ns >> 1, NSEC_PER_MSEC);', s)
              open(p, "w").write(s)
              print("-- tcp_output.c: min() -> min_t(u64,...) via L2 regex (whitespace-tolerant)")
          PYEOF
          grep -q 'min_t(u64, srtt_in_ns >> 1, NSEC_PER_MSEC)' net/ipv4/tcp_output.c \
            || { echo "::error::tcp_output.c min_t fix verification failed"; exit 1; }
          echo "-- verified: tcp_output.c min_t(u64) fix in place"

      - name: Fix misleading indentation in cyttsp5_device_access.c (pure reindent)
        working-directory: kernel
        # 纯编译警告/无行为变更补丁：anchor 若因上游漂移失配，只告警不中断构建
        # （与 diag / r5 同款步骤；slim13 之前缺这步导致三处 -Wmisleading-
        # indentation 漏网）。
        continue-on-error: true
        run: |
          set -euo pipefail
          # drivers/input/touchscreen/cyttsp5/cyttsp5_device_access.c 三处缩进腐烂：
          # 1) cmcp_test store: if 体仅 range_check=0，后续 cmcp_* 赋值无条件执行
          #    （上游 Parade 原始语义；若塞进 if 内，写 CMCP_FULL 永不更新
          #    cmcp_test_items，测试机直接坏）——按编译语义重排。
          # 2/3) CM/Cm 打印循环: for 体仅 prepare_print_data，行尾换行
          #    prepare_print_string("\n") 在 j 循环外每行一次（语义正确）——
          #    续行缩进混乱（6/2/8、7/4/7 tab）误导 clang，重排为正常层级。
          # 三处均为纯缩进调整，token 流不变（构建时以去空白等价性断言兜底）。
          python3 <<'PYEOF'
          import os, re, sys
          p = "drivers/input/touchscreen/cyttsp5/cyttsp5_device_access.c"
          if not os.path.exists(p):
              print("::warning::cyttsp5_device_access.c not found - skipping (non-fatal)")
              sys.exit(0)
          s = open(p).read()
          old1 = ("\tif (test_item > 0 && test_item < 5)\n"
                  "\t\trange_check = 0;\n"
                  "\t\tdad->cmcp_test_items = test_item;\n"
                  "\t\tdad->cmcp_range_check = range_check;\n"
                  "\t\tdad->cmcp_force_calibrate = force_calibrate;\n"
                  "\t\tparade_debug(dev, DEBUG_LEVEL_2,\n"
                  "\t\t\t\"%s: Test item is %s; Range check is %s; Force calibrate is %s.\\n\",\n"
                  "\t\t\t__func__,\n"
                  "\t\t\tcmcp_test_case_array[test_item],\n"
                  "\t\t\tcmcp_test_range_check_array[range_check],\n"
                  "\t\t\tcmcp_test_force_cal_array[force_calibrate]);\n")
          new1 = ("\tif (test_item > 0 && test_item < 5)\n"
                  "\t\trange_check = 0;\n"
                  "\tdad->cmcp_test_items = test_item;\n"
                  "\tdad->cmcp_range_check = range_check;\n"
                  "\tdad->cmcp_force_calibrate = force_calibrate;\n"
                  "\tparade_debug(dev, DEBUG_LEVEL_2,\n"
                  "\t\t\"%s: Test item is %s; Range check is %s; Force calibrate is %s.\\n\",\n"
                  "\t\t__func__,\n"
                  "\t\tcmcp_test_case_array[test_item],\n"
                  "\t\tcmcp_test_range_check_array[range_check],\n"
                  "\t\tcmcp_test_force_cal_array[force_calibrate]);\n")
          old2 = ("\t\t\t\t\tfor (j = 1; j < tx_num; j++)\n"
                  "\t\t\t\t\t\tindex = prepare_print_data(\n"
                  "\t\t\t\t\t\tout_buf,\n"
                  "\t\t\t&cmcp_info->cm_sensor_column_delta[(j-1)*rx_num+i],\n"
                  "\t\t\t\t\t\tindex, 1);\n"
                  "\t\t\t\t\t\tindex = prepare_print_string(\n"
                  "\t\t\t\t\t\t\t\tout_buf,\n"
                  "\t\t\t\t\t\t\t\t\"\\n\", index);\n")
          new2 = ("\t\t\t\t\tfor (j = 1; j < tx_num; j++)\n"
                  "\t\t\t\t\t\tindex = prepare_print_data(\n"
                  "\t\t\t\t\t\t\tout_buf,\n"
                  "\t\t\t\t\t\t\t&cmcp_info->cm_sensor_column_delta[(j-1)*rx_num+i],\n"
                  "\t\t\t\t\t\t\tindex, 1);\n"
                  "\t\t\t\t\tindex = prepare_print_string(\n"
                  "\t\t\t\t\t\tout_buf,\n"
                  "\t\t\t\t\t\t\"\\n\", index);\n")
          # 续行缩进在不同 vendor pin 上有 8 tab / 7 tab 两种形态（2026-11-19 在
          # f4c3fdd4 上实测为 7 tab），这里同时接受两种，命中即用；都不命中也只
          # 告警、不中止 —— 本步骤仅消除 -Wmisleading-indentation，纯缩进零行为
          # 变更，KCFLAGS 另有 -Wno-error / -Wno-misleading-indentation 兜底。
          base3 = ("\t\t\t\t\tfor (j = 0; j < tx_num; j++)\n"
                   "\t\t\t\t\t\tindex = prepare_print_data(\n"
                   "\t\t\t\t\t\t\tout_buf,\n"
                   "\t\t\t\t&cmcp_info->cm_sensor_row_delta[j*rx_num+i-1],\n"
                   "\t\t\t\t\t\t\tindex, 1);\n"
                   "\t\t\t\t\t\tindex = prepare_print_string(\n")
          tails3 = ("\t\t\t\t\t\t\t\tout_buf,\n"
                    "\t\t\t\t\t\t\t\t\"\\n\", index);\n",
                    "\t\t\t\t\t\t\tout_buf,\n"
                    "\t\t\t\t\t\t\t\"\\n\", index);\n")
          new3 = ("\t\t\t\t\tfor (j = 0; j < tx_num; j++)\n"
                  "\t\t\t\t\t\tindex = prepare_print_data(\n"
                  "\t\t\t\t\t\t\tout_buf,\n"
                  "\t\t\t\t\t\t\t&cmcp_info->cm_sensor_row_delta[j*rx_num+i-1],\n"
                  "\t\t\t\t\t\t\tindex, 1);\n"
                  "\t\t\t\t\tindex = prepare_print_string(\n"
                  "\t\t\t\t\t\tout_buf,\n"
                  "\t\t\t\t\t\t\"\\n\", index);\n")
          orig = s
          applied = []
          # 幂等：文件已是修复后形态则直接跳过，不重复替换
          if s.count(new1) == 1 and s.count(new2) == 1 and s.count(new3) == 1:
              print("-- cyttsp5_device_access.c: already in canonical form, skipping")
              sys.exit(0)
          for name, o, n in [("cmcp block", old1, new1),
                             ("column-delta loop", old2, new2)]:
              c = s.count(o)
              if c == 1:
                  s = s.replace(o, n)
                  applied.append(name)
              else:
                  print(f"::warning::{name}: anchor count {c} != 1 - skipped (non-fatal)")
          hit = False
          for tail in tails3:
              o = base3 + tail
              if s.count(o) == 1:
                  s = s.replace(o, new3)
                  applied.append("row-delta loop")
                  hit = True
                  break
          if not hit:
              print("::warning::row-delta loop: no known anchor variant matched - skipped (non-fatal)")
          # 纯重排证明：去空白后 token 流必须与原文件一致
          assert re.sub(r"\s+", "", orig) == re.sub(r"\s+", "", s), \
              "token stream changed - aborting (not a pure reindent)"
          open(p, "w").write(s)
          print(f"-- cyttsp5_device_access.c: reindented {len(applied)} site(s), token stream unchanged")
          PYEOF
          echo "-- verified: cyttsp5 reindent step completed"

      - name: Fix PCI_VENDOR_ID_ASIX macro redefinition in 8250_pci.c (no behavior change)
        working-directory: kernel
        # 纯编译警告/无行为变更补丁：drivers/tty/serial/8250/8250_pci.c 第 1877 行
        #   #define PCI_VENDOR_ID_ASIX   0x9710
        # 与 include/linux/pci_ids.h 的 0x125b 重定义（ASIX 新旧两个 vendor id
        # 撞了同一个宏名），触发 -Wmacro-redefined。
        # 修法：重定义前插 #undef。编译器对"不同值重定义"的处理本来就是采用
        # 新定义（0x9710），#undef 只是消除警告、语义完全一致。
        # 注意：绝不能用 #ifndef 包住本地 define——那会跳过它、本文件 PCI 表
        # 的 vendor id 全变 0x125b，真实行为改变。
        continue-on-error: true
        run: |
          set -euo pipefail
          python3 <<'PYEOF'
          import os, re, sys
          p = "drivers/tty/serial/8250/8250_pci.c"
          if not os.path.exists(p):
              print("::warning::8250_pci.c not found - skipping (non-fatal)")
              sys.exit(0)
          s = open(p).read()
          if "#undef PCI_VENDOR_ID_ASIX" in s:
              print("-- 8250_pci.c: #undef already present (idempotent)")
              sys.exit(0)
          pat = re.compile(r'#define\s+PCI_VENDOR_ID_ASIX\s+0x9710')
          hits = list(pat.finditer(s))
          assert len(hits) == 1, \
              f"anchor count {len(hits)} != 1 - manual review needed"
          s = s[:hits[0].start()] + "#undef PCI_VENDOR_ID_ASIX\n" + s[hits[0].start():]
          open(p, "w").write(s)
          print("-- 8250_pci.c: #undef inserted before redefinition (0x9710 kept, no behavior change)")
          PYEOF
          grep -B1 'define PCI_VENDOR_ID_ASIX' drivers/tty/serial/8250/8250_pci.c | grep -q '#undef PCI_VENDOR_ID_ASIX' \
            || { echo "::error::8250_pci.c #undef verification failed"; exit 1; }
          echo "-- verified: 8250_pci.c macro redefinition guard in place"

      - name: Fix array-parameter mismatch in qcacld parser_api.c (no behavior change)
        working-directory: kernel
        # 纯编译警告/无行为变更补丁：anchor 若因上游漂移失配，只告警不中断构建
        # （与 diag / r5 同款步骤；slim13 之前缺这步导致 -Warray-parameter 漏网）。
        continue-on-error: true
        run: |
          set -euo pipefail
          # drivers/staging/qcacld-3.0/.../parser_api.c L6177 定义
          # uint8_t mdie[SIR_MDIE_SIZE]，而 core/mac/src/include/parser_api.h L1056
          # 声明 uint8_t mdie[]。C 中数组参数退化为指针，[] 与 [SIR_MDIE_SIZE]
          # 在函数体内均为 uint8_t *，行为完全相同；Clang -Warray-parameter
          # 只检查声明/定义边界一致性。修复：源文件定义改为 []，与头文件一致。
          # 函数体内 mdie[0..2] / sizeof(mdie)（参数上下文恒为指针大小）不受影响。
          python3 <<'PYEOF'
          import sys
          p = "drivers/staging/qcacld-3.0/core/mac/src/sys/legacy/src/utils/src/parser_api.c"
          s = open(p).read()
          old = "uint8_t mdie[SIR_MDIE_SIZE])"
          new = "uint8_t mdie[])"
          c_old, c_new = s.count(old), s.count(new)
          if c_old == 1:
              s = s.replace(old, new)
              open(p, "w").write(s)
              print("-- parser_api.c: mdie[SIR_MDIE_SIZE] -> mdie[] (matches header)")
          elif c_new >= 1 and c_old == 0:
              print("-- parser_api.c: already fixed, skipping")
          else:
              sys.exit(f"::error::mdie anchor count old={c_old} new={c_new} (source moved?)")
          PYEOF
          grep -q 'uint8_t mdie\[\])' drivers/staging/qcacld-3.0/core/mac/src/sys/legacy/src/utils/src/parser_api.c \
            || { echo "::error::mdie[] fix verification failed"; exit 1; }
          ! grep -q 'uint8_t mdie\[SIR_MDIE_SIZE\])' drivers/staging/qcacld-3.0/core/mac/src/sys/legacy/src/utils/src/parser_api.c \
            || { echo "::error::old mdie[SIR_MDIE_SIZE] definition still present"; exit 1; }
          echo "-- verified: mdie[] matches header declaration (array-parameter silenced)"

      - name: Fix sscanf %100s off-by-one in fts_spi (stack overflow guard)
        working-directory: kernel
        # 纯编译警告/无行为变更补丁（diag/r5 同款；slim13 之前缺这步）。
        # 这条不是外观问题：drivers/input/touchscreen/fts_spi/{fts_proc.c,fts.c}
        # 目标缓冲区均为 char path[100]，而 sscanf 格式串用 %100s ——
        # 匹配满 100 字符时写入 100 字节 + NUL = 101 字节，越界 1 字节
        # （clang -Wfortify-source 报的真实 off-by-one）。
        # 修复：%100s -> %99s（保留 NUL 空间）。行为影响仅在用户输入
        # 恰好 >= 99 字符的固件路径时截断 1 字符，正常固件名远短于此。
        continue-on-error: true
        run: |
          set -euo pipefail
          python3 <<'PYEOF'
          import os, sys
          fixes = {
              "drivers/input/touchscreen/fts_spi/fts_proc.c": [
                  ('sscanf(p, "%100s", path);', 'sscanf(p, "%99s", path);'),
              ],
              "drivers/input/touchscreen/fts_spi/fts.c": [
                  ('sscanf(buf, "%100s %d %d", path, &mode[0], &mode[1]);',
                   'sscanf(buf, "%99s %d %d", path, &mode[0], &mode[1]);'),
              ],
          }
          for p, pairs in fixes.items():
              if not os.path.exists(p):
                  print(f"::warning::{p} not found - skipping (non-fatal)")
                  continue
              s = open(p).read()
              for o, n in pairs:
                  c = s.count(o)
                  if c == 1:
                      s = s.replace(o, n)
                  elif n in s:
                      print(f"-- {p}: already fixed, skipping")
                      continue
                  else:
                      print(f"::warning::{p}: anchor count {c} != 1 - skipped (non-fatal)")
                      continue
              open(p, "w").write(s)
              print(f"-- {p}: %100s -> %99s ({len(pairs)} site)")
          PYEOF
          ! grep -rn '%100s' drivers/input/touchscreen/fts_spi/ 2>/dev/null \
            || { echo "::error::%100s still present in fts_spi"; exit 1; }
          echo "-- verified: fts_spi sscanf width fixed, no %100s left"

      - name: Fix unused label reset_assert in dwc3-qcom.c (no behavior change)
        working-directory: kernel
        # 纯编译警告/无行为变更补丁（diag/r5 同款；slim13 之前缺这步）。
        # drivers/usb/dwc3/dwc3-qcom.c 的 reset_assert 标签在当前 defconfig 下
        # 无任何 goto 引用（-Wunused-label）。两种成因：
        #   a) 代码演进中删除全部 goto reset_assert，标签残留 → 删除安全
        #   b) goto 在某个 #ifdef CONFIG_XXX 块内被当前配置排除 → 删除会在
        #      未来启用该配置时导致 "label not found" 编译错误
        # 脚本先扫全文（含条件编译块）确认无 goto 引用；有则报错让手动用
        # 相同 #ifdef 包裹标签，无则删除标签行。零行为变更。
        continue-on-error: true
        run: |
          set -euo pipefail
          python3 <<'PYEOF'
          import os, re, sys
          p = "drivers/usb/dwc3/dwc3-qcom.c"
          if not os.path.exists(p):
              print("::warning::dwc3-qcom.c not found - skipping (non-fatal)")
              sys.exit(0)
          s = open(p).read()
          if re.search(r'\bgoto\s+reset_assert\s*;', s):
              sys.exit("::error::goto reset_assert exists in file (possibly under #ifdef) - "
                       "manual review needed: wrap label with matching #ifdef or confirm "
                       "current defconfig excludes it")
          label_pat = re.compile(r'^reset_assert:[ \t]*\n', re.M)
          m = label_pat.search(s)
          if not m:
              if "reset_assert:" not in s:
                  print("-- dwc3-qcom.c: reset_assert label already removed, skipping")
                  sys.exit(0)
              sys.exit("::error::anchor '^reset_assert:' not found (source moved?)")
          s = s[:m.start()] + s[m.end():]
          open(p, "w").write(s)
          print("-- dwc3-qcom.c: removed unused reset_assert label (no goto references)")
          PYEOF
          ! grep -q '^reset_assert:' drivers/usb/dwc3/dwc3-qcom.c \
            || { echo "::error::reset_assert label still present"; exit 1; }
          echo "-- verified: reset_assert label removed, no goto references in file"

      - name: 修复编译警告
        working-directory: kernel
        run: |
          set -e
          FOCALTECH_MAKEFILE="drivers/input/touchscreen/focaltech_touch/Makefile"
          if [ -f "$FOCALTECH_MAKEFILE" ]; then
            sed -i 's/^ \+/\t/' "$FOCALTECH_MAKEFILE"
            echo "Fixed leading spaces in focaltech Makefile"
          fi

          for entry in \
            "drivers/staging/qcacld-3.0:-Wno-format" \
            "drivers/staging/qca-wifi-host-cmn:-Wno-format" \
            "drivers/thermal:-Wno-fortify-source"; do
            DIR="${entry%%:*}"
            FLAG="${entry##*:}"
            if [ -d "$DIR" ] && [ -f "$DIR/Makefile" ]; then
              grep -q -- "$FLAG" "$DIR/Makefile" || echo "ccflags-y += $FLAG" >> "$DIR/Makefile"
            fi
          done

      - name: Build Kernel
        working-directory: kernel
        run: |
          export ARCH=arm64
          export PATH="${{ env.CLANG_DIR }}/bin:$PATH"
          export LLVM=1 LLVM_IAS=1 \
                 CLANG_TRIPLE=aarch64-linux-gnu- \
                 CROSS_COMPILE=aarch64-linux-gnu- \
                 CROSS_COMPILE_COMPAT=arm-linux-gnueabi-
          export CCACHE_DIR="${{ github.workspace }}/.ccache"
          export CCACHE_MAXSIZE=8G
          # 去除 CI 构建指纹：/proc/version 里嵌入的构建者/主机名/时间戳会被检测用作
          # "自编内核" 信号，固定为普通本地构建形态（对反检测同样有意义）
          export KBUILD_BUILD_USER=builder
          export KBUILD_BUILD_HOST=android-build
          # 时间戳用真实构建时间：/proc/version 里的时间=构建时刻，
          # 手机上一条 cat /proc/version 就能确认刷进去的是哪次构建
          export KBUILD_BUILD_TIMESTAMP="$(date -u)"

          echo "== 预装 UAPI 头文件以启用 SukiSU preinit runner =="
          # vendor defconfig 不带 HEADERS_INSTALL，SukiSU builtin 的 preinit runner
          # 检测不到 out/usr/include 会降级为 -DKSU_NO_PREINIT。这里显式安装以启用
          make -j$(nproc) O=out ARCH=arm64 \
            CC="ccache clang" LD="ld.lld" AR="llvm-ar" NM="llvm-nm" \
            headers_install INSTALL_HDR_PATH="$PWD/out/usr" \
            || echo "::warning::headers_install failed, SukiSU preinit will stay disabled (non-fatal)"
          test -f out/usr/include/linux/unistd.h \
            && echo "-- preinit UAPI headers ready" \
            || echo "::warning::usr/include/linux/unistd.h missing, preinit will be disabled"

          echo "== slim9 自检：用与驱动 Makefile 完全相同的参数预编译 obfuscated runner.c =="
          # 复刻 quiet_cmd_ksu_runner 的 CC 调用（KSU_RUNNER_CFLAGS）。若符号改名
          # 破坏了 runner 独立编译链（与内核构建体系隔离的 freestanding 编译），
          # 这里会提前失败并打印完整错误——make 里只会吞成一行 "Syntax error"。
          RUNNER_SELFTEST_CFLAGS="--target=aarch64-linux-gnu -std=gnu11 -Os -Wall \
            -nostdinc -isystem $(clang -print-file-name=include) \
            -Idrivers/kernelsu/preinit/runner/nolibc -I$PWD/out/usr/include \
            -Idrivers/kernelsu/include \
            -ffreestanding -fno-stack-protector -fno-pic -fno-pie \
            -fno-asynchronous-unwind-tables -fno-unwind-tables \
            -ffunction-sections -fdata-sections"
          if clang $RUNNER_SELFTEST_CFLAGS \
              -c -o /tmp/runner_selftest.o drivers/kernelsu/preinit/runner/runner.c \
              2>/tmp/runner_selftest.log; then
            ld.lld -static -nostdlib -e _start --gc-sections -s \
              -o /tmp/runner_selftest.elf /tmp/runner_selftest.o \
              && echo "-- runner.c compiles & links OK after obfuscation" \
              || { echo "::error::obfuscated runner link failed"; ld.lld -v; exit 1; }
          else
            echo "::error::obfuscated runner.c failed to compile — full error follows"
            cat /tmp/runner_selftest.log
            echo "::hint::可在工作流输入里把 obfuscate_symbols 切为 false 恢复构建"
            exit 1
          fi

          set +e
          make -j$(nproc) O=out ARCH=arm64 \
            CC="ccache clang" LD="ld.lld" AR="llvm-ar" NM="llvm-nm" \
            OBJCOPY="llvm-objcopy" OBJDUMP="llvm-objdump" STRIP="llvm-strip" \
            CLANG_TRIPLE="aarch64-linux-gnu-" CROSS_COMPILE="aarch64-linux-gnu-" \
            KCFLAGS="-Wno-unknown-warning-option -Wno-error -Wno-format -Wno-incompatible-pointer-types \
            -Wno-implicit-function-declaration -Wno-strict-prototypes -Wno-missing-prototypes \
            -Wno-int-conversion -Wno-declaration-after-statement \
            -Wframe-larger-than=131072 -Wno-unused-variable -Wno-unused-function \
            -Wno-missing-braces -Wno-int-to-pointer-cast -Wno-address-of-packed-member \
            -Wno-return-type -Wno-shift-negative-value -Wno-array-bounds \
            -Wno-misleading-indentation -Wno-unused-result -Wno-unused-label \
            -Wno-macro-redefined -Wno-array-parameter -Wno-fortify-source" \
            HOSTCFLAGS="" 2>&1 | tee build.log

          if [ ${PIPESTATUS[0]} -ne 0 ]; then
            echo "::error::Kernel build failed. Last 200 lines:"
            tail -n 200 build.log
            exit 1
          fi

          echo "=== Build finished ==="
          ccache -s 2>/dev/null || true
          ls -lh out/arch/arm64/boot/Image

      - name: Verify config.gz sanitization (slim12)
        working-directory: kernel
        run: |
          set -euo pipefail
          echo "== slim12：校验嵌入镜像的内核配置已净化 =="
          if [ ! -f out/kernel/config_data.gz ]; then
            echo "::error::out/kernel/config_data.gz not produced — IKCONFIG off?"; exit 1
          fi
          # 指纹必须为零：KSU/SUSFS/KPM 的 =y / =m / is not set 行都不允许出现
          if zcat out/kernel/config_data.gz | grep -E '^(CONFIG_KSU|CONFIG_SUSFS|CONFIG_KPM)|^# CONFIG_(KSU|SUSFS|KPM)'; then
            echo "::error::config_data.gz still contains KSU/SUSFS fingerprints"
            exit 1
          fi
          # 净化不能把配置弄空——行数应与完整 config 接近（仅少几十行指纹）
          TOTAL=$(zcat out/kernel/config_data.gz | wc -l)
          FULL=$(wc -l < out/.config)
          echo "sanitized=$TOTAL lines, full=$FULL lines"
          [ "$TOTAL" -gt 100 ] || { echo "::error::sanitized config suspiciously small"; exit 1; }
          echo "-- slim12: /proc/config.gz will expose ZERO KSU/SUSFS/KPM entries; file itself stays for MIUI boot services"

      - name: Verify uname stock format (slim20)
        working-directory: kernel
        run: |
          set -euo pipefail
          REL="$(cat out/include/config/kernel.release)"
          echo "KERNELRELEASE=$REL"
          if [ "$REL" != "5.4.302--6-g59565037-ab63821773" ]; then
            echo "::error::KERNELRELEASE not in expected stock format: $REL"
            echo "        expected: 5.4.302--6-g59565037-ab63821773 (v7/v8 通过格式)"
            exit 1
          fi
          echo "-- slim20: uname/proc-version will report stock-format release (digits-only g-segment, no -dirty)"

      - name: Package AnyKernel3
        run: |
          set -e
          TIME=$(TZ='Asia/Shanghai' date +%Y%m%d-%H%M)
