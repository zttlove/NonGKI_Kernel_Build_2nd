          # boot install
          split_boot;

          flash_boot;
          ## end boot install
          AK3

          chmod +x anykernel.sh
          zip -r9 "../${{ env.DEVICE_CODENAME }}-SukiSU-Nova-slim20-${TIME}.zip" ./*

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: star-SukiSU-Nova-slim20
          path: ${{ env.DEVICE_CODENAME }}-SukiSU-Nova-slim20-*.zip
