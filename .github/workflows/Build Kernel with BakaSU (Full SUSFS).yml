name: Build Kernel with BakaSU (Full SUSFS)

on:
  workflow_dispatch:

env:
  KERNEL_REPO: zttlove/android_kernel_xiaomi_sm8350-hyperos
  KERNEL_BRANCH: dynamic
  DEFCONFIG_NAME: vendor/star_defconfig
  DEVICE_CODENAME: star
  OUTPUT_DIR: out
  CLANG_DIR: ${{ github.workspace }}/toolchains/clang
  KERNEL_DIR: ${{ github.workspace }}/kernel

jobs:
  build-kernel:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - name: Checkout Kernel Source
        uses: actions/checkout@v4
        with:
          repository: ${{ env.KERNEL_REPO }}
          ref: ${{ env.KERNEL_BRANCH }}
          path: kernel
          fetch-depth: 1

      - name: Verify Kernel Commit & Clean Workspace
        working-directory: kernel
        run: |
          git reset --hard HEAD
          git clean -fdx
          echo "Kernel: $(git log -1 --format='%h %s')"

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential bc bison flex libssl-dev libelf-dev \
            zip unzip python3 perl git curl ccache xxd cpio kmod \
            libtinfo5
          sudo ln -sf /usr/lib/x86_64-linux-gnu/libtinfo.so.6 /usr/lib/x86_64-linux-gnu/libtinfo.so.5 || true

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: .ccache
          key: ccache-bakasu-star-${{ github.run_id }}
          restore-keys: |
            ccache-bakasu-star-

      - name: Cache Clang Toolchain
        uses: actions/cache@v4
        id: clang-cache
        with:
          path: ${{ env.CLANG_DIR }}
          key: clang-17.0.6-x86_64-ubuntu22.04

      - name: Download Clang 17.0.6
        if: steps.clang-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p "${{ env.CLANG_DIR }}"
          curl -fL --retry 3 -o /tmp/clang.tar.xz \
            https://github.com/llvm/llvm-project/releases/download/llvmorg-17.0.6/clang+llvm-17.0.6-x86_64-linux-gnu-ubuntu-22.04.tar.xz
          tar -xf /tmp/clang.tar.xz -C "${{ env.CLANG_DIR }}" --strip-components=1

      - name: Verify Clang
        run: ${{ env.CLANG_DIR }}/bin/clang --version

      - name: Integrate BakaSU (full SUSFS)
        working-directory: kernel
        run: |
          set -euo pipefail
          export ARCH=arm64
          export PATH="${{ env.CLANG_DIR }}/bin:$PATH"
          export LLVM=1 LLVM_IAS=1 \
                 CLANG_TRIPLE=aarch64-linux-gnu- \
                 CROSS_COMPILE=aarch64-linux-gnu- \
                 CROSS_COMPILE_COMPAT=arm-linux-gnueabi-

          echo "== 清理内核树 =="
          make mrproper >/dev/null 2>&1 || true

          echo "== 拉取 BakaSU 并接管 drivers/kernelsu =="
          rm -rf BakaSU_src KernelSU drivers/kernelsu drivers/KernelSU
          git clone --depth=1 -b sync-up https://github.com/Baka-SU/BakaSU.git BakaSU_src
          ln -sfn ../BakaSU_src/kernel drivers/kernelsu

          grep -q 'kernelsu' drivers/Makefile || \
            printf '\nobj-$(CONFIG_KSU) += kernelsu/\n' >> drivers/Makefile
          grep -q 'drivers/kernelsu/Kconfig' drivers/Kconfig || \
            sed -i '/^endmenu/i\source "drivers/kernelsu/Kconfig"' drivers/Kconfig

          echo "== 确认内核侧 SUSFS 完整性 =="
          test -f fs/susfs.c || { echo "::error::fs/susfs.c missing - kernel branch lacks SUSFS"; exit 1; }
          test -f include/linux/susfs_def.h || { echo "::error::include/linux/susfs_def.h missing"; exit 1; }
          grep -q 'CONFIG_KSU_SUSFS' fs/exec.c || { echo "::error::fs/exec.c lacks KSU_SUSFS hooks"; exit 1; }
          grep -q 'CONFIG_KSU_SUSFS' fs/open.c || { echo "::error::fs/open.c lacks KSU_SUSFS hooks"; exit 1; }
          grep -q 'CONFIG_KSU_SUSFS' fs/stat.c || { echo "::error::fs/stat.c lacks KSU_SUSFS hooks"; exit 1; }
          echo "-- kernel-side SUSFS hooks verified (no patching needed)"

          echo "== 修复 vendor selinux_hide 补丁缺失的符号 =="
          # BakaSU 现版把该锁定义为 static，而 vendor 内核补丁以 extern 引用，需去掉 static 共享同一变量
          sed -i 's/^static struct mutex \*ksu_selinux_status_lock = NULL;/struct mutex *ksu_selinux_status_lock = NULL;/' \
            BakaSU_src/kernel/feature/selinux_hide.c
          grep -q '^struct mutex \*ksu_selinux_status_lock' BakaSU_src/kernel/feature/selinux_hide.c \
            || { echo "::error::selinux_hide.c lock static-removal failed"; exit 1; }
          # fake_state：vendor 补丁引用但 BakaSU 现版已不提供；在内核侧定义（保证与 vendor 的
          # struct selinux_state 布局一致），并在 selinux 初始化后浅拷真实状态
          if ! grep -q 'bakasu_fake_state_init' security/selinux/ss/services.c; then
          cat >> security/selinux/ss/services.c <<'EOF'

          /* BakaSU selinux_hide: fake selinux_state served to hidden apps by vendor kernel patch */
          struct selinux_state fake_state;
          static int __init bakasu_fake_state_init(void)
          {
          fake_state = selinux_state;
          return 0;
          }
          core_initcall(bakasu_fake_state_init);
          EOF
          fi
          grep -q 'core_initcall(bakasu_fake_state_init);' security/selinux/ss/services.c \
            || { echo "::error::fake_state definition append failed"; exit 1; }

          echo "== 修复 preinit 的 void 函数 return false =="
          PREINIT_H="BakaSU_src/kernel/preinit/preinit.h"
          if [ -f "$PREINIT_H" ]; then
            perl -0pi -e 's/(void\s+[a-zA-Z_][a-zA-Z0-9_]*\s*\([^)]*\)\s*\{[^}]*?)\breturn\s+false;/${1}return;/gs' "$PREINIT_H"
            grep -qPzo '\bvoid\s+[a-zA-Z_][a-zA-Z0-9_]*\s*\([^)]*\)\s*\{[^}]*?\breturn\s+false;' "$PREINIT_H" \
              && { echo "::error::preinit.h void-return patch failed"; exit 1; } || true
          fi

          echo "== 隐藏内核侧 'ksu' 特征字符串（免 Root 可探测）=="
          # 1) /proc/bus/input/handlers：音量键检测器的输入处理器名 "ksu" 任意应用可读
          if grep -q '\.name = "ksu",' BakaSU_src/kernel/runtime/ksud_integration.c; then
            sed -i 's/\.name = "ksu",/.name = "vkeymon",/' BakaSU_src/kernel/runtime/ksud_integration.c
          fi
          grep -q '\.name = "vkeymon",' BakaSU_src/kernel/runtime/ksud_integration.c \
            || { echo "::error::input handler rename failed"; exit 1; }
          # 2) /sys/kernel/security/lsm：security_add_hooks 的 LSM 标签 "ksu" → "ksm"
          #    （5.4 会把该标签追加进 lsm_names；纯显示用途，无内部匹配逻辑）
          sed -i 's/security_add_hooks(ksu_hooks, ARRAY_SIZE(ksu_hooks), "ksu");/security_add_hooks(ksu_hooks, ARRAY_SIZE(ksu_hooks), "ksm");/' \
            BakaSU_src/kernel/hook/lsm_hooks.c
          sed -i 's/hook->list\.lsm = "ksu";/hook->list.lsm = "ksm";/' \
            BakaSU_src/kernel/hook/lsm_hook_magic.c
          grep -q '"ksm");' BakaSU_src/kernel/hook/lsm_hooks.c \
            && grep -q 'hook->list\.lsm = "ksm";' BakaSU_src/kernel/hook/lsm_hook_magic.c \
            || { echo "::error::lsm label rename failed"; exit 1; }
          # 3) ps 可见的内核线程名 "detect_apatch_conflict" → "cfg_monitor"
          #    （不带 ksu 前缀，HIDE_KSU_SUSFS_SYMBOLS 管不到，kallsyms 直接可见）
          sed -i 's/"detect_apatch_conflict"/"cfg_monitor"/' BakaSU_src/kernel/compat/apatch_conflict.c
          grep -q '"cfg_monitor"' BakaSU_src/kernel/compat/apatch_conflict.c \
            || { echo "::error::kthread rename failed"; exit 1; }
          echo "-- kernel-side ksu strings renamed (input handler / lsm label / kthread)"

          echo "== 适配 sync-up 的 priority uid filter（vendor 内核 SUSFS 无内核侧支持）=="
          # sync-up 分支引用的 CMD_SUSFS_SET_PRIORITY_UID_FILTER / susfs_set_priority_uid_filter /
          # susfs_parse_priority_app_strings 由内核侧 susfs 提供，上游仅在 GKI 6.6-dev 分支实现，
          # 本 5.4 vendor 内核（SUSFS v2.3.0）没有。这里优雅降级：命令返回 -EOPNOTSUPP（ksud
          # 会将该功能标记为不支持），其余功能不受影响
          if ! grep -q 'susfs_set_priority_uid_filter' fs/susfs.c; then
            DISPATCH="BakaSU_src/kernel/supercall/dispatch.c"
            test -f "$DISPATCH" || { echo "::error::dispatch.c not found"; exit 1; }
            if ! grep -q 'define CMD_SUSFS_SET_PRIORITY_UID_FILTER' "$DISPATCH"; then
              sed -i '\|#include <linux/susfs_def.h>|a\
              #ifndef CMD_SUSFS_SET_PRIORITY_UID_FILTER\
              #define CMD_SUSFS_SET_PRIORITY_UID_FILTER 0x60030 /* must match ksud magic.rs */\
              #endif' "$DISPATCH"
            fi
            sed -i 's|susfs_set_priority_uid_filter(arg);|return -EOPNOTSUPP; /* vendor kernel susfs lacks kernel-side support */|' "$DISPATCH"
            if ! grep -q 'void susfs_parse_priority_app_strings(void)' "$DISPATCH"; then
              printf '\n#ifdef CONFIG_KSU_SUSFS_PRIORITY_UID_FILTER\n/* vendor kernel susfs lacks this hook; keep it a no-op */\nvoid susfs_parse_priority_app_strings(void) {}\n#endif\n' >> "$DISPATCH"
            fi
            grep -q 'define CMD_SUSFS_SET_PRIORITY_UID_FILTER 0x60030' "$DISPATCH" \
              && grep -q 'return -EOPNOTSUPP;' "$DISPATCH" \
              && grep -q 'void susfs_parse_priority_app_strings(void) {}' "$DISPATCH" \
              || { echo "::error::priority-uid-filter compat patch failed"; exit 1; }
            echo "-- priority uid filter stubbed for this vendor kernel"
          else
            echo "-- vendor susfs has priority uid filter support, no stub needed"
          fi

          echo "== 反计时侧信道：statx 对齐补丁 =="
          # 春秋 Native check-Eros 以 newfstatat:statx 耗时比值 >1.2 判定 KernelSU：
          # 内核挂钩了 newfstatat/faccessat 而 statx 未挂钩，钩子分发开销造成比值差。
          # statx(dfd, path, ...) 与 newfstatat(dfd, path, ...) 参数布局一致，注册
          # 同构钩子后单次开销相同，比值趋近 1，计时侧信道失效
          BRIDGE="BakaSU_src/kernel/hook/syscall_event_bridge.c"
          BRIDGE_H="BakaSU_src/kernel/hook/syscall_event_bridge.h"
          HOOKMGR="BakaSU_src/kernel/hook/syscall_hook_manager.c"
          test -f "$BRIDGE" && test -f "$BRIDGE_H" && test -f "$HOOKMGR" \
            || { echo "::error::hook manager source files not found"; exit 1; }
          if ! grep -q 'ksu_hook_statx' "$BRIDGE"; then
            echo "-- adding statx timing-alignment hook"
            cat >> "$BRIDGE" <<'EOF'

          long __nocfi ksu_hook_statx(int orig_nr, const struct pt_regs *regs)
          {
              if (!static_branch_unlikely(&ksu_su_compat_enabled))
                  return ksu_call_syscall(orig_nr, regs);

              return ksu_handle_stat_sucompat_internal(orig_nr, (struct pt_regs *)regs);
          }
          EOF
          fi
          grep -q 'ksu_hook_statx' "$BRIDGE" \
            || { echo "::error::statx bridge hook append failed"; exit 1; }
          if ! grep -q 'ksu_hook_statx' "$BRIDGE_H"; then
            sed -i '/^long ksu_hook_faccessat(int orig_nr, const struct pt_regs \*regs);$/a long ksu_hook_statx(int orig_nr, const struct pt_regs *regs);' "$BRIDGE_H"
          fi
          grep -q 'long ksu_hook_statx' "$BRIDGE_H" \
            || { echo "::error::statx hook declaration failed"; exit 1; }
          if ! grep -q 'ksu_register_syscall_hook(__NR_statx' "$HOOKMGR"; then
            sed -i 's|ksu_register_syscall_hook(__NR_faccessat, ksu_hook_faccessat);|ksu_register_syscall_hook(__NR_faccessat, ksu_hook_faccessat);\n    ksu_register_syscall_hook(__NR_statx, ksu_hook_statx);|' "$HOOKMGR"
          fi
          grep -q 'ksu_register_syscall_hook(__NR_statx, ksu_hook_statx);' "$HOOKMGR" \
            || { echo "::error::statx hook registration failed"; exit 1; }
          echo "-- statx timing-alignment hook installed"

      - name: Backport sus_type/avd hiding into vendor 5.4 susfs
        working-directory: kernel
        run: |
          set -euo pipefail

          echo "== 回移植 6.6-dev 的 sus_type/avd 隐藏实现到 vendor 5.4 =="
          # 上游 susfs4ksu（gki-android15-6.6-dev）把 BakaSU 注入的 policy 规则缓存在内核哈希表：
          #   - susfs_add_sus_type: 注册注入的 type；app 解析该 type 的 context 时按 -EINVAL 拒绝
          #   - susfs_add_sus_avd_allowed_by_type/susfs_spoof_avd_allowed_rcu: 记录注入前的
          #     avd.allowed，app 走 /sys/fs/selinux/access 查询时还原为注入前的授权位
          # vendor 5.4（susfs v2.3.0）无此实现，且 selinux 锁模型不同（policy_rwlock 而非 6.6 的
          # RCU + selinux_policy），这里按 5.4 语义回移植内核侧存储与 services.c 过滤实现，并把
          # selinuxfs.c/hooks.c 中 my_* 钩子的 fake_state 调用切到 susfs 过滤路径
          if ! grep -q 'susfs_is_sus_type_rcu' fs/susfs.c; then
            echo "-- backporting sus_type/avd hiding into vendor 5.4 susfs"
            # 1) fs/susfs.c：sus_type / sus_avd_allowed 内核存储（照搬 6.6-dev，日志宏改用
            #    v2.3.0 的 SUSFS_LOGE/SUSFS_LOGI，上游用 v2.4+ 才有的 *_RL 变体）
            cat >> fs/susfs.c <<'SUSTYPE_EOF'

            /* sus_type: backported from susfs4ksu gki-android15-6.6-dev */
            static DEFINE_MUTEX(susfs_mutex_lock_sus_type);
            static DEFINE_HASHTABLE(SUS_TYPE_HLIST, 10);

            struct st_susfs_sus_type_hlist {
            struct hlist_node                        node;
            };

            int susfs_add_sus_type(const char *secctx, u32 type_value) {
            struct st_susfs_sus_type_hlist *new_entry, *tmp_entry;
            struct hlist_node *tmp_hlist_node;
            int err = 0;

            mutex_lock(&susfs_mutex_lock_sus_type);
            hash_for_each_possible_safe(SUS_TYPE_HLIST, tmp_entry, tmp_hlist_node, node, type_value) {
            SUSFS_LOGE("secctx '%s', type_value '%u', was added before already\n",
            secctx, type_value);
            err = -EINVAL;
            goto unlock;
            }

            new_entry = kzalloc(sizeof(struct st_susfs_sus_type_hlist), GFP_KERNEL);
            if (!new_entry) {
            err = -ENOMEM;
            goto unlock;
            }

            hash_add_rcu(SUS_TYPE_HLIST, &new_entry->node, type_value);
            SUSFS_LOGI("secctx '%s', type '%u', has been added to SUS_TYPE_HLIST\n",
            secctx, type_value);
            unlock:
            mutex_unlock(&susfs_mutex_lock_sus_type);
            return err;
            }

            bool susfs_is_sus_type_rcu(u32 type_value) {
            struct st_susfs_sus_type_hlist *entry = NULL;

            hash_for_each_possible_rcu(SUS_TYPE_HLIST, entry, node, type_value) {
            return true;
            }
            return false;
            }

            static DEFINE_MUTEX(susfs_mutex_lock_sus_avd_allowed_hlist);
            static DEFINE_HASHTABLE(SUS_AVD_ALLOWED_HLIST, 18);

            struct susfs_sus_av_rule {
            struct hlist_node node;
            u32 s_type;
            u32 t_type;
            u32 c_type;
            u32 orig_avd_allowed;
            };

            static inline u32 susfs_av_rule_hash(u32 ssid, u32 tsid, u16 tclass)
            {
            u32 h;

            h = hash_32(ssid, 32);
            h ^= rol32(hash_32(tsid, 32), 13);
            h ^= rol32(hash_32((u32)tclass, 32), 19);

            h += h << 13;
            h ^= h >> 7;
            h += h << 17;
            h ^= h >> 5;

            return h;
            }

            int susfs_add_sus_avd_allowed_by_type(u32 s_type, u32 t_type, u32 c_type, u32 orig_avd_allowed)
            {
            struct susfs_sus_av_rule *entry, *tmp_entry;
            struct hlist_node *tmp_hlist_node;
            int err = 0;
            u32 key;

            mutex_lock(&susfs_mutex_lock_sus_avd_allowed_hlist);

            entry = kzalloc(sizeof(*entry), GFP_ATOMIC);
            if (!entry) {
            err = -ENOMEM;
            goto unlock;
            }

            key = susfs_av_rule_hash(s_type, t_type, c_type);
            hash_for_each_possible_safe(SUS_AVD_ALLOWED_HLIST, tmp_entry, tmp_hlist_node, node, key) {
            if (tmp_entry->s_type == s_type &&
                tmp_entry->t_type == t_type &&
                tmp_entry->c_type == c_type)
            {
            /* Do not apply any new orig_avd_allowed for matched entry. */
            kfree(entry);
            goto unlock;
            }
            }

            entry->s_type = s_type;
            entry->t_type = t_type;
            entry->c_type = c_type;
            entry->orig_avd_allowed = orig_avd_allowed;

            hash_add_rcu(SUS_AVD_ALLOWED_HLIST, &entry->node, key);
            SUSFS_LOGI("av_rule '%u %u %u %u' has been added to SUS_AVD_ALLOWED_HLIST\n",
            s_type, t_type, c_type, orig_avd_allowed);
            unlock:
            mutex_unlock(&susfs_mutex_lock_sus_avd_allowed_hlist);
            return err;
            }

            void susfs_spoof_avd_allowed_rcu(u32 s_type, u32 t_type, u32 c_type, u32 *avd_allowed)
            {
            struct susfs_sus_av_rule *entry;
            u32 key = susfs_av_rule_hash(s_type, t_type, c_type);

            hash_for_each_possible_rcu(SUS_AVD_ALLOWED_HLIST, entry, node, key) {
            if (entry->s_type == s_type &&
                entry->t_type == t_type &&
                entry->c_type == c_type)
            {
            *avd_allowed = entry->orig_avd_allowed;
            return;
            }
            }
            }
          SUSTYPE_EOF
            # 2) security/selinux/ss/services.c：5.4 适配的过滤实现。与 6.6 原版的差异：
            #    - 6.6 用 rcu_read_lock + rcu_dereference(selinux_state.policy)，5.4 用
            #      read_lock(&selinux_state.ss->policy_rwlock) + 内嵌 policydb/sidtab
            #    - 5.4 的 context_to_sid 查找依赖 context->hash，需先 context_add_hash()
            #    - string_to_context_struct 按本内核用 hashtab_search(pol->p_xxx.table, ...)
            cat >> security/selinux/ss/services.c <<'SUSAVD_EOF'

            /* sus_type hiding: backported from susfs4ksu gki-android15-6.6-dev (5.4 rwlock model) */
            #ifdef CONFIG_KSU_SUSFS
            extern bool susfs_is_sus_type_rcu(u32 sid);
            extern void susfs_spoof_avd_allowed_rcu(u32 s_type, u32 t_type, u32 c_type, u32 *avd_allowed);

            static int susfs_string_to_context_struct(struct policydb *pol,
                struct sidtab *sidtabp,
                char *scontext,
                struct context *ctx,
                u32 def_sid)
            {
            struct role_datum *role;
            struct type_datum *typdatum;
            struct user_datum *usrdatum;
            char *scontextp, *p, oldc;
            int rc = 0;

            context_init(ctx);

            /* Parse the security context. */

            rc = -EINVAL;
            scontextp = (char *) scontext;

            /* Extract the user. */
            p = scontextp;
            while (*p && *p != ':')
            p++;

            if (*p == 0)
            goto out;

            *p++ = 0;

            usrdatum = hashtab_search(pol->p_users.table, scontextp);
            if (!usrdatum)
            goto out;

            ctx->user = usrdatum->value;

            /* Extract role. */
            scontextp = p;
            while (*p && *p != ':')
            p++;

            if (*p == 0)
            goto out;

            *p++ = 0;

            role = hashtab_search(pol->p_roles.table, scontextp);
            if (!role)
            goto out;
            ctx->role = role->value;

            /* Extract type. */
            scontextp = p;
            while (*p && *p != ':')
            p++;
            oldc = *p;
            *p++ = 0;

            typdatum = hashtab_search(pol->p_types.table, scontextp);
            if (!typdatum || typdatum->attribute)
            goto out;
            if (likely(susfs_is_sus_type_rcu(typdatum->value)))
            goto out;

            ctx->type = typdatum->value;

            rc = mls_context_to_sid(pol, oldc, p, ctx, sidtabp, def_sid);
            if (rc)
            goto out;

            /* Check the validity of the new context. */
            rc = -EINVAL;
            if (!policydb_context_isvalid(pol, ctx))
            goto out;
            rc = 0;
            out:
            if (rc)
            context_destroy(ctx);
            return rc;
            }

            static int susfs_security_context_to_sid_core(const char *scontext, u32 scontext_len,
            u32 *sid, u32 def_sid, gfp_t gfp_flags,
            int force)
            {
            struct policydb *policydb;
            struct sidtab *sidtab;
            char *scontext2, *str = NULL;
            struct context context;
            int rc = 0;

            /* An empty security context is never valid. */
            if (!scontext_len)
            return -EINVAL;

            /* Copy the string to allow changes and ensure a NUL terminator */
            scontext2 = kmemdup_nul(scontext, scontext_len, gfp_flags);
            if (!scontext2)
            return -ENOMEM;

            if (!selinux_state.initialized) {
            int i;

            for (i = 1; i < SECINITSID_NUM; i++) {
            if (!strcmp(initial_sid_to_string[i], scontext2)) {
            *sid = i;
            goto out;
            }
            }
            *sid = SECINITSID_KERNEL;
            goto out;
            }
            *sid = SECSID_NULL;

            if (force) {
            /* Save another copy for storing in uninterpreted form */
            rc = -ENOMEM;
            str = kstrdup(scontext2, gfp_flags);
            if (!str)
            goto out;
            }
            read_lock(&selinux_state.ss->policy_rwlock);
            policydb = &selinux_state.ss->policydb;
            sidtab = selinux_state.ss->sidtab;
            rc = susfs_string_to_context_struct(policydb, sidtab, scontext2,
                  &context, def_sid);
            if (rc == -EINVAL && force) {
            context.str = str;
            context.len = strlen(str) + 1;
            str = NULL;
            } else if (rc)
            goto out_unlock;
            rc = context_add_hash(policydb, &context);
            if (rc)
            goto out_unlock;
            rc = sidtab_context_to_sid(sidtab, &context, sid);
            context_destroy(&context);
            out_unlock:
            read_unlock(&selinux_state.ss->policy_rwlock);
            out:
            kfree(scontext2);
            kfree(str);
            return rc;
            }

            int susfs_security_context_to_sid(const char *scontext, u32 scontext_len, u32 *sid,
                gfp_t gfp)
            {
            return susfs_security_context_to_sid_core(scontext, scontext_len,
                sid, SECSID_NULL, gfp, 0);
            }

            int susfs_security_context_str_to_sid(const char *scontext, u32 *sid, gfp_t gfp)
            {
            return susfs_security_context_to_sid(scontext, strlen(scontext),
                   sid, gfp);
            }

            void susfs_security_compute_av_user(u32 ssid,
                  u32 tsid,
                  u16 tclass,
                  struct av_decision *avd)
            {
            struct policydb *policydb;
            struct sidtab *sidtab;
            struct context *scontext = NULL, *tcontext = NULL;

            read_lock(&selinux_state.ss->policy_rwlock);
            avd_init(&selinux_state, avd);
            if (!selinux_state.initialized)
            goto allow;

            policydb = &selinux_state.ss->policydb;
            sidtab = selinux_state.ss->sidtab;

            scontext = sidtab_search(sidtab, ssid);
            if (!scontext) {
            pr_err("SELinux: %s:  unrecognized SID %d\n",
                   __func__, ssid);
            goto out;
            }

            /* permissive domain? */
            if (ebitmap_get_bit(&policydb->permissive_map, scontext->type))
            avd->flags |= AVD_FLAGS_PERMISSIVE;

            tcontext = sidtab_search(sidtab, tsid);
            if (!tcontext) {
            pr_err("SELinux: %s:  unrecognized SID %d\n",
                   __func__, tsid);
            goto out;
            }

            if (unlikely(!tclass)) {
            if (policydb->allow_unknown)
            goto allow;
            goto out;
            }

            context_struct_compute_av(policydb, scontext, tcontext, tclass, avd,
              NULL);
            susfs_spoof_avd_allowed_rcu(scontext->type, tcontext->type, tclass,
                &avd->allowed);
             out:
            read_unlock(&selinux_state.ss->policy_rwlock);
            return;
            allow:
            avd->allowed = 0xffffffff;
            goto out;
            }
            #endif // #ifdef CONFIG_KSU_SUSFS
          SUSAVD_EOF
            # 3) selinuxfs.c / hooks.c：my_* 钩子由 fake_state 路径切到 susfs 过滤路径
            #    （fake_state 浅拷贝的 initialized 恒为 false，标准接口会退化为全放行/假 SID）
            perl -0pi -e 's/security_context_to_sid\(&fake_state, buf, size, &sid, GFP_KERNEL\);/susfs_security_context_to_sid(buf, size, &sid, GFP_KERNEL);/; s/security_sid_to_context\(&fake_state, sid, &canon, &len\);/security_sid_to_context(&selinux_state, sid, &canon, &len);/; s/security_context_str_to_sid\(&fake_state, scon, &ssid, GFP_KERNEL\);/susfs_security_context_str_to_sid(scon, &ssid, GFP_KERNEL);/; s/security_context_str_to_sid\(&fake_state, tcon, &tsid, GFP_KERNEL\);/susfs_security_context_str_to_sid(tcon, &tsid, GFP_KERNEL);/; s/security_compute_av_user\(&fake_state, ssid, tsid, tclass, &avd\);/susfs_security_compute_av_user(ssid, tsid, tclass, &avd);/; s/security_context_to_sid\(&fake_state, value, size,\s*&sid, GFP_KERNEL\);/susfs_security_context_to_sid(value, size, &sid, GFP_KERNEL);/s' \
              security/selinux/selinuxfs.c security/selinux/hooks.c
            # 4) 落盘校验
            grep -q 'int susfs_add_sus_type(const char \*secctx' fs/susfs.c \
              && grep -q 'int susfs_add_sus_avd_allowed_by_type(u32 s_type' fs/susfs.c \
              && grep -q 'bool susfs_is_sus_type_rcu(u32 type_value)' fs/susfs.c \
              && grep -q 'void susfs_spoof_avd_allowed_rcu' fs/susfs.c \
              && grep -q 'void susfs_security_compute_av_user(u32 ssid' security/selinux/ss/services.c \
              && grep -q 'susfs_string_to_context_struct' security/selinux/ss/services.c \
              && grep -q 'susfs_security_context_to_sid(buf, size' security/selinux/selinuxfs.c \
              && grep -q 'susfs_security_compute_av_user(ssid' security/selinux/selinuxfs.c \
              && grep -q 'susfs_security_context_to_sid(value, size' security/selinux/hooks.c \
              && ! grep -q 'security_compute_av_user(&fake_state' security/selinux/selinuxfs.c \
              || { echo "::error::sus_type backport verification failed"; exit 1; }
          else
            echo "-- sus_type backport already present, skipping"
          fi

          echo "== 适配 sync-up 的 sus_type/avd 缓存（vendor 内核 SUSFS 无此实现）=="
          # sepolicy.c 通过 extern 调用内核侧 susfs_add_sus_type / susfs_add_sus_avd_allowed_by_type
          # （缓存注入策略的原始 type/avd 供新版 susfs 隐藏）。vendor 5.4 没有实现，置为
          # no-op：运行时 sepolicy 注入本身不受影响，仅缺少该缓存细节
          if ! grep -q 'susfs_add_sus_type' fs/susfs.c; then
            SEPOL="BakaSU_src/kernel/selinux/sepolicy.c"
            test -f "$SEPOL" || { echo "::error::sepolicy.c not found"; exit 1; }
            if ! grep -q 'bakasu_compat_stub_sus_type' "$SEPOL"; then
              cat >> "$SEPOL" <<'BSEOF'

              /* bakasu_compat_stub_sus_type: vendor kernel susfs (5.4, v2.3.0) lacks sus_type caching;
               * no-op so runtime sepolicy injection stays functional */
              int susfs_add_sus_type(const char *secctx, u32 type_value) { return 0; }
              int susfs_add_sus_avd_allowed_by_type(u32 s_type, u32 t_type, u32 c_type, u32 orig_avd_allowed) { return 0; }
          BSEOF
            fi
            grep -q 'int susfs_add_sus_type(const char \*secctx' "$SEPOL" \
              && grep -q 'int susfs_add_sus_avd_allowed_by_type(u32 s_type' "$SEPOL" \
              || { echo "::error::sus_type stub failed"; exit 1; }
            echo "-- sus_type/avd cache stubbed for this vendor kernel"
          else
            echo "-- vendor susfs has sus_type support, no stub needed"
          fi

      - name: Configure Kernel (full SUSFS features)
        working-directory: kernel
        run: |
          set -euo pipefail
          export ARCH=arm64
          export PATH="${{ env.CLANG_DIR }}/bin:$PATH"
          export LLVM=1 LLVM_IAS=1 \
                 CLANG_TRIPLE=aarch64-linux-gnu- \
                 CROSS_COMPILE=aarch64-linux-gnu- \
                 CROSS_COMPILE_COMPAT=arm-linux-gnueabi-

          echo "== 直接向 defconfig 追加 SUSFS 配置 =="
          DEFCONFIG_PATH="./arch/arm64/configs/${{ env.DEFCONFIG_NAME }}"
          test -f "$DEFCONFIG_PATH" || { echo "::error::defconfig not found at $DEFCONFIG_PATH"; exit 1; }
          # 上游 defconfig 首行混入全角括号（"（CONFIG_MIHW=y"），kconfig 会警告并丢弃该行，
          # 导致小米 millet 驱动（drivers/mihw）被静默关闭，这里剥离全角括号修复
          sed -i 's/\xEF\xBC\x88//g; s/\xEF\xBC\x89//g' "$DEFCONFIG_PATH"
          grep -q '^CONFIG_MIHW=y' "$DEFCONFIG_PATH" \
            || { echo "::error::defconfig sanitize failed (MIHW line)"; exit 1; }
          for sym in KSU_SUSFS KSU_SUSFS_SUS_PATH KSU_SUSFS_SUS_MOUNT KSU_SUSFS_SUS_KSTAT \
                     KSU_SUSFS_SPOOF_UNAME KSU_SUSFS_ENABLE_LOG KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS \
                     KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG KSU_SUSFS_OPEN_REDIRECT KSU_SUSFS_SUS_MAP \
                     KSU_SUSFS_PRIORITY_UID_FILTER; do
            echo "CONFIG_${sym}=y" >> "$DEFCONFIG_PATH"
          done
          grep -q 'CONFIG_KSU_SUSFS_SUS_MAP=y' "$DEFCONFIG_PATH" \
            || { echo "::error::defconfig SUSFS append failed"; exit 1; }
          # sync-up 支线新增 KSU_SUSFS_PRIORITY_UID_FILTER（Kconfig line 247），其余符号两分支通用

          echo "== 关闭内核配置暴露面（config.gz/kheaders） =="
          # CONFIG_IKCONFIG_PROC 会把整份内核配置以 /proc/config.gz 全员可读放出，
          # CONFIG_KSU_SUSFS* 等设置一览无余；IKHEADERS 同理暴露 /proc/kheaders.tar.xz。
          # 一律硬关闭，消除免 Root 即可读取的"自编内核"指纹
          sed -i '/^CONFIG_IKCONFIG=/d; /^CONFIG_IKCONFIG_PROC=/d; /^CONFIG_IKHEADERS=/d; /^CONFIG_IKHEADERS_PROC=/d' "$DEFCONFIG_PATH"
          printf '# CONFIG_IKCONFIG is not set\n# CONFIG_IKCONFIG_PROC is not set\n# CONFIG_IKHEADERS is not set\n' >> "$DEFCONFIG_PATH"
          grep -q '^# CONFIG_IKCONFIG_PROC is not set' "$DEFCONFIG_PATH" \
            || { echo "::error::ikconfig disable append failed"; exit 1; }

          echo "== 生成 defconfig =="
          make O=out ARCH=arm64 "${{ env.DEFCONFIG_NAME }}"
          # 生成后复核：嵌入式配置不得再被打开
          if grep -q '^CONFIG_IKCONFIG_PROC=y\|^CONFIG_IKHEADERS_PROC=y' out/.config; then
            echo "::error::config exposure still enabled after defconfig"; exit 1
          fi

          echo "== 配置 BakaSU：SUSFS 全功能 =="
          scripts/config --file out/.config \
            --enable  KSU \
            --enable  KSU_SUSFS \
            --disable KSU_TRACEPOINT_HOOK \
            --disable KSU_MANUAL_HOOK \
            --enable  KALLSYMS_ALL \
            --enable  KSU_SUSFS_SUS_PATH \
            --enable  KSU_SUSFS_SUS_MOUNT \
            --enable  KSU_SUSFS_SUS_KSTAT \
            --enable  KSU_SUSFS_SPOOF_UNAME \
            --enable  KSU_SUSFS_ENABLE_LOG \
            --enable  KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS \
            --enable  KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG \
            --enable  KSU_SUSFS_OPEN_REDIRECT \
            --enable  KSU_SUSFS_SUS_MAP \
            --enable  KSU_SUSFS_PRIORITY_UID_FILTER \
            --disable UAPI_HEADER_TEST \
            --disable HEADERS_INSTALL \
            --set-str LOCALVERSION ""
            # /proc/version 不受 SUSFS SPOOF_UNAME 伪造，版本串带 susfs 等字样会被
            # 春秋/Momo 类检测直接读出；强制保持空串，内核串回归原厂形态

          make O=out ARCH=arm64 olddefconfig

          echo "== 校验 SUSFS 配置生效 =="
          for sym in KSU KSU_SUSFS KSU_SUSFS_SUS_PATH KSU_SUSFS_SUS_MOUNT KSU_SUSFS_SUS_KSTAT \
                     KSU_SUSFS_SPOOF_UNAME KSU_SUSFS_ENABLE_LOG KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS \
                     KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG KSU_SUSFS_OPEN_REDIRECT KSU_SUSFS_SUS_MAP \
                     KSU_SUSFS_PRIORITY_UID_FILTER; do
            grep -q "^CONFIG_${sym}=y" out/.config || { echo "::error::CONFIG_${sym} not enabled"; exit 1; }
          done
          grep -q "^CONFIG_KSU_MANUAL_HOOK=" out/.config && { echo "::error::KSU_MANUAL_HOOK should be off"; exit 1; } || true

      - name: 修复编译警告
        working-directory: kernel
        run: |
          set -e
          FOCALTECH_MAKEFILE="drivers/input/touchscreen/focaltech_touch/Makefile"
          if [ -f "$FOCALTECH_MAKEFILE" ]; then
            sed -i 's/^ \+/\t/' "$FOCALTECH_MAKEFILE"
            echo "Fixed leading spaces in focaltech Makefile"
          fi

          for entry in \
            "drivers/staging/qcacld-3.0:-Wno-format" \
            "drivers/staging/qca-wifi-host-cmn:-Wno-format" \
            "drivers/thermal:-Wno-fortify-source"; do
            DIR="${entry%%:*}"
            FLAG="${entry##*:}"
            if [ -d "$DIR" ] && [ -f "$DIR/Makefile" ]; then
              grep -q -- "$FLAG" "$DIR/Makefile" || echo "ccflags-y += $FLAG" >> "$DIR/Makefile"
            fi
          done

      - name: Build Kernel
        working-directory: kernel
        run: |
          export ARCH=arm64
          export PATH="${{ env.CLANG_DIR }}/bin:$PATH"
          export LLVM=1 LLVM_IAS=1 \
                 CLANG_TRIPLE=aarch64-linux-gnu- \
                 CROSS_COMPILE=aarch64-linux-gnu- \
                 CROSS_COMPILE_COMPAT=arm-linux-gnueabi-
          export CCACHE_DIR="${{ github.workspace }}/.ccache"
          export CCACHE_MAXSIZE=8G
          # 去除 CI 构建指纹：/proc/version 里嵌入的构建者/主机名/时间戳会被检测用作
          # "自编内核" 信号，固定为普通本地构建形态（对反检测同样有意义）
          export KBUILD_BUILD_USER=builder
          export KBUILD_BUILD_HOST=android-build
          export KBUILD_BUILD_TIMESTAMP="Thu Jun 12 10:00:00 UTC 2025"

          echo "== 预装 UAPI 头文件以启用 BakaSU preinit =="
          # vendor defconfig 不带 HEADERS_INSTALL，BakaSU preinit_runner.mk 检测不到
          # out/usr/include 会优雅降级为 -DKSU_NO_PREINIT。这里显式安装，启用 preinit
          make -j$(nproc) O=out ARCH=arm64 \
            CC="ccache clang" LD="ld.lld" AR="llvm-ar" NM="llvm-nm" \
            headers_install INSTALL_HDR_PATH="$PWD/out/usr" \
            || echo "::warning::headers_install failed, BakaSU preinit will stay disabled (non-fatal)"
          test -f out/usr/include/linux/unistd.h \
            && echo "-- preinit UAPI headers ready" \
            || echo "::warning::usr/include/linux/unistd.h missing, preinit will be disabled"

          set +e
          make -j$(nproc) O=out ARCH=arm64 \
            CC="ccache clang" LD="ld.lld" AR="llvm-ar" NM="llvm-nm" \
            OBJCOPY="llvm-objcopy" OBJDUMP="llvm-objdump" STRIP="llvm-strip" \
            CLANG_TRIPLE="aarch64-linux-gnu-" CROSS_COMPILE="aarch64-linux-gnu-" \
            KCFLAGS="-Wno-unknown-warning-option -Wno-error -Wno-format -Wno-incompatible-pointer-types \
            -Wno-implicit-function-declaration -Wno-strict-prototypes -Wno-missing-prototypes \
            -Wno-int-conversion -Wno-declaration-after-statement \
            -Wframe-larger-than=131072 -Wno-unused-variable -Wno-unused-function \
            -Wno-missing-braces -Wno-int-to-pointer-cast -Wno-address-of-packed-member \
            -Wno-return-type -Wno-shift-negative-value -Wno-array-bounds" \
            HOSTCFLAGS="" 2>&1 | tee build.log

          if [ ${PIPESTATUS[0]} -ne 0 ]; then
            echo "::error::Kernel build failed. Last 200 lines:"
            tail -n 200 build.log
            exit 1
          fi

          echo "=== Build finished ==="
          ccache -s 2>/dev/null || true
          ls -lh out/arch/arm64/boot/Image

      - name: Package AnyKernel3
        run: |
          set -e
          TIME=$(date +%Y%m%d-%H%M)
          IMG_PATH="${{ env.KERNEL_DIR }}/${{ env.OUTPUT_DIR }}/arch/arm64/boot/Image"
          test -f "$IMG_PATH"

          rm -rf AnyKernel3
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git
          cd AnyKernel3

          cp "$IMG_PATH" ./Image
          gzip -9 -f ./Image
          rm -f ./Image

          cat > anykernel.sh <<'AK3'
          ### AnyKernel3 Ramdisk Mod Script
          ## osm0sis @ xda-developers

          ### AnyKernel setup
          # global properties
          properties() { '
          kernel.string=Edwin BakaSU Full SUSFS for Xiaomi 11 Ultra / Pro (star)
          do.devicecheck=1
          do.modules=0
          do.systemless=1
          do.cleanup=1
          do.cleanuponabort=0
          device.name1=star
          device.name2=mars
          supported.versions=
          supported.patchlevels=
          supported.vendorpatchlevels=
          '; } # end properties

          ### AnyKernel install
          # boot files attributes
          boot_attributes() {
          set_perm_recursive 0 0 755 644 $RAMDISK/*;
          set_perm_recursive 0 0 750 750 $RAMDISK/init* $RAMDISK/sbin;
          } # end attributes

          # boot shell variables
          BLOCK=boot;
          IS_SLOT_DEVICE=1;
          RAMDISK_COMPRESSION=auto;
          PATCH_VBMETA_FLAG=auto;

          # import functions/variables and setup patching - see for reference (DO NOT REMOVE)
          . tools/ak3-core.sh;

          # boot install
          split_boot;

          flash_boot;
          ## end boot install
          AK3

          chmod +x anykernel.sh
          zip -r9 "../${{ env.DEVICE_CODENAME }}-BakaSU-SUSFS-Full-${TIME}.zip" ./*

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: kernel_bakasu_susfs_full
          path: ${{ env.DEVICE_CODENAME }}-BakaSU-SUSFS-Full-*.zip
