name: Build Kernel with SUSFS v2.3.0 (Clean 6 Files)

on:
  workflow_dispatch:

env:
  TZ: Asia/Shanghai
  DEVICE_CODENAME: "star"
  KERNEL_ARCH: "arm64"
  KERNEL_REPO: "zttlove/android_kernel_xiaomi_sm8350_miyume"
  KERNEL_BRANCH: "main"
  DEFCONFIG_NAME: "star_defconfig"
  OUTPUT_DIR: "out"
  CLANG_DIR: "${{ github.workspace }}/clang"
  CCACHE_DIR: "${{ github.workspace }}/.ccache"
  KERNEL_DIR: "${{ github.workspace }}/kernel"
  SUSFS_PATCH_FILE: "susfs_patch_to_5.4.patch"

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:

      - name: Checkout Kernel Source
        uses: actions/checkout@v4
        with:
          repository: ${{ env.KERNEL_REPO }}
          ref: ${{ env.KERNEL_BRANCH }}
          path: kernel
          fetch-depth: 1

      - name: Checkout Workflow Repo (Patches)
        uses: actions/checkout@v4
        with:
          path: workflow_repo
          fetch-depth: 1

      - name: Install Dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            bc bison flex libelf-dev libssl-dev libncurses-dev \
            make python3 device-tree-compiler git curl xz-utils \
            ccache zip unzip

          echo "正在修复 libtinfo.so.5 依赖..."
          if ! sudo apt install -y libtinfo5; then
            echo "直接安装 libtinfo5 失败，尝试创建软链接..."
            sudo ln -sf /lib/x86_64-linux-gnu/libtinfo.so.6 /lib/x86_64-linux-gnu/libtinfo.so.5
          fi

          if [ ! -f /lib/x86_64-linux-gnu/libtinfo.so.5 ]; then
            echo "::error::修复失败！libtinfo.so.5 仍然不存在。"
            exit 1
          else
            echo "✅ libtinfo.so.5 修复成功！"
          fi

      - name: Download Clang
        run: |
          mkdir -p ${{ env.CLANG_DIR }}
          curl -L --retry 3 -o clang.tar.xz "https://github.com/llvm/llvm-project/releases/download/llvmorg-18.1.8/clang+llvm-18.1.8-x86_64-linux-gnu-ubuntu-18.04.tar.xz"
          tar -xf clang.tar.xz -C ${{ env.CLANG_DIR }} --strip-components=1
          rm clang.tar.xz
          ${{ env.CLANG_DIR }}/bin/clang --version

      - name: Restore 6 clean files (no SUSFS v2.1)
        working-directory: kernel
        run: |
          CLEAN_DIR="${{ github.workspace }}/workflow_repo/patches/clean"

          echo "=== 检查 clean 目录 ==="
          ls -R "$CLEAN_DIR" || { echo "❌ clean 目录不存在"; exit 1; }

          echo "=== 覆盖 6 个干净文件 ==="
          cp "$CLEAN_DIR/fs/namei.c"                       fs/namei.c
          cp "$CLEAN_DIR/fs/stat.c"                        fs/stat.c
          cp "$CLEAN_DIR/fs/namespace.c"                   fs/namespace.c
          cp "$CLEAN_DIR/fs/proc/task_mmu.c"               fs/proc/task_mmu.c
          cp "$CLEAN_DIR/fs/proc/proc_namespace.c"         fs/proc/proc_namespace.c
          cp "$CLEAN_DIR/kernel/kallsyms.c"                kernel/kallsyms.c

          echo "✅ 6 个文件已覆盖"
          
      - name: Fix version mismatch in clean files
        working-directory: kernel
        run: |
          echo "=== 修复 task_mmu.c ==="
          sed -i '/#include <linux\/pgsize_migration.h>/d' fs/proc/task_mmu.c
          echo "✅ 已删除 pgsize_migration.h include"

          echo "=== 修复 kallsyms.c ==="
          # 结构体名
          sed -i 's/struct proc_ops/struct file_operations/g' kernel/kallsyms.c
          # 字段名
          sed -i 's/\.proc_open\b/.open/g'     kernel/kallsyms.c
          sed -i 's/\.proc_read\b/.read/g'     kernel/kallsyms.c
          sed -i 's/\.proc_lseek\b/.llseek/g'  kernel/kallsyms.c
          sed -i 's/\.proc_release\b/.release/g' kernel/kallsyms.c
          # 变量名（如果还叫 kallsyms_proc_ops，改成 kallsyms_operations）
          sed -i 's/kallsyms_proc_ops/kallsyms_operations/g' kernel/kallsyms.c
          echo "✅ 已修复 proc_ops → file_operations"

          echo "=== 验证 ==="
          grep -n "pgsize_migration" fs/proc/task_mmu.c || echo "task_mmu.c: 无 pgsize_migration"
          grep -n "proc_ops\|proc_open\|proc_read" kernel/kallsyms.c || echo "kallsyms.c: 无 proc_ops"
          echo "=== 验证残留 ==="
          for f in fs/namei.c fs/stat.c fs/namespace.c \
                   fs/proc/task_mmu.c fs/proc/proc_namespace.c kernel/kallsyms.c; do
            cnt=$(grep -c "susfs" "$f" 2>/dev/null || true)
            echo "$f: $cnt 处 susfs 引用"
          done

      - name: Setup ReSukiSU (main)
        working-directory: kernel
        run: |
          set -e
          echo "Cloning ReSukiSU main..."
          rm -rf drivers/kernelsu
          git clone https://github.com/ReSukiSU/ReSukiSU.git drivers/kernelsu
          cd drivers/kernelsu
          git log --oneline -1
          cd ../..

          echo "source \"drivers/kernelsu/kernel/Kconfig\"" > drivers/kernelsu/Kconfig
          echo "obj-y += kernel/" > drivers/kernelsu/Makefile
          sed -i '/source "drivers\/kernelsu\/Kconfig"/d' drivers/Kconfig || true
          sed -i '/obj-\$(CONFIG_KSU) += kernelsu\//d' drivers/Makefile || true
          echo "source \"drivers/kernelsu/Kconfig\"" >> drivers/Kconfig
          echo "obj-\$(CONFIG_KSU) += kernelsu/" >> drivers/Makefile

      - name: Apply SUSFS v2.3.0 Patch
        working-directory: kernel
        run: |
          PATCH="${{ github.workspace }}/workflow_repo/Patches/Patch/${{ env.SUSFS_PATCH_FILE }}"
          patch -p1 -N --batch --no-backup-if-mismatch < "$PATCH" || true
          echo "=== 补丁应用完成，检查 .rej ==="
          find . -name "*.rej" | head -30
          echo "=== .rej 数量 ==="
          find . -name "*.rej" | wc -l

      # ============================================================
      # 以下修复步骤已注释掉，因为 6 个文件已是干净版本，
      # 这些修复要么失效，要么会破坏干净代码。
      # 若编译报错指出还需要某一步，再逐个取消注释。
      # ============================================================

      # - name: Fix task_mmu.c return errors for SUS_MAP/SUS_KSTAT
      #   working-directory: kernel
      #   run: |
      #     ... (原步骤内容)

      # - name: Enable KSU_SUSFS_SUS_MOUNT (fix missing symbols)
      #   working-directory: kernel
      #   run: |
      #     ... (原步骤内容)

      # - name: Fix legacy variable name in proc_namespace.c
      #   working-directory: kernel
      #   run: |
      #     ... (原步骤内容)

      # - name: Fix conflicting susfs_kstat declaration
      #   working-directory: kernel
      #   run: |
      #     ... (原步骤内容)

      # - name: Add STATX_SUS_KSTAT macros to susfs_def.h
      #   working-directory: kernel
      #   run: |
      #     ... (原步骤内容)

      # - name: Fix STATX_SUS_KSTAT visibility
      #   working-directory: kernel
      #   run: |
      #     ... (原步骤内容)

      # - name: Remove duplicate v2.3 susfs_alloc functions in namespace.c
      #   working-directory: kernel
      #   run: |
      #     ... (原步骤内容)

      - name: Create dummy seccomp_types.h to suppress grep warning
        working-directory: kernel
        run: |
          mkdir -p include/linux
          touch include/linux/seccomp_types.h
          echo "✅ 已创建占位文件，消除 grep 警告"

      - name: Configure Kernel
        working-directory: kernel
        run: |
          export ARCH=${{ env.KERNEL_ARCH }}
          export PATH="${{ env.CLANG_DIR }}/bin:$PATH"
          export CCACHE_EXEC=$(which ccache)
          export CCACHE_DIR="${{ env.CCACHE_DIR }}"
          ccache -M 6G
          export LLVM=1 LLVM_IAS=1 CLANG_TRIPLE=aarch64-linux-gnu- \
                 CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi-

          make mrproper || true
          make -j$(nproc) O=${{ env.OUTPUT_DIR }} ${{ env.DEFCONFIG_NAME }}

          scripts/config --file ${{ env.OUTPUT_DIR }}/.config \
            --enable KSU \
            --enable INIT_ON_ALLOC_DEFAULT_ON \
            --enable KSU_HOOK_INLINE \
            --disable KSU_HOOK_TRACEPOINT \
            --disable KSU_HOOK_MANUAL \
            --enable KSU_SELINUX \
            --enable KSU_ZYGISK \
            --disable KPROBES \
            --disable HAVE_KPROBES \
            --disable KPROBE_EVENTS \
            --enable KALLSYMS \
            --enable KALLSYMS_ALL \
            --enable MODULES \
            --enable MODULE_UNLOAD \
            --enable OVERLAY_FS \
            --enable EXT4_FS \
            --enable NAMESPACES \
            --disable KSU_DEBUG \
            --enable KSU_SUSFS \
            --enable KSU_SUSFS_SUS_PATH \
            --enable KSU_SUSFS_SUS_MOUNT \
            --enable KSU_SUSFS_SUS_KSTAT \
            --enable KSU_SUSFS_SPOOF_UNAME \
            --enable KSU_SUSFS_OPEN_REDIRECT \
            --enable KSU_SUSFS_SUS_MAP \
            --enable KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS \
            --enable KSU_SUSFS_ENABLE_LOG \
            --enable KSU_SUSFS_SUS_SU \
            --set-val CONFIG_FRAME_WARN 3072

          make olddefconfig O=${{ env.OUTPUT_DIR }}

      - name: Build Kernel
        working-directory: kernel
        run: |
          set -e
          export ARCH=${{ env.KERNEL_ARCH }}
          export PATH="${{ env.CLANG_DIR }}/bin:$PATH"
          export CCACHE_EXEC=$(which ccache)
          export CCACHE_DIR="${{ env.CCACHE_DIR }}"
          ccache -M 6G
          export LLVM=1 LLVM_IAS=1 CLANG_TRIPLE=aarch64-linux-gnu- \
                 CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi-

          make -j$(nproc) O=${{ env.OUTPUT_DIR }} \
            KCFLAGS="-Wno-strict-prototypes -Wno-align-mismatch -Wno-unused-function -Wno-compare-distinct-pointer-types -Wno-void-pointer-to-int-cast -Wno-array-parameter -Wno-declaration-after-statement"

          if [ ! -f "${{ env.OUTPUT_DIR }}/arch/arm64/boot/Image" ]; then
            echo "ERROR: Kernel Image not found!"
            exit 1
          fi

      - name: Package AnyKernel3
        id: package
        run: |
          TIME=$(date +"%Y.%m.%d")
          AK3_DIR="AnyKernel3"
          IMG_PATH="${{ env.KERNEL_DIR }}/${{ env.OUTPUT_DIR }}/arch/arm64/boot/Image"
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git $AK3_DIR
          cp -f "$IMG_PATH" "$AK3_DIR/Image"

          sed -i 's/^do.devicecheck=1/do.devicecheck=0/' "$AK3_DIR/anykernel.sh"
          sed -i 's/^BLOCK=.*/BLOCK=boot/' "$AK3_DIR/anykernel.sh"
          sed -i 's/^IS_SLOT_DEVICE=0/IS_SLOT_DEVICE=1/' "$AK3_DIR/anykernel.sh"
          sed -i 's/^device.name1=.*/device.name1=star/' "$AK3_DIR/anykernel.sh"

          cd $AK3_DIR
          zip -r9 "../${{ env.DEVICE_CODENAME }}-SUSFS_v2.3.0-clean6-${TIME}.zip" ./*
          cd ..
          echo "zip_name=${{ env.DEVICE_CODENAME }}-SUSFS_v2.3.0-clean6-${TIME}.zip" >> $GITHUB_OUTPUT

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: kernel_susfs_v2.3.0_clean6
          path: ${{ env.DEVICE_CODENAME }}-SUSFS_v2.3.0-clean6-*.zip

      - name: Optional Release
        if: github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: susfs_v2.3.0_clean6_${{ github.run_number }}
          name: "SUSFS v2.3.0 (6 clean files)"
          body: |
            ## 测试内核 - SUSFS v2.3.0（覆盖 6 个干净文件）
            - ReSukiSU main
            - 已覆盖 fs/namei.c、fs/stat.c、fs/namespace.c、fs/proc/task_mmu.c、fs/proc_namespace.c、kernel/kallsyms.c
            - 其余 14 个文件仍带 SUSFS v2.1
            - 刷机有风险，请备份原内核
          files: ${{ env.DEVICE_CODENAME }}-SUSFS_v2.3.0-clean6-*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
