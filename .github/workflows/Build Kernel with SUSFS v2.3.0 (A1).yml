name: Build Kernel with SUSFS (A1)

on:
  workflow_dispatch:

env:
  TZ: Asia/Shanghai
  DEVICE_CODENAME: "star"
  KERNEL_ARCH: "arm64"
  KERNEL_REPO: "zttlove/android_kernel_xiaomi_sm8350_miyume"
  KERNEL_BRANCH: "fix-root2"
  DEFCONFIG_NAME: "star_defconfig"
  OUTPUT_DIR: "out"
  CLANG_DIR: "${{ github.workspace }}/clang"
  CCACHE_DIR: "${{ github.workspace }}/.ccache"
  KERNEL_DIR: "${{ github.workspace }}/kernel"


jobs:
  build:
    runs-on: ubuntu-22.04
    steps:

      - name: Checkout Kernel Source
        uses: actions/checkout@v4
        with:
          repository: ${{ env.KERNEL_REPO }}
          ref: ${{ env.KERNEL_BRANCH }}
          path: kernel
          fetch-depth: 1

      - name: Checkout Workflow Repo (Patches)
        uses: actions/checkout@v4
        with:
          path: workflow_repo
          fetch-depth: 1

      - name: Install Dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            bc bison flex libelf-dev libssl-dev libncurses-dev \
            make python3 device-tree-compiler git curl xz-utils \
            ccache zip unzip
          echo "正在修复 libtinfo.so.5 依赖..."
          if ! sudo apt install -y libtinfo5; then
            sudo ln -sf /lib/x86_64-linux-gnu/libtinfo.so.6 /lib/x86_64-linux-gnu/libtinfo.so.5
          fi
          if [ ! -f /lib/x86_64-linux-gnu/libtinfo.so.5 ]; then
            echo "::error::修复失败！libtinfo.so.5 仍然不存在。"
            exit 1
          else
            echo "✅ libtinfo.so.5 修复成功！"
          fi

      - name: Download Clang
        run: |
          mkdir -p ${{ env.CLANG_DIR }}
          curl -L --retry 3 -o clang.tar.xz "https://github.com/llvm/llvm-project/releases/download/llvmorg-18.1.8/clang+llvm-18.1.8-x86_64-linux-gnu-ubuntu-18.04.tar.xz"
          tar -xf clang.tar.xz -C ${{ env.CLANG_DIR }} --strip-components=1
          rm clang.tar.xz
          ${{ env.CLANG_DIR }}/bin/clang --version

      # ============================================================
      # 2. 安装 ReSukiSU（pin 到 b2ac2fc）
      # ============================================================
      - name: Setup ReSukiSU (main)
        working-directory: kernel
        run: |
          set -e
          rm -rf drivers/kernelsu
          git clone https://github.com/ReSukiSU/ReSukiSU.git drivers/kernelsu
          cd drivers/kernelsu
          git checkout main
          cd ../..
          echo "source \"drivers/kernelsu/kernel/Kconfig\"" > drivers/kernelsu/Kconfig
          echo "obj-\$(CONFIG_KSU) += kernel/" > drivers/kernelsu/Makefile
          sed -i '/source "drivers\/kernelsu\/Kconfig"/d' drivers/Kconfig || true
          sed -i '/obj-\$(CONFIG_KSU) += kernelsu\//d' drivers/Makefile || true
          echo "source \"drivers/kernelsu/Kconfig\"" >> drivers/Kconfig
          echo "obj-\$(CONFIG_KSU) += kernelsu/" >> drivers/Makefile

      - name: Patch ReSukiSU Kconfig (move KSU_SUSFS out of choice)
        working-directory: kernel
        run: |
          set -e
          KCONFIG=drivers/kernelsu/kernel/Kconfig

          if ! grep -q "^config KSU_SUSFS$" "$KCONFIG"; then
            echo "::error::Kconfig 中没有找到 config KSU_SUSFS"
            exit 1
          fi

          cp "$KCONFIG" "$KCONFIG.orig"

          awk '
            BEGIN { in_susfs=0; skipped=0 }
            /^config KSU_SUSFS$/ && !in_susfs {
              print "endchoice"
              print ""
              in_susfs=1
              print
              next
            }
            in_susfs && /^[[:space:]]+depends on .*THREAD_INFO_IN_TASK/ {
              print "\tdepends on KSU && THREAD_INFO_IN_TASK && 64BIT"
              next
            }
            in_susfs && /^endchoice$/ && !skipped {
              skipped=1
              in_susfs=0
              next
            }
            { print }
          ' "$KCONFIG.orig" > "$KCONFIG"

          echo "=== 修改后的 choice / config 结构 ==="
          grep -nE "^(choice|endchoice|config KSU_(TRACEPOINT|MANUAL|SUSFS))" "$KCONFIG"

          echo "=== KSU_SUSFS 块前 8 行 ==="
          grep -A7 "^config KSU_SUSFS$" "$KCONFIG" | head -8

      - name: Inspect kernel hooks
        working-directory: kernel
        run: |
          echo "=== 旧版 Hook（不该有） ==="
          grep -rn "ksu_vfs_read_hook\|ksu_input_hook\|ksu_execveat_hook\|ksu_init_rc_hook" \
            fs/read_write.c fs/exec.c fs/stat.c drivers/input/input.c || echo "(无)"
          echo "=== 新版 Hook（必须有） ==="
          for f in "kernel/sys.c:ksu_handle_setresuid" \
                   "fs/exec.c:ksu_handle_execveat" \
                   "fs/open.c:ksu_handle_faccessat" \
                   "fs/read_write.c:ksu_handle_sys_read" \
                   "fs/stat.c:ksu_handle_stat" \
                   "kernel/reboot.c:ksu_handle_sys_reboot" \
                   "drivers/input/input.c:ksu_handle_input_handle_event"; do
            file="${f%%:*}"; sym="${f##*:}"
            if grep -qw "$sym" "$file"; then
              echo "✅ $sym in $file"
            else
              echo "❌ MISSING: $sym in $file"
            fi
          done
          
      - name: Inspect SUSFS namespace symbols
        working-directory: kernel
        run: |
          echo "=== 1. namespace.c 里的 susfs include ==="
          grep -n "linux/susfs" fs/namespace.c || echo "(无)"

          echo ""
          echo "=== 2. susfs.h 里的声明 ==="
          grep -n "susfs_alloc_non_unshare_ksu_vfsmnt\|susfs_alloc_unshare_ksu_vfsmnt" \
            include/linux/susfs.h || echo "(无)"

          echo ""
          echo "=== 3. susfs.c 里的实现 ==="
          grep -n "susfs_alloc_non_unshare_ksu_vfsmnt\|susfs_alloc_unshare_ksu_vfsmnt" \
            fs/susfs.c || echo "(无)"

          echo ""
          echo "=== 4. namespace.c 用到这两个函数的位置 ==="
          grep -n "susfs_alloc_non_unshare_ksu_vfsmnt\|susfs_alloc_unshare_ksu_vfsmnt" \
            fs/namespace.c || echo "(无)"
     

      # ============================================================
      # 5. 配置内核
      # ============================================================
      - name: Configure Kernel
        working-directory: kernel
        run: |
          export ARCH=${{ env.KERNEL_ARCH }}
          export PATH="${{ env.CLANG_DIR }}/bin:$PATH"
          export CCACHE_EXEC=$(which ccache)
          export CCACHE_DIR="${{ env.CCACHE_DIR }}"
          ccache -M 6G
          export LLVM=1 LLVM_IAS=1 CLANG_TRIPLE=aarch64-linux-gnu- \
                 CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          make mrproper || true
          make -j$(nproc) O=${{ env.OUTPUT_DIR }} ${{ env.DEFCONFIG_NAME }}
          scripts/config --file ${{ env.OUTPUT_DIR }}/.config \
            --enable KSU \
            --enable INIT_ON_ALLOC_DEFAULT_ON \
            --disable KSU_TRACEPOINT_HOOK \
            --enable  KSU_MANUAL_HOOK \
            --enable KSU_SELINUX \
            --enable KSU_ZYGISK \
            --enable KPROBES \
            --enable HAVE_KPROBES \
            --enable KPROBE_EVENTS \
            --enable KALLSYMS \
            --enable KALLSYMS_ALL \
            --enable MODULES \
            --enable MODULE_UNLOAD \
            --enable OVERLAY_FS \
            --enable EXT4_FS \
            --enable NAMESPACES \
            --disable KSU_DEBUG \
            --disable KSU_SUSFS \
            --disable KSU_SUSFS_SUS_PATH \
            --disable KSU_SUSFS_SUS_MOUNT \
            --disable KSU_SUSFS_SUS_KSTAT \
            --disable KSU_SUSFS_SPOOF_UNAME \
            --disable KSU_SUSFS_OPEN_REDIRECT \
            --disable KSU_SUSFS_SUS_MAP \
            --disable KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS \
            --disable KSU_SUSFS_ENABLE_LOG \
            --disable KSU_SUSFS_SUS_SU \
            --disable STATIC_USERMODEHELPER \
            --enable CPU_FREQ \
            --enable ENERGY_MODEL \
            --enable CPU_IDLE \
            --disable KSU_MANUAL_HOOK_AUTO_SETUID_HOOK \
            --disable KSU_MANUAL_HOOK_AUTO_INITRC_HOOK \
            --disable KSU_MANUAL_HOOK_AUTO_INPUT_HOOK \
            --enable CPU_THERMAL \
            --enable THERMAL \
            --enable THERMAL_GOV_POWER_ALLOCATOR \
            --enable THERMAL_GOV_USER_SPACE \
            --set-val FRAME_WARN 3072
          make olddefconfig O=${{ env.OUTPUT_DIR }}
          grep -E 'CONFIG_(KSU|KSU_SUSFS|KPROBES|KALLSYMS|MODULES)' ${{ env.OUTPUT_DIR }}/.config || true
          grep -E 'CONFIG_(CPU_FREQ|ENERGY_MODEL|CPU_IDLE)' ${{ env.OUTPUT_DIR }}/.config
          grep -nE "config KSU.*HOOK" drivers/kernelsu/kernel/Kconfig
          
          echo "=== SUSFS 配置校验（应全部为 n） ==="
          if grep -q "CONFIG_KSU_SUSFS.*=y" ${{ env.OUTPUT_DIR }}/.config; then
            echo "::error::仍有 SUSFS 配置被启用"
            grep "CONFIG_KSU_SUSFS.*=y" ${{ env.OUTPUT_DIR }}/.config
            exit 1
          fi
          echo "✅ SUSFS 全部禁用"

          echo "=== 基础配置校验 ==="
          for sym in CONFIG_KSU CONFIG_KSU_MANUAL_HOOK; do
            if grep -q "^${sym}=y" ${{ env.OUTPUT_DIR }}/.config; then
              echo "✅ ${sym}=y"
            else
              echo "::error::${sym} 未启用"
              exit 1
            fi
          done
          echo "✅ 基础配置正确"
          grep -E "CONFIG_KSU_SUSFS" out/.config | head -20
      
      - name: Locate cpu_limits_set_level
        working-directory: kernel
        run: |
          echo "=== 全内核搜索 cpu_limits_set_level ==="
          grep -rn "cpu_limits_set_level" --include="*.c" --include="*.h" . 2>/dev/null | head -30 || echo "(未找到)"

          echo ""
          echo "=== 检查 lib/xarray.c 顶部 include ==="
          head -40 lib/xarray.c

          echo ""
          echo "=== 检查是否有别的 xarray.c ==="
          find . -name "xarray.c" -not -path "./out/*"
      
      - name: Check SUSFS integration coverage
        working-directory: kernel
        run: |
          echo "=== 有 SUSFS 改动的文件 ==="
          for f in fs/namei.c fs/readdir.c fs/stat.c fs/statfs.c fs/super.c \
                   fs/proc/base.c fs/proc/fd.c fs/proc/cmdline.c fs/proc/task_mmu.c \
                   fs/proc_namespace.c fs/notify/fdinfo.c kernel/kallsyms.c \
                   kernel/sys.c mm/memory.c security/selinux/avc.c; do
            if grep -q "susfs_\|SUSFS_" "$f" 2>/dev/null; then
              echo "✅ $f"
            else
              echo "❌ $f"
            fi
          done

          echo ""
          echo "=== namespace.c 的 SUSFS 改动行数 ==="
          grep -c "susfs_\|SUSFS_" fs/namespace.c || echo 0
          
      # ============================================================
      # 6. 编译（输出 build.log 便于排查）
      # ============================================================
      - name: Build Kernel
        working-directory: kernel
        run: |
          set -e
          export ARCH=${{ env.KERNEL_ARCH }}
          export PATH="${{ env.CLANG_DIR }}/bin:$PATH"
          export CCACHE_EXEC=$(which ccache)
          export CCACHE_DIR="${{ env.CCACHE_DIR }}"
          ccache -M 6G
          export LLVM=1 LLVM_IAS=1 CLANG_TRIPLE=aarch64-linux-gnu- \
          CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          make -j$(nproc) O=${{ env.OUTPUT_DIR }} \
          KCFLAGS="-Wno-strict-prototypes -Wno-align-mismatch -Wno-unused-function -Wno-compare-distinct-pointer-types -Wno-void-pointer-to-int-cast -Wno-array-parameter -Wno-declaration-after-statement" \
          2>&1 | tee build.log

          
      # ============================================================
      # 7. 打包 AnyKernel3
      # ============================================================
      - name: Package AnyKernel3
        id: package
        run: |
          TIME=$(date +"%Y.%m.%d")
          AK3_DIR="AnyKernel3"
          IMG_PATH="${{ env.KERNEL_DIR }}/${{ env.OUTPUT_DIR }}/arch/arm64/boot/Image"
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git $AK3_DIR
          cp -f "$IMG_PATH" "$AK3_DIR/Image"
          sed -i 's/^do.devicecheck=1/do.devicecheck=0/' "$AK3_DIR/anykernel.sh"
          sed -i 's/^BLOCK=.*/BLOCK=boot/' "$AK3_DIR/anykernel.sh"
          sed -i 's/^IS_SLOT_DEVICE=0/IS_SLOT_DEVICE=1/' "$AK3_DIR/anykernel.sh"
          sed -i 's/^device.name1=.*/device.name1=star/' "$AK3_DIR/anykernel.sh"
          cd $AK3_DIR
          zip -r9 "../${{ env.DEVICE_CODENAME }}-SUSFS-reponative-sp-${TIME}.zip" ./*
          cd ..
          echo "zip_name=${{ env.DEVICE_CODENAME }}-SUSFS-reponative-sp-${TIME}.zip" >> $GITHUB_OUTPUT

      # ============================================================
      # 8. 上传
      # ============================================================
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: kernel_susfs_reponative_sp
          path: ${{ env.DEVICE_CODENAME }}-SUSFS-reponative-sp-*.zip

      - name: Upload build.log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build_log
          path: kernel/build.log
          if-no-files-found: ignore

      - name: Optional Release
        if: github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: susfs_reponative_sp_${{ github.run_number }}
          name: "SUSFS (Repo-native + KPROBES Hook)"
          body: |
            ## 测试内核 - 仓库自带 SUSFS
            - ReSukiSU b2ac2fc (v35089)
            - 仓库自带 SUSFS
            - KPROBES/Tracepoint Hook
            - inline_hook_check.mk 已绕过
            - 刷机有风险，请备份原内核
          files: ${{ env.DEVICE_CODENAME }}-SUSFS-reponative-sp-*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
