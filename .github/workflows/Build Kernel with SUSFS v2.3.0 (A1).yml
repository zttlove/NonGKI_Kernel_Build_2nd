name: Build Kernel with ReSukiSU (Power Saving)

on:
  workflow_dispatch:

env:
  TZ: Asia/Shanghai
  DEVICE_CODENAME: "star"
  KERNEL_ARCH: "arm64"
  KERNEL_REPO: "zttlove/android_kernel_xiaomi_sm8350-hyperos"
  KERNEL_BRANCH: "dynamic"
  DEFCONFIG_NAME: "vendor/star_defconfig"
  OUTPUT_DIR: "out"
  CLANG_DIR: "${{ github.workspace }}/clang"
  CCACHE_DIR: "${{ github.workspace }}/.ccache"
  KERNEL_DIR: "${{ github.workspace }}/kernel"
  RESUKISU_REPO: "https://github.com/ReSukiSU/ReSukiSU.git"
  RESUKISU_BRANCH: "main"

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:

      - name: Checkout Kernel Source
        uses: actions/checkout@v4
        with:
          repository: ${{ env.KERNEL_REPO }}
          ref: ${{ env.KERNEL_BRANCH }}
          path: kernel
          fetch-depth: 1

      - name: Checkout Workflow Repo (Patches)
        uses: actions/checkout@v4
        with:
          path: workflow_repo
          fetch-depth: 1

      - name: Install Dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            bc bison flex libelf-dev libssl-dev libncurses-dev \
            make python3 device-tree-compiler git curl xz-utils \
            ccache zip unzip zstd
          echo "正在修复 libtinfo.so.5 依赖..."
          if ! sudo apt install -y libtinfo5; then
            sudo ln -sf /lib/x86_64-linux-gnu/libtinfo.so.6 /lib/x86_64-linux-gnu/libtinfo.so.5
          fi
          if [ ! -f /lib/x86_64-linux-gnu/libtinfo.so.5 ]; then
            echo "::error::修复失败！libtinfo.so.5 仍然不存在。"
            exit 1
          else
            echo "✅ libtinfo.so.5 修复成功！"
          fi

      - name: Download Clang 23.1.2 (From LLVM GitHub)
        run: |
          mkdir -p ${{ env.CLANG_DIR }}
          curl -L --retry 3 -o LLVM-23.1.2-Linux-X64.tar.xz "https://github.com/llvm/llvm-project/releases/download/llvmorg-23.1.2/LLVM-23.1.2-Linux-X64.tar.xz"
          tar -xf LLVM-23.1.2-Linux-X64.tar.xz -C ${{ env.CLANG_DIR }} --strip-components=1
          rm LLVM-23.1.2-Linux-X64.tar.xz
          ${{ env.CLANG_DIR }}/bin/clang --version

      - name: Clone ReSukiSU (main branch)
        run: |
          cd ${{ env.KERNEL_DIR }}
          git clone --depth=1 --branch ${{ env.RESUKISU_BRANCH }} ${{ env.RESUKISU_REPO }} resukisu
          echo "ReSukiSU cloned, latest commit:"
          cd resukisu && git log --oneline -1

      - name: Integrate ReSukiSU into Kernel
        working-directory: kernel
        run: |
          set -e
          export ARCH=${{ env.KERNEL_ARCH }}
          export PATH="${{ env.CLANG_DIR }}/bin:$PATH"
          export CCACHE_EXEC=$(which ccache)
          export CCACHE_DIR="${{ env.CCACHE_DIR }}"
          ccache -M 6G
          export LLVM=1 LLVM_IAS=1 CLANG_TRIPLE=aarch64-linux-gnu- \
                 CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi-

          echo "=== 运行 ReSukiSU 集成脚本 (builtin 内置构建) ==="
          curl -LSs "https://raw.githubusercontent.com/ReSukiSU/ReSukiSU/main/kernel/setup.sh" | bash -s builtin
          
          echo "=== 检查集成结果 ==="
          if [ -d "drivers/kernelsu" ]; then
            echo "✅ drivers/kernelsu 目录已存在"
          else
            echo "::error::集成失败，drivers/kernelsu 目录不存在"
            exit 1
          fi

          echo "=== 修复 Clang 23 的 default-const-init-var-unsafe 警告 (修改 typecheck.h) ==="
          if [ -f "include/linux/typecheck.h" ]; then
            sed -i 's/typeof(x) __dummy2; \\/typeof(x) __dummy2 = (typeof(x))0; \\/' include/linux/typecheck.h || true
            echo "✅ 已尝试修复 typecheck.h"
          fi

          echo "正在清空 ccache 缓存..."
          ccache -C

          echo "正在修复 focaltech_3680 Makefile..."
          FOCALTECH_MAKEFILE="drivers/input/touchscreen/focaltech_3680/Makefile"
          if [ -f "$FOCALTECH_MAKEFILE" ]; then
            sed -i 's/^ \+/\t/' "$FOCALTECH_MAKEFILE"
            echo "✅ 已修复 focaltech_3680 Makefile 缩进"
          fi

          echo "=== 为 lz4p 子目录追加 -Wno-declaration-after-statement ==="
          LZ4P_MAKEFILE="drivers/block/zram/lz4p/Makefile"
          if [ -f "$LZ4P_MAKEFILE" ]; then
            if ! grep -q "Wno-declaration-after-statement" "$LZ4P_MAKEFILE"; then
              echo "ccflags-y += -Wno-declaration-after-statement" >> "$LZ4P_MAKEFILE"
              echo "✅ 已为 lz4p Makefile 追加警告禁用选项"
            else
              echo "ℹ️ lz4p Makefile 已包含该选项，跳过"
            fi
          else
            echo "ℹ️ 未找到 lz4p Makefile，跳过"
          fi

          echo "=== 为 cpuidle 子目录追加 -Wno-default-const-init-field-unsafe ==="
          CPUIDLE_MAKEFILE="drivers/cpuidle/Makefile"
          if [ -f "$CPUIDLE_MAKEFILE" ]; then
            if ! grep -q "Wno-default-const-init-field-unsafe" "$CPUIDLE_MAKEFILE"; then
              echo "ccflags-y += -Wno-default-const-init-field-unsafe" >> "$CPUIDLE_MAKEFILE"
              echo "✅ 已为 cpuidle Makefile 追加警告禁用选项"
            else
              echo "ℹ️ cpuidle Makefile 已包含该选项，跳过"
            fi
          else
            echo "ℹ️ 未找到 cpuidle Makefile，跳过"
          fi

          echo "=== 修复 sde_rm.c 中 pp_cfg 未初始化警告 ==="
          SDE_RM_FILE="techpack/display/msm/sde/sde_rm.c"
          if [ -f "$SDE_RM_FILE" ]; then
            sed -i 's/const struct sde_pingpong_cfg \*pp_cfg;/const struct sde_pingpong_cfg *pp_cfg = NULL;/' "$SDE_RM_FILE"
            echo "✅ 已修复 sde_rm.c 中 pp_cfg 未初始化警告"
          else
            echo "ℹ️ 未找到 sde_rm.c，跳过"
          fi

          echo "=== 为 coresight 子目录追加 -Wno-sometimes-uninitialized ==="
          CORESIGHT_MAKEFILE="drivers/hwtracing/coresight/Makefile"
          if [ -f "$CORESIGHT_MAKEFILE" ]; then
            if ! grep -q "Wno-sometimes-uninitialized" "$CORESIGHT_MAKEFILE"; then
              echo "ccflags-y += -Wno-sometimes-uninitialized" >> "$CORESIGHT_MAKEFILE"
              echo "✅ 已为 coresight Makefile 追加警告禁用选项"
            else
              echo "ℹ️ coresight Makefile 已包含该选项，跳过"
            fi
          else
            echo "ℹ️ 未找到 coresight Makefile，跳过"
          fi

          echo "=== 为 mi_disp 子目录追加 -Wno-misleading-indentation ==="
          MI_DISP_MAKEFILE="techpack/display/msm/mi_disp/Makefile"
          if [ -f "$MI_DISP_MAKEFILE" ]; then
            if ! grep -q "Wno-misleading-indentation" "$MI_DISP_MAKEFILE"; then
              echo "ccflags-y += -Wno-misleading-indentation" >> "$MI_DISP_MAKEFILE"
              echo "✅ 已为 mi_disp Makefile 追加警告禁用选项"
            else
              echo "ℹ️ mi_disp Makefile 已包含该选项，跳过"
            fi
          else
            echo "ℹ️ 未找到 mi_disp Makefile，尝试上层目录"
            TECH_DISP_MAKEFILE="techpack/display/msm/Makefile"
            if [ -f "$TECH_DISP_MAKEFILE" ]; then
              if ! grep -q "Wno-misleading-indentation" "$TECH_DISP_MAKEFILE"; then
                echo "ccflags-y += -Wno-misleading-indentation" >> "$TECH_DISP_MAKEFILE"
                echo "✅ 已为 techpack/display/msm Makefile 追加警告禁用选项"
              else
                echo "ℹ️ techpack/display/msm Makefile 已包含该选项，跳过"
              fi
            else
              echo "ℹ️ 未找到 techpack/display/msm Makefile，跳过"
            fi
          fi

          echo "=== 为 aw8697_haptic 子目录追加 -Wno-unused-function ==="
          AW8697_MAKEFILE="drivers/input/misc/aw8697_haptic/Makefile"
          if [ -f "$AW8697_MAKEFILE" ]; then
            if ! grep -q "Wno-unused-function" "$AW8697_MAKEFILE"; then
              echo "ccflags-y += -Wno-unused-function" >> "$AW8697_MAKEFILE"
              echo "✅ 已为 aw8697_haptic Makefile 追加警告禁用选项"
            else
              echo "ℹ️ aw8697_haptic Makefile 已包含该选项，跳过"
            fi
          else
            echo "ℹ️ 未找到 aw8697_haptic Makefile，跳过"
          fi

          echo "=== 为 cyttsp5 子目录追加 -Wno-misleading-indentation ==="
          CYTTSP5_MAKEFILE="drivers/input/touchscreen/cyttsp5/Makefile"
          if [ -f "$CYTTSP5_MAKEFILE" ]; then
            if ! grep -q "Wno-misleading-indentation" "$CYTTSP5_MAKEFILE"; then
              echo "ccflags-y += -Wno-misleading-indentation" >> "$CYTTSP5_MAKEFILE"
              echo "✅ 已为 cyttsp5 Makefile 追加警告禁用选项"
            else
              echo "ℹ️ cyttsp5 Makefile 已包含该选项，跳过"
            fi
          else
            echo "ℹ️ 未找到 cyttsp5 Makefile，跳过"
          fi

          echo "=== 为 v4l2-core 子目录追加 -Wno-default-const-init-field-unsafe ==="
          V4L2_CORE_MAKEFILE="drivers/media/v4l2-core/Makefile"
          if [ -f "$V4L2_CORE_MAKEFILE" ]; then
            if ! grep -q "Wno-default-const-init-field-unsafe" "$V4L2_CORE_MAKEFILE"; then
              echo "ccflags-y += -Wno-default-const-init-field-unsafe" >> "$V4L2_CORE_MAKEFILE"
              echo "✅ 已为 v4l2-core Makefile 追加警告禁用选项"
            else
              echo "ℹ️ v4l2-core Makefile 已包含该选项，跳过"
            fi
          else
            echo "ℹ️ 未找到 v4l2-core Makefile，跳过"
          fi

          echo "=== 为 thermal 子目录追加 -Wno-fortify-source ==="
          THERMAL_MAKEFILE="drivers/thermal/Makefile"
          if [ -f "$THERMAL_MAKEFILE" ]; then
            if ! grep -q "Wno-fortify-source" "$THERMAL_MAKEFILE"; then
              echo "ccflags-y += -Wno-fortify-source" >> "$THERMAL_MAKEFILE"
              echo "✅ 已为 thermal Makefile 追加警告禁用选项"
            else
              echo "ℹ️ thermal Makefile 已包含该选项，跳过"
            fi
          else
            echo "ℹ️ 未找到 thermal Makefile，跳过"
          fi

          echo "=== 为 8250 串口子目录追加 -Wno-macro-redefined ==="
          SERIAL_8250_MAKEFILE="drivers/tty/serial/8250/Makefile"
          if [ -f "$SERIAL_8250_MAKEFILE" ]; then
            if ! grep -q "Wno-macro-redefined" "$SERIAL_8250_MAKEFILE"; then
              echo "ccflags-y += -Wno-macro-redefined" >> "$SERIAL_8250_MAKEFILE"
              echo "✅ 已为 8250 Makefile 追加警告禁用选项"
            else
              echo "ℹ️ 8250 Makefile 已包含该选项，跳过"
            fi
          else
            echo "ℹ️ 未找到 8250 Makefile，跳过"
          fi

          echo "=== 为 dwc3 子目录追加 -Wno-unused-label ==="
          DWC3_MAKEFILE="drivers/usb/dwc3/Makefile"
          if [ -f "$DWC3_MAKEFILE" ]; then
            if ! grep -q "Wno-unused-label" "$DWC3_MAKEFILE"; then
              echo "ccflags-y += -Wno-unused-label" >> "$DWC3_MAKEFILE"
              echo "✅ 已为 dwc3 Makefile 追加警告禁用选项"
            else
              echo "ℹ️ dwc3 Makefile 已包含该选项，跳过"
            fi
          else
            echo "ℹ️ 未找到 dwc3 Makefile，跳过"
          fi

          echo "=== 为 qcacld-3.0 子目录追加 -Wno-array-parameter ==="
          QCACLD_MAKEFILE="drivers/staging/qcacld-3.0/Makefile"
          if [ -f "$QCACLD_MAKEFILE" ]; then
            if ! grep -q "Wno-array-parameter" "$QCACLD_MAKEFILE"; then
              echo "ccflags-y += -Wno-array-parameter" >> "$QCACLD_MAKEFILE"
              echo "✅ 已为 qcacld-3.0 Makefile 追加警告禁用选项"
            else
              echo "ℹ️ qcacld-3.0 Makefile 已包含该选项，跳过"
            fi
          else
            echo "ℹ️ 未找到 qcacld-3.0 Makefile，跳过"
          fi

          echo "=== 为 qca-wifi-host-cmn 子目录追加 -Wno-unused-function 和 -Wno-implicit-enum-enum-cast ==="
          QCA_WIFI_MAKEFILE="drivers/staging/qca-wifi-host-cmn/Makefile"
          if [ -f "$QCA_WIFI_MAKEFILE" ]; then
            if ! grep -q "Wno-unused-function" "$QCA_WIFI_MAKEFILE"; then
              echo "ccflags-y += -Wno-unused-function" >> "$QCA_WIFI_MAKEFILE"
              echo "✅ 已为 qca-wifi-host-cmn Makefile 追加 -Wno-unused-function"
            else
              echo "ℹ️ qca-wifi-host-cmn Makefile 已包含 -Wno-unused-function，跳过"
            fi
            if ! grep -q "Wno-implicit-enum-enum-cast" "$QCA_WIFI_MAKEFILE"; then
              echo "ccflags-y += -Wno-implicit-enum-enum-cast" >> "$QCA_WIFI_MAKEFILE"
              echo "✅ 已为 qca-wifi-host-cmn Makefile 追加 -Wno-implicit-enum-enum-cast"
            else
              echo "ℹ️ qca-wifi-host-cmn Makefile 已包含 -Wno-implicit-enum-enum-cast，跳过"
            fi
          else
            echo "ℹ️ 未找到 qca-wifi-host-cmn Makefile，跳过"
          fi

          echo "正在彻底清理残留文件..."
          rm -rf ${{ env.OUTPUT_DIR }}
          rm -f .config
          rm -rf include/config include/generated
          make mrproper

          echo "正在生成 out/.config ..."
          make -j$(nproc) O=${{ env.OUTPUT_DIR }} ${{ env.DEFCONFIG_NAME }}
          
          if [ ! -f "${{ env.OUTPUT_DIR }}/.config" ]; then
            echo "::error::make defconfig 失败，out/.config 不存在！"
            exit 1
          fi
          echo "✅ out/.config 生成成功"

          echo "=== 启用 ReSukiSU 相关配置，并放宽栈帧警告限制至 131072 ==="
          scripts/config --file ${{ env.OUTPUT_DIR }}/.config \
            --enable KSU \
            --enable KSU_MANUAL_HOOK \
            --disable KSU_TRACEPOINT_HOOK \
            --enable KSU_SUSFS \
            --enable KSU_SUSFS_SUS_PATH \
            --enable KSU_SUSFS_SUS_MOUNT \
            --enable KSU_SUSFS_SUS_KSTAT \
            --enable KSU_SUSFS_SPOOF_UNAME \
            --enable KSU_SUSFS_OPEN_REDIRECT \
            --enable KSU_SUSFS_SUS_MAP \
            --enable KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS \
            --disable KSU_SUSFS_ENABLE_LOG \
            --enable KSU_SUSFS_SUS_SU \
            --enable KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG \
            --disable HEADERS_INSTALL \
            --set-val FRAME_WARN 131072 \
            --set-str LOCALVERSION "-ikun-NekoMake-star-260927-qgqi"

          echo "=== 检查 KSU 配置是否生效 ==="
          if grep -q "CONFIG_KSU=y" ${{ env.OUTPUT_DIR }}/.config; then
            echo "✅ CONFIG_KSU 已启用"
          else
            echo "::error::CONFIG_KSU 未启用！"
            exit 1
          fi

          if grep -q "CONFIG_KSU_MANUAL_HOOK=y" ${{ env.OUTPUT_DIR }}/.config; then
            echo "✅ CONFIG_KSU_MANUAL_HOOK 已启用"
          fi

          if grep -q 'CONFIG_LOCALVERSION="-ikun-NekoMake-star-260927-qgqi"' ${{ env.OUTPUT_DIR }}/.config; then
            echo "✅ LOCALVERSION 已匹配原内核"
          fi

          if grep -q "CONFIG_FRAME_WARN=131072" ${{ env.OUTPUT_DIR }}/.config; then
            echo "✅ FRAME_WARN 已放宽至 131072"
          fi

      - name: Build Kernel
        working-directory: kernel
        run: |
          set +e
          export ARCH=${{ env.KERNEL_ARCH }}
          export PATH="${{ env.CLANG_DIR }}/bin:$PATH"
          export CCACHE_EXEC=$(which ccache)
          export CCACHE_DIR="${{ env.CCACHE_DIR }}"
          ccache -M 6G
          export LLVM=1 LLVM_IAS=1 CLANG_TRIPLE=aarch64-linux-gnu- \
                 CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi-

          echo "=== 开始编译内核（完整日志输出，不截断） ==="
          echo "=== 已禁用警告: default-const-init-var-unsafe, default-const-init-field-unsafe, unused-but-set-global, unused-variable, declaration-after-statement, unused-result, misleading-indentation, uninitialized, compare-distinct-pointer-types, sometimes-uninitialized, unused-function, fortify-source, macro-redefined, unused-label, array-parameter, implicit-enum-enum-cast ==="
          echo "=== 栈帧警告限制已放宽为 131072 ==="
          echo "=== 并行度已调整为 -j8，以减少 Broken pipe 提示 ==="
          set -o pipefail
          make -j8 O=${{ env.OUTPUT_DIR }} \
               KCFLAGS="-Wno-error -Wno-default-const-init-var-unsafe -Wno-default-const-init-field-unsafe -Wno-unused-but-set-global -Wno-unused-variable -Wno-declaration-after-statement -Wno-unused-result -Wno-misleading-indentation -Wno-uninitialized -Wno-compare-distinct-pointer-types -Wno-sometimes-uninitialized -Wno-unused-function -Wno-fortify-source -Wno-macro-redefined -Wno-unused-label -Wno-array-parameter -Wno-implicit-enum-enum-cast -Wframe-larger-than=131072" \
               HOSTCFLAGS="-Wno-unused-but-set-global -Wno-unused-variable" \
               2>&1 | tee build.log
          BUILD_STATUS=$?

          echo "===== 完整 build.log 已保存至 kernel/build.log，并已在上面完整输出 ====="

          if [ $BUILD_STATUS -ne 0 ]; then
            echo "::error::编译失败，退出码 $BUILD_STATUS"
            exit 1
          fi

          if [ ! -f "${{ env.OUTPUT_DIR }}/arch/arm64/boot/Image" ]; then
            echo "::error::编译失败，未生成 Image"
            exit 1
          fi

          echo "✅ 编译成功，Image 已生成"

      # ============================================================
      # 4. 打包 AnyKernel3
      # ============================================================
      - name: Package AnyKernel3
        id: package
        run: |
          set -e
          TIME=$(date +"%Y.%m.%d")
          AK3_DIR="AnyKernel3"
          IMG_PATH="${{ env.KERNEL_DIR }}/${{ env.OUTPUT_DIR }}/arch/arm64/boot/Image"
          
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git $AK3_DIR
          
          gzip -9 -c "$IMG_PATH" > "$AK3_DIR/Image.gz"
          ls -lh "$AK3_DIR/Image.gz"
          
          cat > "$AK3_DIR/anykernel.sh" << 'AK3EOF'
          #!/sbin/sh

          ### AnyKernel3 Flashable Kernel Script
          ## Adapted for Xiaomi Mi 11 Ultra (star) with ReSukiSU

          properties() { '
          kernel.string=5.4.302-ikun-NekoMake-star-260927-qgqi+ ReSukiSU for Xiaomi 11 Ultra
          do.devicecheck=1
          do.modules=0
          do.systemless=0
          do.cleanup=1
          do.cleanuponabort=0
          device.name1=star
          device.name2=mars
          device.name3=
          device.name4=
          device.name5=
          supported.versions=
          supported.patchlevels=
          supported.vendorpatchlevels=
          '; } # end properties

          # boot shell variables
          BLOCK=boot;
          IS_SLOT_DEVICE=1;
          RAMDISK_COMPRESSION=auto;
          PATCH_VBMETA_FLAG=auto;

          # import functions/variables and setup patching - do not remove
          . tools/ak3-core.sh;

          # pure kernel swap: keep the existing ramdisk and repack with the new Image.gz
          split_boot;
          flash_boot;
          AK3EOF
          
          chmod +x "$AK3_DIR/anykernel.sh"
          echo "=== 生成的 anykernel.sh ==="
          cat "$AK3_DIR/anykernel.sh"
          
          cd $AK3_DIR
          zip -r9 "../${{ env.DEVICE_CODENAME }}-ReSukiSU-${TIME}.zip" ./*
          cd ..
          echo "zip_name=${{ env.DEVICE_CODENAME }}-ReSukiSU-${TIME}.zip" >> $GITHUB_OUTPUT

      # ============================================================
      # 5. 上传
      # ============================================================
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: kernel_resukisu
          path: ${{ env.DEVICE_CODENAME }}-ReSukiSU-*.zip

      - name: Upload build.log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build_log
          path: kernel/build.log
          if-no-files-found: ignore

      - name: Optional Release
        if: github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: resukisu_${{ github.run_number }}
          name: "ReSukiSU Kernel (LLVM 23.1.2, main branch)"
          body: |
            ## 测试内核 - ReSukiSU 集成版
            - 使用 ReSukiSU main 分支最新版本（克隆时自动获取最新提交）
            - 通过官方 setup.sh 脚本以 builtin 模式集成
            - 启用 KSU_MANUAL_HOOK + SUSFS 全套功能
            - LOCALVERSION 与原内核保持一致
            - 栈帧警告限制已放宽至 131072，避免 LZ4 相关链接警告
            - 刷机有风险，请备份原内核
          files: ${{ env.DEVICE_CODENAME }}-ReSukiSU-*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
