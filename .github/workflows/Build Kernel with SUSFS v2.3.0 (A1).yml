name: Build Kernel with SUSFS (A1)

on:
  workflow_dispatch:

env:
  TZ: Asia/Shanghai
  DEVICE_CODENAME: "star"
  KERNEL_ARCH: "arm64"
  KERNEL_REPO: "zttlove/android_kernel_xiaomi_sm8350_miyume"
  KERNEL_BRANCH: "main"
  DEFCONFIG_NAME: "star_defconfig"
  OUTPUT_DIR: "out"
  CLANG_DIR: "${{ github.workspace }}/clang"
  CCACHE_DIR: "${{ github.workspace }}/.ccache"
  KERNEL_DIR: "${{ github.workspace }}/kernel"


jobs:
  build:
    runs-on: ubuntu-22.04
    steps:

      - name: Checkout Kernel Source
        uses: actions/checkout@v4
        with:
          repository: ${{ env.KERNEL_REPO }}
          ref: ${{ env.KERNEL_BRANCH }}
          path: kernel
          fetch-depth: 1

      - name: Checkout Workflow Repo (Patches)
        uses: actions/checkout@v4
        with:
          path: workflow_repo
          fetch-depth: 1

      - name: Install Dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            bc bison flex libelf-dev libssl-dev libncurses-dev \
            make python3 device-tree-compiler git curl xz-utils \
            ccache zip unzip
          echo "正在修复 libtinfo.so.5 依赖..."
          if ! sudo apt install -y libtinfo5; then
            sudo ln -sf /lib/x86_64-linux-gnu/libtinfo.so.6 /lib/x86_64-linux-gnu/libtinfo.so.5
          fi
          if [ ! -f /lib/x86_64-linux-gnu/libtinfo.so.5 ]; then
            echo "::error::修复失败！libtinfo.so.5 仍然不存在。"
            exit 1
          else
            echo "✅ libtinfo.so.5 修复成功！"
          fi

      - name: Download Clang
        run: |
          mkdir -p ${{ env.CLANG_DIR }}
          curl -L --retry 3 -o clang.tar.xz "https://github.com/llvm/llvm-project/releases/download/llvmorg-18.1.8/clang+llvm-18.1.8-x86_64-linux-gnu-ubuntu-18.04.tar.xz"
          tar -xf clang.tar.xz -C ${{ env.CLANG_DIR }} --strip-components=1
          rm clang.tar.xz
          ${{ env.CLANG_DIR }}/bin/clang --version

      # ============================================================
      # 2. 安装 ReSukiSU（pin 到 b2ac2fc）
      # ============================================================
      - name: Setup ReSukiSU (main)
        working-directory: kernel
        run: |
          set -e
          rm -rf drivers/kernelsu
          git clone https://github.com/ReSukiSU/ReSukiSU.git drivers/kernelsu
          cd drivers/kernelsu
          git checkout b2ac2fc
          cd ../..
          echo "source \"drivers/kernelsu/kernel/Kconfig\"" > drivers/kernelsu/Kconfig
          echo "obj-\$(CONFIG_KSU) += kernel/" > drivers/kernelsu/Makefile
          sed -i '/source "drivers\/kernelsu\/Kconfig"/d' drivers/Kconfig || true
          sed -i '/obj-\$(CONFIG_KSU) += kernelsu\//d' drivers/Makefile || true
          echo "source \"drivers/kernelsu/Kconfig\"" >> drivers/Kconfig
          echo "obj-\$(CONFIG_KSU) += kernelsu/" >> drivers/Makefile

      # ============================================================
      # 3. 绕过 inline_hook_check.mk（强制跳过 hook 检查）
      # ============================================================
      - name: Bypass inline_hook_check.mk
        working-directory: kernel
        run: |
          echo "=== 原始 inline_hook_check.mk 前 50 行 ==="
          head -50 drivers/kernelsu/kernel/tools/inline_hook_check.mk || true
          echo ""
          echo "=== 替换为空操作 ==="
          cat > drivers/kernelsu/kernel/tools/inline_hook_check.mk << 'EOF'
          # Bypassed by workflow - 跳过 ReSukiSU 强制 inline hook 检查
          define check_ksu_hook
          endef
          define check_ksu_hook_incompatible
          endef
          define check_ksu_manual_guard
          endef
          EOF
          echo "=== 替换后 ==="
          cat drivers/kernelsu/kernel/tools/inline_hook_check.mk

      # ============================================================
      # 5. 配置内核
      # ============================================================
      - name: Configure Kernel
        working-directory: kernel
        run: |
          export ARCH=${{ env.KERNEL_ARCH }}
          export PATH="${{ env.CLANG_DIR }}/bin:$PATH"
          export CCACHE_EXEC=$(which ccache)
          export CCACHE_DIR="${{ env.CCACHE_DIR }}"
          ccache -M 6G
          export LLVM=1 LLVM_IAS=1 CLANG_TRIPLE=aarch64-linux-gnu- \
                 CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          make mrproper || true
          make -j$(nproc) O=${{ env.OUTPUT_DIR }} ${{ env.DEFCONFIG_NAME }}
          scripts/config --file ${{ env.OUTPUT_DIR }}/.config \
            --enable KSU \
            --enable INIT_ON_ALLOC_DEFAULT_ON \
            --disable KSU_HOOK_INLINE \
            --enable KSU_HOOK_TRACEPOINT \
            --disable KSU_HOOK_MANUAL \
            --enable KSU_SELINUX \
            --enable KSU_ZYGISK \
            --enable KPROBES \
            --enable HAVE_KPROBES \
            --enable KPROBE_EVENTS \
            --enable KALLSYMS \
            --enable KALLSYMS_ALL \
            --enable MODULES \
            --enable MODULE_UNLOAD \
            --enable OVERLAY_FS \
            --enable EXT4_FS \
            --enable NAMESPACES \
            --disable KSU_DEBUG \
            --enable KSU_SUSFS \
            --enable KSU_SUSFS_SUS_PATH \
            --enable KSU_SUSFS_SUS_MOUNT \
            --enable KSU_SUSFS_SUS_KSTAT \
            --enable KSU_SUSFS_SPOOF_UNAME \
            --enable KSU_SUSFS_OPEN_REDIRECT \
            --enable KSU_SUSFS_SUS_MAP \
            --enable KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS \
            --enable KSU_SUSFS_ENABLE_LOG \
            --enable KSU_SUSFS_SUS_SU \
            --set-val FRAME_WARN 3072
          make olddefconfig O=${{ env.OUTPUT_DIR }}
          echo ""
          echo "=== 最终 .config 里 KSU_HOOK 相关项 ==="
          grep "KSU_HOOK" ${{ env.OUTPUT_DIR }}/.config | sort || echo "（无）"
          echo ""
          echo "=== 最终 .config 里 KPROBES 相关项 ==="
          grep "KPROBES" ${{ env.OUTPUT_DIR }}/.config | sort || echo "（无）"
          echo ""
          echo "=== 最终 .config 里 SUSFS 相关项 ==="
          grep "KSU_SUSFS" ${{ env.OUTPUT_DIR }}/.config | sort || echo "（无）"
          grep -n "susfs_def.h" fs/stat.c
         

      # ============================================================
      # 6. 编译（输出 build.log 便于排查）
      # ============================================================
      - name: Build Kernel
        working-directory: kernel
        run: |
          set -e
          export ARCH=${{ env.KERNEL_ARCH }}
          export PATH="${{ env.CLANG_DIR }}/bin:$PATH"
          export CCACHE_EXEC=$(which ccache)
          export CCACHE_DIR="${{ env.CCACHE_DIR }}"
          ccache -M 6G
          export LLVM=1 LLVM_IAS=1 CLANG_TRIPLE=aarch64-linux-gnu- \
                 CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          make -j$(nproc) O=${{ env.OUTPUT_DIR }} \
            KCFLAGS="-Wno-strict-prototypes -Wno-align-mismatch -Wno-unused-function -Wno-compare-distinct-pointer-types -Wno-void-pointer-to-int-cast -Wno-array-parameter -Wno-declaration-after-statement" \
            2>&1 | tee build.log
          echo ""
          echo "=== namespace.o 是否编译成功 ==="
          grep -E "CC\s+fs/namespace\.o" build.log && echo "✅" || echo "❌ 未编译！"
          echo ""
          echo "=== namespace.c 的 error ==="
          grep -iE "namespace\.c.*error" build.log | head -20 || echo "（无）"
          echo ""
          echo "=== 最终 undefined symbol ==="
          grep -iE "undefined symbol" build.log | head -30 || echo "（无）"
          if [ ! -f "${{ env.OUTPUT_DIR }}/arch/arm64/boot/Image" ]; then
            echo "ERROR: Kernel Image not found!"
            exit 1
          fi

      # ============================================================
      # 7. 打包 AnyKernel3
      # ============================================================
      - name: Package AnyKernel3
        id: package
        run: |
          TIME=$(date +"%Y.%m.%d")
          AK3_DIR="AnyKernel3"
          IMG_PATH="${{ env.KERNEL_DIR }}/${{ env.OUTPUT_DIR }}/arch/arm64/boot/Image"
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git $AK3_DIR
          cp -f "$IMG_PATH" "$AK3_DIR/Image"
          sed -i 's/^do.devicecheck=1/do.devicecheck=0/' "$AK3_DIR/anykernel.sh"
          sed -i 's/^BLOCK=.*/BLOCK=boot/' "$AK3_DIR/anykernel.sh"
          sed -i 's/^IS_SLOT_DEVICE=0/IS_SLOT_DEVICE=1/' "$AK3_DIR/anykernel.sh"
          sed -i 's/^device.name1=.*/device.name1=star/' "$AK3_DIR/anykernel.sh"
          cd $AK3_DIR
          zip -r9 "../${{ env.DEVICE_CODENAME }}-SUSFS-reponative-sp-${TIME}.zip" ./*
          cd ..
          echo "zip_name=${{ env.DEVICE_CODENAME }}-SUSFS-reponative-sp-${TIME}.zip" >> $GITHUB_OUTPUT

      # ============================================================
      # 8. 上传
      # ============================================================
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: kernel_susfs_reponative_sp
          path: ${{ env.DEVICE_CODENAME }}-SUSFS-reponative-sp-*.zip

      - name: Upload build.log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build_log
          path: kernel/build.log
          if-no-files-found: ignore

      - name: Optional Release
        if: github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: susfs_reponative_sp_${{ github.run_number }}
          name: "SUSFS (Repo-native + KPROBES Hook)"
          body: |
            ## 测试内核 - 仓库自带 SUSFS
            - ReSukiSU b2ac2fc (v35089)
            - 仓库自带 SUSFS
            - KPROBES/Tracepoint Hook
            - inline_hook_check.mk 已绕过
            - 刷机有风险，请备份原内核
          files: ${{ env.DEVICE_CODENAME }}-SUSFS-reponative-sp-*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
