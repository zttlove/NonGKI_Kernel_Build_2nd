name: Build Kernel with ReSukiSU

on:
  workflow_dispatch:

env:
  TZ: Asia/Shanghai
  DEVICE_CODENAME: "star"
  KERNEL_ARCH: "arm64"
  KERNEL_REPO: "zttlove/android_kernel_xiaomi_sm8350_miyume.git"
  KERNEL_BRANCH: "main"
  DEFCONFIG_NAME: "star_defconfig"
  OUTPUT_DIR: "out"
  CLANG_DIR: "${{ github.workspace }}/clang"
  CCACHE_DIR: "${{ github.workspace }}/.ccache"
  KERNEL_DIR: "${{ github.workspace }}/kernel"

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:

      - name: Checkout Kernel Source
        uses: actions/checkout@v4
        with:
          repository: ${{ env.KERNEL_REPO }}
          ref: ${{ env.KERNEL_BRANCH }}
          path: kernel
          fetch-depth: 1

      - name: Checkout Workflow Repo (Patches)
        uses: actions/checkout@v4
        with:
          path: workflow_repo
          fetch-depth: 1

      - name: Install Dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            bc bison flex libelf-dev libssl-dev libncurses-dev \
            make python3 device-tree-compiler git curl xz-utils \
            ccache zip unzip \
            dwarves
          echo "正在修复 libtinfo.so.5 依赖..."
          if ! sudo apt install -y libtinfo5; then
            sudo ln -sf /lib/x86_64-linux-gnu/libtinfo.so.6 /lib/x86_64-linux-gnu/libtinfo.so.5
          fi
          if [ ! -f /lib/x86_64-linux-gnu/libtinfo.so.5 ]; then
            echo "::error::修复失败！libtinfo.so.5 仍然不存在。"
            exit 1
          else
            echo "✅ libtinfo.so.5 修复成功！"
          fi
          echo "=== pahole 版本 ==="
          pahole --version

      - name: Download Clang (From LLVM GitHub)
        run: |
          mkdir -p ${{ env.CLANG_DIR }}
          curl -L --retry 3 -o clang.tar.xz "https://github.com/llvm/llvm-project/releases/download/llvmorg-14.0.6/clang+llvm-14.0.6-x86_64-linux-gnu-rhel-8.4.tar.xz"
          tar -xf clang.tar.xz -C ${{ env.CLANG_DIR }} --strip-components=1
          rm clang.tar.xz
          ${{ env.CLANG_DIR }}/bin/clang --version

      # ============================================================
      # 2. 安装 ReSukiSU (仅保留 KSU，不集成 SUSFS)
      # ============================================================
      - name: Setup ReSukiSU (main)
        working-directory: kernel
        run: |
          set -e
          rm -rf drivers/kernelsu
          git clone https://github.com/ReSukiSU/ReSukiSU.git drivers/kernelsu
          cd drivers/kernelsu
          git checkout main
          cd ../..
          echo "source \"drivers/kernelsu/kernel/Kconfig\"" > drivers/kernelsu/Kconfig
          echo "obj-\$(CONFIG_KSU) += kernel/" > drivers/kernelsu/Makefile
          sed -i '/source "drivers\/kernelsu\/Kconfig"/d' drivers/Kconfig || true
          sed -i '/obj-\$(CONFIG_KSU) += kernelsu\//d' drivers/Makefile || true
          echo "source \"drivers/kernelsu/Kconfig\"" >> drivers/Kconfig
          echo "obj-\$(CONFIG_KSU) += kernelsu/" >> drivers/Makefile

      - name: Patch ReSukiSU Kconfig (move KSU_SUSFS out of choice)
        working-directory: kernel
        run: |
          set -e
          KCONFIG=drivers/kernelsu/kernel/Kconfig
          if ! grep -q "^config KSU_SUSFS$" "$KCONFIG"; then
            echo "::error::Kconfig 中没有找到 config KSU_SUSFS"
            exit 1
          fi
          cp "$KCONFIG" "$KCONFIG.orig"
          awk '
            BEGIN { in_susfs=0; skipped=0 }
            /^config KSU_SUSFS$/ && !in_susfs {
              print "endchoice"
              print ""
              in_susfs=1
              print
              next
            }
            in_susfs && /^[[:space:]]+depends on .*THREAD_INFO_IN_TASK/ {
              print "\tdepends on KSU && THREAD_INFO_IN_TASK && 64BIT"
              next
            }
            in_susfs && /^endchoice$/ && !skipped {
              skipped=1
              in_susfs=0
              next
            }
            { print }
          ' "$KCONFIG.orig" > "$KCONFIG"
          echo "=== 修改后的 choice / config 结构 ==="
          grep -nE "^(choice|endchoice|config KSU_(TRACEPOINT|MANUAL|SUSFS))" "$KCONFIG"

      # ============================================================
      # 3. 配置内核（彻底清理、生成配置、修补 Makefile、启用 BTF）
      # ============================================================
      - name: Configure Kernel
        working-directory: kernel
        run: |
          set -e
          export ARCH=${{ env.KERNEL_ARCH }}
          export PATH="${{ env.CLANG_DIR }}/bin:$PATH"
          export CCACHE_EXEC=$(which ccache)
          export CCACHE_DIR="${{ env.CCACHE_DIR }}"
          ccache -M 6G
          export LLVM=1 LLVM_IAS=1 CLANG_TRIPLE=aarch64-linux-gnu- \
                 CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi-

          # 1. 彻底清理
          echo "正在彻底清理残留文件..."
          rm -rf ${{ env.OUTPUT_DIR }}
          rm -f .config
          rm -rf include/config include/generated
          make mrproper

          # 2. 生成 .config
          echo "正在生成 out/.config ..."
          make -j$(nproc) O=${{ env.OUTPUT_DIR }} ${{ env.DEFCONFIG_NAME }}
          
          if [ ! -f "${{ env.OUTPUT_DIR }}/.config" ]; then
            echo "::error::make defconfig 失败，out/.config 不存在！"
            exit 1
          fi
          echo "✅ out/.config 生成成功"

          # ============================================================
          # 修补 pahole-flags.sh，兼容 5.4 内核的 BTF 生成
          # ============================================================
          echo "=== 修补 pahole-flags.sh ==="
          PAHOLE_FLAGS_SCRIPT="scripts/pahole-flags.sh"
          if [ -f "$PAHOLE_FLAGS_SCRIPT" ]; then
            if ! grep -q "skip_encoding_btf_enum64" "$PAHOLE_FLAGS_SCRIPT"; then
              echo "Patching pahole-flags.sh..."
              sed -i 's/^echo \${extra_paholeopt}$/if [ "\${pahole_ver}" -ge "124" ]; then\n    extra_paholeopt="\${extra_paholeopt} --skip_encoding_btf_enum64"\nfi\necho \${extra_paholeopt}/' "$PAHOLE_FLAGS_SCRIPT"
              echo "✅ 已修补 pahole-flags.sh"
            else
              echo "✅ pahole-flags.sh 已包含 skip_encoding_btf_enum64"
            fi
          else
            echo "⚠️ 未找到 pahole-flags.sh，跳过修补"
          fi

          # 3. 修改配置（启用 BTF、KSU Manual Hook，禁用 SUSFS 和 Tracepoint）
          scripts/config --file ${{ env.OUTPUT_DIR }}/.config \
            --enable KSU \
            --enable KSU_MANUAL_HOOK \
            --disable KSU_TRACEPOINT_HOOK \
            --disable KSU_SUSFS \
            --disable KSU_SUSFS_SUS_PATH \
            --disable KSU_SUSFS_SUS_MOUNT \
            --disable KSU_SUSFS_SUS_KSTAT \
            --disable KSU_SUSFS_SPOOF_UNAME \
            --disable KSU_SUSFS_OPEN_REDIRECT \
            --disable KSU_SUSFS_SUS_MAP \
            --disable KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS \
            --disable KSU_SUSFS_ENABLE_LOG \
            --disable KSU_SUSFS_SUS_SU \
            --enable KSU_ZYGISK \
            --enable KSU_SELINUX \
            --enable KPROBES \
            --enable HAVE_KPROBES \
            --enable KPROBE_EVENTS \
            --enable KALLSYMS \
            --enable KALLSYMS_ALL \
            --enable MODULES \
            --enable MODULE_UNLOAD \
            --enable OVERLAY_FS \
            --enable EXT4_FS \
            --enable NAMESPACES \
            --enable DEBUG_INFO_BTF \
            --enable DEBUG_INFO \
            --disable DEBUG_INFO_DWARF5 \
            --set-str LOCALVERSION ""
          
          # 4. 再次运行 olddefconfig，检查配置是否被回滚
          make olddefconfig O=${{ env.OUTPUT_DIR }}
          
          # 5. 校验关键配置
          echo "=== 检查关键配置是否生效 ==="
          if grep -q "CONFIG_KSU_MANUAL_HOOK=y" ${{ env.OUTPUT_DIR }}/.config; then
            echo "✅ CONFIG_KSU_MANUAL_HOOK=y 生效"
          else
            echo "::error::CONFIG_KSU_MANUAL_HOOK 未启用！"
            exit 1
          fi
          
          if grep -q "CONFIG_KSU_SUSFS=y" ${{ env.OUTPUT_DIR }}/.config; then
            echo "::error::CONFIG_KSU_SUSFS 居然被启用了！"
            exit 1
          else
            echo "✅ CONFIG_KSU_SUSFS 已禁用"
          fi

          if grep -q "CONFIG_DEBUG_INFO_BTF=y" ${{ env.OUTPUT_DIR }}/.config; then
            echo "✅ CONFIG_DEBUG_INFO_BTF=y 生效"
          else
            echo "::error::CONFIG_DEBUG_INFO_BTF 未启用！"
            exit 1
          fi
          
          # 6. 强制补全 drivers/Makefile，确保 kernelsu 被编译
          echo "=== 补全 drivers/Makefile ==="
          sed -i '/kernelsu/d' drivers/Makefile
          echo "obj-\$(CONFIG_KSU) += kernelsu/" >> drivers/Makefile
          echo "✅ 已追加 kernelsu/ 到 drivers/Makefile"
          
          # 7. 移除 Kbuild 中对 GKI 1.0 的强制检查
          echo "=== 处理 Kbuild 强制报错 ==="
          if [ -f "drivers/kernelsu/kernel/Kbuild" ]; then
            sed -i '/TP hooks are incompatible with Non-GKI/d' drivers/kernelsu/kernel/Kbuild
            echo "✅ 已移除 Kbuild 中的强制报错行"
          fi

      # ============================================================
      # 4. 编译（输出 build.log 便于排查）
      # ============================================================
      - name: Build Kernel
        working-directory: kernel
        run: |
          set -e
          export ARCH=${{ env.KERNEL_ARCH }}
          export PATH="${{ env.CLANG_DIR }}/bin:$PATH"
          export CCACHE_EXEC=$(which ccache)
          export CCACHE_DIR="${{ env.CCACHE_DIR }}"
          ccache -M 6G
          export LLVM=1 LLVM_IAS=1 CLANG_TRIPLE=aarch64-linux-gnu- \
                 CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          
          make -j$(nproc) O=${{ env.OUTPUT_DIR }} \
               KCFLAGS="-Wno-error -Wno-strict-prototypes -Wno-align-mismatch -Wno-unused-function -Wno-compare-distinct-pointer-types -Wno-void-pointer-to-int-cast -Wno-declaration-after-statement" \
               2>&1 | tee build.log

      # ============================================================
      # 5. 打包 AnyKernel3
      # ============================================================
      - name: Package AnyKernel3
        id: package
        run: |
          TIME=$(date +"%Y.%m.%d")
          AK3_DIR="AnyKernel3"
          IMG_PATH="${{ env.KERNEL_DIR }}/${{ env.OUTPUT_DIR }}/arch/arm64/boot/Image"
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git $AK3_DIR
          cp -f "$IMG_PATH" "$AK3_DIR/Image"
          sed -i 's/^do.devicecheck=1/do.devicecheck=0/' "$AK3_DIR/anykernel.sh"
          sed -i 's/^BLOCK=.*/BLOCK=boot/' "$AK3_DIR/anykernel.sh"
          sed -i 's/^IS_SLOT_DEVICE=0/IS_SLOT_DEVICE=1/' "$AK3_DIR/anykernel.sh"
          sed -i 's/^device.name1=.*/device.name1=star/' "$AK3_DIR/anykernel.sh"
          cd $AK3_DIR
          zip -r9 "../${{ env.DEVICE_CODENAME }}-ReSukiSU-${TIME}.zip" ./*
          cd ..
          echo "zip_name=${{ env.DEVICE_CODENAME }}-ReSukiSU-${TIME}.zip" >> $GITHUB_OUTPUT

      # ============================================================
      # 6. 上传
      # ============================================================
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: kernel_resukisu
          path: ${{ env.DEVICE_CODENAME }}-ReSukiSU-*.zip

      - name: Upload build.log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build_log
          path: kernel/build.log
          if-no-files-found: ignore

      - name: Optional Release
        if: github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: resukisu_${{ github.run_number }}
          name: "ReSukiSU Kernel (No SUSFS + BTF)"
          body: |
            ## 测试内核 - 仅 ReSukiSU
            - ReSukiSU main (最新)
            - 手动钩子 (Manual Hook)
            - 无 SUSFS
            - 已启用 BTF（解决 BPF 卡锁屏问题）
            - 刷机有风险，请备份原内核
          files: ${{ env.DEVICE_CODENAME }}-ReSukiSU-*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
