name: Build Kernel with SUSFS v2.3.0 (A1)

on:
  workflow_dispatch:

env:
  TZ: Asia/Shanghai
  DEVICE_CODENAME: "star"
  KERNEL_ARCH: "arm64"
  KERNEL_REPO: "zttlove/android_kernel_xiaomi_sm8350_miyume"
  KERNEL_BRANCH: "main"
  DEFCONFIG_NAME: "star_defconfig"
  OUTPUT_DIR: "out"
  CLANG_DIR: "${{ github.workspace }}/clang"
  CCACHE_DIR: "${{ github.workspace }}/.ccache"
  KERNEL_DIR: "${{ github.workspace }}/kernel"
  SUSFS_PATCH_FILE: "susfs_patch_to_5.4.patch"

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:

      - name: Checkout Kernel Source
        uses: actions/checkout@v4
        with:
          repository: ${{ env.KERNEL_REPO }}
          ref: ${{ env.KERNEL_BRANCH }}
          path: kernel
          fetch-depth: 1

      - name: Checkout Workflow Repo (Patches)
        uses: actions/checkout@v4
        with:
          path: workflow_repo
          fetch-depth: 1

      - name: Install Dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            bc bison flex libelf-dev libssl-dev libncurses-dev \
            make python3 device-tree-compiler git curl xz-utils \
            ccache zip unzip

          echo "正在修复 libtinfo.so.5 依赖..."
          if ! sudo apt install -y libtinfo5; then
            echo "直接安装 libtinfo5 失败，尝试创建软链接..."
            sudo ln -sf /lib/x86_64-linux-gnu/libtinfo.so.6 /lib/x86_64-linux-gnu/libtinfo.so.5
          fi

          if [ ! -f /lib/x86_64-linux-gnu/libtinfo.so.5 ]; then
            echo "::error::修复失败！libtinfo.so.5 仍然不存在。"
            exit 1
          else
            echo "✅ libtinfo.so.5 修复成功！"
          fi

      - name: Download Clang
        run: |
          mkdir -p ${{ env.CLANG_DIR }}
          curl -L --retry 3 -o clang.tar.xz "https://github.com/llvm/llvm-project/releases/download/llvmorg-18.1.8/clang+llvm-18.1.8-x86_64-linux-gnu-ubuntu-18.04.tar.xz"
          tar -xf clang.tar.xz -C ${{ env.CLANG_DIR }} --strip-components=1
          rm clang.tar.xz
          ${{ env.CLANG_DIR }}/bin/clang --version

      - name: Setup ReSukiSU (v35089)
        working-directory: kernel
        run: |
          set -e
          echo "Cloning ReSukiSU v35089.."
          rm -rf drivers/kernelsu
          git clone https://github.com/ReSukiSU/ReSukiSU.git drivers/kernelsu
          cd drivers/kernelsu
          git log --oneline -1
          cd ../..

          # 创建包装文件
          echo "source \"drivers/kernelsu/kernel/Kconfig\"" > drivers/kernelsu/Kconfig
          echo "obj-y += kernel/" > drivers/kernelsu/Makefile
          sed -i '/source "drivers\/kernelsu\/Kconfig"/d' drivers/Kconfig || true
          sed -i '/obj-\$(CONFIG_KSU) += kernelsu\//d' drivers/Makefile || true
          echo "source \"drivers/kernelsu/Kconfig\"" >> drivers/Kconfig
          echo "obj-\$(CONFIG_KSU) += kernelsu/" >> drivers/Makefile

      - name: Apply SUSFS v2.3.0 Patch
        working-directory: kernel
        run: |
          PATCH="${{ github.workspace }}/workflow_repo/Patches/Patch/${{ env.SUSFS_PATCH_FILE }}"
          patch -p1 -N --batch --no-backup-if-mismatch < "$PATCH" || true

      - name: Fix task_mmu.c return errors for SUS_MAP/SUS_KSTAT
        working-directory: kernel
        run: |
          cat > fix_task_mmu.py << 'EOF'
          import re

          non_void_funcs = [
              'proc_maps_open', 'show_map', 'smaps_pte_hole', 'smaps_pte_range',
              'show_smap', 'smaps_rollup_open', 'clear_refs_pte_range',
              'clear_refs_test_walk', 'add_to_pagemap', 'pagemap_open',
              'pagemap_release', 'reclaim_pte_range'
          ]
          void_funcs = [
              'seq_print_vma_name', 'smaps_account', 'smaps_pte_entry', 'smap_gather_stats'
          ]

          with open('fs/proc/task_mmu.c', 'r') as f:
              lines = f.readlines()

          def find_body(lines, func):
              pattern = re.compile(r'\b' + func + r'\s*\(')
              start = None
              for i, line in enumerate(lines):
                  if pattern.search(line) and not line.strip().startswith('//'):
                      if '{' in line or (i+1 < len(lines) and '{' in lines[i+1]):
                          start = i
                          break
              if start is None:
                  return None, None
              brace = 0
              body_start = None
              for i in range(start, len(lines)):
                  for ch in lines[i]:
                      if ch == '{':
                          brace += 1
                          if body_start is None:
                              body_start = i
                      elif ch == '}':
                          brace -= 1
                          if brace == 0 and body_start is not None:
                              return body_start, i
              return None, None

          for func in non_void_funcs:
              s, e = find_body(lines, func)
              if s is not None:
                  for i in range(s, e+1):
                      if re.match(r'^\s*return;\s*$', lines[i]):
                          lines[i] = re.sub(r'return;', 'return 0;', lines[i])

          for func in void_funcs:
              s, e = find_body(lines, func)
              if s is not None:
                  for i in range(s, e+1):
                      if re.match(r'^\s*return 0;\s*$', lines[i]):
                          lines[i] = re.sub(r'return 0;', 'return;', lines[i])

          with open('fs/proc/task_mmu.c', 'w') as f:
              f.writelines(lines)
          print("✅ task_mmu.c 修复完成")
          EOF
          python3 fix_task_mmu.py

      - name: Enable KSU_SUSFS_SUS_MOUNT (fix missing symbols)
        working-directory: kernel
        run: |
          set -e
          echo "=== 修补源码以启用 SUS_MOUNT ==="

          # 1. 添加精确 extern 声明到 fs/proc_namespace.c
          if ! grep -q "extern struct static_key_false susfs_is_hide_sus_mnts_for_non_su_procs_enabled" fs/proc_namespace.c; then
            echo "添加精确 extern 声明到 fs/proc_namespace.c..."
            sed -i '/^extern bool susfs_hide_sus_mnts_for_non_su_procs;$/d' fs/proc_namespace.c
            sed -i '/^#include "internal.h"/a\
            #ifdef CONFIG_KSU_SUSFS_SUS_MOUNT\
            extern struct static_key_false susfs_is_hide_sus_mnts_for_non_su_procs_enabled;\
            extern bool susfs_is_current_ksu_domain(void);\
            #endif' fs/proc_namespace.c
          else
            echo "✅ fs/proc_namespace.c 已包含精确声明"
          fi
          sed -i '/^extern bool susfs_hide_sus_mnts_for_non_su_procs;$/d' fs/proc_namespace.c

          # 2. 清理 fs/susfs.c 重复定义并重新插入一次
          echo "清理 fs/susfs.c 中的重复定义..."
          sed -i '/DEFINE_STATIC_KEY_FALSE(susfs_is_hide_sus_mnts_for_non_su_procs_enabled);/d' fs/susfs.c

          LINE=$(grep -n '^DEFINE_STATIC_KEY_FALSE(' fs/susfs.c | head -1 | cut -d: -f1)
          if [ -n "$LINE" ]; then
            sed -i "${LINE}a DEFINE_STATIC_KEY_FALSE(susfs_is_hide_sus_mnts_for_non_su_procs_enabled);" fs/susfs.c
          else
            sed -i '1i DEFINE_STATIC_KEY_FALSE(susfs_is_hide_sus_mnts_for_non_su_procs_enabled);' fs/susfs.c
          fi

          COUNT=$(grep -c "DEFINE_STATIC_KEY_FALSE(susfs_is_hide_sus_mnts_for_non_su_procs_enabled)" fs/susfs.c)
          if [ "$COUNT" -ne 1 ]; then
            echo "❌ 定义数量不为 1，实际为 $COUNT"
            exit 1
          fi
          echo "✅ susfs_is_hide_sus_mnts_for_non_su_procs_enabled 已唯一定义"

          if ! grep -q "extern struct static_key_false susfs_is_hide_sus_mnts_for_non_su_procs_enabled" fs/proc_namespace.c; then
            echo "❌ fs/proc_namespace.c 中未找到正确的 extern 声明"
            exit 1
          fi
          echo "✅ fs/proc_namespace.c 中声明正确"

      - name: Fix legacy variable name in proc_namespace.c
        working-directory: kernel
        run: |
          sed -i 's/READ_ONCE(susfs_hide_sus_mnts_for_non_su_procs)/static_branch_unlikely(\&susfs_is_hide_sus_mnts_for_non_su_procs_enabled)/g' fs/proc_namespace.c
          echo "✅ 已替换旧变量用法"
          grep -n "susfs_hide_sus_mnts_for_non_su_procs\|susfs_is_hide_sus_mnts_for_non_su_procs_enabled" fs/proc_namespace.c
     
         
      - name: Create dummy seccomp_types.h to suppress grep warning
        working-directory: kernel
        run: |
          mkdir -p include/linux
          touch include/linux/seccomp_types.h
          echo "✅ 已创建占位文件，消除 grep 警告"
          
      - name: Apply ReSukiSU SUSFS Inline Hooks to kernel
        working-directory: kernel
        run: |
          set +e   # 脚本内部有大量可选分支，容忍局部失败
          echo "=== 开始注入 ReSukiSU SUSFS Inline Hooks ==="

          patch_files=(
            fs/exec.c
            fs/open.c
            fs/read_write.c
            fs/stat.c
            fs/namei.c
            drivers/input/input.c
            security/security.c
            security/selinux/hooks.c
            security/selinux/ss/services.c
            kernel/reboot.c
            kernel/sys.c
          )

          PATCH_LEVEL="2.2.00"
          KERNEL_VERSION=$(head -n 3 Makefile | grep -E 'VERSION|PATCHLEVEL' | awk '{print $3}' | paste -sd '.')
          FIRST_VERSION=$(echo "$KERNEL_VERSION" | awk -F '.' '{print $1}')
          SECOND_VERSION=$(echo "$KERNEL_VERSION" | awk -F '.' '{print $2}')

          echo "Current susfs patch version:$PATCH_LEVEL"

          for i in "${patch_files[@]}"; do

            if grep -q "ksu_handle" "$i"; then
              echo "[-] Warning: $i contains KernelSU"
              echo "[+] Code in here:"
              grep -n "ksu_handle" "$i"
              echo "[-] End of file."
              echo "======================================"
              continue
            fi

            case $i in
            fs/exec.c)
              echo "======================================"

              if grep -q "vmalloc.h" "fs/exec.c"; then
                sed -i '/#include <linux\/vmalloc.h>/a\#ifdef CONFIG_KSU_SUSFS\n#include <linux/susfs_def.h>\n#endif' fs/exec.c
              else
                sed -i '/#include <linux\/user_namespace.h>/a\#ifdef CONFIG_KSU_SUSFS\n#include <linux/susfs_def.h>\n#endif' fs/exec.c
              fi

              if grep -q "__do_execve_file" "fs/exec.c"; then
                sed -i '/static int __do_execve_file(int fd, struct filename \*filename,/i #ifdef CONFIG_KSU_SUSFS\nextern struct static_key_true ksu_su_compat_enabled;\nextern struct static_key_true susfs_is_sdcard_android_data_not_decrypted;\nextern bool __ksu_is_allow_uid_for_current(uid_t uid);\nextern int ksu_handle_execveat(int *fd, struct filename **filename_ptr, void *argv,\n\t\t\tvoid *envp, int *flags);\nextern int ksu_handle_execveat_sucompat(int *fd, struct filename **filename_ptr, void *argv,\n\t\t\t\tvoid *envp, int *flags);\nextern int ksu_handle_post_execveat_sucompat(int *fd, struct filename **filename_ptr, void *argv,\n\t\t\tvoid *envp, int *flags, int *retval);\n#endif' fs/exec.c
              else
                sed -i '/^static int do_execveat_common(int fd, struct filename \*filename,/i\#ifdef CONFIG_KSU_SUSFS\nextern struct static_key_true ksu_su_compat_enabled;\nextern struct static_key_true susfs_is_sdcard_android_data_not_decrypted;\nextern bool __ksu_is_allow_uid_for_current(uid_t uid);\nextern int ksu_handle_execveat(int *fd, struct filename **filename_ptr, void *argv,\n\t\t\tvoid *envp, int *flags);\nextern int ksu_handle_execveat_sucompat(int *fd, struct filename **filename_ptr,\n\t\t\t\t void *argv, void *envp, int *flags);\nextern int ksu_handle_post_execveat_sucompat(int *fd, struct filename **filename_ptr, void *argv,\n\t\t\tvoid *envp, int *flags, int *retval);\n#endif\n' fs/exec.c
              fi
              sed -i '/if (IS_ERR(filename))/i\#ifdef CONFIG_KSU_SUSFS\n\tbool is_su_session = false;\n#endif \/\/ #ifdef CONFIG_KSU_SUSFS\n' fs/exec.c
              sed -i '/return PTR_ERR(filename);/a\#ifdef CONFIG_KSU_SUSFS\n\tif (likely(susfs_is_current_proc_no_su()))\n\t\tgoto orig_flow;\n\tif (static_branch_likely(&ksu_su_compat_enabled)) {\n\t\tif (static_branch_unlikely(\&susfs_is_sdcard_android_data_not_decrypted))\n\t\tis_su_session = !ksu_handle_execveat(\&fd, \&filename, \&argv, \&envp, \&flags);\n\telse\n\t\tis_su_session = !ksu_handle_execveat_sucompat(\&fd, \&filename, \&argv, \&envp, \&flags);\n\t}\norig_flow:\n#endif' fs/exec.c
              sed -i '0,/out_free:/b; /out_free:/i\#ifdef CONFIG_KSU_SUSFS\n\tif (unlikely(is_su_session))\n\t\t(void)ksu_handle_post_execveat_sucompat(&fd, &filename, &argv, &envp, &flags, &retval);\n#endif \/\/ #ifdef CONFIG_KSU_SUSFS\n' fs/exec.c

              if grep -q "ksu_handle_execveat_sucompat" "fs/exec.c"; then
                echo "[+] fs/exec.c Patched!"
                echo "[+] Count: $(grep -c "ksu_handle_execveat_sucompat" "fs/exec.c")"
              else
                echo "[-] fs/exec.c patch failed for unknown reasons, please provide feedback in time."
              fi

              echo "======================================"
              ;;
            fs/open.c)
              sed -i '/#include <linux\/compat.h>/a #ifdef CONFIG_KSU_SUSFS\n#include <linux\/susfs_def.h>\n#endif' fs/open.c

              if ! grep -q "internal.h" "fs/stat.c" && ! grep "static int filename_lookup" "fs/namei.c"; then
                sed -i '/#include <linux\/compat.h>/a\#include "internal.h"' fs/stat.c
              fi

              if grep -q "do_faccessat" "fs/open.c" >/dev/null 2>&1; then
                if grep -q "static int filename_lookup" "fs/namei.c" ; then
                  sed -i '/long do_faccessat(int dfd, const char __user \*filename, int mode)/i #ifdef CONFIG_KSU_SUSFS\nextern struct static_key_true ksu_su_compat_enabled;\nextern bool __ksu_is_allow_uid_for_current(uid_t uid);\nextern int ksu_handle_faccessat(int *dfd, struct filename **filename, int *mode,\n\t\t\tint *flags);\nextern int filename_lookup(int dfd, struct filename *name, unsigned flags,\n\t\t\t\tstruct path *path, struct path *root);\n#endif' fs/open.c
                else
                  sed -i '/long do_faccessat(int dfd, const char __user \*filename, int mode)/i #ifdef CONFIG_KSU_SUSFS\nextern struct static_key_true ksu_su_compat_enabled;\nextern bool __ksu_is_allow_uid_for_current(uid_t uid);\nextern int ksu_handle_faccessat(int *dfd, struct filename **filename, int *mode,\n\t\t\tint *flags);\n#endif' fs/open.c
                fi
              else
                if grep -q "static int filename_lookup" "fs/namei.c" ; then
                  sed -i '/SYSCALL_DEFINE3(faccessat/i #ifdef CONFIG_KSU_SUSFS\nextern struct static_key_true ksu_su_compat_enabled;\nextern bool __ksu_is_allow_uid_for_current(uid_t uid);\nextern int ksu_handle_faccessat(int *dfd, struct filename **filename, int *mode,\n             int *flags);\nextern int filename_lookup(int dfd, struct filename *name, unsigned flags,\n\t\t\t\tstruct path *path, struct path *root);\n#endif' fs/open.c
                else
                  sed -i '/SYSCALL_DEFINE3(faccessat/i #ifdef CONFIG_KSU_SUSFS\nextern struct static_key_true ksu_su_compat_enabled;\nextern bool __ksu_is_allow_uid_for_current(uid_t uid);\nextern int ksu_handle_faccessat(int *dfd, struct filename **filename, int *mode,\n             int *flags);\n#endif' fs/open.c
                fi
              fi
              sed -i '/if (mode & ~S_IRWXO)/i\#ifdef CONFIG_KSU_SUSFS\n\tstruct filename *fname = NULL;\n#endif\n' fs/open.c
              sed -i '/res = user_path_at(dfd, filename, lookup_flags, \&path);/i\#ifdef CONFIG_KSU_SUSFS\n\tfname = getname_flags(filename, lookup_flags, NULL);\n\n\tif (likely(susfs_is_current_proc_no_su()))\n\t\tgoto orig_flow;\n\n\tif (static_branch_likely(\&ksu_su_compat_enabled)) {\n\t\tif (unlikely(__ksu_is_allow_uid_for_current(current_uid().val)))\n\t\t\tksu_handle_faccessat(\&dfd, \&fname, \&mode, NULL);\n\t}\n\norig_flow:\n\tres = filename_lookup(dfd, fname, lookup_flags, \&path, NULL);\n#else' fs/open.c
              sed -i '/res = user_path_at(dfd, filename, lookup_flags, \&path);/a\#endif' fs/open.c

              if grep -q "ksu_handle_faccessat" "fs/open.c"; then
                echo "[+] fs/open.c Patched!"
                echo "[+] Count: $(grep -c "ksu_handle_faccessat" "fs/open.c")"
              else
                echo "[-] fs/open.c patch failed for unknown reasons, please provide feedback in time."
              fi

              echo "======================================"
              ;;
            fs/read_write.c)
              sed -i '/SYSCALL_DEFINE3(read,/i #ifdef CONFIG_KSU\nextern struct static_key_true ksu_is_init_rc_hook_enabled;\nextern __attribute__((cold)) int ksu_handle_sys_read(unsigned int fd);\n#endif' fs/read_write.c
              if grep -q "ksys_read" "fs/read_write.c" >/dev/null 2>&1; then
                sed -i '/return ksys_read(fd, buf, count);/i #ifdef CONFIG_KSU\n\tif (static_branch_unlikely(\&ksu_is_init_rc_hook_enabled))\n\t\tksu_handle_sys_read(fd);\n#endif' fs/read_write.c
              else
                sed -i '0,/if (f\.file) {/{s/if (f\.file) {/\n#ifdef CONFIG_KSU\n\tif (static_branch_unlikely(\&ksu_is_init_rc_hook_enabled))\n\t\tksu_handle_sys_read(fd);\n#endif\n\tif (f.file) {/}' fs/read_write.c
              fi

              if grep -q "ksu_init_rc_hook" "fs/read_write.c"; then
                echo "[+] fs/read_write.c Patched!"
                echo "[+] Count: $(grep -c "ksu_init_rc_hook" "fs/read_write.c")"
              elif grep -q "ksu_handle_sys_read" "fs/read_write.c"; then
                echo "[+] fs/read_write.c Patched!"
                echo "[+] Count: $(grep -c "ksu_handle_sys_read" "fs/read_write.c")"
              else
                echo "[-] fs/read_write.c patch failed for unknown reasons, please provide feedback in time."
              fi

              echo "======================================"
              ;;
            fs/stat.c)
              if grep -q "unistd" "fs/stat.c"; then
                sed -i '/#include <asm\/unistd.h>/a\#ifdef CONFIG_KSU_SUSFS\n#include <linux\/susfs_def.h>\n#include "mount.h"\n#endif\n#ifdef CONFIG_KSU_SUSFS\nextern struct static_key_true ksu_is_init_rc_hook_enabled;\nextern void ksu_handle_vfs_fstat(int fd, loff_t *kstat_size_ptr);\nextern struct static_key_true ksu_su_compat_enabled;\nextern bool __ksu_is_allow_uid_for_current(uid_t uid);\nextern int ksu_handle_stat(int *dfd, struct filename **filename, int *flags);\n#endif' fs/stat.c
              elif grep -q "vmalloc.h" "fs/stat.c"; then
                sed -i '/#include <linux\/vmalloc.h>/a\#ifdef CONFIG_KSU_SUSFS\n#include <linux\/susfs_def.h>\n#include "mount.h"\n#endif\n#ifdef CONFIG_KSU_SUSFS\nextern struct static_key_true ksu_is_init_rc_hook_enabled;\nextern void ksu_handle_vfs_fstat(int fd, loff_t *kstat_size_ptr);\nextern struct static_key_true ksu_su_compat_enabled;\nextern bool __ksu_is_allow_uid_for_current(uid_t uid);\nextern int ksu_handle_stat(int *dfd, struct filename **filename, int *flags);\n#endif' fs/stat.c
              else
                sed -i '/#include <asm\/uaccess.h>/a\#ifdef CONFIG_KSU_SUSFS\n#include <linux\/susfs_def.h>\n#include "mount.h"\n#endif\n#ifdef CONFIG_KSU_SUSFS\nextern struct static_key_true ksu_is_init_rc_hook_enabled;\nextern void ksu_handle_vfs_fstat(int fd, loff_t *kstat_size_ptr);\nextern struct static_key_true ksu_su_compat_enabled;\nextern bool __ksu_is_allow_uid_for_current(uid_t uid);\nextern int ksu_handle_stat(int *dfd, struct filename **filename, int *flags);\n#endif' fs/stat.c
              fi

              if ! grep -q "internal.h" "fs/stat.c" && ! grep "static int filename_lookup" "fs/namei.c"; then
                sed -i '/#include <asm\/unistd.h>/a\#include "internal.h"' fs/stat.c
              fi

              if grep -q "static int filename_lookup" "fs/namei.c" ; then
                sed -i '/if ((flags & ~(AT_SYMLINK_NOFOLLOW | AT_NO_AUTOMOUNT |/i\#ifdef CONFIG_KSU_SUSFS\n\tstruct filename *fname = NULL;\nextern int filename_lookup(int dfd, struct filename *name, unsigned flags,\n\t\t\t\tstruct path *path, struct path *root);\n#endif\n' fs/stat.c
              else
                sed -i '/if ((flags & ~(AT_SYMLINK_NOFOLLOW | AT_NO_AUTOMOUNT |/i\#ifdef CONFIG_KSU_SUSFS\n\tstruct filename *fname = NULL;\n#endif\n' fs/stat.c
              fi
              sed -i '/error = user_path_at(dfd, filename, lookup_flags, \&path);/i\#ifdef CONFIG_KSU_SUSFS\n\tfname = getname_flags(filename, lookup_flags, NULL);\n\n\tif (likely(susfs_is_current_proc_no_su()))\n\t\tgoto orig_flow;\n\n\tif (static_branch_likely(\&ksu_su_compat_enabled)) {\n\t\tif (unlikely(__ksu_is_allow_uid_for_current(current_uid().val)))\n\t\t\tksu_handle_stat(\&dfd, \&fname, \&flags);\n\t}\n\norig_flow:\n\terror = filename_lookup(dfd, fname, lookup_flags, \&path, NULL);\n#else' fs/stat.c
              sed -i '/error = user_path_at(dfd, filename, lookup_flags, \&path);/a\#endif' fs/stat.c
              sed -i '/fdput(f);/i\#ifdef CONFIG_KSU_SUSFS\n\t\tif (static_branch_unlikely(\&ksu_is_init_rc_hook_enabled))\n\t\t\tksu_handle_vfs_fstat(fd, \&stat->size);\n#endif \/\/ #ifdef CONFIG_KSU_SUSFS\n' fs/stat.c

              if grep -q "ksu_handle_stat" "fs/stat.c"; then
                echo "[+] fs/stat.c Patched!"
                echo "[+] Count: $(grep -c "ksu_handle_stat" "fs/stat.c")"
              else
                echo "[-] fs/stat.c patch failed for unknown reasons, please provide feedback in time."
              fi

              echo "======================================"
              ;;
            fs/namei.c)
              if grep "static int filename_lookup" "fs/namei.c" ; then
                sed -i 's/static int filename_lookup(int dfd, struct filename \*name, unsigned flags,/int filename_lookup(int dfd, struct filename *name, unsigned flags,/' fs/namei.c
                echo "[+] fs/namei.c removed static status."
              fi

              if grep "throne_tracker" "fs/namei.c" >/dev/null 2>&1; then
                echo "[-] Warning: fs/namei.c contains KernelSU"
                echo "[+] Code in here:"
                grep -n "throne_tracker" "fs/namei.c"
                echo "[-] End of file."
              elif [ "$FIRST_VERSION" -lt 4 ] && [ "$SECOND_VERSION" -lt 19 ]; then
                sed -i '/if (unlikely(err)) {/a \#ifdef CONFIG_KSU\n\t\tif (unlikely(strstr(current->comm, "throne_tracker"))) {\n\t\t\terr = -ENOENT;\n\t\t\tgoto out_err;\n\t\t}\n#endif' fs/namei.c

                if grep -q "throne_tracker" "fs/namei.c"; then
                  echo "[+] fs/namei.c Patched!"
                  echo "[+] Count: $(grep -c "throne_tracker" "fs/namei.c")"
                else
                  echo "[-] fs/namei.c patch failed for unknown reasons, please provide feedback in time."
                fi
              else
                echo "[-] Kernel needn't throne_tracker, Skipped."
              fi

              echo "======================================"
              ;;
            drivers/input/input.c)
              sed -i '/^static void input_handle_event(struct input_dev \*dev,/i\#ifdef CONFIG_KSU\nextern struct static_key_true ksu_is_input_hook_enabled;\nextern int ksu_handle_input_handle_event(unsigned int *type, unsigned int *code, int *value);\n#endif\n' drivers/input/input.c
              sed -i '/input_get_disposition(dev, type, code, \&value);/a\#ifdef CONFIG_KSU_SUSFS\n\tif (static_branch_unlikely(\&ksu_is_input_hook_enabled))\n\t\tksu_handle_input_handle_event(\&type, \&code, \&value);\n#endif\n' drivers/input/input.c

              if grep -q "ksu_handle_input_handle_event" "drivers/input/input.c"; then
                echo "[+] drivers/input/input.c Patched!"
                echo "[+] Count: $(grep -c "ksu_handle_input_handle_event" "drivers/input/input.c")"
              else
                echo "[-] drivers/input/input.c patch failed for unknown reasons, please provide feedback in time."
              fi

              echo "======================================"
              ;;
            security/security.c)
              if [ "$FIRST_VERSION" -lt 4 ] && [ "$SECOND_VERSION" -lt 19 ]; then
                sed -i '/int security_binder_set_context_mgr(struct task_struct/i \#ifdef CONFIG_KSU\n\extern int ksu_bprm_check(struct linux_binprm *bprm);\n\extern int ksu_handle_rename(struct dentry *old_dentry, struct dentry *new_dentry);\n\extern int ksu_handle_setuid(struct cred *new, const struct cred *old);\n\#endif' security/security.c
                sed -i '/ret = security_ops->bprm_check_security(bprm);/i \#ifdef CONFIG_KSU\n\tksu_bprm_check(bprm);\n\#endif' security/security.c
                sed -i '/if (unlikely(IS_PRIVATE(old_dentry->d_inode) ||/i \#ifdef CONFIG_KSU\n\tksu_handle_rename(old_dentry, new_dentry);\n\#endif' security/security.c
                sed -i '/return security_ops->task_fix_setuid(new, old, flags);/i \#ifdef CONFIG_KSU\n\tksu_handle_setuid(new, old);\n\#endif' security/security.c

                if grep -q "ksu_handle_setuid" "security/security.c"; then
                  echo "[+] security/security.c Patched!"
                  echo "[+] Count: $(grep -c "ksu_handle_setuid" "security/security.c")"
                else
                  echo "[-] security/security.c patch failed for unknown reasons, please provide feedback in time."
                fi
              else
                echo "[-] Kernel needn't setuid, Skipped."
              fi

              echo "======================================"
              ;;
            security/selinux/hooks.c)
              if grep "security_secid_to_secctx" "security/selinux/hooks.c"; then
                echo "[-] Detected security_secid_to_secctx existed, security/selinux/hooks.c Patched!"
              else
                sed -i '/int nnp = (bprm->unsafe & LSM_UNSAFE_NO_NEW_PRIVS);/i\#ifdef CONFIG_KSU\n    static u32 ksu_sid;\n    char *secdata;\n#endif' security/selinux/hooks.c
                sed -i '/if (!nnp && !nosuid)/i\#ifdef CONFIG_KSU\n    int error;\n    u32 seclen;\n#endif' security/selinux/hooks.c
                sed -i '/return 0; \/\* No change in credentials \*\//a\\n#ifdef CONFIG_KSU\n    if (!ksu_sid)\n        security_secctx_to_secid("u:r:su:s0", strlen("u:r:su:s0"), &ksu_sid);\n\n    error = security_secid_to_secctx(old_tsec->sid, &secdata, &seclen);\n    if (!error) {\n        rc = strcmp("u:r:init:s0", secdata);\n        security_release_secctx(secdata, seclen);\n        if (rc == 0 && new_tsec->sid == ksu_sid)\n            return 0;\n    }\n#endif' security/selinux/hooks.c
              fi

              if grep -q "security_secid_to_secctx" "security/selinux/hooks.c"; then
                echo "[+] security/selinux/hooks.c Patched!"
                echo "[+] Count: $(grep -c "security_secid_to_secctx" "security/selinux/hooks.c")"
              else
                echo "[-] security/selinux/hooks.c patch failed for unknown reasons, please provide feedback in time."
              fi

              if grep -rq --include="*.c" --include="*.h" "ksu_hide_setprocattr" "drivers/kernelsu/" >/dev/null 2>&1; then
                if [ "$FIRST_VERSION" -lt 4 ] && [ "$SECOND_VERSION" -lt 19 ]; then
                  echo "[-] Kernel could not hook ksu_hide_setprocattr, Skipped."
                elif [ "$FIRST_VERSION" -lt 5 ] && [ "$SECOND_VERSION" -lt 10 ]; then
                  sed -i '/static int selinux_setprocattr(struct task_struct \*p,/i\#ifdef CONFIG_KSU\nextern int ksu_hide_setprocattr(const char *name, void *value, size_t size);\n#endif\n' security/selinux/hooks.c
                else
                  sed -i '/static int selinux_setprocattr(const char \*name, void \*value, size_t size)/i\#ifdef CONFIG_KSU\nextern int ksu_hide_setprocattr(const char *name, void *value, size_t size);\n#endif\n' security/selinux/hooks.c
                fi

                count=$(grep -rEho "char\s*\*?\s*str\s*=\s*value\s*;" "security/selinux/hooks.c" | wc -l)

                if [ "$count" -eq 1 ]; then
                  sed -i '/char \*str = value;/a\#ifdef CONFIG_KSU\n\tksu_hide_setprocattr(name, value, size);\n#endif\n' security/selinux/hooks.c
                else
                  sed -i '0,/char \*str = value;/b; /char \*str = value;/a\#ifdef CONFIG_KSU\n    ksu_hide_setprocattr(name, value, size);\n#endif\n' security/selinux/hooks.c
                fi

                if grep -q "ksu_hide_setprocattr" "security/selinux/hooks.c"; then
                  echo "[+] security/selinux/hooks.c Part II Patched!"
                  echo "[+] Count: $(grep -c "ksu_hide_setprocattr" "security/selinux/hooks.c")"
                else
                  echo "[-] security/selinux/hooks.c patch failed for unknown reasons, please provide feedback in time."
                fi
              else
                echo "[-] KernelSU needn't ksu_hide_setprocattr, Skipped."
              fi

              echo "======================================"
              ;;
            security/selinux/ss/services.c)
              if grep -q "selinux_state" "security/selinux/include/security.h" >/dev/null 2>&1; then
                echo "[-] Kernel needn't selinux_state fix, Skipped."
              elif [ "$FIRST_VERSION" -lt 5 ] && [ "$SECOND_VERSION" -lt 15 ]; then
                sed -i 's/static DEFINE_RWLOCK(policy_rwlock);/DEFINE_RWLOCK(policy_rwlock);/' security/selinux/ss/services.c

                if ! grep -q "static DEFINE_RWLOCK" "security/selinux/ss/services.c"; then
                  echo "[+] security/selinux/hooks.c Patched!"
                  echo "[+] Count: $(grep -c "static DEFINE_RWLOCK" "security/selinux/ss/services.c")"
                else
                  echo "[-] security/selinux/hooks.c patch failed for unknown reasons, please provide feedback in time."
                fi
              fi

              echo "======================================"
              ;;
            kernel/reboot.c)
              sed -i '/SYSCALL_DEFINE4(reboot, int, magic1, int, magic2, unsigned int, cmd,/i\
          #ifdef CONFIG_KSU_SUSFS\
          extern int ksu_handle_sys_reboot(int magic1, int magic2, unsigned int cmd, void __user **arg);\
          #endif\
          ' kernel/reboot.c
              sed -i '/int ret = 0;/a\
          #ifdef CONFIG_KSU_SUSFS\
              if (system_state == SYSTEM_RUNNING) {\
                  ksu_handle_sys_reboot(magic1, magic2, cmd, \&arg);\
              }\
          #endif\
          ' kernel/reboot.c

              if grep -q "ksu_handle_sys_reboot" "kernel/reboot.c"; then
                echo "[+] kernel/reboot.c Patched!"
                echo "[+] Count: $(grep -c "ksu_handle_sys_reboot" "kernel/reboot.c")"
              else
                echo "[-] kernel/reboot.c patch failed for unknown reasons, please provide feedback in time."
              fi

              echo "======================================"
              ;;
            kernel/sys.c)
              if grep -rq --include="*.c" --include="*.h" "ksu_handle_setresuid" "drivers/kernelsu/" >/dev/null 2>&1; then
                if grep -q "__sys_setresuid" "kernel/sys.c" >/dev/null 2>&1; then
                  sed -i '/^SYSCALL_DEFINE3(setresuid, uid_t, ruid, uid_t, euid, uid_t, suid)/i\#ifdef CONFIG_KSU\nextern int ksu_handle_setresuid(uid_t ruid, uid_t euid, uid_t suid);\n#endif\n' kernel/sys.c
                  sed -i '/return __sys_setresuid(ruid, euid, suid);/i\#ifdef CONFIG_KSU_SUSFS\n\tif (ksu_handle_setresuid(ruid, euid, suid)) {\n\t\tpr_info("Something wrong with ksu_handle_setresuid()\\\\n");\n\t}\n#endif\n' kernel/sys.c
                else
                  sed -i '/^SYSCALL_DEFINE3(setresuid, uid_t, ruid, uid_t, euid, uid_t, suid)/i\#ifdef CONFIG_KSU\nextern int ksu_handle_setresuid(uid_t ruid, uid_t euid, uid_t suid);\n#endif\n' kernel/sys.c
                  sed -i '0,/\tif ((ruid != (uid_t) -1) && !uid_valid(kruid))/b; /\tif ((ruid != (uid_t) -1) && !uid_valid(kruid))/i\#ifdef CONFIG_KSU_SUSFS\n\tif (ksu_handle_setresuid(ruid, euid, suid)) {\n\t\tpr_info("Something wrong with ksu_handle_setresuid()\\\\n");\n\t}\n#endif' kernel/sys.c
                fi

                if grep -q "ksu_handle_setresuid" "kernel/sys.c"; then
                  echo "[+] kernel/sys.c Patched!"
                  echo "[+] Count: $(grep -c "ksu_handle_setresuid" "kernel/sys.c")"
                else
                  echo "[-] kernel/sys.c patch failed for unknown reasons, please provide feedback in time."
                fi
              else
                echo "[-] KernelSU have no ksu_handle_setresuid, Skipped."
              fi

              echo "======================================"
              ;;
            esac
          done

          echo "=== ReSukiSU SUSFS Inline Hooks 注入完成 ==="
          
      - name: Fix conflicting susfs_kstat declaration
        working-directory: kernel
        run: |
          # 删除 v2.1 的 2 参数声明，只保留 v2.3 的 3 参数版本
          sed -i '/extern void susfs_sus_kstat_spoof_generic_fillattr(struct inode \*inode, struct kstat \*stat);/d' fs/stat.c
          # 升级所有 2 参数调用点为 3 参数
          sed -i 's/susfs_sus_kstat_spoof_generic_fillattr(inode, stat);/susfs_sus_kstat_spoof_generic_fillattr(inode, stat, STATX_SUS_KSTAT);/g' fs/stat.c
          echo "✅ fs/stat.c 声明与调用点已修复"
          grep -n "susfs_sus_kstat_spoof_generic_fillattr" fs/stat.c
          
      - name: Add STATX_SUS_KSTAT macros to susfs_def.h
        working-directory: kernel
        run: |
          # 检查宏是否已存在，不存在则追加
          if ! grep -q "STATX_SUS_KSTAT" include/linux/susfs_def.h; then
          cat >> include/linux/susfs_def.h << 'EOF'
          /* SUSFS v2.3 additions */
          #ifndef STATX_SUS_KSTAT
          #define STATX_SUS_KSTAT 0x10000000U
          #endif
          #ifndef STATX_SUS_KSTAT_FUSE
          #define STATX_SUS_KSTAT_FUSE 0x20000000U
          #endif
          EOF
          echo "✅ 已补充 STATX_SUS_KSTAT 宏"
          else
          echo "✅ 宏已存在"
          fi
          grep -n "STATX_SUS_KSTAT" include/linux/susfs_def.h

      - name: Fix STATX_SUS_KSTAT visibility
        working-directory: kernel
        run: |
          # 1. 确认宏在 susfs_def.h 里
          grep -n "STATX_SUS_KSTAT" include/linux/susfs_def.h || echo "宏不存在"
          # 2. 确认 fs/stat.c 是否 include susfs_def.h
          grep -n "susfs_def.h" fs/stat.c || echo "stat.c 未 include"
          # 3. 如果没有 include，则加上
          if ! grep -q "susfs_def.h" fs/stat.c; then
          sed -i '/#include <asm\/unistd.h>/a\#ifdef CONFIG_KSU_SUSFS\n#include <linux\/susfs_def.h>\n#endif' fs/stat.c
          echo "✅ 已在 fs/stat.c 中添加 susfs_def.h include"
          fi

      - name: Configure Kernel
        working-directory: kernel
        run: |
          export ARCH=${{ env.KERNEL_ARCH }}
          export PATH="${{ env.CLANG_DIR }}/bin:$PATH"
          export CCACHE_EXEC=$(which ccache)
          export CCACHE_DIR="${{ env.CCACHE_DIR }}"
          ccache -M 6G
          export LLVM=1 LLVM_IAS=1 CLANG_TRIPLE=aarch64-linux-gnu- \
                 CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi-

          make mrproper || true
          make -j$(nproc) O=${{ env.OUTPUT_DIR }} ${{ env.DEFCONFIG_NAME }}

          scripts/config --file ${{ env.OUTPUT_DIR }}/.config \
            --enable KSU \
            --enable INIT_ON_ALLOC_DEFAULT_ON \
            --enable KSU_HOOK_INLINE \
            --disable KSU_HOOK_TRACEPOINT \
            --disable KSU_HOOK_MANUAL \
            --enable KSU_SELINUX \
            --enable KSU_ZYGISK \
            --disable KPROBES \
            --disable HAVE_KPROBES \
            --disable KPROBE_EVENTS \
            --enable KALLSYMS \
            --enable KALLSYMS_ALL \
            --enable MODULES \
            --enable MODULE_UNLOAD \
            --enable OVERLAY_FS \
            --enable EXT4_FS \
            --enable NAMESPACES \
            --disable KSU_DEBUG \
            --enable KSU_SUSFS \
            --enable KSU_SUSFS_SUS_PATH \
            --enable KSU_SUSFS_SUS_MOUNT \
            --enable KSU_SUSFS_SUS_KSTAT \
            --enable KSU_SUSFS_SPOOF_UNAME \
            --enable KSU_SUSFS_OPEN_REDIRECT \
            --enable KSU_SUSFS_SUS_MAP \
            --enable KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS \
            --enable KSU_SUSFS_ENABLE_LOG \
            --enable KSU_SUSFS_SUS_SU \
            --set-val CONFIG_FRAME_WARN 3072

          make olddefconfig O=${{ env.OUTPUT_DIR }}

      - name: Build Kernel
        working-directory: kernel
        run: |
          set -e
          export ARCH=${{ env.KERNEL_ARCH }}
          export PATH="${{ env.CLANG_DIR }}/bin:$PATH"
          export CCACHE_EXEC=$(which ccache)
          export CCACHE_DIR="${{ env.CCACHE_DIR }}"
          ccache -M 6G
          export LLVM=1 LLVM_IAS=1 CLANG_TRIPLE=aarch64-linux-gnu- \
                 CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi-

          make -j$(nproc) O=${{ env.OUTPUT_DIR }} \
            KCFLAGS="-Wno-strict-prototypes -Wno-align-mismatch -Wno-unused-function -Wno-compare-distinct-pointer-types -Wno-void-pointer-to-int-cast -Wno-array-parameter -Wno-declaration-after-statement"

          if [ ! -f "${{ env.OUTPUT_DIR }}/arch/arm64/boot/Image" ]; then
            echo "ERROR: Kernel Image not found!"
            exit 1
          fi

      - name: Package AnyKernel3
        id: package
        run: |
          TIME=$(date +"%Y.%m.%d")
          AK3_DIR="AnyKernel3"
          IMG_PATH="${{ env.KERNEL_DIR }}/${{ env.OUTPUT_DIR }}/arch/arm64/boot/Image"
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git $AK3_DIR
          cp -f "$IMG_PATH" "$AK3_DIR/Image"

          sed -i 's/^do.devicecheck=1/do.devicecheck=0/' "$AK3_DIR/anykernel.sh"
          sed -i 's/^BLOCK=.*/BLOCK=boot/' "$AK3_DIR/anykernel.sh"
          sed -i 's/^IS_SLOT_DEVICE=0/IS_SLOT_DEVICE=1/' "$AK3_DIR/anykernel.sh"
          sed -i 's/^device.name1=.*/device.name1=star/' "$AK3_DIR/anykernel.sh"

          cd $AK3_DIR
          zip -r9 "../${{ env.DEVICE_CODENAME }}-SUSFS_v2.3.0-${TIME}.zip" ./*
          cd ..
          echo "zip_name=${{ env.DEVICE_CODENAME }}-SUSFS_v2.3.0-${TIME}.zip" >> $GITHUB_OUTPUT

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: kernel_with_susfs_v2.3.0
          path: ${{ env.DEVICE_CODENAME }}-SUSFS_v2.3.0-*.zip

      - name: Optional Release (if needed)
        if: github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: susfs_v2.3.0_${{ github.run_number }}
          name: "SUSFS v2.3.0 Full Features Build"
          body: |
            ## 测试内核 - 包含 SUSFS v2.3.0 全功能
            - ReSukiSU v35089
            - 已启用 SUS_PATH、SUS_MOUNT、SUS_KSTAT、SPOOF_UNAME、OPEN_REDIRECT、SUS_MAP、ENABLE_LOG 等功能
            - 刷机有风险，请备份原内核
          files: ${{ env.DEVICE_CODENAME }}-SUSFS_v2.3.0-*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
