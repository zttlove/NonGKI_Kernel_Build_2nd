name: Build Kernel with ReSukiSU + SUSFS

on:
  workflow_dispatch:

env:
  TZ: Asia/Shanghai
  DEVICE_CODENAME: "star"
  KERNEL_ARCH: "arm64"
  KERNEL_REPO: "zttlove/android_kernel_xiaomi_sm8350-hyperos"
  KERNEL_BRANCH: "dynamic"
  DEFCONFIG_NAME: "vendor/star_defconfig"
  OUTPUT_DIR: "out"
  CLANG_DIR: "${{ github.workspace }}/clang"
  CCACHE_DIR: "${{ github.workspace }}/.ccache"
  KERNEL_DIR: "${{ github.workspace }}/kernel"

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:

      - name: Checkout Kernel Source
        uses: actions/checkout@v4
        with:
          repository: ${{ env.KERNEL_REPO }}
          ref: ${{ env.KERNEL_BRANCH }}
          path: kernel
          fetch-depth: 1

      - name: Checkout Workflow Repo (Patches)
        uses: actions/checkout@v4
        with:
          path: workflow_repo
          fetch-depth: 1

      - name: Install Dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            bc bison flex libelf-dev libssl-dev libncurses-dev \
            make python3 device-tree-compiler git curl xz-utils \
            ccache zip unzip
          echo "正在修复 libtinfo.so.5 依赖..."
          if ! sudo apt install -y libtinfo5; then
            sudo ln -sf /lib/x86_64-linux-gnu/libtinfo.so.6 /lib/x86_64-linux-gnu/libtinfo.so.5
          fi
          if [ ! -f /lib/x86_64-linux-gnu/libtinfo.so.5 ]; then
            echo "::error::修复失败！libtinfo.so.5 仍然不存在。"
            exit 1
          else
            echo "✅ libtinfo.so.5 修复成功！"
          fi

      - name: Download Clang (From LLVM GitHub)
        run: |
          mkdir -p ${{ env.CLANG_DIR }}
          curl -L --retry 3 -o clang.tar.xz "https://github.com/llvm/llvm-project/releases/download/llvmorg-14.0.6/clang+llvm-14.0.6-x86_64-linux-gnu-rhel-8.4.tar.xz"
          tar -xf clang.tar.xz -C ${{ env.CLANG_DIR }} --strip-components=1
          rm clang.tar.xz
          ${{ env.CLANG_DIR }}/bin/clang --version

      # ============================================================
      # 2. 配置内核（彻底清理、生成配置、启用所有 SUSFS 功能）
      # ============================================================
      - name: Configure Kernel
        working-directory: kernel
        run: |
          set -e
          export ARCH=${{ env.KERNEL_ARCH }}
          export PATH="${{ env.CLANG_DIR }}/bin:$PATH"
          export CCACHE_EXEC=$(which ccache)
          export CCACHE_DIR="${{ env.CCACHE_DIR }}"
          ccache -M 6G
          export LLVM=1 LLVM_IAS=1 CLANG_TRIPLE=aarch64-linux-gnu- \
                 CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi-

          # 1. 彻底清理
          echo "正在彻底清理残留文件..."
          rm -rf ${{ env.OUTPUT_DIR }}
          rm -f .config
          rm -rf include/config include/generated
          make mrproper

          # 2. 生成 .config
          echo "正在生成 out/.config ..."
          make -j$(nproc) O=${{ env.OUTPUT_DIR }} ${{ env.DEFCONFIG_NAME }}
          
          if [ ! -f "${{ env.OUTPUT_DIR }}/.config" ]; then
            echo "::error::make defconfig 失败，out/.config 不存在！"
            exit 1
          fi
          echo "✅ out/.config 生成成功"

          # 3. 启用所有 KSU 和 SUSFS 功能（源码已自带，直接打开开关）
          scripts/config --file ${{ env.OUTPUT_DIR }}/.config \
            --enable KSU \
            --enable KSU_MANUAL_HOOK \
            --disable KSU_TRACEPOINT_HOOK \
            --enable KSU_SUSFS \
            --enable KSU_SUSFS_SUS_PATH \
            --enable KSU_SUSFS_SUS_MOUNT \
            --enable KSU_SUSFS_SUS_KSTAT \
            --enable KSU_SUSFS_SPOOF_UNAME \
            --enable KSU_SUSFS_OPEN_REDIRECT \
            --enable KSU_SUSFS_SUS_MAP \
            --enable KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS \
            --enable KSU_SUSFS_ENABLE_LOG \
            --enable KSU_SUSFS_SUS_SU \
            --enable KSU_ZYGISK \
            --enable KSU_SELINUX \
            --enable KPROBES \
            --enable HAVE_KPROBES \
            --enable KPROBE_EVENTS \
            --enable KALLSYMS \
            --enable KALLSYMS_ALL \
            --enable MODULES \
            --enable MODULE_UNLOAD \
            --enable OVERLAY_FS \
            --enable EXT4_FS \
            --enable NAMESPACES \
            --set-str LOCALVERSION ""
          
          # 4. 再次运行 olddefconfig，确保配置生效
          make olddefconfig O=${{ env.OUTPUT_DIR }}
          
          # 5. 校验关键配置
          echo "=== 检查关键配置是否生效 ==="
          if grep -q "CONFIG_KSU_MANUAL_HOOK=y" ${{ env.OUTPUT_DIR }}/.config; then
            echo "✅ CONFIG_KSU_MANUAL_HOOK=y 生效"
          else
            echo "::error::CONFIG_KSU_MANUAL_HOOK 未启用！"
            exit 1
          fi
          
          if grep -q "CONFIG_KSU_SUSFS=y" ${{ env.OUTPUT_DIR }}/.config; then
            echo "✅ CONFIG_KSU_SUSFS=y 生效"
          else
            echo "::error::CONFIG_KSU_SUSFS 未启用！"
            exit 1
          fi

          if grep -q "CONFIG_KSU_SUSFS_SUS_PATH=y" ${{ env.OUTPUT_DIR }}/.config; then
            echo "✅ CONFIG_KSU_SUSFS_SUS_PATH=y 生效"
          else
            echo "::error::CONFIG_KSU_SUSFS_SUS_PATH 未启用！"
            exit 1
          fi
          
          # 6. 确保 Makefile 中包含必要规则（如果源码已配置，此步不会重复）
          echo "=== 检查并补全 fs/Makefile ==="
          if ! grep -q "susfs.o" fs/Makefile; then
            echo "obj-\$(CONFIG_KSU_SUSFS) += susfs.o" >> fs/Makefile
            echo "⚠️ 已追加 susfs.o 到 fs/Makefile"
          else
            echo "✅ fs/Makefile 已包含 susfs.o"
          fi
          
          echo "=== 检查并补全 drivers/Makefile ==="
          if ! grep -q "kernelsu" drivers/Makefile; then
            echo "obj-\$(CONFIG_KSU) += kernelsu/" >> drivers/Makefile
            echo "⚠️ 已追加 kernelsu/ 到 drivers/Makefile"
          else
            echo "✅ drivers/Makefile 已包含 kernelsu/"
          fi
          
          # 7. 处理 Kbuild 中对 GKI 1.0 的强制检查（如果存在）
          echo "=== 处理 Kbuild 强制报错 ==="
          if [ -f "drivers/kernelsu/kernel/Kbuild" ]; then
            sed -i '/TP hooks are incompatible with Non-GKI/d' drivers/kernelsu/kernel/Kbuild
            echo "✅ 已移除 Kbuild 中的强制报错行"
          fi

      # ============================================================
      # 3. 编译（输出 build.log 便于排查）
      # ============================================================
      - name: Build Kernel
        working-directory: kernel
        run: |
          set -e
          export ARCH=${{ env.KERNEL_ARCH }}
          export PATH="${{ env.CLANG_DIR }}/bin:$PATH"
          export CCACHE_EXEC=$(which ccache)
          export CCACHE_DIR="${{ env.CCACHE_DIR }}"
          ccache -M 6G
          export LLVM=1 LLVM_IAS=1 CLANG_TRIPLE=aarch64-linux-gnu- \
                 CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          
          make -j$(nproc) O=${{ env.OUTPUT_DIR }} \
               KCFLAGS="-Wno-error -Wno-strict-prototypes -Wno-align-mismatch -Wno-unused-function -Wno-compare-distinct-pointer-types -Wno-void-pointer-to-int-cast -Wno-declaration-after-statement" \
               2>&1 | tee build.log

      # ============================================================
      # 4. 打包 AnyKernel3
      # ============================================================
      - name: Package AnyKernel3
        id: package
        run: |
          TIME=$(date +"%Y.%m.%d")
          AK3_DIR="AnyKernel3"
          IMG_PATH="${{ env.KERNEL_DIR }}/${{ env.OUTPUT_DIR }}/arch/arm64/boot/Image"
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git $AK3_DIR
          cp -f "$IMG_PATH" "$AK3_DIR/Image"
          sed -i 's/^do.devicecheck=1/do.devicecheck=0/' "$AK3_DIR/anykernel.sh"
          sed -i 's/^BLOCK=.*/BLOCK=boot/' "$AK3_DIR/anykernel.sh"
          sed -i 's/^IS_SLOT_DEVICE=0/IS_SLOT_DEVICE=1/' "$AK3_DIR/anykernel.sh"
          sed -i 's/^device.name1=.*/device.name1=star/' "$AK3_DIR/anykernel.sh"
          cd $AK3_DIR
          zip -r9 "../${{ env.DEVICE_CODENAME }}-ReSukiSU-SUSFS-${TIME}.zip" ./*
          cd ..
          echo "zip_name=${{ env.DEVICE_CODENAME }}-ReSukiSU-SUSFS-${TIME}.zip" >> $GITHUB_OUTPUT

      # ============================================================
      # 5. 上传
      # ============================================================
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: kernel_resukisu_susfs
          path: ${{ env.DEVICE_CODENAME }}-ReSukiSU-SUSFS-*.zip

      - name: Upload build.log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build_log
          path: kernel/build.log
          if-no-files-found: ignore

      - name: Optional Release
        if: github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: resukisu_susfs_${{ github.run_number }}
          name: "ReSukiSU + SUSFS Kernel"
          body: |
            ## 测试内核 - ReSukiSU + SUSFS 2.3
            - 源码自带 SUSFS 2.3
            - 手动钩子 (Manual Hook)
            - 开启所有 SUSFS 功能
            - 刷机有风险，请备份原内核
          files: ${{ env.DEVICE_CODENAME }}-ReSukiSU-SUSFS-*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
