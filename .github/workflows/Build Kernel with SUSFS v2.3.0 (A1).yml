name: Build Kernel without KSU (Power Saving)

on:
  workflow_dispatch:

env:
  TZ: Asia/Shanghai
  DEVICE_CODENAME: "star"
  KERNEL_ARCH: "arm64"
  KERNEL_REPO: "zttlove/android_kernel_xiaomi_sm8350-hyperos"
  KERNEL_BRANCH: "dynamic"
  DEFCONFIG_NAME: "vendor/star_defconfig"
  OUTPUT_DIR: "out"
  CLANG_DIR: "${{ github.workspace }}/clang"
  CCACHE_DIR: "${{ github.workspace }}/.ccache"
  KERNEL_DIR: "${{ github.workspace }}/kernel"

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:

      - name: Checkout Kernel Source
        uses: actions/checkout@v4
        with:
          repository: ${{ env.KERNEL_REPO }}
          ref: ${{ env.KERNEL_BRANCH }}
          path: kernel
          fetch-depth: 1

      - name: Checkout Workflow Repo (Patches)
        uses: actions/checkout@v4
        with:
          path: workflow_repo
          fetch-depth: 1

      - name: Install Dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            bc bison flex libelf-dev libssl-dev libncurses-dev \
            make python3 device-tree-compiler git curl xz-utils \
            ccache zip unzip zstd
          echo "正在修复 libtinfo.so.5 依赖..."
          if ! sudo apt install -y libtinfo5; then
            sudo ln -sf /lib/x86_64-linux-gnu/libtinfo.so.6 /lib/x86_64-linux-gnu/libtinfo.so.5
          fi
          if [ ! -f /lib/x86_64-linux-gnu/libtinfo.so.5 ]; then
            echo "::error::修复失败！libtinfo.so.5 仍然不存在。"
            exit 1
          else
            echo "✅ libtinfo.so.5 修复成功！"
          fi

      - name: Download Clang 23.1.2 (From LLVM GitHub)
        run: |
          mkdir -p ${{ env.CLANG_DIR }}
          curl -L --retry 3 -o LLVM-23.1.2-Linux-X64.tar.xz "https://github.com/llvm/llvm-project/releases/download/llvmorg-23.1.2/LLVM-23.1.2-Linux-X64.tar.xz"
          tar -xf LLVM-23.1.2-Linux-X64.tar.xz -C ${{ env.CLANG_DIR }} --strip-components=1
          rm LLVM-23.1.2-Linux-X64.tar.xz
          ${{ env.CLANG_DIR }}/bin/clang --version

      # ============================================================
      # 2. 配置内核（无 KSU，仅省电与基础功能）
      # ============================================================
      - name: Configure Kernel
        working-directory: kernel
        run: |
          set -e
          export ARCH=${{ env.KERNEL_ARCH }}
          export PATH="${{ env.CLANG_DIR }}/bin:$PATH"
          export CCACHE_EXEC=$(which ccache)
          export CCACHE_DIR="${{ env.CCACHE_DIR }}"
          ccache -M 6G
          export LLVM=1 LLVM_IAS=1 CLANG_TRIPLE=aarch64-linux-gnu- \
                 CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi-

          # 1. 修复 focaltech_3680 Makefile 缩进问题
          echo "正在修复 focaltech_3680 Makefile..."
          FOCALTECH_MAKEFILE="drivers/input/touchscreen/focaltech_3680/Makefile"
          if [ -f "$FOCALTECH_MAKEFILE" ]; then
            sed -i 's/^ \+/\t/' "$FOCALTECH_MAKEFILE"
            echo "✅ 已修复 focaltech_3680 Makefile 缩进"
          fi

          # 2. 彻底清理
          echo "正在彻底清理残留文件..."
          rm -rf ${{ env.OUTPUT_DIR }}
          rm -f .config
          rm -rf include/config include/generated
          make mrproper

          # 3. 生成 .config
          echo "正在生成 out/.config ..."
          make -j$(nproc) O=${{ env.OUTPUT_DIR }} ${{ env.DEFCONFIG_NAME }}
          
          if [ ! -f "${{ env.OUTPUT_DIR }}/.config" ]; then
            echo "::error::make defconfig 失败，out/.config 不存在！"
            exit 1
          fi
          echo "✅ out/.config 生成成功"

          # 4. 禁用所有 KSU/SUSFS，启用省电与 BPF
          #    关键：保留原作者的 LOCALVERSION 字符串，避免 VINTF 校验失败
          scripts/config --file ${{ env.OUTPUT_DIR }}/.config \
            --disable KSU \
            --disable KSU_MANUAL_HOOK \
            --disable KSU_TRACEPOINT_HOOK \
            --disable KSU_SUSFS \
            --disable KSU_SUSFS_SUS_PATH \
            --disable KSU_SUSFS_SUS_MOUNT \
            --disable KSU_SUSFS_SUS_KSTAT \
            --disable KSU_SUSFS_SPOOF_UNAME \
            --disable KSU_SUSFS_OPEN_REDIRECT \
            --disable KSU_SUSFS_SUS_MAP \
            --disable KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS \
            --disable KSU_SUSFS_ENABLE_LOG \
            --disable KSU_SUSFS_SUS_SU \
            --disable KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG \
            --disable KSU_ZYGISK \
            --disable KSU_SELINUX \
            --enable KPROBES \
            --enable HAVE_KPROBES \
            --enable KPROBE_EVENTS \
            --enable KALLSYMS \
            --enable KALLSYMS_ALL \
            --enable MODULES \
            --enable MODULE_UNLOAD \
            --enable OVERLAY_FS \
            --enable EXT4_FS \
            --enable NAMESPACES \
            --disable HEADERS_INSTALL \
            --enable BPF_SYSCALL \
            --enable BPF_JIT \
            --enable BPF_STREAM_PARSER \
            --enable NET_SOCK_MSG \
            --enable CGROUP_BPF \
            --enable NET \
            --enable INET \
            --enable UNIX \
            --enable CPU_FREQ_DEFAULT_GOV_SCHEDUTIL \
            --disable CPU_FREQ_DEFAULT_GOV_PERFORMANCE \
            --enable CPU_IDLE \
            --enable CPU_IDLE_GOV_MENU \
            --enable ARM_QCOM_LPM_CPUIDLE \
            --enable DEVFREQ_GOV_SIMPLE_ONDEMAND \
            --enable MQ_IOSCHED_KYBER \
            --disable DEBUG_INFO \
            --disable DEBUG_KERNEL \
            --set-val FRAME_WARN 100000 \
            --set-str LOCALVERSION "-ikun-NekoMake-star-260927-qgqi" \
            --set-str CONFIG_CC_VERSION_TEXT "clang version 23.1.2"
          
          # 5. 清空 manual_hook_check.mk 绕过强制检查（虽然 KSU 已禁用，但保留以防万一）
          echo "=== 清空 manual_hook_check.mk ==="
          find . -name "manual_hook_check.mk" -exec sh -c 'echo "# Check bypassed" > "$1"' _ {} \;
          echo "✅ 已清空所有 manual_hook_check.mk"
          
          # 6. 移除任何可能强制编译 KSU 的 Makefile 规则
          echo "=== 清理 Makefile 中的 KSU 强制编译规则 ==="
          sed -i '/kernelsu/d' drivers/Makefile 2>/dev/null || true
          sed -i '/KernelSU/d' drivers/Makefile 2>/dev/null || true
          echo "✅ 已清理 drivers/Makefile"
          
          # 7. 校验关键配置
          echo "=== 检查关键配置是否生效 ==="
          if grep -q "CONFIG_KSU=y" ${{ env.OUTPUT_DIR }}/.config; then
            echo "::error::CONFIG_KSU 居然被启用了！"
            exit 1
          else
            echo "✅ CONFIG_KSU 已禁用"
          fi

          if grep -q "CONFIG_CPU_FREQ_DEFAULT_GOV_SCHEDUTIL=y" ${{ env.OUTPUT_DIR }}/.config; then
            echo "✅ 省电调频器 schedutil 已启用"
          else
            echo "⚠️ schedutil 未启用，请检查"
          fi

          if grep -q "CONFIG_BPF_STREAM_PARSER=y" ${{ env.OUTPUT_DIR }}/.config; then
            echo "✅ CONFIG_BPF_STREAM_PARSER=y 生效"
          else
            echo "::error::CONFIG_BPF_STREAM_PARSER 未启用！"
            exit 1
          fi

          if grep -q "CONFIG_NET_SOCK_MSG=y" ${{ env.OUTPUT_DIR }}/.config; then
            echo "✅ CONFIG_NET_SOCK_MSG=y 生效"
          else
            echo "::error::CONFIG_NET_SOCK_MSG 未启用！"
            exit 1
          fi

          if grep -q 'CONFIG_LOCALVERSION="-ikun-NekoMake-star-260927-qgqi"' ${{ env.OUTPUT_DIR }}/.config; then
            echo "✅ LOCALVERSION 已匹配原内核"
          else
            echo "⚠️ LOCALVERSION 未匹配，但继续编译"
          fi

      # ============================================================
      # 3. 编译
      # ============================================================
      - name: Build Kernel
        working-directory: kernel
        run: |
          set -e
          export ARCH=${{ env.KERNEL_ARCH }}
          export PATH="${{ env.CLANG_DIR }}/bin:$PATH"
          export CCACHE_EXEC=$(which ccache)
          export CCACHE_DIR="${{ env.CCACHE_DIR }}"
          ccache -M 6G
          export LLVM=1 LLVM_IAS=1 CLANG_TRIPLE=aarch64-linux-gnu- \
                 CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi-

          # 用 olddefconfig 处理配置补全，而不是靠 yes "" 管道
          make O=${{ env.OUTPUT_DIR }} olddefconfig

          # 编译时加上 -Wno-default-const-init-var-unsafe 抑制新警告
          make -j$(nproc) O=${{ env.OUTPUT_DIR }} \
               KCFLAGS="-Wno-error -Wno-default-const-init-var-unsafe -Wno-frame-larger-than -Wno-strict-prototypes -Wno-align-mismatch -Wno-unused-function -Wno-compare-distinct-pointer-types -Wno-void-pointer-to-int-cast -Wno-declaration-after-statement" \
               2>&1 | tee build.log
      # ============================================================
      # 4. 打包 AnyKernel3
      # ============================================================
      - name: Package AnyKernel3
        id: package
        run: |
          TIME=$(date +"%Y.%m.%d")
          AK3_DIR="AnyKernel3"
          IMG_PATH="${{ env.KERNEL_DIR }}/${{ env.OUTPUT_DIR }}/arch/arm64/boot/Image"
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git $AK3_DIR
          cp -f "$IMG_PATH" "$AK3_DIR/Image"
          sed -i 's/^do.devicecheck=1/do.devicecheck=0/' "$AK3_DIR/anykernel.sh"
          sed -i 's/^BLOCK=.*/BLOCK=boot/' "$AK3_DIR/anykernel.sh"
          sed -i 's/^IS_SLOT_DEVICE=0/IS_SLOT_DEVICE=1/' "$AK3_DIR/anykernel.sh"
          sed -i 's/^device.name1=.*/device.name1=star/' "$AK3_DIR/anykernel.sh"
          cd $AK3_DIR
          zip -r9 "../${{ env.DEVICE_CODENAME }}-NoKSU-${TIME}.zip" ./*
          cd ..
          echo "zip_name=${{ env.DEVICE_CODENAME }}-NoKSU-${TIME}.zip" >> $GITHUB_OUTPUT

      # ============================================================
      # 5. 上传
      # ============================================================
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: kernel_no_ksu
          path: ${{ env.DEVICE_CODENAME }}-NoKSU-*.zip

      - name: Upload build.log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build_log
          path: kernel/build.log
          if-no-files-found: ignore

      - name: Optional Release
        if: github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: no_ksu_${{ github.run_number }}
          name: "No-KSU Kernel (Power Saving)"
          body: |
            ## 测试内核 - 无 KSU 省电版（LLVM 23.1.2）
            - 使用与原内核相同的 LLVM 23.1.2 工具链
            - 已禁用所有 KSU/SUSFS 功能
            - 启用 schedutil、CPU Idle、LPM 等省电配置
            - LOCALVERSION 与原内核保持一致
            - 刷机有风险，请备份原内核
          files: ${{ env.DEVICE_CODENAME }}-NoKSU-*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
