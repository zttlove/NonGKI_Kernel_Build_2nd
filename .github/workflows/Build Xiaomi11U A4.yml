name: Build Xiaomi11U (A4)

on:
  workflow_call:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  DEVICE_NAME : "xiaomi_11U"
  DEVICE_CODENAME : "star"

  CUSTOM_CMDS : "CLANG_TRIPLE=aarch64-linux-gnu-"
  EXTRA_CMDS : "LD=ld.lld LLVM=1 LLVM_IAS=1"
  KCFLAGS_EXTRA : "-Wno-strict-prototypes -Wno-align-mismatch -Wno-unused-function -Wno-compare-distinct-pointer-types -Wno-void-pointer-to-int-cast -Wno-array-parameter -Wno-declaration-after-statement -fno-stack-protector"

  KERNEL_SOURCE : "https://github.com/zttlove/android_kernel_xiaomi_sm8350_miyume.git"
  KERNEL_BRANCH : "main"

  CLANG_SOURCE : "https://github.com/llvm/llvm-project/releases/download/llvmorg-18.1.8/clang+llvm-18.1.8-x86_64-linux-gnu-ubuntu-18.04.tar.xz"
  CLANG_BRANCH : ""

  GCC_GNU : false
  GCC_64_SOURCE : "https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9.git"
  GCC_64_BRANCH : "android12L-release"
  GCC_32_SOURCE : "https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/arm/arm-linux-androideabi-4.9.git"
  GCC_32_BRANCH : "android12L-release"

  DEFCONFIG_SOURCE: ""
  DEFCONFIG_NAME : "star_defconfig"
  DEFCONFIG_ORIGIN_IMAGE: ""
  DEFCONFIG_FROM_BOOT: false

  KERNELSU_SOURCE : ""
  KERNELSU_BRANCH : ""

  KERNELSU_AUTO_GET : "true"
  KERNELSU_AUTO_FORK : "resukisu"

  SUSFS_ENABLE : true
  SUSFS_FIXED : true

  AK3_SOURCE : "https://github.com/osm0sis/Anykernel3.git"
  AK3_BRANCH : "master"

  BOOT_SOURCE : ""
  NEED_DTBO : false
  NEED_SAFE_DTBO : false
  ROM_TEXT : "Xiaomi11U-HyperA16"

  PYTHON_VERSION: "3"
  PACK_METHOD: "Anykernel3"
  PACK_KMODULES: "false"

  KERNELSU_METHOD: "shell"
  KERNELSU_SUS_PATCH: "false"

  PATCHES_SOURCE: "JackA1ltman/NonGKI_Kernel_Patches"
  PATCHES_BRANCH: "mi_kernel"

  SUSFS_FOLDER_FIXED: "mi11_evox_a16"
  SUSFS_PATCH_FIXED: "susfs_fixed"

  REKERNEL_ENABLE: "false"
  HOOK_METHOD: "syscall"
  KERNEL_PATCH: "false"

  KPM_ENABLE: "false"
  KPM_INLINE: "false"
  KPM_KPATCH_NEXT: "false"
  KPM_PATCH_SOURCE: "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU_patch/refs/heads/main/kpm/patch_linux"

  BASEBAND_GUARD_ENABLE: "false"
  BASEBAND_GUARD_BOOT: "false"
  HIDE_STUFF: "false"

  GENERATE_DTB: "false"
  GENERATE_CHIP: "qcom"

  BUILD_DEBUGGER: "false"
  SKIP_PATCH: "false"
  BUILD_OTHER_CONFIG: "false"
  MERGE_CONFIG_FILES: "vendor/venus_QGKI.config,vendor/xiaomi_QGKI.config"
  FREE_MORE_SPACE: "false"

jobs:
  build-kernel:
    name: Build Xiaomi11U (A4)
    runs-on: ubuntu-latest
    env:
      CCACHE_COMPILERCHECK: "%compiler% -dumpmachine; %compiler% -dumpversion"
      CCACHE_NOHASHDIR: "true"
      CCACHE_HARDLINK: "true"

    steps:
      - name: ⏰ Checkout repository
        uses: actions/checkout@v6

      - name: ⌛️ Compilation environment preparation
        uses: ./.github/workflows/build-env

      - name: ⚙️ Get neccssary tools
        uses: ./.github/workflows/build-ready

      - name: 🪝 Patch Kernel of SUSFS
        uses: ./.github/workflows/patch-susfs

      # ============================================================
      # 关键：修复必须放在 patch-susfs 之后、其他 patch 之前
      # 工作目录是 device_kernel，不是 kernel
      # ============================================================
      - name: Fix namei.c missing found_sus_path and retry label
        working-directory: device_kernel
        shell: bash
        run: |
          set -euo pipefail
          N="fs/namei.c"
          [[ -f "$N" ]] || { echo "::error::找不到 $N"; exit 1; }

          echo "=== 修复前 __lookup_hash 附近 ==="
          sed -n '1650,1680p' "$N"

          # ---------- 1. 定位报错行 1659 所在函数：__lookup_hash ----------
          # __lookup_hash 的函数结束在 return dentry; 后跟 }
          # 我们要在这个函数内插入声明和 retry: 标签

          # 找到 __lookup_hash 函数起始行
          FUNC_START=$(grep -n "^static struct dentry \*__lookup_hash(" "$N" | head -1 | cut -d: -f1)
          [[ -n "$FUNC_START" ]] || { echo "::error::找不到 __lookup_hash 函数"; exit 1; }
          echo "__lookup_hash 起始行: $FUNC_START"

          # 找到该函数里 goto retry; 的行（一定在 1659 之后、函数结束前）
          GOTO_LINE=$(awk -v s="$FUNC_START" 'NR>s && /goto retry;/ { print NR; exit }' "$N")
          [[ -n "$GOTO_LINE" ]] || { echo "::error::__lookup_hash 里没有 goto retry;"; exit 1; }
          echo "__lookup_hash 里 goto retry; 行: $GOTO_LINE"

          # 找到该函数里 "dentry = d_alloc(base, name);" 的行，作为 retry 标签位置
          ALLOC_LINE=$(awk -v s="$FUNC_START" -v g="$GOTO_LINE" 'NR>s && NR<g && /dentry = d_alloc\(base, name\);/ { print NR; exit }' "$N")
          echo "d_alloc 行: ${ALLOC_LINE:-未找到}"

          # ---------- 2. 检查 __lookup_hash 里是否已经有 found_sus_path 声明 ----------
          # 只看 FUNC_START 到 GOTO_LINE 之间
          if awk -v s="$FUNC_START" -v g="$GOTO_LINE" 'NR>s && NR<g && /bool found_sus_path = false;/ {found=1} END{exit !found}' "$N"; then
            echo "✅ __lookup_hash 里已有 found_sus_path 声明"
          else
            # 在 __lookup_hash 函数体第一行（含 { 的那行之后）插入
            # 简单做法：在函数里第一个 struct dentry *dentry; 之后插入
            INSERT_AFTER=$(awk -v s="$FUNC_START" 'NR>s && /struct dentry \*dentry/ { print NR; exit }' "$N")
            [[ -n "$INSERT_AFTER" ]] || INSERT_AFTER="$FUNC_START"
            awk -v ins="$INSERT_AFTER" '
              NR==ins { print; print "\tbool found_sus_path = false;"; next }
              { print }
            ' "$N" > "$N.tmp" && mv "$N.tmp" "$N"
            echo "✅ 已在 __lookup_hash 内插入 found_sus_path 声明（第 $INSERT_AFTER 行之后）"
            # 行号变了，重新算 GOTO_LINE
            FUNC_START=$(grep -n "^static struct dentry \*__lookup_hash(" "$N" | head -1 | cut -d: -f1)
            GOTO_LINE=$(awk -v s="$FUNC_START" 'NR>s && /goto retry;/ { print NR; exit }' "$N")
          fi

          # ---------- 3. 检查 __lookup_hash 里是否已有 retry: 标签 ----------
          if awk -v s="$FUNC_START" -v g="$GOTO_LINE" 'NR>s && NR<g && /^retry:/ {found=1} END{exit !found}' "$N"; then
            echo "✅ __lookup_hash 里已有 retry: 标签"
          else
            ALLOC_LINE=$(awk -v s="$FUNC_START" -v g="$GOTO_LINE" 'NR>s && NR<g && /dentry = d_alloc\(base, name\);/ { print NR; exit }' "$N")
            [[ -n "$ALLOC_LINE" ]] || { echo "::error::__lookup_hash 里找不到 d_alloc(base, name);"; exit 1; }
            awk -v ins="$ALLOC_LINE" '
              NR==ins { print "retry:"; print; next }
              { print }
            ' "$N" > "$N.tmp" && mv "$N.tmp" "$N"
            echo "✅ 已在 __lookup_hash 内 d_alloc 前插入 retry: 标签（第 $ALLOC_LINE 行前）"
          fi

          # ---------- 4. 校验 ----------
          echo "=== 修复后 __lookup_hash 附近 ==="
          sed -n '1650,1690p' "$N"
          echo "=== git diff ==="
          git diff -- "$N" || true

          ccache -C 2>/dev/null || true
          echo "✅ Fix step 完成"
          
      - name: 🔗 Patch for no-kprobe
        uses: ./.github/workflows/patch-no-kprobe

      - name: 🪛 Extra Kernel Options
        run: |
          cd "$GITHUB_WORKSPACE/device_kernel"

      - name: 🧰 Patch Kernel of Re:Kernel
        uses: ./.github/workflows/patch-rekernel

      - name: 🔒 Patch Kernel of Baseband Guard
        uses: ./.github/workflows/patch-baseband-guard

      - name: 🔧 Patch Hide Stuff
        uses: ./.github/workflows/patch-hide-stuff

      - name: 🚀 Build Process
        uses: ./.github/workflows/build-process

      # 打包Anykernel3 仅Image内核专用
      - name: 📦 Package Anykernel3 Flash Zip
        if: env.PACK_METHOD == 'Anykernel3'
        shell: bash
        run: |
          set -euo pipefail
          echo "============================================="
          echo "📦 开始打包 Star Hyper A16 内核卡刷包"
          echo "============================================="

          TIME=$(TZ=Asia/Shanghai date +"%Y-%m-%d")
          KERNEL_DIR="${GITHUB_WORKSPACE}/device_kernel"
          TMP_DIR="${KERNEL_DIR}/tmp"
          IMG_PATH="${KERNEL_DIR}/out/arch/arm64/boot/Image"
          cd "${KERNEL_DIR}"

          if [[ ! -f "${IMG_PATH}" ]]; then
            echo "::error::❌ 编译失败，未找到 out/arch/arm64/boot/Image 内核文件"
            exit 1
          fi
          IMG_SIZE=$(du -h "${IMG_PATH}" | awk '{print $1}')
          echo "✅ 检测到内核镜像 Image | 大小: ${IMG_SIZE}"

          rm -rf "${TMP_DIR}"
          mkdir -p "${TMP_DIR}"

          AK3_DIR="${KERNEL_DIR}/Anykernel3"
          if [[ -d "${AK3_DIR}" && -f "${AK3_DIR}/anykernel.sh" ]]; then
          
          sed -i 's/^do.devicecheck=1/do.devicecheck=0/' "$AK3_DIR/anykernel.sh"
          sed -i 's/^BLOCK=.*/BLOCK=boot/' "$AK3_DIR/anykernel.sh"
          sed -i 's/^IS_SLOT_DEVICE=0/IS_SLOT_DEVICE=1/' "$AK3_DIR/anykernel.sh"
          sed -i 's/^device.name1=.*/device.name1=star/' "$AK3_DIR/anykernel.sh"


          cp -v "${IMG_PATH}" "${TMP_DIR}/Image"

          if [[ "${{ env.PACK_KMODULES }}" == "true" ]]; then
            MOD_DIR="${TMP_DIR}/modules/vendor/lib/modules"
            mkdir -p "${MOD_DIR}"
            find . -name "*.ko" -type f -print0 | xargs -0 cp -t "${MOD_DIR}/" 2>/dev/null || true
            module_count=$(find "${MOD_DIR}" -name "*.ko" | wc -l)
            echo "📦 打包内核模块: ${module_count} 个"
            [[ ${module_count} -eq 0 ]] && rm -rf "${TMP_DIR}/modules"
          else
            echo "ℹ️ 已关闭模块打包，跳过ko文件"
          fi

          [[ -d "${AK3_DIR}" ]] && cp -rp "${AK3_DIR}"/* "${TMP_DIR}/"

          cd "${TMP_DIR}"
          7za a -tzip -mx9 -mmt=on package.zip ./* >/dev/null
          cd "${GITHUB_WORKSPACE}"

          FINAL_ZIP="${{ env.DEVICE_CODENAME }}-${{ env.ROM_TEXT }}-${TIME}-Ak3.zip"
          cp -fp "${TMP_DIR}/package.zip" "${FINAL_ZIP}"
          echo "PACK_NAME=${FINAL_ZIP}" >> "${GITHUB_ENV}"
          echo "✅ 刷机包打包完成: ${FINAL_ZIP}"

          rm -rf "${TMP_DIR}"

      - name: 🚀 Auto Upload To Github Release
        if: env.PACK_METHOD == 'Anykernel3'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: Star-HyperA16-Kernel-${{ github.run_number }}
          name: Xiaomi 11 Ultra Star HyperOS A16 NonGKI Kernel
          body: |
            ## Xiaomi 11 Ultra Star HyperOS A16 内核刷机包
            - 适配 HyperOS A16 全版本
            - SukiSU ResukiSU Root 完整适配
            - SUSFS 隐藏文件系统免补丁
            - NonGKI 通用免解boot补丁
            - Osm0sis Anykernel3 官方卡刷格式
            - Clang 20 最新编译
          files: ${{ env.PACK_NAME }}
          draft: false
          prerelease: false
          overwrite_files: true
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
