name: Build Xiaomi11U (A4)

on:
  workflow_call:
  workflow_dispatch:

env:
  # Device env
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  DEVICE_NAME : "xiaomi_11U"
  DEVICE_CODENAME : "star"

  CUSTOM_CMDS : "CLANG_TRIPLE=aarch64-linux-gnu-"
  EXTRA_CMDS : 'LD=ld.lld LLVM=1 LLVM_IAS=1 EXTRA_CFLAGS="-Wno-unused-function -Wno-frame-larger-than"'

  KERNEL_SOURCE : "https://github.com/zttlove/android_kernel_xiaomi_sm8350_miyume.git"
  KERNEL_BRANCH : "main"

  CLANG_SOURCE : "https://github.com/ZyCromerZ/Clang/releases/download/20.0.0git-20241222-release/Clang-20.0.0git-20241222.tar.gz"
  CLANG_BRANCH : ""

  GCC_GNU : false
  GCC_64_SOURCE : "https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9.git"
  GCC_64_BRANCH : "android12L-release"
  GCC_32_SOURCE : "https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/arm/arm-linux-androideabi-4.9.git"
  GCC_32_BRANCH : "android12L-release"

  DEFCONFIG_SOURCE: ""
  DEFCONFIG_NAME : "star_defconfig"
  DEFCONFIG_ORIGIN_IMAGE: ""
  DEFCONFIG_FROM_BOOT: false

  KERNELSU_SOURCE : ""
  KERNELSU_BRANCH : ""

  KERNELSU_AUTO_GET : "true"
  KERNELSU_AUTO_FORK : "resukisu"

  SUSFS_ENABLE : true
  SUSFS_FIXED : true

  AK3_SOURCE : "https://github.com/osm0sis/Anykernel3.git"
  AK3_BRANCH : "master"

  BOOT_SOURCE : ""
  NEED_DTBO : false
  NEED_SAFE_DTBO : false
  ROM_TEXT : "Xiaomi11U-HyperA16"

  PYTHON_VERSION: "3"
  PACK_METHOD: "Anykernel3"
  PACK_KMODULES: "false"

  KERNELSU_METHOD: "shell"
  KERNELSU_SUS_PATCH: "false"

  PATCHES_SOURCE: "JackA1ltman/NonGKI_Kernel_Patches"
  PATCHES_BRANCH: "mi_kernel"

  SUSFS_FOLDER_FIXED: "mi11_evox_a16"
  SUSFS_PATCH_FIXED: "susfs_fixed"

  REKERNEL_ENABLE: "false"
  HOOK_METHOD: "syscall"
  KERNEL_PATCH: "false"

  KPM_ENABLE: "false"
  KPM_INLINE: "false"
  KPM_KPATCH_NEXT: "false"
  KPM_PATCH_SOURCE: "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU_patch/refs/heads/main/kpm/patch_linux"

  BASEBAND_GUARD_ENABLE: "false"
  BASEBAND_GUARD_BOOT: "false"
  HIDE_STUFF: "false"

  GENERATE_DTB: "false"
  GENERATE_CHIP: "qcom"

  BUILD_DEBUGGER: "false"
  SKIP_PATCH: "false"
  BUILD_OTHER_CONFIG: "false"
  MERGE_CONFIG_FILES: "vendor/venus_QGKI.config,vendor/xiaomi_QGKI.config"
  FREE_MORE_SPACE: "false"

jobs:
  build-kernel:
    name: Build Xiaomi11U (A4)
    runs-on: ubuntu-latest
    env:
      CCACHE_COMPILERCHECK: "%compiler% -dumpmachine; %compiler% -dumpversion"
      CCACHE_NOHASHDIR: "true"
      CCACHE_HARDLINK: "true"

    steps:
      - name: ⏰ Checkout repository
        uses: actions/checkout@v6

      - name: ⌛️ Compilation environment preparation
        uses: ./.github/workflows/build-env

      - name: ⚙️ Get neccssary tools
        uses: ./.github/workflows/build-ready

      - name: 🪝 Patch Kernel of SUSFS
        uses: ./.github/workflows/patch-susfs

      - name: 🔗 Patch for no-kprobe
        uses: ./.github/workflows/patch-no-kprobe

      - name: 🪛 Extra Kernel Options
        run: |
          cd "$GITHUB_WORKSPACE/device_kernel"
          


      - name: 🧰 Patch Kernel of Re:Kernel
        uses: ./.github/workflows/patch-rekernel

      - name: 🔒 Patch Kernel of Baseband Guard
        uses: ./.github/workflows/patch-baseband-guard

      - name: 🔧 Patch Hide Stuff
        uses: ./.github/workflows/patch-hide-stuff
          
      
      - name: Fix kallsyms incomplete proc_ops & susfs weak symbol workaround
        run: |
          set -e
          cd "$GITHUB_WORKSPACE/device_kernel"
          KERNEL_ROOT="$GITHUB_WORKSPACE/device_kernel"

          # 1. 还原源码文件，防止历史修改残留
          echo "Reverting modified source files..."
          git checkout HEAD -- \
            kernel/kallsyms.c \
            fs/proc/task_mmu.c \
            fs/notify/fdinfo.c \
            fs/exec.c \
            fs/namei.c \
            fs/namespace.c \
            fs/proc_namespace.c

          # 2. 清理历史残留文件及 Makefile 规则
          echo "Cleaning up old weak_susfs and stack_chk_fix artifacts..."
          rm -f weak_susfs.c kernel/weak_susfs.c kernel/stack_chk_fix.c || true
          sed -i '/weak_susfs\.o/d' kernel/Makefile || true
          sed -i '/stack_chk_fix\.o/d' kernel/Makefile || true
          sed -i '/EXTRA_OBJS += weak_susfs\.o/d' "$KERNEL_ROOT/Makefile" || true

                    
          # 3. 在根目录生成 weak_susfs.c (使用带 extern __weak 声明的版本)
          echo "Generating weak_susfs.c..."
          cat > weak_susfs.c << 'EOF'
          #include <linux/fs.h>
          #include <linux/proc_fs.h>
          #include <linux/mm.h>
          #include <linux/module.h>

          extern __weak int susfs_hide_sus_mnts_for_non_su_procs(void);
          extern __weak int susfs_open_redirect_spoof_show_map_vma(struct seq_file *m, struct vm_area_struct *vma);
          extern __weak struct vm_area_struct *get_pad_vma(struct vm_area_struct *vma);
          extern __weak struct vm_area_struct *get_data_vma(struct vm_area_struct *vma);
          extern __weak void show_map_pad_vma(struct seq_file *m, struct vm_area_struct *vma);

          __weak int susfs_hide_sus_mnts_for_non_su_procs(void) { return 0; }
          __weak int susfs_open_redirect_spoof_show_map_vma(struct seq_file *m, struct vm_area_struct *vma) { return 0; }
          __weak struct vm_area_struct *get_pad_vma(struct vm_area_struct *vma) { return NULL; }
          __weak struct vm_area_struct *get_data_vma(struct vm_area_struct *vma) { return NULL; }
          __weak void show_map_pad_vma(struct seq_file *m, struct vm_area_struct *vma) {}

          EXPORT_SYMBOL_GPL(susfs_hide_sus_mnts_for_non_su_procs);
          EXPORT_SYMBOL_GPL(susfs_open_redirect_spoof_show_map_vma);
          EXPORT_SYMBOL_GPL(get_pad_vma);
          EXPORT_SYMBOL_GPL(get_data_vma);
          EXPORT_SYMBOL_GPL(show_map_pad_vma);
          EOF

          # 4. 将 weak_susfs.o 追加到顶层 Makefile (改用 obj-y)
          echo "Appending obj-y to root Makefile..."
          echo 'obj-y += weak_susfs.o' >> "$KERNEL_ROOT/Makefile"

          # 5. 各类语法修复 (保持你原有的 sed 逻辑，增加注释)
          echo "Applying syntax patches..."
          sed -i '17{/^#endif/d}' fs/notify/fdinfo.c
          sed -i '283s/min(/min_t(unsigned int,/' drivers/clk/qcom/clk-rpmh.c
          sed -i '2028s/min(/min_t(unsigned long long,/' net/ipv4/tcp_output.c
          sed -i '170s/(u32)device->iface_q_table.align_virtual_addr/(u32)(uintptr_t)device->iface_q_table.align_virtual_addr/' techpack/video/msm/vidc/hfi_iris2.c
          sed -i '253s/ION_HEAP_TYPE_SECURE_CARVEOUT/(enum ion_heap_type)ION_HEAP_TYPE_SECURE_CARVEOUT/' drivers/staging/android/ion/heaps/msm_ion.c
          sed -i '254s/ION_HEAP_TYPE_SYSTEM_SECURE/(enum ion_heap_type)ION_HEAP_TYPE_SYSTEM_SECURE/' drivers/staging/android/ion/heaps/msm_ion.c
          sed -i '255s/ION_HEAP_TYPE_HYP_CMA/(enum ion_heap_type)ION_HEAP_TYPE_HYP_CMA/' drivers/staging/android/ion/heaps/msm_ion.c
          sed -i '2734s/(u8)of_device_get_match_data/(u8)(uintptr_t)of_device_get_match_data/' drivers/regulator/qpnp-lcdb-regulator.c
          sed -i '6163s/uint8_t mdie\[SIR_MDIE_SIZE\]/uint8_t mdie[]/' drivers/staging/qcacld-3.0/core/mac/src/sys/legacy/src/utils/src/parser_api.c
          sed -i '622s/&rq->csd/__builtin_assume_aligned(\&rq->csd, 64)/' block/blk-mq.c
          sed -i '180s/int ret;/int ret = 0;/' drivers/android/hwui_mon.c

          # 6. 清理构建目录，使用 Actions 的 CPU 核心数加速
          echo "Running make clean..."
          make clean -j$(nproc)


          
      - name: 🚀 Build Process
        uses: ./.github/workflows/build-process

      # 打包Anykernel3 仅Image内核专用
      - name: 📦 Package Anykernel3 Flash Zip
        if: env.PACK_METHOD == 'Anykernel3'
        shell: bash
        run: |
          set -euo pipefail
          echo "============================================="
          echo "📦 开始打包 Star Hyper A16 内核卡刷包"
          echo "============================================="

          TIME=$(TZ=Asia/Shanghai date +"%Y-%m-%d")
          KERNEL_DIR="${GITHUB_WORKSPACE}/device_kernel"
          TMP_DIR="${KERNEL_DIR}/tmp"
          IMG_PATH="${KERNEL_DIR}/out/arch/arm64/boot/Image"
          cd "${KERNEL_DIR}"

          # 严格校验内核文件存在
          if [[ ! -f "${IMG_PATH}" ]]; then
            echo "::error::❌ 编译失败，未找到 out/arch/arm64/boot/Image 内核文件"
            exit 1
          fi
          IMG_SIZE=$(du -h "${IMG_PATH}" | awk '{print $1}')
          echo "✅ 检测到内核镜像 Image | 大小: ${IMG_SIZE}"

          # 清理重建临时目录
          rm -rf "${TMP_DIR}"
          mkdir -p "${TMP_DIR}"

          # 自动修改Anykernel3机型适配参数
          AK3_DIR="${KERNEL_DIR}/Anykernel3"
          if [[ -d "${AK3_DIR}" && -f "${AK3_DIR}/anykernel.sh" ]]; then
            sed -i \
              -e 's/^name=.*/name="Star-HyperA16-NonGKI-Kernel"/' \
              -e 's/^do\.devicecheck=.*/do.devicecheck=0/' \
              -e 's/^IS_SLOT_DEVICE=.*/IS_SLOT_DEVICE=1/' \
              -e 's/^BLOCK=.*/BLOCK=boot/' \
              "${AK3_DIR}/anykernel.sh"
              curl -L https://raw.githubusercontent.com/zttlove/NonGKI_Kernel_Build_2nd/mainline/Patches/anykernel.sh -o Anykernel3/anykernel.sh
              chmod +x Anykernel3/anykernel.sh
          fi

          # 复制内核主镜像
          cp -v "${IMG_PATH}" "${TMP_DIR}/Image"

          # 按需打包内核模块
          if [[ "${{ env.PACK_KMODULES }}" == "true" ]]; then
            MOD_DIR="${TMP_DIR}/modules/vendor/lib/modules"
            mkdir -p "${MOD_DIR}"
            find . -name "*.ko" -type f -print0 | xargs -0 cp -t "${MOD_DIR}/" 2>/dev/null || true
            module_count=$(find "${MOD_DIR}" -name "*.ko" | wc -l)
            echo "📦 打包内核模块: ${module_count} 个"
            [[ ${module_count} -eq 0 ]] && rm -rf "${TMP_DIR}/modules"
          else
            echo "ℹ️ 已关闭模块打包，跳过ko文件"
          fi

          # 合并Anykernel3刷机脚本全部文件
          [[ -d "${AK3_DIR}" ]] && cp -rp "${AK3_DIR}"/* "${TMP_DIR}/"

          # 最高压缩率打包ZIP
          cd "${TMP_DIR}"
          7za a -tzip -mx9 -mmt=on package.zip ./* >/dev/null
          cd "${GITHUB_WORKSPACE}"

          # 生成唯一不重复文件名
          FINAL_ZIP="${{ env.DEVICE_CODENAME }}-${{ env.ROM_TEXT }}-${TIME}-Ak3.zip"
          cp -fp "${TMP_DIR}/package.zip" "${FINAL_ZIP}"
          echo "PACK_NAME=${FINAL_ZIP}" >> "${GITHUB_ENV}"
          echo "✅ 刷机包打包完成: ${FINAL_ZIP}"

          # 彻底清理临时垃圾文件
          rm -rf "${TMP_DIR}"

      # 自动发布到GitHub Releases页面（动态标签永不重复报错）
      - name: 🚀 Auto Upload To Github Release
        if: env.PACK_METHOD == 'Anykernel3'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: Star-HyperA16-Kernel-${{ github.run_number }}
          name: Xiaomi 11 Ultra Star HyperOS A16 NonGKI Kernel #构建号#${{ github.run_number }}
          body: |
            ## Xiaomi 11 Ultra Star HyperOS A16 内核刷机包
            - 适配 HyperOS A16 全版本
            - SukiSU ResukiSU Root 完整适配
            - SUSFS 隐藏文件系统免补丁
            - NonGKI 通用免解boot补丁
            - Osm0sis Anykernel3 官方卡刷格式
            - Clang 20 最新编译
          files: ${{ env.PACK_NAME }}
          draft: false
          prerelease: false
          overwrite_files: true
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
