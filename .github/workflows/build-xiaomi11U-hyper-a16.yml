name: Build Xiaomi11U (hyper A16)

on:
  workflow_call:
  workflow_dispatch:

env:
  # Device env
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  DEVICE_NAME: "xiaomi_11U"
  DEVICE_CODENAME: "star"

  CUSTOM_CMDS: "CLANG_TRIPLE=aarch64-linux-gnu-"
  EXTRA_CMDS: "LD=ld.lld LLVM=1 LLVM_IAS=1"
  KCFLAGS_EXTRA: "-Wframe-larger-than=4096 -Wno-strict-prototypes -Wno-unused-function -Wno-compare-distinct-pointer-types -Wno-void-pointer-to-int-cast -Wno-declaration-after-statement -fno-stack-protector"

  KERNEL_SOURCE: "https://github.com/MiYume0721/android_kernel_xiaomi_sm8350_miyume.git"
  KERNEL_BRANCH: "main"

  CLANG_SOURCE: "https://github.com/AICP/prebuilts_clang_host_linux-x86.git"
  CLANG_BRANCH: "master"

  GCC_GNU: false
  GCC_64_SOURCE: "https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9.git"
  GCC_64_BRANCH: "android12L-release"
  GCC_32_SOURCE: "https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/arm/arm-linux-androideabi-4.9.git"
  GCC_32_BRANCH: "android12L-release"

  # ============ 修改点 1：禁用自动拉取，防止 build-ready 报错 ============
  DEFCONFIG_SOURCE: ""
  DEFCONFIG_NAME: "star_defconfig"
  DEFCONFIG_ORIGIN_IMAGE: ""
  DEFCONFIG_FROM_BOOT: false

  KERNELSU_SOURCE: ""
  KERNELSU_BRANCH: ""

  KERNELSU_AUTO_GET: "true"
  KERNELSU_AUTO_FORK: "resukisu"

  # 源码自带 SUSFS 2.1.0，不再打补丁
  SUSFS_ENABLE: "false"
  SUSFS_FIXED: "false"

  AK3_SOURCE: "https://github.com/osm0sis/Anykernel3.git"
  AK3_BRANCH: "master"

  BOOT_SOURCE: ""
  NEED_DTBO: false
  NEED_SAFE_DTBO: false
  ROM_TEXT: "Xiaomi11U-HyperA16"

  PYTHON_VERSION: "3"
  PACK_METHOD: "Anykernel3"
  PACK_KMODULES: "false"

  KERNELSU_METHOD: "shell"
  KERNELSU_SUS_PATCH: "false"

  PATCHES_SOURCE: "JackA1ltman/NonGKI_Kernel_Patches"
  PATCHES_BRANCH: "mi_kernel"

  SUSFS_FOLDER_FIXED: "mi11_evox_a16"
  SUSFS_PATCH_FIXED: "susfs_fixed"

  REKERNEL_ENABLE: "false"
  HOOK_METHOD: "syscall"
  KERNEL_PATCH: "false"

  KPM_ENABLE: "false"
  KPM_INLINE: "false"
  KPM_KPATCH_NEXT: "false"
  KPM_PATCH_SOURCE: "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU_patch/refs/heads/main/kpm/patch_linux"

  BASEBAND_GUARD_ENABLE: "false"
  BASEBAND_GUARD_BOOT: "false"
  HIDE_STUFF: "false"

  GENERATE_DTB: "false"
  GENERATE_CHIP: "qcom"

  BUILD_DEBUGGER: "false"
  SKIP_PATCH: "false"
  BUILD_OTHER_CONFIG: "false"
  MERGE_CONFIG_FILES: "vendor/venus_QGKI.config,vendor/xiaomi_QGKI.config"
  FREE_MORE_SPACE: "false"

jobs:
  build-kernel:
    name: Xiaomi11U (hyper A16)
    runs-on: ubuntu-latest
    env:
      CCACHE_COMPILERCHECK: "%compiler% -dumpmachine; %compiler% -dumpversion"
      CCACHE_NOHASHDIR: "true"
      CCACHE_HARDLINK: "true"

    steps:
      - name: ⏰ Checkout repository
        uses: actions/checkout@v6

      - name: ⌛️ Compilation environment preparation
        uses: ./.github/workflows/build-env

      # ============ 修改点 2：把克隆源码提到最前面 ============
      - name: 🔧 Manually clone kernel source
        shell: bash
        run: |
          set -euo pipefail
          DEST="$GITHUB_WORKSPACE/device_kernel"
          rm -rf "$DEST"
          git clone "${{ env.KERNEL_SOURCE }}" \
            -b "${{ env.KERNEL_BRANCH }}" \
            --depth=1 \
            "$DEST"
          cd "$DEST"
          echo "=== 源码已 clone ==="
          ls include/linux/susfs.h
          grep "SUSFS_VERSION" include/linux/susfs.h

      # ============ 修改点 3：手动下载并覆盖 star_defconfig ============
      - name: 🔄 Override star_defconfig from NonGKI_Kernel_Build_2nd
        working-directory: device_kernel
        shell: bash
        run: |
          set -euo pipefail
          echo "正在从指定仓库下载并覆盖 star_defconfig..."
          
          # 确保目录存在
          mkdir -p arch/arm64/configs
          
          # 下载并覆盖
          curl -L --fail --retry 3 --retry-delay 5 \
            -o arch/arm64/configs/star_defconfig \
            "https://raw.githubusercontent.com/zttlove/NonGKI_Kernel_Build_2nd/mainline/scripts/star_defconfig"
          
          # 验证下载结果
          if [ ! -s arch/arm64/configs/star_defconfig ]; then
            echo "::error::❌ 覆盖失败，目标文件为空或不存在"
            exit 1
          fi
          
          echo "✅ star_defconfig 已成功覆盖"
          echo "=== 覆盖后的文件前 5 行 ==="
          head -5 arch/arm64/configs/star_defconfig
          echo "=== 检查 LOCALVERSION ==="
          grep "CONFIG_LOCALVERSION" arch/arm64/configs/star_defconfig || true

      # ============ 修改点 4：此时再获取工具（DEFCONFIG 已就位） ============
      - name: ⚙️ Get neccssary tools
        uses: ./.github/workflows/build-ready

      - name: 🔍 Diagnose KernelSU submodule
        working-directory: device_kernel
        shell: bash
        run: |
          echo "=== .gitmodules ==="
          cat .gitmodules || echo "(无)"

          echo ""
          echo "=== drivers/kernelsu 是什么 ==="
          ls -la drivers/kernelsu 2>&1 || echo "(不存在)"
          ls -la drivers/ | grep -i ksu || echo "(drivers 下无 ksu 相关)"

          echo ""
          echo "=== 是否有 KernelSU 子目录 ==="
          find . -maxdepth 2 -type d -name "*KernelSU*" -o -maxdepth 2 -type d -name "*kernelsu*" 2>/dev/null | head

          echo ""
          echo "=== drivers/Kconfig 第 235-245 行 ==="
          sed -n '235,245p' drivers/Kconfig

      - name: 📦 Init KernelSU submodule (pin to 3576e6a5)
        working-directory: device_kernel
        shell: bash
        run: |
          set -euo pipefail

          git submodule update --init --recursive

          cd KernelSU
          echo "=== fetch main 历史（用于定位 3576e6a5） ==="
          git fetch origin main --depth=300
          echo "=== checkout 3576e6a5 ==="
          git checkout 3576e6a5
          git log -1 --oneline
          git rev-parse HEAD
          cd ..

          echo ""
          echo "=== 验证 drivers/kernelsu/Kconfig 存在 ==="
          ls -la drivers/kernelsu/Kconfig

      - name: 🔧 Convert susfs proc_no_su helpers to non-inline symbols
        working-directory: device_kernel
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PYEOF'
          import re

          funcs = [
            "susfs_is_current_proc_no_su",
            "susfs_set_current_proc_no_su",
            "susfs_clear_current_proc_no_su",
            "susfs_is_current_proc_umounted_for_zygote_next",
            "susfs_set_current_proc_umounted_for_zygote_next",
            "susfs_clear_current_proc_umounted_for_zygote_next",
          ]

          # 1. 从 susfs_def.h 删掉 static inline 定义
          path = "include/linux/susfs_def.h"
          with open(path) as f:
              content = f.read()

          removed = 0
          for fn in funcs:
              pat = r'static\s+inline\s+[A-Za-z_]+\s+' + fn + r'\s*\(void\)\s*\{[^}]*\}\s*\n'
              content, n = re.subn(pat, '', content)
              removed += n

          with open(path, "w") as f:
              f.write(content)
          print(f"[+] susfs_def.h: removed {removed} static inline defs")

          # 2. 在 susfs.h 里加 extern 声明
          path = "include/linux/susfs.h"
          with open(path) as f:
              content = f.read()

          decl = (
            "\n/* proc_no_su helpers (non-inline) */\n"
            "bool susfs_is_current_proc_no_su(void);\n"
            "void susfs_set_current_proc_no_su(void);\n"
            "void susfs_clear_current_proc_no_su(void);\n"
            "bool susfs_is_current_proc_umounted_for_zygote_next(void);\n"
            "void susfs_set_current_proc_umounted_for_zygote_next(void);\n"
            "void susfs_clear_current_proc_umounted_for_zygote_next(void);\n"
          )

          if "susfs_is_current_proc_no_su" not in content:
              idx = content.rfind("#endif")
              content = content[:idx] + decl + "\n" + content[idx:]
              with open(path, "w") as f:
                  f.write(content)
              print("[+] susfs.h: added extern decls")

          # 3. 在 fs/susfs.c 顶部确保 include <linux/susfs_def.h>
          path = "fs/susfs.c"
          with open(path) as f:
              content = f.read()

          if "#include <linux/susfs_def.h>" not in content:
              m = re.search(r'(#include\s+<[^>]+>\n)', content)
              if m:
                  insert_pos = m.end()
                  content = content[:insert_pos] + "#include <linux/susfs_def.h>\n" + content[insert_pos:]
                  with open(path, "w") as f:
                      f.write(content)
                  print("[+] fs/susfs.c: added #include <linux/susfs_def.h>")
              else:
                  print("::error::fs/susfs.c 找不到 #include 位置")
                  raise SystemExit(1)

          # 4. 追加实现
          with open(path) as f:
              content = f.read()

          impl = (
            "\n/* proc_no_su helpers (non-inline) */\n"
            "bool susfs_is_current_proc_no_su(void) {\n"
            "\treturn (likely(test_thread_flag(TIF_PROC_NO_SU)));\n"
            "}\n\n"
            "void susfs_set_current_proc_no_su(void) {\n"
            "\tset_thread_flag(TIF_PROC_NO_SU);\n"
            "}\n\n"
            "void susfs_clear_current_proc_no_su(void) {\n"
            "\tclear_thread_flag(TIF_PROC_NO_SU);\n"
            "}\n\n"
            "bool susfs_is_current_proc_umounted_for_zygote_next(void) {\n"
            "\treturn (likely(test_thread_flag(TIF_PROC_UMOUNTED_FOR_ZYGOTE_NEXT)));\n"
            "}\n\n"
            "void susfs_set_current_proc_umounted_for_zygote_next(void) {\n"
            "\tset_thread_flag(TIF_PROC_UMOUNTED_FOR_ZYGOTE_NEXT);\n"
            "}\n\n"
            "void susfs_clear_current_proc_umounted_for_zygote_next(void) {\n"
            "\tclear_thread_flag(TIF_PROC_UMOUNTED_FOR_ZYGOTE_NEXT);\n"
            "}\n"
          )

          if "susfs_is_current_proc_no_su(void) {" not in content:
              content = content.rstrip() + "\n" + impl
              with open(path, "w") as f:
                  f.write(content)
              print("[+] fs/susfs.c: added non-inline impls")

          # 5. 兜底：确保 TIF_PROC_* 宏存在
          path = "include/linux/susfs_def.h"
          with open(path) as f:
              content = f.read()

          if "TIF_PROC_NO_SU" not in content:
              macros = (
                "\n/* proc_no_su TIF macros */\n"
                "#ifndef TIF_PROC_UMOUNTED\n"
                "#define TIF_PROC_UMOUNTED 33\n"
                "#endif\n"
                "#ifndef TIF_PROC_NO_SU\n"
                "#define TIF_PROC_NO_SU 34\n"
                "#endif\n"
                "#ifndef TIF_PROC_UMOUNTED_FOR_ZYGOTE_NEXT\n"
                "#define TIF_PROC_UMOUNTED_FOR_ZYGOTE_NEXT 35\n"
                "#endif\n"
              )
              idx = content.rfind("#endif")
              content = content[:idx] + macros + "\n" + content[idx:]
              with open(path, "w") as f:
                  f.write(content)
              print("[+] susfs_def.h: added TIF_PROC_* macros")
          PYEOF

          echo ""
          echo "=== 验证 ==="
          grep -n "linux/susfs_def.h" fs/susfs.c || echo "(无)"
          grep -c "^bool susfs_is_current_proc_no_su" fs/susfs.c || echo 0
          grep -c "TIF_PROC_NO_SU\|TIF_PROC_UMOUNTED_FOR_ZYGOTE_NEXT" include/linux/susfs_def.h || echo 0

      - name: 🔧 Setup Clang to clang-custom
        shell: bash
        run: |
          set -euo pipefail
          DEST="$GITHUB_WORKSPACE/clang-custom"
          rm -rf "$DEST"
          git clone --depth=1 \
            https://github.com/thenoppy12/clang-r416183b.git \
            "$DEST"
          if [[ ! -x "$DEST/bin/clang" || ! -x "$DEST/bin/ld.lld" ]]; then
            echo "::error::❌ clang 或 ld.lld 缺失"
            ls -la "$DEST/bin" | head -20
            exit 1
          fi
          "$DEST/bin/clang" --version | head -1
          "$DEST/bin/ld.lld" --version | head -1
          echo "✅ Clang 已就绪: $DEST/bin"

      - name: 🔎 Verify source completeness
        working-directory: device_kernel
        run: |
          echo "=== SUSFS 版本 ==="
          grep "SUSFS_VERSION" include/linux/susfs.h

          echo "=== ReSukiSU 版本 ==="
          grep -rn "KSU_VERSION" drivers/kernelsu/ 2>/dev/null | head -3

          echo "=== fs/susfs.c 存在 ==="
          ls -la fs/susfs.c

          echo "=== star_defconfig 存在 ==="
          ls -la arch/arm64/configs/star_defconfig 2>/dev/null || echo "(不在 arch/arm64/configs/)"
          ls -la arch/arm64/configs/vendor/star_defconfig 2>/dev/null || echo "(不在 arch/arm64/configs/vendor/)"

          echo "=== KSU hook 是否已内置 ==="
          grep -c "ksu_handle_setresuid" kernel/sys.c || echo 0
          grep -c "ksu_handle_sys_read" fs/read_write.c || echo 0

      - name: 🔗 Patch for no-kprobe
        uses: ./.github/workflows/patch-no-kprobe

      - name: 🪛 Extra Kernel Options
        run: |
          cd "$GITHUB_WORKSPACE/device_kernel"

      - name: 🧰 Patch Kernel of Re:Kernel
        uses: ./.github/workflows/patch-rekernel

      - name: 🔒 Patch Kernel of Baseband Guard
        uses: ./.github/workflows/patch-baseband-guard

      - name: 🔧 Patch Hide Stuff
        uses: ./.github/workflows/patch-hide-stuff

      - name: 🔎 Check cpufreq API in 5.4
        shell: bash
        run: |
          cd $GITHUB_WORKSPACE/device_kernel
          echo "=== cpufreq_table_find_index_* in cpufreq.h ==="
          grep -n "cpufreq_table_find_index" include/linux/cpufreq.h || echo "NOT FOUND"
          echo ""
          echo "=== cpufreq_frequency_table_target ==="
          grep -rn "cpufreq_frequency_table_target" include/ drivers/cpufreq/*.c 2>/dev/null | head -5 || echo "NOT FOUND ANYWHERE"
          echo ""
          echo "=== signature of verify for reference ==="
          sed -n '695,705p' include/linux/cpufreq.h

      - name: 🚀 Build Process
        uses: ./.github/workflows/build-process

      # 打包Anykernel3 仅Image内核专用
      - name: 📦 Package Anykernel3 Flash Zip
        if: env.PACK_METHOD == 'Anykernel3'
        shell: bash
        run: |
          set -euo pipefail
          echo "============================================="
          echo "📦 开始打包 Star Hyper A16 内核卡刷包"
          echo "============================================="

          TIME=$(TZ=Asia/Shanghai date +"%Y-%m-%d")
          KERNEL_DIR="${GITHUB_WORKSPACE}/device_kernel"
          TMP_DIR="${KERNEL_DIR}/tmp"
          IMG_PATH="${KERNEL_DIR}/out/arch/arm64/boot/Image"
          cd "${KERNEL_DIR}"

          if [[ ! -f "${IMG_PATH}" ]]; then
            echo "::error::❌ 编译失败，未找到 out/arch/arm64/boot/Image 内核文件"
            exit 1
          fi
          IMG_SIZE=$(du -h "${IMG_PATH}" | awk '{print $1}')
          echo "✅ 检测到内核镜像 Image | 大小: ${IMG_SIZE}"

          rm -rf "${TMP_DIR}"
          mkdir -p "${TMP_DIR}"

          AK3_DIR="${KERNEL_DIR}/Anykernel3"
          if [[ -d "${AK3_DIR}" && -f "${AK3_DIR}/anykernel.sh" ]]; then
            sed -i \
              -e 's/^name=.*/name="Star-HyperA16-NonGKI-Kernel"/' \
              -e 's/^do\.devicecheck=.*/do.devicecheck=0/' \
              -e 's/^IS_SLOT_DEVICE=.*/IS_SLOT_DEVICE=1/' \
              -e 's/^BLOCK=.*/BLOCK=boot/' \
              "${AK3_DIR}/anykernel.sh"
            curl -L https://raw.githubusercontent.com/zttlove/NonGKI_Kernel_Build_2nd/mainline/Patches/anykernel.sh -o Anykernel3/anykernel.sh
            chmod +x Anykernel3/anykernel.sh
          fi

          cp -v "${IMG_PATH}" "${TMP_DIR}/Image"

          if [[ "${{ env.PACK_KMODULES }}" == "true" ]]; then
            MOD_DIR="${TMP_DIR}/modules/vendor/lib/modules"
            mkdir -p "${MOD_DIR}"
            find . -name "*.ko" -type f -print0 | xargs -0 cp -t "${MOD_DIR}/" 2>/dev/null || true
            module_count=$(find "${MOD_DIR}" -name "*.ko" | wc -l)
            echo "📦 打包内核模块: ${module_count} 个"
            [[ ${module_count} -eq 0 ]] && rm -rf "${TMP_DIR}/modules"
          else
            echo "ℹ️ 已关闭模块打包，跳过ko文件"
          fi

          [[ -d "${AK3_DIR}" ]] && cp -rp "${AK3_DIR}"/* "${TMP_DIR}/"

          cd "${TMP_DIR}"
          7za a -tzip -mx9 -mmt=on package.zip ./* >/dev/null
          cd "${GITHUB_WORKSPACE}"

          FINAL_ZIP="${{ env.DEVICE_CODENAME }}-${{ env.ROM_TEXT }}-${TIME}-Ak3.zip"
          cp -fp "${TMP_DIR}/package.zip" "${FINAL_ZIP}"
          echo "PACK_NAME=${FINAL_ZIP}" >> "${GITHUB_ENV}"
          echo "✅ 刷机包打包完成: ${FINAL_ZIP}"

          rm -rf "${TMP_DIR}"

      - name: 🚀 Auto Upload To Github Release
        if: env.PACK_METHOD == 'Anykernel3'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: Star-HyperA16-Kernel-${{ github.run_number }}
          name: Xiaomi 11 Ultra Star HyperOS A16 NonGKI Kernel
          body: |
            ## Xiaomi 11 Ultra Star HyperOS A16 内核刷机包
            - 适配 HyperOS A16 全版本
            - ReSukiSU 35144 + SuSFS v2.1.0（源码内置）
            - NonGKI 通用免解boot补丁
            - Osm0sis Anykernel3 官方卡刷格式
          files: ${{ env.PACK_NAME }}
          draft: false
          prerelease: false
          overwrite_files: true
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
