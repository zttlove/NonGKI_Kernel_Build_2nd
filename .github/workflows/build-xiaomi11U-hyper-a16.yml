name: Build Xiaomi11U (hyper A16)

on:
  workflow_call:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  DEVICE_NAME: "xiaomi_11U"
  DEVICE_CODENAME: "star"

  CUSTOM_CMDS: "CLANG_TRIPLE=aarch64-linux-gnu-"
  EXTRA_CMDS: "LD=ld.lld LLVM=1 LLVM_IAS=1"
  KCFLAGS_EXTRA: "-Wframe-larger-than=4096 -Wno-strict-prototypes -Wno-unused-function -Wno-compare-distinct-pointer-types -Wno-void-pointer-to-int-cast -Wno-declaration-after-statement -fno-stack-protector -Wno-inline-asm -Wno-sometimes-uninitialized"

  KERNEL_SOURCE: "https://github.com/MiYume0721/android_kernel_xiaomi_sm8350_miyume.git"
  KERNEL_BRANCH: "main"

  CLANG_SOURCE: "https://github.com/AICP/prebuilts_clang_host_linux-x86.git"
  CLANG_BRANCH: "master"

  GCC_GNU: false
  GCC_64_SOURCE: "https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9.git"
  GCC_64_BRANCH: "android12L-release"
  GCC_32_SOURCE: "https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/arm/arm-linux-androideabi-4.9.git"
  GCC_32_BRANCH: "android12L-release"

  DEFCONFIG_SOURCE: ""
  DEFCONFIG_NAME: "star_defconfig"
  DEFCONFIG_ORIGIN_IMAGE: ""
  DEFCONFIG_FROM_BOOT: false

  KERNELSU_SOURCE: ""
  KERNELSU_BRANCH: ""
  KERNELSU_AUTO_GET: "true"
  KERNELSU_AUTO_FORK: "resukisu"

  SUSFS_ENABLE: "true"
  SUSFS_FIXED: "false"

  AK3_SOURCE: "https://github.com/osm0sis/Anykernel3.git"
  AK3_BRANCH: "master"

  BOOT_SOURCE: ""
  NEED_DTBO: false
  NEED_SAFE_DTBO: false
  ROM_TEXT: "Xiaomi11U-HyperA16"

  PYTHON_VERSION: "3"
  PACK_METHOD: "AnyKernel3"
  PACK_KMODULES: "false"

  KERNELSU_METHOD: "shell"
  KERNELSU_SUS_PATCH: "false"

  PATCHES_SOURCE: "JackA1ltman/NonGKI_Kernel_Patches"
  PATCHES_BRANCH: "mi_kernel"

  SUSFS_FOLDER_FIXED: "mi11_evox_a16"
  SUSFS_PATCH_FIXED: "susfs_fixed"

  REKERNEL_ENABLE: "false"
  HOOK_METHOD: "inline"
  KERNEL_PATCH: "false"

  KPM_ENABLE: "false"
  KPM_INLINE: "false"
  KPM_KPATCH_NEXT: "false"
  KPM_PATCH_SOURCE: "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU_patch/refs/heads/main/kpm/patch_linux"

  BASEBAND_GUARD_ENABLE: "false"
  BASEBAND_GUARD_BOOT: "false"
  HIDE_STUFF: "false"

  GENERATE_DTB: "false"
  GENERATE_CHIP: "qcom"

  BUILD_DEBUGGER: "false"
  SKIP_PATCH: "true"
  BUILD_OTHER_CONFIG: "false"
  MERGE_CONFIG_FILES: "vendor/venus_QGKI.config,vendor/xiaomi_QGKI.config"
  FREE_MORE_SPACE: "false"

jobs:
  build-kernel:
    name: Xiaomi11U (hyper A16)
    runs-on: ubuntu-latest
    env:
      CCACHE_COMPILERCHECK: "%compiler% -dumpmachine; %compiler% -dumpversion"
      CCACHE_NOHASHDIR: "true"
      CCACHE_HARDLINK: "true"

    steps:
      - name: ⏰ Checkout repository
        uses: actions/checkout@v6

      - name: ⌛️ Compilation environment preparation
        uses: ./.github/workflows/build-env

      - name: ⚙️ Get neccssary tools
        uses: ./.github/workflows/build-ready

      - name: 🔄 Reset kernel source to clean upstream main
        working-directory: device_kernel
        shell: bash
        run: |
          set -euo pipefail

          echo "=== 强制重置到上游 main 最新提交 ==="
          git remote -v
          git fetch origin main --depth=1
          git reset --hard origin/main
          git clean -fdx
          echo "=== 当前提交 ==="
          git log -1 --oneline

          echo "=== 检查源码自带 SUSFS 文件 ==="
          ls -la include/linux/susfs.h include/linux/susfs_def.h fs/susfs.c 2>/dev/null || echo "(SUSFS 文件缺失)"

      - name: 🩹 Extract v2.3.0 susfs.c / susfs.h / susfs_def.h from patch
        working-directory: device_kernel
        shell: bash
        run: |
          set -euo pipefail

          PATCH_URL="https://raw.githubusercontent.com/zttlove/NonGKI_Kernel_Build_2nd/mainline/susfs_patch_to_5.4.patch"
          PATCH_FILE="/tmp/susfs_patch_to_5.4.patch"

          echo "=== 下载 SUSFS 5.4 补丁（v2.3.0） ==="
          curl -L --fail --retry 3 --connect-timeout 15 -o "$PATCH_FILE" "$PATCH_URL"
          echo "[+] 补丁大小: $(wc -c < "$PATCH_FILE") 字节"

          mkdir -p include/linux fs

          extract_newfile() {
            local target="$1"
            local output="$2"
            awk -v target="$target" '
              /^diff --git / {
                in_target = ($0 ~ "b/" target "$")
                next
              }
              in_target && /^\+\+\+/ { next }
              in_target && /^\+/ { print substr($0, 2); next }
              in_target && /^ / { print substr($0, 2); next }
            ' "$PATCH_FILE" > "$output"
            echo "[+] $target → $output ($(wc -l < "$output") 行)"
          }

          extract_newfile "fs/susfs.c" "fs/susfs.c"
          extract_newfile "include/linux/susfs.h" "include/linux/susfs.h"
          extract_newfile "include/linux/susfs_def.h" "include/linux/susfs_def.h"

          echo "=== 提取后验证 ==="
          ls -la fs/susfs.c include/linux/susfs.h include/linux/susfs_def.h
          grep "SUSFS_VERSION" include/linux/susfs.h || true

      - name: 🩹 Ensure fs/Makefile for SUSFS (no Kconfig modification)
        working-directory: device_kernel
        shell: bash
        run: |
          set -euo pipefail

          if ! grep -q "susfs" fs/Makefile; then
            echo 'obj-$(CONFIG_KSU_SUSFS) += susfs.o' >> fs/Makefile
            echo "[+] fs/Makefile 已追加 susfs.o 引用"
          fi
          echo "=== fs/Makefile susfs 引用 ==="
          grep -n "susfs" fs/Makefile || echo "(无)"

          echo "=== 恢复 fs/Kconfig ==="
          curl -L --fail --retry 3 -o fs/Kconfig \
            "https://raw.githubusercontent.com/MiYume0721/android_kernel_xiaomi_sm8350_miyume/main/fs/Kconfig"
          echo "[+] fs/Kconfig 已恢复干净版本"

      - name: 🩹 Force enable SUSFS in defconfig
        working-directory: device_kernel
        shell: bash
        run: |
          set -euo pipefail

          DEFCONFIG="arch/arm64/configs/star_defconfig"

          if [ -n "$(tail -c 1 "$DEFCONFIG")" ]; then
            echo "" >> "$DEFCONFIG"
          fi

          sed -i '/^# CONFIG_KSU_SUSFS/d' "$DEFCONFIG"
          sed -i '/^CONFIG_KSU_SUSFS/d' "$DEFCONFIG"
          sed -i '/^# CONFIG_KSU_MANUAL_HOOK/d' "$DEFCONFIG"
          sed -i '/^CONFIG_KSU_MANUAL_HOOK/d' "$DEFCONFIG"

          if ! grep -q "^CONFIG_KSU=y" "$DEFCONFIG"; then
            echo "CONFIG_KSU=y" >> "$DEFCONFIG"
          fi

          {
            echo "CONFIG_KSU_SUSFS=y"
            echo "CONFIG_KSU_SUSFS_SUS_PATH=y"
            echo "CONFIG_KSU_SUSFS_SUS_MOUNT=y"
            echo "CONFIG_KSU_SUSFS_SUS_KSTAT=y"
            echo "CONFIG_KSU_SUSFS_SPOOF_UNAME=y"
            echo "CONFIG_KSU_SUSFS_ENABLE_LOG=y"
            echo "CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS=y"
            echo "CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG=y"
            echo "CONFIG_KSU_SUSFS_OPEN_REDIRECT=y"
            echo "CONFIG_KSU_SUSFS_SUS_MAP=y"
          } >> "$DEFCONFIG"

          echo "=== defconfig KSU/SUSFS 相关行 ==="
          grep -n "KSU\|SUSFS" "$DEFCONFIG" || echo "(无)"

      - name: 🧹 Cleanup unrelated .rej files
        working-directory: device_kernel
        shell: bash
        run: |
          set -euo pipefail
          find . -name "*.rej" -not -path "./.git/*" -delete 2>/dev/null || true
          echo "[+] 已清理所有 .rej 文件"

      - name: 🔧 Setup Clang to clang-custom
        shell: bash
        run: |
          set -euo pipefail
          DEST="$GITHUB_WORKSPACE/clang-custom"
          rm -rf "$DEST"
          git clone --depth=1 https://github.com/thenoppy12/clang-r416183b.git "$DEST"
          "$DEST/bin/clang" --version | head -1
          echo "✅ Clang 已就绪: $DEST/bin"

      - name: 🔎 Final source integrity check
        working-directory: device_kernel
        shell: bash
        run: |
          echo "=== SUSFS 文件 ==="
          ls -la fs/susfs.c include/linux/susfs.h include/linux/susfs_def.h
          echo ""
          echo "=== SUSFS 版本 ==="
          grep "SUSFS_VERSION" include/linux/susfs.h || echo "(无)"
          echo ""
          echo "=== fs/Makefile susfs 引用 ==="
          grep -n "susfs" fs/Makefile || echo "(无)"
          echo ""
          echo "=== susfs_def.h 中旧 API 兼容定义 ==="
          grep -n "susfs_is_current_proc_no_su\|susfs_set_current_proc_no_su\|susfs_clear_current_proc_no_su\|susfs_set_current_proc_umounted_for_zygote_next" include/linux/susfs_def.h || echo "(无)"
          echo ""
          echo "=== 残留 .rej 文件 ==="
          find . -name "*.rej" -not -path "./.git/*" 2>/dev/null | head -20 || echo "(无)"

      - name: 🔗 Patch for no-kprobe
        uses: ./.github/workflows/patch-no-kprobe

      - name: 🚀 Build Process
        uses: ./.github/workflows/build-process

      - name: 📦 Package Anykernel3 Flash Zip
        if: env.PACK_METHOD == 'AnyKernel3'
        shell: bash
        run: |
          set -euo pipefail
          TIME=$(TZ=Asia/Shanghai date +"%Y-%m-%d")
          KERNEL_DIR="${GITHUB_WORKSPACE}/device_kernel"
          TMP_DIR="${KERNEL_DIR}/tmp"
          IMG_PATH="${KERNEL_DIR}/out/arch/arm64/boot/Image"
          cd "${KERNEL_DIR}"

          [[ ! -f "${IMG_PATH}" ]] && { echo "::error::❌ 未找到 Image"; exit 1; }

          rm -rf "${TMP_DIR}"; mkdir -p "${TMP_DIR}"

          AK3_DIR="${KERNEL_DIR}/AnyKernel3"
          [[ -d "${AK3_DIR}" && -f "${AK3_DIR}/anykernel.sh" ]] && \
            sed -i -e 's/^name=.*/name="Star-HyperA16-NonGKI-Kernel"/' \
                   -e 's/^do\.devicecheck=.*/do.devicecheck=0/' \
                   -e 's/^IS_SLOT_DEVICE=.*/IS_SLOT_DEVICE=1/' \
                   -e 's/^BLOCK=.*/BLOCK=boot/' \
                   "${AK3_DIR}/anykernel.sh"

          cp -v "${IMG_PATH}" "${TMP_DIR}/Image"
          [[ -d "${AK3_DIR}" ]] && cp -rp "${AK3_DIR}"/* "${TMP_DIR}/"

          cd "${TMP_DIR}"
          7za a -tzip -mx9 -mmt=on package.zip ./* >/dev/null
          cd "${GITHUB_WORKSPACE}"

          FINAL_ZIP="${{ env.DEVICE_CODENAME }}-${{ env.ROM_TEXT }}-${TIME}-Ak3.zip"
          cp -fp "${TMP_DIR}/package.zip" "${FINAL_ZIP}"
          echo "PACK_NAME=${FINAL_ZIP}" >> "${GITHUB_ENV}"

      - name: 🚀 Auto Upload To Github Release
        if: env.PACK_METHOD == 'AnyKernel3'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: Star-HyperA16-Kernel-${{ github.run_number }}
          name: Xiaomi 11 Ultra Star HyperOS A16 NonGKI Kernel
          body: |
            ## Xiaomi 11 Ultra Star HyperOS A16
            - ReSukiSU + SuSFS 2.3.0（源码集成）
          files: ${{ env.PACK_NAME }}
          draft: false
          prerelease: false
          overwrite_files: true
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
