name: Build Xiaomi11U (hyper A16)

on:
  workflow_call:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  DEVICE_NAME: "xiaomi_11U"
  DEVICE_CODENAME: "star"

  CUSTOM_CMDS: "CLANG_TRIPLE=aarch64-linux-gnu-"
  EXTRA_CMDS: "LD=ld.lld LLVM=1 LLVM_IAS=1"
  KCFLAGS_EXTRA: "-Wframe-larger-than=4096 -Wno-strict-prototypes -Wno-unused-function -Wno-compare-distinct-pointer-types -Wno-void-pointer-to-int-cast -Wno-declaration-after-statement -fno-stack-protector"

  KERNEL_SOURCE: "https://github.com/MiYume0721/android_kernel_xiaomi_sm8350_miyume.git"
  KERNEL_BRANCH: "main"

  CLANG_SOURCE: "https://github.com/AICP/prebuilts_clang_host_linux-x86.git"
  CLANG_BRANCH: "master"

  GCC_GNU: false
  GCC_64_SOURCE: "https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9.git"
  GCC_64_BRANCH: "android12L-release"
  GCC_32_SOURCE: "https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/arm/arm-linux-androideabi-4.9.git"
  GCC_32_BRANCH: "android12L-release"

  DEFCONFIG_SOURCE: ""
  DEFCONFIG_NAME: "star_defconfig"
  DEFCONFIG_ORIGIN_IMAGE: ""
  DEFCONFIG_FROM_BOOT: false

  KERNELSU_SOURCE: ""
  KERNELSU_BRANCH: ""
  KERNELSU_AUTO_GET: "true"
  KERNELSU_AUTO_FORK: "resukisu"

  # 源码自带 SUSFS 2.1.0，启用 SUSFS 但关闭外部修补
  SUSFS_ENABLE: "true"
  SUSFS_FIXED: "false"

  AK3_SOURCE: "https://github.com/osm0sis/Anykernel3.git"
  AK3_BRANCH: "master"

  BOOT_SOURCE: ""
  NEED_DTBO: false
  NEED_SAFE_DTBO: false
  ROM_TEXT: "Xiaomi11U-HyperA16"

  PYTHON_VERSION: "3"
  PACK_METHOD: "AnyKernel3"
  PACK_KMODULES: "false"

  KERNELSU_METHOD: "shell"
  KERNELSU_SUS_PATCH: "false"

  PATCHES_SOURCE: "JackA1ltman/NonGKI_Kernel_Patches"
  PATCHES_BRANCH: "mi_kernel"

  SUSFS_FOLDER_FIXED: "mi11_evox_a16"
  SUSFS_PATCH_FIXED: "susfs_fixed"

  REKERNEL_ENABLE: "false"
  HOOK_METHOD: "manual"
  KERNEL_PATCH: "false"

  KPM_ENABLE: "false"
  KPM_INLINE: "false"
  KPM_KPATCH_NEXT: "false"
  KPM_PATCH_SOURCE: "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU_patch/refs/heads/main/kpm/patch_linux"

  BASEBAND_GUARD_ENABLE: "false"
  BASEBAND_GUARD_BOOT: "false"
  HIDE_STUFF: "false"

  GENERATE_DTB: "false"
  GENERATE_CHIP: "qcom"

  BUILD_DEBUGGER: "false"
  SKIP_PATCH: "false"
  BUILD_OTHER_CONFIG: "false"
  MERGE_CONFIG_FILES: "vendor/venus_QGKI.config,vendor/xiaomi_QGKI.config"
  FREE_MORE_SPACE: "false"

jobs:
  build-kernel:
    name: Xiaomi11U (hyper A16)
    runs-on: ubuntu-latest
    env:
      CCACHE_COMPILERCHECK: "%compiler% -dumpmachine; %compiler% -dumpversion"
      CCACHE_NOHASHDIR: "true"
      CCACHE_HARDLINK: "true"

    steps:
      - name: ⏰ Checkout repository
        uses: actions/checkout@v6

      - name: ⌛️ Compilation environment preparation
        uses: ./.github/workflows/build-env

      - name: ⚙️ Get neccssary tools
        uses: ./.github/workflows/build-ready

      - name: ⚙️ Ensure Manual Hook, SUSFS config and inject stat hooks
        working-directory: device_kernel
        shell: bash
        run: |
          set -euo pipefail

          # 1. 确保 defconfig 中启用了 Manual Hook 和 SUSFS
          if ! grep -q "CONFIG_KSU_MANUAL_HOOK=y" arch/arm64/configs/star_defconfig; then
            echo "CONFIG_KSU_MANUAL_HOOK=y" >> arch/arm64/configs/star_defconfig
            echo "[+] Added CONFIG_KSU_MANUAL_HOOK=y to star_defconfig"
          else
            echo "[*] CONFIG_KSU_MANUAL_HOOK=y already present"
          fi

          if ! grep -q "CONFIG_KSU_SUSFS=y" arch/arm64/configs/star_defconfig; then
            echo "CONFIG_KSU_SUSFS=y" >> arch/arm64/configs/star_defconfig
            echo "[+] Added CONFIG_KSU_SUSFS=y to star_defconfig"
          else
            echo "[*] CONFIG_KSU_SUSFS=y already present"
          fi

          # 2. 检查 SUSFS 源码是否存在
          echo "=== 检查 SUSFS 源码 ==="
          if [ -f "include/linux/susfs.h" ]; then
            grep "SUSFS_VERSION" include/linux/susfs.h || true
          else
            echo "[-] 警告：include/linux/susfs.h 不存在！源码可能没有 SUSFS 代码。"
          fi

          # 3. 确保 fs/stat.c 包含必要的头文件
          STAT_FILE="fs/stat.c"
          if ! grep -q "#include <linux/ksu.h>" "$STAT_FILE"; then
            sed -i '1i #include <linux/ksu.h>' "$STAT_FILE"
            echo "[+] Added #include <linux/ksu.h> to $STAT_FILE"
          else
            echo "[*] #include <linux/ksu.h> already present"
          fi

          # 4. 注入 ksu_handle_stat 到 SYSCALL_DEFINE4(newfstatat)
          if ! grep -q "ksu_handle_stat" "$STAT_FILE"; then
            echo "=== 注入 ksu_handle_stat 到 SYSCALL_DEFINE4(newfstatat) ==="
            awk '
              { line = $0 }
              line ~ /SYSCALL_DEFINE4\(newfstatat,/ && !in_func && !done {
                in_func = 1
                print "[*] 找到 SYSCALL_DEFINE4(newfstatat)，起始行: " NR > "/dev/stderr"
              }
              in_func {
                tmp = line
                brace += gsub(/\{/, "", tmp)
                tmp = line
                brace -= gsub(/\}/, "", tmp)
                if (!started && brace > 0) started = 1
                if (started && brace == 0) {
                  print "[*] newfstatat 函数结束行: " NR > "/dev/stderr"
                  in_func = 0
                  done = 1
                }
              }
              in_func && started && !inserted && line ~ /vfs_fstatat\(/ {
                print "\t#ifdef CONFIG_KSU_MANUAL_HOOK"
                print "\tksu_handle_stat(&dfd, &filename, &flag);"
                print "\t#endif"
                inserted = 1
                print "[*] 已插入 ksu_handle_stat，行号: " NR > "/dev/stderr"
              }
              { print line }
            ' "$STAT_FILE" > "${STAT_FILE}.tmp"
            if grep -q "ksu_handle_stat" "${STAT_FILE}.tmp"; then
              mv "${STAT_FILE}.tmp" "$STAT_FILE"
              echo "[+] ksu_handle_stat 注入成功"
            else
              echo "[-] ksu_handle_stat 注入失败，输出 newfstatat 函数体："
              awk '
                { line = $0 }
                line ~ /SYSCALL_DEFINE4\(newfstatat,/ && !in_func { in_func = 1 }
                in_func { print NR ": " line }
                in_func {
                  tmp = line
                  brace += gsub(/\{/, "", tmp)
                  tmp = line
                  brace -= gsub(/\}/, "", tmp)
                  if (!started && brace > 0) started = 1
                  if (started && brace == 0) exit
                }
              ' "$STAT_FILE"
              rm -f "${STAT_FILE}.tmp"
              exit 1
            fi
          else
            echo "[*] ksu_handle_stat 已存在，跳过"
          fi

          # 5. 注入 ksu_handle_newfstat_ret 到 SYSCALL_DEFINE2(newfstat)
          if ! grep -q "ksu_handle_newfstat_ret" "$STAT_FILE"; then
            echo "=== 注入 ksu_handle_newfstat_ret 到 SYSCALL_DEFINE2(newfstat) ==="
            awk '
              { line = $0 }
              line ~ /SYSCALL_DEFINE2\(newfstat,/ && !in_func && !done {
                in_func = 1
                print "[*] 找到 SYSCALL_DEFINE2(newfstat)，起始行: " NR > "/dev/stderr"
              }
              in_func {
                tmp = line
                brace += gsub(/\{/, "", tmp)
                tmp = line
                brace -= gsub(/\}/, "", tmp)
                if (!started && brace > 0) started = 1
                if (started && brace == 0) {
                  print "[*] newfstat 函数结束行: " NR > "/dev/stderr"
                  in_func = 0
                  done = 1
                }
              }
              in_func && started && !inserted && line ~ /return[ \t]+error;/ {
                print "\t#ifdef CONFIG_KSU_MANUAL_HOOK"
                print "\tksu_handle_newfstat_ret(&fd, &statbuf);"
                print "\t#endif"
                inserted = 1
                print "[*] 已插入 ksu_handle_newfstat_ret，行号: " NR > "/dev/stderr"
              }
              { print line }
            ' "$STAT_FILE" > "${STAT_FILE}.tmp"
            if grep -q "ksu_handle_newfstat_ret" "${STAT_FILE}.tmp"; then
              mv "${STAT_FILE}.tmp" "$STAT_FILE"
              echo "[+] ksu_handle_newfstat_ret 注入成功"
            else
              echo "[-] ksu_handle_newfstat_ret 注入失败，输出 newfstat 函数体："
              awk '
                { line = $0 }
                line ~ /SYSCALL_DEFINE2\(newfstat,/ && !in_func { in_func = 1 }
                in_func { print NR ": " line }
                in_func {
                  tmp = line
                  brace += gsub(/\{/, "", tmp)
                  tmp = line
                  brace -= gsub(/\}/, "", tmp)
                  if (!started && brace > 0) started = 1
                  if (started && brace == 0) exit
                }
              ' "$STAT_FILE"
              rm -f "${STAT_FILE}.tmp"
              exit 1
            fi
          else
            echo "[*] ksu_handle_newfstat_ret 已存在，跳过"
          fi

          # 6. 注入 ksu_handle_fstat64_ret 到 SYSCALL_DEFINE2(fstat64)
          if ! grep -q "ksu_handle_fstat64_ret" "$STAT_FILE"; then
            echo "=== 注入 ksu_handle_fstat64_ret 到 SYSCALL_DEFINE2(fstat64) ==="
            awk '
              { line = $0 }
              line ~ /SYSCALL_DEFINE2\(fstat64,/ && !in_func && !done {
                in_func = 1
                print "[*] 找到 SYSCALL_DEFINE2(fstat64)，起始行: " NR > "/dev/stderr"
              }
              in_func {
                tmp = line
                brace += gsub(/\{/, "", tmp)
                tmp = line
                brace -= gsub(/\}/, "", tmp)
                if (!started && brace > 0) started = 1
                if (started && brace == 0) {
                  print "[*] fstat64 函数结束行: " NR > "/dev/stderr"
                  in_func = 0
                  done = 1
                }
              }
              in_func && started && !inserted && line ~ /return[ \t]+error;/ {
                print "\t#ifdef CONFIG_KSU_MANUAL_HOOK"
                print "\tksu_handle_fstat64_ret(&fd, &statbuf);"
                print "\t#endif"
                inserted = 1
                print "[*] 已插入 ksu_handle_fstat64_ret，行号: " NR > "/dev/stderr"
              }
              { print line }
            ' "$STAT_FILE" > "${STAT_FILE}.tmp"
            if grep -q "ksu_handle_fstat64_ret" "${STAT_FILE}.tmp"; then
              mv "${STAT_FILE}.tmp" "$STAT_FILE"
              echo "[+] ksu_handle_fstat64_ret 注入成功"
            else
              echo "[-] ksu_handle_fstat64_ret 注入失败，输出 fstat64 函数体："
              awk '
                { line = $0 }
                line ~ /SYSCALL_DEFINE2\(fstat64,/ && !in_func { in_func = 1 }
                in_func { print NR ": " line }
                in_func {
                  tmp = line
                  brace += gsub(/\{/, "", tmp)
                  tmp = line
                  brace -= gsub(/\}/, "", tmp)
                  if (!started && brace > 0) started = 1
                  if (started && brace == 0) exit
                }
              ' "$STAT_FILE"
              rm -f "${STAT_FILE}.tmp"
              exit 1
            fi
          else
            echo "[*] ksu_handle_fstat64_ret 已存在，跳过"
          fi

          # 7. 最终验证
          echo "=== 最终验证 ==="
          grep -n -B2 -A2 "ksu_handle_stat" "$STAT_FILE" || true
          grep -n -B2 -A2 "ksu_handle_newfstat_ret" "$STAT_FILE" || true
          grep -n -B2 -A2 "ksu_handle_fstat64_ret" "$STAT_FILE" || true

      - name: 🔧 Setup Clang to clang-custom
        shell: bash
        run: |
          set -euo pipefail
          DEST="$GITHUB_WORKSPACE/clang-custom"
          rm -rf "$DEST"
          git clone --depth=1 https://github.com/thenoppy12/clang-r416183b.git "$DEST"
          "$DEST/bin/clang" --version | head -1
          echo "✅ Clang 已就绪: $DEST/bin"

      - name: 🔎 Verify source completeness
        working-directory: device_kernel
        run: |
          echo "=== SUSFS 版本 ==="
          grep "SUSFS_VERSION" include/linux/susfs.h || echo "(无)"
          echo "=== ReSukiSU 版本 ==="
          grep -rn "KSU_VERSION" drivers/kernelsu/ 2>/dev/null | head -3 || echo "(无)"
          echo "=== star_defconfig 存在 ==="
          ls -la arch/arm64/configs/star_defconfig 2>/dev/null || echo "(无)"
          echo "=== KSU hook 检查 ==="
          grep -c "ksu_handle_setresuid" kernel/sys.c || echo 0
          grep -c "ksu_handle_sys_read" fs/read_write.c || echo 0
          grep -c "ksu_handle_stat" fs/stat.c || echo 0
          grep -c "ksu_handle_newfstat_ret" fs/stat.c || echo 0
          grep -c "ksu_handle_fstat64_ret" fs/stat.c || echo 0
          echo "=== SUSFS 配置检查 ==="
          grep -c "CONFIG_KSU_SUSFS=y" arch/arm64/configs/star_defconfig || echo 0

      - name: 🔗 Patch for no-kprobe
        uses: ./.github/workflows/patch-no-kprobe

      - name: 🚀 Build Process
        uses: ./.github/workflows/build-process

      - name: 📦 Package Anykernel3 Flash Zip
        if: env.PACK_METHOD == 'AnyKernel3'
        shell: bash
        run: |
          set -euo pipefail
          TIME=$(TZ=Asia/Shanghai date +"%Y-%m-%d")
          KERNEL_DIR="${GITHUB_WORKSPACE}/device_kernel"
          TMP_DIR="${KERNEL_DIR}/tmp"
          IMG_PATH="${KERNEL_DIR}/out/arch/arm64/boot/Image"
          cd "${KERNEL_DIR}"

          [[ ! -f "${IMG_PATH}" ]] && { echo "::error::❌ 未找到 Image"; exit 1; }

          rm -rf "${TMP_DIR}"; mkdir -p "${TMP_DIR}"

          AK3_DIR="${KERNEL_DIR}/AnyKernel3"
          [[ -d "${AK3_DIR}" && -f "${AK3_DIR}/anykernel.sh" ]] && \
            sed -i -e 's/^name=.*/name="Star-HyperA16-NonGKI-Kernel"/' \
                   -e 's/^do\.devicecheck=.*/do.devicecheck=0/' \
                   -e 's/^IS_SLOT_DEVICE=.*/IS_SLOT_DEVICE=1/' \
                   -e 's/^BLOCK=.*/BLOCK=boot/' \
                   "${AK3_DIR}/anykernel.sh"

          cp -v "${IMG_PATH}" "${TMP_DIR}/Image"
          [[ -d "${AK3_DIR}" ]] && cp -rp "${AK3_DIR}"/* "${TMP_DIR}/"

          cd "${TMP_DIR}"
          7za a -tzip -mx9 -mmt=on package.zip ./* >/dev/null
          cd "${GITHUB_WORKSPACE}"

          FINAL_ZIP="${{ env.DEVICE_CODENAME }}-${{ env.ROM_TEXT }}-${TIME}-Ak3.zip"
          cp -fp "${TMP_DIR}/package.zip" "${FINAL_ZIP}"
          echo "PACK_NAME=${FINAL_ZIP}" >> "${GITHUB_ENV}"

      - name: 🚀 Auto Upload To Github Release
        if: env.PACK_METHOD == 'AnyKernel3'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: Star-HyperA16-Kernel-${{ github.run_number }}
          name: Xiaomi 11 Ultra Star HyperOS A16 NonGKI Kernel
          body: |
            ## Xiaomi 11 Ultra Star HyperOS A16
            - ReSukiSU + SuSFS 2.1.0（源码自带）
          files: ${{ env.PACK_NAME }}
          draft: false
          prerelease: false
          overwrite_files: true
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
