name: Build Xiaomi11U (hyper A16)

on:
  workflow_call:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  DEVICE_NAME: "xiaomi_11U"
  DEVICE_CODENAME: "star"

  CUSTOM_CMDS: "CLANG_TRIPLE=aarch64-linux-gnu-"
  EXTRA_CMDS: "LD=ld.lld LLVM=1 LLVM_IAS=1"
  KCFLAGS_EXTRA: "-Wframe-larger-than=4096 -Wno-strict-prototypes -Wno-unused-function -Wno-compare-distinct-pointer-types -Wno-void-pointer-to-int-cast -Wno-declaration-after-statement -fno-stack-protector -Wno-inline-asm -Wno-sometimes-uninitialized"

  KERNEL_SOURCE: "https://github.com/zttlove/android_kernel_xiaomi_sm8350_miyume.git"
  KERNEL_BRANCH: "main"
  KERNEL_VERSION: "5.4"
  KERNEL_ARCH: "arm64"

  CLANG_SOURCE: "https://github.com/llvm/llvm-project/releases/download/llvmorg-18.1.8/clang+llvm-18.1.8-x86_64-linux-gnu-ubuntu-18.04.tar.xz"
  CLANG_BRANCH: ""

  GCC_GNU: false
  GCC_64_SOURCE: "https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9.git"
  GCC_64_BRANCH: "android12L-release"
  GCC_32_SOURCE: "https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/arm/arm-linux-androideabi-4.9.git"
  GCC_32_BRANCH: "android12L-release"

  DEFCONFIG_SOURCE: ""
  DEFCONFIG_NAME: "star_defconfig"
  DEFCONFIG_ORIGIN_IMAGE: ""
  DEFCONFIG_FROM_BOOT: false

  KERNELSU_SOURCE: ""
  KERNELSU_BRANCH: ""
  KERNELSU_AUTO_GET: "true"
  KERNELSU_AUTO_FORK: "resukisu"

  SUSFS_ENABLE: "true"
  SUSFS_FIXED: "true"

  AK3_SOURCE: "https://github.com/osm0sis/Anykernel3.git"
  AK3_BRANCH: "master"

  BOOT_SOURCE: ""
  NEED_DTBO: false
  NEED_SAFE_DTBO: false
  ROM_TEXT: "Xiaomi11U-HyperA16"

  PYTHON_VERSION: "3"
  PACK_METHOD: "AnyKernel3"
  PACK_KMODULES: "false"

  KERNELSU_METHOD: "shell"
  KERNELSU_SUS_PATCH: "false"

  PATCHES_SOURCE: "JackA1ltman/NonGKI_Kernel_Patches"
  PATCHES_BRANCH: "mi_kernel"

  SUSFS_FOLDER_FIXED: "mi11_evox_a16"
  SUSFS_PATCH_FIXED: "susfs_fixed"

  REKERNEL_ENABLE: "false"
  HOOK_METHOD: "syscall"
  KERNEL_PATCH: "false"

  KPM_ENABLE: "false"
  KPM_INLINE: "false"
  KPM_KPATCH_NEXT: "false"
  KPM_PATCH_SOURCE: "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU_patch/refs/heads/main/kpm/patch_linux"

  BASEBAND_GUARD_ENABLE: "false"
  BASEBAND_GUARD_BOOT: "false"
  HIDE_STUFF: "false"

  GENERATE_DTB: "false"
  GENERATE_CHIP: "qcom"

  BUILD_DEBUGGER: "true"
  SKIP_PATCH: "false"
  BUILD_OTHER_CONFIG: "false"
  MERGE_CONFIG_FILES: "vendor/venus_QGKI.config,vendor/xiaomi_QGKI.config"
  FREE_MORE_SPACE: "false"

jobs:
  build-kernel:
    name: Xiaomi11U (hyper A16)
    runs-on: ubuntu-latest
    env:
      CCACHE_COMPILERCHECK: "%compiler% -dumpmachine; %compiler% -dumpversion"
      CCACHE_NOHASHDIR: "true"
      CCACHE_HARDLINK: "true"

    steps:
      - name: ⏰ Checkout repository
        uses: actions/checkout@v6

      - name: ⌛️ Compilation environment preparation
        uses: ./.github/workflows/build-env

      - name: ⚙️ Get neccssary tools
        uses: ./.github/workflows/build-ready

      - name: 🪝 Patch Kernel of SUSFS
        uses: ./.github/workflows/patch-susfs

      - name: 🩹 Restore broken files if patched incompletely
        working-directory: device_kernel
        shell: bash
        run: |
          set -euo pipefail

          SUSFS_BASE="https://raw.githubusercontent.com/zttlove/android_kernel_xiaomi_sm8350_miyume/main"

          # ========== 1. fs/proc/task_mmu.c ==========
          if [ -f "fs/proc/task_mmu.c.rej" ]; then
            echo "[-] fs/proc/task_mmu.c 存在 .rej，从上游恢复"
            curl -L --fail --retry 3 -o fs/proc/task_mmu.c "$SUSFS_BASE/fs/proc/task_mmu.c"
            rm -f fs/proc/task_mmu.c.rej
            echo "[+] 已恢复 fs/proc/task_mmu.c"
          else
            echo "[*] fs/proc/task_mmu.c 无 .rej，保留补丁结果"
          fi

          # ========== 2. fs/notify/fdinfo.c ==========
          echo "=== 检查 fs/notify/fdinfo.c ==="
          FDINFO_BROKEN=false
          if [ -f "fs/notify/fdinfo.c.rej" ]; then
            echo "[-] 存在 fs/notify/fdinfo.c.rej"
            FDINFO_BROKEN=true
          fi
          if ! grep -q "static void show_fdinfo" fs/notify/fdinfo.c; then
            echo "[-] fs/notify/fdinfo.c 缺少 show_fdinfo 函数头"
            FDINFO_BROKEN=true
          fi
          if ! grep -q "static void inotify_fdinfo" fs/notify/fdinfo.c; then
            echo "[-] fs/notify/fdinfo.c 缺少 inotify_fdinfo 函数头"
            FDINFO_BROKEN=true
          fi

          if [ "$FDINFO_BROKEN" = "true" ]; then
            echo "[-] fs/notify/fdinfo.c 结构被破坏，从上游恢复"
            curl -L --fail --retry 3 -o fs/notify/fdinfo.c "$SUSFS_BASE/fs/notify/fdinfo.c"
            rm -f fs/notify/fdinfo.c.rej
            echo "[+] 已恢复 fs/notify/fdinfo.c"
          else
            echo "[*] fs/notify/fdinfo.c 结构正常"
          fi

          # ========== 3. 清理所有残留 .rej ==========
          find . -name "*.rej" -not -path "./.git/*" -delete 2>/dev/null || true
          echo "[+] 已清理所有 .rej 文件"

          # ========== 4. 恢复后验证 ==========
          echo ""
          echo "=== 恢复后检查 ==="
          echo "--- fs/notify/fdinfo.c 关键函数 ---"
          grep -n "static void show_fdinfo\|static void inotify_fdinfo\|inotify_show_fdinfo" fs/notify/fdinfo.c || echo "(无)"
          echo "--- fs/notify/fdinfo.c #if/#endif ---"
          echo "if=$(grep -c '^#if' fs/notify/fdinfo.c) endif=$(grep -c '^#endif' fs/notify/fdinfo.c)"
          echo "--- fs/proc/task_mmu.c #if/#endif ---"
          echo "if=$(grep -c '^#if' fs/proc/task_mmu.c) endif=$(grep -c '^#endif' fs/proc/task_mmu.c)"

      - name: 🔎 Final source integrity check
        working-directory: device_kernel
        shell: bash
        run: |
          echo "=== SUSFS 文件 ==="
          ls -la fs/susfs.c include/linux/susfs.h include/linux/susfs_def.h
          echo ""
          echo "=== SUSFS 版本 ==="
          grep "SUSFS_VERSION" include/linux/susfs.h || echo "(无)"
          echo ""
          echo "=== fs/Makefile susfs 引用 ==="
          grep -n "susfs" fs/Makefile || echo "(无)"
          echo ""
          echo "=== 各文件的 SUSFS 挂钩数量 ==="
          for f in fs/namei.c fs/namespace.c fs/notify/fdinfo.c fs/proc/fd.c fs/proc/task_mmu.c fs/proc_namespace.c fs/readdir.c fs/stat.c fs/statfs.c kernel/kallsyms.c kernel/sys.c mm/memory.c security/selinux/avc.c; do
            if [ -f "$f" ]; then
              IF_COUNT=$(grep -c '^#if' "$f" 2>/dev/null | head -1)
              ENDIF_COUNT=$(grep -c '^#endif' "$f" 2>/dev/null | head -1)
              SUSFS_COUNT=$(grep -c "CONFIG_KSU_SUSFS" "$f" 2>/dev/null | head -1)
              STATUS="OK"
              [ "$IF_COUNT" != "$ENDIF_COUNT" ] && STATUS="BAD"
              echo "$STATUS $f: #if=$IF_COUNT, #endif=$ENDIF_COUNT, SUSFS=$SUSFS_COUNT"
            fi
          done
          echo ""
          echo "=== 残留 .rej 文件 ==="
          find . -name "*.rej" -not -path "./.git/*" 2>/dev/null || echo "(无)"

      - name: 🔗 Patch for no-kprobe
        uses: ./.github/workflows/patch-no-kprobe

      - name: 🚀 Build Process
        uses: ./.github/workflows/build-process

      - name: 📦 Package Anykernel3 Flash Zip
        if: env.PACK_METHOD == 'AnyKernel3'
        shell: bash
        run: |
          set -euo pipefail
          TIME=$(TZ=Asia/Shanghai date +"%Y-%m-%d")
          KERNEL_DIR="${GITHUB_WORKSPACE}/device_kernel"
          TMP_DIR="${KERNEL_DIR}/tmp"
          IMG_PATH="${KERNEL_DIR}/out/arch/arm64/boot/Image"
          cd "${KERNEL_DIR}"

          [[ ! -f "${IMG_PATH}" ]] && { echo "::error::❌ 未找到 Image"; exit 1; }

          rm -rf "${TMP_DIR}"; mkdir -p "${TMP_DIR}"

          AK3_DIR="${KERNEL_DIR}/AnyKernel3"
          [[ -d "${AK3_DIR}" && -f "${AK3_DIR}/anykernel.sh" ]] && \
            sed -i -e 's/^name=.*/name="Star-HyperA16-NonGKI-Kernel"/' \
                   -e 's/^do\.devicecheck=.*/do.devicecheck=0/' \
                   -e 's/^IS_SLOT_DEVICE=.*/IS_SLOT_DEVICE=1/' \
                   -e 's/^BLOCK=.*/BLOCK=boot/' \
                   "${AK3_DIR}/anykernel.sh"

          cp -v "${IMG_PATH}" "${TMP_DIR}/Image"
          [[ -d "${AK3_DIR}" ]] && cp -rp "${AK3_DIR}"/* "${TMP_DIR}/"

          cd "${TMP_DIR}"
          7za a -tzip -mx9 -mmt=on package.zip ./* >/dev/null
          cd "${GITHUB_WORKSPACE}"

          FINAL_ZIP="${{ env.DEVICE_CODENAME }}-${{ env.ROM_TEXT }}-${TIME}-Ak3.zip"
          cp -fp "${TMP_DIR}/package.zip" "${FINAL_ZIP}"
          echo "PACK_NAME=${FINAL_ZIP}" >> "${GITHUB_ENV}"

      - name: 🚀 Auto Upload To Github Release
        if: env.PACK_METHOD == 'AnyKernel3'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: Star-HyperA16-Kernel-${{ github.run_number }}
          name: Xiaomi 11 Ultra Star HyperOS A16 NonGKI Kernel
          body: |
            ## Xiaomi 11 Ultra Star HyperOS A16
            - ReSukiSU + SuSFS 2.3.0（源码集成）
          files: ${{ env.PACK_NAME }}
          draft: false
          prerelease: false
          overwrite_files: true
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
