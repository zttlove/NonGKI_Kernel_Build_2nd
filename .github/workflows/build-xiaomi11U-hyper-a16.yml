name: Build Xiaomi11U (hyper A16)

on:
  workflow_call:
  workflow_dispatch:

env:
  # Device env
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  DEVICE_NAME: "xiaomi_11U"
  DEVICE_CODENAME: "star"

  CUSTOM_CMDS: "CLANG_TRIPLE=aarch64-linux-gnu-"
  EXTRA_CMDS: "LD=ld.lld LLVM=1 LLVM_IAS=1 LLVM=$(pwd)/clang-r416183b/bin/"
  KCFLAGS_EXTRA: "-Wframe-larger-than=4096 -Wno-strict-prototypes -Wno-align-mismatch -Wno-unused-function -Wno-compare-distinct-pointer-types -Wno-void-pointer-to-int-cast -Wno-array-parameter -Wno-declaration-after-statement -fno-stack-protector"

  KERNEL_SOURCE: "https://github.com/zttlove/android_kernel_xiaomi_sm8350_miyume.git"
  KERNEL_BRANCH: "fox-boot-clean"

  CLANG_SOURCE: "https://github.com/AICP/prebuilts_clang_host_linux-x86.git"
  CLANG_BRANCH: "master"

  GCC_GNU: false
  GCC_64_SOURCE: "https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9.git"
  GCC_64_BRANCH: "android12L-release"
  GCC_32_SOURCE: "https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/arm/arm-linux-androideabi-4.9.git"
  GCC_32_BRANCH: "android12L-release"

  DEFCONFIG_SOURCE: ""
  DEFCONFIG_NAME: "star_defconfig"
  DEFCONFIG_ORIGIN_IMAGE: ""
  DEFCONFIG_FROM_BOOT: false

  KERNELSU_SOURCE: ""
  KERNELSU_BRANCH: ""

  KERNELSU_AUTO_GET: "true"
  KERNELSU_AUTO_FORK: "resukisu"

  SUSFS_ENABLE: true
  SUSFS_FIXED: true

  AK3_SOURCE: "https://github.com/osm0sis/Anykernel3.git"
  AK3_BRANCH: "master"

  BOOT_SOURCE: ""
  NEED_DTBO: false
  NEED_SAFE_DTBO: false
  ROM_TEXT: "Xiaomi11U-HyperA16"

  PYTHON_VERSION: "3"
  PACK_METHOD: "Anykernel3"
  PACK_KMODULES: "false"

  KERNELSU_METHOD: "shell"
  KERNELSU_SUS_PATCH: "false"

  PATCHES_SOURCE: "JackA1ltman/NonGKI_Kernel_Patches"
  PATCHES_BRANCH: "mi_kernel"

  SUSFS_FOLDER_FIXED: "mi11_evox_a16"
  SUSFS_PATCH_FIXED: "susfs_fixed"

  REKERNEL_ENABLE: "false"
  HOOK_METHOD: "syscall"
  KERNEL_PATCH: "false"

  KPM_ENABLE: "false"
  KPM_INLINE: "false"
  KPM_KPATCH_NEXT: "false"
  KPM_PATCH_SOURCE: "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU_patch/refs/heads/main/kpm/patch_linux"

  BASEBAND_GUARD_ENABLE: "false"
  BASEBAND_GUARD_BOOT: "false"
  HIDE_STUFF: "false"

  GENERATE_DTB: "false"
  GENERATE_CHIP: "qcom"

  BUILD_DEBUGGER: "false"
  SKIP_PATCH: "false"
  BUILD_OTHER_CONFIG: "false"
  MERGE_CONFIG_FILES: "vendor/venus_QGKI.config,vendor/xiaomi_QGKI.config"
  FREE_MORE_SPACE: "false"

jobs:
  build-kernel:
    name: Xiaomi11U (hyper A16)
    runs-on: ubuntu-latest
    env:
      CCACHE_COMPILERCHECK: "%compiler% -dumpmachine; %compiler% -dumpversion"
      CCACHE_NOHASHDIR: "true"
      CCACHE_HARDLINK: "true"

    steps:
      - name: ⏰ Checkout repository
        uses: actions/checkout@v6

      - name: ⌛️ Compilation environment preparation
        uses: ./.github/workflows/build-env

      - name: ⚙️ Get neccssary tools
        uses: ./.github/workflows/build-ready

      - name: 🪝 Patch Kernel of SUSFS
        uses: ./.github/workflows/patch-susfs

      - name: 🔍 Diagnose fs/namespace.c damage
        working-directory: device_kernel
        shell: bash
        run: |
          echo "=== 150~230 行 ==="
          sed -n '150,230p' fs/namespace.c
          echo ""
          echo "=== 未匹配的 #ifdef / #endif 检查 ==="
          grep -c "#ifdef CONFIG_KSU_SUSFS" fs/namespace.c || echo 0
          grep -c "#endif" fs/namespace.c || echo 0
          echo ""
          echo "=== susfs_ 残留 ==="
          grep -n "susfs_" fs/namespace.c | head -20

      - name: ♻️ Drop SUSFS patches on fs/namespace.c
        working-directory: device_kernel
        shell: bash
        run: |
          set -euo pipefail

          echo "=== 丢弃 patch 对 fs/namespace.c 的修改 ==="
          git checkout -- fs/namespace.c
          rm -f fs/namespace.c.rej

          echo ""
          echo "=== 恢复后 susfs_ 出现次数（期望 0）==="
          grep -c "susfs_" fs/namespace.c || echo 0

          echo ""
          echo "=== 确认 mnt_alloc_group_id 结构完整 ==="
          sed -n '/^static int mnt_alloc_group_id/,/^}/p' fs/namespace.c

          echo ""
          echo "=== 确认 susfs_alloc_* 没被误引入 ==="
          grep -c "susfs_alloc" fs/namespace.c || echo 0
          echo "（期望 0）"

      - name: 🔧 Remove orphan #ifdef fragments before alloc_vfsmnt
        working-directory: device_kernel
        shell: bash
        run: |
          set -euo pipefail

          echo "=== 修复前，mnt_get_count 到 alloc_vfsmnt ==="
          sed -n '145,240p' fs/namespace.c

          python3 - <<'PYEOF'
          import sys

          path = "fs/namespace.c"
          with open(path) as f:
              content = f.read()

          # 定位 mnt_get_count 结束的 }
          marker1 = "int mnt_get_count(struct mount *mnt)"
          start = content.find(marker1)
          if start == -1:
              print("::error::找不到 mnt_get_count")
              sys.exit(1)

          end_pattern = "return mnt->mnt_count;\n#endif\n}"
          end1 = content.find(end_pattern, start)
          if end1 == -1:
              print("::error::找不到 mnt_get_count 结束位置")
              sys.exit(1)
          end1 += len(end_pattern)

          # 定位 alloc_vfsmnt 开头
          marker2 = "static struct mount *alloc_vfsmnt"
          start2 = content.find(marker2, end1)
          if start2 == -1:
              print("::error::找不到 alloc_vfsmnt")
              sys.exit(1)

          # 检查中间是否确实有孤儿片段
          middle = content[end1:start2]
          if "#ifdef CONFIG_SMP" not in middle:
              print("[+] 中间没有孤儿片段，无需修复")
              sys.exit(0)

          print(f"[+] 中间有 {middle.count('#ifdef CONFIG_SMP')} 个 #ifdef CONFIG_SMP 孤儿片段，删除中")

          # 删除中间内容，保留一个空行
          new_content = content[:end1] + "\n\n" + content[start2:]

          with open(path, "w") as f:
              f.write(new_content)

          print("[+] 孤儿片段已删除，alloc_vfsmnt 保持原样")
          PYEOF

          echo ""
          echo "=== 修复后，mnt_get_count 到 alloc_vfsmnt ==="
          sed -n '145,230p' fs/namespace.c

          echo ""
          echo "=== 确认 alloc_vfsmnt 结构完整 ==="
          sed -n '/^static struct mount \*alloc_vfsmnt/,/^}/p' fs/namespace.c
          
      - name: 🔧 Fix broken mnt_alloc_group_id
        working-directory: device_kernel
        shell: bash
        run: |
          set -euo pipefail

          echo "=== 当前 mnt_alloc_group_id ==="
          sed -n '/^static int mnt_alloc_group_id/,/^}/p' fs/namespace.c

          # 检查 res 是否已声明
          if sed -n '/^static int mnt_alloc_group_id/,/^}/p' fs/namespace.c | grep -q "int res"; then
            echo "[+] 已有 res 声明，跳过"
            exit 0
          fi

          echo "[+] 缺失 res 声明，正在修复"

          python3 - <<'PYEOF'
          import re

          with open("fs/namespace.c") as f:
              content = f.read()

          # 在 mnt_alloc_group_id 函数体的第一个 "if (res < 0)" 前插入 res 声明
          pattern = r'(static int mnt_alloc_group_id\(struct mount \*mnt\)\s*\{\s*\n)(\s*)(if \(res < 0\))'
          replacement = r'\1\tint res = ida_alloc_min(&mnt_group_ida, 1, GFP_KERNEL);\n\n\2\3'

          new_content, n = re.subn(pattern, replacement, content, count=1)
          if n != 1:
              print(f"::error::匹配失败 (n={n})，请手动检查")
              raise SystemExit(1)

          with open("fs/namespace.c", "w") as f:
              f.write(new_content)

          print("[+] 修复成功")
          PYEOF

          echo ""
          echo "=== 修复后 ==="
          sed -n '/^static int mnt_alloc_group_id/,/^}/p' fs/namespace.c

      - name: 🔧 Append missing SUSFS mount helpers to fs/susfs.c
        working-directory: device_kernel
        shell: bash
        run: |
          set -euo pipefail

          # 检查是否已经存在
          if grep -q "^int susfs_get_non_sus_mnt_id_from_mnt" fs/susfs.c; then
            echo "[+] fs/susfs.c 里已有定义，跳过"
            exit 0
          fi

          echo "[+] 向 fs/susfs.c 末尾追加两个 helper 函数"

          cat >> fs/susfs.c <<'EOF'

          /* - To retrieve the non sus mnt_id from mount */
          int susfs_get_non_sus_mnt_id_from_mnt(struct mount *orig_mnt) {
          struct mount *mnt = orig_mnt;
          int mnt_id;

          if (mnt->mnt_id < DEFAULT_KSU_MNT_ID)
          return mnt->mnt_id;
          lock_mount_hash();
          for (; mnt && mnt->mnt_parent && mnt != mnt->mnt_parent && mnt->mnt_id >= DEFAULT_KSU_MNT_ID; mnt = mnt->mnt_parent) { }
          mnt_id = mnt->mnt_id;
          unlock_mount_hash();
          return mnt_id;
          }
          /* - To retrieve the non sus vfsmount from vfsmount, takes a reference on &mnt->mnt and mnt->mnt.mnt_root */
          struct vfsmount *susfs_get_non_sus_vfsmnt_from_vfsmnt(struct vfsmount *vfsmnt) {
          struct mount *mnt = real_mount(vfsmnt);

          if (mnt->mnt_id < DEFAULT_KSU_MNT_ID) {
          mntget(&mnt->mnt);
          dget(mnt->mnt.mnt_root);
          return &mnt->mnt;
          }
          lock_mount_hash();
          for (; mnt && mnt->mnt_parent && mnt != mnt->mnt_parent && mnt->mnt_id >= DEFAULT_KSU_MNT_ID; mnt = mnt->mnt_parent) { }
          mntget(&mnt->mnt);
          if (!mnt->mnt.mnt_root || IS_ERR(mnt->mnt.mnt_root)) {
          mntput(&mnt->mnt);
          unlock_mount_hash();
          return vfsmnt;
          }
          dget(mnt->mnt.mnt_root);
          unlock_mount_hash();
          return &mnt->mnt;
          }
          EOF

          echo ""
          echo "=== 验证 ==="
          grep -n "^int susfs_get_non_sus_mnt_id_from_mnt\|^struct vfsmount \*susfs_get_non_sus_vfsmnt_from_vfsmnt" fs/susfs.c

      - name: 🔧 Fix missing SUSFS includes (proc_namespace, statfs, proc_fd)
        working-directory: device_kernel
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PYEOF'
          import sys

          # (path, marker, add, check_pattern)
          fixes = [
            (
              "fs/proc_namespace.c",
              "#include <linux/sched/task.h>\n",
              "#ifdef CONFIG_KSU_SUSFS_SUS_MOUNT\n#include <linux/susfs_def.h>\n#endif\n",
              "linux/susfs_def.h",
            ),
            (
              "fs/proc_namespace.c",
              '#include "internal.h"\n',
              '''
              #ifdef CONFIG_KSU_SUSFS_SUS_MOUNT
              extern bool susfs_is_current_ksu_domain(void);
              extern struct static_key_false susfs_is_hide_sus_mnts_for_non_su_procs_enabled;
              #endif
              ''',
              "extern bool susfs_is_current_ksu_domain",
            ),
            (
              "fs/statfs.c",
              "#include <linux/compat.h>\n",
              "#ifdef CONFIG_KSU_SUSFS\n#include <linux/susfs_def.h>\n#include \"mount.h\"\n#endif\n",
              "linux/susfs_def.h",
            ),
            (
              "fs/proc/fd.c",
              "#include <linux/proc_fs.h>\n",
              "#ifdef CONFIG_KSU_SUSFS\n#include <linux/susfs_def.h>\n#endif\n",
              "linux/susfs_def.h",
            ),
          ]

          for path, marker, add, check in fixes:
              with open(path) as f:
                  content = f.read()

              if check in content:
                  print(f"[+] {path}: 已有 {check}，跳过")
                  continue

              if marker not in content:
                  print(f"::warning::{path} 找不到锚点，跳过")
                  continue

              content = content.replace(marker, marker + add, 1)
              with open(path, "w") as f:
                  f.write(content)
              print(f"[+] {path}: 已补 {check}")

          print("[+] 全部修复完成")
          PYEOF

          echo ""
          echo "=== 验证 extern 声明 ==="
          grep -n "susfs_is_current_ksu_domain\|susfs_is_hide_sus_mnts_for_non_su_procs_enabled" fs/proc_namespace.c || echo "❌ 未找到"
          
      - name: 🔎 Check namespace functions used elsewhere
        working-directory: device_kernel
        shell: bash
        run: |
          echo "=== 谁引用了 susfs_get_non_sus_* ==="
          grep -rn "susfs_get_non_sus_mnt_id_from_mnt\|susfs_get_non_sus_vfsmnt_from_vfsmnt" \
            fs/ include/ --include="*.c" --include="*.h" | grep -v "namespace.c" || echo "(无)"

      - name: 🔎 Check failed hunks coverage
        working-directory: device_kernel
        run: |
          echo "=== namespace.c ==="
          grep -c "susfs_get_non_sus_mnt_id_from_mnt\|VFSMOUNT_MNT_FLAGS_KSU_UNSHARED_MNT" fs/namespace.c || echo 0
          echo "=== proc/fd.c ==="
          grep -c "susfs_get_non_sus_mnt_id_from_mnt\|susfs_is_inode_sus_kstat" fs/proc/fd.c || echo 0
          echo "=== task_mmu.c ==="
          grep -c "struct vm_area_struct \*vma" fs/proc/task_mmu.c || echo 0
          echo "=== kernel/sys.c ==="
          grep -c "susfs_spoof_uname" kernel/sys.c || echo 0
          echo "=== stat.c ==="
          grep -c "susfs_sus_kstat_spoof_generic_fillattr" fs/stat.c || echo 0
          echo "=== statfs.c ==="
          grep -c "susfs_statfs_by_dentry\|susfs_get_non_sus_vfsmnt" fs/statfs.c || echo 0
          echo "=== proc_namespace.c ==="
          grep -c "susfs_show_vfsmnt\|susfs_is_hide_sus_mnts" fs/proc_namespace.c || echo 0
          echo "=== readdir.c ==="
          grep -c "susfs_is_inode_sus_path" fs/readdir.c || echo 0

      - name: 🔗 Patch for no-kprobe
        uses: ./.github/workflows/patch-no-kprobe

      - name: 🪛 Extra Kernel Options
        run: |
          cd "$GITHUB_WORKSPACE/device_kernel"

      - name: 🧰 Patch Kernel of Re:Kernel
        uses: ./.github/workflows/patch-rekernel

      - name: 🔒 Patch Kernel of Baseband Guard
        uses: ./.github/workflows/patch-baseband-guard

      - name: 🔧 Patch Hide Stuff
        uses: ./.github/workflows/patch-hide-stuff

      - name: 🔎 Check cpufreq API in 5.4
        shell: bash
        run: |
          cd $GITHUB_WORKSPACE/device_kernel
          echo "=== cpufreq_table_find_index_* in cpufreq.h ==="
          grep -n "cpufreq_table_find_index" include/linux/cpufreq.h || echo "NOT FOUND"
          echo ""
          echo "=== cpufreq_frequency_table_target ==="
          grep -rn "cpufreq_frequency_table_target" include/ drivers/cpufreq/*.c 2>/dev/null | head -5 || echo "NOT FOUND ANYWHERE"
          echo ""
          echo "=== signature of verify for reference ==="
          sed -n '695,705p' include/linux/cpufreq.h

      - name: 🚀 Build Process
        uses: ./.github/workflows/build-process

      # 打包Anykernel3 仅Image内核专用
      - name: 📦 Package Anykernel3 Flash Zip
        if: env.PACK_METHOD == 'Anykernel3'
        shell: bash
        run: |
          set -euo pipefail
          echo "============================================="
          echo "📦 开始打包 Star Hyper A16 内核卡刷包"
          echo "============================================="

          TIME=$(TZ=Asia/Shanghai date +"%Y-%m-%d")
          KERNEL_DIR="${GITHUB_WORKSPACE}/device_kernel"
          TMP_DIR="${KERNEL_DIR}/tmp"
          IMG_PATH="${KERNEL_DIR}/out/arch/arm64/boot/Image"
          cd "${KERNEL_DIR}"

          # 严格校验内核文件存在
          if [[ ! -f "${IMG_PATH}" ]]; then
            echo "::error::❌ 编译失败，未找到 out/arch/arm64/boot/Image 内核文件"
            exit 1
          fi
          IMG_SIZE=$(du -h "${IMG_PATH}" | awk '{print $1}')
          echo "✅ 检测到内核镜像 Image | 大小: ${IMG_SIZE}"

          # 清理重建临时目录
          rm -rf "${TMP_DIR}"
          mkdir -p "${TMP_DIR}"

          # 自动修改Anykernel3机型适配参数
          AK3_DIR="${KERNEL_DIR}/Anykernel3"
          if [[ -d "${AK3_DIR}" && -f "${AK3_DIR}/anykernel.sh" ]]; then
            sed -i \
              -e 's/^name=.*/name="Star-HyperA16-NonGKI-Kernel"/' \
              -e 's/^do\.devicecheck=.*/do.devicecheck=0/' \
              -e 's/^IS_SLOT_DEVICE=.*/IS_SLOT_DEVICE=1/' \
              -e 's/^BLOCK=.*/BLOCK=boot/' \
              "${AK3_DIR}/anykernel.sh"
            curl -L https://raw.githubusercontent.com/zttlove/NonGKI_Kernel_Build_2nd/mainline/Patches/anykernel.sh -o Anykernel3/anykernel.sh
            chmod +x Anykernel3/anykernel.sh
          fi

          # 复制内核主镜像
          cp -v "${IMG_PATH}" "${TMP_DIR}/Image"

          # 按需打包内核模块
          if [[ "${{ env.PACK_KMODULES }}" == "true" ]]; then
            MOD_DIR="${TMP_DIR}/modules/vendor/lib/modules"
            mkdir -p "${MOD_DIR}"
            find . -name "*.ko" -type f -print0 | xargs -0 cp -t "${MOD_DIR}/" 2>/dev/null || true
            module_count=$(find "${MOD_DIR}" -name "*.ko" | wc -l)
            echo "📦 打包内核模块: ${module_count} 个"
            [[ ${module_count} -eq 0 ]] && rm -rf "${TMP_DIR}/modules"
          else
            echo "ℹ️ 已关闭模块打包，跳过ko文件"
          fi

          # 合并Anykernel3刷机脚本全部文件
          [[ -d "${AK3_DIR}" ]] && cp -rp "${AK3_DIR}"/* "${TMP_DIR}/"

          # 最高压缩率打包ZIP
          cd "${TMP_DIR}"
          7za a -tzip -mx9 -mmt=on package.zip ./* >/dev/null
          cd "${GITHUB_WORKSPACE}"

          # 生成唯一不重复文件名
          FINAL_ZIP="${{ env.DEVICE_CODENAME }}-${{ env.ROM_TEXT }}-${TIME}-Ak3.zip"
          cp -fp "${TMP_DIR}/package.zip" "${FINAL_ZIP}"
          echo "PACK_NAME=${FINAL_ZIP}" >> "${GITHUB_ENV}"
          echo "✅ 刷机包打包完成: ${FINAL_ZIP}"

          # 彻底清理临时垃圾文件
          rm -rf "${TMP_DIR}"

      # 自动发布到GitHub Releases页面（动态标签永不重复报错）
      - name: 🚀 Auto Upload To Github Release
        if: env.PACK_METHOD == 'Anykernel3'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: Star-HyperA16-Kernel-${{ github.run_number }}
          name: Xiaomi 11 Ultra Star HyperOS A16 NonGKI Kernel #构建号#${{ github.run_number }}
          body: |
            ## Xiaomi 11 Ultra Star HyperOS A16 内核刷机包
            - 适配 HyperOS A16 全版本
            - SukiSU ResukiSU Root 完整适配
            - SUSFS 隐藏文件系统免补丁
            - NonGKI 通用免解boot补丁
            - Osm0sis Anykernel3 官方卡刷格式
            - Clang 12 编译
          files: ${{ env.PACK_NAME }}
          draft: false
          prerelease: false
          overwrite_files: true
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
