name: Build Kernel (5.4) with AnyKernel3 (O=out)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  TZ: Asia/Shanghai
  DEVICE_NAME: "xiaomi_11U"
  DEVICE_CODENAME: "star"
  KERNEL_ARCH: "arm64"
  # 只保留 owner/repo 格式
  KERNEL_REPO: "zttlove/android_kernel_xiaomi_sm8350_miyume"
  KERNEL_BRANCH: "main"
  
  CLANG_SOURCE: "https://github.com/llvm/llvm-project/releases/download/llvmorg-18.1.8/clang+llvm-18.1.8-x86_64-linux-gnu-ubuntu-18.04.tar.xz"
  DEFCONFIG_NAME: "star_defconfig"
  OUTPUT_DIR: "out"
  
  # 添加缺失的变量
  PACK_METHOD: "Anykernel3"
  PACK_KMODULES: "false"
  ROM_TEXT: "HyperA17"

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Kernel Source
        uses: actions/checkout@v4
        with:
          repository: ${{ env.KERNEL_REPO }}
          ref: ${{ env.KERNEL_BRANCH }}
          path: kernel
          submodules: true

      - name: Install Dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            bc bison flex libelf-dev libssl-dev \
            make python3 device-tree-compiler git curl xz-utils \
            libtinfo5 ccache

      - name: Fix KernelSU Submodule (Use Official ReSukiSU)
        working-directory: kernel
        run: |
          echo "========================================="
          echo "🔧 Fixing KernelSU submodule"
          echo "========================================="
    
          # 直接删除旧目录，保证全新拉取
          rm -rf KernelSU
    
          # 从官方仓库克隆最新代码
          echo "📥 Cloning Official ReSukiSU (latest)..."
          git clone --depth=1 https://github.com/ReSukiSU/ReSukiSU.git KernelSU
    
          # 验证并显示版本信息（用于确认更新成功）
          if [ -f "KernelSU/kernel/Makefile" ]; then
            echo "✅ ReSukiSU cloned successfully"
            echo "📋 Version info:"
            grep -E "VERSION_CODE|VERSION_NAME" KernelSU/kernel/Makefile || true
          else
            echo "❌ Failed to clone ReSukiSU"
            exit 1
          fi
    
          echo "✅ ReSukiSU submodule fixed"

      - name: Integrate ReSukiSU
        working-directory: kernel
        run: |
          set -e
          echo "========================================="
          echo "🔧 Integrating ReSukiSU"
          echo "========================================="
          
          # 下载并运行 ReSukiSU setup
          echo "📥 Downloading ReSukiSU setup script..."
          curl -LSs "https://raw.githubusercontent.com/ReSukiSU/ReSukiSU/main/kernel/setup.sh" -o /tmp/setup.sh
          chmod +x /tmp/setup.sh
          
          echo "🚀 Running ReSukiSU integration..."
          bash /tmp/setup.sh main
          
          rm -f /tmp/setup.sh
          
          echo "========================================="
          echo "✅ ReSukiSU integration completed!"
          echo "========================================="

      - name: Fix ReSukiSU hooks
        working-directory: kernel
        run: |
          echo "========================================="
          echo "🔧 Fixing ReSukiSU hooks"
          echo "========================================="
    
          # 1. 移除之前添加的 stub（如果存在）
          echo "📌 Removing manual stub from fs/stat.c..."
          if [ -f "fs/stat.c" ]; then
            # 使用 sed 删除添加的 stub 部分
            sed -i '/^#ifdef CONFIG_KSU$/,/^#endif$/d' fs/stat.c
            # 或者恢复备份
            if [ -f "fs/stat.c.bak" ]; then
              mv fs/stat.c.bak fs/stat.c
              echo "✅ Restored fs/stat.c from backup"
            else
              echo "⚠️ No backup found, manual cleanup may be needed"
            fi
          fi
    
          # 2. 清空检查文件内容（而不是删除）
          echo "🔧 Disabling hook checks by clearing content..."
          if [ -f "KernelSU/kernel/tools/manual_hook_check.mk" ]; then
            echo "# Disabled" > KernelSU/kernel/tools/manual_hook_check.mk
            echo "✅ manual_hook_check.mk cleared"
          else
            # 如果文件不存在，创建一个空的
            mkdir -p KernelSU/kernel/tools
            echo "# Disabled" > KernelSU/kernel/tools/manual_hook_check.mk
            echo "✅ manual_hook_check.mk created as empty"
          fi
    
          if [ -f "KernelSU/kernel/tools/DoCheckII.mk" ]; then
            echo "# Disabled" > KernelSU/kernel/tools/DoCheckII.mk
            echo "✅ DoCheckII.mk cleared"
          fi
    
          echo "✅ All fixes applied"

      - name: Enable KernelSU in defconfig
        working-directory: kernel
        run: |
          echo "🔧 Enabling KernelSU in defconfig..."
          
          cp arch/arm64/configs/${{ env.DEFCONFIG_NAME }} arch/arm64/configs/${{ env.DEFCONFIG_NAME }}.bak
          
          echo "CONFIG_KSU=y" >> arch/arm64/configs/${{ env.DEFCONFIG_NAME }}
          echo "CONFIG_KSU_MANUAL_HOOK=y" >> arch/arm64/configs/${{ env.DEFCONFIG_NAME }}
          echo "CONFIG_KSU_DEBUG=y" >> arch/arm64/configs/${{ env.DEFCONFIG_NAME }}
          echo "CONFIG_KPROBES=y" >> arch/arm64/configs/${{ env.DEFCONFIG_NAME }}
          echo "CONFIG_HAVE_KPROBES=y" >> arch/arm64/configs/${{ env.DEFCONFIG_NAME }}
          echo "CONFIG_KPROBE_EVENTS=y" >> arch/arm64/configs/${{ env.DEFCONFIG_NAME }}
          
          echo "✅ Defconfig updated"

      - name: Download Clang
        run: |
          echo "📥 Downloading Clang..."
          curl -L --retry 3 --retry-delay 5 -o clang.tar.xz "${{ env.CLANG_SOURCE }}"
          
          if [ ! -s clang.tar.xz ]; then
            echo "❌ Failed to download Clang"
            exit 1
          fi
          
          mkdir -p clang
          tar -xf clang.tar.xz -C clang --strip-components=1
          
          if [ ! -f "clang/bin/clang" ]; then
            echo "❌ Clang binary not found!"
            exit 1
          fi
          
          clang/bin/clang --version
          echo "$(pwd)/clang/bin" >> $GITHUB_PATH

      - name: Setup CCache
        run: |
          mkdir -p ~/.ccache
          echo "CCACHE_DIR=~/.ccache" >> $GITHUB_ENV
          ccache -M 2G

      - name: Build Kernel
        working-directory: kernel
        run: |
          set -e
          echo "🚀 Starting kernel build..."
          
          export ARCH=${{ env.KERNEL_ARCH }}
          export LLVM=1
          export LLVM_IAS=1
          export LD=ld.lld
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export CC=clang
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          
          echo "📝 Configuring kernel..."
          make -j$(nproc --all) ARCH=arm64 LLVM=1 LLVM_IAS=1 O=${{ env.OUTPUT_DIR }} ${{ env.DEFCONFIG_NAME }}
          
          echo "🔨 Building kernel..."
          make -j$(nproc --all) ARCH=arm64 LLVM=1 LLVM_IAS=1 O=${{ env.OUTPUT_DIR }}
          
          if [ -f "${{ env.OUTPUT_DIR }}/arch/arm64/boot/Image" ]; then
            echo "✅ Kernel built successfully!"
          else
            echo "❌ Kernel build failed"
            exit 1
          fi

      - name: List boot directory
        run: ls -la kernel/${{ env.OUTPUT_DIR }}/arch/arm64/boot/

      - name: Prepare AnyKernel3
        run: git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git anykernel3

      - name: Setup AnyKernel3
        working-directory: anykernel3
        run: |
          # 直接修改，不需要备份
          sed -i 's/kernel.string=.*/kernel.string=Xiaomi 11 Ultra (star) Kernel/' anykernel.sh
          sed -i 's/do.devicecheck=.*/do.devicecheck=1/' anykernel.sh
          sed -i 's/device.name1=.*/device.name1=star/' anykernel.sh
          sed -i 's/device.name2=.*/device.name2=xiaomi11ultra/' anykernel.sh
          sed -i 's/do.modules=.*/do.modules=0/' anykernel.sh
          sed -i 's/do.systemless=.*/do.systemless=1/' anykernel.sh
          sed -i 's/do.cleanup=.*/do.cleanup=1/' anykernel.sh
          sed -i 's/^BLOCK=.*/BLOCK=\/dev\/block\/by-name\/boot;/' anykernel.sh
          sed -i 's/^IS_SLOT_DEVICE=.*/IS_SLOT_DEVICE=1;/' anykernel.sh

      - name: Copy Kernel Image
        run: |
          cd kernel/${{ env.OUTPUT_DIR }}/arch/arm64/boot/
          if [ -f Image.gz-dtb ]; then
            cp Image.gz-dtb ../../../../../anykernel3/Image
          elif [ -f Image.gz ]; then
            cp Image.gz ../../../../../anykernel3/Image
          elif [ -f Image ]; then
            cp Image ../../../../../anykernel3/Image
          else
            echo "❌ No kernel image found!"
            exit 1
          fi

      # 打包Anykernel3 仅Image内核专用
      - name: 📦 Package Anykernel3 Flash Zip
        if: env.PACK_METHOD == 'Anykernel3'
        shell: bash
        run: |
          set -euo pipefail
          echo "============================================="
          echo "📦 开始打包 Star Hyper A16 内核卡刷包"
          echo "============================================="

          TIME=$(TZ=Asia/Shanghai date +"%Y-%m-%d")
          KERNEL_DIR="${GITHUB_WORKSPACE}/kernel"
          TMP_DIR="${KERNEL_DIR}/tmp"
          IMG_PATH="${KERNEL_DIR}/${OUTPUT_DIR}/arch/arm64/boot/Image"
          cd "${KERNEL_DIR}"

          # 严格校验内核文件存在
          if [[ ! -f "${IMG_PATH}" ]]; then
            echo "::error::❌ 编译失败，未找到 ${OUTPUT_DIR}/arch/arm64/boot/Image 内核文件"
            exit 1
          fi
          IMG_SIZE=$(du -h "${IMG_PATH}" | awk '{print $1}')
          echo "✅ 检测到内核镜像 Image | 大小: ${IMG_SIZE}"

          # 清理重建临时目录
          rm -rf "${TMP_DIR}"
          mkdir -p "${TMP_DIR}"

          # 复制 AnyKernel3 文件
          AK3_DIR="${GITHUB_WORKSPACE}/anykernel3"
          if [[ -d "${AK3_DIR}" ]]; then
            cp -rp "${AK3_DIR}"/* "${TMP_DIR}/"
            echo "✅ AnyKernel3 文件已复制"
          else
            echo "::error::❌ AnyKernel3 目录不存在"
            exit 1
          fi

          # 复制内核主镜像
          cp -v "${IMG_PATH}" "${TMP_DIR}/Image"

          # 按需打包内核模块（仅在需要时）
          if [[ "${{ env.PACK_KMODULES }}" == "true" ]]; then
            MOD_DIR="${TMP_DIR}/modules/vendor/lib/modules"
            mkdir -p "${MOD_DIR}"
            # 只搜索内核源码目录中的 .ko 文件
            find "${KERNEL_DIR}" -name "*.ko" -type f -print0 | xargs -0 -r cp -t "${MOD_DIR}/" 2>/dev/null || true
            module_count=$(find "${MOD_DIR}" -name "*.ko" | wc -l)
            echo "📦 打包内核模块: ${module_count} 个"
            if [[ ${module_count} -eq 0 ]]; then
              rm -rf "${TMP_DIR}/modules"
              echo "ℹ️ 未找到模块文件，移除 modules 目录"
            fi
          else
            echo "ℹ️ 已关闭模块打包，跳过 ko 文件"
          fi

          # 最高压缩率打包 ZIP
          cd "${TMP_DIR}"
          7za a -tzip -mx9 -mmt=on package.zip ./* >/dev/null
          cd "${GITHUB_WORKSPACE}"

          # 生成唯一不重复文件名
          FINAL_ZIP="${{ env.DEVICE_CODENAME }}-${{ env.ROM_TEXT }}-${TIME}-Ak3.zip"
          cp -fp "${TMP_DIR}/package.zip" "${FINAL_ZIP}"
          echo "PACK_NAME=${FINAL_ZIP}" >> "${GITHUB_ENV}"
          echo "✅ 刷机包打包完成: ${FINAL_ZIP}"

          # 彻底清理临时垃圾文件
          rm -rf "${TMP_DIR}"

      # 自动发布到GitHub Releases页面（动态标签永不重复报错）
      - name: 🚀 Auto Upload To Github Release
        if: env.PACK_METHOD == 'Anykernel3'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: Star-HyperA17-Kernel-${{ github.run_number }}
          name: Xiaomi 11 Ultra Star HyperOS A17 NonGKI Kernel #构建号#${{ github.run_number }}
          body: |
            ## Xiaomi 11 Ultra Star HyperOS A17 内核刷机包
            - 适配 HyperOS A17 全版本
            - SukiSU ResukiSU Root 完整适配
            - SUSFS 隐藏文件系统免补丁
            - NonGKI 通用免解boot补丁
            - Osm0sis Anykernel3 官方卡刷格式
            - Clang 18 最新编译
          files: ${{ env.PACK_NAME }}
          draft: false
          prerelease: false
          overwrite: true
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
