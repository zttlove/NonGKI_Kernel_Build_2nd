name: Build Kernel (5.4) with AnyKernel3 (O=out)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  TZ: Asia/Shanghai
  DEVICE_NAME: "xiaomi_11U"
  DEVICE_CODENAME: "star"
  KERNEL_ARCH: "arm64"
  KERNEL_REPO: "zttlove/android_kernel_xiaomi_sm8350_miyume"
  KERNEL_BRANCH: "main"
  CLANG_SOURCE: "https://github.com/llvm/llvm-project/releases/download/llvmorg-18.1.8/clang+llvm-18.1.8-x86_64-linux-gnu-ubuntu-18.04.tar.xz"
  DEFCONFIG_NAME: "star_defconfig"
  OUTPUT_DIR: "out"

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Kernel Source
        uses: actions/checkout@v4
        with:
          repository: ${{ env.KERNEL_REPO }}
          ref: ${{ env.KERNEL_BRANCH }}
          path: kernel
          submodules: true

      - name: Install Dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            bc bison flex libelf-dev libssl-dev \
            make python3 device-tree-compiler git curl xz-utils \
            libtinfo5

      - name: Integrate ReSukiSU
        working-directory: kernel
        run: |
          curl -LSs "https://raw.githubusercontent.com/ReSukiSU/ReSukiSU/main/kernel/setup.sh" | bash -s main

      - name: Apply SUSFS patch
        if: env.SUSFS_ENABLE == 'true'
        run: |
          cd ${GITHUB_WORKSPACE}/device_kernel
          if [ -f "kernel/susfs_patch_to_5.4.patch" ]; then
          echo "📌 Applying SUSFS patch..."
          cd kernel
          patch -p1 < susfs_patch_to_5.4.patch || echo "⚠️ Patch may already be applied"
          else
          echo "⚠️ SUSFS patch not found"
          fi

      - name: Enable ReSukiSU in defconfig
        working-directory: kernel
        run: |
          echo "CONFIG_KSU=y" >> arch/arm64/configs/${{ env.DEFCONFIG_NAME }}
          echo "CONFIG_KSU_MANUAL_HOOK=y" >> arch/arm64/configs/${{ env.DEFCONFIG_NAME }}
          echo "CONFIG_KPROBES=y" >> arch/arm64/configs/${{ env.DEFCONFIG_NAME }}

      - name: Download Clang
        run: |
          curl -L -o clang.tar.xz "${{ env.CLANG_SOURCE }}"
          mkdir -p clang
          tar -xf clang.tar.xz -C clang --strip-components=1
          echo "$(pwd)/clang/bin" >> $GITHUB_PATH

      - name: Build Kernel
        working-directory: kernel
        run: |
          set -e
          export ARCH=${{ env.KERNEL_ARCH }}
          export LLVM=1
          export LLVM_IAS=1
          export LD=ld.lld
          export CLANG_TRIPLE=aarch64-linux-gnu-
          make -j$(nproc --all) ARCH=arm64 LLVM=1 LLVM_IAS=1 O=${{ env.OUTPUT_DIR }} ${{ env.DEFCONFIG_NAME }}
          make -j$(nproc --all) ARCH=arm64 LLVM=1 LLVM_IAS=1 O=${{ env.OUTPUT_DIR }} modules Image

      - name: List boot directory
        run: ls -la kernel/${{ env.OUTPUT_DIR }}/arch/arm64/boot/

      - name: Prepare AnyKernel3
        run: git clone https://github.com/osm0sis/AnyKernel3.git anykernel3

      - name: Setup AnyKernel3
        working-directory: anykernel3
        run: |
          sed -i 's/kernel.string=.*/kernel.string=MyKernel for Xiaomi 11 Ultra (star)/' anykernel.sh
          sed -i 's/do.devicecheck=.*/do.devicecheck=1/' anykernel.sh
          sed -i 's/device.name1=.*/device.name1=star/' anykernel.sh
          sed -i 's/device.name2=.*/device.name2=/' anykernel.sh
          sed -i 's/device.name3=.*/device.name3=/' anykernel.sh
          sed -i 's/device.name4=.*/device.name4=/' anykernel.sh
          sed -i 's/do.modules=.*/do.modules=0/' anykernel.sh
          sed -i 's/do.systemless=.*/do.systemless=1/' anykernel.sh
          sed -i 's/do.cleanup=.*/do.cleanup=1/' anykernel.sh
          sed -i 's/^BLOCK=.*/BLOCK=\/dev\/block\/by-name\/boot;/' anykernel.sh
          sed -i 's/^IS_SLOT_DEVICE=.*/IS_SLOT_DEVICE=1;/' anykernel.sh
          sed -i 's/^RAMDISK_COMPRESSION=.*/RAMDISK_COMPRESSION=auto;/' anykernel.sh
          sed -i 's/^PATCH_VBMETA_FLAG=.*/PATCH_VBMETA_FLAG=auto;/' anykernel.sh

      - name: Copy Kernel Image
        run: |
          set -e
          cd kernel/${{ env.OUTPUT_DIR }}/arch/arm64/boot/
          if [ -f Image.gz-dtb ]; then
            cp Image.gz-dtb ../../../../../anykernel3/Image
          elif [ -f Image.gz ]; then
            cp Image.gz ../../../../../anykernel3/Image
          elif [ -f Image ]; then
            cp Image ../../../../../anykernel3/Image
          else
            echo "No kernel image found!" && exit 1
          fi

      - name: Create AnyKernel3 Zip
        working-directory: anykernel3
        run: |
          zip -r9 ../AnyKernel3-star-$(date +%Y%m%d-%H%M%S).zip * -x .git README.md *placeholder

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kernel-output
          path: |
            kernel/${{ env.OUTPUT_DIR }}/arch/arm64/boot/Image
            kernel/${{ env.OUTPUT_DIR }}/arch/arm64/boot/Image.gz
            kernel/${{ env.OUTPUT_DIR }}/arch/arm64/boot/Image.gz-dtb
            kernel/${{ env.OUTPUT_DIR }}/arch/arm64/boot/dts/**/*.dtb
            AnyKernel3-star-*.zip
