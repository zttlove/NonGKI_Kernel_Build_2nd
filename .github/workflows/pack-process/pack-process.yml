name: Xiaomi11U 内核自动构建&Release
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PACK_METHOD: Anykernel3
  AK3_SOURCE: osm0sis
  PACK_KMODULES: true

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: 拉取仓库代码
        uses: actions/checkout@v4

      - name: 克隆 Anykernel3
        run: git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git Anykernel3

      - name: 打包 Anykernel3 刷机包
        run: |
          ROOT="$GITHUB_WORKSPACE"
          IMAGE_DIR="$ROOT/out/arch/arm64/boot"
          
          rm -rf tmp && mkdir -p tmp
          
          # 修改 AK3 配置
          sed -i 's/ExampleKernel by osm0sis @ xda-developers/NonGKI Kernel Build/g' Anykernel3/anykernel.sh
          sed -i 's/do.devicecheck=1/do.devicecheck=0/g' Anykernel3/anykernel.sh
          sed -i 's/device.name1=.*/device.name1=star/g' Anykernel3/anykernel.sh
          sed -i 's/IS_SLOT_DEVICE=0;/IS_SLOT_DEVICE=1;/g' Anykernel3/anykernel.sh
          sed -i 's/BLOCK=auto;/BLOCK=boot;/g' Anykernel3/anykernel.sh
          
          # 确保文件存在
          mkdir -p "$IMAGE_DIR"
          touch "$IMAGE_DIR/Image.gz"
          
          # 复制内核
          [ -f "$IMAGE_DIR/Image.gz-dtb" ] && cp "$IMAGE_DIR/Image.gz-dtb" tmp/
          [ -f "$IMAGE_DIR/Image.gz" ] && cp "$IMAGE_DIR/Image.gz" tmp/
          
          # 复制模块
          mkdir -p tmp/modules/vendor/lib/modules
          find "$ROOT/out/" -name "*.ko" -exec cp {} tmp/modules/vendor/lib/modules/ \; 2>/dev/null
          
          cp -rp Anykernel3/* tmp/
          
          # 打包
          ZIP="AK3-ReSukiSU-${{ github.run_number }}-star.zip"
          cd tmp && 7za a -mx9 -tzip "$ROOT/$ZIP" ./*
          echo "PACK_NAME=$ZIP" >> "$GITHUB_ENV"

      - name: 上传包
        uses: actions/upload-artifact@v4
        with:
          name: Kernel
          path: ${{ env.PACK_NAME }}

  release:
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/download-artifact@v4
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: Build-${{ github.run_number }}
          name: Build-${{ github.run_number }}
          files: ./*.zip
          make_latest: true
