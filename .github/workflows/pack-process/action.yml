name: Xiaomi11U 内核自动构建&Release
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# 全局只保留纯静态、不依赖任何上下文的环境变量
env:
  PACK_METHOD: Anykernel3
  AK3_SOURCE: osm0sis/AnyKernel3
  PACK_KMODULES: true
  DEVICE_CODENAME: star

jobs:
  build:
    runs-on: ubuntu-22.04
    # 将依赖动态值的变量移到这里定义
    env:
      KERNEL_SOURCE_DIR: ${{ github.workspace }}/out/arch/arm64/boot
      FINAL_ZIP_NAME: AK3-ReSukiSU-${{ github.run_number }}-${{ env.DEVICE_CODENAME }}.zip
    steps:
      - name: 🛠️ 拉取仓库代码
        uses: actions/checkout@v4

      - name: 📦 安装依赖
        run: sudo apt update && sudo apt install -y p7zip-full

      - name: 📥 克隆 Anykernel3
        run: |
          git clone --depth=1 https://github.com/${{ env.AK3_SOURCE }}.git Anykernel3
          if [ ! -d "Anykernel3" ]; then
            echo "❌ 克隆 AnyKernel3 失败"
            exit 1
          fi

      - name: 📜 准备内核文件
        run: |
          mkdir -p tmp/modules/vendor/lib/modules

          # 检查并复制内核镜像 (Image.gz 或 Image.gz-dtb)
          if [ -f "${{ env.KERNEL_SOURCE_DIR }}/Image.gz-dtb" ]; then
            cp "${{ env.KERNEL_SOURCE_DIR }}/Image.gz-dtb" tmp/
          elif [ -f "${{ env.KERNEL_SOURCE_DIR }}/Image.gz" ]; then
            cp "${{ env.KERNEL_SOURCE_DIR }}/Image.gz" tmp/
          else
            echo "❌ 未找到内核镜像文件 (Image.gz 或 Image.gz-dtb)"
            exit 1
          fi

          # 复制模块文件
          find ${{ github.workspace }}/out/ -name "*.ko" -exec cp {} tmp/modules/vendor/lib/modules/ \; 2>/dev/null

      - name: 📦 配置 & 打包 Anykernel3
        run: |
          # 修改 Anykernel3 配置文件
          sed -i "s/ExampleKernel.*/NonGKI Kernel Build/g" Anykernel3/anykernel.sh
          sed -i "s/do.devicecheck=.*/do.devicecheck=0/g" Anykernel3/anykernel.sh
          sed -i "s/device.name1=.*/device.name1=${{ env.DEVICE_CODENAME }}/g" Anykernel3/anykernel.sh
          sed -i "s/IS_SLOT_DEVICE=.*/IS_SLOT_DEVICE=1;/g" Anykernel3/anykernel.sh
          sed -i "s/BLOCK=.*/BLOCK=boot;/g" Anykernel3/anykernel.sh
          # 增加 vbmeta 标志位自动修复，防止启动循环
          sed -i "/BLOCK=boot;/a PATCH_VBMETA_FLAG=auto;" Anykernel3/anykernel.sh

          # 复制配置文件到临时目录
          cp -rp Anykernel3/* tmp/

          # 使用 7za 进行打包
          cd tmp && 7za a -mx9 -tzip "${{ env.FINAL_ZIP_NAME }}" ./*
          # 将生成的文件移回工作区根目录以便上传
          mv "${{ env.FINAL_ZIP_NAME }}" ..

      - name: 📤 上传包
        uses: actions/upload-artifact@v4
        with:
          name: Kernel
          path: ${{ env.FINAL_ZIP_NAME }}

  release:
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - name: 📥 下载构建产物
        uses: actions/download-artifact@v4
        with:
          name: Kernel

      - name: 🚀 创建 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: Build-${{ github.run_number }}
          name: Release Build ${{ github.run_number }}
          body: "自动构建的内核包 #${{ github.run_number }}"
          files: ./*.zip
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
