name: 'Pack Process.'

runs:
  using: 'composite'
  steps:
      - name: Make Anykernel3 Flasher
        if: env.PACK_METHOD == 'Anykernel3'
        shell: bash
        run: |
          set -e
          TIME=$(date +"%Y%m%d%H%M%S")
          cd "${GITHUB_WORKSPACE}/device_kernel/"

          # 架构判断
          if [[ -d "arch/arm64/configs" ]]; then
            IMAGE_DIR="${GITHUB_WORKSPACE}/device_kernel/out/arch/arm64/boot"
          else
            IMAGE_DIR="${GITHUB_WORKSPACE}/device_kernel/out/arch/arm/boot"
          fi

          # 清理并创建目录
          rm -rf tmp AnyKernel3
          mkdir -p tmp AnyKernel3

          # 下载 AnyKernel3 脚本
          wget --no-cache --no-check-certificate -O AnyKernel3/anykernel.sh \
            https://raw.githubusercontent.com/zttlove/NonGKI_Kernel_Build_2nd/mainline/Patches/anykernel.sh
          chmod +x AnyKernel3/anykernel.sh
          echo "✅ Now using custom Anykernel3."

          # 复制内核镜像
          if [[ -f "${IMAGE_DIR}/Image.gz-dtb" ]]; then
            cp -fp "${IMAGE_DIR}/Image.gz-dtb" tmp/
            echo "✅ Found Image.gz-dtb !"
          elif [[ -f "${IMAGE_DIR}/Image.gz" ]]; then
            cp -fp "${IMAGE_DIR}/Image.gz" tmp/
            echo "✅ Found Image.gz !"
          elif [[ -f "${IMAGE_DIR}/zImage-dtb" ]]; then
            cp -fp "${IMAGE_DIR}/zImage-dtb" tmp/
            echo "✅ Found zImage-dtb (ARMV7A) !"
          elif [[ -f "${IMAGE_DIR}/Image" ]]; then
            cp -fp "${IMAGE_DIR}/Image" tmp/
            echo "✅ Found Image !"
          fi

          # DTBO
          if [[ -f "${IMAGE_DIR}/dtbo.img" ]]; then
            cp -fp "${IMAGE_DIR}/dtbo.img" tmp/
            echo "✅ Found dtbo.img !"
          else
            echo "ℹ️ Doesn't found dtbo.img! Your device maybe needn't the file."
          fi

          # DTB.img
          if [[ -f "${IMAGE_DIR}/dtb.img" ]]; then
            cp -fp "${IMAGE_DIR}/dtb.img" tmp/
            echo "✅ Found dtb.img !"
          else
            echo "ℹ️ Doesn't found dtb.img! Your device maybe needn't the file."
          fi

          # 合并 DTB
          if [ -f "${IMAGE_DIR}/dtb" ]; then
            echo "✅ Found DTB!"
            cp -fp "${IMAGE_DIR}/dtb" tmp/
          elif [ "${{ env.GENERATE_DTB }}" == "true" ]; then
            if ls "${IMAGE_DIR}/dts/${{ env.GENERATE_CHIP }}"/*.dtb 1>/dev/null 2>&1; then
                DTB_PATH="dts"
            elif ls "${IMAGE_DIR}/dts/vendor/${{ env.GENERATE_CHIP }}"/*.dtb 1>/dev/null 2>&1; then
                DTB_PATH="dts/vendor"
            else
                echo "❌ Not found dts, abort."
                exit 1
            fi

            cat "${IMAGE_DIR}/${DTB_PATH}/${{ env.GENERATE_CHIP }}"/*.dtb > "${IMAGE_DIR}/DTB"
            cp -fp "${IMAGE_DIR}/DTB" tmp/
            echo "✅ Generated ${{ env.GENERATE_CHIP }} DTB."
          else
            echo "ℹ️ Doesn't found DTB! Your device maybe needn't the file."
          fi

          # 打包内核模块
          if [ "${{ env.PACK_KMODULES }}" == "true" ]; then
            echo "📦 Packing kernel modules (.ko)..."
            mkdir -p tmp/modules/vendor/lib/modules
            find "${GITHUB_WORKSPACE}/device_kernel/out/" -name "*.ko" -exec cp -fp {} tmp/modules/vendor/lib/modules/ \;
            
            if [ -n "$(ls -A tmp/modules/vendor/lib/modules/ 2>/dev/null)" ]; then
              echo "✅ Found and copied kernel modules."
            else
              echo "ℹ️ No kernel modules found, skipping."
              rm -rf tmp/modules
            fi
          fi

          # 打包 AnyKernel3 并生成刷机包
          cp -rp ./AnyKernel3/* tmp/
          cd tmp
          7za a -mx9 tmp.zip *
          cd ..

          OUT_ZIP="${{ env.DEVICE_CODENAME }}-${{ env.ROM_TEXT }}-$TIME-${{ env.PACK_METHOD }}.zip"
          cp -fp tmp/tmp.zip "${OUT_ZIP}"
          rm -rf tmp

          echo "PACK_NAME=${OUT_ZIP}" >> $GITHUB_ENV
          echo "✅ AnyKernel3 package completed: ${OUT_ZIP}"

      - name: Make Latest Boot Image
        if: env.PACK_METHOD == 'MKBOOTIMG'
        shell: bash
        run: |
          set -e
          cd "${GITHUB_WORKSPACE}/"
          TIME=$(date +"%Y%m%d%H%M%S")
          IMAGE_DIR="${GITHUB_WORKSPACE}/device_kernel/out/arch/arm64/boot"
          DEVICE_NAME="${{ env.DEVICE_NAME }}"
          DEVICE_CODENAME="${{ env.DEVICE_CODENAME }}"
          ROM_TEXT="${{ env.ROM_TEXT }}"

          # 解包 boot.img
          echo "🔧 Unpacking boot image..."
          FORMAT_MKBOOTING=$(mkboottools/unpack_bootimg.py --boot_img="boot_source_${DEVICE_NAME}.img" --format mkbootimg)
          mkboottools/unpack_bootimg.py --boot_img "boot_source_${DEVICE_NAME}.img"

          # 替换内核
          if [[ -f "${IMAGE_DIR}/Image.gz-dtb" ]]; then
            rm -f out/kernel
            cp -fp "${IMAGE_DIR}/Image.gz-dtb" out/kernel
            echo "✅ Found Image.gz-dtb !"
          elif [[ -f "${IMAGE_DIR}/Image.gz" ]]; then
            rm -f out/kernel
            cp -fp "${IMAGE_DIR}/Image.gz" out/kernel
            echo "✅ Found Image.gz !"
          elif [[ -f "${IMAGE_DIR}/Image" ]]; then
            rm -f out/kernel
            cp -fp "${IMAGE_DIR}/Image" out/kernel
            echo "✅ Found Image !"
          fi

          # DTB
          if [[ -f "${IMAGE_DIR}/dtb.img" ]]; then
            cp -fp "${IMAGE_DIR}/dtb.img" out/
            echo "✅ Found dtb.img !"
          else
            echo "ℹ️ Doesn't found dtb.img! Your device maybe needn't the file."
          fi

          # 合并 DTB
          if [ -f "${IMAGE_DIR}/dtb" ]; then
            echo "✅ Found DTB!"
            cp -fp "${IMAGE_DIR}/dtb" out/dtb
          elif [ "${{ env.GENERATE_DTB }}" == "true" ]; then
            if ls "${IMAGE_DIR}/dts/${{ env.GENERATE_CHIP }}"/*.dtb 1>/dev/null 2>&1; then
                DTB_PATH="dts"
            elif ls "${IMAGE_DIR}/dts/vendor/${{ env.GENERATE_CHIP }}"/*.dtb 1>/dev/null 2>&1; then
                DTB_PATH="dts/vendor"
            else
                echo "❌ Not found dts, abort."
                exit 1
            fi

            cat "${IMAGE_DIR}/${DTB_PATH}/${{ env.GENERATE_CHIP }}"/*.dtb > "${IMAGE_DIR}/DTB"
            cp -fp "${IMAGE_DIR}/DTB" out/dtb
            echo "✅ Generated ${{ env.GENERATE_CHIP }} DTB."
          else
            echo "ℹ️ Doesn't found DTB! Your device maybe needn't the file."
          fi

          # 重新打包 boot.img
          OUT_IMAGE="${DEVICE_CODENAME}-${ROM_TEXT}-$TIME-image.img"
          eval "mkboottools/mkbootimg.py ${FORMAT_MKBOOTING} -o ${OUT_IMAGE}"

          echo "PACK_NAME=${OUT_IMAGE}" >> $GITHUB_ENV
          rm -f "boot_source_${DEVICE_NAME}.img"
          echo "✅ Boot image completed: ${OUT_IMAGE}"
