name: Kernel Build

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PACK_METHOD: Anykernel3
  AK3_SOURCE: osm0sis
  GENERATE_DTB: false
  GENERATE_CHIP: msm
  PACK_KMODULES: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # ======================
      # 在这里粘贴你所有内核编译步骤
      # ======================

      - name: Make Anykernel3 Flasher
        if: env.PACK_METHOD == 'Anykernel3'
        shell: bash
        run: |
          ROOT="$GITHUB_WORKSPACE"
          cd "${ROOT}/device_kernel/"
          TIME=$(TZ=Asia/Shanghai date +%Y%m%d-%H%M%S)

          if [[ -d "arch/arm64/configs" ]]; then
            IMAGE_DIR="${ROOT}/device_kernel/out/arch/arm64/boot"
          else
            IMAGE_DIR="${ROOT}/device_kernel/out/arch/arm/boot"
          fi

          rm -rf tmp
          mkdir -p tmp

          if [[ "${AK3_SOURCE}" =~ "osm0sis" ]]; then
            sed -i 's/ExampleKernel by osm0sis @ xda-developers/NonGKI Kernel Build by JackAltman @ Github/g' Anykernel3/anykernel.sh
            sed -i 's/do.devicecheck=1/do.devicecheck=0/g' Anykernel3/anykernel.sh
            sed -i 's!BLOCK=/dev/block/platform/omap/omap_hsmmc.0/by-name/boot;!BLOCK=auto;!g' Anykernel3/anykernel.sh
            sed -i 's/device.name1=.*/device.name1=star/g' Anykernel3/anykernel.sh
            sed -i 's/BLOCK=auto;/BLOCK=boot;/g' Anykernel3/anykernel.sh
            sed -i 's/IS_SLOT_DEVICE=0;/IS_SLOT_DEVICE=1/g' Anykernel3/anykernel.sh
            sed -i '/fstab.tuna/d' Anykernel3/anykernel.sh
            curl -L https://raw.githubusercontent.com/zttlove/NonGKI_Kernel_Build_2nd/mainline/Patches/anykernel.sh -o Anykernel3/anykernel.sh
            chmod +x Anykernel3/anykernel.sh
            echo "Now using official Anykernel3."
          else
            echo "Now using custom Anykernel3."
          fi

          if [[ -f "$IMAGE_DIR/Image.gz-dtb" ]]; then
            cp -fp "$IMAGE_DIR/Image.gz-dtb" tmp
            echo "Found Image.gz-dtb !"
          elif [[ -f "$IMAGE_DIR/Image.gz" ]]; then
            cp -fp "$IMAGE_DIR/Image.gz" tmp
            echo "Found Image.gz !"
          elif [[ -f "$IMAGE_DIR/zImage-dtb" ]]; then
            cp -fp "$IMAGE_DIR/zImage-dtb" tmp
            echo "Found zImage-dtb (ARMV7A) !"
          elif [[ -f "$IMAGE_DIR/Image" ]]; then
            cp -fp "$IMAGE_DIR/Image" tmp
            echo "Found Image !"
          fi

          if [[ -f "$IMAGE_DIR/dtbo.img" ]]; then
            echo "Found dtbo.img !"
          else
            echo "Doesn't found dtbo.img! Your device maybe needn't the file."
          fi

          if [[ -f "$IMAGE_DIR/dtb.img" ]]; then
            cp -fp "$IMAGE_DIR/dtb.img" tmp
            echo "Found dtb.img !"
          else
            echo "Doesn't found dtb.img! Your device maybe needn't the file."
          fi

          if [ -f "$IMAGE_DIR/dtb" ]; then
            echo "Found DTB!"
            cp -fp "$IMAGE_DIR/dtb" tmp
          elif [ "${GENERATE_DTB}" == "true" ]; then
            if ls "$IMAGE_DIR/dts/${GENERATE_CHIP}"/*.dtb 1> /dev/null 2>&1; then
                DTB_PATH="dts"
            elif ls "$IMAGE_DIR/dts/vendor/${GENERATE_CHIP}"/*.dtb 1> /dev/null 2>&1; then
                DTB_PATH="dts/vendor"
            else
              echo "Not found dts, abort."
              exit 1
            fi
            cat "$IMAGE_DIR/$DTB_PATH/${GENERATE_CHIP}"/*.dtb > "$IMAGE_DIR/DTB"
            cp -fp "$IMAGE_DIR/DTB" tmp
            echo "Generated ${GENERATE_CHIP} DTB."
          else
            echo "Doesn't found DTB! Your device maybe needn't the file."
          fi

          if [ "${PACK_KMODULES}" == "true" ]; then
            echo "Packing kernel modules (.ko)..."
            mkdir -p tmp/modules/vendor/lib/modules
            find "${ROOT}/device_kernel/out/" -name "*.ko" -exec cp -fp {} tmp/modules/vendor/lib/modules/ \;
            if [ "$(ls -A tmp/modules/vendor/lib/modules/ 2>/dev/null)" ]; then
              echo "Found and copied kernel modules."
            else
              echo "No kernel modules found, skipping."
              rm -rf tmp/modules
            fi
          fi

          cp -rp ./Anykernel3/* tmp/

          API_URL="https://api.github.com/repos/cctv18/ReSukiSU_CI/releases/latest"
          TAG=$(curl -sL "$API_URL" | jq -r '.name')
          BUILD_NUM=$(echo "$TAG" | grep -oE '[0-9]+' | head -n1)
          FINAL_ZIP="AK3-5.4.247-ReSukiSU-${BUILD_NUM}-star_KPM.zip"
          ZIP_FULL="${ROOT}/${FINAL_ZIP}"

          cd tmp
          7za a -mx9 -tzip "$ZIP_FULL" ./*
          cd ..

          if [ ! -f "$ZIP_FULL" ]; then
            echo "压缩包生成失败"
            exit 1
          fi

          rm -rf tmp
          echo "PACK_NAME=$FINAL_ZIP" >> "$GITHUB_ENV"
          echo "✅ 打包完成：$FINAL_ZIP"

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v6
        with:
          name: Kernel-Package
          path: ${{ env.PACK_NAME }}
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download Artifact
        uses: actions/download-artifact@v4
        with:
          name: Kernel-Package

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: Build-${{ github.run_number }}
          name: Build-${{ github.run_number }}
          files: ./*.zip
          update_existing: false
          prerelease: false
          make_latest: true
